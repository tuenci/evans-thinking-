ot sufficient to prove that fruit is indeed in the heart and life; and let us assure ourselves, that at the day of doom men shall be judged according to their fruits. [Matt. 13, 25] It will not be said then, Did you believe? but, Were you doers, or talkers only? and accordingly shall they be judged. The end of the world is compared to our harvest; and you know men at harvest regard nothing but fruit. Not that anything can be accepted that is not of faith, but I speak this to show you how insignificant the profession of Talkative will be at that day.", "FAITH. This brings to my mind that of Moses, by which he describeth the beast that is clean. [Lev. 11:3-7; Deut. 14:6-8] He is such a one that parteth the hoof and cheweth the cud; not that parteth the hoof only, or that cheweth the cud only. The hare cheweth the cud, but yet is unclean, because he parteth not the hoof. And this truly resembleth Talkative; he cheweth the cud, he seeketh knowledge, he cheweth upon the word; but he divideth not the hoof, he parteth not with the way of sinners; but, as the hare, he retaineth the foot of a dog or bear, and therefore he is unclean.", "CHR. You have spoken, for aught I know, the true gospel sense of those texts. And I will add another thing: Paul calleth some men, yea, and those great talkers, too, sounding brass and tinkling cymbals; that is, as he expounds them in another place, things without life, giving sound. [1 Cor. 13:1-3; 14:7] Things without life, that is, without the true faith and grace of the gospel; and consequently, things that shall never be placed in the kingdom of heaven among those that are the children of life; though their sound, by their talk, be as if it were the tongue or voice of an angel."]}, {"sub_zh": "真信仰与假知识的本质区别", "sub_en": "The Distinction Between Heart-Religion and Idle Words", "zh_paras": ["基督徒说：它们的确是两回事，就像灵魂跟肉体那样不相同；因为正如肉体没有灵魂只是个空壳一样，光在嘴上说说的话语也是个空壳。宗教的精神注重于实行：1“在神我们的父面前，那清洁没有玷污的虔诚，就是看顾在患难中的孤儿寡妇，并且保守自己不沾染世俗。”<这个多话不明白这一点；他以为光凭听和讲就可以做个好基督徒；他也就这样欺骗了自己的灵魂。听只是像播种子；讲不足以证明一个人在心里和生命里已经结了果子。我们可以放心，在最后的审判那天，每个人是根据他所结的果实受审判的。那时侯，不会问你，你过去相信不相信？而要问的是，你有没有付诸行", "动，或者光是讲讲罢了？人们是根据这个情况受审的。世界末日好比我们的收割庄稼；你知道在收割的时候，人们只关心果实。这并不是说不从信心来的也能被接受，我这样讲是要为了要让你知道，多话所讲的话到那一天会显得多么没有价值。", "忠信说：这使我想起摩西曾经讲过的，怎样的野兽才算洁净。凡是蹄分两丬、倒嚼的才洁净；光是分蹄，或光是倒嚼的都不洁净。兔子倒嚼，可是不洁净，因为它不分蹄。这真像多话，他倒嚼，他追求知识；他嚼话语，可是他不分蹄。他不离开罪人的道路；他像兔子，保持着像狗或熊一样的脚，因此不洁净。", "基督徒说：就我所知，你讲出了《圣经》里这些句子的真正意义；我要补充一点：保罗把某些人，把那些很会说话的人叫做4“鸣的锣和响的钹”；他在另一个地方把他们叫做有声无气的物。没有生命的东西，也就是说，没有出自真理的真正信心和恩典的东西；因此就决不能跟有生命的一起放在天国里；尽管他们讲话的时候，他们的声音就和天使的说话的声音一样。", "忠信说：啊，我一开头就不怎么喜欢跟他作伴，现在可讨厌极了。我们有什么办法把他打发走？", "基督徒说：听我的忠告，照我的话去做，你会发现他不久也会讨厌你的，除非神感动他的心，使他改变。", "忠信说：你要我怎么做？", "基督徒说：到他那儿去，跟他认真的谈一谈关于宗教的力量；直截了当地问他（等他同意了之后，因为他一定会同意的） ，在他的内心里、家庭里或者行为中有没有它。", "于是忠信又走过去，对多话说，喂，你好吧？这会儿怎么样？", "多话说：谢谢，很好；我原以为到这会儿我们可以谈了很多话呢。", "忠信说：啊，要是你愿意的话，我们现在可以开始谈；既然你让我提问题，那我就提这样一个问题：神的救恩在人心里有什么表现？", "多话说：我看出我们要谈的是关于力量的问题。啊，这是很好的问题，我愿意回答你；我的回答简单的说来就是这样：第一，心里有了神的恩典，它就会使人大声反对罪恶。第二——", "忠信说：且慢，停住；让我们一次考虑一件事。我认为你应该说，它表现在它使灵魂痛恨罪恶。", "多话说：怎么，大声反对罪恶和痛恨罪恶有什么不同？", "忠信说：哦！有很大的区别。一个人可能为了耍弄策略而大声反对罪恶；可是，除非出于真正的厌恶，他是不会痛恨它的。我听见过很多人在讲道坛上大嚷大叫反对罪恶；可是他们在内心里、家庭里，并且在交际中都很能够忍受它。约瑟的主妇大声喊叫，好像她非常贞节似的，可是尽管这样，她很愿意1跟他私通。有些人大声疾呼地反对罪恶，就像母亲大声骂她怀里的孩子，说她是贱货，又说她是专爱闹别扭的女孩，然后又紧抱着她，吻她。", "多话说：我看你在吹毛求疵。"], "en_paras": ["FAITH. Well, I was not so fond of his company at first, but I am as sick of it now. What shall we do to be rid of him?", "CHR. Take my advice, and do as I bid you, and you shall find that he will soon be sick of your company too, except God shall touch his heart, and turn it.", "FAITH. What would you have me to do?", "CHR. Why, go to him, and enter into some serious discourse about the power of religion; and ask him plainly (when he has approved of it, for that he will) whether this thing be set up in his heart, house, or conversation.", "FAITH. Then Faithful stepped forward again, and said to Talkative, Come, what cheer? How is it now?", "TALK. Thank you, well. I thought we should have had a great deal of talk by this time.", "FAITH. Well, if you will, we will fall to it now; and since you left it with me to state the question, let it be this: How doth the saving grace of God discover itself when it is in the heart of man?", "Talkative's false discovery of a work of grace", "TALK. I perceive, then, that our talk must be about the power of things. Well, it is a very good question, and I shall be willing to answer you. And take my answer in brief, thus: First, Where the grace of God is in the heart, it causeth there a great outcry against sin. Secondly--", "FAITH. Nay, hold, let us consider of one at once. I think you should rather say, It shows itself by inclining the soul to abhor its sin.", "TALK. Why, what difference is there between crying out against, and abhorring of sin?", "FAITH. Oh, a great deal. A man may cry out against sin of policy, but he cannot abhor it, but by virtue of a godly antipathy against it. I have heard many cry out against sin in the pulpit, who yet can abide it well enough in the heart, house, and conversation. Joseph's mistress cried out with a loud voice, as if she had been very holy; but she would willingly, notwithstanding that, have committed uncleanness with him. Some cry out against sin even as the mother cries out against her child in her lap, when she calleth it slut and naughty girl, and then falls to hugging and kissing it.", "TALK. You lie at the catch, I perceive.", "FAITH. No, not I; I am only for setting things right. But what is the second thing whereby you would prove a discovery of a work of grace in the heart?", "TALK. Great knowledge of gospel mysteries.", "FAITH. This sign should have been first; but first or last, it is also false; for knowledge, great knowledge, may be obtained in the mysteries of the gospel, and yet no work of grace in the soul. [1 Cor. 13] Yea, if a man have all knowledge, he may yet be nothing, and so consequently be no child of God. When Christ said, \"Do you know all these things?\" and the disciples had answered, Yes; he addeth, \"Blessed are ye if ye do them.\" He doth not lay the blessing in the knowing of them, but in the doing of them. For there is a knowledge that is not attended with doing: He that knoweth his masters will, and doeth it not. A man may know like an angel, and yet be no Christian, therefore your sign of it is not true. Indeed, to know is a thing that pleaseth talkers and boasters, but to do is that which pleaseth God. Not that the heart can be good without knowledge; for without that, the heart is naught. There is, therefore, knowledge and knowledge. Knowledge that resteth in the bare speculation of things; and knowledge that is accompanied with the grace of faith and love; which puts a man upon doing even the will of God from the heart: the first of these will serve the talker; but without the other the true Christian is not content. \"Give me understanding, and I shall keep thy law; yea, I shall observe it with my whole heart.\" [Ps. 119:34]", "TALK. You lie at the catch again; this is not for edification.", "FAITH. Well, if you please, propound another sign how this work of grace discovereth itself where it is.", "TALK. Not I, for I see we shall not agree."]}, {"sub_zh": "当面辩驳与多话的羞愤离去", "sub_en": "Faithful Convinces Talkative and Clears the Way", "zh_paras": ["忠信说：不，我没有；我只是要把事情弄清楚罢了。不过你要用来证明恩典在心里作工的第二件事是什么？多话说：对福音里奥秘的详尽知识。忠信说：这种现象应该最先有：不过，最先也好，最后也好，这也是靠不住的；因为一个人可以从福音里的奥秘获得知识，详尽的知识，然而在他的灵魂里却没有恩典。是的，即使一个人有各种的知识，他可能算不上什么，因此也不是神的儿子。当基督说， “这一切事情你们知道吗？ ”的时候，门徒们回答说知道，于是祂加上一句， 3“你们这样做有福了。”祂不把祝福加在知道那些事的人身上，祂祝福的是把那些事付诸行动的人。因为有一种知识跟", "实践根本毫无关系的： “他知道他主人的意旨，然而并不遵照那意旨行事。 ”一个人可能像个天使，什么都知道，可是并不是个基督徒；因此，你所说的现像是靠不住的。的确，爱讲话和爱夸口的人喜欢知道；可是上神喜欢人去做。这并不是说，没有知识，心灵也可以称得上完美，因为没有它，心灵就算不了什么。因此，知识有两种——一种是基于对事物的空洞的思考的知识，一种是伴有信心和爱心的天惠的知识，这种天惠使一个人真心诚意地按神的意旨行事：前一种知识很合空谈家的胃口；可是，如果没有后一种的知识，真正的基督徒是不会满足的。 “求你赐我悟性，我便遵守你的律法，且要一心遵守。 ”", "多话说：你又在吹毛求疵了；这并没有启发作用。忠心说：那么请你再举出一个恩典作工的现象。", "多话说：我可不；因为我知道我们不会同意的。", "忠信说：啊，你既然不肯举出，能不能让我来举？", "多话说：随你的便。", "忠信说：恩典在灵魂里作工，表现在两方面，在本人方面和在旁观者方面。在本人方面是这样的：它使他悔罪，尤其会使他觉悟到自己天性的污秽，以及不信的罪恶，如果他不通过相信耶稣基督来取得神的怜悯的话，他必定会因不信而被定罪。这种看法和意识使他内心对罪恶感到痛苦和可耻；并且他发现救世主在他心里启示，而他绝对需要一辈子追随祂；这样做的时候，他发现对祂的渴慕；而这种渴慕的心等等都有希望得到满足。他会感到多么欢乐和平安，他对圣洁的喜爱程度、以及他在追求对救主认识得更清楚些和要在世上为祂服务这两件事上有多么心切，都是以他对救主的信心的强弱而定。但是虽然我说恩典在他身上会这样表现出来，可是他往往不", "知道这是恩典在作工；因为他目前的败坏和他被妄用的理智使他在这件事上有了错误的判断。因此一个有恩典在他心里作工的人需要有非常健全的判断力，才能毫无犹豫地断定这是恩典在作工。在别人方面，可以看到这样的表现：——4第一，一种试验性的对基督的信心的表白；第二，一种符合于这种表白的生活；也就是说，圣洁的生活——内心的圣洁，在家庭里的圣洁（如果他有家庭的话） ，以及处世为人的圣洁；一般说来，这使他从心底里痛恨他自己的罪，因此也就私下里痛恨着自己；这使他在家庭里防止罪恶，在世间发扬圣洁，不只是用话语，像伪善者或多嘴的人那样，而是抱着信心", "和爱心在实际行动上服从基督的权柄。现在，先生，对这一番关于恩典作工的简短叙述，以及它的表现方面，你要是有反对的意见，请发表；要是没有，请准许我向你提出第二个问题。", "多话说：不，我现在不好反对了，我只有听的份儿；所以，让我听你谈你的第二个问题吧。", "忠信说：是这样；你有没有体验到像这一篇关于恩典作工的叙述中前一部分的那种情况？你的生活和行为能不能为它作证？或者是不是你的宗教只停留在话语里或者舌头上，跟行动和实际没丝毫关系？要是你愿意回答我这个问题，那么，除了你知道神会赞同的话以外，不要多说一句，也别说任何你良心不能为你作证的话： “因为不是自我赞扬的人，而是神赞扬的人才能得到承认。 ”并且当我的行径表现我在说谎，同时我所有的邻居也都说我在说谎，而我自己却说我是这样那样的人，这是非常邪恶的。起初多话脸渐渐红了起来；后来又恢复原状，他这样回答：你现在谈到体验、良心和神；并且为", "了证明你所说的话的正确性，你诉诸神。我没有料到会有这种谈论，我也不打算回答这些问题，因为我认为我没有必要这样做，除非你自命为传道师；即使你这样做，我还可以不承认你是裁判员。不过请告诉我，你为什么问我这些问题？", "忠信说：因为我看到你挺会说话，而且我不知道你是不是除了意见以外，别的什么都没有。并且，老实告诉你，我听说你只在口头上谈谈信仰，你的行为却恰恰跟你所讲的话相反。人家说你是基督徒中的污点，而且由于你不义的行为，宗教受到损害，已经有些人因你邪恶的行为而跌倒了，更多的人因你而遭遇到沉沦的危险；你的宗教跟酒店、贪婪、不洁净、赌咒、说谎和无益的人作伴等等这些事物相结合起来。用在娼妓身上的俗语对你正适用，那就是， “她是所有女人的耻辱。 ”你也是所有教徒的耻辱。", "多话说：你既然这样随便听信人家的话，又这样轻率地下判断，我也只好断定你是个坏脾气或者性情懮郁的人，不适宜跟人交谈；因此，再会吧。", "于是基督徒走上前去跟他的兄弟说，我不是早告诉你是这么回事吗？你的话跟他的贪欲格格不入。他宁可离开你而不情愿改变他的生活。就像我刚才说的，他走了；让他去，别人没有蒙受什么损失，受到损失的是他自己。他那样做了就省得我们把他丢开；因为如果他一直坚持他的老作风（我认为他会那样的） ，他会成为我们的污辱；并且，使徒说，1“离开这种人。”", "忠信说：不过我们跟他交谈过，我倒很高兴；也许有一天他会回想起这件事来；无论如何，我对他很坦白，他如果灭亡，我是没有责任的。", "基督徒说：你跟他那样坦白地谈，是做得对。现在像这样老老实实对待人的作风实在少有，因此很多人唾弃宗教；因为他们是好说话的傻瓜，他们的信仰只在口头上，行为既放荡又虚伪，又由于他们跟正义的人常在一起，他们使世人觉得费解，他们玷污基督教，并且使诚实人痛心。我希望所有的人能像你那样对付这种人；那么他们不是会变得遵奉宗教，就是无法再跟圣洁的人耽在一起。然后忠信说：——起初多话得意洋洋！他的话多么漂亮！他自以为可以压倒一切人！可是忠信一谈到内心修行，他就像一轮圆月渐渐亏缺；唯有懂得修行的人才和他有所分别。"], "en_paras": ["FAITH. Well, if you will not, will you give me leave to do it?", "TALK. You may use your liberty.", "FAITH. A work of grace in the soul discovereth itself, either to him that hath it, or to standers by.", "To him that hath it thus: It gives him conviction of sin, especially of the defilement of his nature and the sin of unbelief, (for the sake of which he is sure to be damned, if he findeth not mercy at God's hand, by faith in Jesus Christ [John 16:8, Rom. 7:24, John 16:9, Mark 16:16]). This sight and sense of things worketh in him sorrow and shame for sin; he findeth, moreover, revealed in him the Saviour of the world, and the absolute necessity of closing with him for life, at the which he findeth hungerings and thirstings after him; to which hungerings, &c., the promise is made. [Ps. 38:18, Jer. 31:19, Gal. 2:16, Acts 4:12, Matt. 5:6, Rev. 21:6] Now, according to the strength or weakness of his faith in his Saviour, so is his joy and peace, so is his love to holiness, so are his desires to know him more, and also to serve him in this world. But though I say it discovereth itself thus unto him, yet it is but seldom that he is able to conclude that this is a work of grace; because his corruptions now, and his abused reason, make his mind to misjudge in this matter; therefore, in him that hath this work, there is required a very sound judgement before he can, with steadiness, conclude that this is a work of grace.", "To others, it is thus discovered:", "1. By an experimental confession of his faith in Christ. [Rom. 10:10, Phil. 1:27, Matt. 5:19]", "2. By a life answerable to that confession; to wit, a life of holiness, heart-holiness, family-holiness, (if he hath a family), and by conversation-holiness in the world which, in the general, teacheth him, inwardly, to abhor his sin, and himself for that, in secret; to suppress it in his family and to promote holiness in the world; not by talk only, as a hypocrite or talkative person may do, but by a practical subjection, in faith and love, to the power of the Word. [John 14:15, Ps. 50:23, Job 42:5-6, Eze. 20:43] And now, Sir, as to this brief description of the work of grace, and also the discovery of it, if you have aught to object, object; if not, then give me leave to propound to you a second question.", "TALK. Nay, my part is not now to object, but to hear; let me, therefore, have your second question.", "FAITH. It is this: Do you experience this first part of this description of it? and doth your life and conversation testify the same? or standeth your religion in word or in tongue, and not in deed and truth? Pray, if you incline to answer me in this, say no more than you know the God above will say Amen to; and also nothing but what your conscience can justify you in; for not he that commendeth himself is approved, but whom the Lord commendeth. Besides, to say I am thus and thus, when my conversation, and all my neighbours, tell me I lie, is great wickedness.", "TALK. Then Talkative at first began to blush; but, recovering himself, thus he replied: You come now to experience, to conscience, and God; and to appeal to him for justification of what is spoken. This kind of discourse I did not expect; nor am I disposed to give an answer to such questions, because I count not myself bound thereto, unless you take upon you to be a catechiser, and, though you should so do, yet I may refuse to make you my judge. But, I pray, will you tell me why you ask me such questions?", "FAITH. Because I saw you forward to talk, and because I knew not that you had aught else but notion. Besides, to tell you all the truth, I have heard of you, that you are a man whose religion lies in talk, and that your conversation gives this your mouth-profession the lie.", "Faithful's plain dealing with Talkative", "They say, you are a spot among Christians; and that religion fareth the worse for your ungodly conversation; that some have already stumbled at your wicked ways, and that more are in danger of being destroyed thereby; your religion, and an ale-house, and covetousness, and uncleanness, and swearing, and lying, and vain-company keeping, &c., will stand together. The proverb is true of you which is said of a whore, to wit, that she is a shame to all women; so are you a shame to all professors.", "TALK. Since you are ready to take up reports and to judge so rashly as you do, I cannot but conclude you are some peevish or melancholy man, not fit to be discoursed with; and so adieu.", "CHR. Then came up Christian, and said to his brother, I told you how it would happen: your words and his lusts could not agree; he had rather leave your company than reform his life. But he is gone, as I said; let him go, the loss is no man's but his own; he has saved us the trouble of going from him; for he continuing (as I suppose he will do) as he is, he would have been but a blot in our company: besides, the apostle says, \"From such withdraw thyself.\"", "FAITH. But I am glad we had this little discourse with him; it may happen that he will think of it again: however, I have dealt plainly with him, and so am clear of his blood, if he perisheth.", "CHR. You did well to talk so plainly to him as you did; there is but little of this faithful dealing with men now-a-days, and that makes religion to stink so in the nostrils of many, as it doth; for they are these talkative fools whose religion is only in word, and are debauched and vain in their conversation, that (being so much admitted into the fellowship of the godly) do puzzle the world, blemish Christianity, and grieve the sincere. I wish that all men would deal with such as you have done: then should they either be made more conformable to religion, or the company of saints would be too hot for them. Then did Faithful say,", "How Talkative at first lifts up his plumes! How bravely doth he speak! How he presumes To drive down all before him! But so soon As Faithful talks of heart-work, like the moon That's past the full, into the wane he goes. And so will all, but he that HEART-WORK knows.", "Thus they went on talking of what they had seen by the way, and so made that way easy which would otherwise, no doubt, have been tedious to them; for now they went through a wilderness.", "Now, when they were got almost quite out of this wilderness, Faithful chanced to cast his eye back, and espied one coming after them, and he knew him. Oh! said Faithful to his brother, who comes yonder? Then Christian looked, and said, It is my good friend"]}]}, {"num": 15, "id": "chapter-13", "badge_label": "CHAPTER 15", "title_zh": "第十三章 浮华市集", "title_en": "Chapter 13: Vanity Fair", "desc": "古老浮华市集的设立与其商品；朝圣者进入市集引起的轰动与被捕；受审法庭与嫉妒、迷信、马屁精的诬告。", "blocks": [{"sub_zh": "古老浮华市集的设立与其商品", "sub_en": "The Ancient Origin and Merchandise of Vanity Fair", "zh_paras": ["他们这样走着，一面谈着他们在路上所看见的事物，这样使得本来一定会显得很沉闷的旅途变得轻松；因为他们正走过一片旷野。他们快要走出旷野的时候，忠信无意中回头一看，看见一个人在后面随着他们走来，他认识那个人。忠信对他的弟兄说，哦！那儿谁来啦？于是基督徒回过头去看，说，是我的好朋友宣道师。忠信说，也是我的好朋友；因为是他指点我踏上通向那个小门的道路。这会儿，宣道师已经走到他们旁边，向他们招呼：——宣道师说：祝你们平安，亲爱的；祝你们的助手平安。", "基督徒说：欢迎，欢迎，我的好宣道师；看见了你就使我想起，你过去为了我永远的好处所施给我的仁爱以及不倦的辛劳。", "忠信说：欢迎，欢迎，一千个欢迎；哦，亲爱的宣道师，我们可怜的天路旅客有你作伴可多好啊！宣道师说：我的朋友们，自从我们最后一次分手以后，你们可好吗？你们遇到了什么？你们的行为怎样？", "于是基督徒和忠信就把他们在路上所遇到的一切事情告诉了他；也谈了他们怎样经过多少困难才到达现在这个地方。宣道师说：我非常高兴，并不是为了你们遇到考验，而是因为你们胜利了，并且尽管你们有许多弱点，你们直到今天仍旧继续在这条路上走。哎呀，这件事使我真高兴，为了我自己，也为了你们。我撒了种子，你们收割了；将来有一天1“叫撒种的和收割的一同快乐”——这是说，如果你们坚持到底； 2“若不灰心，到了时候，就要收成。”冠冕就在你们前面，而且它是不朽的；3“你们也当这样跑，好叫你们得着奖赏。”有些人争取这冠冕，已经走了很远的路，可是它却给别人拿了", "去：4“你要持守你所有的，免得人夺去你的冠冕。”你们还在魔鬼的射程之内； 5“跟罪恶挣扎，你们还没有抗拒到底。”把天国一直摆在你们前面吧，坚定地相信那些看不见的东西；别让世界上的东西逮住你们，尤其要注意你们的心灵和欲望，因为它们“非常邪恶，最靠不住。 ”下定决心；你们有天地间所有的权力做你们的后盾。", "于是基督徒因他的劝告向他道谢，并且对他说，他们希望他再多讲一些，好让他们在以后的旅途中得到那些话的帮助；因为他们知道得很清楚，他是个先知，能告诉他们可能遇到的事情，也能告诉他们应该怎样抵抗和克服它们。忠信也赞同这个请求。因此宣道师开始讲了以下的话：我的孩子们，你们听见过，用福音的真理的话语来说，你们得“经过许多苦难才能进天国；”还有，“在每一个城市里，镣铐和痛苦等候着你。”因此你们不要以为在旅途上能够长久不遇到不是这样就是那样的灾难。你们多少已经发现这些话的真实性，你们马上就要有更多的发现；因为这会儿，你们", "也知道，你们快要走完这片旷野了，因此你们不久就要走进一个市镇，再过一会儿你们就会看见它在你们眼前；在那儿你们会给敌人紧紧围住，他们会拚命要杀害你们：你们中间有一个人，或者你们两个人都得用血封住你们手里的《圣经》 ；可是你们得至死忠诚，国王才会给你生命的冠冕。那个死在那儿的人，尽管他死于非命，痛苦万状，却比他的同伴强；不但因为他最早到达天国，还因为他可以逃过他的伙伴在以后的路程上所要遭遇的许多灾难。当你们到了那市镇，发现我在这里说的话应验的时候，你们要记住你们的朋友，行动要像个大丈夫，3“把你们的灵魂交托给善良的神，就像交托给一个可靠的创造者那样。”", "这时我在梦中看见他们走出旷野，他们走了不久就看见前面有一个市镇，它名叫浮华，镇上有个市集叫做浮华市集。那个市集终年不散。它所以名叫浮华市集，是因为那市镇比浮华还要轻浮，还因为那儿买卖的东西没有一件不是浮华的。就像哲人所说的，5“所要来的都是虚空。”这市集并不是新近设立起来的，而是老早就有了的；让我把它的起源告诉你们。差不多五千年以前就有旅客像这两位忠实的人一样到天国去；魔王、魔鬼和众喽罗从旅客所走的路线看出，浮华市是他们到天国去的必经之地，他们就设法在那儿建立一个市集 ——在市集上卖的是各种各样浮华的东西，并且终年不散。因此市"], "en_paras": ["Evangelist. Ay, and my good friend too, said Faithful, for it was he that set me in the way to the gate. Now was Evangelist come up to them, and thus saluted them:", "EVAN. Peace be with you, dearly beloved; and peace be to your helpers.", "CHR. Welcome, welcome, my good Evangelist, the sight of thy countenance brings to my remembrance thy ancient kindness and unwearied labouring for my eternal good.", "FAITH. And a thousand times welcome, said good Faithful. Thy company, O sweet Evangelist, how desirable it is to us poor pilgrims!", "EVAN. Then said Evangelist, How hath it fared with you, my friends, since the time of our last parting? What have you met with, and how have you behaved yourselves?", "Then Christian and Faithful told him of all things that had happened to them in the way; and how, and with what difficulty, they had arrived at that place.", "EVAN. Right glad am I, said Evangelist, not that you have met with trials, but that you have been victors; and for that you have, notwithstanding many weaknesses, continued in the way to this very day.", "I say, right glad am I of this thing, and that for mine own sake and yours. I have sowed, and you have reaped: and the day is coming, when both he that sowed and they that reaped shall rejoice together; that is, if you hold out: \"for in due season ye shall reap, if ye faint not.\" [John 4:36, Gal. 6:9] The crown is before you, and it is an incorruptible one; so run, that you may obtain it. [1 Cor. 9:24-27] Some there be that set out for this crown, and, after they have gone far for it, another comes in, and takes it from them: hold fast, therefore, that you have; let no man take your crown. [Rev. 3:11] You are not yet out of the gun-shot of the devil; you have not resisted unto blood, striving against sin; let the kingdom be always before you, and believe steadfastly concerning things that are invisible. Let nothing that is on this side the other world get within you; and, above all, look well to your own hearts, and to the lusts thereof, \"for they are deceitful above all things, and desperately wicked\"; set your faces like a flint; you have all power in heaven and earth on your side.", "CHR. Then Christian thanked him for his exhortation; but told him, withal, that they would have him speak further to them for their help the rest of the way, and the rather, for that they well knew that he was a prophet, and could tell them of things that might happen unto them, and also how they might resist and overcome them. To which request Faithful also consented. So Evangelist began as followeth:--", "EVAN. My sons, you have heard, in the words of the truth of the gospel, that you must, through many tribulations, enter into the kingdom of heaven. And, again, that in every city bonds and afflictions abide in you; and therefore you cannot expect that you should go long on your pilgrimage without them, in some sort or other. You have found something of the truth of these testimonies upon you already, and more will immediately follow; for now, as you see, you are almost out of this wilderness, and therefore you will soon come into a town that you will by and by see before you; and in that town you will be hardly beset with enemies, who will strain hard but they will kill you; and be you sure that one or both of you must seal the testimony which you hold, with blood; but be you faithful unto death, and the King will give you a crown of life.", "He that shall die there, although his death will be unnatural, and his pain perhaps great, he will yet have the better of his fellow; not only because he will be arrived at the Celestial City soonest, but because he will escape many miseries that the other will meet with in the rest of his journey. But when you are come to the town, and shall find fulfilled what I have here related, then remember your friend, and quit yourselves like men, and commit the keeping of your souls to your God in well-doing, as unto a faithful Creator.", "Then I saw in my dream, that when they were got out of the wilderness, they presently saw a town before them, and the name of that town is Vanity; and at the town there is a fair kept, called Vanity Fair: it is kept all the year long. It beareth the name of Vanity Fair because the town where it is kept is lighter than vanity; and, also because all that is there sold, or that cometh thither, is vanity. As is the saying of the wise, \"all that cometh is vanity.\" [Eccl. 1; 2:11,17; 11:8; Isa. 11:17]", "This fair is no new-erected business, but a thing of ancient standing; I will show you the original of it.", "Almost five thousand years agone, there were pilgrims walking to the Celestial City, as these two honest persons are: and Beelzebub, Apollyon, and Legion, with their companions, perceiving by the path that the pilgrims made, that their way to the city lay through this town of Vanity, they contrived here to set up a fair; a fair wherein, should be sold all sorts of vanity, and that it should last all the year long: therefore at this fair are all such merchandise sold, as houses, lands, trades, places, honours, preferments, titles, countries, kingdoms, lusts, pleasures, and delights of all sorts, as whores, bawds, wives, husbands, children, masters, servants, lives, blood, bodies, souls, silver, gold, pearls, precious stones, and what not.", "And, moreover, at this fair there is at all times to be seen juggling cheats, games, plays, fools, apes, knaves, and rogues, and that of every kind."]}, {"sub_zh": "朝圣者进入市集引起的轰动与被捕", "sub_en": "The Pilgrims Cause a Tumult and Are Cast into the Cage", "zh_paras": ["集上卖的尽是这样的东西：房子、地皮、职业、位置、荣誉、升迁、爵位、国家、王国、欲望、快乐以及各种享受，如娼妓、鸨母、丈夫、儿女、主人、奴仆、生命、鲜血、肉体、灵魂、金银、珍珠、宝石等等。并且在市集上随时都可以看见变戏法的、骗子、斗技、赌博、小丑、仿效人的人、无赖、恶棍等无所不有。这儿还可以一钱不花地看到偷窃、谋杀、通奸、假发誓的人，令人触目惊心。就像在别的比较不重要的市集上那样，那些市集上有大小街道，它们那些独特的路名表明了它们所卖的货色；在这儿也有独特的地方、街、路（就是说，国家和王国） ，在那些地方可以很快找到这市", "集上的货物。这儿有英国街、法国街、意大利街、西班牙街、德国街，出售着各种浮华的物品。不过就像别的市集那样，有一种货物是那个市集上的主要货色，在这个市集上罗马的货物和商品特别受到推荐；只有英国和有些国家的成品在那儿不受欢迎。就像我说过的，到天国去的路必定要经过这个设有繁华市集的市镇；谁要不经过这个市镇到天国去，1就得离开这世界。基督本人在世的时候，也曾经经过这市镇往祂自己的国度去，而且正值开市的日子；不但如此，我想，就是市集的大老板魔王请祂去买浮华的东西；而且只要祂经过市镇的时候对魔王表示崇敬，他就会让祂做市集的主人；是", "的，因为祂是个这样体面的人，魔王带祂走遍所有的街，在短时间内把世界上所有的王国都给祂看，他希望，可能的话，引诱基督贬低身价来买他的浮华货品。可是祂不中意那些东西，因此一个子儿也没花就离开了那市镇。所以这是个很古老的市集，由来已久了，并且规模很大。就像我说过的，这些旅客得由这市集经过。啊，他们就这样做了；可是，哎呀，他们走进市集的时候，那儿所有的人，而且好像整个市镇，在他们四周起了骚动，这是由于下列的原因：第一，旅客们穿的衣服跟市集上出卖的任何一种都不同。因此那儿的人都注视他们：有的说他们是两个傻瓜；有的说他们是疯子；有的说他们是外地的人。", "第二，就像对他俩的服装觉得奇怪那样，他们对他们俩讲的话也同样感到奇怪；因为他们中间很少人听得懂他们俩的话。旅客们当然讲的是天国的话；可是市集里的人都是世俗的人；因此从市集这一头到那一头，他们彼此都好像对方是野蛮人。第三，使商人觉得好笑的是，这些旅客非常瞧不起那些货物，他们连看都不看一眼；要是商人向他们兜揽，他们就用手指头塞住耳朵，喊着， 1“求你叫我转眼不看虚假；”眼睛朝天看，表示他们的买卖和交易是在天上。有一个人看见他们的样子，偶然嘲笑地对他们说，你们要买什么？可是他们严肃地望着他说，我们3“买真理。”这一来人家更有理由轻视他们了，有的嘲弄，有的侮辱，有的责骂，有的叫别人殴打", "他们。最后市集上起了一阵哄闹和大骚动，甚至秩序完全混乱了。消息立刻传到市集主人那儿去，他马上跑来，派一些最可靠的朋友代表他去审讯那两个人，因为他们的市集几乎给搞得翻天覆地了。于是那两个人给带去受审讯；审问他们的人问他们，从哪儿来，往哪儿去，穿着这种稀奇古怪的衣服在那儿干什么。那两个人说，他们是旅客，在世上是寄居的，他们到自己的家乡去，也就是到天上的耶路撒冷去；而且还说他们认为市民和商人没有理由这样辱骂他们，妨碍他们行路，除非当有个人问他们要买什么时，他们说要买真理这件事可以算作一个理由。可是被派来审讯他们的人认为他们是疯子，", "狂人，不然的话就是有意来捣乱市集。因此他们把两人带去揍了一顿，还用泥土涂满他们全身，然后把他们关进一个笼子，让市集上所有的人尽情取笑。因此他们就这样在里面耽了些时候，而且成了所有人的玩弄、虐待或者报复的对象；市集的主人仍旧笑着，眼看他们所遭遇的一切。可是那两个人很耐心，1“不用咒骂来报答咒骂，而相反的用祝福来回答， ”用温和的话来报答恶毒的话语，用仁爱来报答侮辱，市集里有些比其他的人比较谨慎、比较没有偏见的人开口了，他们阻止并且责怪那些下流人那样不停地谩骂那两个人。那些人却怒冲冲地破口大骂起来，认为他们跟笼子里的人一样坏，说他们似乎是同党，应", "该同样受难。另一方回答说，据他们所看到的，那两个人温和稳重，对任何人都没有恶意；还说，在市集上有许多做买卖的人比他们所骂的人更应该给关进笼子里去，甚至应该上颈手枷。双方这样互相辱骂着（在这期间那两个人的态度始终非常明哲、沉着） ，后来竟然殴打起来，双方都受了伤。于是那两个人又给带到审判官面前，被判应负市集上最近一次骚动的责任。因此可怜他们又挨了打，给戴上脚镣、手铐，被他们用铁链牵着在市集上走来走去，藉以达到惩一戒百的目的，免得再有人起来替他们讲话，或者跟他们联合起来。可是基督徒和忠信的态度显得更得体，他们非常温顺耐心地忍受了人", "家加在他们身上的侮辱和羞耻，这使得市集上有几个人对他们有了同情（虽然跟其余的比起来，人数还是很少） 。这一来对方更加冒火了，甚至认为非把那两个人处死不可。他们威吓说，他们不再用笼子和手铐脚镣来对付他们了，为了他们顶撞并欺哄了市集上的人，他们该得死罪。"], "en_paras": ["Here are to be seen, too, and that for nothing, thefts, murders, adulteries, false swearers, and that of a blood-red colour.", "And as in other fairs of less moment, there are the several rows and streets, under their proper names, where such and such wares are vended; so here likewise you have the proper places, rows, streets, (viz. countries and kingdoms), where the wares of this fair are soonest to be found. Here is the Britain Row, the French Row, the Italian Row, the Spanish Row, the German Row, where several sorts of vanities are to be sold. But, as in other fairs, some one commodity is as the chief of all the fair, so the ware of Rome and her merchandise is greatly promoted in this fair; only our English nation, with some others, have taken a dislike thereat.", "Now, as I said, the way to the Celestial City lies just through this town where this lusty fair is kept; and he that will go to the city, and yet not go through this town, must needs go out of the world. [1 Cor. 5:10] The Prince of princes himself, when here, went through this town to his own country, and that upon a fair day too; yea, and as I think, it was Beelzebub, the chief lord of this fair, that invited him to buy of his vanities; yea, would have made him lord of the fair, would he but have done him reverence as he went through the town. [Matt. 4:8, Luke 4:5-7] Yea, because he was such a person of honour, Beelzebub had him from street to street, and showed him all the kingdoms of the world in a little time, that he might, if possible, allure the Blessed One to cheapen and buy some of his vanities; but he had no mind to the merchandise, and therefore left the town, without laying out so much as one farthing upon these vanities. This fair, therefore, is an ancient thing, of long standing, and a very great fair.", "Now these pilgrims, as I said, must needs go through this fair. Well, so they did: but, behold, even as they entered into the fair, all the people in the fair were moved, and the town itself as it were in a hubbub about them; and that for several reasons: for--", "First, The pilgrims were clothed with such kind of raiment as was diverse from the raiment of any that traded in that fair. The people, therefore, of the fair, made a great gazing upon them: some said they were fools, some they were bedlams, and some they are outlandish men. [1 Cor. 2:7-8]", "Secondly, And as they wondered at their apparel, so they did likewise at their speech; for few could understand what they said; they naturally spoke the language of Canaan, but they that kept the fair were the men of this world; so that, from one end of the fair to the other, they seemed barbarians each to the other.", "Thirdly, But that which did not a little amuse the merchandisers was, that these pilgrims set very light by all their wares; they cared not so much as to look upon them; and if they called upon them to buy, they would put their fingers in their ears, and cry, Turn away mine eyes from beholding vanity, and look upwards, signifying that their trade and traffic was in heaven. [Ps. 119:37, Phil. 3:19-20]", "One chanced mockingly, beholding the carriage of the men, to say unto them, What will ye buy? But they, looking gravely upon him, answered, \"We buy the truth.\" [Prov. 23:23] At that there was an occasion taken to despise the men the more; some mocking, some taunting, some speaking reproachfully, and some calling upon others to smite them. At last things came to a hubbub and great stir in the fair, insomuch that all order was confounded. Now was word presently brought to the great one of the fair, who quickly came down, and deputed some of his most trusty friends to take these men into examination, about whom the fair was almost overturned. So the men were brought to examination; and they that sat upon them, asked them whence they came, whither they went, and what they did there, in such an unusual garb? The men told them that they were pilgrims and strangers in the world, and that they were going to their own country, which was the heavenly Jerusalem, [Heb. 11:13-16] and that they had given no occasion to the men of the town, nor yet to the merchandisers, thus to abuse them, and to let them in their journey, except it was for that, when one asked them what they would buy, they said they would buy the truth. But they that were appointed to examine them did not believe them to be any other than bedlams and mad, or else such as came to put all things into a confusion in the fair. Therefore they took them and beat them, and besmeared them with dirt, and then put them into the cage, that they might be made a spectacle to all the men of the fair.", "Behold Vanity Fair! the Pilgrims there Are chain'd and stand beside: Even so it was our Lord pass'd here, And on Mount Calvary died.", "There, therefore, they lay for some time, and were made the objects of any man's sport, or malice, or revenge, the great one of the fair laughing still at all that befell them. But the men being patient, and not rendering railing for railing, but contrariwise, blessing, and good words for bad, and kindness for injuries done, some men in the fair that were more observing, and less prejudiced than the rest, began to check and blame the baser sort for their continual abuses done by them to the men; they, therefore, in angry manner, let fly at them again, counting them as bad as the men in the cage, and telling them that they seemed confederates, and should be made partakers of their misfortunes. The other replied that, for aught they could see, the men were quiet, and sober, and intended nobody any harm; and that there were many that traded in their fair that were more worthy to be put into the cage, yea, and pillory too, than were the men they had abused. Thus, after divers words had passed on both sides, the men behaving themselves all the while very wisely and soberly before them, they fell to some blows among themselves, and did harm one to another. Then were these two poor men brought before their examiners again, and there charged as being guilty of the late hubbub that had been in the fair. So they beat them pitifully, and hanged irons upon them, and led them in chains up and down the fair, for an example and a terror to others, lest any should speak in their behalf, or join themselves unto them. But Christian and Faithful behaved themselves yet more wisely, and received the ignominy and shame that was cast upon them, with so much meekness and patience, that it won to their side, though but few in comparison of the rest, several of the men in the fair. This put the other party yet into greater rage, insomuch that they concluded the death of these two men. Wherefore they threatened, that the cage nor irons should serve their turn, but that they should die, for the abuse they had done, and for deluding the men of the fair.", "Then were they remanded to the cage again, until further order should be taken with them. So they put them in, and made their feet fast in the stocks.", "Here, therefore, they called again to mind what they had heard from their faithful friend Evangelist, and were the more confirmed in their way and sufferings by what he told them would happen to them. They also now comforted each other, that whose lot it was to suffer, even he should have the best of it; therefore each man secretly wished that he might have that preferment: but committing themselves to the all-wise disposal of Him that ruleth all things, with much content, they abode in the condition in which they were, until they should be otherwise disposed of.", "Then a convenient time being appointed, they brought them forth to their trial, in order to their condemnation. When the time was come, they were brought before their enemies and arraigned. The judge's name was Lord Hate-good. Their indictment was one and the same in substance, though somewhat varying in form, the contents whereof were this:--", "\"That they were enemies to and disturbers of their trade; that they had made commotions and divisions in the town, and had won a party to their own most dangerous opinions, in contempt of the law of their prince.\"", "Now, FAITHFUL, play the man, speak for thy God: Fear not the wicked's malice; nor their rod: Speak boldly, man, the truth is on thy side: Die for it, and to life in triumph ride."]}, {"sub_zh": "受审法庭与嫉妒、迷信、马屁精的诬告", "sub_en": "The Trial Before Lord Hate-good & The False Witnesses", "zh_paras": ["于是他们又给押回笼子里去，等候以后的命令。人家把他们关进去，他们的脚上了足枷。因此，这时候他们又记起他们忠实的朋友宣道师的话，由于他事先告诉了他们以后所要遭遇到的事情，在苦难中他们的态度更坚定了。他们现在彼此安慰说，谁在命中注定要受难，谁的结果最好；因此两个人都暗地里希望自己能获得升迁。虽然这样，他们还是把自己交托给统管一切的全智的神，他们对自己的处境处之泰然，听天由命。", "然后，为了定这两个人的罪，他们择定一个适当的时间，把那两个人带去受审。到了那时侯，他们给带到敌人面前受审问。法官的名字是憎善。他们的诉状实质上是一样的，虽然形式上稍微有点不同；内容如下：—— “那两个人反对并且扰乱他们的买卖；他们在镇上引起骚动和纷争情事，而且蔑视他们王子的法律，竟使一批人同意他们那具有严重危害性的见解。 ”", "这时候忠信回答说，他只反对那反对至高的神的人。至于扰乱治安，我可没有，因为我是个爱好和平的人；同情我们的人是由于看到我们的诚实和无罪才同情我们的，而他们是从坏变好了。至于你们所说的国王，因为他是魔王，是神的敌人，我不承认他和他所有的仆从。", "然后法庭宣告，谁要替他们的主人 ——国王——出面反驳法庭上的犯人，请站出来作证。于是有三个证人走进来，那就是，嫉妒、迷信和马屁精。法庭上问他们认不认得这受审的犯人，以及他们为了他们的主人国王，有没有什么反对犯人的话要说。", "于是嫉妒站出来，说了这样的话：大人在上，我认识这个人很久了，我愿意在这个尊严的法庭上发誓证明他是——法官说：停住，让他宣誓。他们就给他宣誓。然后他说，法官大人，尽管这个人的名字很好听，却是我们家乡最坏的人；他既目无国王和人民，又不尊重法律和风俗，他想尽方法用他那种不忠诚的想法去影响所有的人，他一般地把那种想法叫做信心和圣洁的原则。特别是有一次我听他说过，基督教和浮华市的风俗势不两立，无法妥协。他的话，法官大人，不但谴责了所有我们那些值得赞扬的行为，同时还谴责我们那样做。", "于是法官对他说，你还有别的话说吗？嫉妒说：法官大人，我可以说的话很多呢，但是我不愿意在法庭上多噜苏。不过，如果在其他两位先生作证以后，还缺乏证据，因而不能处他死刑的话，我愿意再做补充。于是法官就请他站到旁边去。", "然后他们传呼迷信，吩咐他望着受审的犯人；他们也问他有什么反驳犯人的话要替主人说。于是他们给他宣誓；接着他开始说：——嫉妒迷信法官大人，我跟这个人不大熟识，也并不愿意跟他更熟识些。不过我知道他是个非常危险的人，这印象是从那一天跟他在城里谈话的时候得来的；因为在谈话中我听见他说，我们的信仰一钱不值，因为一个人决不能因它而取得神的喜悦。法官大人，您知道得很清楚，他那话的必然结论是什么，那就是，我们的崇拜仍旧是一场空，我们还是有罪，最终会沉沦；这就是我要说的。", "然后他们给马屁精宣誓，请他替他们的主人国王说反对犯人的话。马屁精说：法官大人，诸位先生，这个人我认识很久了，听见他说过一些不该说的话；因为他骂过我们尊严的国王魔王，还轻蔑地谈起魔王的高贵的朋友，也就是魔鬼爵士、肉欲爵士、奢华爵士、爱虚荣爵士、好色老爵士、贪婪爵士以及我们所有的贵族。他还说，如果所有的人跟他一样想法（要是可能的话） ，这些贵族中间没有一个人能在这城里待下去。并且他也不怕得罪您，大人——现在被委任做他的审判官的您，他把您叫做邪恶的恶棍，还用诸如此类的名称诽谤这城里大部分的上等人。马屁精讲完之后，法官对犯人说，你这叛徒，异教徒，卖国贼，你有没有听见这些老实人对你所"], "en_paras": ["Faithful's answer for himself", "Then Faithful began to answer, that he had only set himself against that which hath set itself against Him that is higher than the highest. And, said he, as for disturbance, I make none, being myself a man of peace; the parties that were won to us, were won by beholding our truth and innocence, and they are only turned from the worse to the better. And as to the king you talk of, since he is Beelzebub, the enemy of our Lord, I defy him and all his angels.", "Then proclamation was made, that they that had aught to say for their lord the king against the prisoner at the bar, should forthwith appear and give in their evidence. So there came in three witnesses, to wit, Envy, Superstition, and Pickthank. They were then asked if they knew the prisoner at the bar; and what they had to say for their lord the king against him.", "Then stood forth Envy, and said to this effect: My Lord, I have known this man a long time, and will attest upon my oath before this honourable bench, that he is--", "JUDGE. Hold! Give him his oath. (So they sware him.) Then he said--", "ENVY. My Lord, this man, notwithstanding his plausible name, is one of the vilest men in our country. He neither regardeth prince nor people, law nor custom; but doth all that he can to possess all men with certain of his disloyal notions, which he in the general calls principles of faith and holiness. And, in particular, I heard him once myself affirm that Christianity and the customs of our town of Vanity were diametrically opposite, and could not be reconciled. By which saying, my Lord, he doth at once not only condemn all our laudable doings, but us in the doing of them.", "JUDGE. Then did the Judge say to him, Hast thou any more to say?", "ENVY. My Lord, I could say much more, only I would not be tedious to the court. Yet, if need be, when the other gentlemen have given in their evidence, rather than anything shall be wanting that will despatch him, I will enlarge my testimony against him. So he was bid to stand by. Then they called Superstition, and bid him look upon the prisoner. They also asked, what he could say for their lord the king against him. Then they sware him; so he began.", "SUPER. My Lord, I have no great acquaintance with this man, nor do I desire to have further knowledge of him; however, this I know, that he is a very pestilent fellow, from some discourse that, the other day, I had with him in this town; for then, talking with him, I heard him say, that our religion was naught, and such by which a man could by no means please God. Which sayings of his, my Lord, your Lordship very well knows, what necessarily thence will follow, to wit, that we do still worship in vain, are yet in our sins, and finally shall be damned; and this is that which I have to say.", "Then was Pickthank sworn, and bid say what he knew, in behalf of their lord the king, against the prisoner at the bar.", "Pickthank's testimony", "PICK. My Lord, and you gentlemen all, This fellow I have known of a long time, and have heard him speak things that ought not to be spoke; for he hath railed on our noble prince Beelzebub, and hath spoken contemptibly of his honourable friends, whose names are the Lord Old Man, the Lord Carnal Delight, the Lord Luxurious, the Lord Desire of Vain Glory, my old Lord Lechery, Sir Having Greedy, with all the rest of our nobility; and he hath said, moreover, That if all men were of his mind, if possible, there is not one of these noblemen should have any longer a being in this town. Besides, he hath not been afraid to rail on you, my Lord, who are now appointed to be his judge, calling you an ungodly villain, with many other such like vilifying terms, with which he hath bespattered most of the gentry of our town.", "When this Pickthank had told his tale, the Judge directed his speech to the prisoner at the bar, saying, Thou runagate, heretic, and traitor, hast thou heard what these honest gentlemen have witnessed against thee?", "FAITH. May I speak a few words in my own defence?", "JUDGE. Sirrah! sirrah! thou deservest to live no longer, but to be slain immediately upon the place; yet, that all men may see our gentleness towards thee, let us hear what thou, vile runagate, hast to say."]}, {"sub_zh": "忠信英勇殉道与被火战车接升天界", "sub_en": "The Martyrdom of Faithful and His Chariot to Heaven", "zh_paras": ["作的见证？", "忠信说：我可以不可以说几句话替自己辩护？法官说：喂，喂，你不配再活下去了，应该即刻处死；可是为了让大家看到我们对你是仁慈的，我们就听一听你这下贱的叛徒要说的话。", "忠信说：第一，对嫉妒先生所说的话，我的回答是这样：我只说过，凡是违反神之道的规则、法律、风俗或人们跟基督教都绝不相容。要是我这话说错了，指出我的错误，我准备当着你们收回前言。至于第二点，就是关于迷信先生和他对我的控告，我只说了这样一句话：崇拜神需要一个非凡的信心。但是如果没有神意旨的神妙的启示，就不会有非凡的信心。因此，如果在崇拜中有任何不符合神妙的启示的东西，那完全是出自无益于永生的凡人的信心。马屁精第三，至于马屁精先生所说的，我说（在这里我要避免用任何名称，免得你们说我骂人等等） ，这城市的王子以及他的乌合之众，或者像这位先生所讲的，他的跟班，只配到地狱去，而不配待在这市", "镇和四郊；因此求神怜悯我！", "这时候法官对陪审员（他们始终在一旁倾听、注意着）说，陪审委员团的先生们，你们看到了在这城里引起大骚动的人；你们也听见了这些可敬的先生们对他所作的见证；你们也听见了他的回答和自白；现在你们有决定他生死的权柄；不过我认为有必要向你们解释我们的法律。在我们王子的仆人，法老大帝的时代有一条法令说，为了避免不同信仰的人数增加，力量扩大，因而于他不利，应该把他们的男子丢到河里去。他的另一个仆人尼布甲尼撒大王，在他的朝代中也立了一条法令，那就是，凡是不俯伏敬拜他的金像的人一律给扔到烈火的窑中去。在大利乌王的时代也立了一条禁令，不拘何人向王以外的任何神求什么，就必须给扔进狮子坑中。这个叛徒实质上", "违犯了这些法令，不但在思想上（那已经够叫人受不了了） ；而且在话语中和行动上，这是绝对不能容忍的。至于法老的法令，它是为了防止危害的发生而定下的，但是当时并没有什么显著的犯罪行为；可是这儿有了明显的犯罪行为。关于第二和第三，你们看到他反对我们的信仰；他既已承认这叛逆的罪行，他就该受死刑。陪审委员团委员盲目先生、无用先生、恶意先生、纵欲先生、放荡先生、任性先生、傲慢先生、敌意先生、说谎先生、残暴先生、恨光明先生和执拗先生都走了出去。他们个个都评判他有罪，后来全体一致决定在法官面前评定他有罪。起初他们在商量的时候，陪审长盲目先生说，我看得清清楚楚这个人是个邪教徒。接着无用先生说，世界上", "不需要这种人！恶意先生说，对，我看见他就讨厌。接着纵欲先生说，我决不能容忍他。放荡先生说，我也不能，因为他将来一定会老责备我的作风的。任性先生说，把他绞死，把他绞死！傲慢先生说，一个可怜的平凡无用的东西。敌意先生说，我从心底里讨厌他。说谎先生说，他是个无赖。残暴先生说，绞刑还便宜了他。恨光明先生说，我们赶快把他处决了吧。接着执拗先生说，即使拿全世界给我，我也不能跟他妥协，我们立刻判他死罪吧。他们就这样做了；因此他不久被判了罪，庭上吩咐把他从法庭带回到他原来的地方去，在那儿受可能想象得到的最残酷的死亡。因此他们带他出来，按照他们的法律处治他；首先他们鞭打他，然后他们拳击他，接着他们用刀", "刺他；以后又用石头掷他，再用剑刺他；最后他们在火刑柱上把他烧成灰烬。忠信就这样死去。这会儿我看见在群众后面有一辆马车和两匹马等着忠信，他的敌人一把他弄死，他就进了那辆马车，立刻给带到云端，还有号筒的声音，这是到天门去的最近的路径。至于基督徒，他得到缓刑的处理，又给带到监牢去，他在那儿又待了一个时期。可是统管一切、掌握所有力量的神使基督徒那一次逃出来，继续他的旅行。他一面走，一面唱着：——啊，忠信，你忠实地向你的主表明，你会有跟他在一起的福运，而不忠实的人，尽管有他们虚枉的欢乐，现在却在地狱的苦境中悲哭。歌唱吧，忠信，引吭高歌吧，让你的名字永不衰败，因为，虽然他", "们杀死你，你仍旧健在。陪审团成员"], "en_paras": ["Faithful's defence of himself", "FAITH. 1. I say, then, in answer to what Mr. Envy hath spoken, I never said aught but this, That what rule, or laws, or customs, or people, were flat against the Word of God, are diametrically opposite to Christianity. If I have said amiss in this, convince me of my error, and I am ready here before you to make my recantation.", "2. As to the second, to wit, Mr. Superstition, and his charge against me, I said only this, That in the worship of God there is required a Divine faith; but there can be no Divine faith without a Divine revelation of the will of God. Therefore, whatever is thrust into the worship of God that is not agreeable to Divine revelation, cannot be done but by a human faith, which faith will not be profitable to eternal life.", "3. As to what Mr. Pickthank hath said, I say (avoiding terms, as that I am said to rail, and the like) that the prince of this town, with all the rabblement, his attendants, by this gentleman named, are more fit for a being in hell, than in this town and country: and so, the Lord have mercy upon me!", "Then the Judge called to the jury (who all this while stood by, to hear and observe): Gentlemen of the jury, you see this man about whom so great an uproar hath been made in this town. You have also heard what these worthy gentlemen have witnessed against him. Also you have heard his reply and confession. It lieth now in your breasts to hang him or save his life; but yet I think meet to instruct you into our law.", "There was an Act made in the days of Pharaoh the Great, servant to our prince, that lest those of a contrary religion should multiply and grow too strong for him, their males should be thrown into the river. [Exo. 1:22] There was also an Act made in the days of Nebuchadnezzar the Great, another of his servants, that whosoever would not fall down and worship his golden image, should be thrown into a fiery furnace. [Dan. 3:6] There was also an Act made in the days of Darius, that whoso, for some time, called upon any god but him, should be cast into the lions' den. [Dan. 6] Now the substance of these laws this rebel has broken, not only in thought, (which is not to be borne), but also in word and deed; which must therefore needs be intolerable.", "For that of Pharaoh, his law was made upon a supposition, to prevent mischief, no crime being yet apparent; but here is a crime apparent. For the second and third, you see he disputeth against our religion; and for the treason he hath confessed, he deserveth to die the death.", "Then went the jury out, whose names were, Mr. Blind-man, Mr. No-good, Mr. Malice, Mr. Love-lust, Mr. Live-loose, Mr. Heady, Mr. High-mind, Mr. Enmity, Mr. Liar, Mr. Cruelty, Mr. Hate-light, and Mr. Implacable; who every one gave in his private verdict against him among themselves, and afterwards unanimously concluded to bring him in guilty before the Judge. And first, among themselves, Mr. Blind-man, the foreman, said, I see clearly that this man is a heretic. Then said Mr. No-good, Away with such a fellow from the earth. Ay, said Mr. Malice, for I hate the very looks of him. Then said Mr. Love-lust, I could never endure him. Nor I, said Mr. Live-loose, for he would always be condemning my way. Hang him, hang him, said Mr. Heady. A sorry scrub, said Mr. High-mind. My heart riseth against him, said Mr. Enmity. He is a rogue, said Mr. Liar. Hanging is too good for him, said Mr. Cruelty. Let us despatch him out of the way, said Mr. Hate-light. Then said Mr. Implacable, Might I have all the world given me, I could not be reconciled to him; therefore, let us forthwith bring him in guilty of death. And so they did; therefore he was presently condemned to be had from the place where he was, to the place from whence he came, and there to be put to the most cruel death that could be invented.", "They therefore brought him out, to do with him according to their law; and, first, they scourged him, then they buffeted him, then they lanced his flesh with knives; after that, they stoned him with stones, then pricked him with their swords; and, last of all, they burned him to ashes at the stake. Thus came Faithful to his end.", "Now I saw that there stood behind the multitude a chariot and a couple of horses, waiting for Faithful, who (so soon as his adversaries had despatched him) was taken up into it, and straightway was carried up through the clouds, with sound of trumpet, the nearest way to the Celestial Gate.", "Brave FAITHFUL, bravely done in word and deed; Judge, witnesses, and jury have, instead Of overcoming thee, but shown their rage: When they are dead, thou'lt live from age to age*.", "*In the New Heaven and New Earth. {footnote from one edition}", "But as for Christian, he had some respite, and was remanded back to prison. So he there remained for a space; but He that overrules all things, having the power of their rage in his own hand, so wrought it about, that Christian for that time escaped them, and went his way. And as he went, he sang, saying--", "Well, Faithful, thou hast faithfully profest Unto thy Lord; with whom thou shalt be blest, When faithless ones, with all their vain delights, Are crying out under their hellish plights: Sing, Faithful, sing, and let thy name survive; For though they kill'd thee, thou art yet alive!", "Now I saw in my dream, that"]}]}, {"num": 16, "id": "chapter-14", "badge_label": "CHAPTER 16", "title_zh": "第十四章 基督徒和盼望", "title_en": "Chapter 14: Christian and Hopeful", "desc": "盼望结伴同行与偶遇自私先生；揭露自私一党的权谋机巧；底马的银矿诱惑与罗得妻子的盐柱鉴戒。", "blocks": [{"sub_zh": "盼望结伴同行与偶遇自私先生", "sub_en": "Hopeful Joins Christian & Discourse with By-ends of Fair-speech", "zh_paras": ["这会儿我在梦中看见基督徒不是单独走着；因为有一个叫做盼望（由于看到基督徒和忠信在市集上受苦难时的话语和行动而有了盼望） ，他接近了他，跟他结为盟兄弟，说要做他的伴侣。这样，一个人为了替真理作见证而死去，另一个人从他的灰烬里起来做基督徒旅途中的伴侣。盼望对基督徒说，市集里有许多人慢慢地都会跟着来的。", "于是我看到他们从市集走出来以后，不久就追上一个在他们前面走的、叫做私心的人；他们问他，先生，你是哪儿人？往哪儿去？他告诉他们，他从花言巧语市来，往天国去，可是不肯说出自己的姓名。", "基督徒说：从花言巧语市来！住在那儿的有好人吗？私心说：有，我希望有。", "基督徒说：先生，请告诉我你的尊姓大名。私心说：我们彼此都不认识；要是你也走这条路，我很高兴做你的伴侣，不然的话，我也只好满足。", "基督徒说：我听说过花言巧语市；据我所记得，他们说那个地方很富有。私心说：是的，我可以向你保证是这样情形；在那儿我有很多有钱的亲戚。", "基督徒说：恕我冒昧，请告诉我哪些人是你的亲戚。私心说：几乎全城的人都是我的亲戚；尤其是我的激进主义爵士，我的随波逐流爵士，我的花言巧语爵士，这城市的名字就是从他的祖先来的；还有圆滑先生，两面派先生，无所谓先生；我们教区牧师骗人先生是我的舅舅；老实说，我已经成为上流绅士；可是我的曾祖父不过是个船夫，一边张望，一边划船，我也是从同样的职业获得大部分的财产。", "基督徒问：你结了婚没有？私心说：结了，我的妻子是个非常贤慧的女人，是个贤淑女人的女儿；她是做作夫人的女儿，因此出身名门，她受到的教养非常高超，她知道怎样在任何人面前占上风，不论是王子或农民。我们在信仰方面的确跟那些比较严格的人多少有些不同，不过那也只是在两个枝节上：第一，我们从不反抗潮流。第二，当宗教盛行的时候，我们总是非常热诚；要是天气晴朗，而且人家都称赞他，我们就很喜欢跟他一起在街上走。接着，基督徒走到旁边跟他的同伴盼望说，我想起来了，这个人是花言巧语的私心；如果真是他的话，那我们可有了住在这一带的真正的恶棍做我们的伴侣啦。于是盼望说，问他好啦，我想他不至", "于对自己的名字感到可耻。因此基督徒又走到私心跟前说，先生，听你讲话，好像你比全世界的人知道得都多；如果我没有看错的话，我想我大概猜到你是谁了。你岂不是花言巧语的私心先生吗？私心说：那不是我的名字，那是一些跟我合不来的人给我的绰号；我只好平心静气地忍受这个耻辱，就像在我之先别的好人也曾经做过的那样。", "基督徒与盼望", "基督徒问：不过，你从来没有理由让人家叫你这个名字吗？私心说：没有，从来没有！他们之所以有理由给我这个名字，充其量也不过是因为我总是及时地投入到时代的潮流中去，不管它是怎么样的潮流；而且我运气很好，总是没有错；如果我因此得到了各种名声，我认为那倒是福气；所以人们别恶意地责备我吧。", "基督徒说：我的确认为你是我所听说过的那个人；坦白告诉你，我倒觉得这名字用在你身上很恰当，也许你不愿意我们认为是这么恰当吧。私心说：啊，你要这样想，我也没有办法；假如你还让我做你的朋友的话，你会发现我是个好伴侣的。"], "en_paras": ["Christian went not forth alone, for there was one whose name was Hopeful (being made so by the beholding of Christian and Faithful in their words and behaviour, in their sufferings at the fair), who joined himself unto him, and, entering into a brotherly covenant, told him that he would be his companion. Thus, one died to bear testimony to the truth, and another rises out of his ashes, to be a companion with Christian in his pilgrimage. This Hopeful also told Christian, that there were many more of the men in the fair, that would take their time and follow after.", "So I saw that quickly after they were got out of the fair, they overtook one that was going before them, whose name was By-ends: so they said to him, What countryman, Sir? and how far go you this way? He told them that he came from the town of Fair-speech, and he was going to the Celestial City (but told them not his name).", "From Fair-speech! said Christian. Is there any good that lives there? [Prov. 26:25]", "BY-ENDS. Yes, said By-ends, I hope.", "CHR. Pray, Sir, what may I call you? said Christian.", "BY-ENDS. I am a stranger to you, and you to me: if you be going this way, I shall be glad of your company; if not, I must be content.", "CHR. This town of Fair-speech, said Christian, I have heard of; and, as I remember, they say it is a wealthy place.", "BY-ENDS. Yes, I will assure you that it is; and I have very many rich kindred there.", "CHR. Pray, who are your kindred there? if a man may be so bold.", "BY-ENDS. Almost the whole town; and in particular, my Lord Turn-about, my Lord Time-server, my Lord Fair-speech, (from whose ancestors that town first took its name), also Mr. Smooth-man, Mr. Facing-both-ways, Mr. Any-thing; and the parson of our parish, Mr. Two-tongues, was my mother's own brother by father's side; and to tell you the truth, I am become a gentleman of good quality, yet my great-grandfather was but a waterman, looking one way and rowing another, and I got most of my estate by the same occupation.", "CHR. Are you a married man?", "BY-ENDS. Yes, and my wife is a very virtuous woman, the daughter of a virtuous woman; she was my Lady Feigning's daughter, therefore she came of a very honourable family, and is arrived to such a pitch of breeding, that she knows how to carry it to all, even to prince and peasant. It is true we somewhat differ in religion from those of the stricter sort, yet but in two small points: first, we never strive against wind and tide; secondly, we are always most zealous when religion goes in his silver slippers; we love much to walk with him in the street, if the sun shines, and the people applaud him.", "Then Christian stepped a little aside to his fellow, Hopeful, saying, It runs in my mind that this is one By-ends of Fair-speech; and if it be he, we have as very a knave in our company as dwelleth in all these parts. Then said Hopeful, Ask him; methinks he should not be ashamed of his name. So Christian came up with him again, and said, Sir, you talk as if you knew something more than all the world doth; and if I take not my mark amiss, I deem I have half a guess of you: Is not your name Mr. By-ends, of Fair-speech?", "BY-ENDS. This is not my name, but indeed it is a nick-name that is given me by some that cannot abide me: and I must be content to bear it as a reproach, as other good men have borne theirs before me.", "CHR. But did you never give an occasion to men to call you by this name?", "BY-ENDS. Never, never! The worst that ever I did to give them an occasion to give me this name was, that I had always the luck to jump in my judgment with the present way of the times, whatever it was, and my chance was to get thereby; but if things are thus cast upon me, let me count them a blessing; but let not the malicious load me therefore with reproach.", "CHR. I thought, indeed, that you were the man that I heard of; and to tell you what I think, I fear this name belongs to you more properly than you are willing we should think it doth.", "BY-ENDS. Well, if you will thus imagine, I cannot help it; you shall find me a fair company-keeper, if you will still admit me your associate.", "CHR. If you will go with us, you must go against wind and tide; the which, I perceive, is against your opinion; you must also own religion in his rags, as well as when in his silver slippers; and stand by him, too, when bound in irons, as well as when he walketh the streets with applause.", "BY-ENDS. You must not impose, nor lord it over my faith; leave me to my liberty, and let me go with you.", "CHR. Not a step further, unless you will do in what I propound as we.", "Then said By-ends, I shall never desert my old principles, since they are harmless and profitable. If I may not go with you, I must do as I did before you overtook me, even go by myself, until some overtake me that will be glad of my company.", "Now I saw in my dream that Christian and Hopeful forsook him, and kept their distance before him; but one of them looking back, saw three men following Mr. By-ends, and behold, as they came up with him, he made them a very low conge {conge'}; and they also gave him a compliment. The men's names were Mr. Hold-the-world, Mr. Money-love, and Mr. Save-all; men that Mr. By-ends had formerly been acquainted with; for in their minority they were schoolfellows, and were taught by one Mr. Gripe-man, a schoolmaster in Love-gain, which is a market town in the county of Coveting, in the north. This schoolmaster taught them the art of getting, either by violence, cozenage, flattery, lying, or by putting on the guise of religion; and these four gentlemen had attained much of the art of their master, so that they could each of them have kept such a school themselves.", "Well, when they had, as I said, thus saluted each other, Mr. Money-love said to Mr. By-ends, Who are they upon the road before us? (for Christian and Hopeful were yet within view).", "By-ends' character of the pilgrims", "BY-ENDS. They are a couple of far countrymen, that, after their mode, are going on pilgrimage."]}, {"sub_zh": "揭露自私一党的权谋机巧", "sub_en": "Unmasking the Worldly Craft of Money-love and Save-all", "zh_paras": ["基督徒说：你要是跟我们同路，那你就得反抗潮流；可是我看得出你不肯这样做。你还得承认宗教，不管他是衣衫褴褛还是大出风头的时候；不论他戴上脚镣手铐，或者在街上到处受人称赞的时候，你都得支持他。私心说：你不得干涉我的信仰；我有我的自由，让我跟你一起走。", "基督徒说：再同走一步都不行，除非你照我建议的那样做。私心说：我决不能放弃我原有的原则，因为那是无害而有益的。如果我不能跟你一起走，我就得像在你没有追上我的时候那样——单独地走，直到有人追上我而愿意跟我作伴。这会儿我在梦中看见基督徒和盼望丢开了他，在他前面保持着一段距离行走；可是他们当中有一个回头去看，看见私心后面还有三个人；而且他们赶上私心的时候，私心向他们鞠了个九十度的躬，他们也向他还礼。他们的名字是：恋世先生，爱钱先生，吝啬先生。私心先生从前就认识他们；因为他们小时候是同学，他们的校长是求利城的支配人先生，那是北方贪财州的一个市镇。这位校长传授他们搜刮的技术，不论是利用强力、欺骗、谄", "媚、谎话或者披上宗教外衣的手段，他全都教给他们。这位校长的技术大部分都传给这四位先生，因此他们每个人都有能力办这样一所学校了。他们，像我说过的，互相招呼了之后，爱钱先生问私心先生，在我们前面走的是谁？因为他们还看得见", "基督徒和盼望。私心说：他们是两位远乡的人，用自己的方式奔走这条天路。爱钱说：哎呀！他们为什么不停下来，那样我们就可以有很好的伴侣。因为我想他们，我们，还有你，先生，都在走天路。私心说：我们的确是；但是前面那些人可真严格，思想又顽固得不得了，并且非常不尊重别人的意见，不管一个人多么好，只要跟他们不完全一致，他们就拒不为伍。吝啬说：这可不行；我们看到有些人过分正直；这种人的严峻使他们专爱判断人，责人严而责己宽。不过，请告诉我，你跟他们不同的意见在哪方面，有几点？私心说：他们顽固地断定，不论什么天气他们都得拼命赶路，而我是要看风势。他们轻而易举地", "愿意为神冒一切危险；而我要利用一切机会保住我的生命和财产。他们要坚持己见，尽管所有的人都反对他们；而我只在时势和我的安全跟信仰不发生冲突的时候才赞成它。他们支持宗教，即使他衣衫褴褛、受人蔑视；而我只在他衣冠楚楚、在风和日暖受人喝采的时候才拥护他。私心遇见他的同学恋世先生、爱钱先生和吝啬先生。恋世说：啊，等一等，好私心先生；至于我，我只能认为他是个傻瓜，他有自由保住他所有的，却那么傻，竟把它丢掉。让我们像蛇一样狡猾，乘机行事是上策。你看蜜蜂在冬天怎样伏着不动，只在它能得到好处和娱乐的时候，才出动。神有时赐雨水，有时赐阳光；若是他们这种傻瓜要在雨里走", "路，我们就在晴天走走算了吧。至于我，我最喜欢那种会保住神赐给我们的好东西的宗教；因为哪一个有理智的人会以为，既然神赐给我们今生的好东西，祂会不让我们为了祂保住它们？亚伯拉罕和所罗门在信仰中发了财；约伯说，一个好人“得鄙弃珠宝如尘土。 ”不过他一定不像我们前面那两个人那样，要是他们正如你所说的那样。吝啬说：我想我们在这一点上是完全同意的，因此没有多讲的必要了。爱钱说：的确对这事没有多谈的必要；因为一个既不相信《圣经》又不相信理智的人（你知道这两样在我们这一边都兼有了） ，就不知道自己有什么权利，也不替自己的安全着想。", "私心说：弟兄们，你们都知道，我们是走天路的；为了避开不好的事情来做更好的消遣，请准许我向你们提出一个问题：——假定一个人，一个牧师，或者一个商人，或者其他什么人，有机会得到世上的好东西，可是，如果他在某些信仰问题上不曾具有极大的热诚，他是无论如何得不到那些东西的 ——，至少他得在外表上对这种过去他从不接触的问题具有极大的热诚；那么，他是不是可以为了要达到他的目的，利用这个方法，同时又仍旧是个正直忠实的人呢？爱钱说：我看出你这问题的真谛；如果这几位先生允许的话，我就试作答复。首先，拿这问题对一个牧师来说。假定一个牧师 ——一个可敬的人，只有很菲薄的圣俸，而在他的心目中却有一个好得", "多、圣俸大得多的差事；他现在有机会取得它，只要他更努力、更经常、更热诚地传道，而且为了迎合人家的脾胃，只要他变更一下他的某些原则；在我看来，我可看不出一个人为什么不能这样做（只要他有理由） ，而且做更多的事情，同时仍旧是个忠实的人。因为：——1. 他对一个较优厚的圣俸的渴望是合法的（这是无可否认的） ，因为这是上天的意思把它放在他面前的；因此他可以设法得到它，不必顾到良心的问题。2. 况且，由于他对那圣俸的向往，他可以成为更努力、更热诚的讲道师或者什么的，因而使他变成一个更好的人，是的，这会使他的学问进步；这是合乎神的意旨的。", "3. 至于他为了迎合人们的脾胃，为了为他们效劳而放弃某些原则，这说明：（1）他的性情是不自私的；（2）他的态度是温和、讨人喜欢的；（3）因此他更适合于他的牧师职位。4. 因此我断定，对一个从圣俸低微的职位转到圣俸较高的职位的牧师，我们不该由于他这样做就认为他是贪财；既然他在才能和勤劳方面因而都有了进步，我们应该认为他是一个执行天职并且乐意利用行善机会的人。现在谈到问题的第二部分，也就是关于你所提到的商人的问题。假定这样一个人的生意很清淡，可是只要采取虔诚的态度，他就可以扩大买卖，或者找一个有钱的妻子，或者招揽更多更好的顾客。", "我呢，我可看不出他有什么理由不能这样做。因为：——1. 虔诚是个美德，不管一个人用什么方法使自己变得虔诚。2. 娶个有钱的妻子，或者招揽更多的顾客到店里来并不是什么不正当的事。3. 况且一个人由于虔诚而取得这些，他得到的是好的，由于他自己变好，他取得的也是来自好人；因此他有好妻子、好顾客和好利润，而他之所以得到这些东西是由于他变虔诚了，这也是好的；所以为了要得到这些东西而变得虔诚是又好又有利的企图。大家都非常赞成爱钱先生对私心先生提出的问题所作的答复；他们的结论是：大体说来，这是非常有益、有利的事。他们认为没有人能反驳他们这番话，同时又由于基督徒和盼望还离他们不远，他", "们全体同意，一起追上那两个人，就向他们提出这个问题；特别是因为那两个人曾经反对过私心先生。于是他们就呼唤他们俩，那两个人停下来，站着等他们走过来；可是他们一面走一面商谈，他们决定不让私心先生而让恋世先生向那两个人提出问题；因为他们认为，那两个人对他的答复不会带有刚才私心先生跟他们分手时所引起的怒火的余烬。"], "en_paras": ["MONEY-LOVE. Alas! Why did they not stay, that we might have had their good company? for they, and we, and you, Sir, I hope, are all going on pilgrimage.", "BY-ENDS. We are so, indeed; but the men before us are so rigid, and love so much their own notions, and do also so lightly esteem the opinions of others, that let a man be never so godly, yet if he jumps not with them in all things, they thrust him quite out of their company.", "SAVE-ALL. That is bad, but we read of some that are righteous overmuch; and such men's rigidness prevails with them to judge and condemn all but themselves. But, I pray, what, and how many, were the things wherein you differed?", "BY-ENDS. Why, they, after their headstrong manner, conclude that it is duty to rush on their journey all weathers; and I am for waiting for wind and tide. They are for hazarding all for God at a clap; and I am for taking all advantages to secure my life and estate. They are for holding their notions, though all other men are against them; but I am for religion in what, and so far as the times, and my safety, will bear it. They are for religion when in rags and contempt; but I am for him when he walks in his golden slippers, in the sunshine, and with applause.", "HOLD-THE-WORLD. Ay, and hold you there still, good Mr. By-ends; for, for my part, I can count him but a fool, that, having the liberty to keep what he has, shall be so unwise as to lose it. Let us be wise as serpents; it is best to make hay when the sun shines; you see how the bee lieth still all winter, and bestirs her only when she can have profit with pleasure. God sends sometimes rain, and sometimes sunshine; if they be such fools to go through the first, yet let us be content to take fair weather along with us. For my part, I like that religion best that will stand with the security of God's good blessings unto us; for who can imagine, that is ruled by his reason, since God has bestowed upon us the good things of this life, but that he would have us keep them for his sake? Abraham and Solomon grew rich in religion. And Job says, that a good man shall lay up gold as dust. But he must not be such as the men before us, if they be as you have described them.", "SAVE-ALL. I think that we are all agreed in this matter, and therefore there needs no more words about it.", "MONEY-LOVE. No, there needs no more words about this matter, indeed; for he that believes neither Scripture nor reason (and you see we have both on our side) neither knows his own liberty, nor seeks his own safety.", "BY-ENDS. My brethren, we are, as you see, going all on pilgrimage; and, for our better diversion from things that are bad, give me leave to propound unto you this question:--", "Suppose a man, a minister, or a tradesman, &c., should have an advantage lie before him, to get the good blessings of this life, yet so as that he can by no means come by them except, in appearance at least, he becomes extraordinarily zealous in some points of religion that he meddled not with before, may he not use these means to attain his end, and yet be a right honest man?", "MONEY-LOVE. I see the bottom of your question; and, with these gentlemen's good leave, I will endeavour to shape you an answer. And first, to speak to your question as it concerns a minister himself: Suppose a minister, a worthy man, possessed but of a very small benefice, and has in his eye a greater, more fat, and plump by far; he has also now an opportunity of getting of it, yet so as by being more studious, by preaching more frequently and zealously, and, because the temper of the people requires it, by altering of some of his principles; for my part, I see no reason but a man may do this, (provided he has a call), ay, and more a great deal besides, and yet be an honest man. For why--", "1. His desire of a greater benefice is lawful, (this cannot be contradicted), since it is set before him by Providence; so then, he may get it, if he can, making no question for conscience' sake.", "2. Besides, his desire after that benefice makes him more studious, a more zealous preacher, &c., and so makes him a better man; yea, makes him better improve his parts, which is according to the mind of God.", "3. Now, as for his complying with the temper of his people, by dissenting, to serve them, some of his principles, this argueth, (1) That he is of a self-denying, temper; (2) Of a sweet and winning deportment; and so (3) more fit for the ministerial function.", "4. I conclude, then, that a minister that changes a small for a great, should not, for so doing, be judged as covetous; but rather, since he has improved in his parts and industry thereby, be counted as one that pursues his call, and the opportunity put into his hands to do good.", "And now to the second part of the question, which concerns the tradesman you mentioned. Suppose such a one to have but a poor employ in the world, but by becoming religious, he may mend his market, perhaps get a rich wife, or more and far better customers to his shop; for my part, I see no reason but that this may be lawfully done. For why--", "1. To become religious is a virtue, by what means soever a man becomes so.", "2. Nor is it unlawful to get a rich wife, or more custom to my shop.", "3. Besides, the man that gets these by becoming religious, gets that which is good, of them that are good, by becoming good himself; so then here is a good wife, and good customers, and good gain, and all these by becoming religious, which is good; therefore, to become religious, to get all these, is a good and profitable design.", "This answer, thus made by this Mr. Money-love to Mr. By-ends's question, was highly applauded by them all; wherefore they concluded upon the whole, that it was most wholesome and advantageous. And because, as they thought, no man was able to contradict it, and because Christian and Hopeful were yet within call, they jointly agreed to assault them with the question as soon as they overtook them; and the rather because they had opposed Mr. By-ends before. So they called after them, and they stopped, and stood still till they came up to them; but they concluded, as they went, that not Mr. By-ends, but old Mr. Hold-the-world, should propound the question to them, because, as they supposed, their answer to him would be without the remainder of that heat that was kindled betwixt Mr. By-ends and them, at their parting a little before.", "So they came up to each other, and after a short salutation, Mr. Hold-the-world propounded the question to Christian and his fellow, and bid them to answer it if they could.", "CHR. Then said Christian, Even a babe in religion may answer ten thousand such questions. For if it be unlawful to follow Christ for loaves, (as it is in the sixth of John), how much more abominable is it to make of him and religion a stalking-horse to get and enjoy the world! Nor do we find any other than heathens, hypocrites, devils, and witches, that are of this opinion.", "1. Heathens; for when Hamor and Shechem had a mind to the daughter and cattle of Jacob, and saw that there was no way for them to come at them, but by becoming circumcised, they say to their companions, If every male of us be circumcised, as they are circumcised, shall not their cattle, and their substance, and every beast of theirs, be ours? Their daughter and their cattle were that which they sought to obtain, and their religion the stalking-horse they made use of to come at them. Read the whole story. [Gen. 34:20-23]", "2. The hypocritical Pharisees were also of this religion; long prayers were their pretence, but to get widows' houses was their intent; and greater damnation was from God their judgment. [Luke 20:46-47]", "3. Judas the devil was also of this religion; he was religious for the bag, that he might be possessed of what was therein; but he was lost, cast away, and the very son of perdition.", "4. Simon the witch was of this religion too; for he would have had the Holy Ghost, that he might have got money therewith; and his sentence from Peter's mouth was according. [Acts 8:19-22]", "5. Neither will it out of my mind, but that that man that takes up religion for the world, will throw away religion for the world; for so surely as Judas resigned the world in becoming religious, so surely did he also sell religion and his Master for the same. To answer the question, therefore, affirmatively, as I perceive you have done, and to accept of, as authentic, such answer, is both heathenish, hypocritical, and devilish; and your reward will be according to your works. Then they stood staring one upon another, but had not wherewith to answer Christian. Hopeful also approved of the soundness of Christian's answer; so there was a great silence among them. Mr. By-ends and his company also staggered and kept behind, that Christian and Hopeful might outgo them. Then said Christian to his fellow, If these men cannot stand before the sentence of men, what will they do with the sentence of God? And if they are mute when dealt with by vessels of clay, what will they do when they shall be rebuked by the flames of a devouring fire?"]}, {"sub_zh": "底马的银矿诱惑与罗得妻子的盐柱鉴戒", "sub_en": "Demas at the Hill Lucre & The Pillar of Salt as Warning", "zh_paras": ["于是他们走上去，双方互相打了招呼之后，恋世先生向基督徒和他的伙伴提出那问题，请他们回答。接着基督徒说，即使一个初信的人也能回答一万个这种问题。如果为了面包而追随基督已经是不对的，那么利用祂和宗教作为取得世间物质享受的口实，更是多么可鄙！我们发现只有异教徒、伪善者、魔鬼和女巫才有这种想法。1. 异教徒：因为当哈抹和示剑垂涎雅各的女儿和牲畜，而且知道除了受割礼以外没有其他的办法可以把她和牲畜弄到手的时候，他们就对他们的同伴说， “假使我们中间所有的男丁，都要受割礼，和他们一样，那么，他们的群畜、货财和一切的牲口岂不都归我们了吗？”他们所想得到的是他们的女", "儿和牲畜，而宗教是他们用来达到目的的借口。请看整个故事。", "盼望说：我可以向你保证，当私心来到这儿的时候，如果他也像我们这样被邀请，他准会上那儿去看的。", "基督徒说：毫无疑问，因为凭他的原则，他会走过去看的，而且他十有八九会死在那儿。接着底马又喊他们说：你们不要过来看看吗？", "于是基督徒直截了当地回答说：底马，你是反对这条路的主人的正确道路的，并且为了离开正路已经被他的法官定了罪；为什么你也要我们同样地被定罪？况且，我们一离开正路，我们的主 ——国王，一定就会知道，他会当场叫我们感到羞惭，而我们会在他面前无地容身。底马又喊道，他也是他们同一个团体里的人；要是他们肯逗留一会儿，他也会跟他们一起走的。接着基督徒问，你叫什么名字？是不是就是我刚才喊你的那个名字。底马说：是，我的名字是底马；我是亚伯拉罕的子孙。", "基督徒说：我知道你的底细；基哈西是你的曾祖父，犹大是你的父亲，而且你步了他们的后尘。你耍的只是邪恶的鬼把戏：你的父亲因为做叛徒被绞死，你也不配有更好的报应。你可以放心，我们见到国王的时候，会把你的行为告诉他。说罢，他们就继续往前走去。", "基督徒说：啊，我的兄弟！我们在这时候看到这个东西真是适宜。在底马请我们去看金银山之后，让我们看见它，实在再适宜不过了；要是当时我们照他的希望走了过去，就像你所打算的那样，我的兄弟，我们也许就会像这个女人一样，变成供后人观看的展览物了。", "盼望说：我真懊悔当时竟会那么傻，这会儿没有变成像罗得的妻子那样，真是万幸；因为我的罪跟她的罪有什么不同呢？她只不过回头看一看，而我刚才还想走过去看呢。天恩浩荡，我心里竟有这种思想，可真丢脸啊。", "基督徒说：为了对我们将来有帮助，让我们把在这儿看到的好好记住。这个女人逃过了一个审判，因为她没有跟所多玛一起灭亡；可是，就像我们看到的，她在另一个审判中灭亡了；她变成了一根盐柱。", "盼望说：对；她这事可以促使我们提高我们的警惕，同时也给我们教训；说到警惕，我们会因此避免犯她所犯的罪；或者会由于看到这个关于缺乏这种警惕性的人会受到怎样的审判的预示而得到儆戒；因此可拉、大坍、亚比兰和同党的二百五十人在罪恶中死亡这一事实也给了别人一种预示和教训，叫人注意谨防。不过我特别想到一件事，那就是，底马和他的伙伴怎么那么大胆地站在那儿，一心想去找财宝，而罗得的妻子仅仅为了回头一看就变成了盐柱（因为照我们从书上所读到的来看，她并没有挪开过一步） ；尤其是他们举目就可以看见她受到的裁判所给他们的教训；因为，只要他们一抬起头来，就无法不看见她。", "基督徒说：这的确是件费解的事，这说明他们已经到了不顾一切的地步；除了那些在法官面前行窃或者在绞刑架下面偷钱的人，我不知道拿什么样的人来跟他们相比才适当。据说所多玛的人 1“罪大恶极， ”因为他们“在神面前”是罪人——这就是说，在祂看来，他们是罪人，尽管祂曾经施慈悲给他们；因为所多玛的地就像以前的伊甸园。这使祂更震怒，祂使他们的灾祸猛烈到天上的火所可能做到的地步。因此我们可以非常合理地断定，这些人，就是祂眼里的这些罪人，这些人尽管不断受到谆谆儆戒，叫他们不要那样做，而他们却置之不顾，这是一定会受到严厉处罚的。", "盼望说：毫无疑问你已经把真理说出来了；你没有，尤其是我也没有，被树立作为给别人的儆戒，这真是万幸！我们有理由感谢神，在祂面前战战兢兢，并且永远记住罗得的妻子。"], "en_paras": ["Then Christian and Hopeful outwent them again, and went till they came to a delicate plain called Ease, where they went with much content; but that plain was but narrow, so they were quickly got over it. Now at the further side of that plain was a little hill called Lucre, and in that hill a silver mine, which some of them that had formerly gone that way, because of the rarity of it, had turned aside to see; but going too near the brink of the pit, the ground being deceitful under them, broke, and they were slain; some also had been maimed there, and could not, to their dying day, be their own men again.", "Then I saw in my dream, that a little off the road, over against the silver mine, stood Demas (gentlemanlike) to call to passengers to come and see; who said to Christian and his fellow, Ho! turn aside hither, and I will show you a thing.", "CHR. What thing so deserving as to turn us out of the way to see it?", "DEMAS. Here is a silver mine, and some digging in it for treasure. If you will come, with a little pains you may richly provide for yourselves.", "HOPE. Then said Hopeful, Let us go see.", "CHR. Not I, said Christian, I have heard of this place before now; and how many have there been slain; and besides that, treasure is a snare to those that seek it; for it hindereth them in their pilgrimage. Then Christian called to Demas, saying, Is not the place dangerous? Hath it not hindered many in their pilgrimage? [Hos. 14:8]", "DEMAS. Not very dangerous, except to those that are careless, (but withal, he blushed as he spake).", "CHR. Then said Christian to Hopeful, Let us not stir a step, but still keep on our way.", "HOPE. I will warrant you, when By-ends comes up, if he hath the same invitation as we, he will turn in thither to see.", "CHR. No doubt thereof, for his principles lead him that way, and a hundred to one but he dies there.", "DEMAS. Then Demas called again, saying, But will you not come over and see?", "CHR. Then Christian roundly answered, saying, Demas, thou art an enemy to the right ways of the Lord of this way, and hast been already condemned for thine own turning aside, by one of His Majesty's judges [2 Tim. 4:10]; and why seekest thou to bring us into the like condemnation? Besides, if we at all turn aside, our Lord and King will certainly hear thereof, and will there put us to shame, where we would stand with boldness before him.", "Demas cried again, that he also was one of their fraternity; and that if they would tarry a little, he also himself would walk with them.", "CHR. Then said Christian, What is thy name? Is it not the same by the which I have called thee?", "DEMAS. Yes, my name is Demas; I am the son of Abraham.", "CHR. I know you; Gehazi was your great-grandfather, and Judas your father; and you have trod in their steps. [2 Kings 5:20, Matt. 26:14,15, 27:1-5] It is but a devilish prank that thou usest; thy father was hanged for a traitor, and thou deservest no better reward. Assure thyself, that when we come to the King, we will do him word of this thy behaviour. Thus they went their way.", "By this time By-ends and his companions were come again within sight, and they, at the first beck, went over to Demas. Now, whether they fell into the pit by looking over the brink thereof, or whether they went down to dig, or whether they were smothered in the bottom by the damps that commonly arise, of these things I am not certain; but this I observed, that they never were seen again in the way. Then sang Christian--", "By-ends and silver Demas both agree; One calls, the other runs, that he may be A sharer in his lucre; so these do Take up in this world, and no further go.", "Now I saw that, just on the other side of this plain, the pilgrims came to a place where stood an old monument, hard by the highway side, at the sight of which they were both concerned, because of the strangeness of the form thereof; for it seemed to them as if it had been a woman transformed into the shape of a pillar; here, therefore they stood looking, and looking upon it, but could not for a time tell what they should make thereof. At last Hopeful espied written above the head thereof, a writing in an unusual hand; but he being no scholar, called to Christian (for he was learned) to see if he could pick out the meaning; so he came, and after a little laying of letters together, he found the same to be this, \"Remember Lot's Wife\". So he read it to his fellow; after which they both concluded that that was the pillar of salt into which Lot's wife was turned, for her looking back with a covetous heart, when she was going from Sodom for safety. [Gen. 19:26] Which sudden and amazing sight gave them occasion of this discourse.", "CHR. Ah, my brother! this is a seasonable sight; it came opportunely to us after the invitation which Demas gave us to come over to view the Hill Lucre; and had we gone over, as he desired us, and as thou wast inclining to do, my brother, we had, for aught I know, been made ourselves like this woman, a spectacle for those that shall come after to behold.", "HOPE. I am sorry that I was so foolish, and am made to wonder that I am not now as Lot's wife; for wherein was the difference betwixt her sin and mine? She only looked back; and I had a desire to go see. Let grace be adored, and let me be ashamed that ever such a thing should be in mine heart.", "CHR. Let us take notice of what we see here, for our help for time to come. This woman escaped one judgment, for she fell not by the destruction of Sodom; yet she was destroyed by another, as we see she is turned into a pillar of salt.", "HOPE. True; and she may be to us both caution and example; caution, that we should shun her sin; or a sign of what judgment will overtake such as shall not be prevented by this caution; so Korah, Dathan, and Abiram, with the two hundred and fifty men that perished in their sin, did also become a sign or example to others to beware. [Num. 26:9,10] But above all, I muse at one thing, to wit, how Demas and his fellows can stand so confidently yonder to look for that treasure, which this woman, but for looking behind her after, (for we read not that she stepped one foot out of the way) was turned into a pillar of salt; especially since the judgment which overtook her did make her an example, within sight of where they are; for they cannot choose but see her, did they but lift up their eyes.", "CHR. It is a thing to be wondered at, and it argueth that their hearts are grown desperate in the case; and I cannot tell who to compare them to so fitly, as to them that pick pockets in the presence of the judge, or that will cut purses under the gallows. It is said of the men of Sodom, that they were sinners exceedingly, because they were sinners before the Lord, that is, in his eyesight, and notwithstanding the kindnesses that he had showed them [Gen. 13:13]; for the land of Sodom was now like the garden of Eden heretofore. [Gen. 13:10] This, therefore, provoked him the more to jealousy, and made their plague as hot as the fire of the Lord out of heaven could make it. And it is most rationally to be concluded, that such, even such as these are, that shall sin in the sight, yea, and that too in despite of such examples that are set continually before them, to caution them to the contrary, must be partakers of severest judgments.", "HOPE. Doubtless thou hast said the truth; but what a mercy is it, that neither thou, but especially I, am not made myself this example! This ministereth occasion to us to thank God, to fear before him, and always to remember Lot's wife.", "I saw, then, that they went on their way to a"]}]}, {"num": 17, "id": "chapter-15", "badge_label": "CHAPTER 17", "title_zh": "第十五章 怀疑堡垒和绝望巨人", "title_en": "Chapter 15: Doubting Castle and Giant Despair", "desc": "生命河边的宁静与偏离正道的旁道草场；暴风雨黑夜与绝望巨人的擒获；怀疑堡垒阴森地牢中的毒打与熬炼。", "blocks": [{"sub_zh": "生命河边的宁静与偏离正道的旁道草场", "sub_en": "The River of the Water of Life & Strayed into By-path Meadow", "zh_paras": ["然后我看见他们向一条清澈可爱的河流走去，那条河大卫王称为 3“神的河；”可是约翰却叫它4“生命之水的河。”他们的路正沿着河岸，因此基督徒和他的同伴很高兴地走着；他们还饮河里的水，那水味美，而且使他们疲劳的精神振作了起来。在两边河岸上有长着各种各样果子的绿树；吃了树上的叶子，可以防止饮食过饱以及旅行中暑所引起的种种疾病。河两边都是草地，一年到头一片青翠，百合花把草地点缀得出奇地美丽。他们就在草地上躺下去睡觉，因为他们在这儿可以安因此在前面走的人（名叫自负）由于看不见路，跌进一个深坑里去，跌得粉身碎骨，这深坑是这地", "带的王子故意安排在那儿，用来捕捉自负的傻瓜。", "基督徒和他的同伴听见他跌倒的声音，他们喊叫起来，要知道是怎么一回事；可是没有人回答他们，他们只听见一阵阵的呻吟声。于是盼望说，我们这会儿在哪儿呢？他的同伴默不作声，心里起了怀疑，不知道自己有没有把他带错了路；这会儿开始下雨了，雷电交加，非常可怕，同时水在急速上涨。", "于是盼望心里暗自叹息，说，但愿我没有离开正路！", "基督徒说：谁想得到这小路会把我们带到另一个方向去呢？", "盼望说：一开头我就怕会这样，因此我婉转地给了你警告。要不是因为你年纪比我大，我就会更直截了当地说了。"], "en_paras": ["pleasant river; which David the king called \"the river of God\", but John, \"the river of the water of life\". [Ps. 65:9, Rev. 22, Ezek. 47] Now their way lay just upon the bank of the river; here, therefore, Christian and his companion walked with great delight; they drank also of the water of the river, which was pleasant, and enlivening to their weary spirits: besides, on the banks of this river, on either side, were green trees, that bore all manner of fruit; and the leaves of the trees were good for medicine; with the fruit of these trees they were also much delighted; and the leaves they eat to prevent surfeits, and other diseases that are incident to those that heat their blood by travels. On either side of the river was also a meadow, curiously beautified with lilies, and it was green all the year long. In this meadow they lay down, and slept; for here they might lie down safely. When they awoke, they gathered again of the fruit of the trees, and drank again of the water of the river, and then lay down again to sleep. [Ps. 23:2, Isa. 14:30] Thus they did several days and nights. Then they sang--", "Behold ye how these crystal streams do glide, To comfort pilgrims by the highway side; The meadows green, beside their fragrant smell, Yield dainties for them; and he that can tell What pleasant fruit, yea, leaves, these trees do yield, Will soon sell all, that he may buy this field.", "So when they were disposed to go on, (for they were not, as yet, at their journey's end,) they ate and drank, and departed.", "Now, I beheld in my dream, that they had not journeyed far, but the river and the way for a time parted; at which they were not a little sorry; yet they durst not go out of the way. Now the way from the river was rough, and their feet tender, by reason of their travels; so the souls of the pilgrims were much discouraged because of the way. [Num. 21:4] Wherefore, still as they went on, they wished for better way. Now, a little before them, there was on the left hand of the road a meadow, and a stile to go over into it; and that meadow is called By-path Meadow. Then said Christian to his fellow, If this meadow lieth along by our wayside, let us go over into it. Then he went to the stile to see, and behold, a path lay along by the way, on the other side of the fence. It is according to my wish, said Christian. Here is the easiest going; come, good Hopeful, and let us go over.", "HOPE. But how if this path should lead us out of the way?", "CHR. That is not like, said the other. Look, doth it not go along by the wayside? So Hopeful, being persuaded by his fellow, went after him over the stile. When they were gone over, and were got into the path, they found it very easy for their feet; and withal, they, looking be
