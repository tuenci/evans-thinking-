e name of the Lord Jesus; yea, I thought that had I now a thousand gallons of blood in my body, I could spill it all for the sake of the Lord Jesus."]}, {"sub_zh": "基督宝血与称义真道的深刻交通", "sub_en": "Hopeful's Revelation of Christ and Justification by Faith", "zh_paras": ["我说，3“相信主耶稣，你必得救。”但是我回答说，主啊，我是个罪大恶极的罪人。他说，4“我的恩典足够你用的。”然后我说，不过，主啊，怎样才算相信呢？接着我从那句话5“到我这里来的，必定不饿，信我的，永远不渴。”明白了具有信心和来到他跟前这一举动是一回事；谁来到他跟前——也就是谁全心全意要靠基督获得救赎 ——谁就真的相信基督。于是我眼眶里噙满了泪水。又问道，可是，主啊，您真的肯接纳和拯救像我这样一个大罪人吗？我听见他说，6“到我这里来的，我总不丢弃他。”我说，不过，主啊，我到您那儿来的时候，对您应该有个怎样的看法，对您才算有正确的信心？", "他说：7“基督耶稣降世，为要拯救罪人；律法的总结就是基督，使凡信他的都得着义；他为我们的罪而死，又为释我们的罪而复活；他爱我们，用他的血洗净我们的罪；他是神和我们之间的中保；他是长远活着，替我们祈求。”我从这些话推断，我得在他身上寻求正义，靠他的血来赎我的罪；他为了服从他父亲的律法和甘受它的处罚所作的一切，不是为了他自己，而是为了任何一个感激涕零地接受他的救赎的人。这会儿我的心充满了喜悦，眼眶噙满泪水，内心洋溢着对耶稣基督的名字、作风和对他子民的爱。", "基督徒说：这的确是基督对你的显示；不过请你特别仔细地告诉我这个显示对你的精神有什么影响。", "盼望说：这个显示使我看出，全世界是处在犯罪的状态中，尽管它有它所谓的义。这个显示使我看出，我们的天父神，虽然他是公正的，能够公正地解除来到他跟前的罪人的罪。它使我以过去的生活的卑鄙为莫大的耻辱，使我对自己的无知感到羞愧；因为以前我从来没有想到耶稣基督是这样美好的。它使我喜爱圣洁的生活，渴望为了主耶稣的名字的光荣而做些事；我还想，要是现在我身体里有一千加仑的血，我也愿意为主耶稣流尽最后一滴。", "这时候我在梦里看见盼望往后一看，瞧见给他们赶过头的无知在后面走着。瞧，他对基督徒说，那个青年人在那么远的地方闲荡着。", "基督徒说：是，是，我看到了；他不愿意跟在我们一起。", "盼望说：不过我相信，如果他至今还是跟我们走在一起的话，对他也不会有害处。", "基督徒说：对呀；不过我敢说他可不以为然。", "盼望说：你说得对；不过我们还是等等他吧。 （于是他们就停下来。 ）接着基督徒对他说，来，老兄；你为什么落在后面这么长一段路？", "无知说：我喜欢独个儿走；比起跟人家一起走好得多，除非我喜欢那些伴侣。", "于是基督徒轻轻地对盼望说，我不是对你说过，他不愿意跟我们在一起的吗？不过，来，让我们在这冷落的地方谈谈天消磨时间。接着他对无知说，喂，你好吗？你的灵魂跟神的关系现在怎么样了？", "无知说：我想不错吧；因为我在走的时候，心里经常有好的动机，使我自己得到不少安慰。", "基督徒问：什么好动机？请告诉我们。", "无知说：唔，我想着神和天堂。", "基督徒说：魔鬼和沉沦的人也会想这些东西。", "无知说：但是我想着他们，还渴望他们。", "基督徒说：许多不可能到天堂去的人也这样渴望。4“懒惰人羡慕，却无所得。”", "无知说：但是我想着他们，为他们抛弃掉一切。", "基督徒说：这一点我可不大相信；因为抛弃一切不是件容易的事 ——是呀，比许多人所认为的要难得多。不过，为什么你会相信，你根据什么相信自己为神和天堂抛弃了一切？", "无知说：我心里这样想。", "基督徒说：贤者说，1“心中自是的，便是愚昧人。”", "无知说：那是指一个邪恶的心而说的，而我的心是好的。", "基督徒问：你怎么证明你的心是好的呢？", "无知说：它用对天堂的希望来安慰我。", "基督徒说：这也可能是受了你自己的心的欺诈；一个人的心可能使他对一件他根本还没有理由对它存着希望的东西抱着希望，因而得着安慰。", "无知说：但是我的心跟我的生活是一致的，因此我的希望是有根据的。", "基督徒说：谁告诉你，你的心跟生活是一致的？", "无知说：我自己这样想。", "基督徒说：问我的伙伴我会不会骗你！你自己这样想！在这件事上，除非神做你的证人，别的证明一概无效。", "无知说：但是，一个好的心准会有好的思想，难道不是这样吗？难道符合于神的戒律的生活不是好的生活吗？", "基督徒说：是，有好思想的心才是好心，遵守神戒律的生活才是好的生活；但是，能做到这样是一件事情，光是这样想想又是另一件事情。", "基督徒、无知和盼望谈话。"], "en_paras": ["I saw then in my dream that Hopeful looked back and saw Ignorance, whom they had left behind, coming after. Look, said he to Christian, how far yonder youngster loitereth behind.", "CHR. Ay, ay, I see him; he careth not for our company.", "HOPE. But I trow it would not have hurt him had he kept pace with us hitherto.", "CHR. That is true; but I warrant you he thinketh otherwise.", "HOPE. That, I think, he doth; but, however, let us tarry for him. So they did.", "Then Christian said to him, Come away, man, why do you stay so behind?", "IGNOR. I take my pleasure in walking alone, even more a great deal than in company, unless I like it the better.", "Then said Christian to Hopeful, (but softly), Did I not tell you he cared not for our company? But, however, said he, come up, and let us talk away the time in this solitary place. Then directing his speech to Ignorance, he said, Come, how do you? How stands it between God and your soul now?", "Ignorance's hope, and the ground of it", "IGNOR. I hope well; for I am always full of good motions, that come into my mind, to comfort me as I walk.", "CHR. What good motions? pray, tell us.", "IGNOR. Why, I think of God and heaven.", "CHR. So do the devils and damned souls.", "IGNOR. But I think of them and desire them.", "CHR. So do many that are never like to come there. \"The soul of the sluggard desireth, and hath nothing.\" [Prov. 13:4]", "IGNOR. But I think of them, and leave all for them.", "CHR. That I doubt; for leaving all is a hard matter: yea, a harder matter than many are aware of. But why, or by what, art thou persuaded that thou hast left all for God and heaven.", "IGNOR. My heart tells me so.", "CHR. The wise man says, \"He that trusts his own heart is a fool.\" [Prov. 28:26]", "IGNOR. This is spoken of an evil heart, but mine is a good one.", "CHR. But how dost thou prove that?", "IGNOR. It comforts me in hopes of heaven.", "CHR. That may be through its deceitfulness; for a man's heart may minister comfort to him in the hopes of that thing for which he yet has no ground to hope.", "IGNOR. But my heart and life agree together, and therefore my hope is well grounded.", "CHR. Who told thee that thy heart and life agree together?", "IGNOR. My heart tells me so.", "CHR. Ask my fellow if I be a thief! Thy heart tells thee so! Except the Word of God beareth witness in this matter, other testimony is of no value.", "IGNOR. But is it not a good heart that hath good thoughts? and is not that a good life that is according to God's commandments?", "CHR. Yes, that is a good heart that hath good thoughts, and that is a good life that is according to God's commandments; but it is one thing, indeed, to have these, and another thing only to think so.", "IGNOR. Pray, what count you good thoughts, and a life according to God's commandments?", "CHR. There are good thoughts of divers kinds; some respecting ourselves, some God, some Christ, and some other things.", "IGNOR. What be good thoughts respecting ourselves?", "CHR. Such as agree with the Word of God.", "IGNOR. When do our thoughts of ourselves agree with the Word of God?", "CHR. When we pass the same judgment upon ourselves which the Word passes. To explain myself--the Word of God saith of persons in a natural condition, \"There is none righteous, there is none that doeth good.\" [Rom. 3] It saith also, that \"every imagination of the heart of man is only evil, and that continually.\" [Gen. 6:5] And again, \"The imagination of man's heart is evil from his youth.\" [Rom. 8:21] Now then, when we think thus of ourselves, having sense thereof, then are our thoughts good ones, because according to the Word of God.", "IGNOR. I will never believe that my heart is thus bad.", "CHR. Therefore thou never hadst one good thought concerning thyself in thy life. But let me go on. As the Word passeth a judgment upon our heart, so it passeth a judgment upon our ways; and when OUR thoughts of our hearts and ways agree with the judgment which the Word giveth of both, then are both good, because agreeing thereto.", "IGNOR. Make out your meaning."]}, {"sub_zh": "与无知关于真假信心的最后辩论", "sub_en": "The Final Discourse with Ignorance on Faith and Heart-Deceit", "zh_paras": ["无知说：请问，怎样的思想你才认为是好思想，怎样的生活你才认为是遵守神戒律的生活？", "基督徒说：有各种各样的好思想——有的是关于我们自己，有的关于神，有的关于基督，有的关于别的东西。", "无知说：哪些是关于我们自己的好思想？", "基督徒说：符合于《圣经》的就是好思想。", "无知说：什么时候我们对自己的想法才符合于《圣经》？", "基督徒说：当我们像《圣经》那样裁判自己的时候。让我解释一下：关于处在自然状态中的人， 《圣经》说，2“没有一个正义的，没有一个好人。”它还说， “终日所思想的尽都是恶。”又说，2“人的思想从少年时代就是邪恶的。”因此，当我们对自己有这样的想法，并且认识到自己多么败坏的时候，我们的思想才能算是好的，因为这种想法是跟《圣经》上所说的一致的。", "无知说：我决不相信我的心有这样坏。", "基督徒说：所以你一辈子对你自己没有过一个正确的想法，——不过让我讲下去吧。正如《圣经》对我们的心下裁判，它对我们的行为也下裁判；当我们对我们的心和行为的想法符合《圣经》对它们所下的裁判的时候，它们就是好的，因为它们符合《圣经》的要求。", "无知说：请你讲清楚点。", "基督徒说：因为《圣经》上说，人的道路是弯曲的 ——不是正确的，而是邪恶的。它说他们天然不会走正确的道路——他们也不知道。当一个人对自己的行为这样想 ——我是说，当他贤明地、虚心地想——的时候，那时他对他的作风有正确的想法，因为他的想法跟《圣经》的判断一样。", "无知说：怎样才是对神有正确的想法？", "基督徒说：当我们对神的想法（就像我刚才说的对自己的想法）跟《圣经》里讲的一致的时候；也就是说，当我们对他的本质和属性，有像《圣经》上所教我们的那种想法 ——关于这些我现在不能多讲——的时候，我们对他就有了正确的想法。至于他跟我们的关系，那是这样的；当我们想到他了解我们胜过我们的自知之明，在我们自己看不见有罪的地方，在我们自己还不知道已经犯了罪的时候，他看出了我们的罪；当我们想到他洞悉我们内心深处，尽管我们的心多深，他总是看得清清楚楚；当我们想到我们所有的义在他看来都是污秽的，因此即使我们是带了我们最好的行为来见他，他也不能容忍我们自以为是地站在他面前——只有在这样一些时候，我们对神才有正确的想法。", "无知问：你还以为我这样傻，会认为神的眼光不比我精明吗？或者我会用最好的行为在神面前自恃吗？", "基督徒说：那么，对这件事你到底是怎么想的？", "无知说：唔，简单的说，我想我得相信基督才能解脱我的罪。", "基督徒说：怎么！当你不觉得需要他的时候，竟然会认为非相信他不可！你既看不出你原始的弱点，也看不见你实际的弱点；对自己和自己所作所为有这样一种看法，使你显然成为一个从来不觉得需要靠基督的义在神面前称义的人。那么你怎么说，你相信基督呢？", "无知说：尽管如此，我还是很相信。", "基督徒问：你怎么相信呢？", "无知说：我相信基督为罪人而死；并且由于我遵守了他的律法，他接纳了我，因而将来我在神面前可以免受天罚。或者这样讲：由于他的功劳，基督使他的父亲满意我的虔诚的修行；因此我将蒙恩得以赦免众罪。", "基督徒说：让我对你这种信仰的表白作一个答复吧：1. 你的信仰是一种异想天开的信仰；《圣经》上从来就没有提到过这种信仰。2. 你的信仰是一种错误的信仰；因为这种信仰是把基督的正义应用到你自己身上来。3. 这种信仰认为并不是基督为你释罪，而你是靠了自己的行为获得释罪；你是因你自己的行为才不被定罪，这是完全错误的。4. 因此这种信仰是虚假的，而且它根本不能使你逃脱全能的神的愤怒；因为真正的赦罪的信仰使一个知道自己因守律法而走错了路的人投到基督的庇荫之下，靠他的义避过大难（他的义并不是为了要释你的罪，使神满意于你的顺从的一种恩典，而是他自己对律法的遵守，因为他代替我们，因我们", "的缘故做了并忍受了律法需要他做的和忍受的） ；这种义，我说，是真正的信仰所乐于接受的；在它的羽翼下灵魂得到保护，而且给纯洁无疵地带到了神面前，蒙神的悦纳，免于定罪。", "无知说：什么，难道你要我们不依靠自己而完全依靠基督的作为吗？这种妄想会使我们放纵欲望，随心所欲地生活；因为，如果我们相信基督的义能解除我们所有的罪，那么我们怎样生活又有什么关系呢？", "基督徒说：你的名字是无知，你，就像你的名字一样，也是无知的；你刚才的回答证明了我这个说法是正确的。你不懂什么是赦罪的义，也不懂怎样通过对它的信心来逃避神猛烈的愤怒，保全你的灵魂。不仅如此，你也不明白相信基督的义能拯救人的这种信心的真正作用，这种信心使人爱基督，爱他的名字、爱《圣经》 、爱他的道路和他的子民，而不像你无知地所想象的那样。", "盼望说：问他基督有没有从天上启示给他看过。", "无知说：什么！你是相信启示的人！我想你们俩和其他所有的人所说的关于启示的事只是神经错乱的结果。", "盼望说：怎么，老兄！肉身的人自然看不见基督的，除非天父把他启示给他们，他们是无法认识他而得到拯救的。", "无知说：这是你的信仰，可不是我的；不过我敢说，我的信仰不比你的差，虽然我脑子里不像你那样有那么多怪念头。", "基督徒说：请让我插一句话。你不该小看这件事；我可以大胆地肯定，就像我的好伴侣刚才做的，除非天父启示，没有人能认识基督；并且本着相信来认识基督的信心（如果它是那种正确的信心）也一定是由他那浩大的能力促成的；可怜的无知，我看出你根本不了解这个信心的作用。所以醒来吧；张开眼来看看你自己有多么污秽，奔到主耶稣那儿去吧；靠着他的义，也就是神的义（因为他就是神） ，你一定可以免去定罪。", "无知说：你们走得太快，我跟不上；你们管你们走吧，我得歇一会。", "于是他们说，——唔，无知，你还要这样愚笨，轻看多次给你的规劝谆谆？如果你仍然不听，不久你就会知道这样做多不幸。及时记住，老兄；屈从，不要怕；如果恳切地接受忠言，能获得救赎；因此听从吧。可是你如果依旧处之泰然，我保证，", "无知，你将受到亏损。", "然后基督徒向他的同伴说：来，我的好盼望，我看我们又得两个人走了。于是我在梦里看见他们急速向前走，无知在后面一步一颠地走着。基督徒对他的同伴说，我真怜悯这个可怜的人；他最后一定会遭殃的。"], "en_paras": ["CHR. Why, the Word of God saith that man's ways are crooked ways; not good, but perverse. [Ps. 125:5, Prov. 2:15] It saith they are naturally out of the good way, that they have not known it. [Rom. 3] Now, when a man thus thinketh of his ways,--I say, when he doth sensibly, and with heart-humiliation, thus think, then hath he good thoughts of his own ways, because his thoughts now agree with the judgment of the Word of God.", "IGNOR. What are good thoughts concerning God?", "CHR. Even as I have said concerning ourselves, when our thoughts of God do agree with what the Word saith of him; and that is, when we think of his being and attributes as the Word hath taught, of which I cannot now discourse at large; but to speak of him with reference to us: Then we have right thoughts of God, when we think that he knows us better than we know ourselves, and can see sin in us when and where we can see none in ourselves; when we think he knows our inmost thoughts, and that our heart, with all its depths, is always open unto his eyes; also, when we think that all our righteousness stinks in his nostrils, and that, therefore, he cannot abide to see us stand before him in any confidence, even in all our best performances.", "IGNOR. Do you think that I am such a fool as to think God can see no further than I? or, that I would come to God in the best of my performances?", "CHR. Why, how dost thou think in this matter?", "IGNOR. Why, to be short, I think I must believe in Christ for justification.", "CHR. How! think thou must believe in Christ, when thou seest not thy need of him! Thou neither seest thy original nor actual infirmities; but hast such an opinion of thyself, and of what thou dost, as plainly renders thee to be one that did never see a necessity of Christ's personal righteousness to justify thee before God. How, then, dost thou say, I believe in Christ?", "IGNOR. I believe well enough for all that.", "CHR. How dost thou believe?", "IGNOR. I believe that Christ died for sinners, and that I shall be justified before God from the curse, through his gracious acceptance of my obedience to his law. Or thus, Christ makes my duties, that are religious, acceptable to his Father, by virtue of his merits; and so shall I be justified.", "CHR. Let me give an answer to this confession of thy faith:--", "1. Thou believest with a fantastical faith; for this faith is nowhere described in the Word.", "2. Thou believest with a false faith; because it taketh justification from the personal righteousness of Christ, and applies it to thy own.", "3. This faith maketh not Christ a justifier of thy person, but of thy actions; and of thy person for thy actions' sake, which is false.", "4. Therefore, this faith is deceitful, even such as will leave thee under wrath, in the day of God Almighty; for true justifying faith puts the soul, as sensible of its condition by the law, upon flying for refuge unto Christ's righteousness, which righteousness of his is not an act of grace, by which he maketh for justification, thy obedience accepted with God; but his personal obedience to the law, in doing and suffering for us what that required at our hands; this righteousness, I say, true faith accepteth; under the skirt of which, the soul being shrouded, and by it presented as spotless before God, it is accepted, and acquit from condemnation.", "IGNOR. What! would you have us trust to what Christ, in his own person, has done without us? This conceit would loosen the reins of our lust, and tolerate us to live as we list; for what matter how we live, if we may be justified by Christ's personal righteousness from all, when we believe it?", "CHR. Ignorance is thy name, and as thy name is, so art thou; even this thy answer demonstrateth what I say. Ignorant thou art of what justifying righteousness is, and as ignorant how to secure thy soul, through the faith of it, from the heavy wrath of God. Yea, thou also art ignorant of the true effects of saving faith in this righteousness of Christ, which is, to bow and win over the heart to God in Christ, to love his name, his word, ways, and people, and not as thou ignorantly imaginest.", "HOPE. Ask him if ever he had Christ revealed to him from heaven.", "IGNOR. What! you are a man for revelations! I believe that what both you, and all the rest of you, say about that matter, is but the fruit of distracted brains.", "HOPE. Why, man! Christ is so hid in God from the natural apprehensions of the flesh, that he cannot by any man be savingly known, unless God the Father reveals him to them.", "IGNOR. That is your faith, but not mine; yet mine, I doubt not, is as good as yours, though I have not in my head so many whimsies as you.", "CHR. Give me leave to put in a word. You ought not so slightly to speak of this matter; for this I will boldly affirm, even as my good companion hath done, that no man can know Jesus Christ but by the revelation of the Father; [Matt. 11:27] yea, and faith too, by which the soul layeth hold upon Christ, if it be right, must be wrought by the exceeding greatness of his mighty power; the working of which faith, I perceive, poor Ignorance, thou art ignorant of. [1 Cor. 12:3, Eph. 1:18,19] Be awakened, then, see thine own wretchedness, and fly to the Lord Jesus; and by his righteousness, which is the righteousness of God, for he himself is God, thou shalt be delivered from condemnation.", "IGNOR. You go so fast, I cannot keep pace with you. Do you go on before; I must stay a while behind.", "Then they said--", "Well, Ignorance, wilt thou yet foolish be, To slight good counsel, ten times given thee? And if thou yet refuse it, thou shalt know, Ere long, the evil of thy doing so. Remember, man, in time, stoop, do not fear; Good counsel taken well, saves: therefore hear. But if thou yet shalt slight it, thou wilt be The loser, (Ignorance), I'll warrant thee.", "Then Christian addressed thus himself to his fellow:--", "CHR. Well, come, my good Hopeful, I perceive that thou and I must walk by ourselves again.", "So I saw in my dream that they went on apace before, and Ignorance he came hobbling after. Then said Christian to his companion, It pities me much for this poor man, it will certainly go ill with him at last.", "HOPE. Alas! there are abundance in our town in his condition, whole families, yea, whole streets, and that of pilgrims too; and if there be so many in our parts, how many, think you, must there be in the place where he was born?", "CHR. Indeed the Word saith, \"He hath blinded their eyes, lest they should see\", &c. But now we are by ourselves, what do you think of such men? Have they at no time, think you, convictions of sin, and so consequently fears that their state is dangerous?", "HOPE. Nay, do you answer that question yourself, for you are the elder man.", "CHR. Then I say, sometimes (as I think) they may; but they being naturally ignorant, understand not that such convictions tend to their good; and therefore they do desperately seek to stifle them, and presumptuously continue to flatter themselves in the way of their own hearts.", "HOPE. I do believe, as you say, that fear tends much to men's good, and to make them right, at their beginning to go on pilgrimage.", "CHR. Without all doubt it doth, if it be right; for so says the Word, \"The fear of the Lord is the beginning of wisdom.\" [Prov. 1:7, 9:10, Job 28:28, Ps. 111:10]", "HOPE. How will you describe right fear?", "CHR. True or right fear is discovered by three things:--", "1. By its rise; it is caused by saving convictions for sin.", "2. It driveth the soul to lay fast hold of Christ for salvation."]}, {"sub_zh": "论属神的敬畏与信徒退后堕落的九个步骤", "sub_en": "Right Holy Fear & The Nine Steps of Backsliding Laid Bare", "zh_paras": ["盼望说：哎呀！像他这样的人我们的城里有的是 ——一家一家的这样的人，还不仅如此，不少地方整条街上都是这样的人，甚至在天路旅客中间也有不少这样的人呢；你想一想，如果我们那一带有这么多，在他的家乡会有多少呀？", "基督徒说：的确， 《圣经》里说， “他把他们的眼睛弄瞎了，恐怕他们看见， ”等等。不过，现在只有我们两人在一起了，请你谈谈你对这种人怎么想法。你认为他们从来就没有悔罪过，因此也不担心自己的处境很危险吗？", "盼望说：不，你自己答复这个问题吧。因为你年纪比我大。", "基督徒说：那么我说，他们有时候也可能悔罪，并且担心自己的情况的（我是这样想） ；可是他们因为生来无知，不懂得悔罪对他们有好处；因此他们想尽办法不让自己悔罪，继续放肆，自以为是。", "盼望说：我相信，就像你说的，担心对人大有好处，并且在他们开始走天路的时候就使他们不至于走错路。", "基督徒说：这是毫无疑问的，只要是正确的畏惧；因为《圣经》上这样说，1“敬畏主就是智慧。”", "盼望说：你怎样形容正确的畏惧？", "基督徒说：正确的畏惧可以凭下列三点发现：——1． 根据它的起因；它是从使人得救的悔罪中产生的。2． 它驱使人为了灵魂的救赎而紧紧抓住基督。3． 它使人的心灵不断崇敬神以及他的道路和《圣经》 ；它使人心温柔，使它惧怕背弃神，他的道路和《圣经》 ，也怕偏左或偏右，并害怕任何侮辱神的事情、扰乱内心的平安、使圣灵懮伤或者引起魔鬼的非难。", "盼望说：讲得好；我相信你说出了真理——我们现在是不是已经走完了着魔之地？", "基督徒问：怎么？你是不是对这番谈话厌倦了？", "盼望说：不，真的不是，我只是要知道我们到了哪儿了。", "基督徒说：我们至多再走两英里路就可以走出着魔之地。 ——不过我们还是回到刚才的话题上去吧。愚蠢的人不知道那种会使他们害怕的悔罪对他们有好处，因此他们想尽办法窒息这种悔罪之心。", "盼望说：他们怎样想法子窒息它呢？", "基督徒说：1．他们认为那种恐惧是魔鬼引起的（虽然那的确是神的作为） ；抱着这种想法，他们抵御那些恐惧，把它们当作会促使他们灭亡的东西。2．他们还认为这些恐惧对他们的信心会有不好的影响；而其实呢，哎呀，可怜的人，他们根本就没有信心！因此他们硬起心肠，对恐惧置之不理。3．他们自以为不应该害怕，因此，他们不顾那些恐惧，变成傲慢自信的人。4．他们看出那些恐惧会赶走他们一向具有的那种可怜的自以为有了的圣洁，因此他们竭力反抗它们。", "盼望说：关于这种事我自己多少也知道一点；因为在我对自己有正确的认识以前，我也是这样的。", "基督徒说：唔，我们现在且撇下邻居无知的事不谈，来讨论另外一个有益的问题吧。", "盼望说：完全同意；不过还是请你先讲。", "基督徒说：好吧，你知不知道大约十年前在你住的那一带地方有个名叫偷懒的人 ——当时对宗教很热心的一个人？", "盼望说：知道他！当然；他住在缺德镇，离诚实市约莫两英里，他是一个叫做走回头的贴邻。", "基督徒说：对，他跟他住在一起。这个人曾经觉悟过来；我相信那时候他对自己的罪恶和因之而有的报应都看到了。", "盼望说：我同意你的话；因为我的家离开他只有三英里路，他常常痛哭流涕地来找我。我的确很怜悯他，对他并不是没有抱过希望；不过我们知道不是每个人都喊，1“主啊，主啊！”的。", "基督徒说：他有一次对我说，他决定要走天路，就像我们现在这样；突然间他认识了一个名叫偷懒的人，从那以后他对我就像个陌生人。", "盼望说：好，既然我们谈起了他，让我们来研究一下，他以及他的那些同类为什么突然堕落了。", "基督徒说：这种谈话可能很有益处；不过请你开始。", "盼望说：那么，据我判断，有四个原因：——1．虽然这些人的良心觉醒了过来，可是他们的思想还没有转变；所以，因知罪而产生的力量一消失，宗教热诚也就冷淡下去；他们自然而然地又回到老路上去；就像我们看见一只狗因为吃了某种东西得了病，在它病的期间，它把什么都一古脑儿吐了出来；它并不是自愿这样做（如果我们可以说狗有意志的话） ，而是因为食物在它肚子里作怪。可是，它的病一好，它的肠胃也舒服了；它并不讨厌自己所吐出来的东西，因此又回过头来把一切都吃下肚去；由此看来， 《圣经》上写的可不假，2“狗所吐的它转过来又吃。”所以我说，如果只是因", "为认识到地狱的折磨，又害怕这种折磨，因而热衷于天堂，那么，对地狱的观念和对沉沦的恐惧一旦冷淡了，他们对天堂和得救的渴望也会跟着冷淡下去。因此就发生了这样的事：当他们知罪的心和恐惧一消失，他们对天堂和幸福的渴望也就不再存在，那时候他们就回到老路上去了。2．另一个原因是：他们被一种奴隶性的恐惧所控制，我现在说的是他们对人们的恐惧； 3“因为惧怕人的，陷入罗网。”因此，虽然当地狱的火焰快要烧着他们的耳朵的时候他们好像很热衷于天堂，可是到那种恐怖心稍微差一点的时候，他们又改变了主意 ——那就是：放聪明些有好处的，还是不要", "冒那失去一切的危险吧（他们之所以会产生这种想法，是因为他们什么也不懂） ，或者至少不要给自己带来不可避免和不必要的麻烦吧；于是他们又随俗了。3．宗教所给他们带来的羞辱也成为一种阻碍；他们傲慢、自大，在他们看来宗教是卑微、下贱的；因此当他们失去对地狱和将来的天罚的观念的时候，他们又回到老路上去。4．认识到自己的罪和思考将来可怕的光景，对他们来说是痛苦的。在苦难没有临到头上之前，他们不愿意正视它；虽然，如果他们愿意正视那些苦难的话，也许他们一看到它就会逃到正义的人为了避难所投奔的地方去；不过就像我前面所指出的，他们不愿意想起罪和以后那种恐怖的光景，因此，一旦他们摆脱了对神的愤怒和恐怖的觉悟，他", "们就乐于硬起心肠，选择了会使他们心肠越来越硬的道路。", "基督徒说：你这话真是一针见血，因为根本问题是在他们没有改变心意；因此他们就像站在法官面前的罪大恶极的罪犯。他浑身打战，好像真心真意地悔改，可是实际上却是由于害怕绞索；显然，他并不是真的对犯罪感到厌恶，因为，只要他得到了自由，他还要行窃，还要做一个恶棍；反过来，要是他从心底里改变过来，他就不会这样。", "盼望说：我已经把他们堕落的原因讲给你听了，现在请你讲讲他们怎样堕落。", "基督徒说：我很愿意讲：——1．他们把所有凡是有关神、死亡和将来的审判的念头全都抛在脑后。2．接着他们渐渐抛开个人的义务，如在私室里祈祷，压制欲望，警戒，为犯罪痛苦等等。3．然后他们躲避活泼、热心的基督徒们。4．这以后他们对听道、看《圣经》 、参加聚会这一类的义务渐渐冷淡。5．接下来，他们开始，就像我们说的，在虔诚的人身上找错儿，而且穷凶极恶地挑剔，目的是要显得把宗教抛到九霄云外是有理由的（因为他们在那些人身上看到了某些缺点） 。6．于是他们开始跟世俗的、放荡的和淫邪的人为伍。7．接着他们就暗地里开始世俗的放肆的谈论；如果他们看见被认为正派的人也这样做，他们就很", "高兴，因为他们可以仿效他们，更大胆地做起来。8．这以后他们开始公开地犯小罪。9．然后，他们硬起心肠，原形毕露。这样又给送进苦难的深渊。这时候，除非受到了出乎恩典的奇迹的拦阻，他们将永远在自欺中灭亡。"], "en_paras": ["3. It begetteth and continueth in the soul a great reverence of God, his Word, and ways, keeping it tender, and making it afraid to turn from them, to the right hand or to the left, to anything that may dishonour God, break its peace, grieve the Spirit, or cause the enemy to speak reproachfully.", "HOPE. Well said; I believe you have said the truth. Are we now almost got past the Enchanted Ground?", "CHR. Why, art thou weary of this discourse?", "HOPE. No, verily, but that I would know where we are.", "CHR. We have not now above two miles further to go thereon. But let us return to our matter. Now the ignorant know not that such convictions as tend to put them in fear are for their good, and therefore they seek to stifle them.", "HOPE. How do they seek to stifle them?", "CHR. 1. They think that those fears are wrought by the devil, (though indeed they are wrought of God); and, thinking so, they resist them as things that directly tend to their overthrow.", "2. They also think that these fears tend to the spoiling of their faith, when, alas, for them, poor men that they are, they have none at all! and therefore they harden their hearts against them.", "3. They presume they ought not to fear; and, therefore, in despite of them, wax presumptuously confident.", "4. They see that those fears tend to take away from them their pitiful old self-holiness, and therefore they resist them with all their might.", "HOPE. I know something of this myself; for, before I knew myself, it was so with me.", "CHR. Well, we will leave, at this time, our neighbour Ignorance by himself, and fall upon another profitable question.", "HOPE. With all my heart, but you shall still begin.", "CHR. Well then, did you not know, about ten years ago, one Temporary in your parts, who was a forward man in religion then?", "HOPE. Know him! yes, he dwelt in Graceless, a town about two miles off of Honesty, and he dwelt next door to one Turnback.", "CHR. Right, he dwelt under the same roof with him. Well, that man was much awakened once; I believe that then he had some sight of his sins, and of the wages that were due thereto.", "HOPE. I am of your mind, for, my house not being above three miles from him, he would ofttimes come to me, and that with many tears. Truly I pitied the man, and was not altogether without hope of him; but one may see, it is not every one that cries, Lord, Lord.", "CHR. He told me once that he was resolved to go on pilgrimage, as we do now; but all of a sudden he grew acquainted with one Save-self, and then he became a stranger to me.", "HOPE. Now, since we are talking about him, let us a little inquire into the reason of the sudden backsliding of him and such others.", "CHR. It may be very profitable, but do you begin.", "HOPE. Well, then, there are in my judgment four reasons for it:--", "1. Though the consciences of such men are awakened, yet their minds are not changed; therefore, when the power of guilt weareth away, that which provoked them to be religious ceaseth, wherefore they naturally turn to their own course again, even as we see the dog that is sick of what he has eaten, so long as his sickness prevails he vomits and casts up all; not that he doth this of a free mind (if we may say a dog has a mind), but because it troubleth his stomach; but now, when his sickness is over, and so his stomach eased, his desire being not at all alienate from his vomit, he turns him about and licks up all, and so it is true which is written, \"The dog is turned to his own vomit again.\" [2 Pet. 2:22] Thus I say, being hot for heaven, by virtue only of the sense and fear of the torments of hell, as their sense of hell and the fears of damnation chills and cools, so their desires for heaven and salvation cool also. So then it comes to pass, that when their guilt and fear is gone, their desires for heaven and happiness die, and they return to their course again.", "2. Another reason is, they have slavish fears that do overmaster them; I speak now of the fears that they have of men, for \"the fear of man bringeth a snare\". [Prov. 29:25] So then, though they seem to be hot for heaven, so long as the flames of hell are about their ears, yet when that terror is a little over, they betake themselves to second thoughts; namely, that it is good to be wise, and not to run (for they know not what) the hazard of losing all, or, at least, of bringing themselves into unavoidable and unnecessary troubles, and so they fall in with the world again.", "3. The shame that attends religion lies also as a block in their way; they are proud and haughty; and religion in their eye is low and contemptible, therefore, when they have lost their sense of hell and wrath to come, they return again to their former course.", "4. Guilt, and to meditate terror, are grievous to them. They like not to see their misery before they come into it; though perhaps the sight of it first, if they loved that sight, might make them fly whither the righteous fly and are safe. But because they do, as I hinted before, even shun the thoughts of guilt and terror, therefore, when once they are rid of their awakenings about the terrors and wrath of God, they harden their hearts gladly, and choose such ways as will harden them more and more.", "CHR. You are pretty near the business, for the bottom of all is for want of a change in their mind and will. And therefore they are but like the felon that standeth before the judge, he quakes and trembles, and seems to repent most heartily, but the bottom of all is the fear of the halter; not that he hath any detestation of the offence, as is evident, because, let but this man have his liberty, and he will be a thief, and so a rogue still, whereas, if his mind was changed, he would be otherwise.", "HOPE. Now I have showed you the reasons of their going back, do you show me the manner thereof.", "CHR. So I will willingly.", "1. They draw off their thoughts, all that they may, from the remembrance of God, death, and judgment to come.", "2. Then they cast off by degrees private duties, as closet prayer, curbing their lusts, watching, sorrow for sin, and the like.", "3. Then they shun the company of lively and warm Christians.", "4. After that they grow cold to public duty, as hearing, reading, godly conference, and the like.", "5. Then they begin to pick holes, as we say, in the coats of some of the godly; and that devilishly, that they may have a seeming colour to throw religion (for the sake of some infirmity they have espied in them) behind their backs.", "6. Then they begin to adhere to, and associate themselves with, carnal, loose, and wanton men.", "7. Then they give way to carnal and wanton discourses in secret; and glad are they if they can see such things in any that are counted honest, that they may the more boldly do it through their example.", "8. After this they begin to play with little sins openly.", "9. And then, being hardened, they show themselves as they are. Thus, being launched again into the gulf of misery, unless a miracle of grace prevent it, they everlastingly perish in their own deceivings.", "Now I saw in my dream, that"]}]}, {"num": 21, "id": "chapter-19", "badge_label": "CHAPTER 21", "title_zh": "第十九章 渡过死亡河", "title_en": "Chapter 19: The River of Death", "desc": "进入满溢香气的有夫之妇福地；涉水死亡河：基督徒的恐惧与盼望的托住；踏上彼岸与天使军的荣耀列队迎接。", "blocks": [{"sub_zh": "进入满溢香气的有夫之妇福地", "sub_en": "Entering the Land of Beulah with Sweet Birds and Flowers", "zh_paras": ["这会儿我在梦里看见天路旅客走完着魔之地；进入有夫之妇的国土，那儿的空气甜蜜而愉快，他们的路在那块地上直接穿过，他们暂时在那儿歇下来。在那些日子里，婉转的鸟声不绝于耳，每天看见鲜花在地上出现，还听见大地上频频传来斑鸠的叫声。在这个地方，太阳不分昼夜地照耀着；因为这地方远离死荫谷，也不在绝望巨人的势力范围之内；他们从这儿也望不见怀疑堡垒。在这儿他们可以引颈眺望他们所要去的那个城市，也不时看见那个城里的一些居民；因为“发亮的人”常常到这儿来散步，因为这地方就在天堂的边缘。在这儿“新郎”和“新娘”重新订订婚约；是的，就在这儿，", "2“新郎怎样喜悦新娘，他们的神也要照样喜悦他们。”在这儿他们有吃不尽的谷子和喝不完的美酒；因为他们一路上所寻求的东西在这个地方都非常丰富。在这儿他们听到从那个城市发出来的喊声，高呼着， “对锡安的居民说，看哪，你的拯救者来到！看哪，他的赏赐在他那里！”那地方所有的居民都称他们为5“圣民、耶和华的赎民、被看顾的， ”等等。他们在这片地上散步的时候，他们比在离开天国更远的地方时欢乐得多，而他们的目的地就是天国；他们越走近那个城市，就把它的面貌看得越清楚。那个城是用珍珠宝石建造的，街道是用金子铺的；因此由于那个城的天然的荣光，以及阳光投射在上面的反映，基督徒因渴望而得病了。盼望也发", "过一两次同样的病。因此他们在那儿歇了一会儿，由于痛苦而喊出， “如果你们看到我的良人，告诉他我因思慕他而得病了。 ”到他们的病体恢复了一些，能勉强扶病上路的时候，他们又往前走，越走越近那个城，那一带有果子园、葡萄园和花园，所有园子的门都朝马路敞开着。他们走近那些园子的时候，见一个园丁迎面站在那儿；旅客们问他，这些良好的葡萄园和花园是谁的？那园丁回答说，它们是国王的，他为了自己的娱乐，也为了让旅客们得到安慰，在这儿设下了这些果园。于是园丁领他们进葡萄园，请他们随意摘食各种甘美的果子；他还领他们看国王常常散步的地方，和他喜欢在里面歇脚的亭子。他们就在这儿", "逗留，并且睡着了。我在梦里看见他们在这次睡梦中讲的话比他们在整个旅途中讲的话还要多；园丁看见我对这件事觉得奇怪，就对我说，你为什么觉得这件事耐人寻味呢？ “这些葡萄园里的葡萄非常可口，谁吃了它们，在睡着的时候就会讲话。”后来我看见他们睡醒了，他们准备上路往天国去。不过，像我刚才讲过的，阳光投射在那个城市上的反射2（因为城是精金的）是极端的辉煌灿烂，因此他们这时候还不能张眼观看，只能通过一种特别的器具观看。于是我看见他们往前走的时候，有两个穿着像金子般发亮的衣服的人走来迎接他们，他们脸上也发着光。他们问旅客们从哪儿来；他们告诉了他们。他们还问他们在哪儿住过，路上碰到哪些困难和危险，", "哪些安慰和欢乐；他们也一一告诉了他们。那两个前来迎接他们的人说，你们还要过两道难关，以后就抵达城里了。"], "en_paras": ["by this time the Pilgrims were got over the Enchanted Ground, and entering into the country of Beulah, whose air was very sweet and pleasant, the way lying directly through it, they solaced themselves there for a season. Yea, here they heard continually the singing of birds, and saw every day the flowers appear on the earth, and heard the voice of the turtle in the land. [Isa. 62:4, Song of Solomon 2:10-12] In this country the sun shineth night and day; wherefore this was beyond the Valley of the Shadow of Death, and also out of the reach of Giant Despair, neither could they from this place so much as see Doubting Castle. Here they were within sight of the city they were going to, also here met them some of the inhabitants thereof; for in this land the Shining Ones commonly walked, because it was upon the borders of heaven. In this land also, the contract between the bride and the bridegroom was renewed; yea, here, \"As the bridegroom rejoiceth over the bride, so did their God rejoice over them.\" [Isa. 62:5] Here they had no want of corn and wine; for in this place they met with abundance of what they had sought for in all their pilgrimage. [Isa. 62:8] Here they heard voices from out of the city, loud voices, saying, \"'Say ye to the daughter of Zion, Behold, thy salvation cometh! Behold, his reward is with him!' Here all the inhabitants of the country called them, 'The holy people, The redeemed of the Lord, Sought out'\", etc. [Isa. 62:11,12]", "Now as they walked in this land, they had more rejoicing than in parts more remote from the kingdom to which they were bound; and drawing near to the city, they had yet a more perfect view thereof. It was builded of pearls and precious stones, also the street thereof was paved with gold; so that by reason of the natural glory of the city, and the reflection of the sunbeams upon it, Christian with desire fell sick; Hopeful also had a fit or two of the same disease. Wherefore, here they lay by it a while, crying out, because of their pangs, If ye find my beloved, tell him that I am sick of love.", "But, being a little strengthened, and better able to bear their sickness, they walked on their way, and came yet nearer and nearer, where were orchards, vineyards, and gardens, and their gates opened into the highway. Now, as they came up to these places, behold the gardener stood in the way, to whom the Pilgrims said, Whose goodly vineyards and gardens are these? He answered, They are the King's, and are planted here for his own delight, and also for the solace of pilgrims. So the gardener had them into the vineyards, and bid them refresh themselves with the dainties. [Deut. 23:24] He also showed them there the King's walks, and the arbours where he delighted to be; and here they tarried and slept.", "Now I beheld in my dream that they talked more in their sleep at this time than ever they did in all their journey; and being in a muse thereabout, the gardener said even to me, Wherefore musest thou at the matter? It is the nature of the fruit of the grapes of these vineyards to go down so sweetly as to cause the lips of them that are asleep to speak.", "So I saw that when they awoke, they addressed themselves to go up to the city; but, as I said, the reflection of the sun upon the city (for the city was pure gold) was so extremely glorious that they could not, as yet, with open face behold it, but through an instrument made for that purpose. So I saw, that as I went on, there met them two men, in raiment that shone like gold; also their faces shone as the light. [Rev. 21:18, 2 Cor. 3:18]", "These men asked the Pilgrims whence they came; and they told them. They also asked them where they had lodged, what difficulties and dangers, what comforts and pleasures they had met in the way; and they told them. Then said the men that met them, You have but two difficulties more to meet with, and then you are in the city."]}, {"sub_zh": "涉水死亡河：基督徒的恐惧与盼望的托住", "sub_en": "Crossing the River of Death: Christian's Sinking & Hopeful's Cheer", "zh_paras": ["基督徒和他的同伴要求那两人陪伴他们同行，他们说他们很愿意。不过，他们说，你们一定得完全依靠自己的信心才能达到目的。于是我在梦里看见他们一起往前走，一直走到望得见天门的地方。我又看见在他们和天门之间有一条河；可是河上没有桥。河非常深。一看见这条河，旅客们急得目瞪口呆；跟他们一起走的那两个人说，你们得走过这条河，不然就不能到达天门。旅客们就问，有没有其他的路可以通到天门。他们回答说，有的；但是除了两个人就是——以诺和以利亚——以外，自从创世以来，没有一个人得到过允许走那条路，在最后的号角吹响以前也不会有。旅客们，尤其", "是基督徒，开始意气消沉，左顾右盼，但是找不出一条路可以避开那条河。然后他们问那两个人，河水是不是到处都一样深。他们说，并不都一样深；但是这件事他们是爱莫能助的；他们说，因为河水的深浅，完全要看你们对这地方的国王的信心而定。接着他们开始涉水，一下到河里，基督徒渐渐下沉，他向他的好伴侣喊着说，我在深水里沉下去了；波涛从我头上打过；他的波浪在我身上漫过。细拉。", "于是他的同伴说，别担心，我的兄弟；我碰到河底的，没有问题。这时，基督徒说，啊！我的朋友，死亡的痛苦把我团团围住；我见不到流奶与蜜的地了。这句话刚说出口，一片黑暗和恐怖笼罩了基督徒，他只觉得眼前茫茫然。他已经失去大部分的理智，既记不起也不能有条有理地讲出他在路上吃过的任何一种可口的食物。但是从他所有的话中还可以听出他心里是多么恐怖，他生怕自己会死在河里，永远进不了天门。旁观者也可以看出，他想起了他过去所犯的罪，以致心里非常烦恼，有的罪是在他走天路以前犯的，有的罪是在他走天路以后犯的。同时也看得出，邪灵鬼怪的显现扰乱了他的心灵；", "因为他的话语中不时都有这种暗示。", "盼望这时花了好大劲才扶住他兄弟，使他的头保持在水面上；是的，有时候他完全沉了下去，接着，不一会儿，他又浮了上来，半死不活的。盼望还想尽办法安慰他说，兄弟，我望得见天门，那儿有好多人站着迎接我们呢。基督徒只回答道，他们是在等你；自从我认识你至今，你始终就是满怀希望的一个人。盼望说，你也是这样的啊。基督徒说，啊，兄弟，要是我没错的话，他这会儿总会出现来拯救我的；但是由于我犯了罪，他把我带进了陷阱，并且把我丢在那儿。于是盼望说，我的兄弟，你完全忘了《圣经》上记载的关于邪罪的人的话， “他们死的时候，没有疼痛，他们的力气却", "也壮实。他们不像别人受苦，也不像别人遭灾。”你在水中所经历的这些烦恼和痛苦并不表明神把你丢弃了；神是利用这些烦恼和痛苦来考验你，看你会不会想起你过去从他那儿得到的好处，在苦难中会不会靠他生活。"], "en_paras": ["Christian then, and his companion, asked the men to go along with them; so they told them they would. But, said they, you must obtain it by your own faith. So I saw in my dream that they went on together, until they came in sight of the gate.", "Now, I further saw, that betwixt them and the gate was a river, but there was no bridge to go over: the river was very deep. At the sight, therefore, of this river, the Pilgrims were much stunned; but the men that went in with them said, You must go through, or you cannot come at the gate.", "The Pilgrims then began to inquire if there was no other way to the gate; to which they answered, Yes; but there hath not any, save two, to wit, Enoch and Elijah, been permitted to tread that path since the foundation of the world, nor shall, until the last trumpet shall sound. [1 Cor. 15:51,52] The Pilgrims then, especially Christian, began to despond in their minds, and looked this way and that, but no way could be found by them by which they might escape the river. Then they asked the men if the waters were all of a depth. They said: No; yet they could not help them in that case; for, said they, you shall find it deeper or shallower as you believe in the King of the place.", "*In the Resurrection of the Righteous. [Rev. 20:4-6]", "They then addressed themselves to the water and, entering, Christian began to sink, and crying out to his good friend Hopeful, he said, I sink in deep waters; the billows go over my head, all his waves go over me! Selah.", "Christian's conflict at the hour of death"]}, {"sub_zh": "踏上彼岸与天使军的荣耀列队迎接", "sub_en": "Ascending the Celestial Bank & Received by Myriads of Angels", "zh_paras": ["然后我在梦里看见基督徒沉思了一会儿。盼望又对他讲了这几句话，别灰心；基督耶稣会保全你。", "基督徒听了这话，大声喊道，哦，我又看见他啦！他对我说，2“你从水中经过，我必与你同在；你趟过江河，水必不漫过你。”他们两人都大大鼓舞，这以后水就像石头那样稳定，直到他们走过了整条河。不久基督徒脚踏实地，后来一路上水都很浅。他们就这样走过了河。他们看见那两个发亮的人又出现在那边岸上，正等候着他们，因此他们一出了水，那两人就向他们招呼，并且说，3“我们是服役的灵，奉差遣为那将要承受救恩的人效力。”他们就这样向天门走去。你得注意这个城市是在一座雄伟的山上；可是两个旅客轻易地走上山，因为那两个人搀扶着他们走，而且他们把他们尘世的衣服也丢在河里；虽然他们进去的时候还穿着那些衣服，走出河的时候，", "他们就不穿了。因此虽然这个城市的地基比云朵还要高；他们上山的时候步子轻快敏捷；他们通过天空的领域，一面走，一面温和地谈话，因为他们已经安全地渡过河，并且有这样荣耀的伙伴伴送着，因此心情非常愉快。他们跟发亮的人谈的是关于那个地方的壮丽；后者告诉他们，那个地方的美丽和荣华是无法描述的。他们说，那儿是4“锡安山，就是天上的耶路撒冷，那里有千万的天使，和被成全之义人的灵魂。”他们说，你们现在是到神的乐园里去，在那儿你们会看见生命树，吃它那永不凋谢的果子；到了那儿，他们会给你们穿上白你们每天可以跟国王一起谈天、散步，直到永永远远。在那儿，你们不会再看见你们在地上看到的东西 ——也就是悲痛、", "疾病、苦难和死亡；2“因为从前的事情已经过去。”你们现在是到亚伯拉罕、以扫、雅各和众先知那儿去——他们都是神不让遭难的人，现在3“都在床上安息着，每个人正直地走着。”", "基督徒和盼望渡死亡河.客人们就问，我们在圣地得做些什么？他们回答说，你们得在那儿享受你们过去劳苦的报酬，为你们所受过的苦难而欢乐；你们得收获你们所种植的，就是你们一路上为国王所做的祈祷、所流的眼泪和所受的痛苦。在那儿你们得戴金的冠冕，能够永远瞻仰神；因为5“在那儿你们会看见他的真体。”在那儿你们会不断赞美他，一面呼喊一面感恩，你们在世间的时候也想服侍他；但是由于肉体的软弱，所以那时觉得非常困难。在那儿，你们看得见神，听得见他那令人无限欣慰的声音，耳目也都喜悦。在那儿，你们会遇到在你们之前上那儿去的朋友，重温友情；你们也会欢欣地迎接每一个继你们之后", "到达圣地的人。在那儿你们会穿上荣耀尊严的衣服，坐在配得上和荣耀的国王并驾齐驱的车马上。当他随着喇叭的响声腾云驾雾而来，你们也跟他一起来；当他坐在审判宝座上，你们也坐在他的身旁；不仅如此，当他宣判所有不义的人的时候，不管审判的是天使抑或凡人，你们在那时候也有发言权，因为那些人既是他的敌人，那么也是你们的敌人。当他回到城里去的时候，你们也随着号角声回去，3永远跟他在一起。"], "en_paras": ["Then said the other, Be of good cheer, my brother, I feel the bottom, and it is good. Then said Christian, Ah! my friend, the sorrows of death hath compassed me about; I shall not see the land that flows with milk and honey; and with that a great darkness and horror fell upon Christian, so that he could not see before him. Also here he in great measure lost his senses, so that he could neither remember nor orderly talk of any of those sweet refreshments that he had met with in the way of his pilgrimage. But all the words that he spake still tended to discover that he had horror of mind, and heart fears that he should die in that river, and never obtain entrance in at the gate. Here also, as they that stood by perceived, he was much in the troublesome thoughts of the sins that he had committed, both since and before he began to be a pilgrim. It was also observed that he was troubled with apparitions of hobgoblins and evil spirits, for ever and anon he would intimate so much by words. Hopeful, therefore, here had much ado to keep his brother's head above water; yea, sometimes he would be quite gone down, and then, ere a while, he would rise up again half dead. Hopeful also would endeavour to comfort him, saying, Brother, I see the gate, and men standing by to receive us: but Christian would answer, It is you, it is you they wait for; you have been Hopeful ever since I knew you. And so have you, said he to Christian. Ah! brother! said he, surely if I was right he would now arise to help me; but for my sins he hath brought me into the snare, and hath left me. Then said Hopeful, My brother, you have quite forgot the text, where it is said of the wicked, \"There are no bands in their death, but their strength is firm. They are not in trouble as other men, neither are they plagued like other men. [Ps. 73:4,5] These troubles and distresses that you go through in these waters are no sign that God hath forsaken you; but are sent to try you, whether you will call to mind that which heretofore you have received of his goodness, and live upon him in your distresses.", "Then I saw in my dream, that Christian was as in a muse a while. To whom also Hopeful added this word, Be of good cheer, Jesus Christ maketh thee whole; and with that Christian brake out with a loud voice, Oh, I see him again! and he tells me, \"When thou passest through the waters, I will be with thee, and through the rivers, they shall not overflow thee.\" [Isa. 43:2] Then they both took courage, and the enemy was after that as still as a stone, until they were gone over. Christian therefore presently found ground to stand upon, and so it followed that the rest of the river was but shallow. Thus they got over. Now, upon the bank of the river, on the other side, they saw the two shining men again, who there waited for them; wherefore, being come out of the river, they saluted them, saying, We are ministering spirits, sent forth to minister for those that shall be heirs of salvation. Thus they went along towards the gate.", "Now you must note that the city stood upon a mighty hill, but the Pilgrims went up that hill with ease, because they had these two men to lead them up by the arms; also, they had left their mortal garments behind them in the river, for though they went in with them, they came out without them. They, therefore, went up here with much agility and speed, though the foundation upon which the city was framed was higher than the clouds. They therefore went up through the regions of the air, sweetly talking as they went, being comforted, because they safely got over the river, and had such glorious companions to attend them.", "Now, now, look how the holy pilgrims ride, Clouds are their chariots, angels are their guide: Who would not here for him all hazards run, That thus provides for his when this world's done?", "The talk they had with the Shining Ones was about the glory of the place; who told them that the beauty and glory of it was inexpressible. There, said they, is the Mount Zion, the heavenly Jerusalem, the innumerable company of angels, and the spirits of just men made perfect. [Heb. 12:22-24] You are going now, said they, to the paradise of God, wherein you shall see the tree of life, and eat of the never-fading fruits thereof; and when you come there, you shall have white robes given you, and your walk and talk shall be every day with the King, even all the days of eternity. [Rev. 2:7, 3:4, 21:4,5] There you shall not see again such things as you saw when you were in the lower region upon the earth, to wit, sorrow, sickness, affliction, and death, for the former things are passed away. You are now going to Abraham, to Isaac, and Jacob, and to the prophets--men that God hath taken away from the evil to come, and that are now resting upon their beds, each one walking in his righteousness. [Isa. 57:1,2, 65:17] The men then asked, What must we do in the holy place? To whom it was answered, You must there receive the comforts of all your toil, and have joy for all your sorrow; you must reap what you have sown, even the fruit of all your prayers, and tears, and sufferings for the King by the way. [Gal. 6:7] In that place you must wear crowns of gold, and enjoy the perpetual sight and vision of the Holy One, for there you shall see him as he is. [1 John 3:2] There also you shall serve him continually with praise, with shouting, and thanksgiving, whom you desired to serve in the world, though with much difficulty, because of the infirmity of your flesh. There your eyes shall be delighted with seeing, and your ears with hearing the pleasant voice of the Mighty One. There you shall enjoy your friends again that are gone thither before you; and there you shall with joy receive, even every one that follows into the holy place after you. There also shall you be clothed with glory and majesty, and put into an equipage fit to ride out with the King of Glory. When he shall come with sound of trumpet in the clouds, as upon the wings of the wind, you shall come with him; and when he shall sit upon the throne of judgment; you shall sit by him; yea, and when he shall pass sentence upon all the workers of iniquity, let them be angels or men, you also shall have a voice in that judgment, because they were his and your enemies. [1 Thes. 4:13-16, Jude 1:14, Dan. 7:9,10, 1 Cor. 6:2,3] Also, when he shall again return to the city, you shall go too, with sound of trumpet, and be ever with him.", "Now while they were thus drawing towards the gate, behold a company of the"]}]}, {"num": 22, "id": "chapter-20", "badge_label": "CHAPTER 22", "title_zh": "第二十章 荣美天门", "title_en": "Chapter 20: The Celestial City", "desc": "穿过璀璨天门与穿上灿烂金衣；无知无凭据遭天使扔入地狱旁门。", "blocks": [{"sub_zh": "穿过璀璨天门与穿上灿烂金衣", "sub_en": "Entering the Golden Gate of Mount Zion in Transfigured Robes", "zh_paras": ["当他们这样谈着走近天门的时候，一大群天使军出来迎接他们；那两个发亮的人对这些天兵天将说，这两个人在世间就热爱我们的主，为了他的圣名而牺牲了一切；我们的主派我们去迎接他们，我们在他们乐于行走的路上把他们带到这儿，好让他们进去，瞻仰他们的救主。于是天使军大声喊说，4“凡被请赴羔羊之婚宴的有福了。”这时好几个国王的号角手也出来欢迎了，他们穿着又白又亮的衣服，他们那悦耳而嘹亮的声音使天空都发出回响。这些号角手用千万个呼声欢迎基督徒和他的伙伴；他们一面呼喊，一面吹着号角。这以后，他们簇拥着基督徒和盼望，有的在前，有的在后，有的在左，有的在右（好像保护着他", "们通过较高的领域） ，不断地吹号角，发出嘹亮的声音，响彻云霄；谁看见了那一幕景象都会以为整个天界下来迎接他们了。他们这样一起走着；一面走的时候，那些号角手不时用欢乐的声音，再加上乐声和脸色跟姿势向基督徒和他的兄弟表示他们多么欢迎他们来参加他们的队伍，多么高兴来迎接他们。因此这两个人虽然还没有到天堂，就好像已经在天堂里了，他们见到前前后后都是天使，满耳都是他们美妙的声音。从这儿他们也望得见天国；他们好像听到天国里所有的钟都在响，都在欢迎他们。尤其是当他们带着温暖和欢欣的心情想到他们自己也会住在那儿，永远跟这些人作伴——哦，", "怎样才能表达他们无上的欢乐啊！他们像这样欢欢乐乐地走到了天门。他们就这样走过了河.当他们走到天门的时候，只见上面有金字写着： ——“那些洗净自己衣服的有福了，可得权柄能到生命树那里，也能从门进城。”接着我在梦里看见那两个发亮的人吩咐他们朝着天门呼喊；他们照着做了，上面有几个人探出头来张望——他们是以诺、摩西和以利亚等人 ——有人对他们说，这些旅客是从毁灭城来的，因为他们热爱这地方的国王。然后两个旅客就把自己当初拿到的证件递给他们，接着又把这些证件送呈国王，祂看了之后说，这两个人在哪儿？有人回答道，他们站在门外。国王就吩咐开门，祂说：2“使守信的"], "en_paras": ["heavenly host came out to meet them; to whom it was said, by the other two Shining Ones, These are the men that have loved our Lord when they were in the world, and that have left all for his holy name; and he hath sent us to fetch them, and we have brought them thus far on their desired journey, that they may go in and look their Redeemer in the face with joy. Then the heavenly host gave a great shout, saying, \"Blessed are they which are called unto the marriage supper of the Lamb.\" [Rev. 19:9] There came out also at this time to meet them, several of the King's trumpeters, clothed in white and shining raiment, who, with melodious noises, and loud, made even the heavens to echo with their sound. These trumpeters saluted Christian and his fellow with ten thousand welcomes from the world; and this they did with shouting, and sound of trumpet.", "This done, they compassed them round on every side; some went before, some behind, and some on the right hand, some on the left, (as it were to guard them through the upper regions), continually sounding as they went, with melodious noise, in notes on high: so that the very sight was, to them that could behold it, as if heaven itself was come down to meet them. Thus, therefore, they walked on together; and as they walked, ever and anon these trumpeters, even with joyful sound, would, by mixing their music with looks and gestures, still signify to Christian and his brother, how welcome they were into their company, and with what gladness they came to meet them; and now were these two men, as it were, in heaven, before they came at it, being swallowed up with the sight of angels, and with hearing of their melodious notes. Here also they had the city itself in view, and they thought they heard all the bells therein to ring, to welcome them thereto. But above all, the warm and joyful thoughts that they had about their own dwelling there, with such company, and that for ever and ever. Oh, by what tongue or pen can their glorious joy be expressed! And thus they came up to the gate.", "Now, when they were come up to the gate, there was written over it in letters of gold, \"Blessed are they that do his commandments, that they may have right to the tree of life, and may enter in through the gates into the city.\" [Rev. 22:14]", "Then I saw in my dream that the Shining Men bid them call at the gate; the which, when they did, some looked from above over the gate, to wit, Enoch, Moses, and Elijah, &c., to whom it was said, These pilgrims are come from the City of Destruction, for the love that they bear to the King of this place; and then the Pilgrims gave in unto them each man his certificate, which they had received in the beginning; those, therefore, were carried in to the King, who, when he had read them, said, Where are the men? To whom it was answered, They are standing without the gate. The King then commanded to open the gate, \"That the righteous nation,\" said he, \"which keepeth the truth, may enter in.\" [Isa. 26:2]"]}, {"sub_zh": "无知无凭据遭天使扔入地狱旁门", "sub_en": "Ignorance Ferryed by Vain-hope and Cast into the By-way to Hell", "zh_paras": ["义民得以进入。”我在梦里看见这两个人走进天门；看呀！他们一走进门，就变了形，穿上了像黄金那样发亮的衣服。还有拿着竖琴和冠冕的天使迎接他们，把那些东西递给他们；竖琴是作为赞美用的，冠冕是荣耀的象征。接着我在梦里听见所有城里的钟又都在为这场欢乐而叮叮当当敲了起来，有人对他们说， “来参加主的欢乐。”我还听见那些人高声地唱，3“但愿颂赞、尊贵、荣耀、权势都归给坐宝座的和羔羊，直到永永远远。”正当门给打开让他们进去的时候，我从他们后面望进去，哎呀，城里像太阳那样发着光；街道也是用金子铺的；在里面走着的人都头戴冠冕，手拿棕榈枝和唱赞美歌用的金竖琴。", "还有长着翅膀的人，他们不断地说， “圣哉，圣哉，圣哉我们的主！”这以后，他们把门关上；我看到这儿，心里真巴不得自己也跟门里面的人在一起。当我注视这一切的时候，我回头往后面看了一下，我看见无知来到河边；他却很快就渡过了河，不像那两个人遇到那么多困难。因为正好那时有一个名叫空想的摆渡人在那儿，他用船把他带过了河；因此无知，像我刚才看见的那两个人一样，也爬上小山向天门走去；不过他只一个人走着，并且没有人来迎接他，给他任何鼓励。他一走到天门前面，仰头看上面写着的字，然后开始敲门，满以为里面的人会很快替他开门；可是从门上面望出来", "的人问他，你从哪儿来？你来干什么？他回答说，我在国王面前已经吃过喝过，他在我们街上教导过我们。于是他们向他要证件，好拿去给国王看，他就伸手到怀里，掏了半天，还是掏不出什么来。然后他们问，你没有证件吗？那个人一言不发。于是他们就去报告国王；可是祂不肯下来见他，而吩咐领基督徒和盼望进城的那两个发亮的人去把无知手脚绑起来，打发掉。接着他们把他提起来，带过空中，到我所看见的小山旁边那扇门那儿，把他推进门去。这时我才知道，即使在天门，也有通到地狱的路，就像毁灭城一样。这时候我醒了过来，啊，原来是一场梦呢。", "这时候我醒了过来，啊，原来是一场梦呢。"], "en_paras": ["Now I saw in my dream that these two men went in at the gate: and lo, as they entered, they were transfigured, and they had raiment put on that shone like gold. There was also that met them with harps and crowns, and gave them to them--the harps to praise withal, and the crowns in token of honour. Then I heard in my dream that all the bells in the city rang again for joy, and that it was said unto them, \"ENTER YE INTO THE JOY OF YOUR LORD.\" I also heard the men themselves, that they sang with a loud voice, saying, \"BLESSING AND HONOUR, AND GLORY, AND POWER, BE UNTO HIM THAT SITTETH UPON THE THRONE, AND UNTO THE LAMB, FOR EVER AND EVER.\" [Rev. 5:13]", "Now, just as the gates were opened to let in the men, I looked in after them, and, behold, the City shone like the sun; the streets also were paved with gold, and in them walked many men, with crowns on their heads, palms in their hands, and golden harps to sing praises withal.", "There were also of them that had wings, and they answered one another without intermission, saying, \"Holy, holy, holy is the Lord.\" [Rev. 4:8] And after that they shut up the gates; which, when I had seen, I wished myself among them.", "Now while I was gazing upon all these things, I turned my head to look back, and saw Ignorance come up to the river side; but he soon got over, and that without half that difficulty which the other two men met with. For it happened that there was then in that place, one Vain-hope, a ferryman, that with his boat helped him over; so he, as the other I saw, did ascend the hill, to come up to the gate, only he came alone; neither did any man meet him with the least encouragement. When he was come up to the gate, he looked up to the writing that was above, and then began to knock, supposing that entrance should have been quickly administered to him; but he was asked by the men that looked over the top of the gate, Whence came you, and what would you have? He answered, I have eat and drank in the presence of the King, and he has taught in our streets. Then they asked him for his certificate, that they might go in and show it to the King; so he fumbled in his bosom for one, and found none. Then said they, Have you none? But the man answered never a word. So they told the King, but he would not come down to see him, but commanded the two Shining Ones that conducted Christian and Hopeful to the City, to go out and take Ignorance, and bind him hand and foot, and have him away. Then they took him up, and carried him through the air to the door that I saw in the side of the hill, and put him in there. Then I saw that there was a way to hell, even from the gates of heaven, as well as from the City of Destruction. So I awoke, and behold it was a dream.", "The Conclusion."]}]}, {"num": 23, "id": "chapter-conclusion", "badge_label": "CHAPTER 23", "title_zh": "尾语：做梦人的结语", "title_en": "The Conclusion", "desc": "做梦人的诚挚结语与读者鉴察；善解此梦与天路同行祝福。", "blocks": [{"sub_zh": "做梦人的诚挚结语与读者鉴察", "sub_en": "The Dreamer's Conclusion: Discerning the Substance of the Vision", "zh_paras": ["读者，我已经把我的梦向你说明；看你能不能把它解释给我听，能不能给你自己，给你邻居解释一番：可千万别解释错了；若是那样，不但毫无益处，只有把你自己欺蒙：由于误解，还会后患无穷。你还得小心，千万不要过分拘泥于我这场梦的外表的情景；也不要让我的词藻或比喻使你发笑或使你厌恶。这是小孩或者傻瓜做的事；至于你，要看到内容和实质。拉开帘子，朝幕后张望，弄明白我的隐喻，千万要细细思量。只要你肯探求，你就会发现这些隐喻对于一颗纯洁的心有多大的帮助。大胆地抛弃你在那里面发现的渣滓，可是千万要把真金保留下来。要是我的金子是包在矿石里，又将怎样？"], "en_paras": ["Now, Reader, I have told my dream to thee; See if thou canst interpret it to me, Or to thyself, or neighbour; but take heed Of misinterpreting; for that, instead Of doing good, will but thyself abuse: By misinterpreting, evil ensues.", "Take heed, also, that thou be not extreme, In playing with the outside of my dream: Nor let my figure or similitude Put thee into a laughter or a feud. Leave this for boys and fools; but as for thee, Do thou the substance of my matter see."]}, {"sub_zh": "善解此梦与天路同行祝福", "sub_en": "A Loving Farewell and Spiritual Blessing to Every Pilgrim", "zh_paras": ["谁也不会丢掉苹果而把果核贮藏。要是你认为它微不足道而全部抛弃，也许我将因此再度步入梦里。── 约翰班扬"], "en_paras": ["Put by the curtains, look within my veil, Turn up my metaphors, and do not fail, There, if thou seekest them, such things to find, As will be helpful to an honest mind.", "What of my dross thou findest there, be bold To throw away, but yet preserve the gold; What if my gold be wrapped up in ore?-- None throws away the apple for the core. But if thou shalt cast all away as vain, I know not but 'twill make me dream again.", "*** END OF THE PROJECT GUTENBERG EBOOK 131 ***"]}]}]};

    function paginateAndRender() {

      const savedChNum = getActiveChapterNum();

        const headerHtml = `

        `;

        curHtml = headerHtml;

        for (const block of ch.blocks) {
          const subTitle = (currentLang === 'en' && block.sub_en) ? block.sub_en : block.sub_zh;
          if (subTitle) {
            const subHtml = `<div class="subheading-banner">${subTitle}</div>`;
            measure.innerHTML = curHtml + subHtml;
            if (measure.scrollHeight > targetHeight && curHtml !== headerHtml) {
              PAGES.push({
                chapterNum: ch.num,
                chapterTitle: ch.title_zh,
                chapterTitleEn: ch.title_en,
                isChFirst,
                html: curHtml
              });
              isChFirst = false;
              curHtml = subHtml;
            } else {
              curHtml += subHtml;
            }
          }

          const paras = (currentLang === 'en' && block.en_paras && block.en_paras.length > 0) ? block.en_paras : block.zh_paras;
          for (let pIdx = 0; pIdx < paras.length; pIdx++) {
            let p = paras[pIdx];
            let isParaStart = true;

            while (p.length > 0) {
              let pFormatted = '';
              if (isChFirst && curHtml === headerHtml && isParaStart && p.length > 0) {
                const firstChar = p.charAt(0);
                const rest = p.slice(1);
                pFormatted = `<p><span class="drop-cap">${firstChar}</span>${rest}</p>`;
              } else if (isParaStart) {
                pFormatted = `<p>${p}</p>`;
              } else {
                pFormatted = `<p class="p-continue">${p}</p>`;
              }

              measure.innerHTML = curHtml + pFormatted;
              if (measure.scrollHeight <= targetHeight) {
                curHtml += pFormatted;
                p = '';
              } else {
                // Overflows: binary search maximum fitting prefix
                let low = 1;
                let high = p.length;
                let bestFit = 0;

                while (low <= high) {
                  const mid = Math.floor((low + high) / 2);
                  let testFrag = '';
                  if (isChFirst && curHtml === headerHtml && isParaStart && mid > 0) {
                    testFrag = `<p><span class="drop-cap">${p[0]}</span>${p.slice(1, mid)}</p>`;
                  } else if (isParaStart) {
                    testFrag = `<p>${p.slice(0, mid)}</p>`;
                  } else {
                    testFrag = `<p class="p-continue">${p.slice(0, mid)}</p>`;
                  }

                  measure.innerHTML = curHtml + testFrag;
                  if (measure.scrollHeight <= targetHeight) {
                    bestFit = mid;
                    low = mid + 1;
                  } else {
                    high = mid - 1;
                  }
                }

                if (bestFit >= 20) {
                  const prefix = p.slice(0, bestFit);
                  const punctMatch = prefix.search(/[，。！？；、：“”‘’（）《》][^，。！？；、：“”‘’（）《》]*$/);
                  if (punctMatch !== -1 && punctMatch >= bestFit - 14) {
                    bestFit = punctMatch + 1;
                  }

                  let fitHtml = '';
                  if (isChFirst && curHtml === headerHtml && isParaStart) {
                    fitHtml = `<p><span class="drop-cap">${p[0]}</span>${p.slice(1, bestFit)}</p>`;
                  } else if (isParaStart) {
                    fitHtml = `<p>${p.slice(0, bestFit)}</p>`;
                  } else {
                    fitHtml = `<p class="p-continue">${p.slice(0, bestFit)}</p>`;
                  }

                  curHtml += fitHtml;
                  PAGES.push({
                    chapterNum: ch.num,
                    chapterTitle: ch.title_zh,
                    chapterTitleEn: ch.title_en,
                    isChFirst,
                    html: curHtml
                  });
                  isChFirst = false;
                  curHtml = '';
                  p = p.slice(bestFit);
                  isParaStart = false;
                } else {
                  if (curHtml.trim().length > 0) {
                    PAGES.push({
                      chapterNum: ch.num,
                      chapterTitle: ch.title_zh,
                      chapterTitleEn: ch.title_en,
                      isChFirst,
                      html: curHtml
                    });
                    isChFirst = false;
                    curHtml = '';
                  }
                  curHtml = pFormatted;
                  p = '';
                }
              }
            }
          }
        }

        if (curHtml.trim().length > 0) {
          PAGES.push({
            chapterNum: ch.num,
            chapterTitle: ch.title_zh,
            chapterTitleEn: ch.title_en,
            isChFirst,
            html: curHtml
          });
        }
      }

      // Restore position or keep at Book Home (0)
      const urlParams = new URLSearchParams(window.location.search);
      const isStandalone = urlParams.has('standalone') || urlParams.has('isolated') || urlParams.has('focus') || urlParams.has('share') || window.location.hash.includes('standalone');

      if (isStandalone) {
        currentPageIdx = 0;
        currentSpreadIdx = 0;
      } else if (currentPageIdx > 0 && savedChNum > 1) {
        const targetCh = BOOK.chapters.find(c => c.num === savedChNum);
        if (targetCh && targetCh.startPage) {
          currentPageIdx = targetCh.startPage;
          currentSpreadIdx = Math.ceil(currentPageIdx / 2);
        }
      } else if (currentPageIdx > 0) {
        currentPageIdx = Math.max(1, Math.min(currentPageIdx, PAGES.length));
        currentSpreadIdx = Math.ceil(currentPageIdx / 2);
      } else {
        currentPageIdx = 0;
        currentSpreadIdx = 0;
      }

      isPaginating = false;
      renderCurrentView();
      renderToc();
    }

    function getActiveChapterNum() {
      if (currentPageIdx === 0) return 1;
      const curP = isSinglePageMode() ? PAGES[currentPageIdx - 1] : PAGES[(currentSpreadIdx * 2) - 2];
      return curP ? curP.chapterNum : 1;
    }

    function renderChapterDirectoryHtml() {
