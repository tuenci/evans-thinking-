terpreter?", "CHR. No; he took me and had me where he shewed me a stately palace, and how the people were clad in gold that were in it; and how there came a venturous man and cut his way through the armed men that stood in the door to keep him out, and how he was bid to come in, and win eternal glory. Methought those things did ravish my heart! I would have stayed at that good man's house a twelvemonth, but that I knew I had further to go.", "PIETY. And what saw you else in the way?", "CHR. Saw! why, I went but a little further, and I saw one, as I thought in my mind, hang bleeding upon the tree; and the very sight of him made my burden fall off my back, (for I groaned under a very heavy burden,) but then it fell down from off me. It was a strange thing to me, for I never saw such a thing before; yea, and while I stood looking up, for then I could not forbear looking, three Shining Ones came to me. One of them testified that my sins were forgiven me; another stripped me of my rags, and gave me this broidered coat which you see; and the third set the mark which you see in my forehead, and gave me this sealed roll. (And with that he plucked it out of his bosom.)", "PIETY. But you saw more than this, did you not?", "CHR. The things that I have told you were the best; yet some other matters I saw, as, namely--I saw three men, Simple, Sloth, and Presumption, lie asleep a little out of the way, as I came, with irons upon their heels; but do you think I could awake them? I also saw Formality and Hypocrisy come tumbling over the wall, to go, as they pretended, to Zion, but they were quickly lost, even as I myself did tell them; but they would not believe. But above all, I found it hard work to get up this hill, and as hard to come by the lions' mouths, and truly if it had not been for the good man, the porter that stands at the gate, I do not know but that after all I might have gone back again; but now I thank God I am here, and I thank you for receiving of me.", "Then Prudence thought good to ask him a few questions, and desired his answer to them.", "PRUD. Do you not think sometimes of the country from whence you came?", "Christian's thoughts of his native country", "CHR. Yes, but with much shame and detestation: \"Truly, if I had been mindful of that country from whence I came out, I might have had opportunity to have returned; but now I desire a better country, that is, an heavenly.\" [Heb. 11:15,16]"]}, {"sub_zh": "共进晚宴与倾心倾诉十架恩典", "sub_en": "The Evening Feast and Discourse on the Lord of the Hill", "zh_paras": ["基督徒说：我告诉你的都是最精采的；我还看到一些别的事，譬如 ——我看见三个人，愚蠢、懒惰和傲慢，当我一路走来的时候，见他们都上了脚镣睡在路旁边不远的地方；可是你想我能把他们叫醒吗？我还看见形式主义者和虚伪越墙而来，他们自称是要到锡安去的,可是他们不久就迷路了；我事先就告诉他们会有那样的结果，但是他们不相信。不过，所有这些事中最重要的是我发觉上这座山非常吃力，在那两头狮子身边走过也不简单，说真的，要没有那个好人，那个站在大门口的看门人，说不定我终究还会掉转头走掉了哩；可是现在谢谢神，我到了这儿，我感谢你们的接待。", "于是贤慧认为应该问他几句话，要他作答。贤慧说：你有时候会不会想起你的家乡？", "基督徒说：我会想起的；不过是带着惭愧和憎厌的心情——1“我若想念我所离开的家乡，我并非没有再转回去的机会。但是我所羡慕的乃是一个更美的家乡，那就是在天上的。”贤慧说：你有没有带走一些你那时候爱好的东西？", "基督徒说：有，不过，并不是我愿意那样做；尤其是我内心那些肉欲方面的意念，所有我的乡亲，连我自己，都欢喜这种思想；可是现在这些念头却成了我的痛苦；我宁可再也不想起这些事；可是我愿意为善的时候，便有恶与我同在。贤慧说：有时侯你有没有觉得好像你已经克服了那些念头，可是有的时候它们又把你迷惑住了？", "基督徒说：确有这种情况，不过也不常有；那种时候对我是太宝贝了。贤慧说：你记不记得你有时候怎样才会觉得好像那些烦恼都克服了？", "基督徒说：记得的，当我想到在十字架上看见了什么，就会使我有那样的感觉；望着我绣花的外衣的时候，我就有那样的感觉；看到怀里带着的那本小册子的时候，也会使我有那样的感觉；当我想到我要去的地方想得很兴奋的时候，那种感觉也会涌上我的心头。贤慧问：什么使你这么热切地要到锡安山去呢？", "基督徒说：唔，我希望看到那个挂在十字架上已经死了的人在那儿活着；我希望在那儿可以摆脱所有那些到今天还纠缠着我的东西；他们说那个地方没有死亡；在那儿我可以跟我最喜欢的人住在一起。因为，说真的，我爱祂，因为祂卸去我的负担；我灵魂的疾病使我厌烦极了。我很高兴到那个不再受到死亡的威胁的地方去，跟那帮不断地喊着“圣哉，圣哉，圣哉！ ”的人生活在一起。", "于是仁爱对基督徒说，你有没有家眷？你结了婚没有？", "基督徒说：我有一个妻子和四个小孩。仁爱说：那么你为什么没有把他们带来？", "这时候基督徒哭了起来，说，哦，我多么想把他们带来呀！可是他们都竭力反对我走这条路。仁爱说：不过你应当说服他们，设法向他们指出如果他们不跟你走，要遭到怎样的危险。"], "en_paras": ["PRUD. Do you not yet bear away with you some of the things that then you were conversant withal?", "CHR. Yes, but greatly against my will; especially my inward and carnal cogitations, with which all my countrymen, as well as myself, were delighted; but now all those things are my grief; and might I but choose mine own things,", "Christian's choice", "I would choose never to think of those things more; but when I would be doing of that which is best, that which is worst is with me. [Rom 7:16-19]", "PRUD. Do you not find sometimes, as if those things were vanquished, which at other times are your perplexity?", "Christian's golden hours", "CHR. Yes, but that is seldom; but they are to me golden hours in which such things happen to me.", "PRUD. Can you remember by what means you find your annoyances, at times, as if they were vanquished?", "CHR. Yes, when I think what I saw at the cross, that will do it; and when I look upon my broidered coat, that will do it; also when I look into the roll that I carry in my bosom, that will do it; and when my thoughts wax warm about whither I am going, that will do it.", "PRUD. And what is it that makes you so desirous to go to Mount Zion?", "CHR. Why, there I hope to see him alive that did hang dead on the cross; and there I hope to be rid of all those things that to this day are in me an annoyance to me; there, they say, there is no death; and there I shall dwell with such company as I like best. [Isa. 25:8; Rev. 21:4] For, to tell you truth, I love him, because I was by him eased of my burden; and I am weary of my inward sickness. I would fain be where I shall die no more, and with the company that shall continually cry, \"Holy, Holy, Holy!\"", "Then said Charity to Christian, Have you a family? Are you a married man?", "CHR. I have a wife and four small children.", "CHAR. And why did you not bring them along with you?", "Christian's love to his wife and children", "CHR. Then Christian wept, and said, Oh, how willingly would I have done it! but they were all of them utterly averse to my going on pilgrimage."]}, {"sub_zh": "参观古籍宝库与历代圣徒兵器", "sub_en": "Viewing the Ancient Records and Weapons of Holy Saints", "zh_paras": ["基督徒说：我是这样做了；并且也告诉了他们神已经把我们这个城市要遭到毁灭的事启示我；可是他们当我开玩笑，不信我的话。仁爱说：你有没有向神祈祷，请求祂祝福你向他们所作的忠告？", "基督徒说：有，而且非常热情地祷告；因为你一定想象得到我是多么爱我的妻子和我那几个可怜的孩子。仁爱说：你有没有把你内心的痛苦和对毁灭的恐惧告诉他们？因为我想，在你看来，那场毁灭是够实在的事。", "基督徒说：有，我对他们讲了又讲，不知讲了多少遍了。他们也可以从我的脸色、我流的眼泪以及由于害怕那即将临到我们头上的审判而引起的战栗，看出我的恐惧；可是这一切都不足以打动他们的心，使他们跟我一道走。仁爱说：但是他们有什么理由不肯来呢？", "基督徒说：唔，我的妻子怕失去这个世界，我的孩子们都耽迷在年轻人那种无聊的欢乐中；所以，又是这个原因，又是那个原因，结果他们就让我独个儿这样流浪着。仁爱说：你有没有，由于你空虚的生活，削弱了你用话语劝他们跟你同走的力量？", "基督徒说：的确我的生活没有什么值得嘉许的地方，因为我自己也知道有许多缺点。我也晓得，一个人一心为了人家的好处，竭力用辩论或劝告要使他们相信的话，很容易受到他自己行为的摧毁。不过我可以说，我非常小心，不让自己作出任何不适当的举动，使他们有理由反对走天路。而且也就因为这样，他们说我太认真了，说我为他们牺牲了许多东西，在他们看来，那些东西并没有什么害处。不仅这样，我想我还可以说，要是有什么事情叫他们看见了会不愿意走天路，那就是我在得罪了神或对不住邻居时所感到的极大痛苦。仁爱说：不错，该隐恨他的兄弟，就因为他自己的行为是恶的，他兄弟的行为是善的；要是你的妻", "子和儿女因此跟你生气，那就表示他们不肯为善；你却救自己脱离了罪恶。我在梦里看见他们这样坐在一起直谈到吃晚饭的时候。他们准备好以后，就坐下来吃饭。桌子上尽是些佳肴美味，还有上好的酒。他们的话题始终离不了关于这座山的主人的事；谈到他做过的事情，祂为什么那样做，祂为什么造了这所房子。从他们的谈话里，我知道祂过去是个伟大的战士，冒着很大的危险，跟那个掌握死亡的权柄的有过搏斗，并且杀了他，这使我更爱他了。", "基督徒说，因为正像他们所说的，并且我也相信，祂为了那场搏斗流出许多血；但是，正是因为祂的动机是纯粹出自对祖国的热爱，祂的所作所为才有那么崇高的荣耀。而且，这一家人当中有的在祂死在十字架上以后还跟祂耽在一起过，并且还谈过话；他们证实祂亲口说过，从天涯到海角都找不到一个像祂这样热爱可怜的天路旅客的人。他们还为他们所讲的话举了个例子，那就是，为了拯救可怜的人类，祂撇下祂的荣耀；他们还听祂确实说过， “他不要单独住在锡安山。”他们还说，祂曾经使许多天路旅客成为王子，虽然他们本来生成是叫花子，粪堆是他们出身的地方。他们这样一直谈到深夜；他们把自己委托给神保护之后，就各自歇息去了。她们把天路旅客安置在楼", "上一间大房间里，那儿的窗户朝向东方，那房间叫做安乐；他在那儿睡到天亮，一觉醒来，唱道， ——我现在在什么地方？这是否基督对天路旅客所表现的爱心和眷顾？这样准备好一切，使我得到赦免，我住的地方已经和天堂毗连！早上他们都起了身；又谈论了一番之后，她们对他说，等她们给他看过那地方的珍贵对象后，他再动身。首先她们领他到书房里去，给他看非常古老的案卷；据我记得，在梦中她们先给他看山主人的家谱，祂是神的儿子，出自不朽的一族。这里还详细地记载着祂的行为，和几千个为祂服务的人的姓名；以及祂怎样把他们安置在不会因悠久的时日或朽腐的本质而毁坏的住", "所。", "然后她们念给他听山主人的仆人们的可贵的作为，诸如他们怎样6“制服了敌国，行了公义，得了应许，堵了狮子的口，灭了烈火的猛势，脱了刀剑的锋刃，软弱变为刚强，争战显出勇敢，打退外邦的全军。”"], "en_paras": ["CHAR. But you should have talked to them, and have endeavoured to have shown them the danger of being behind.", "CHR. So I did; and told them also of what God had shown to me of the destruction of our city; \"but I seemed to them as one that mocked\", and they believed me not. [Gen. 19:14]", "CHAR. And did you pray to God that he would bless your counsel to them?", "CHR. Yes, and that with much affection: for you must think that my wife and poor children were very dear unto me.", "CHAR. But did you tell them of your own sorrow, and fear of destruction? for I suppose that destruction was visible enough to you.", "Christian's fears of perishing might be read in his very countenance", "CHR. Yes, over, and over, and over. They might also see my fears in my countenance, in my tears, and also in my trembling under the apprehension of the judgement that did hang over our heads; but all was not sufficient to prevail with them to come with me.", "CHAR. But what could they say for themselves, why they came not?", "CHR. Why, my wife was afraid of losing this world, and my children were given to the foolish delights of youth: so what by one thing, and what by another, they left me to wander in this manner alone.", "CHAR. But did you not, with your vain life, damp all that you by words used by way of persuasion to bring them away with you?", "Christian's good conversation before his wife and children", "CHR. Indeed, I cannot commend my life; for I am conscious to myself of many failings therein; I know also that a man by his conversation may soon overthrow what by argument or persuasion he doth labour to fasten upon others for their good. Yet this I can say, I was very wary of giving them occasion, by any unseemly action, to make them averse to going on pilgrimage. Yea, for this very thing they would tell me I was too precise, and that I denied myself of things, for their sakes, in which they saw no evil. Nay, I think I may say, that if what they saw in me did hinder them, it was my great tenderness in sinning against God, or of doing any wrong to my neighbour.", "CHAR. Indeed Cain hated his brother, \"because his own works were evil, and his brother's righteous\" [1 John 3:12]; and if thy wife and children have been offended with thee for this, they thereby show themselves to be implacable to good, and \"thou hast delivered thy soul from their blood\". [Ezek. 3:19]", "Now I saw in my dream, that thus they sat talking together until supper was ready. So when they had made ready, they sat down to meat. Now the table was furnished \"with fat things, and with wine that was well refined\": and all their talk at the table was about the Lord of the hill; as, namely, about what he had done, and wherefore he did what he did, and why he had builded that house. And by what they said, I perceived that he had been a great warrior, and had fought with and slain \"him that had the Power of death\", but not without great danger to himself, which made me love him the more. [Heb. 2:14,15]", "For, as they said, and as I believe (said Christian), he did it with the loss of much blood; but that which put glory of grace into all he did, was, that he did it out of pure love to his country. And besides, there were some of them of the household that said they had been and spoke with him since he did die on the cross; and they have attested that they had it from his own lips, that he is such a lover of poor pilgrims, that the like is not to be found from the east to the west.", "They, moreover, gave an instance of what they affirmed, and that was, he had stripped himself of his glory, that he might do this for the poor; and that they heard him say and affirm, \"that he would not dwell in the mountain of Zion alone.\" They said, moreover, that he had made many pilgrims princes, though by nature they were beggars born, and their original had been the dunghill. [1 Sam 2:8; Ps. 113:7]"]}, {"sub_zh": "眺望遥远快乐山与披挂属天全副军装", "sub_en": "A View of the Delectable Mountains & Armed with Armour of Proof", "zh_paras": ["然后她们又把案卷中的另一部分念出来，说到她们的主人多么愿意恩待所有的人，不论是什么人，尽管他们过去曾经侮蔑他和祂的作为。在这里基督徒还看到好多其他有名事迹的记载；诸如古老的和近代的事迹，以及一定会实现的预言，这一切可以使敌人惊惧，也可以使天路旅客得到安慰。第二天她们领他到武器库去，给他看主人为天路旅客准备的各种各样器械，例如剑、盾牌、盔、胸铠，在所有情况下都可以用的祷告和穿不坏的鞋子。这些东西的数量足够配备像天上星星那样多的人给主人服役。她们还给他看主人的仆人们用以施行奇迹的工具。她们给他看摩西的杖，雅亿用来钉死西西拉", "的橛子和锤子，基甸用来使米甸人逃跑的号角、瓶子和火把。然后她们给他看珊迦用来杀死六百人的赶牛用的棍子，她们还给他看参孙用以表现强大能力的腮骨，还有大卫用以杀死迦特人歌利亚的石子和机弦，以及将来罪人升上天来就擒的时候，主人要用来杀他的剑。此外，她们还给他看许多无比美好的东西，", "基督徒非常高兴。这以后，他们又去安歇了。", "然后我在梦里看见，第二天他起床后打算动身，可是她们又留他再住一天；她们说，要是天气好的话，她们会领他去看快乐山。她们说，看了那几座山会使他得到更多的安慰，因为它们比他现在耽的地方更靠近那个他所渴望的安身之所；因此他就答应再逗留下来。第二天早晨，她们带他到屋顶上，叫他向南方望去。他照着做了；哎呀，他看见远远的有一片极悦目的群山地带，有树林，葡萄园，各种各样的果子，花草，泉水和喷泉，好看极了。于是他问那地方叫什么名字。她们说那是以马内利的国土，她们说，像这座山一样，它是所有的天路旅客所共有的。你到了那儿，就可以看见天国的门，因为住在那儿的牧人会让你看见。", "这会儿他想上路了，她们也不留他。她们说，不过，首先让我们再到武器库去一趟吧。他们一同去了；他到了那儿之后，她们给他从头到脚配备了坚牢的武装，生怕他在路上会碰到袭击。他这样装备了之后，跟他的朋友们走到门口，问看门人有没有天路旅客从那儿经过。看门人说，有。", "基督徒说：请问你认识他吗？", "看门人说：我问他叫什么名字，他说叫忠信。", "基督徒说：哦，我认识他；他跟我住在一个城里，是我的近邻；他就是从我的出生地来的。你想他可能走到多远啦？", "看门人说：这会儿他已经到了山下了。", "基督徒说：唔，好看门人，愿神与你同在，并且为了你对我所表现的仁爱多多地赐福给你。"], "en_paras": ["Christian's bedchamber", "Thus they discoursed together till late at night; and after they had committed themselves to their Lord for protection, they betook themselves to rest: the Pilgrim they laid in a large upper chamber, whose window opened towards the sun-rising: the name of the chamber was Peace; where he slept till break of day, and then he awoke and sang--", "\"Where am I now? Is this the love and care Of Jesus for the men that pilgrims are? Thus to provide! that I should be forgiven! And dwell already the next door to heaven!\"", "So in the morning they all got up; and, after some more discourse, they told him that he should not depart till they had shown him the rarities of that place. And first they had him into the study, where they showed him records of the greatest antiquity; in which, as I remember my dream, they showed him first the pedigree of the Lord of the hill, that he was the son of the Ancient of Days, and came by that eternal generation. Here also was more fully recorded the acts that he had done, and the names of many hundreds that he had taken into his service; and how he had placed them in such habitations that could neither by length of days, nor decays of nature, be dissolved.", "Then they read to him some of the worthy acts that some of his servants had done: as, how they had \"subdued kingdoms, wrought righteousness, obtained promises, stopped the mouths of lions, quenched the violence of fire, escaped the edge of the sword, out of weakness were made strong, waxed valiant in fight, and turned to flight the armies of the aliens.\" [Heb 11:33,34]", "They then read again, in another part of the records of the house, where it was shewed how willing their Lord was to receive into his favour any, even any, though they in time past had offered great affronts to his person and proceedings. Here also were several other histories of many other famous things, of all which Christian had a view; as of things both ancient and modern; together with prophecies and predictions of things that have their certain accomplishment, both to the dread and amazement of enemies, and the comfort and solace of pilgrims.", "The next day they took him and had him into the armoury, where they showed him all manner of furniture, which their Lord had provided for pilgrims, as sword, shield, helmet, breastplate, ALL-PRAYER, and shoes that would not wear out. And there was here enough of this to harness out as many men for the service of their Lord as there be stars in the heaven for multitude.", "They also showed him some of the engines with which some of his servants had done wonderful things. They shewed him Moses' rod; the hammer and nail with which Jael slew Sisera; the pitchers, trumpets, and lamps too, with which Gideon put to flight the armies of Midian. Then they showed him the ox's goad wherewith Shamgar slew six hundred men. They showed him also the jaw-bone with which Samson did such mighty feats. They showed him, moreover, the sling and stone with which David slew Goliath of Gath; and the sword, also, with which their Lord will kill the Man of Sin, in the day that he shall rise up to the prey. They showed him, besides, many excellent things, with which Christian was much delighted. This done, they went to their rest again.", "Then I saw in my dream, that on the morrow he got up to go forward; but they desired him to stay till the next day also; and then, said they, we will, if the day be clear, show you the Delectable Mountains, which, they said, would yet further add to his comfort, because they were nearer the desired haven than the place where at present he was; so he consented and stayed. When the morning was up, they had him to the top of the house, and bid him look south; so he did: and behold, at a great distance, he saw a most pleasant mountainous country, beautified with woods, vineyards, fruits of all sorts, flowers also, with springs and fountains, very delectable to behold. [Isa. 33:16,17] Then he asked the name of the country. They said it was Immanuel's Land; and it is as common, said they, as this hill is, to and for all the pilgrims. And when thou comest there from thence, said they, thou mayest see to the gate of the Celestial City, as the shepherds that live there will make appear.", "Now he bethought himself of setting forward, and they were willing he should. But first, said they, let us go again into the armoury. So they did; and when they came there, they harnessed him from head to foot with what was of proof, lest, perhaps, he should meet with assaults in the way. He being, therefore, thus accoutred, walketh out with his friends to the gate, and there he asked the porter if he saw any pilgrims pass by. Then the porter answered, Yes.", "CHR. Pray, did you know him? said he.", "POR. I asked him his name, and he told me it was Faithful.", "CHR. Oh, said Christian, I know him; he is my townsman, my near neighbour; he comes from the place where I was born. How far do you think he may be before?", "POR. He is got by this time below the hill.", "CHR. Well, said Christian, good Porter, the Lord be with thee, and add to all thy blessings much increase, for the kindness that thou hast showed to me.", "Then he began to go forward; but"]}]}, {"num": 11, "id": "chapter-9", "badge_label": "CHAPTER 11", "title_zh": "第九章 魔王亚玻伦", "title_en": "Chapter 9: Apollyon: The Battle", "desc": "下入谦卑谷与魔王亚玻伦的迎面阻截；魔王的威逼利诱与控告之词；血战亚玻伦与圣灵宝剑的大能反击。", "blocks": [{"sub_zh": "下入谦卑谷与魔王亚玻伦的迎面阻截", "sub_en": "Entering the Valley of Humiliation & Apollyon's Challenge", "zh_paras": ["于是他开始向前走；谨慎，虔诚，仁爱和贤慧要陪他走到山下。因此他们一面走一面又继续他们的谈话，一直谈到要走下山的时候，基督徒说，上来固然很困难，可是据我看，下山也很危险。贤慧说，对，你说得对；像你现在这样朝下面的屈辱谷走去，难保不在路上滑一跤。她们说，所以我们才陪你下山，于是他开始非常小心地走下山去；但是还是免不了滑了一两次。我在梦里看见，当基督徒走到山下的时候，这些好伴侣给他一个面包，一瓶酒和一些葡萄干；然后他就上路了。基督徒跟随着他一批虔敬的朋友，她们宝贵的话语足够抵消他的哀愁；等到她们让他离去，他从头到脚都披上铠甲，异常坚固。", "可是在屈辱谷里，可怜的基督徒可够受了；因为他还没有走多远，就看见一个叫做魔王的凶恶的敌人在田野里迎面而来。基督徒怕起来了，心里盘算着是回头呢，还是坚守阵地。可是再一想，他背上没有甲胄，如果背向敌人，反而给敌人造成有利条件，敌人可以毫不费力地用短矛把他刺穿；因此他决定冒险守住；因为他想，即使我唯一的目的是保全自己的性命，也只有面对敌人才是上策。", "于是他继续往前走，魔王向他走来。这怪物可怕极了，他像一条鱼似的满身鳞甲，那是他引以自豪的东西；他有像龙那样的翅膀，跟熊一样的脚，像狮子一样的嘴巴，他肚子里冒出一股股的烟火。他走到基督徒跟前，用轻蔑的眼神看着他，开始这样问他：——", "魔王说：你从哪儿来？上哪儿去？", "基督徒说：我从那万恶的地方——毁灭城来，上锡安城去。", "魔王说：从你的话里我就知道你是我的臣民；因为那一带地方都属于我，我是那地方的君王和神明。那么，你为什么逃避你的君王呢？若不是我还希望你为我服务的话，我就会一下把你打倒在地上的。", "基督徒说：我的确是在你的领域里出生的，你的事务实在不好办，而你给的工资又叫人简直没法维持生活——因为罪的工价乃是死；因此我年纪大了以后，像别的有思想的人一样，就注意有什么补救的办法。"], "en_paras": ["Discretion, Piety, Charity, and Prudence would accompany him down to the foot of the hill. So they went on together, reiterating their former discourses, till they came to go down the hill. Then said Christian, As it was difficult coming up, so, so far as I can see, it is dangerous going down. Yes, said Prudence, so it is, for it is a hard matter for a man to go down into the Valley of Humiliation, as thou art now, and to catch no slip by the way; therefore, said they, are we come out to accompany thee down the hill. So he began to go down, but very warily; yet he caught a slip or two.", "Then I saw in my dream that these good companions, when Christian was gone to the bottom of the hill, gave him a loaf of bread, a bottle of wine, and a cluster of raisins; and then he went on his way.", "But now, in this Valley of Humiliation, poor Christian was hard put to it; for he had gone but a little way, before he espied a foul fiend coming over the field to meet him; his name is Apollyon. Then did Christian begin to be afraid, and to cast in his mind whether to go back or to stand his ground. But he considered again that he had no armour for his back; and therefore thought that to turn the back to him might give him the greater advantage with ease to pierce him with his darts.", "Christian's resolution at the approach of Apollyon", "Therefore he resolved to venture and stand his ground; for, thought he, had I no more in mine eye than the saving of my life, it would be the best way to stand.", "So he went on, and Apollyon met him. Now the monster was hideous to behold; he was clothed with scales, like a fish, (and they are his pride,) he had wings like a dragon, feet like a bear, and out of his belly came fire and smoke, and his mouth was as the mouth of a lion. When he was come up to Christian, he beheld him with a disdainful countenance, and thus began to question with him.", "APOL. Whence come you? and whither are you bound?", "CHR. I am come from the City of Destruction, which is the place of all evil, and am going to the City of Zion.", "APOL. By this I perceive thou art one of my subjects, for all that country is mine, and I am the prince and god of it. How is it, then, that thou hast run away from thy king? Were it not that I hope thou mayest do me more service, I would strike thee now, at one blow, to the ground.", "CHR. I was born, indeed, in your dominions, but your service was hard, and your wages such as a man could not live on, \"for the wages of sin is death\" [Rom 6:23]; therefore, when I was come to years, I did, as other considerate persons do, look out, if, perhaps, I might mend myself.", "Apollyon's flattery"]}, {"sub_zh": "魔王的威逼利诱与控告之词", "sub_en": "Apollyon's Accusations and Christian's Steadfast Allegiance to Christ", "zh_paras": ["魔王说：没有哪个君王肯这样轻易地放弃他的臣民，我现在也不肯失去你；不过你既然提起对你的职务和工资都不满，那么安心回去吧；我现在答应你，我们的国度能供给你什么，我都给你。", "基督徒说：可是我已经给另外一个主人雇佣了，就是那众王之王；我怎么可以那么不义，又跟你回去呢？", "魔王说：在这件事上你是照着那句“越换越坏”的俗语做了，不过那些自命为祂的仆人的人，过一个时期就脱离了祂，回到我这儿来，这是很普通的事。你也这样做吧，一切都会妥当的。", "基督徒说：我已经相信祂，并且发誓效忠于祂；我怎么能够背弃信义而不被认为大逆不道以致给绞死呢？", "魔王说：你也背叛过我，但是只要你肯回头，我便不咎既往。", "基督徒说：我答应你的话是在未成年的时候说的；而且我认为我现在服侍的君王能够赦免我；不仅如此，还会原谅我为了顺从你而干过的罪行。并且，哦，你这个杀人的魔王！说真的，我喜欢替祂做事，拿祂的工资，当祂的仆人，受祂的统治，和祂的仆人们待在一起，我也喜欢祂的国度，可我就不喜欢你的一切；所以别再劝我啦；我是祂的仆人，我要跟随祂。", "魔王说：等你的头脑冷静一点的时候，再考虑一下你在你要走的路上会碰到什么。你知道祂的仆人大多数都没有好结果，因为他们冒犯了我和我的所作所为。他们中间有多少人遭到羞辱的死亡啊！而且你还认为祂的差事比我的好；可是祂从来就没离开过祂的住处，把侍奉祂的人从死亡的手中救出来，至于我呢，大家都知道，虽然有一些忠心服侍我的人已经让他们掳去，我曾经多少次用强力或者巧计把他们从祂以及属于祂的人手里搭救出来；所以我也要搭救你。"], "en_paras": ["APOL. There is no prince that will thus lightly lose his subjects, neither will I as yet lose thee; but since thou complainest of thy service and wages, be content to go back: what our country will afford, I do here promise to give thee.", "CHR. But I have let myself to another, even to the King of princes; and how can I, with fairness, go back with thee?", "APOL. Thou hast done in this, according to the proverb, \"Changed a bad for a worse\"; but it is ordinary for those that have professed themselves his servants, after a while to give him the slip, and return again to me. Do thou so too, and all shall be well.", "CHR. I have given him my faith, and sworn my allegiance to him; how, then, can I go back from this, and not be hanged as a traitor?", "APOL. Thou didst the same to me, and yet I am willing to pass by all, if now thou wilt yet turn again and go back.", "CHR. What I promised thee was in my nonage; and, besides, I count the Prince under whose banner now I stand is able to absolve me; yea, and to pardon also what I did as to my compliance with thee; and besides, O thou destroying Apollyon! to speak truth, I like his service, his wages, his servants, his government, his company, and country, better than thine; and, therefore, leave off to persuade me further; I am his servant, and I will follow him.", "APOL. Consider, again, when thou art in cool blood, what thou art like to meet with in the way that thou goest. Thou knowest that, for the most part, his servants come to an ill end, because they are transgressors against me and my ways. How many of them have been put to shameful deaths! and, besides, thou countest his service better than mine, whereas he never came yet from the place where he is to deliver any that served him out of their hands; but as for me, how many times, as all the world very well knows, have I delivered, either by power, or fraud, those that have faithfully served me, from him and his, though taken by them; and so I will deliver thee.", "CHR. His forbearing at present to deliver them is on purpose to try their love, whether they will cleave to him to the end; and as for the ill end thou sayest they come to, that is most glorious in their account; for, for present deliverance, they do not much expect it, for they stay for their glory, and then they shall have it when their Prince comes in his and the glory of the angels.", "APOL. Thou hast already been unfaithful in thy service to him; and how dost thou think to receive wages of him?", "CHR. Wherein, O Apollyon! have I been unfaithful to him?", "APOL. Thou didst faint at first setting out, when thou wast almost choked in the Gulf of Despond; thou didst attempt wrong ways to be rid of thy burden, whereas thou shouldst have stayed till thy Prince had taken it off; thou didst sinfully sleep and lose thy choice thing; thou wast, also, almost persuaded to go back at the sight of the lions; and when thou talkest of thy journey, and of what thou hast heard and seen, thou art inwardly desirous of vain-glory in all that thou sayest or doest.", "CHR. All this is true, and much more which thou hast left out; but the Prince whom I serve and honour is merciful, and ready to forgive; but, besides, these infirmities possessed me in thy country, for there I sucked them in; and I have groaned under them, been sorry for them, and have obtained pardon of my Prince."]}, {"sub_zh": "血战亚玻伦与圣灵宝剑的大能反击", "sub_en": "The Dreadful Combat and Apollyon Defeated by the Two-Edged Sword", "zh_paras": ["基督徒说：祂目前容忍着，不即刻去救他们，为的是要考验他们对祂的爱，试验他们会不会跟从祂到底；至于你所说的关于他们所遭遇到的不幸的后果，那对他们说来是最光荣的；因为他们不期望眼前的释放；又因为他们肯等待他们的荣耀；等他们的君王和天使们带着荣耀来的时候，他们就可以得到荣耀。", "魔王说：在服侍祂这件事上你已经不忠实了，你怎么还妄想得到祂的工资？", "基督徒说：哦，魔王，我在什么地方对祂不忠实呢？", "魔王说：你在灰心沼里差点儿给陷溺的时候，你曾经懊悔当初不该出发。你应该等待你的君王给你解除背上的重负，可是你却尝试用了错误的方法去摆脱它。你罪孽深重，竟然睡着了，并且丢了你的宝贝证件。当你一见到狮子的时候，你差点掉头逃走。你谈到你在旅途上所闻所见的事情时，你对自己所讲和所做的一切都怀着自满的情绪。", "基督徒说：这全都是实话，而且还有很多你没有讲到的事哩；不过我所侍奉和敬重的君王是慈悲的，祂乐意宽恕人。再说，我是在你的国度里沾染这些弱点的；因为我在那儿染上了那些坏习惯，我在它们的重压下呻吟过，为它们难过，并且得到了我的君王的宽恕。", "魔王顿时怒火冲天，说，我是这个君王的仇敌；我痛恨祂本人，祂的法律和祂的人民；我此来特地要跟你为难。", "基督徒说：魔王，留心你的一举一动，因为我是在至高者的路上，圣洁的路上；因此你得当心。"], "en_paras": ["APOL. Then Apollyon broke out into a grievous rage, saying, I am an enemy to this Prince; I hate his person, his laws, and people; I am come out on purpose to withstand thee.", "CHR. Apollyon, beware what you do; for I am in the King's highway, the way of holiness; therefore take heed to yourself.", "APOL. Then Apollyon straddled quite over the whole breadth of the way, and said, I am void of fear in this matter: prepare thyself to die; for I swear by my infernal den, that thou shalt go no further; here will I spill thy soul.", "And with that he threw a flaming dart at his breast; but Christian had a shield in his hand, with which he caught it, and so prevented the danger of that.", "Then did Christian draw, for he saw it was time to bestir him; and Apollyon as fast made at him, throwing darts as thick as hail; by the which, notwithstanding all that Christian could do to avoid it, Apollyon wounded him in his head, his hand, and foot. This made Christian give a little back; Apollyon, therefore, followed his work amain, and Christian again took courage, and resisted as manfully as he could. This sore combat lasted for above half a day, even till Christian was almost quite spent; for you must know that Christian, by reason of his wounds, must needs grow weaker and weaker.", "Then Apollyon, espying his opportunity, began to gather up close to Christian, and wrestling with him, gave him a dreadful fall; and with that Christian's sword flew out of his hand. Then said Apollyon, I am sure of thee now. And with that he had almost pressed him to death, so that Christian began to despair of life; but as God would have it, while Apollyon was fetching of his last blow, thereby to make a full end of this good man, Christian nimbly stretched out his hand for his sword, and caught it, saying, \"Rejoice not against me, O mine enemy; when I fall I shall arise\" [Micah 7:8];", "Christian's victory over Apollyon", "and with that gave him a deadly thrust, which made him give back, as one that had received his mortal wound. Christian perceiving that, made at him again, saying, \"Nay, in all these things we are more than conquerors through him that loved us\". [Rom. 8:37] And with that Apollyon spread forth his dragon's wings, and sped him away, that Christian for a season saw him no more. [James 4:7]", "In this combat no man can imagine, unless he had seen and heard as I did, what yelling and hideous roaring Apollyon made all the time of the fight--he spake like a dragon; and, on the other side, what sighs and groans burst from Christian's heart. I never saw him all the while give so much as one pleasant look, till he perceived he had wounded Apollyon with his two-edged sword; then, indeed, he did smile, and look upward; but it was the dreadfullest sight that ever I saw.", "A more unequal match can hardly be,--CHRISTIAN must fight an Angel; but you see,", "The valiant man by handling Sword and Shield, Doth make him, tho' a Dragon, quit the field."]}, {"sub_zh": "得胜之后的感恩赞美与生命树叶疗伤", "sub_en": "Giving Thanks for Deliverance & Healed by Leaves of the Tree of Life", "zh_paras": ["于是魔王叉开双脚横跨整条路上，说，在这件事上我一点儿也不怕。你准备死；因为我用阴府的名义赌咒，不准你向前再走一步；我就在这儿把你结果了。说着他向基督徒的胸口投过来一支带火焰的标；但是基督徒手里拿着盾牌，挡住了它，因而脱了险。", "于是基督徒拔出他的利剑，因为他看准这该是他发奋的时候了；魔王也同样迅速地向他扑来，标像雨点般向他投来；尽管基督徒竭力闪避，他头上、手上和脚上还是受了伤。他被迫退后了几步；魔王一点也不放松，基督徒再一次壮起胆来，奋勇抵抗。这场猛烈的格斗持续了半天以上，到后来基督徒弄得几乎筋疲力尽；你要知道，由于他的创伤，基督徒必然越来越衰弱了。那时魔王瞧准机会，开始逼近基督徒，跟他扭成一团，把他狠狠地摔倒在地上；这一下，基督徒的剑从手里飞了出去。这时候魔王说，现在你可逃不出我的手掌了。说着他几乎把基督徒压死，以致", "基督徒以为自己一定活不成了。但是，仿佛出于天意，正当魔王要给他最后的一击，把这好人结果掉的时候，基督徒敏捷地伸手抓起他的利剑，一面说， “我的仇敌啊，不要向我夸耀；我虽跌倒，却要起来。 ”说着他向对方狠狠地刺了一下，这时魔王像一个受到致命的创伤的人那样往后倒退。基督徒看到这种情形，接着再刺一下，说：“然而靠着爱我们的主，在这一切的事上，已经得胜有余了。”正说着的时候，魔王倏地展开他的龙鳍，逃之夭夭，基督徒再也看不见他了。在这场格斗中，除非像我那样亲眼目击了一切情形的人，谁也想象不出魔王在斗争时一直发出的那种叫声和可怕的吼声他的声音就像龙吟；也没有人想象得出从基督徒心底里发出的那种叹息和呻吟。", "在他没有看到自己已经用双刃的利剑把魔王刺伤以前，我始终没有看见他有一点轻松的表情；刺伤了魔王之后他才笑了一下，抬起头望着天。那真是我平生所看到的一场最可怕的格斗。这场恶斗结束以后，基督徒说，我现在要向把我从狮子的嘴里救出来的恩主道谢，要向帮我战胜", "魔王的恩主道谢。他就这样做了，口里说着， ——大魔王，这个魔鬼的首领，蓄意要断送我的一生，因此把他武装起来，派遣他出来到我这里，跟我格斗，他那一股怒火，凶恶无比。可是有福的麦依可帮助我不少，我很快地就用剑把他赶跑。因此让我对他永远地赞扬，感激和颂扬他的圣名，永志不忘。", "这时候有一只手拿着生命树上的叶子向他伸来，他接过叶子来，把它们按在交战中受到的创伤上，伤口马上就好了。他又在原来的地方坐下来吃面包，喝酒，这些东西是不久以前人家送给他的；恢复了精神之后，他手里拿着拔出来的剑准备上路了；因为他说，我不知道附近还有没有敌人。但是他走过了整个山谷，没有碰到魔王再来侵犯。", "基督徒向帮他战胜魔王的恩主道谢。"], "en_paras": ["So when the battle was over, Christian said, \"I will here give thanks to him that delivered me out of the mouth of the lion, to him that did help me against Apollyon.\" And so he did, saying--", "Great Beelzebub, the captain of this fiend, Design'd my ruin; therefore to this end He sent him harness'd out: and he with rage That hellish was, did fiercely me engage. But blessed Michael helped me, and I, By dint of sword, did quickly make him fly. Therefore to him let me give lasting praise, And thank and bless his holy name always.", "Then there came to him a hand, with some of the leaves of the tree of life, the which Christian took, and applied to the wounds that he had received in the battle, and was healed immediately. He also sat down in that place to eat bread, and to drink of the bottle that was given him a little before; so, being refreshed, he addressed himself to his journey, with his sword drawn in his hand; for he said, I know not but some other enemy may be at hand. But he met with no other affront from Apollyon quite through this valley.", "Now, at the end of this valley was another, called the Valley of the Shadow of Death, and Christian must needs go through it, because the way to the Celestial City lay through the midst of it. Now, this valley is a very solitary place. The prophet Jeremiah thus describes it: \"A wilderness, a land of deserts and of pits, a land of drought, and of the shadow of death, a land that no man\" (but a Christian) \"passed through, and where no man dwelt.\" [Jer. 2:6]", "Now here Christian was worse put to it than in his fight with Apollyon, as by the sequel you shall see.", "I saw then in my dream, that when Christian was got to the borders of the Shadow of Death, there met him two men, children of them that brought up an evil report of the good land [Num. 13], making haste to go back; to whom Christian spake as follows:--", "CHR. Whither are you going?", "MEN. They said, Back! back! and we would have you to do so too, if either life or peace is prized by you.", "CHR. Why, what's the matter? said Christian.", "MEN. Matter! said they; we were going that way as you are going, and went as far as we durst; and indeed we were almost past coming back; for had we gone a little further, we had not been here to bring the news to thee.", "CHR. But what have you met with? said Christian.", "MEN. Why, we were almost in the"]}]}, {"num": 12, "id": "chapter-10", "badge_label": "CHAPTER 12", "title_zh": "第十章 死荫谷", "title_en": "Chapter 10: The Valley of the Shadow of Death", "desc": "死荫谷的恐怖阴森与恶信之人的逃窜；幽暗深谷中的深坑、烈火与祈祷武器；黎明破晓与废墟中的教皇与邪教徒巨人。", "blocks": [{"sub_zh": "死荫谷的恐怖阴森与恶信之人的逃窜", "sub_en": "The Terrors of the Valley of the Shadow of Death", "zh_paras": ["走完这个山谷，又是一个叫做死荫谷的山谷；基督徒必须要从这儿经过，因为到天国去的路就在它中间穿过。这山谷是个非常冷落的地方。先知耶利米对它这样形容过：1“一片旷野，一片沙漠有深坑之地，一片干旱和死荫之地，一片无人（除了基督徒）经过、无人居住之地。”", "基督徒在这儿遭遇到比刚才跟魔王交锋时更窘的事，就如你在下文中会看到的。", "这时我在梦里看见，当基督徒走到死荫谷的边界的时候，有两个人向他走来，他们是来报好地方的恶信的人的子孙，他们急急忙忙走回来；基督徒对他们说了这样的：—— 基督徒问道：你们上哪儿去？他们说：回去！回去！我们也要你回去，如果你重视性命和安全的话。", "基督徒问道：怎么，到底怎么回事？他们说：怎么回事？我们顺着你走的这条路走，已经不敢再往前走了；说真的，我们差点儿不能回来了；因为如果我们再往前走一点路，我们就不会在这儿把消息报告你了。", "基督徒问：你们到底遇到了什么事？他们说：啊，我们差不多走进死荫谷了；幸亏我们无意中朝前面一望，看见了将要遇到的危险。", "基督徒问：你看见了什么呢？他们说：看见什么！啊，就是看见那个山谷，里面一片漆黑；在那儿我们还看见从深坑里来的小鬼、妖怪和龙；我们还听见从山谷里传出来的连连不绝的号哭声和嚷叫声，就像上了手铐脚镣的人们在极端痛苦中悲伤地坐在那儿发出来的声音一样；在山谷的上空笼罩着混乱得使人沮丧的云块；死亡也老是在那上面展开它的翅膀。总之，是个混乱到了极点的混沌，一切的一切都叫你毛骨悚然。"], "en_paras": ["Valley of the Shadow of Death; but that, by good hap, we looked before us, and saw the danger before we came to it. [Ps. 44:19; 107:10]", "CHR. But what have you seen? said Christian.", "MEN. Seen! Why, the Valley itself, which is as dark as pitch; we also saw there the hobgoblins, satyrs, and dragons of the pit; we heard also in that Valley a continual howling and yelling, as of a people under unutterable misery, who there sat bound in affliction and irons; and over that Valley hangs the discouraging clouds of confusion. Death also doth always spread his wings over it. In a word, it is every whit dreadful, being utterly without order. [Job 3:5; 10:22]", "CHR. Then, said Christian, I perceive not yet, by what you have said, but that this is my way to the desired haven. [Jer. 2:6]", "MEN. Be it thy way; we will not choose it for ours. So, they parted, and Christian went on his way, but still with his sword drawn in his hand, for fear lest he should be assaulted.", "I saw then in my dream, so far as this valley reached, there was on the right hand a very deep ditch; that ditch is it into which the blind have led the blind in all ages, and have both there miserably perished. [Ps. 69:14,15] Again, behold, on the left hand, there was a very dangerous quag, into which, if even a good man falls, he can find no bottom for his foot to stand on. Into that quag King David once did fall, and had no doubt therein been smothered, had not HE that is able plucked him out.", "The pathway was here also exceeding narrow, and therefore good Christian was the more put to it; for when he sought, in the dark, to shun the ditch on the one hand, he was ready to tip over into the mire on the other; also when he sought to escape the mire, without great carefulness he would be ready to fall into the ditch. Thus he went on, and I heard him here sigh bitterly; for, besides the dangers mentioned above, the pathway was here so dark, and ofttimes, when he lift up his foot to set forward, he knew not where or upon what he should set it next."]}, {"sub_zh": "幽暗深谷中的深坑、烈火与祈祷武器", "sub_en": "The Mouth of Hell, Fiends, and The Weapon of All-Prayer", "zh_paras": ["于是基督徒说，从你们的话语中，我还看不出这不是把我引到我所渴望的天堂的路。他们说：就算是你的路吧，我们可不要选择这条路。说着他们就这样跟基督徒分手了；基督徒继续走他的路，手里仍旧握着剑，生怕自己会再受到袭击。", "这时我在梦里看见，沿着整个山谷的右边有一条很深的沟道；多少年代以来，瞎子给瞎子领路，结果都掉进这条沟里去，都悲惨地丧命了。啊，在左边也有一个非常险恶的泥沼，即使一个好人跌了进去，双脚也踏不到河底；大卫王就曾经跌进去过一次，要不是有全能的神把他拉出来的话，他毫无疑问会在里面闷死。这儿的路也非常狭窄，因此好基督徒感到格外困苦；因为在黑暗中，要避开那条沟，他就很容易掉进泥沼里去；要躲开泥沼，如果不十分小心，他又大有可能会摔进沟里去。他这样继续向前走，我听见他痛苦地叹着气；因为除了上文所提到的危险以外，这儿的路一点也看不见，当他举起脚往前走的时候，他常常不知道下一步会踏在什么东西", "上面。我看见地狱的入口在山谷的中央，而且就在路旁边。我这可怎么办呢？基督徒想。熊熊的火焰和一股股的浓烟不时从里面喷出来，火花四射，还带着骇人的声音（这些东西不像前一会儿魔王那样，会怕", "基督徒的剑） ，他不得不收起他的剑，换上另一种武器，那叫做随时适用的祷告；于是我听得见他喊着，2“耶和华啊，求你救我的灵魂。”有好一会儿工夫他这样往前走，可是火焰仍然朝着他伸出舌头；他还听见悲惨的声音和什么东西到处乱窜的声音，以致有时候他以为自己会给撕得粉碎，或者像街上的泥泞那样给人家践踏在脚下。有好几英里路他一直看见这可怕的情景，一直听见这些令人不寒而栗的声音；后来走到一个地方，他以为自己听见有一帮恶鬼朝他走来，他站住了，考虑着怎样去对付他们。有时候他几乎想回头走；但是再一想，他也许已经在山谷里走了一半的路了。", "他又记起，他已经克服了许多危险，回头走可能比往前去更危险；因此他决定勇往直前。可是那些恶鬼好像越来越近了。但是当他们几乎要碰到他的时候，他力竭声嘶地喊道，3“我要靠神的能力行走；”", "于是他们都退去，不再走拢来了。有一件事我不愿意遗漏掉：我注意到这会儿可怜的基督徒非常惊慌，他竟然听不出自己的声音了。我看到的是这样情形：正当他走到有火燃烧着的地狱入口的边上时，一个邪灵溜到他后面，轻轻地挨近他，低声地向他提出许多可恶的亵渎神的话，他还以为那是从自己心里产生的念头呢。一想到自己竟然毁谤自己过去那么敬爱的神，这比任何一件他所遇到的事情都更使他烦恼；要是他办得到的话，他决不肯那样做；可是他既没办法使耳朵不听见，又没有办法知道那些亵渎神的话是从哪儿来的。", "基督徒在这种懮郁的心境中走了好一阵子以后，他觉得好像听见在他前面有一个人的声音说：“我虽然行过死荫的幽谷，也不怕遭害；因为你与我同在。”"], "en_paras": ["Poor man! where art thou now? thy day is night. Good man, be not cast down, thou yet art right, Thy way to heaven lies by the gates of Hell; Cheer up, hold out, with thee it shall go well.", "About the midst of this valley, I perceived the mouth of hell to be, and it stood also hard by the wayside. Now, thought Christian, what shall I do? And ever and anon the flame and smoke would come out in such abundance, with sparks and hideous noises, (things that cared not for Christian's sword, as did Apollyon before), that he was forced to put up his sword, and betake himself to another weapon called All-prayer. [Eph. 6:18] So he cried in my hearing, \"O Lord, I beseech thee, deliver my soul!\" [Ps. 116:4] Thus he went on a great while, yet still the flames would be reaching towards him. Also he heard doleful voices, and rushings to and fro, so that sometimes he thought he should be torn in pieces, or trodden down like mire in the streets. This frightful sight was seen, and these dreadful noises were heard by him for several miles together; and, coming to a place where he thought he heard a company of fiends coming forward to meet him, he stopped, and began to muse what he had best to do. Sometimes he had half a thought to go back; then again he thought he might be half way through the valley; he remembered also how he had already vanquished many a danger, and that the danger of going back might be much more than for to go forward; so he resolved to go on. Yet the fiends seemed to come nearer and nearer; but when they were come even almost at him, he cried out with a most vehement voice, \"I will walk in the strength of the Lord God!\" so they gave back, and came no further.", "One thing I would not let slip. I took notice that now poor Christian was so confounded, that he did not know his own voice; and thus I perceived it. Just when he was come over against the mouth of the burning pit, one of the wicked ones got behind him, and stepped up softly to him, and whisperingly suggested many grievous blasphemies to him, which he verily thought had proceeded from his own mind. This put Christian more to it than anything that he met with before, even to think that he should now blaspheme him that he loved so much before; yet, if he could have helped it, he would not have done it; but he had not the discretion either to stop his ears, or to know from whence these blasphemies came.", "When Christian had travelled in this disconsolate condition some considerable time, he thought he heard the voice of a man, as going before him, saying, \"Though I walk through the valley of the shadow of death, I will fear no evil, for thou art with me.\" [Ps. 23:4]", "Then he was glad, and that for these reasons:", "First, Because he gathered from thence, that some who feared God were in this valley as well as himself.", "Secondly, For that he perceived God was with them, though in that dark and dismal state; and why not, thought he, with me? though, by reason of the impediment that attends this place, I cannot perceive it. [Job 9:11]"]}, {"sub_zh": "黎明破晓与废墟中的教皇与邪教徒巨人", "sub_en": "Daybreak in the Gloom & The Cavern of Pope and Pagan", "zh_paras": ["然后他感到很愉快，这是由于下面的原因：——第一，因为他从而知道，除他以外，还有敬畏神的人在这个山谷里。第二，因为他发觉，虽然在黑暗和凄惨的环境中，神还跟他们在一起。那么，他想，岂不是也跟我在一起吗？虽然由于这地方的种种阻碍，我看不见祂跟我在一起。第三，因为他希望，要是能够追上他们，以后就有伴侣了。", "于是他继续走着，他喊叫在他面前走的人，但是那个人不知道怎么回答，因为他也以为在山谷里只有他自己一个人。过了一会儿天亮了；基督徒就说，神6“使死荫变为晨光。”天亮之后，他回过头去看，并不是想回去，而是要在白天中看一看他在黑暗里所经历的艰险，因此他更清楚地看到一边的沟和另一边的泥沼，同时也看见它们之间的道路是多么狭窄；他这会儿还瞧见地狱里的小鬼、妖怪和恶龙，不过它们都离开他很远了；因为天亮以后，它们不再走近他，可是他看到了它们，就像《圣经》上记载的， “他将深奥的事从黑暗中彰显，使死荫显为光明。”", "基督徒由于自己在寂寞的旅途中从种种的危险里被救了出来，内心深深地受到了感动；虽然他过去很怕那些危险，但是这会儿他对它们看得更清楚了，因为白天使它们显得更触目。这时候，太阳正在上升，这对基督徒说来又是一个恩赐；因为你会注意到，虽然死荫谷的前一半路很危险，可是他还得走的那后一半路更危险，比他已经走过的路危险得多了；因为从他现在站的地方一直到山谷的尽头，沿途到处布满了陷阱、圈套、机关和罗网，就是陷坑、深穴和突然下倾的路面，要是这会儿天色也像他走前一半路时那样黑的话，即使说他有一千个灵魂，一个也不会留下，也不能算是夸张；不过，就像我说过的，这会儿太阳正在上升。于是他", "说：8“他的灯照在我头上，我借他的光行过黑暗。”", "于是他在白天里走到山谷的尽头。这时候我在梦里看见那儿有血迹、骨头、尸灰和残尸断骸，这些都是以前走过这条路的天路旅客的尸体；我正在默想这是什么缘故，我看见前面离我不远的地方有一个洞穴，古时候有两个巨人住在那儿：一个叫教皇，另一个叫邪教徒，他们借着自己的权势，横施暴虐，好些人被残酷地处死，横在那儿的，就是那些人的骸骨、血迹和灰尘等。但是基督徒走过这地方没有遇到危险；我对这一点弄不大懂；不过后来我才知道邪教徒早已死了；至于教皇呢，虽然他还活着，但是由于已经上了年纪，又由于他年轻时跟人家有过不少猛烈的大小冲突，现在变得衰老不堪，骨节都硬了，只能坐在洞口，露出牙齿对过", "往的天路旅客笑着，一边啃着自己的指甲，因为他没有能力伤害他们了。我看见基督徒只顾走着路；可是一看见坐在洞口的老头儿，他不知道该怎么想好，尤其是因为那老头儿，虽然不能走近他，却对他说，要等到你们更多的人给烧死以后，你才会改过。但是基督徒不答腔，而且拿定主意不开口；因此就这样走过去了，也没有受到伤害。然后基督徒唱道：——哦，奇妙的事可太多啦！ （我不能不这样说）我在这儿经历了多少的困厄，于今我终于摆脱艰险，保全性命！哦，救我脱险的那只手有福份！我在山谷里的时候，地狱，罪恶，魔鬼，以及黑暗里种种的危险，把我紧紧包围；我的路上还布满了圈套，罗网，陷阱，深坑，像我这样一个分文不值、愚昧不堪", "的人，很可能掉进去给绊住，并且跌倒；可是我既然活着，这都归于耶稣的荣耀。"], "en_paras": ["Thirdly, For that he hoped, could he overtake them, to have company by and by. So he went on, and called to him that was before; but he knew not what to answer; for that he also thought to be alone. And by and by the day broke; then said Christian, He hath turned \"the shadow of death into the morning\". [Amos 5:8]", "Now morning being come, he looked back, not out of desire to return, but to see, by the light of the day, what hazards he had gone through in the dark. So he saw more perfectly the ditch that was on the one hand, and the mire that was on the other; also how narrow the way was which led betwixt them both; also now he saw the hobgoblins, and satyrs, and dragons of the pit, but all afar off, (for after break of day, they came not nigh;) yet they were discovered to him, according to that which is written, \"He discovereth deep things out of darkness, and bringeth out to light the shadow of death.\" [Job 12:22]", "Now was Christian much affected with his deliverance from all the dangers of his solitary way; which dangers, though he feared them more before, yet he saw them more clearly now, because the light of the day made them conspicuous to him. And about this time the sun was rising, and this was another mercy to Christian; for you must note, that though the first part of the Valley of the Shadow of Death was dangerous, yet this second part which he was yet to go, was, if possible, far more dangerous; for from the place where he now stood, even to the end of the valley, the way was all along set so full of snares, traps, gins, and nets here, and so full of pits, pitfalls, deep holes, and shelvings down there, that, had it now been dark, as it was when he came the first part of the way, had he had a thousand souls, they had in reason been cast away; but, as I said just now, the sun was rising. Then said he, \"His candle shineth upon my head, and by his light I walk through darkness.\" [Job 29:3]", "In this light, therefore, he came to the end of the valley. Now I saw in my dream, that at the end of this valley lay blood, bones, ashes, and mangled bodies of men, even of pilgrims that had gone this way formerly; and while I was musing what should be the reason, I espied a little before me a cave, where two giants, POPE and PAGAN, dwelt in old time; by whose power and tyranny the men whose bones, blood, and ashes, &c., lay there, were cruelly put to death. But by this place Christian went without much danger, whereat I somewhat wondered; but I have learnt since, that PAGAN has been dead many a day; and as for the other, though he be yet alive, he is, by reason of age, and also of the many shrewd brushes that he met with in his younger days, grown so crazy and stiff in his joints, that he can now do little more than sit in his cave's mouth, grinning at pilgrims as they go by, and biting his nails because he cannot come at them.", "So I saw that Christian went on his way; yet, at the sight of the Old Man that sat in the mouth of the cave, he could not tell what to think, especially because he spake to him, though he could not go after him, saying, \"You will never mend till more of you be burned.\" But he held his peace, and set a good face on it, and so went by and catched no hurt. Then sang Christian:", "O world of wonders! (I can say no less), That I should be preserved in that distress That I have met with here! O blessed be That hand that from it hath deliver'd me! Dangers in darkness, devils, hell, and sin Did compass me, while I this vale was in: Yea, snares, and pits, and traps, and nets, did lie My path about, that worthless, silly I Might have been catch'd, entangled, and cast down; But since I live, let JESUS wear the crown.", "Now, as Christian went on his way, he came to a little ascent, which was cast up on purpose that pilgrims might see before them. Up there, therefore, Christian went, and looking forward, he saw"]}]}, {"num": 13, "id": "chapter-11", "badge_label": "CHAPTER 13", "title_zh": "第十一章 基督徒和忠信", "title_en": "Chapter 11: Christian and Faithful", "desc": "追上忠信同奔天路；忠信述说逃离灭亡城与胜过情欲妇人；摩西律法的严酷痛击与宣道师的勉励。", "blocks": [{"sub_zh": "追上忠信同奔天路", "sub_en": "Christian Overtakes Faithful on the Ascending Ridge", "zh_paras": ["基督徒继续走路，来到一个高坡，那块地是有意堆高的，好让天路旅客看得见前面的路。于是基督徒就往上走；向前一看，看见忠信在他前面走。基督徒就大声喊起来，喂！喂！停住，我要跟你作伴。忠信听见了就回过头来；基督徒朝他喊道，停住，停住，等我一起来。可是忠信回答道，不；我现在有性命的危险，嗜血的报仇者就在我后面。听了这句话，基督徒多少受了感动，于是他拼命赶路，很快就追上了忠信，并且还追过了他；因此原来在后面的反而在前面了。基督徒自豪地笑起来，因为他已经走在他弟兄的前面了；可是由于走路不留心，他突然绊了一跤，跌倒了，直到忠", "信走来搀扶，他才爬起来。", "于是我在梦里看见他们友爱地一路走着，一边亲热地交谈着他们在旅途中所遇到的事情；基督徒这样开头：", "基督徒说：敬爱的兄弟，忠信，我因为追上了你，又因为神已经锻炼了我们的心灵，使我们能够在这个愉快的旅途上做伴，我很高兴。", "忠信说：亲爱的朋友，我原以为从我们的城里出发就有你作伴，但是你先走了；因此我只得单独地走了这么远的路程。", "基督徒问：在我走了以后，你在毁灭城还耽了多久才出发？", "忠信说：一直到我不能再耽下去了；因为你走了之后不久，大家都说我们的城市在短时期里就会给天上的火烧个干净。", "基督徒问：啊！你的邻居们这样说吗？", "忠信说：是的，有一个时期大家全这么说。", "基督徒问：那么，除你以外就没有人逃出来避难的吗？", "忠信说：虽然像我刚才说的，大家都那么讲，可是我认为他们都不十分相信；因为在谈论最热烈的时候，我听见有些人嘲笑地说起你和你那险恶万分的旅程（他们就是这样称呼你的旅程的） 。但是，我相信，现在仍旧相信，我们城市的结局是免不了要被从天而降的硫磺火烧掉；因此我逃了出来。", "基督徒说：你没有听到关于邻居柔顺的事吗？", "忠信说：有，基督徒，我听说他跟你一直走到灰心沼，有的人说他跌了进去；不过他不愿意让人家知道这件事；可是我敢说他一定全身沾满了泥污。", "基督徒问道：邻居们对他说了些什么？", "忠信说：自从他回来以后，他成了所有人嘲笑的对象；有的人拿他开玩笑，瞧不起他，几乎没有人肯给他工作。他现在的情况比他没有离开那城市以前还要坏七倍哩。", "基督徒问道：既然他们也鄙视他所舍弃的道路，为什么他们还这样歧视他？", "忠信说：哦，他们说，把他绞死，他是个叛徒；他嘴里一套，心里又一套！我想由于他弃绝了那条正路，神甚至把他的仇敌都激动起来去攻击他，使他成为众人的话柄。", "基督徒问道：你离开以前，没跟他说过话吗？", "忠信说：有一次我在街上碰到他，可是他就像一个对自己做的事感到惭愧的人一样，眼睛望着别处，避免和我打招呼；因此我也就没有跟他说话。", "基督徒说：啊，我出发的时候，对他还抱着希望；可是现在恐怕他会跟那城市一起灭亡。因为那句古话已经在他身上应验了：2“狗所吐的它转过来又吃，猪洗净了又回到泥里去滚。”", "忠信说：我也担心他会这样；但是要发生的事情谁能阻止呢？", "基督徒说：唔，邻居忠信，我们不去管他吧，还是谈谈直接跟我们有关系的事情吧。现在把你一路上遇到的事情讲给我听；因为我知道你遇到了些事情，不然的话，那就可以称做奇迹了。"], "en_paras": ["Faithful before him, upon his journey. Then said Christian aloud, \"Ho! ho! So-ho! stay, and I will be your companion!\" At that, Faithful looked behind him; to whom Christian cried again, \"Stay, stay, till I come up to you!\" But Faithful answered, \"No, I am upon my life, and the avenger of blood is behind me.\"", "At this, Christian was somewhat moved, and putting to all his strength, he quickly got up with Faithful, and did also overrun him; so the last was first. Then did Christian vain-gloriously smile, because he had gotten the start of his brother; but not taking good heed to his feet, he suddenly stumbled and fell, and could not rise again until Faithful came up to help him.", "Christian's fall makes Faithful and he go lovingly together", "Then I saw in my dream they went very lovingly on together, and had sweet discourse of all things that had happened to them in their pilgrimage; and thus Christian began:", "CHR. My honoured and well-beloved brother, Faithful, I am glad that I have overtaken you; and that God has so tempered our spirits, that we can walk as companions in this so pleasant a path.", "FAITH. I had thought, dear friend, to have had your company quite from our town; but you did get the start of me, wherefore I was forced to come thus much of the way alone.", "CHR. How long did you stay in the City of Destruction before you set out after me on your pilgrimage?", "FAITH. Till I could stay no longer; for there was great talk presently after you were gone out that our city would, in short time, with fire from heaven, be burned down to the ground.", "CHR. What! did your neighbours talk so?", "FAITH. Yes, it was for a while in everybody's mouth.", "CHR. What! and did no more of them but you come out to escape the danger?", "FAITH. Though there was, as I said, a great talk thereabout, yet I do not think they did firmly believe it. For in the heat of the discourse, I heard some of them deridingly speak of you and of your desperate journey, (for so they called this your pilgrimage), but I did believe, and do still, that the end of our city will be with fire and brimstone from above; and therefore I have made my escape.", "CHR. Did you hear no talk of neighbour Pliable?", "FAITH. Yes, Christian, I heard that he followed you till he came at the Slough of Despond, where, as some said, he fell in; but he would not be known to have so done; but I am sure he was soundly bedabbled with that kind of dirt.", "CHR. And what said the neighbours to him?", "FAITH. He hath, since his going back, been had greatly in derision, and that among all sorts of people; some do mock and despise him; and scarce will any set him on work. He is now seven times worse than if he had never gone out of the city.", "CHR. But why should they be so set against him, since they also despise the way that he forsook?", "FAITH. Oh, they say, hang him, he is a turncoat! he was not true to his profession. I think God has stirred up even his enemies to hiss at him, and make him a proverb, because he hath forsaken the way. [Jer. 29:18,19]", "CHR. Had you no talk with him before you came out?", "FAITH. I met him once in the streets, but he leered away on the other side, as one ashamed of what he had done; so I spake not to him.", "CHR. Well, at my first setting out, I had hopes of that man; but now I fear he will perish in the overthrow of the city; for it is happened to him according to the true proverb, \"The dog is turned to his own vomit again; and the sow that was washed, to her wallowing in the mire.\" [2 Pet. 2:22]", "FAITH. These are my fears of him too; but who can hinder that which will be?"]}, {"sub_zh": "忠信述说逃离灭亡城与胜过情欲妇人", "sub_en": "Faithful's Discourse of Fleeing Destruction & Madam Wanton", "zh_paras": ["忠信说：我躲过我看见你掉进去的那个泥沼，没有经过那个险就来到小门前；不过我碰到了一个名叫淫荡的人，我几乎受了她的害。", "基督徒说：幸亏你逃脱了她的圈套：她磨难过约瑟，不过他就像你那样逃脱了；可是几乎丧失他的性命。不过她对你做了些什么？", "忠信说：你真想不到（不过你也知道一点）她花言巧语的本领有多大；她一定要我跟她去，答应我可以得到各种各样的满足。", "基督徒说：不，她可没有答应你良心上的满足吧。", "忠信说：你知道我指的是所有肉欲的满足。", "基督徒说：谢天谢地，你逃过了她；神所憎恶的必坠入她的濠沟。", "忠信说：不，我不知道我有没有完全逃过她。", "基督徒说：怎么？我相信你没有接受她的请求。", "忠信说：没有，我可不肯让自己给玷污了；因为我记起以前看到过的一句古老的话：3“她的脚步踏住阴间。”因此我闭上眼睛，因为我不愿意被她的美貌迷住。于是她破口大骂，我就只顾走我的路。", "基督徒问道：你一路上还遇到别的袭击吗？", "忠信说：我走到艰难山山脚的时候，碰到一个年纪很大的人，他问我是做什么的，往哪儿去。我告诉他我是个天路旅客，往天国去。于是老头儿说，你看上去倒是个老实人；我给你工价，你肯不肯跟我住在一起呢？我就问他的名字叫什么，住在什么地方。他说他的名字叫亚当第一，住在欺骗城。我问他他做的是什么工作，他要付的是怎么样的工价。他对我说他的工作是许多欢乐；他付的工价是我最终会成为他的继承人。我又问他的家是什么样的，还有其他什么样的仆人。他说他家里吃的是世界上所有的山珍海味，他的仆人全是他自己生的。然后我问他有几个孩子。他说他只有三个女儿：1“肉体的情欲，眼目的情欲和今生", "的骄傲；”要是我愿意的话，可以跟她们结婚。", "于是我问他，他要我跟他一起住多久。他说要住到他死为止。", "基督徒说：唔，你们两个人谈话的结果怎么样的呢？", "忠信说：啊，起先我倒有点想跟他去，因为我认为他说得很公道；可是我跟他谈话的时候，一面望着他的前额，我看见那上面写着，2“要脱去从前行为上的旧人。”", "基督徒问道：那又怎么样呢？忠信说：然后我猛的想起，不管他怎么讲，怎么讨好我，等我到了他家里，他会把我当作奴隶卖掉。因此我请他不要再讲下去了，因为我不会走近他的家门的。于是他辱骂我，对我说，他会派一个人来追我，那个人会使我在旅途中痛苦不堪。于是我就离开了他；可是正当我转身要走的时候，我感觉到他一把抓住我的肉，狠狠的拉了一下，使的劲是那么大，我还以为我身体的一部分给他拉走了呢。这使我喊出来：< AHREF=\"#159\">3“我真是苦呀！”然后我就走上山。当我走到半山的时候，回头一望，看见一个人像一阵风似的从后面飞快地赶来；后来他就在放长", "椅子的地方追上了我。", "基督徒说：我就在那地方坐下休息的；而且睡着了，以致把我怀里的这本小册子弄丢了。", "忠信说：嗳，好兄弟，听我说完罢。他一追上我，一言不发，向我拳足交加；他把我打倒在地上，而且还以为我死了。等我清醒了一点，我问他为什么这样对待我。他说因为我暗地里倾向于亚当第一；说完他又在我胸口狠狠地捶了一下，我又被击倒了下去；因此我像刚才那样死人似的躺在他的脚前。我第二次醒过来的时候，就向他求饶；可是他说，我不知道怎么发慈悲；说着又把我击倒；要不是有个人走过，叫他住手，毫无疑问他会结束了我的生命的。", "基督徒问道：叫他住手的那个人是谁？", "忠信说：起先我不认识他；不过，他在我跟前走过的时候，我看见他手上和肋旁的窟窿；于是我知道他是我们的恩主。后来我走上山去。", "基督徒说：追上你的那个人是摩西。他对谁也不留情；对违犯他的律法的人，他也不知道怎样发慈悲。"], "en_paras": ["CHR. Well, neighbour Faithful, said Christian, let us leave him, and talk of things that more immediately concern ourselves. Tell me now, what you have met with in the way as you came; for I know you have met with some things, or else it may be writ for a wonder.", "FAITH. I escaped the Slough that I perceived you fell into, and got up to the gate without that danger; only I met with one whose name was Wanton, who had like to have done me a mischief.", "CHR. It was well you escaped her net; Joseph was hard put to it by her, and he escaped her as you did; but it had like to have cost him his life. [Gen. 39:11-13] But what did she do to you?", "FAITH. You cannot think, but that you know something, what a flattering tongue she had; she lay at me hard to turn aside with her, promising me all manner of content.", "CHR. Nay, she did not promise you the content of a good conscience.", "FAITH. You know what I mean; all carnal and fleshly content.", "CHR. Thank God you have escaped her: \"The abhorred of the Lord shall fall into her ditch.\" [Ps. 22:14]", "FAITH. Nay, I know not whether I did wholly escape her or no.", "CHR. Why, I trow, you did not consent to her desires?", "FAITH. No, not to defile myself; for I remembered an old writing that I had seen, which said, \"Her steps take hold on hell.\" [Prov. 5:5] So I shut mine eyes, because I would not be bewitched with her looks. [Job 31:1] Then she railed on me, and I went my way.", "CHR. Did you meet with no other assault as you came?", "FAITH. When I came to the foot of the hill called Difficulty, I met with a very aged man, who asked me what I was, and whither bound. I told him that I am a pilgrim, going to the Celestial City. Then said the old man, Thou lookest like an honest fellow; wilt thou be content to dwell with me for the wages that I shall give thee? Then I asked him his name, and where he dwelt. He said his name was Adam the First, and that he dwelt in the town of Deceit. [Eph. 4:22] I asked him then what was his work, and what the wages he would give. He told me that his work was many delights; and his wages that I should be his heir at last. I further asked him what house he kept, and what other servants he had. So he told me that his house was maintained with all the dainties in the world; and that his servants were those of his own begetting. Then I asked if he had any children. He said that he had but three daughters: The Lust of the Flesh, The Lust of the Eyes, and The Pride of Life, and that I should marry them all if I would. [1 John 2:16] Then I asked how long time he would have me live with him? And he told me, As long as he lived himself.", "CHR. Well, and what conclusion came the old man and you to at last?", "FAITH. Why, at first, I found myself somewhat inclinable to go with the man, for I thought he spake very fair; but looking in his forehead, as I talked with him, I saw there written, \"Put off the old man with his deeds.\"", "CHR. And how then?", "FAITH. Then it came burning hot into my mind, whatever he said, and however he flattered, when he got me home to his house, he would sell me for a slave. So I bid him forbear to talk, for I would not come near the door of his house. Then he reviled me, and told me that he would send such a one after me, that should make my way bitter to my soul. So I turned to go away from him; but just as I turned myself to go thence, I felt him take hold of my flesh, and give me such a deadly twitch back, that I thought he had pulled part of me after himself. This made me cry, \"O wretched man!\" [Rom. 7:24] So I went on my way up the hill.", "Now when I had got about half-way up, I looked behind, and saw one coming after me, swift as the wind; so he overtook me just about the place where the settle stands.", "CHR. Just there, said Christian, did I sit down to rest me; but being overcome with sleep, I there lost this roll out of my bosom.", "FAITH. But, good brother, hear me out. So soon as the man overtook me, he was but a word and a blow, for down he knocked me, and laid me for dead. But when I was a little come to myself again, I asked him wherefore he served me so. He said, because of my secret inclining to Adam the First; and with that he struck me another deadly blow on the breast, and beat me down backward; so I lay at his foot as dead as before. So, when I came to myself again, I cried him mercy; but he said, I know not how to show mercy; and with that he knocked me down again. He had doubtless made an end of me, but that one came by, and bid him forbear.", "CHR. Who was that that bid him forbear?", "FAITH. I did not know him at first, but as he went by, I perceived the holes in his hands and in his side; then I concluded that he was our Lord. So I went up the hill.", "CHR. That man that overtook you was Moses. He spareth none, neither knoweth he how to show mercy to those that transgress his law."]}, {"sub_zh": "摩西律法的严酷痛击与宣道师的勉励", "sub_en": "The Blows of Moses & Evangelist Foretells Approaching Martyrdom", "zh_paras": ["忠信说：我知道得很清楚，我碰到他不是第一次了。我还安安稳稳住在家里的时候，就是他来对", "我说，要是我再耽下去，他就会把我的房子烧掉。", "基督徒问：在你碰到摩西的山坡上，你没有望见那山顶上的房子吗？", "忠信说：看见的，在没有走到那儿之前还看见狮子哩；至于那些狮子，我想它们都在睡，因为那是中午时分；由于时间很早，我就从看门人那儿经过，下山来了。", "基督徒说：他确实告诉我说他看见你从那儿走过；不过你没有进去拜访，我觉得很可惜，因为如果你进到屋里，他们会给你看许多珍贵的东西，那些东西会使你一辈子也忘不掉 ——不过请告诉我，你在屈辱谷里难道一个人也没有遇到？", "忠信说：遇到的；我遇到一个叫做不知足的人，他很想劝我跟他一起回去，他的理由是：那山谷里根本就没有荣耀。他还对我说，到那儿去就是不听从我所有朋友的一种举动，因为要是我傻到如此地步，竟然拼命要走过这山谷，就像他说的，他知道骄傲、自大、自夸、虚荣以及别人都会非常生气的。基督徒说：那么你怎么回答他的呢？", "忠信说；我对他说，虽然他所说的那些人都跟我认亲戚，而且他们那样做也没错（因为他们的确是我的骨肉至亲） ，但是自从我做了天路旅客，他们就不承认我，而且我也拒绝了他们，因此现在在我看来，他们跟我从来就不属于同一血统。我还告诉他，至于这个山谷，他完全把它误传了；因为“先谦卑，后荣耀， ”1“先骄傲，后跌倒。”因此，我说，我情愿走过这山谷赢得最智慧的人所珍重的荣誉，我可不情愿选择他认为最值得我们喜爱的那些东西。", "基督徒说：你在山谷里没有碰到别的事情吗？", "忠信说：有的，我遇到知耻；不过我认为，我在旅途中碰到的所有人当中，要算他的名字跟他最不相称。其他的人经过一番辩论和别的什么情形以后，都会认错；可是这个厚脸皮的知耻却决不肯这样做。", "基督徒问：怎么，他对你说了些什么？", "忠信说：说了些什么？他竟然反对宗教哩。他说，一个人信奉宗教是件凄惨、下流、卑鄙的事情。他说，一颗温柔的良心不是一个大丈夫所该有的东西；一个人对话语、行为要那样小心，以致使自己受到种种的束缚，不能像历代的英雄豪杰所习惯的那样为所欲为，这样做准会使他贻笑万世。他还说，过去也只有少数有权势、有钱或者聪明的人有跟我同样的见解；而且在他们还没有成为傻瓜的时候，他们中间没有一个人会愿意为了一个不明不白的目的而不顾一切地去冒险。他也讨厌历代天路旅客那种卑微低贱的地位和境遇，也不赞成他们对所有自然科学的一无所知的那种情况。不仅如此，除了我已经告诉你的这些事以外，他在其他许", "许多多的事情上都同样坚持自己的意见；譬如，他认为听讲道的时候，坐在那儿啜泣伤心，是件可耻的事情；回家的时候，又叹息，又呻吟，也是可耻；为了小小的错误向邻居请求原谅，或者把从人家那儿拿来的东西归还原主，也是可耻。他还说，为了大人物的一些缺点（他用很漂亮的名词称呼这些缺点） ，宗教使一个人跟他们疏远起来；同时为了教门里的友爱，承认和尊重了下等人；他说这还不可耻吗？", "基督徒说：你对他怎么说呢？", "忠信说：说什么？开头我不知道说什么好。不但如此，他使我非常为难，我的脸都涨红了；就是这个知耻使我这样，他几乎弄得我完全答不上话来了。但是最后我渐渐想到，人所尊贵的是神认为可憎恶的。我又想，这个知耻告诉我人类是怎么样的；他不告诉我神或者祂的道怎么样。并且我想，在施行最后的审判那天，我们不是按照世界上那帮虚张声势的幽灵的意思，而是按照神的智慧和法律来定生死之罪。因此我想，神说的话是至善无比的，尽管全世界的人都反对它。神是爱祂的不知足教会的；神是欢喜温柔的良心的；那些为了天国而当了傻瓜的人是最聪明的，并且一个爱基督的可怜", "虫比一个恨基督的大人物更富有；因此我说，知耻，走开吧，你是我得救的阻碍！难道我会反对我至高的主来接待你吗？那样，在祂来的那一天，我有什么脸面看祂呢？要是我现在把祂的道和祂的仆人当作可耻的，我怎么能期望得到祂的祝福呢？但是知耻这个人确实是个大胆的恶徒；我几乎无法把他打发走；他老是缠住我，不断在我耳边低语着，不是事提到宗教的这个坏处，就是提到那个坏处。最后我告诉他在这件上再多花工夫也是枉然；因为他瞧不起的东西，正是我认为最荣耀的东西；这样，我终于从这个讨厌的家伙身边走过。我摆脱了他以后，就开始唱道：——顺从上天召唤的人们，", "所遭遇的诱惑数说不清，这些诱惑投合肉欲的爱好，它来了又来，来的次数不知多少；所以不仅在现在，就是在将来别的际会，我们都可能被它逮住，战胜，毁灭。哦，旅客们，旅客们要小心，一举一动都要像个堂堂的男人。", "忠信的朋友骄傲、自大、自夸和虚荣", "基督徒说：好弟兄，你这样勇敢地抗拒这个坏蛋，我真高兴；就像你所说的，我认为在所有的人当中，他的名字最不恰当；因为他敢于在街上跟随我们，要使我们在众人面前受辱；也就是说，要使我们以上好的事情为耻。要不是他自己脸皮厚的话，他决不会作出他所做的事。不过我们还是抗拒他吧；因为，尽管他百般夸耀，他升擢的是愚昧人，只是愚昧人。 “智慧人必承受尊荣， ”所罗门说：3“愚昧人高升也成为羞辱。”", "忠信说：我认为我们得求祂来帮我们抵御知耻，祂要我们在世上为真理奋勇斗争。", "基督徒说：你说得对；可是你在山谷里没碰到别人吗？", "忠信说：没有，我没有；因为在后来的旅程中，并且在我走过死荫谷的时候，一路上天气都是晴朗的。", "基督徒说：那对你很好；我可倒霉呢。一走进屈辱谷，我就跟那个可憎的仇敌魔王恶斗了好长一段时间；是的，我真以为他会把我杀死哩，尤其是当他把我按在地上，把我压在下面，好像要把我压得粉碎的时候；因为他把我摔倒，我的剑从手里飞出去 ——他还对我说，我已经在他的手掌里了；可是我求告神，祂听见了我，把我从灾难中救出来。然后我走进死荫谷，在那儿几乎有一半的路程是在一片乌漆麻黑中摸索前进的。我屡次以为自己会死在山谷里；可是终于天亮了，太阳出来了。在以后的路上，我就觉得容易走得多，心里也安宁多了。"], "en_paras": ["FAITH. I know it very well; it was not the first time that he has met with me. It was he that came to me when I dwelt securely at home, and that told me he would burn my house over my head if I stayed there.", "CHR. But did you not see the house that stood there on the top of the hill, on the side of which Moses met you?", "FAITH. Yes, and the lions too, before I came at it: but for the lions, I think they were asleep, for it was about noon; and because I had so much of the day before me, I passed by the porter, and came down the hill.", "CHR. He told me, indeed, that he saw you go by, but I wish you had called at the house, for they would have showed you so many rarities, that you would scarce have forgot them to the day of your death. But pray tell me, Did you meet nobody in the Valley of Humility?", "FAITH. Yes, I met with one Discontent, who would willingly have persuaded me to go back again with him; his reason was, for that the valley was altogether without honour. He told me, moreover, that there to go was the way to disobey all my friends, as Pride, Arrogancy, Self-conceit, Worldly-glory, with others, who he knew, as he said, would be very much offended, if I made such a fool of myself as to wade through this valley.", "CHR. Well, and how did you answer him?", "Faithful's answer to Discontent", "FAITH. I told him, that although all these that he named might claim kindred of me, and that rightly, for indeed they were my relations according to the flesh; yet since I became a pilgrim, they have disowned me, as I also have rejected them; and therefore they were to me now no more than if they had never been of my lineage.", "I told him, moreover, that as to this valley, he had quite misrepresented the thing; for before honour is humility, and a haughty spirit before a fall. Therefore, said I, I had rather go through this valley to the honour that was so accounted by the wisest, than choose that which he esteemed most worthy our affections.", "CHR. Met you with nothing else in that valley?", "FAITH. Yes, I met with Shame; but of all the men that I met with in my pilgrimage, he, I think, bears the wrong name. The others would be said nay, after a little argumentation, and somewhat else; but this bold-faced Shame would never have done.", "CHR. Why, what did he say to you?", "FAITH. What! why, he objected against religion itself; he said it was a pitiful, low, sneaking business for a man to mind religion; he said that a tender conscience was an unmanly thing; and that for a man to watch over his words and ways, so as to tie up himself from that hectoring liberty that the brave spirits of the times accustom themselves unto, would make him the ridicule of the times. He objected also, that but few of the mighty, rich, or wise, were ever of my opinion [1 Cor. 1:26; 3:18; Phil. 3:7,8]; nor any of them neither [John 7:48], before they were persuaded to be fools, and to be of a voluntary fondness, to venture the loss of all, for nobody knows what. He, moreover, objected the base and low estate and condition of those that were chiefly the pilgrims of the times in which they lived: also their ignorance and want of understanding in all natural science. Yea, he did hold me to it at that rate also, about a great many more things than here I relate; as, that it was a shame to sit whining and mourning under a sermon, and a shame to come sighing and groaning home: that it was a shame to ask my neighbour forgiveness for petty faults, or to make restitution where I have taken from any. He said, also, that religion made a man grow strange to the great, because of a few vices, which he called by finer names; and made him own and respect the base, because of the same religious fraternity. And is not this, said he, a shame?", "CHR. And what did you say to him?", "FAITH. Say! I could not tell what to say at the first. Yea, he put me so to it, that my blood came up in my face; even this Shame fetched it up, and had almost beat me quite off. But at last I began to consider, that \"that which is highly esteemed among men, is had in abomination with God.\" [Luke 16:15] And I thought again, this Shame tells me what men are; but it tells me nothing what God or the Word of God is. And I thought, moreover, that at the day of doom, we shall not be doomed to death or life according to the hectoring spirits of the world, but according to the wisdom and law of the Highest. Therefore, thought I, what God says is best, indeed is best, though all the men in the world are against it. Seeing, then, that God prefers his religion; seeing God prefers a tender conscience; seeing they that make themselves fools for the kingdom of heaven are wisest; and that the poor man that loveth Christ is richer than the greatest man in the world that hates him; Shame, depart, thou art an enemy to my salvation! Shall I entertain thee against my sovereign Lord? How then shall I look him in the face at his coming? Should I now be ashamed of his ways and servants, how can I expect the blessing? [Mark 8:38] But, indeed, this Shame was a bold villain; I could scarce shake him out of my company; yea, he would be haunting of me, and continually whispering me in the ear, with some one or other of the infirmities that attend religion; but at last I told him it was but in vain to attempt further in this business; for those things that he disdained, in those did I see most glory; and so at last I got past this importunate one. And when I had shaken him off, then I began to sing--", "The trials that those men do meet withal, That are obedient to the heavenly call, Are manifold, and suited to the flesh, And come, and come, and come again afresh; That now, or sometime else, we by them may Be taken, overcome, and cast away. Oh, let the pilgrims, let the pilgrims, then Be vigilant, and quit themselves like men.", "CHR. I am glad, my brother, that thou didst withstand this villain so bravely; for of all, as thou sayest, I think he has the wrong name; for he is so bold as to follow us in the streets, and to attempt to put us to shame before all men: that is, to make us ashamed of that which is good; but if he was not himself audacious, he would never attempt to do as he does. But let us still resist him; for notwithstanding all his bravadoes, he promoteth the fool and none else. \"The wise shall inherit glory, said Solomon, but shame shall be the promotion of fools.\" [Prov. 3:35]", "FAITH. I think we must cry to Him for help against Shame, who would have us to be valiant for the truth upon the earth.", "CHR. You say true; but did you meet nobody else in that valley?", "FAITH. No, not I; for I had sunshine all the rest of the way through that, and also through the Valley of the Shadow of Death.", "CHR. It was well for you. I am sure it fared far otherwise with me; I had for a long season, as soon almost as I entered into that valley, a dreadful combat with that foul fiend Apollyon; yea, I thought verily he would have killed me, especially when he got me down and crushed me under him, as if he would have crushed me to pieces; for as he threw me, my sword flew out of my hand; nay, he told me he was sure of me: but I cried to God, and he heard me, and delivered me out of all my troubles. Then I entered into the Valley of the Shadow of Death, and had no light for almost half the way through it. I thought I should have been killed there, over and over; but at last day broke, and the sun rose, and I went through that which was behind with far more ease and quiet.", "Moreover, I saw in my dream, that as they went on, Faithful, as he chanced to look on one side, saw a man"]}]}, {"num": 14, "id": "chapter-12", "badge_label": "CHAPTER 14", "title_zh": "第十二章 多话", "title_en": "Chapter 12: Talkative", "desc": "偶遇善于夸夸其谈的多话先生；忠信受惑与基督徒洞悉其虚假本相；真信仰与假知识的本质区别。", "blocks": [{"sub_zh": "偶遇善于夸夸其谈的多话先生", "sub_en": "Talkative of Prating Row Joins Company", "zh_paras": ["我在梦里还看见，他们往前走的时候，忠信偶然向旁边一望，看到一个叫做多话的人在离开他们旁边不远的地方走着；因为这儿路面很阔，他们可以并排行走。他个子很高，远远的看过去比靠近看去更漂亮。忠信对这个人这样说：——朋友，你到哪儿去？你是不是上天国去？", "多话说：我是上那儿去。", "忠信说：那很好；那么我希望我们可以有你作伴。", "多话说：我非常愿意跟你们作伴。", "忠信说：那么，来吧，我们一块儿走，让我们谈些有益的事情来消磨时间。", "多话说：我愿意跟你或者任何人谈论有益的事情；我碰到喜欢这种高尚消遣的人，心里非常高兴；因为，说真的，很少人在旅途上欢喜这样消磨时间，他们宁可谈些无益的事情；这使我感到烦恼。", "忠信说：这的确是件可叹的事情；因为有什么事情像天上的神的事情这样值得世上人使用他们的舌头和嘴唇呢？", "多话说：我非常喜欢你，因为你的话具有很大的说服力；我要加上一句，有什么事情像谈论神的事情这样愉快、这样有益呢？有什么事情这样愉快呢？ ——那就是说，如果一个人对奇妙的事情感到兴趣的话。譬如说：如果一个人喜欢谈论历史或者事物的奥秘，或者喜爱谈论神迹、奇迹或预兆，他上哪儿去找像《圣经》里记载得那么有趣，写得那么美丽的事情呢？", "忠信说：这倒是真的；不过我们的主要目的是要从谈论这种事情中得到益处。", "多话说：我就是这样讲；因为谈这种事情最有益处；因为这样谈论，可以使一个人得到很多知识；譬如说，关于世上东西的空虚和天上东西的好处这种知识。一般说来是这样，尤其是通过了这种谈论，一个人能认识到重生的必要，认识到我们靠行为是无济于事的以及对基督的正义的需要等等。并且这样做能使一个人认识到悔改、信仰、祈祷、忍耐或其他这类事是怎么一回事；这样做，一个人还会知道什么是福音的伟大诺言和慰藉，这会给他安慰。这样做，一个人还可以学会怎样拒绝不正确的见解，拥护真理以及教导无知的人。", "忠信说：你所说的都很对；听见你说这些话，我很高兴。", "多话说：哎呀！就是因为缺少谈论，所以很少人懂得，为了要获得永生，需要有信心，也需要恩典在他们灵魂里作工；可是他们愚昧地生活在律法里，而那样做他们决得不到天国的。", "忠信说：但是，对不起，这种至上的知识是神的恩赐；谁也不能靠自己的勤劳或者光靠谈论它们就可以得到这种知识。", "多话说：这我全知道；因为除非上天赐给他，一个人什么也不会有；一切都是靠恩典，而不是靠行为得来的。为了证明这一点，我能举出一百句《圣经》里的话。", "忠信说：那么，我们现在要谈的是什么呢？", "多话说：随你说吧；只要对我们有好处，无论是天上的事情，地上的事情，有关道德的事情，或者有关福音的事情，神圣的事情，或者亵渎的事情，过去的事情，或者将来的事情，外面的事情，或者家里的事情，比较重要的事情，或者偶然的事情，我都愿意谈。这会儿忠信开始觉得惊奇。他向基督徒走去（因为在这一段时间里基督徒一直是单独走着） ，轻轻地对他说：我们有个多么勇敢的伴侣！这个人一定会成为一个非常出色的天路旅客。"], "en_paras": ["whose name is Talkative, walking at a distance beside them; for in this place there was room enough for them all to walk. He was a tall man, and something more comely at a distance than at hand. To this man Faithful addressed himself in this manner:", "FAITH. Friend, whither away? Are you going to the heavenly country?", "TALK. I am going to the same place.", "FAITH. That is well; then I hope we may have your good company.", "TALK. With a very good will will I be your companion.", "FAITH. Come on, then, and let us go together, and let us spend our time in discoursing of things that are profitable.", "Talkative's dislike of bad discourse", "TALK. To talk of things that are good, to me is very acceptable, with you or with any other; and I am glad that I have met with those that incline to so good a work; for, to speak the truth, there are but few that care thus to spend their time, (as they are in their travels), but choose much rather to be speaking of things to no profit; and this hath been a trouble for me.", "FAITH. That is indeed a thing to be lamented; for what things so worthy of the use of the tongue and mouth of men on earth as are the things of the God of heaven?", "TALK. I like you wonderful well, for your sayings are full of conviction; and I will add, what thing is so pleasant, and what so profitable, as to talk of the things of God? What things so pleasant (that is, if a man hath any delight in things that are wonderful)? For instance, if a man doth delight to talk of the history or the mystery of things; or if a man doth love to talk of miracles, wonders, or signs, where shall he find things recorded so delightful, and so sweetly penned, as in the Holy Scripture?", "FAITH. That is true; but to be profited by such things in our talk should be that which we design.", "Talkative's fine discourse", "TALK. That is it that I said; for to talk of such things is most profitable; for by so doing, a man may get knowledge of many things; as of the vanity of earthly things, and the benefit of things above. Thus, in general, but more particularly by this, a man may learn the necessity of the new birth, the insufficiency of our works, the need of Christ's righteousness, &c. Besides, by this a man may learn, by talk, what it is to repent, to believe, to pray, to suffer, or the like; by this also a man may learn what are the great promises and consolations of the gospel, to his own comfort. Further, by this a man may learn to refute false opinions, to vindicate the truth, and also to instruct the ignorant.", "FAITH. All this is true, and glad am I to hear these things from you.", "TALK. Alas! the want of this is the cause why so few understand the need of faith, and the necessity of a work of grace in their soul, in order to eternal life; but ignorantly live in the works of the law, by which a man can by no means obtain the kingdom of heaven.", "FAITH. But, by your leave, heavenly knowledge of these is the gift of God; no man attaineth to them by human industry, or only by the talk of them.", "TALK. All this I know very well; for a man can receive nothing, except it be given him from Heaven; all is of grace, not of works. I could give you a hundred scriptures for the confirmation of this.", "FAITH. Well, then, said Faithful, what is that one thing that we shall at this time found our discourse upon?", "TALK. What you will. I will talk of things heavenly, or things earthly; things moral, or things evangelical; things sacred, or things profane; things past, or things to come; things foreign, or things at home; things more essential, or things circumstantial; provided that all be done to our profit."]}, {"sub_zh": "忠信受惑与基督徒洞悉其虚假本相", "sub_en": "Faithful Deceived & Christian Unmasks Talkative's True Nature", "zh_paras": ["基督徒听了，谦虚地笑笑，说：你这样喜欢的这个人会用他的舌头去欺骗所有对他的为人不了解的人。", "忠信问：那么你了解他吗？", "基督徒说：了解他？当然了解，比他了解他自己还清楚。", "忠信说：请告诉我，他是什么人？", "基督徒说：他叫做多话，住在我们的城里。我觉得奇怪，你怎么会不认识他；不过我想我们的城相当大。", "忠信说：他是谁的儿子？他住在哪儿？", "基督徒说：他是好口才的儿子，住在闲扯街；所有认识他的人都知道他是闲扯街的多话；尽管他口才好，他只是个无聊的人。", "忠信说：啊，他看上去很象样。", "基督徒说：对他认识不十分清楚的人，会觉得他很象样的，因为他在外面表现得好到了极点；在家乡一带可表现得够丑恶了。你说他很象样，这使我想起我在画家的画上所看到的情况，它们远看非常好，走近一看却不那么好看。", "忠信说：不过我想你一定在说笑话，因为你在笑呢。", "基督徒说：虽然我笑了，可是在这件事上我决不打诮，我也决不随便指责人。我再告诉你一点关于这个人的事。他跟谁都合得来，什么话都讲得出；他现在跟你这样谈，他在酒店里也照样会这样谈；酒喝得越多，话也越多。在他的内心、在他的家庭里、他的话语里都没有宗教；他的一切都在舌头上，他的宗教只停留在他利用舌头发出的声音中。", "忠信说：真的吗？那我可上了这个人的大当了。", "基督徒说：上当！当然上了当啦。记住那句俗语， “他们能说不能行；”可是神的国不在乎言语，而在乎权能。他谈到祈祷、忏悔、信心和重生，可是他只知道说说罢了。我到过他的家，看到他在家里和在外面的情况，我知道我所说关于他的事情是实话。他家里没有宗教，就如同蛋白没有味道一样。那儿没有祈祷，也没有悔罪的迹象；是的，在某种程度上，野兽比他更能为神服务。所有知道他的人都认为他是宗教界的奇耻大辱；由于他是这样一个人，在他住的城市的那一头对宗教简直就没有一句好话。一般知道他的人都这样说： “在外是一个圣人，在家是一个魔鬼。”他那可怜的家人也这样觉", "得；他的脾气是那么坏，那样爱骂他的仆人，对待他们那样不讲理，他们不知道该为他做些什么、该对他说些什么话了。跟他有过接触的人说，宁可跟土耳其人来往，可不愿意跟他打交道，因为在土耳其人手里还可以做到公平一点的交易。这一个多话（要是办得到的话）还会压倒他们、诱惑他们、欺骗他们、占他们的便宜。他还把他的儿子们教养得跟他一样；如果他发现哪一个儿子现出愚蠢的羞怯，他就管他们叫笨蛋和傻瓜，并且决不让他们做什么事，也不在别人面前称赞他们。至于我，我认为由于他那不道德的生活，他使很多人堕落；如果神不防止的话，他还会使更多的人沉沦。", "忠信说：啊，我的兄弟，我一定相信你，不但因为你说你知道他的底细，还为了你像个基督徒，对人有调查研究。我不能相信你讲这些事是出于恶意，因为事实的确像你所说的那样。", "基督徒说：要是我对他了解得不比你清楚，或许我对他也可能有像你起初那样的看法；不仅如此，如果我只从反对宗教的那些人那儿听到关于他的事情，我会认为那是诽谤 ——那是坏人常常加在好人的名字和职业上的定论。但是根据我所知道的，我能证明所有这些事情都是实在的，并且他还有更多同样恶劣的事情呢。而且，好人为他感到羞耻——他们不能以弟兄称呼他，也不能称他为朋友；要是他们知道他为人是怎么样的话，在他们中间只要提起他的名字，他们就会不由地脸红起来。", "忠信说：啊，我明白了，说话跟行动是两回事，今后我要更加注意这个区别。"], "en_paras": ["FAITH. Now did Faithful begin to wonder; and stepping to Christian, (for he walked all this while by himself), he said to him, (but softly), What a brave companion have we got! Surely this man will make a very excellent pilgrim.", "CHR. At this Christian modestly smiled, and said, This man, with whom you are so taken, will beguile, with that tongue of his, twenty of them that know him not.", "FAITH. Do you know him, then?", "CHR. Know him! Yes, better than he knows himself.", "FAITH. Pray, what is he?", "CHR. His name is Talkative; he dwelleth in our town. I wonder that you should be a stranger to him, only I consider that our town is large.", "FAITH. Whose son is he? And whereabout does he dwell?", "CHR. He is the son of one Say-well; he dwelt in Prating Row; and is known of all that are acquainted with him, by the name of Talkative in Prating Row; and notwithstanding his fine tongue, he is but a sorry fellow.", "FAITH. Well, he seems to be a very pretty man.", "CHR. That is, to them who have not thorough acquaintance with him; for he is best abroad; near home, he is ugly enough. Your saying that he is a pretty man, brings to my mind what I have observed in the work of the painter, whose pictures show best at a distance, but, very near, more unpleasing.", "FAITH. But I am ready to think you do but jest, because you smiled.", "CHR. God forbid that I should jest (although I smiled) in this matter, or that I should accuse any falsely! I will give you a further discovery of him. This man is for any company, and for any talk; as he talketh now with you, so will he talk when he is on the ale-bench; and the more drink he hath in his crown, the more of these things he hath in his mouth; religion hath no place in his heart, or house, or conversation; all he hath lieth in his tongue, and his religion is, to make a noise therewith.", "FAITH. Say you so! then am I in this man greatly deceived.", "CHR. Deceived! you may be sure of it; remember the proverb, \"They say and do not.\" [Matt. 23:3] But the kingdom of God is not in word, but in Power. [1 Cor 4:20] He talketh of prayer, of repentance, of faith, and of the new birth; but he knows but only to talk of them. I have been in his family, and have observed him both at home and abroad; and I know what I say of him is the truth. His house is as empty of religion as the white of an egg is of savour. There is there neither prayer nor sign of repentance for sin; yea, the brute in his kind serves God far better than he. He is the very stain, reproach, and shame of religion, to all that know him; it can hardly have a good word in all that end of the town where he dwells, through him. [Rom. 2:24,25] Thus say the common people that know him, A saint abroad, and a devil at home. His poor family finds it so; he is such a churl, such a railer at and so unreasonable with his servants, that they neither know how to do for or speak to him. Men that have any dealings with him say it is better to deal with a Turk than with him; for fairer dealing they shall have at their hands. This Talkative (if it be possible) will go beyond them, defraud, beguile, and overreach them. Besides, he brings up his sons to follow his steps; and if he findeth in any of them a foolish timorousness, (for so he calls the first appearance of a tender conscience,) he calls them fools and blockheads, and by no means will employ them in much, or speak to their commendations before others. For my part, I am of opinion, that he has, by his wicked life, caused many to stumble and fall; and will be, if God prevent not, the ruin of many more.", "FAITH. Well, my brother, I am bound to believe you; not only because you say you know him, but also because, like a Christian, you make your reports of men. For I cannot think that you speak these things of ill-will, but because it is even so as you say.", "CHR. Had I known him no more than you, I might perhaps have thought of him, as, at the first, you did; yea, had he received this report at their hands only that are enemies to religion, I should have thought it had been a slander,--a lot that often falls from bad men's mouths upon good men's names and professions; but all these things, yea, and a great many more as bad, of my own knowledge, I can prove him guilty of. Besides, good men are ashamed of him; they can neither call him brother, nor friend; the very naming of him among them makes them blush, if they know him.", "FAITH. Well, I see that saying and doing are two things, and hereafter I shall better observe this distinction.", "CHR. They are two things, indeed, and are as diverse as are the soul and the body; for as the body without the soul is but a dead carcass, so saying, if it be alone, is but a dead carcass also. The soul of religion is the practical part: \"Pure religion and undefiled, before God and the Father, is this, To visit the fatherless and widows in their affliction, and to keep himself unspotted from the world.\" [James 1:27; see vv. 22-26] This Talkative is not aware of; he thinks that hearing and saying will make a good Christian, and thus he deceiveth his own soul. Hearing is but as the sowing of the seed; talking is n
