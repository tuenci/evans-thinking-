    function renderMobileHomeHtml() {
      const hero = renderBookHomeHeroHtml();
      const dir = renderChapterDirectoryHtml();
      return `
        <div class="book-home-wrap mobile-home-container">
          ${hero}
          <div style="padding-top: 10px;">
            ${dir}
          </div>
        </div>
      `;
    }

    /* ========================================================
       RENDER CURRENT VIEW (Single Page or Dual Spread)
       ======================================================== */
    function renderCurrentView() {
      const spreadEl = document.getElementById('book-spread');
      spreadEl.classList.remove('anim-turn');
      void spreadEl.offsetWidth; // trigger reflow
      spreadEl.classList.add('anim-turn');

      const isSingle = isSinglePageMode();
      const leafL = document.getElementById('leaf-left');
      const leafR = document.getElementById('leaf-right');
      const bodyL = document.getElementById('body-left');
      const bodyR = document.getElementById('body-right');
      const headerL = document.getElementById('header-left');
      const headerR = document.getElementById('header-right');
      const gutter = document.getElementById('book-gutter');
      const pageNumL = document.getElementById('page-num-left');
      const pageNumR = document.getElementById('page-num-right');
      const titleL = document.getElementById('page-title-left');
      const titleR = document.getElementById('page-title-right');

      // Standalone & Home Navigation Controls
      const homeBtn = document.getElementById('btn-home');
      const studyBtn = document.getElementById('btn-study');
      const isStandalone = window.location.search.includes('standalone=1') || window.location.hash.includes('standalone');

      if (isStandalone) {
        // Standalone mode: HIDE HOME BUTTON EVERYWHERE
        if (homeBtn) homeBtn.style.display = 'none';
        if (studyBtn) {
          studyBtn.style.display = 'inline-flex';
          studyBtn.href = BOOK.meta.reader_url + (BOOK.meta.reader_url.includes('?') ? '&' : '?') + 'standalone=1';
        }
      } else {
        // Normal mode: Show Home button ONLY on Book Home (Page 0)
        const isAtBookHome = isSingle ? (currentPageIdx === 0) : (currentSpreadIdx === 0);
        if (homeBtn) homeBtn.style.display = isAtBookHome ? 'inline-flex' : 'none';
        if (studyBtn) {
          studyBtn.style.display = 'inline-flex';
          studyBtn.href = BOOK.meta.reader_url;
        }
      }

      // --- CASE 1: BOOK HOME PAGE (INDEX 0) ---
      if ((isSingle && currentPageIdx === 0) || (!isSingle && currentSpreadIdx === 0)) {
        if (isSingle) {
          // Mobile Book Home Page
          gutter.style.display = 'none';
          leafR.style.display = 'none';
          leafL.style.display = 'flex';
          leafL.classList.add('is-home-page');
          headerL.style.display = 'none';

          bodyL.innerHTML = renderMobileHomeHtml();
          pageNumL.textContent = '';
          titleL.textContent = '';
          document.getElementById('hud-chapter-name').textContent = '书籍首页 · 卷目总览';

          document.getElementById('lbl-cur-spread').textContent = '书籍首页';
          document.getElementById('lbl-total-spreads').textContent = `共 ${PAGES.length} 页`;
          document.getElementById('lbl-pct').textContent = '0%';
          const slider = document.getElementById('spread-slider');
          slider.min = 0;
          slider.max = PAGES.length;
          slider.value = 0;
        } else {
          // Desktop Dual Spread Book Home Page (Left: Cover Hero, Right: Chapter Directory)
          gutter.style.display = 'block';
          leafL.style.display = 'flex';
          leafR.style.display = 'flex';
          leafL.classList.remove('is-home-page');
          headerL.style.display = 'none';
          headerR.style.display = 'none';

          bodyL.innerHTML = renderBookHomeHeroHtml();
          bodyR.innerHTML = renderChapterDirectoryHtml();
          pageNumL.textContent = '';
          pageNumR.textContent = '';
          titleL.textContent = '';
          titleR.textContent = '';
          document.getElementById('hud-chapter-name').textContent = '书籍首页 · 卷目总览';

          const totalSpreads = Math.ceil(PAGES.length / 2);
          document.getElementById('lbl-cur-spread').textContent = '书籍首页';
          document.getElementById('lbl-total-spreads').textContent = `共 ${PAGES.length} 页`;
          document.getElementById('lbl-pct').textContent = '0%';
          const slider = document.getElementById('spread-slider');
          slider.min = 0;
          slider.max = totalSpreads;
          slider.value = 0;
        }

        updateTocActive();
        saveState();
        resetIdleTimer();
        return;
      }

      // --- CASE 2: BODY READING PAGES (INDEX >= 1) ---
      headerL.style.display = 'flex';
      headerR.style.display = 'flex';
      leafL.classList.remove('is-home-page');

      if (isSingle) {
        // Mobile / Portrait Single Page
        gutter.style.display = 'none';
        leafR.style.display = 'none';
        leafL.style.display = 'flex';

        const curPage = PAGES[currentPageIdx - 1];
        if (curPage) {
          bodyL.innerHTML = curPage.html;
          pageNumL.textContent = currentPageIdx;
          titleL.textContent = `《${BOOK.meta.title_zh}》 · ${curPage.chapterTitle}`;
          document.getElementById('hud-chapter-name').textContent = `${curPage.chapterNum}. ${curPage.chapterTitle}`;
        }

        document.getElementById('lbl-cur-spread').textContent = `第 ${currentPageIdx} 页`;
        document.getElementById('lbl-total-spreads').textContent = `共 ${PAGES.length} 页`;
        const pct = Math.round((currentPageIdx / PAGES.length) * 100);
        document.getElementById('lbl-pct').textContent = `${pct}%`;
        const slider = document.getElementById('spread-slider');
        slider.min = 0;
        slider.max = PAGES.length;
        slider.value = currentPageIdx;
      } else {
        // Desktop Landscape Dual Spread
        gutter.style.display = 'block';
        leafL.style.display = 'flex';
        leafR.style.display = 'flex';

        const totalSpreads = Math.ceil(PAGES.length / 2);
        const leftPageNum = (currentSpreadIdx * 2) - 1;
        const rightPageNum = currentSpreadIdx * 2;

        const pageLeft = PAGES[leftPageNum - 1];
        const pageRight = PAGES[rightPageNum - 1];

        if (pageLeft) {
          bodyL.innerHTML = pageLeft.html;
          pageNumL.textContent = leftPageNum;
          titleL.textContent = `《${BOOK.meta.title_zh}》 · ${BOOK.meta.author}`;
          document.getElementById('hud-chapter-name').textContent = `${pageLeft.chapterNum}. ${pageLeft.chapterTitle}`;
        } else {
          bodyL.innerHTML = '';
          pageNumL.textContent = '';
          titleL.textContent = '';
        }

        if (pageRight) {
          bodyR.innerHTML = pageRight.html;
          pageNumR.textContent = rightPageNum;
          titleR.textContent = `${pageRight.chapterTitle}`;
        } else {
          bodyR.innerHTML = '<div style="text-align:center; padding: 60px 0; color:var(--text-muted); font-style:italic;">— 本书完结 谨献恩典之主 —</div>';
          pageNumR.textContent = '';
          titleR.textContent = '';
        }

        document.getElementById('lbl-cur-spread').textContent = `第 ${leftPageNum}${pageRight ? '-' + rightPageNum : ''} 页`;
        document.getElementById('lbl-total-spreads').textContent = `共 ${PAGES.length} 页`;
        const pct = Math.round((currentSpreadIdx / totalSpreads) * 100);
        document.getElementById('lbl-pct').textContent = `${pct}%`;
        const slider = document.getElementById('spread-slider');
        slider.min = 0;
        slider.max = totalSpreads;
        slider.value = currentSpreadIdx;
      }

      updateTocActive();
      saveState();
      resetIdleTimer();
    }

    /* ========================================================
       PAGE NAVIGATION & INTERACTION
       ======================================================== */
    function goToBookHome() {
      currentPageIdx = 0;
      currentSpreadIdx = 0;
      renderCurrentView();
    }

    function startReadingBook() {
      currentPageIdx = 1;
      currentSpreadIdx = 1;
      renderCurrentView();
    }

    function goToChapter(chNum) {
      closeAllModals();
      const targetCh = BOOK.chapters.find(c => c.num === chNum);
      if (targetCh && targetCh.startPage) {
        currentPageIdx = targetCh.startPage;
        currentSpreadIdx = Math.ceil(currentPageIdx / 2);
        renderCurrentView();
      }
    }

    function nextView() {
      if (isSinglePageMode()) {
        if (currentPageIdx < PAGES.length) {
          currentPageIdx++;
          renderCurrentView();
        }
      } else {
        const totalSpreads = Math.ceil(PAGES.length / 2);
        if (currentSpreadIdx < totalSpreads) {
          currentSpreadIdx++;
          currentPageIdx = (currentSpreadIdx * 2) - 1;
          renderCurrentView();
        }
      }
    }

    function prevView() {
      if (isSinglePageMode()) {
        if (currentPageIdx > 0) {
          currentPageIdx--;
          renderCurrentView();
        }
      } else {
        if (currentSpreadIdx > 0) {
          currentSpreadIdx--;
          currentPageIdx = currentSpreadIdx === 0 ? 0 : (currentSpreadIdx * 2) - 1;
          renderCurrentView();
        }
      }
    }

    function jumpToView(val) {
      val = parseInt(val, 10);
      if (isSinglePageMode()) {
        currentPageIdx = val;
      } else {
        currentSpreadIdx = val;
        currentPageIdx = val === 0 ? 0 : (val * 2) - 1;
      }
      renderCurrentView();
    }

    function nextChapter() {
      const curNum = getActiveChapterNum();
      if (curNum < BOOK.chapters.length) {
        goToChapter(curNum + 1);
      }
    }

    function prevChapter() {
      const curNum = getActiveChapterNum();
      if (curNum > 1) {
        goToChapter(curNum - 1);
      } else {
        goToBookHome();
      }
    }

    /* ========================================================
       TABLE OF CONTENTS DRAWER
       ======================================================== */
    function renderToc() {
      const listEl = document.getElementById('toc-list');
      if (!listEl) return;
      let html = '';

      // First entry is Book Home Page
      html += `
        <li class="toc-item ${currentPageIdx === 0 ? 'active' : ''}" onclick="goToBookHome()">
          <span class="toc-item-title">📖 书籍首页 · 封面与卷目总览</span>
          <span class="toc-item-page">首页</span>
        </li>
      `;

      for (const ch of BOOK.chapters) {
        const isAct = getActiveChapterNum() === ch.num && currentPageIdx > 0;
        const pageLabel = ch.startPage ? `第 ${ch.startPage} 页` : '';
        html += `
          <li class="toc-item ${isAct ? 'active' : ''}" onclick="goToChapter(${ch.num})" data-title="${ch.title_zh.toLowerCase()} ${ch.title_en.toLowerCase()}">
            <span class="toc-item-title">${ch.badge_label}：${ch.title_zh}</span>
            <span class="toc-item-page">${pageLabel}</span>
          </li>
        `;
      }
      listEl.innerHTML = html;
    }

    function updateTocActive() {
      const items = document.querySelectorAll('.toc-item');
      const curCh = getActiveChapterNum();
      items.forEach((item, idx) => {
        if (idx === 0) {
          item.classList.toggle('active', currentPageIdx === 0);
        } else {
          item.classList.toggle('active', currentPageIdx > 0 && curCh === idx);
        }
      });
    }

    function filterToc(keyword) {
      const q = keyword.trim().toLowerCase();
      const items = document.querySelectorAll('.toc-list .toc-item');
      items.forEach((item, idx) => {
        if (idx === 0) {
          item.style.display = (q === '' || '书籍首页封面卷目'.includes(q)) ? 'flex' : 'none';
          return;
        }
        const text = item.getAttribute('data-title') || '';
        item.style.display = text.includes(q) ? 'flex' : 'none';
      });
    }

    function openTocModal() {
      closeAllModals();
      document.getElementById('modal-backdrop').classList.add('open');
      document.getElementById('toc-drawer').style.transform = 'translateX(0)';
      document.getElementById('toc-search-input').focus();
    }

    function openSettingsModal() {
      closeAllModals();
      document.getElementById('modal-backdrop').classList.add('open');
      document.getElementById('settings-popover').style.opacity = '1';
      document.getElementById('settings-popover').style.pointerEvents = 'auto';
    }

    function closeAllModals() {
      document.getElementById('modal-backdrop').classList.remove('open');
      document.getElementById('toc-drawer').style.transform = 'translateX(-100%)';
      document.getElementById('settings-popover').style.opacity = '0';
      document.getElementById('settings-popover').style.pointerEvents = 'none';
    }

    /* ========================================================
       PREFERENCES & TYPOGRAPHY
       ======================================================== */
    function setTheme(th) {
      currentTheme = th;
      document.body.className = `theme-${th}`;
      document.querySelectorAll('.theme-opt').forEach(el => el.classList.remove('active'));
      const activeBtn = document.getElementById(`th-${th}`);
      if (activeBtn) activeBtn.classList.add('active');
      savePreferences();
    }

    function adjustFontSize(delta) {
      const newFs = Math.max(14, Math.min(24, currentFontSize + delta));
      if (newFs !== currentFontSize) {
        currentFontSize = newFs;
        document.documentElement.style.setProperty('--body-fs', currentFontSize + 'px');
        document.getElementById('fs-preview-val').textContent = currentFontSize + ' px';
        savePreferences();
        paginateAndRender();
      }
    }

    function setFontFamily(ff) {
      currentFontFamily = ff;
      document.querySelectorAll('.seg-pills .seg-pill-btn').forEach(b => {
        if (b.id && b.id.startsWith('ff-')) b.classList.remove('active');
      });
      const act = document.getElementById(`ff-${ff}`);
      if (act) act.classList.add('active');
      const bodyL = document.getElementById('body-left');
      const bodyR = document.getElementById('body-right');
      const ffVar = ff === 'kai' ? 'var(--font-kai)' : (ff === 'sans' ? 'var(--font-sans)' : 'var(--font-serif-zh)');
      if (bodyL) bodyL.style.fontFamily = ffVar;
      if (bodyR) bodyR.style.fontFamily = ffVar;
      savePreferences();
      paginateAndRender();
    }

    function setLineHeight(lh) {
      currentLineHeight = lh;
      document.querySelectorAll('.seg-pills .seg-pill-btn').forEach(b => {
        if (b.id && b.id.startsWith('lh-')) b.classList.remove('active');
      });
      const tag = lh <= 1.65 ? 'compact' : (lh >= 1.9 ? 'relaxed' : 'normal');
      const act = document.getElementById(`lh-${tag}`);
      if (act) act.classList.add('active');
      document.documentElement.style.setProperty('--body-lh', currentLineHeight);
      savePreferences();
      paginateAndRender();
    }

    function setLanguage(lang) {
      if (currentLang === lang) return;
      currentLang = lang;
      document.getElementById('btn-lang-zh').classList.toggle('active', currentLang === 'zh');
      document.getElementById('btn-lang-en').classList.toggle('active', currentLang === 'en');
      const bodyL = document.getElementById('body-left');
      const bodyR = document.getElementById('body-right');
      if (bodyL) bodyL.classList.toggle('en-font', currentLang === 'en');
      if (bodyR) bodyR.classList.toggle('en-font', currentLang === 'en');
      savePreferences();
      paginateAndRender();
    }

    /* ========================================================
       SHARE & STANDALONE ISOLATION CONTROLLER
       ======================================================== */
    function copyIsolatedShareLink() {
      const base = window.location.origin + window.location.pathname;
      const shareUrl = `${base}?standalone=1`;
      navigator.clipboard.writeText(shareUrl).then(() => {
        showToast('已复制本书专属阅读链接！');
      }).catch(() => {
        prompt('请复制以下专属链接：', shareUrl);
      });
    }

    function showToast(text) {
      const t = document.getElementById('toast-msg');
      t.textContent = text;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2400);
    }

    /* ========================================================
       KEYBOARD, SWIPE GESTURES & FULLSCREEN
       ======================================================== */
    function setupKeyboard() {
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
          e.preventDefault();
          nextView();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          prevView();
        } else if (e.key === 't' || e.key === 'T') {
          openTocModal();
        } else if (e.key === 'Escape') {
          closeAllModals();
        } else if (e.key === 'f' || e.key === 'F') {
          toggleFullscreen();
        } else if (e.key === 'h' || e.key === 'H') {
          goToBookHome();
        }
      });
    }

    function setupGestures() {
      let touchStartX = 0;
      let touchStartY = 0;
      const stage = document.getElementById('stage');

      stage.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      stage.addEventListener('touchend', (e) => {
        if (e.changedTouches.length === 1) {
          const dx = e.changedTouches[0].clientX - touchStartX;
          const dy = e.changedTouches[0].clientY - touchStartY;
          // In Book Home on mobile, vertical scrolling takes precedence
          if (currentPageIdx === 0 && isSinglePageMode()) {
            if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) {
              if (dx < 0) nextView(); // Swipe left opens Chapter 1
            }
            return;
          }

          // Horizontal swipe to turn page
          if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy)) {
            if (dx < 0) nextView();
            else prevView();
          } else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
            // Tap center to toggle HUD
            toggleHud();
          }
        }
      }, { passive: true });
    }

    /* Auto-hide HUD on idle reading */
    let idleTimer = null;
    function setupIdleTimer() {
      window.addEventListener('mousemove', resetIdleTimer);
      window.addEventListener('touchstart', resetIdleTimer, { passive: true });
    }

    function resetIdleTimer() {
      document.getElementById('hud-top').classList.remove('hud-hidden');
      document.getElementById('hud-bottom').classList.remove('hud-hidden');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        // Auto-hide HUD only when reading body text, not on Book Home
        if (currentPageIdx > 0 && currentSpreadIdx > 0) {
          document.getElementById('hud-top').classList.add('hud-hidden');
          document.getElementById('hud-bottom').classList.add('hud-hidden');
        }
      }, 5000);
    }

    function toggleHud() {
      const top = document.getElementById('hud-top');
      const bot = document.getElementById('hud-bottom');
      const isHidden = top.classList.contains('hud-hidden');
      if (isHidden) {
        top.classList.remove('hud-hidden');
        bot.classList.remove('hud-hidden');
        resetIdleTimer();
      } else {
        top.classList.add('hud-hidden');
        bot.classList.add('hud-hidden');
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function setupAutoFullscreen() {
      // Double tap top area on mobile triggers clean fullscreen
      let lastTap = 0;
      document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTap < 300 && e.clientY < 60) {
          toggleFullscreen();
        }
        lastTap = now;
      });
    }

    function applyResponsiveScale() {
      const single = isSinglePageMode();
      if (single) {
        // Standard optimal mobile reading font size (WeChat Read & Apple Books standard: 18px, 1.78)
        document.documentElement.style.setProperty('--body-fs', '18px');
        document.documentElement.style.setProperty('--body-lh', '1.78');
        currentFontSize = 18;
        currentLineHeight = 1.78;
      }
    }

    /* Persistence State */
    function saveState() {
      try {
        localStorage.setItem('pilgrims_progress_paper_page', currentPageIdx);
        localStorage.setItem('pilgrims_progress_paper_spread', currentSpreadIdx);
      } catch (e) {}
    }

    function savePreferences() {
      try {
        localStorage.setItem('pilgrims_progress_paper_theme', currentTheme);
        localStorage.setItem('pilgrims_progress_paper_fs', currentFontSize);
        localStorage.setItem('pilgrims_progress_paper_ff', currentFontFamily);
        localStorage.setItem('pilgrims_progress_paper_lh', currentLineHeight);
        localStorage.setItem('pilgrims_progress_paper_lang', currentLang);
      } catch (e) {}
    }

    function loadSavedState() {
      try {
        const p = localStorage.getItem('pilgrims_progress_paper_page');
        if (p !== null) currentPageIdx = parseInt(p, 10);
        const s = localStorage.getItem('pilgrims_progress_paper_spread');
        if (s !== null) currentSpreadIdx = parseInt(s, 10);

        const savedTh = localStorage.getItem('pilgrims_progress_paper_theme');
        if (savedTh) setTheme(savedTh);

        const savedFs = localStorage.getItem('pilgrims_progress_paper_fs');
        if (savedFs) adjustFontSize(parseFloat(savedFs) - currentFontSize);

        const savedFf = localStorage.getItem('pilgrims_progress_paper_ff');
        if (savedFf) setFontFamily(savedFf);

        const savedLh = localStorage.getItem('pilgrims_progress_paper_lh');
        if (savedLh) setLineHeight(parseFloat(savedLh));

        const savedLang = localStorage.getItem('pilgrims_progress_paper_lang');
        if (savedLang) {
          currentLang = savedLang;
          document.getElementById('btn-lang-zh').classList.toggle('active', currentLang === 'zh');
          document.getElementById('btn-lang-en').classList.toggle('active', currentLang === 'en');
        }
      } catch (e) {}
    }

    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        paginateAndRender();
      }, 150);
    });

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
