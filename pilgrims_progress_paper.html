fore them, espied a man walking as they did, (and his name was Vain-confidence); so they called after him, and asked him whither that way led. He said, To the Celestial Gate. Look, said Christian, did not I tell you so? By this you may see we are right. So they followed, and he went before them. But, behold, the night came on, and it grew very dark; so that they that were behind lost the sight of him that went before.", "He, therefore, that went before, (Vain-confidence by name), not seeing the way before him, fell into a deep pit [Isa. 9:16], which was on purpose there made, by the Prince of those grounds, to catch vain-glorious fools withal, and was dashed in pieces with his fall.", "Now Christian and his fellow heard him fall. So they called to know the matter, but there was none to answer, only they heard a groaning. Then said Hopeful, Where are we now? Then was his fellow silent, as mistrusting that he had led him out of the way; and now it began to rain, and thunder, and lighten in a very dreadful manner; and the water rose amain."]}, {"sub_zh": "暴风雨黑夜与绝望巨人的擒获", "sub_en": "The Midnight Storm & Captured by Giant Despair", "zh_paras": ["基督徒说：好兄弟，别生气。我把你带错了路，并且使你处在这样岌岌可危的境地，我很难过。好兄弟，请原谅我，因为我不是出于恶意。", "盼望说：我的兄弟，别放在心上，我会原谅你的；而且我还相信这件事对我们会有益处的。", "基督徒说：我跟这样一个仁慈的兄弟在一起，真高兴。不过我们可别站在这儿；我们还是想办法走回去吧。", "盼望说：好兄弟，让我走在前面。", "基督徒说：不，对不起，让我先走，这样，要是有危险，我就首当其冲；因为是我把你带错了路。", "盼望说：不，你不能先走；因为你心境不好，可能又带错了路。接着，他们听见一个声音鼓励他们说，3“你要留心向大路，就是你所走的原路；你当回转。”可是这时候水已经涨得很高，因此在走回头的路上危险重重。 （于是我想起，在正路上要走错路很便当，而走错了路以后要想再回到大路上去就不那么容易了。 ）然而他们还是冒着险走回去；可是天又黑，水又高，他们在回去的路上差点儿惨遭灭顶，达九次或者十次之多。尽管他们绞尽脑汁想办法，他们当夜还是回不到栅栏那儿的。因此他们终于在一小块有掩蔽的地上歇下来，一直坐到天亮；可是由于疲倦，他们睡着了。离开他们躺下的地", "方不远，有个堡垒，叫做怀疑堡垒，它的主人是绝望巨人。他们睡的地方正是他的领域。绝望巨人一早起身，在自己的领地里散步，看见了基督徒和盼望在他的领地上睡觉。于是他用冷酷而严厉的声音把他们唤醒，问他们从哪儿来，在他的领地上干什么。他们告诉他，他们是走天路的旅客，走迷了路。"], "en_paras": ["Then Hopeful groaned in himself, saying, Oh, that I had kept on my way!", "CHR. Who could have thought that this path should have led us out of the way?", "HOPE. I was afraid on it at the very first, and therefore gave you that gentle caution. I would have spoken plainer, but that you are older than I.", "Christian's repentance for leading of his brother out of the way", "CHR. Good brother, be not offended; I am sorry I have brought thee out of the way, and that I have put thee into such imminent danger; pray, my brother, forgive me; I did not do it of an evil intent.", "HOPE. Be comforted, my brother, for I forgive thee; and believe, too, that this shall be for our good.", "CHR. I am glad I have with me a merciful brother; but we must not stand thus: let us try to go back again.", "HOPE. But, good brother, let me go before.", "CHR. No, if you please, let me go first, that if there be any danger, I may be first therein, because by my means we are both gone out of the way."]}, {"sub_zh": "怀疑堡垒阴森地牢中的毒打与熬炼", "sub_en": "The Cruel Dungeons and Scourgings of Doubting Castle", "zh_paras": ["然后巨人说，你们今夜侵犯了我，踩坏我的园地，还躺在我的领地上，因此你们得跟我走。他们不得不跟他走，因为他是个健壮非凡的巨人，他们远不及他。他们没有什么话可说，因为他们知道自己做错了事。巨人把他们押到他的堡垒中去，把他们关在一间乌漆麻黑的地牢里那地方肮脏透顶；臭气熏人。他们在那儿从星期三早晨待到星期六晚上，既没有啃一口面包，也没喝一滴水，既没有灯，又没人来问他们怎么样；因此他们处在非常不幸的情况下，举目无亲。基督徒在这儿有双重的悲痛因为是由于他不智的劝告，他们才陷入这样的危境。绝望巨人有个妻子，名叫猜疑。当他上床就寝的时候，他把他所做的事情告诉了她；说他逮住两", "个犯人，由于他们侵犯了他的领地，他把他们关进地牢里去。接着他还问她，他应当怎么处置他们。", "于是她问，他们是怎么样的人，从哪儿来，上哪儿去；他一一告诉了她。她对他说，他第二天早晨起身以后，应当毫无怜悯地把他们痛揍一顿。因此他起身后就弄来了一根沉重的山查木棍子，带到地牢里去，起先，尽管他们没说一句得罪他的话，他把他们当作狗一样谩骂了一通；然后他开始攻击他们，狠狠地打他们，打得他们无法招架，遍体鳞伤，动弹不得。这以后，他退出去，让他们去惋惜他们的痛苦，哀悼他们的灾难；所以他们那一整天什么也没作，连连叹息，痛哭不止。第二天她又跟她丈夫谈起他们，知道他们还活着，就要丈夫去劝他们自杀。因此第二天早晨，他像前一天那样粗暴地来到他们跟前，看见他们前一天挨他一顿毒打后", "受到的创伤还很厉害，就对他们说，既然他们永远没有可能离开那地方，他们唯一的办法是干脆把性命结果了，用利刃也好，用绞索也好，用毒药也好；因为，他说，既然活着这样痛苦，你们为什么还要活？可是他们要求他放他们走。听了这话，他恶狠狠地瞧着他们，向他们直扑过去；要不是他宿疾发作（他有时候在晴天会发病） ，他的手一时动弹不得，毫无疑问他准会把他们结果了。因此他退了出去，像以前一样让他们自己去考虑怎么办。接着两个犯人互相商量要不要听从他的劝告；他们就这样开始讨论：——", "基督徒说：兄弟，我们怎么办？我们现在的日子可够惨了。至于我，我不知道是这样活下去好呢，还是立刻死去好。“我宁肯噎死，胜似留我这一身的骨头， ”躺在坟墓里比待在这个地牢里要好受些！我们还要受这巨人的管束吗？", "盼望说：我们目前的境遇的确很可怕，与其永远这样活下去，还不如死了的好。可是我们得想一想，我们要去的那地方的主人说过， “不得杀人， ”——不能杀别人，那么我们更不得听从他的话把自己杀掉。况且，杀别人的人只杀掉他的肉体，而自杀的人却同时把自己的灵魂也杀死。并且，我的兄弟，你谈到坟墓里的安逸；你有没有忘掉杀人的要下地狱？有“杀人者不得永生， ”这类的箴言昭然具在。我们再想想，绝望巨人并不是万能的；据我所知，别人也曾经像我们这样落到他的手中，可是他们逃出了他的掌握。谁敢说创造世界的神不会叫绝望巨人死去，或者使他有一天忘记上锁，或者不久"], "en_paras": ["HOPE. No, said Hopeful, you shall not go first; for your mind being troubled may lead you out of the way again. Then, for their encouragement, they heard the voice of one saying, \"Set thine heart toward the highway, even the way which thou wentest; turn again.\" [Jer. 31:21] But by this time the waters were greatly risen, by reason of which the way of going back was very dangerous. (Then I thought that it is easier going out of the way, when we are in, than going in when we are out.) Yet they adventured to go back, but it was so dark, and the flood was so high, that in their going back they had like to have been drowned nine or ten times.", "Neither could they, with all the skill they had, get again to the stile that night. Wherefore, at last, lighting under a little shelter, they sat down there until the daybreak; but, being weary, they fell asleep. Now there was, not far from the place where they lay, a castle called Doubting Castle, the owner whereof was Giant Despair; and it was in his grounds they now were sleeping: wherefore he, getting up in the morning early, and walking up and down in his fields, caught Christian and Hopeful asleep in his grounds. Then, with a grim and surly voice, he bid them awake; and asked them whence they were, and what they did in his grounds. They told him they were pilgrims, and that they had lost their way. Then said the Giant, You have this night trespassed on me, by trampling in and lying on my grounds, and therefore you must go along with me. So they were forced to go, because he was stronger than they. They also had but little to say, for they knew themselves in a fault. The Giant, therefore, drove them before him, and put them into his castle, into a very dark dungeon, nasty and stinking to the spirits of these two men. [Ps. 88:18] Here, then, they lay from Wednesday morning till Saturday night, without one bit of bread, or drop of drink, or light, or any to ask how they did; they were, therefore, here in evil case, and were far from friends and acquaintance. Now in this place Christian had double sorrow, because it was through his unadvised counsel that they were brought into this distress.", "The pilgrims now, to gratify the flesh, Will seek its ease; but oh! how they afresh Do thereby plunge themselves new griefs into! Who seek to please the flesh, themselves undo.", "Now, Giant Despair had a wife, and her name was Diffidence. So when he was gone to bed, he told his wife what he had done; to wit, that he had taken a couple of prisoners and cast them into his dungeon, for trespassing on his grounds. Then he asked her also what he had best to do further to them. So she asked him what they were, whence they came, and whither they were bound; and he told her. Then she counselled him that when he arose in the morning he should beat them without any mercy. So, when he arose, he getteth him a grievous crab-tree cudgel, and goes down into the dungeon to them, and there first falls to rating of them as if they were dogs, although they never gave him a word of distaste. Then he falls upon them, and beats them fearfully, in such sort that they were not able to help themselves, or to turn them upon the floor. This done, he withdraws and leaves them there to condole their misery and to mourn under their distress. So all that day they spent the time in nothing but sighs and bitter lamentations. The next night, she, talking with her husband about them further, and understanding they were yet alive, did advise him to counsel them to make away themselves. So when morning was come, he goes to them in a surly manner as before, and perceiving them to be very sore with the stripes that he had given them the day before, he told them, that since they were never like to come out of that place, their only way would be forthwith to make an end of themselves, either with knife, halter, or poison, for why, said he, should you choose life, seeing it is attended with so much bitterness? But they desired him to let them go. With that he looked ugly upon them, and, rushing to them, had doubtless made an end of them himself, but that he fell into one of his fits, (for he sometimes, in sunshiny weather, fell into fits), and lost for a time the use of his hand; wherefore he withdrew, and left them as before, to consider what to do. Then did the prisoners consult between themselves whether it was best to take his counsel or no; and thus they began to discourse:--", "CHR. Brother, said Christian, what shall we do? The life that we now live is miserable. For my part I know not whether is best, to live thus, or to die out of hand. \"My soul chooseth strangling rather than life\", and the grave is more easy for me than this dungeon. [Job 7:15] Shall we be ruled by the Giant?", "HOPE. Indeed, our present condition is dreadful, and death would be far more welcome to me than thus for ever to abide; but yet, let us consider, the Lord of the country to which we are going hath said, Thou shalt do no murder: no, not to another man's person; much more, then, are we forbidden to take his counsel to kill ourselves. Besides, he that kills another, can but commit murder upon his body; but for one to kill himself is to kill body and soul at once. And, moreover, my brother, thou talkest of ease in the grave; but hast thou forgotten the hell, for certain the murderers go? \"For no murderer hath eternal life,\" &c. And let us consider, again, that all the law is not in the hand of Giant Despair. Others, so far as I can understand, have been taken by him, as well as we; and yet have escaped out of his hand. Who knows, but the God that made the world may cause that Giant Despair may die? or that, at some time or other, he may forget to lock us in? or that he may, in a short time, have another of his fits before us, and may lose the use of his limbs? and if ever that should come to pass again, for my part, I am resolved to pluck up the heart of a man, and to try my utmost to get from under his hand. I was a fool that I did not try to do it before; but, however, my brother, let us be patient, and endure a while. The time may come that may give us a happy release; but let us not be our own murderers. With these words Hopeful at present did moderate the mind of his brother; so they continued together (in the dark) that day, in their sad and doleful condition.", "Well, towards evening, the Giant goes down into the dungeon again, to see if his prisoners had taken his counsel; but when he came there he found them alive; and truly, alive was all; for now, what for want of bread and water, and by reason of the wounds they received when he beat them, they could do little but breathe. But, I say, he found them alive; at which he fell into a grievous rage, and told them that, seeing they had disobeyed his counsel, it should be worse with them than if they had never been born.", "At this they trembled greatly, and I think that Christian fell into a swoon; but, coming a little to himself again, they renewed their discourse about the Giant's counsel; and whether yet they had best to take it or no. Now Christian again seemed to be for doing it, but Hopeful made his second reply as followeth:--", "HOPE. My brother, said he, rememberest thou not how valiant thou hast been heretofore? Apollyon could not crush thee, nor could all that thou didst hear, or see, or feel, in the Valley of the Shadow of Death. What hardship, terror, and amazement hast thou already gone through! And art thou now nothing but fear! Thou seest that I am in the dungeon with thee, a far weaker man by nature than thou art; also, this Giant has wounded me as well as thee, and hath also cut off the bread and water from my mouth; and with thee I mourn without the light. But let us exercise a little more patience; remember how thou playedst the man at Vanity Fair, and wast neither afraid of the chain, nor cage, nor yet of bloody death. Wherefore let us (at least to avoid the shame, that becomes not a Christian to be found in) bear up with patience as well as we can."]}, {"sub_zh": "应许之匙开启所有铁门重获自由", "sub_en": "The Key of Promise Unlocks Every Door to Freedom", "zh_paras": ["再当着我们发一次病，不能自由使用他的手？要是再有这种事情发生的话，我决定鼓起勇气，尽我的力量逃出他的魔掌。我以前没有这样做，真傻透了；嗳，我的兄弟，无论如何我们还是再耐着些，再忍受一个时期。可能有那么一天我们可以脱离苦海；我们可不能作自己的刽子手呀。这时候盼望这番话使他兄弟的心境平和了一些；因此他们继续在黑暗里待下去，在痛苦悲惨的境况中挨过了一天。绝望巨人黄昏时分，巨人又来到地牢里，想看看他们有没有听从他的劝告；他走进屋时，发现他们还活着。他们的确仅仅活着；因为由于没吃没喝，再加上挨打时受到的创伤，他们几乎只有呼吸的能力了。但是，", "嗳，他发现他们还活着；不由怒火中烧，他对他们说，由于他们拒绝了他的劝告他要给他们厉害看，叫他们觉得还不如当初没有生下来的好。听了这话，他们浑身簌簌直发抖，我想基督徒吓得昏了过去；可是等他略微苏醒过来的时候，他们又谈论起巨人的劝告，琢磨着究竟是不是照他的意思做最好。现在基督徒又想自杀了，可是盼望作了第二次的答复：——", "盼望说：我的兄弟，你不记得自己到目前为止是多么勇敢吗？魔王打不垮你，你在死荫谷里看到、听到、感到的一切都压不倒你。你有过多么艰苦、恐怖和惊奇的经历，而你现在却畏惧起来？你看我跟你一起在地牢里，而我比起你来，在性格方面要懦弱得多；并且巨人不只打伤了你，也打伤了我，也不给我吃喝，我跟你一样没有灯，一样痛苦。不过让我们再耐心一点；回想一下你在浮华市集的时候表现得多么勇敢，既不怕铁链，不怕铁笼子，也不怕惨死。因此我们还是尽量耐心忍受吧（至少要避免不宜于一个基督徒的丢脸的事） 。这会儿，夜又来临了，巨人和他的妻子都上了床，她向他打听犯人的情况，探询他们有没有听从", "他的劝告。他回答说，他们是刚毅的恶徒，情愿忍受一切艰苦也不肯自杀。于是她说，明天把他们带到院子里去，让他们瞧你结果了的那些人的骸骨，同时叫他们相信，不到一星期，你也要叫他们粉身碎骨，就像对待在他们以前来的同党一样。第二天早上，巨人又到他们那儿去，把他们带到院子里，照他妻子的吩咐让他们看了那些骸骨。这些人，他说，跟你们一样，都是走天路的旅客，也跟你们一样，侵犯了我的领地；我拣了适合的时候——把他们粉身碎骨了；不出十天我也要同样对待你们。现在，回到你们的洞窟里去；说着把他们一路打回去。因此，在星期六那天，他们跟以前一样，凄凄惨惨地躺了一整天。夜里，当猜疑夫人和", "她丈夫都上了床，他们又开始谈论他们的囚犯；并且老巨人觉得很奇怪，他的殴打和劝告竟都不能叫他们送命。他的妻子回答说，我恐怕他们还希望有人来搭救他们，要不然就是他们身边有撬锁工具，希望利用它来达到逃跑的目的。巨人说，亲爱的，你这样想吗？明天早上我要去搜他们的身。星期六约莫午夜时分，他们开始祈祷，一直祷告到天蒙蒙亮。在曙光将现的时候，好基督徒像一个半受惊的人，发出激动的话语： ——当我可以自由行动的时候，他说，我却还待在这臭气熏人的地牢里，我是多么傻的一个大傻瓜呀！我怀里有把钥匙叫做允诺，我相信它能打开怀疑堡垒里任何一把锁。于", "是盼望说，这是好消息，好兄弟，拿出来试试。接着，基督徒从怀里拿出钥匙，开始试开地牢的门，他一转动钥匙，门的插销就向后移动，门轻而易举地给打开了，基督徒和盼望都走了出来。然后他走到通往院子里去的外面一扇门，再用钥匙打开它。这以后，他走到大铁门旁边，因为这扇门也得打开。可是那把锁非常难弄，但是终于也给打开了。于是他们推开门，飞奔着逃走；可是大门给推开的时候，发出叽叽嘎嘎的声音，把绝望巨人惊醒了，他急忙起身要去追赶他的囚犯；但是觉得他的四肢不中用了，因为他又发病了，因此他也就无法追踪他们。于是他们走着，又来到大路上，他们现在安全了，因为他们已经逃出了巨人的管", "辖区域。这会儿他们已经穿过栅栏，他们开始思索在那儿应该做些什么才能防止继他们而来的人也落到绝望巨人的手中。因此他们同意在那儿竖立一根柱子，在上面刻这样几句话： “越过这栅栏是通到绝望巨人的怀疑堡垒的道路，他蔑视天国的王，图谋杀害祂的天路旅客。 ”因此许多后来的人看了这几句话就逃过了危险。他们做完之后，唱道：我们走离大路，然后发现踏上禁地是多么危险；让后来的人多多留神，免得他们再步我们的后尘；免得他们由于侵犯他的领地，成了他的囚犯，他的堡垒名怀疑，他的名字叫绝望。"], "en_paras": ["Now, night being come again, and the Giant and his wife being in bed, she asked him concerning the prisoners, and if they had taken his counsel. To which he replied, They are sturdy rogues, they choose rather to bear all hardship, than to make away themselves. Then said she, Take them into the castle-yard to-morrow, and show them the bones and skulls of those that thou hast already despatched, and make them believe, ere a week comes to an end, thou also wilt tear them in pieces, as thou hast done their fellows before them.", "So when the morning was come, the Giant goes to them again, and takes them into the castle-yard, and shows them, as his wife had bidden him. These, said he, were pilgrims as you are, once, and they trespassed in my grounds, as you have done; and when I thought fit, I tore them in pieces, and so, within ten days, I will do you. Go, get you down to your den again; and with that he beat them all the way thither. They lay, therefore, all day on Saturday in a lamentable case, as before. Now, when night was come, and when Mrs. Diffidence and her husband, the Giant, were got to bed, they began to renew their discourse of their prisoners; and withal the old Giant wondered, that he could neither by his blows nor his counsel bring them to an end. And with that his wife replied, I fear, said she, that they live in hope that some will come to relieve them, or that they have picklocks about them, by the means of which they hope to escape. And sayest thou so, my dear? said the Giant; I will, therefore, search them in the morning.", "Well, on Saturday, about midnight, they began to pray, and continued in prayer till almost break of day.", "Now a little before it was day, good Christian, as one half amazed, brake out in passionate speech: What a fool, quoth he, am I, thus to lie in a stinking Dungeon, when I may as well walk at liberty. I have a Key in my bosom called Promise, that will, I am persuaded, open any Lock in Doubting Castle. Then said Hopeful, That's good news; good Brother pluck it out of thy bosom and try.", "A key in Christian's bosom, called Promise, opens any lock in Doubting Castle", "Then Christian pulled it out of his bosom, and began to try at the Dungeon door, whose bolt (as he turned the Key) gave back, and the door flew open with ease, and Christian and Hopeful both came out. Then he went to the outward door that leads into the Castle-yard, and with his Key opened that door also. After he went to the iron Gate, for that must be opened too, but that Lock went damnable hard, yet the Key did open it. Then they thrust open the Gate to make their escape with speed; but that Gate as it opened made such a creaking, that it waked Giant Despair, who hastily rising to pursue his Prisoners, felt his limbs to fail, for his Fits took him again, so that he could by no means go after them. Then they went on, and came to the King's High-way again, and so were safe, because they were out of his jurisdiction", "Now, when they were over the stile, they began to contrive with themselves what they should do at that stile to prevent those that should come after from falling into the hands of Giant Despair. So they consented to erect there a pillar, and to engrave upon the side thereof this sentence--\"Over this stile is the way to Doubting Castle, which is kept by Giant Despair, who despiseth the King of the Celestial Country, and seeks to destroy his holy pilgrims.\" Many, therefore, that followed after read what was written, and escaped the danger. This done, they sang as follows:--", "Out of the way we went, and then we found What 'twas to tread upon forbidden ground; And let them that come after have a care, Lest heedlessness makes them, as we, to fare. Lest they for trespassing his prisoners are, Whose castle's Doubting, and whose name's Despair.", "They went then till they came to the"]}]}, {"num": 18, "id": "chapter-16", "badge_label": "CHAPTER 18", "title_zh": "第十六章 快乐山", "title_en": "Chapter 16: The Delectable Mountains", "desc": "登上快乐山与受四位牧人热情接待；观看错误山、谨慎山与地狱旁门的惊人异象；望远镜眺望荣美天门与牧人赠言。", "blocks": [{"sub_zh": "登上快乐山与受四位牧人热情接待", "sub_en": "Ascending the Delectable Mountains & The Welcome of Shepherds", "zh_paras": ["他们一直向前走，后来走到了快乐山，这些山属于我们以前讲过的那小山的主人；他们就上山去看花园和果园，葡萄园和喷泉；他们在那儿喝了水，洗涤一番，把葡萄吃个痛快。在山顶上有牧人在牧羊，他们站在路旁。因此天路旅客走上去，用手杖撑住身子（疲劳的旅客在旅途上站住跟人家谈话的时候常常是这副模样） ，问道，这些快乐山是谁的？在吃草的羊是谁的？牧人说：这些山是神的土地，从祂的城里看得见它们；羊也是祂的，祂为它们断送了性命。", "基督徒问：这是往天国去的路吗？牧人说：你们正走在通往天国的路上。", "基督徒问：离那儿还有多远？牧人说：对于的确会到达那儿的人，路程是不太远的。", "基督徒问：这条路上是安全的，还是危险的？牧人说：对于那些该享到安全的人，它是安全的；可是“罪人却在其上跌倒。”", "基督徒问：对于疲倦乏力的旅客，路上有没有解除痛苦的设备？牧人说：山主人吩咐我们2“不可忘记用爱心接待客旅；”因此你们将要享到这地方的幸福。我在梦里还看到，当牧人听说他们是过路人时，也向他们发问（他们就像以前在别处时一样，一一作答） ，如：你们从哪儿来？你们怎样走上这条路的？你们用什么方法坚持到底的？因为很少有愿意上这儿来的人在这些山上露面。牧人听到他们的答复后，很高兴，亲切地望着他们说，欢迎你们到快乐山来。"], "en_paras": ["Delectable Mountains, which mountains belong to the Lord of that hill of which we have spoken before; so they went up to the mountains, to behold the gardens and orchards, the vineyards and fountains of water; where also they drank and washed themselves, and did freely eat of the vineyards. Now there were on the tops of these mountains Shepherds feeding their flocks, and they stood by the highway side. The Pilgrims therefore went to them, and leaning upon their staves, (as is common with weary pilgrims when they stand to talk with any by the way), they asked, Whose Delectable Mountains are these? And whose be the sheep that feed upon them?", "Mountains delectable they now ascend, Where Shepherds be, which to them do commend Alluring things, and things that cautious are, Pilgrims are steady kept by faith and fear.", "SHEP. These mountains are Immanuel's Land, and they are within sight of his city; and the sheep also are his, and he laid down his life for them. [John 10:11]", "CHR. Is this the way to the Celestial City?", "SHEP. You are just in your way.", "CHR. How far is it thither?", "SHEP. Too far for any but those that shall get thither indeed.", "CHR. Is the way safe or dangerous?", "SHEP. Safe for those for whom it is to be safe; but the transgressors shall fall therein. [Hos. 14:9]"]}, {"sub_zh": "观看错误山、谨慎山与地狱旁门的惊人异象", "sub_en": "Viewing the Hill Error, Mount Caution, and the By-way to Hell", "zh_paras": ["我说的牧人们的名字是知识、经验、警醒和诚恳，他们牵着他们的手，领他们到帐篷里去，请他们分享已经准备齐全的美肴。牧人们还说，我们希望你们能多待一些时候，跟我们熟悉一下，同时多多享用快乐山的好东西。于是他们答应待下来。因此那晚上他们去歇息了，因为时已深夜。", "然后我在梦里看见，第二天早上，牧人们邀请基督徒和盼望跟他们在山上散步。因此他们跟牧人们出去，走了一会儿，只见周围景色优美宜人。牧人们互相商量着，我们要不要给客人们看些奇迹呢？后来他们决定请客人观看奇迹，牧人们先把他们领到一座叫做错误的小山顶上，这山的那一面非常陡峭，牧人们叫他们往底下看。他们往下一看，看见好几具残肢断臂的尸体，是那些从山上摔下去的人的残骸。然后基督徒问道，这是什么意思？牧人说，难道你们没有听说到那些由于听许米乃和腓理徒所说关于对复活的信心而犯了错误的人吗？他们说，听说过。接着牧人说，你们看见那", "几个粉尸碎骨、躺在山脚下的人就是这帮人；就像你们看到的，他们至今还没有埋葬，为的是要藉以教训别人，使人家注意别爬得太高，或者别走得太靠近这座山的边缘。", "然后我看见他们又带他们到另外一座山顶上去，这山叫警戒，牧人叫他们往远处看；他们一看，就像他们以为的那样，看见了好几个人在坟堆中走来走去；他们看出那些人都是瞎子，因为他们有时候冲到坟上去，并且无法走出那个坟堆。于是基督徒问，这是什么意思？", "于是牧人回答说，你们没有看到在这些山稍低的地方靠大路的左边有一个通往一块草地的梯磴吗？他们说，看到的。牧人接着说，在梯磴那儿有一条小路直接通往怀疑堡垒，它是由绝望巨人看守着的，这些人（指着在坟堆中的人）跟你们现在一样，在没有来到梯磴以前，曾经在天路上走。由于正路在那一段很不好走，他们决定离开正路到草地上去，结果给绝望巨人逮住，关进怀疑堡垒里去；在那儿他们给关在地牢里一些时候之后，巨人终于把他们的眼睛挖出来，领他们到坟堆上，让他们在那儿一直徘徊到今天，因此圣贤的话可以得到证实，2“迷离通达道路的，必住在阴魂的会中。”"], "en_paras": ["CHR. Is there, in this place, any relief for pilgrims that are weary and faint in the way?", "SHEP. The Lord of these mountains hath given us a charge not to be forgetful to entertain strangers, therefore the good of the place is before you. [Heb. 13:1-2]", "I saw also in my dream, that when the Shepherds perceived that they were wayfaring men, they also put questions to them, to which they made answer as in other places; as, Whence came you? and, How got you into the way? and, By what means have you so persevered therein? For but few of them that begin to come hither do show their face on these mountains. But when the Shepherds heard their answers, being pleased therewith, they looked very lovingly upon them, and said, Welcome to the Delectable Mountains.", "The Shepherds, I say, whose names were Knowledge, Experience, Watchful, and Sincere, took them by the hand, and had them to their tents, and made them partake of that which was ready at present. They said, moreover, We would that ye should stay here awhile, to be acquainted with us; and yet more to solace yourselves with the good of these Delectable Mountains. They then told them, that they were content to stay; so they went to their rest that night, because it was very late.", "Then I saw in my dream, that in the morning the Shepherds called up to Christian and Hopeful to walk with them upon the mountains; so they went forth with them, and walked a while, having a pleasant prospect on every side. Then said the Shepherds one to another, Shall we show these pilgrims some wonders? So when they had concluded to do it, they had them first to the top of a hill called Error, which was very steep on the furthest side, and bid them look down to the bottom. So Christian and Hopeful looked down, and saw at the bottom several men dashed all to pieces by a fall that they had from the top. Then said Christian, What meaneth this? The Shepherds answered, Have you not heard of them that were made to err by hearkening to Hymeneus and Philetus as concerning the faith of the resurrection of the body? [2 Tim. 2:17,18] They answered, Yes. Then said the Shepherds, Those that you see lie dashed in pieces at the bottom of this mountain are they; and they have continued to this day unburied, as you see, for an example to others to take heed how they clamber too high, or how they come too near the brink of this mountain.", "Then I saw that they had them to the top of another mountain, and the name of that is Caution, and bid them look afar off; which, when they did, they perceived, as they thought, several men walking up and down among the tombs that were there; and they perceived that the men were blind, because they stumbled sometimes upon the tombs, and because they could not get out from among them. Then said Christian, What means this?", "The Shepherds then answered, Did you not see a little below these mountains a stile, that led into a meadow, on the left hand of this way? They answered, Yes. Then said the Shepherds, From that stile there goes a path that leads directly to Doubting Castle, which is kept by Giant Despair, and these, pointing to them among the tombs, came once on pilgrimage, as you do now, even till they came to that same stile; and because the right way was rough in that place, they chose to go out of it into that meadow, and there were taken by Giant Despair, and cast into Doubting Castle; where, after they had been a while kept in the dungeon, he at last did put out their eyes, and led them among those tombs, where he has left them to wander to this very day, that the saying of the wise man might be fulfilled, \"He that wandereth out of the way of understanding, shall remain in the congregation of the dead.\" [Pro. 21:16] Then Christian and Hopeful looked upon one another, with tears gushing out, but yet said nothing to the Shepherds.", "Then I saw in my dream, that the Shepherds had them to another place, in a bottom, where was a door in the side of a hill, and they opened the door, and bid them look in. They looked in, therefore, and saw that within it was very dark and smoky; they also thought that they heard there a rumbling noise as of fire, and a cry of some tormented, and that they smelt the scent of brimstone. Then said Christian, What means this? The Shepherds told them, This is a by-way to hell, a way that hypocrites go in at; namely, such as sell their birthright, with Esau; such as sell their master, with Judas; such as blaspheme the gospel, with Alexander; and that lie and dissemble, with Ananias and Sapphira his wife. Then said Hopeful to the Shepherds, I perceive that these had on them, even every one, a show of pilgrimage, as we have now; had they not?", "SHEP. Yes, and held it a long time too."]}, {"sub_zh": "望远镜眺望荣美天门与牧人赠言", "sub_en": "Through the Perspective Glass: The Celestial City in Sight", "zh_paras": ["于是基督徒和盼望互相望着，眼泪夺眶而出，可是对牧人们什么也没说。", "然后我在梦中看见牧人又领他们到山底下一个地方，那儿的山坡上有一扇门；牧人把门打开，叫他们朝里面看。因此他们朝里面看去，只见里面一团漆黑，烟雾弥漫；他们还认为听见一阵好像烈火燃烧的轰隆声，以及受折磨的人的呼号声；他们还闻到硫磺的气味。于是基督徒问，这是什么意思？牧人们说，这是上地狱去的侧道，伪善者都从这儿走过——就是跟以扫一样卖掉长子名分的人；跟犹大一样出卖主子的人；跟亚历山大一样亵渎福音的人；以及跟亚拿尼亚和他的妻子撒非喇一样谎话连篇、假冒为善的人。", "于是盼望对牧人说，我看出他们每个人，就像我们现在一样，以前都有过走天路的表现；是不是？牧人说：是，并且也坚持了很长一段时间。", "盼望说：尽管他们这样凄惨地被抛弃了，他们当初在旅途中走了多远？牧人说：有的走得远些，有的还没走到这些山。接着客人互相说道，我们需要向神呼求力量呀。牧人说：对，而且你们有了力量以后，还用得着它呢！", "这时候两个客人要继续往前走，牧人们也希望他们这样做；因此他们一起走到山的尽头。接着牧人彼此之间说，如果客人会使用我们的望远镜，我们让他们看天国的大门吧。客人亲切地接受了他们的提议；因此牧人把他们带到一座叫做清晰的山顶上，把望远镜递给他们。", "于是他们试看着，可是因为脑际还印着牧人给他们看的最后那件事，他们的手簌簌发抖；由于这个阻碍，他们不能稳定地从望远镜望出去；但是他们认为他们看见了一件像大门的东西，还看到了那地方一些壮丽的景色。然后他们走开，唱着这首歌：——牧人就这样把一些奥秘揭露，其他的人都看不透这奥秘的面目；因此，倘若你要看深奥、隐秘和神妙的东西，就请来到牧人这里。当他们将要离开的时候，一个牧人给他们一张关于旅途的笔记。另一个牧人吩咐他们谨防阿谀献媚的人。又一个请他们留神别在着魔之地睡觉。第四个祝他们一路平安。于是我从梦中醒来。"], "en_paras": ["HOPE. How far might they go on in pilgrimage in their day, since they notwithstanding were thus miserably cast away?", "SHEP. Some further, and some not so far, as these mountains.", "Then said the Pilgrims one to another, We have need to cry to the Strong for strength.", "SHEP. Ay, and you will have need to use it, when you have it, too.", "By this time the Pilgrims had a desire to go forward, and the Shepherds a desire they should; so they walked together towards the end of the mountains. Then said the Shepherds one to another, Let us here show to the Pilgrims the gates of the Celestial City, if they have skill to look through our perspective glass. The Pilgrims then lovingly accepted the motion; so they had them to the top of a high hill, called Clear, and gave them their glass to look.", "Then they essayed to look, but the remembrance of that last thing that the Shepherds had shown them, made their hands shake; by means of which impediment, they could not look steadily through the glass; yet they thought they saw something like the gate, and also some of the glory of the place. Then they went away, and sang this song--", "Thus, by the Shepherds, secrets are reveal'd, Which from all other men are kept conceal'd. Come to the Shepherds, then, if you would see Things deep, things hid, and that mysterious be.", "When they were about to depart, one of the Shepherds gave them a note of the way. Another of them bid them beware of the Flatterer. The third bid them take heed that they sleep not upon the Enchanted Ground. And the fourth bid them God-speed. So I awoke from my dream.", "And I slept, and dreamed again, and saw the same two Pilgrims going down the mountains along the highway towards the city. Now, a little below these mountains, on the left hand, lieth the country of Conceit; from which country there comes into the way in which the Pilgrims walked, a little crooked lane. Here, therefore, they m"]}]}, {"num": 19, "id": "chapter-17", "badge_label": "CHAPTER 19", "title_zh": "第十七章 无知", "title_en": "Chapter 17: Ignorance and the Turn-Away", "desc": "偶遇自满自是的少年无知；小信遭受三个强盗打劫的警世公案；小信的宝玉存留与信心的真实大能。", "blocks": [{"sub_zh": "偶遇自满自是的少年无知", "sub_en": "Meeting with Ignorance from the Country of Conceit", "zh_paras": ["我睡着了，又做梦，并且看见这两个天路旅客正沿着大路下山，朝天国走去。在较低的山坡上靠左边是自高地区，从那儿有条曲曲折折的小路通到天路旅客在上面行走的大路。因此他们在这儿碰上一个从那地区来的神采奕奕的青年，他名叫无知。基督徒问他从哪儿来，上哪儿去。", "无知说：先生，我生长在左边那个乡下，现在上天国去。", "基督徒说：可是你想怎么进天国的大门？因为你在那儿可能会遇上困难的。", "无知说：别人怎样进去，我也怎样进去。", "基督徒说：可是你到了那儿有什么东西出示，可以使大门为你打开？", "无知说：我知道神的意旨，而且我一向是规规矩矩地过日子的；我没对不起任何人；我祈祷，禁食，付什一税，施舍，背井离乡，前往我现在正要去的地方去。", "基督徒说：可是你没从这条路头上的那个小门进来啊；你却从那条弯曲小路到这儿来；因此，不管你自己怎么想，我恐怕你不但不能进天国，并且在审判那一天，你会得到盗贼的罪名。", "无知说：先生们，你们跟我完全不相识 ——我根本不认得你们；请你们满足于信奉你们家乡的信仰吧，我可要信奉我自己家乡的信仰的。我希望一切都会很好。至于你们说的那个小门，所有的人都知道它离开我们家乡很远。我想我们那一带的人连到那儿去的路都不认得；他们也不在乎自己认不认得，因为就像你看见的，从我们的家乡有一条又好又美的绿荫小径通到这儿来，它是通往大路的另一条路。当基督徒看到那个人很懂得骄傲自满的时候，他悄悄地对盼望说，1“愚昧人比他更有指望；”还说，2“并且愚昧人行路，显出无知，对众人说，他是愚昧人。”怎么样，我们是继续跟他谈呢，还是", "暂时走到他前面去，让他去思考他刚才听到的话，过后我们再停下来等他，看我们能不能逐步对他有所帮助？于是盼望说：让无知把我们刚才说的话稍稍思量，但愿他不要拒绝接受忠告，免得对最主要的利益仍然毫不通晓。神说，没有理解力的人，尽管他创造了他们，也不会拯救他们。无知他又加一句说，我认为把一切的话一下子全对他说是没有用的；你愿意的话，我们还是走在他前面，等他“接受得了”的时候，再跟他谈。因此他们往前走，无知在后面走。他们赶过他不远，来到一个黑暗的小巷，在那儿他们碰到一个人，他给七个魔鬼用七根坚韧的绳子绑着，正被押往他们刚才在山坡上看见的那扇门那儿去。这", "会儿好基督徒开始颤抖起来，他的伙伴盼望也直哆嗦；可是当魔鬼把那个人带走的时候，基督徒想看看他认不认得那个人；他以为很可能是住在背教城的变节。但是那个人的脸，他看不清楚，因为他像一个被人发觉的小偷一样低垂着头。小信被三个歹徒抢劫。不过当那人在他身边走过以后，盼望目送着他，见他背上有一张纸，上面写着： “反复不定的信徒，该死的背教者。 ”", "于是基督徒对他的伙伴说，我这会儿想起我听到过的关于一个好人在这儿附近遇到的事情。他的名字叫小信；他是一个好人，住在诚恳市。事情是这样的：在这条巷的入口处另有一条巷通到阔门，名叫死人巷，因为在那条巷里常常发生暗杀，所以取了这个名字；这个小信就像我们现在这样奔走天路，他正好在那儿坐下,并且睡着了。那时侯碰巧从阔门来了三个强壮的歹徒，他们是三兄弟，叫做胆小鬼、疑惑和犯罪；他们瞧见小信在那儿，赶忙向他奔来。这时刻那个好人正好醒来，正站起身来打算继续赶路。他们一窝蜂拥到他跟前，用威胁的话语叫他站住。小信见了，顿时面无人色，", "既无力抵抗，又无法脱逃。于是胆小鬼说，交出你的钱包，可是他并不马上交出（因为他很不愿意失掉他的钱） ，疑惑走上前去，伸手到他口袋里，掏出一包银子。这时他喊了起来， “强盗，强盗！ ”这一来，犯罪举起手里的大棍子朝小信的头打去，把他打倒在地上，血流如注，就像一个可能因流血过多致死的人。三个贼始终站在一旁，但是终于听到路上有人声，生怕来人是住在坚信城的大惠，因此拔腿就逃，让那好人自己去想办法。过了一些时候，小信苏醒了过来，站起来，磕磕绊绊地尽力继续赶路。故事就是这样的。", "盼望说：他们是不是把他所有的都拿走了？"], "en_paras": ["et with a very brisk lad, that came out of that country; and his name was Ignorance. So Christian asked him from what parts he came, and whither he was going.", "IGNOR. Sir, I was born in the country that lieth off there a little on the left hand, and I am going to the Celestial City.", "CHR. But how do you think to get in at the gate? for you may find some difficulty there.", "IGNOR. As other people do, said he.", "CHR. But what have you to show at that gate, that may cause that the gate should be opened to you?", "IGNOR. I know my Lord's will, and I have been a good liver; I pay every man his own; I pray, fast, pay tithes, and give alms, and have left my country for whither I am going.", "CHR. But thou camest not in at the wicket-gate that is at the head of this way; thou camest in hither through that same crooked lane, and therefore, I fear, however thou mayest think of thyself, when the reckoning day shall come, thou wilt have laid to thy charge that thou art a thief and a robber, instead of getting admittance into the city.", "IGNOR. Gentlemen, ye be utter strangers to me, I know you not; be content and follow the religion of your country, and I will follow the religion of mine. I hope all will be well. And as for the gate that you talk of, all the world knows that that is a great way off of our country. I cannot think that any man in all our parts doth so much as know the way to it, nor need they matter whether they do or no, since we have, as you see, a fine, pleasant green lane, that comes down from our country, the next way into the way.", "When Christian saw that the man was \"wise in his own conceit\", he said to Hopeful, whisperingly, \"There is more hope of a fool than of him.\" [Prov. 26:12] And said, moreover, \"When he that is a fool walketh by the way, his wisdom faileth him, and he saith to every one that he is a fool.\" [Eccl. 10:3] What, shall we talk further with him, or out-go him at present, and so leave him to think of what he hath heard already, and then stop again for him afterwards, and see if by degrees we can do any good to him? Then said Hopeful--", "Let Ignorance a little while now muse On what is said, and let him not refuse Good counsel to embrace, lest he remain Still ignorant of what's the chiefest gain. God saith, those that no understanding have, Although he made them, them he will not save.", "HOPE. He further added, It is not good, I think, to say all to him at once; let us pass him by, if you will, and talk to him anon, even as he is able to bear it.", "So they both went on, and Ignorance he came after. Now when they had passed him a little way, they entered into a very dark lane, where they met a man whom seven devils had bound with seven strong cords, and were carrying of him back to the door that they saw on the side of the hill. [Matt. 12:45, Prov. 5:22] Now good Christian began to tremble, and so did Hopeful his companion; yet as the devils led away the man, Christian looked to see if he knew him; and he thought it might be one Turn-away, that dwelt in the town of Apostasy. But he did not perfectly see his face, for he did hang his head like a thief that is found. But being once past, Hopeful looked after him, and espied on his back a paper with this inscription, \"Wanton professor and damnable apostate\".", "Then said Christian to his fellow, Now I call to remembrance, that which was told me of a thing that happened to a good man hereabout. The name of the man was Little-faith, but a good man, and he dwelt in the town of Sincere. The thing was this:--At the entering in at this passage, there comes down from Broad-way Gate, a lane called Dead Man's Lane; so called because of the murders that are commonly done there; and this Little-faith going on pilgrimage, as we do now, chanced to sit down there, and slept. Now there happened, at that time, to come down the lane, from Broad-way Gate, three sturdy rogues, and their names were Faint-heart, Mistrust, and Guilt, (three brothers), and they espying Little-faith, where he was, came galloping up with speed. Now the good man was just awake from his sleep, and was getting up to go on his journey. So they came up all to him, and with threatening language bid him stand. At this Little-faith looked as white as a clout, and had neither power to fight nor fly. Then said Faint-heart, Deliver thy purse. But he making no haste to do it (for he was loath to lose his money), Mistrust ran up to him, and thrusting his hand into his pocket, pulled out thence a bag of silver. Then he cried out, Thieves! Thieves! With that Guilt, with a great club that was in his hand, struck Little-faith on the head, and with that blow felled him flat to the ground, where he lay bleeding as one that would bleed to death. All this while the thieves stood by. But, at last, they hearing that some were upon the road, and fearing lest it should be one Great-grace, that dwells in the city of Good-confidence, they betook themselves to their heels, and left this good man to shift for himself. Now, after a while, Little-faith came to himself, and getting up, made shift to scrabble on his way. This was the story.", "HOPE. But did they take from him all that ever he had?", "Chr. No; the place where his jewels were they never ransacked, so those he kept still. But, as I was told, the good man was much afflicted for his loss, for the thieves got most of his spending-money. That which they got not (as I said) were jewels, also he had a little odd money left, but scarce enough to bring him to his journey's end [1 Peter 4:18]; nay, if I was not misinformed, he was forced to beg as he went, to keep himself alive; for his jewels he might not sell. But beg, and do what he could, he went (as we say) with many a hungry belly the most part of the rest of the way.", "HOPE. But is it not a wonder they got not from him his certificate, by which he was to receive his admittance at the Celestial Gate?"]}, {"sub_zh": "小信遭受三个强盗打劫的警世公案", "sub_en": "The Robbery of Little-faith by Faint-heart, Mistrust, and Guilt", "zh_paras": ["基督徒说：不；他们没有搜到他放珠宝的地方；因此他保住了那些。但是我听说，那好人因他的损失感到非常伤心，因为强盗们把他大部分的现款都拿走了。就像我说过的，没有被抢走的只是些珠宝；他还有一些零钱没给抢走，但是不够他旅途上的花费。要是我听到的消息没有传错的话，他一路上不得不行乞来维持生活，因为他不能出卖他的珠宝；可是尽管他沿途行乞，并且想尽种种方法维持生计，他还是饿着肚子奔走了其余大部分的路程。", "盼望说：不过，他们没有拿走他用以进天门的证件，岂不是奇事吗？", "基督徒说：的确奇怪；可是他们没拿到它，虽然并不是由于他的机灵，他们才没找到；因为他们袭击他时，他已经吓得魂不附体了，既没力量，也没本领隐藏任何东西；因此那是出于天意而不是由于他的努力，他们才没有拿到那件宝贝。", "盼望说：他们没拿走他的珠宝，对他说来一定是个安慰。", "基督徒说：如果他像他该做的那样利用了那些珠宝，那可能对他是个很大的安慰；可是，讲这故事给我听的人说，他在后来的旅途中很少用到它，并且那是因为他的钱给拿走之后，他很沮丧。事实上，大部分的时间，他把它都忘了；并且，每次当他想起了它，开始得到安慰的时候，他又想起他的损失，而这种思想就占有了他。", "盼望说：啊，可怜的人！这对他只能是个很大的痛苦。", "基督徒说：痛苦？是啊，的确痛苦。如果我们也有像他那样的遭遇，被抢走了东西，受了伤，又是在一个举目无亲的地方，我们岂不同样会觉得痛苦吗？他竟没有悲伤致死也真怪，可怜的人！我听说后来他一路上除了说不完的悲伤和沉痛的怨言之外几乎什么话都不说；他向赶上他的人诉说，也向给他赶上的人诉说，告诉他们他在那儿如何被抢，谁抢了他，他损失了什么；他怎样受伤，怎样死里逃生。", "盼望说：他竟然没有因为需要，把一部分的珍宝出卖或者当掉，使自己在旅途中可以减轻一些痛苦，这倒是奇事。", "基督徒说：你讲话倒像个至今还不懂事的人。他把它们当掉来换什么呢？他把它们卖给谁呢？在他被抢的地区他的珍宝算不了什么；他也不要那地方所能给他的安慰。况且，如果到了天国的门口时找不到他的珍宝，他就不能继承那儿的产业（这他知道得很清楚） ；那会比一万个强盗的出现和作恶更糟呢。", "盼望说：你为什么这样尖刻，我的兄弟？以扫为了红豆汤把他长子的名分卖掉，而那是他的至宝；如果他能这样做，为什么小信不也这样做？", "基督徒说：以扫的确卖掉了他长子的名分，许多别人也这样做，因而失去主要的祝福，就像这个卑鄙的人一样，不过以扫跟小信是有分别的，他们的情况也不同。以扫的继承权是独特的，小信的珍宝却不是。以扫太重视他的肚子，小信可不那样。以扫的需要是满足他的肉欲，小信的可不是。并且以扫的眼光只能看到他肉体的满足：“我将要死” （他说） ，2“这长子的名分于我有什么益处呢？”可是小信，虽然他的信心不大，他却能靠着那一点信心免于这种放肆的行为，并且还能重视他的珍宝，不至像以扫那样把它们卖掉。你不论在哪一方面都看不出以扫有信心，没有，连一点点也没有；因此", "当他整个人受到肉欲的支配时（在一个没有信心来抵御的人就会这样） ，要是他把继承权、灵魂和一切都卖给地狱的魔鬼，那也不足为奇；这种人跟野驴一样，3“起性的时候，谁能使他转去呢？”当他们一心只想满足自己的欲望时，不管得付出什么代价，也在所不惜，总是非要达到目的不可。但是小信又是一种性情；他一心只想天上的东西；他是靠超世俗的东西而活着的；因此，这样的人把他的珍宝卖掉（假使有人收买的话）去换取精神上的空虚，又有什么意义呢？一个人会花钱去把肚子塞满干草吗？或者你能劝斑鸠像乌鸦那样去吃腐烂的尸体吗？尽管没有信心的人为了肉欲会典当、抵押或者", "卖掉他们所有的，连他们自己也一起卖掉，可是具有信心（能拯救自己的信心）的人，虽然信心并不大，他也不会那样做。因此，我的兄弟，你就错在这一点上。", "盼望说：我承认；可是你严厉的谴责几乎使我生气。"], "en_paras": ["CHR. It is a wonder; but they got not that, though they missed it not through any good cunning of his; for he, being dismayed with their coming upon him, had neither power nor skill to hide anything; so it was more by good Providence than by his endeavour, that they missed of that good thing.", "HOPE. But it must needs be a comfort to him, that they got not his jewels from him.", "CHR. It might have been great comfort to him, had he used it as he should; but they that told me the story said, that he made but little use of it all the rest of the way, and that because of the dismay that he had in the taking away his money; indeed, he forgot it a great part of the rest of his journey; and besides, when at any time it came into his mind, and he began to be comforted therewith, then would fresh thoughts of his loss come again upon him, and those thoughts would swallow up all. [1 Peter 1:9]", "HOPE. Alas! poor man! This could not but be a great grief to him.", "CHR. Grief! ay, a grief indeed. Would it not have been so to any of us, had we been used as he, to be robbed, and wounded too, and that in a strange place, as he was? It is a wonder he did not die with grief, poor heart! I was told that he scattered almost all the rest of the way with nothing but doleful and bitter complaints; telling also to all that overtook him, or that he overtook in the way as he went, where he was robbed, and how; who they were that did it, and what he lost; how he was wounded, and that he hardly escaped with his life.", "HOPE. But it is a wonder that his necessity did not put him upon selling or pawning some of his jewels, that he might have wherewith to relieve himself in his journey.", "CHR. Thou talkest like one upon whose head is the shell to this very day; for what should he pawn them, or to whom should he sell them? In all that country where he was robbed, his jewels were not accounted of; nor did he want that relief which could from thence be administered to him. Besides, had his jewels been missing at the gate of the Celestial City, he had (and that he knew well enough) been excluded from an inheritance there; and that would have been worse to him than the appearance and villainy of ten thousand thieves.", "HOPE. Why art thou so tart, my brother? Esau sold his birthright, and that for a mess of pottage, and that birthright was his greatest jewel; and if he, why might not Little-faith do so too? [Heb. 12:16]", "CHR. Esau did sell his birthright indeed, and so do many besides, and by so doing exclude themselves from the chief blessing, as also that caitiff did; but you must put a difference betwixt Esau and Little-faith, and also betwixt their estates. Esau's birthright was typical, but Little-faith's jewels were not so; Esau's belly was his god, but Little-faith's belly was not so; Esau's want lay in his fleshly appetite, Little-faith's did not so. Besides, Esau could see no further than to the fulfilling of his lusts; \"Behold, I am at the point to die, (said he), and what profit shall this birthright do me?\" [Gen. 25:32] But Little-faith, though it was his lot to have but a little faith, was by his little faith kept from such extravagances, and made to see and prize his jewels more than to sell them, as Esau did his birthright. You read not anywhere that Esau had faith, no, not so much as a little; therefore, no marvel if, where the flesh only bears sway, (as it will in that man where no faith is to resist), if he sells his birthright, and his soul and all, and that to the devil of hell; for it is with such, as it is with the ass, who in her occasions cannot be turned away. [Jer. 2:24] When their minds are set upon their lusts, they will have them whatever they cost. But Little-faith was of another temper, his mind was on things divine; his livelihood was upon things that were spiritual, and from above; therefore, to what end should he that is of such a temper sell his jewels (had there been any that would have bought them) to fill his mind with empty things? Will a man give a penny to fill his belly with hay; or can you persuade the turtle-dove to live upon carrion like the crow? Though faithless ones can, for carnal lusts, pawn, or mortgage, or sell what they have, and themselves outright to boot; yet they that have faith, saving faith, though but a little of it, cannot do so. Here, therefore, my brother, is thy mistake.", "HOPE. I acknowledge it; but yet your severe reflection had almost made me angry.", "CHR. Why, I did but compare thee to some of the birds that are of the brisker sort, who will run to and fro in untrodden paths, with the shell upon their heads; but pass by that, and consider the matter under debate, and all shall be well betwixt thee and me.", "HOPE. But, Christian, these three fellows, I am persuaded in my heart, are but a company of cowards; would they have run else, think you, as they did, at the noise of one that was coming on the road? Why did not Little-faith pluck up a greater heart? He might, methinks, have stood one brush with them, and have yielded when there had been no remedy.", "CHR. That they are cowards, many have said, but few have found it so in the time of trial. As for a great heart, Little-faith had none; and I perceive by thee, my brother, hadst thou been the man concerned, thou art but for a brush, and then to yield.", "And, verily, since this is the height of thy stomach, now they are at a distance from us, should they appear to thee as they did to him they might put thee to second thoughts.", "But, consider again, they are but journeymen thieves, they serve under the king of the bottomless pit, who, if need be, will come into their aid himself, and his voice is as the roaring of a lion. [1 Pet. 5:8] I myself have been engaged as this Little-faith was, and I found it a terrible thing. These three villains set upon me, and I beginning, like a Christian, to resist, they gave but a call, and in came their master. I would, as the saying is, have given my life for a penny, but that, as God would have it, I was clothed with armour of proof. Ay, and yet, though I was so harnessed, I found it hard work to quit myself like a man. No man can tell what in that combat attends us, but he that hath been in the battle himself.", "HOPE. Well, but they ran, you see, when they did but suppose that one Great-grace was in the way.", "CHR. True, they have often fled, both they and their master, when Great-grace hath but appeared; and no marvel; for he is the King's champion. But, I trow, you will put some difference betwixt Little-faith and the King's champion. All the King's subjects are not his champions, nor can they, when tried, do such feats of war as he. Is it meet to think that a little child should handle Goliath as David did? Or that there should be the strength of an ox in a wren? Some are strong, some are weak; some have great faith, some have little. This man was one of the weak, and therefore he went to the wall."]}, {"sub_zh": "小信的宝玉存留与信心的真实大能", "sub_en": "Little-faith Preserves His Jewels & The Victorious Shield of Faith", "zh_paras": ["基督徒说：怎么，我只不过把你跟有些活泼的人对比，他们头上戴上了壳子在没有人迹的路上奔来奔去。不过，别管这些，还是考虑我们在讨论的问题吧，你我之间不会有什么意见的。", "盼望说：我从心底里相信那三个家伙都是胆小鬼；不然的话，你想他们会像他们所做的那样，一听见路上有人声拔腿就逃吗？小信为什么不能再勇敢一点呢？我想他可以应付他们一阵，等到没有办法的时候再投降。", "基督徒说：许多人都说他们是胆小鬼，但是轮到自己受考验的时候，很少人会那样想的。至于勇气，小信可没有；我看得出，我的兄弟，要是你做了当事人，你也只能抵抗一下，然后就投降了。的确，他们现在离我们有一段路，你当然心情很好，要是他们像对他那样出现在你面前，你就可能会改变主意了。不过，再想一想，他们也不过是拦路强盗；他们在地狱的王手下工作，必要的话，地狱的王本人还会来帮忙，他的声音就像狮子的吼叫。我自己也遇到过像小信所遭遇到的同样事情，那真可怕得很哪。当时这三个歹徒攻击我，我像个基督徒那样开始抵抗，他们只发出一个喊声，他们的主人马上就来了。", "就像俗语所说的，我认为“我这条命轻如鸿毛” ，可是，按照神的意旨，我身上披有坚牢的铠甲。是的，可是，虽然我这样武装着，我发现要表现得像个大丈夫还是很困难。除非自己经历过这种战斗，没有一个人知道这场斗争有多惊险的。", "盼望说：唔，可是你看，当他们只不过以为一个大惠要来的时候，他们就已经拔腿逃跑了。", "基督徒说：的确这样，只要大惠一出现；他们跟他们的主人往往逃之夭夭。不过这也不足为奇，因为他是国王的战士。不过我想你不能拿小信跟国王的战士相提并论。所有国王的臣民并不都是战士；遇到考验的时候，他们也不能像他那样大显身手。希望一个小孩能像大卫那样对付哥利亚，或者一只鹪鹩能有一只公牛的力气，岂不是不合情理的吗？有的人坚强，有的人软弱，有的人信心大，有的人信心小；这个人是软弱的，因此受人欺侮。", "盼望说：但愿换个大惠来给他们颜色看。", "基督徒说：即使是他的话，他也可能应付不了；因为我得告诉你，虽然大惠精通武艺，只要他拒他们于一剑之外，他可以，也能够应付他们绰绰有余，可是一旦他们闯近他身边，不管是胆小鬼、疑惑或者其他的人，那就很难不被他们摔倒了；你知道，一个人倒在地上的时候，还有什么办法呢？任何人仔细瞧大惠的脸都看得见那些疤痕和伤迹，它们足以证明我的话。是的，有一次我还听到他说（那是在搏斗的时候） ，3“我们没有活命的希望了。”这些强壮的歹徒和他们的同党曾经使大卫呻吟、悲叹和吼叫得多凄惨啊！不仅如此，虽然希幔和希西家当年都是不可一世的勇士，当他们", "受到攻击的时候，也不得不拿出全副力量来呢；但是，尽管这样，他们还是受到了痛击。彼得曾经去试过一次，为了要弄明白自己究竟是不是对付得了他们；虽然人家说他是众使徒的堂堂首领，可还是让他们折磨得使他后来见到一个可怜的女孩子也会心惊肉跳了。况且，他们的王一喊即到；他总是待在听得见他们的喊声的地方；如果在任何时候他们招架不住了，他，可能的话，总来帮他们的忙。关于他，人家说了这样的话， “人若用刀、用枪、用标枪、用尖枪扎他，都是无用。他以铁为干草，以铜为烂木。箭不能恐吓他使他逃避，弹石在他看为碎秸。棍棒算为禾秸：他嗤笑短枪飕的响声。”遇到这", "种情况，一个人有什么办法呢？的确，如果一个人随时都有约伯的马，并且有能力和勇气去驾驭它，他可能作出了不起的事情；因为1“它颈项上咤挲的鬃，是你给它披上的吗？是你叫他跳跃像蝗虫吗？它喷气之威使人惊惶。它在谷中刨地，自喜其力，它出去迎接佩带兵器的人。它嗤笑可怕的事，并不惊惶，也不因刀剑退回。箭袋和发亮的枪，并短枪，在它身上铮铮有声。它发猛烈的怒气将地吞下，一听角声就不耐站立。角每发声，它说，呵哈，它从远处闻着战气，又听见军长大发雷声，和兵丁吶喊。”不过像你我这种人，还是不要希望碰到什么敌人的好，当我们听到别人失败的时候，我们也不要", "夸耀我们会比他们强；也不要以为我们是大丈夫，沾沾自喜，因为受到考验的时候，这样往往会打败仗。只要看我前面提过的彼得；他夸口，是的，他会那样；他那虚荣的心灵使他说自己比别人强，比所有的人都忠于他的主人；可是有谁像他那样给那些歹徒击败和撞倒呢？因此，当我们听见在国王的大路上发生这类抢劫的事情的时候，我们应当做两件事：——第一，我们要披上盔甲，还一定得拿着盾牌出去；就是为了缺少这个，所以那个拼命攻击巨大海兽的人不能使那海兽屈服；因为，的确，要是没有盾牌，我们的敌人一点也不怕我们的。因此，有本领的人说，2“此外又拿着信德当作盾牌，可以", "灭尽那恶者一切的火箭。”同时我们应该要求国王护送我们，不仅如此，要他亲自跟我们同行。当大卫在死荫谷的时候，他庆幸有国王同行；摩西宁肯站而待毙，也不情愿离开神一步。哦，我的兄弟，只要有祂同行，我们还用怕与我们为敌的万军之众吗？但是，要是没有祂，骄傲的助手也要扑倒在被杀的人以下。至于我，我过去曾经交战过；虽然由于神的慈悲，你看见我现在还活着，可是我不能夸耀我的刚毅。如果我不再碰到这种事件，我就很高兴，可是恐怕我们还没有脱离险境呢。不过，既然狮子和熊都还没有把我吞掉，我希望神也会把我们从下一个没有受割礼的非利士人手中救出来。说到这里基督", "徒歌唱起来了：可怜的小信！碰到了盗贼？受到了他们的抢劫？记住：谁有信心，并且信上加信，就会战胜一万人——否则，连三个人都打不赢。他们继续走着，无知跟在后面。他们走到一个地方，那儿他们看见有一条路岔到他们的路上来，并且也跟他们走的那条路一样笔直；因此他们不知道走哪一条路好，因为两条路看上去一样直；他们只好停下来考虑一下。他们正在考虑的当儿，来了一个穿着薄薄的袍子、皮肤很黑的人，那人问他们干么站在那儿。他们回答说，他们是到天国去的，可是不知道应该走哪条路。跟我去吧，那个人说，我也是到那儿去的。于是他们跟着他走上那条", "新出现的路，这条路渐渐拐弯，到后来拐得离开他们要去的地方很远了，过了没一会儿工夫，他们已经不再朝那地方走了；可是他们仍旧跟着他。他们不知不觉地渐渐给他带进一个罗网，陷在里面无法解脱，不知如何是好；这以后那件白衣服从黑人身上落了下来。这时他们才知道他们在哪儿。因此他们躺着哭了好一会，因为他们不能脱身。"], "en_paras": ["HOPE. I would it had been Great-grace for their sakes.", "CHR. If it had been, he might have had his hands full; for I must tell you, that though Great-grace is excellent good at his weapons, and has, and can, so long as he keeps them at sword's point, do well enough with them; yet, if they get within him, even Faint-heart, Mistrust, or the other, it shall go hard but they will throw up his heels. And when a man is down, you know, what can he do?", "Whoso looks well upon Great-grace's face, shall see those scars and cuts there, that shall easily give demonstration of what I say. Yea, once I heard that he should say, (and that when he was in the combat), \"We despaired even of life.\" How did these sturdy rogues and their fellows make David groan, mourn, and roar? Yea, Heman, and Hezekiah, too, though champions in their day, were forced to bestir them, when by these assaulted; and yet, notwithstanding, they had their coats soundly brushed by them. Peter, upon a time, would go try what he could do; but though some do say of him that he is the prince of the apostles, they handled him so, that they made him at last afraid of a sorry girl.", "Leviathan's sturdiness", "Besides, their king is at their whistle. He is never out of hearing; and if at any time they be put to the worst, he, if possible, comes in to help them; and of him it is said, The sword of him that layeth at him cannot hold the spear, the dart, nor the habergeon; he esteemeth iron as straw, and brass as rotten wood. The arrow cannot make him flee; sling stones are turned with him into stubble. Darts are counted as stubble: he laugheth at the shaking of a spear. [Job 41:26-29] What can a man do in this case? It is true, if a man could, at every turn, have Job's horse, and had skill and courage to ride him, he might do notable things; for his neck is clothed with thunder, he will not be afraid of the grasshopper; the glory of his nostrils is terrible: he paweth in the valley, and rejoiceth in his strength, he goeth on to meet the armed men. He mocketh at fear, and is not affrighted, neither turneth he back from the sword. The quiver rattleth against him, the glittering spear, and the shield. He swalloweth the ground with fierceness and rage, neither believeth he that it is the sound of the trumpet. He saith among the trumpets, Ha, ha! and he smelleth the battle afar off, the thunder of the captains, and the shouting. [Job 39:19-25]", "But for such footmen as thee and I are, let us never desire to meet with an enemy, nor vaunt as if we could do better, when we hear of others that they have been foiled, Nor be tickled at the thoughts of our own manhood; for such commonly come by the worst when tried. Witness Peter, of whom I made mention before. He would swagger, ay, he would; he would, as his vain mind prompted him to say, do better, and stand more for his Master than all men; but who so foiled, and run down by these villains, as he?", "When, therefore, we hear that such robberies are done on the King's highway, two things become us to do:", "1. To go out harnessed, and to be sure to take a shield with us; for it was for want of that, that he that laid so lustily at Leviathan could not make him yield; for, indeed, if that be wanting, he fears us not at all. Therefore, he that had skill hath said, \"Above all, taking the shield of faith, wherewith ye shall be able to quench all the fiery darts of the wicked.\" [Eph. 6:16]", "2. It is good, also, that we desire of the King a convoy, yea, that he will go with us himself. This made David rejoice when in the Valley of the Shadow of Death; and Moses was rather for dying where he stood, than to go one step without his God. [Exo. 33:15] Oh, my brother, if he will but go along with us, what need we be afraid of ten thousands that shall set themselves against us? [Ps. 3:5-8, 27:1-3] But, without him, the proud helpers \"fall under the slain\". [Isa. 10:4]", "I, for my part, have been in the fray before now; and though, through the goodness of him that is best, I am, as you see, alive, yet I cannot boast of my manhood. Glad shall I be, if I meet with no more such brunts; though I fear we are not got beyond all danger. However, since the lion and the bear have not as yet devoured me, I hope God will also deliver us from the next uncircumcised Philistine. Then sang Christian--", "Poor Little-faith! Hast been among the thieves? Wast robb'd? Remember this, whoso believes, And gets more faith, shall then a victor be Over ten thousand, else scarce over three.", "So they went on and Ignorance followed. They went then till they came at a place where they saw a way put itself into their way, and seemed withal to lie as straight as the way which they should go: and here they knew not which of the two to take, for both seemed straight before them; therefore, here they stood still to consider. And as they were thinking about the way, behold a man, black of flesh, but covered with a very light robe, came to them, and asked them why they stood there. They answered they were going to the Celestial City, but knew not which of these ways to take. Follow me, said the man, it is thither that I am going. So they followed him in the way that but now came into the road, which by degrees turned, and turned them so from the city that they desired to go to, that, in little time, their faces were turned away from it; yet they followed him. But by and by, before they were aware, he led them both within the compass of a net, in which they were both so entangled that they knew not what to do; and with that the white robe fell off the black man's back. Then they saw where they were. Wherefore, there they lay crying some time, for they could not get themselves out.", "CHR. Then said Christian to his fellow, Now do I see myself in error. Did not the Shepherds bid us beware of the flatterers? As is the saying of the wise man, so we have found it this day. A man that flattereth his neighbour, spreadeth a net for his feet. [Prov. 29:5]", "HOPE. They also gave us a note of directions about the way, for our more sure finding thereof; but therein we have also forgotten to read, and have not kept ourselves from the paths of the destroyer. Here David was wiser than we; for, saith he, \"Concerning the works of men, by the word of thy lips, I have kept me from the paths of the destroyer.\" [Ps. 17:4] Thus they lay bewailing themselves in the net. At last they espied a Shining One coming towards them with a whip of small cord in his hand. When he was come to the place where they were, he asked them whence they came, and what they did there. They told him that they were poor pilgrims going to Zion, but were led out of their way by a black man, clothed in white, who bid us, said they, follow him, for he was going thither too. Then said he with the whip, It is Flatterer, a false apostle, that hath transformed himself into an angel of light. [Prov. 29:5, Dan. 11:32, 2 Cor. 11:13,14] So he rent the net, and let the men out. Then said he to them, Follow me, that I may set you in your way again. So he led them back to the way which they had left to follow the Flatterer. Then he asked them, saying, Where did you lie the last night? They said, With the Shepherds upon the Delectable Mountains. He asked them then if they had not of those Shepherds a note of direction for the way. They answered, Yes. But did you, said he, when you were at a stand, pluck out and read your note? They answered, No. He asked them, Why? They said, they forgot. He asked, moreover, if the Shepherds did not bid them beware of the Flatterer? They answered, Yes, but we did not imagine, said they, that this fine-spoken man had been he. [Rom. 16:18]", "Then I saw in my dream that he commanded them to lie down; which, when they did, he chastised them sore, to teach them the good way wherein they should walk [Deut. 25:2]; and as he chastised them he said, \"As many as I love, I rebuke and chasten; be zealous, therefore, and repent.\" [2 Chron. 6:26,27, Rev. 3:19] This done, he bid them go on their way, and take good heed to the other directions of the shepherds. So they thanked him for all his kindness, and went softly along the right way, singing--", "Come hither, you that walk along the way; See how the pilgrims fare that go astray. They catched are in an entangling net, 'Cause they good counsel lightly did forget: 'Tis true they rescued were, but yet you see, They're scourged to boot. Let this your caution be.", "Now, after a while, they perceived, afar off, one coming softly and alone, all along the highway to meet them. Then said Christian to his fellow, Yonder is a man with his back towards Zion, and he is coming to meet us."]}, {"sub_zh": "误入谄媚者网罗与天使严厉管教", "sub_en": "Ensnared by Flatterer's Net & Rescued by the Shining One", "zh_paras": ["于是基督徒对他的同伴说，现在我知道错了。牧人们不是叫我们当心谄媚者吗？就像贤者所说的，我们今天才发觉，1“谄媚邻舍的，就是设网罗绊他的脚。”", "盼望说：为了使我们便于找到路，他们还给了我们一张指点方向的纸条，可是我们忘了去看那纸条，因而没有避开“强暴人的道路。”在这一点上大卫却比我们聪明；因为他说，2“论到人的行为，我借着你嘴唇的言语，自己谨守，不行强暴人的道路。”他们就这样在罗网里痛哭。最后他们看见一个荣光四射的人向他们走来，手里拿着一根用细绳编成的鞭子。他走到他们跟前，问他们从哪儿来，在这儿干什么。他们告诉他，他们是往锡安去的可怜的旅客，让一个穿白衣的黑人带领离开了他们原来那条路，那人叫他们跟他走，说他自己也是上那儿去的。于是拿鞭子的人说，那是谄媚者，4“一个装作光明的天使的假使徒。”于是他扯碎那个网，", "放他们出来。接着他对他们说，跟着我走，我可以领你们回到你们原来走的那条路上去。于是他领他们回到当初他们为了跟随谄媚者而离去的地方。到了那儿他问道：你们昨晚在哪儿过夜的？他们说在快乐山牧人们那儿。他又问他们，牧人们没有给你们一张指示路径的条子吗？他们回答：有。他说：那么，你们不知所措的时候，没有把条子拿出来看吗？他们说，没有。他问，为什么不拿出来看？他们回答说，忘记了。他还问他们，难道牧人们没有叮嘱他们要当心谄媚者吗？他们说，有；可是我们没想到这个话讲得很好听的人就是谄媚者。无神论者哈哈大笑起来。", "然后我在梦里看见他叫他们躺下；他们照着他的话做了，他狠狠地责打了他们，教导他们应该走的正确的路。他一面惩罚他们，一面说，3“凡我所疼爱的，我就责备管教他；所以你要发热心，也要悔改。”这以后，他吩咐他们再上路，叮嘱他们要留心牧人们其他的指示。于是他们感谢他的仁爱，慢慢地沿着正路走，一面唱着：来，你们在这条路上奔走的人，来看看走上歧途的旅客们的命运：他们陷入了纠结的罗网，因为他们把好的劝告轻轻遗忘。的确，他们给救了出来；可是你看，他们还受了鞭打。让这件事作为你们的警戒。过了一会，他们看到远远的有个人独个儿慢慢地在路上向他们走来。于是基督徒对他的同伴说，", "那儿有个人背朝着锡安向我们走来。", "盼望说：我看见啦；我们小心一点吧，万一他又是个谄媚者。那个人越走越近，终于来到他们跟前。他叫做无神论者；他问他们往哪儿去。", "基督徒说：我们到锡安山去。无神论者哈哈大笑起来。", "基督徒问：你这样笑是什么意思呢？无神论者说：我看见你们这样愚蠢，走这样沉闷的旅程，而结果除了旅途的辛苦以外，多半是一无所得的，所以我才这样笑。", "基督徒说：怎么，老兄，你认为我们不会受到接待吗？无神论者说：接待！世界上根本就没有你们所梦想的那样一个地方。", "基督徒说：但是在死后的世界里可有。无神论者说：当我在自己家乡的时候，我也听到你现在所说的地方，因此我就出去寻找，可是二十年来找来找去，还是跟当日出发的时候一样，什么也没有找到。", "基督徒说：咱们两个人都听说，也都相信有这么一个地方。无神论者说：要不是我在家里时也这样相信，我也不会跑这么远来找了；可是既然找不到（如果有这么一个地方，我一定会找到的，因为我比你走得还要远呢） ，我现在回家去；当初为了要得到我所希望的东西，我曾抛弃一切，现在我可要去拿起我抛弃了的一切来安慰自己。我现在已经知道根本没有希望得到那东西的。基督徒听了这话问他的同伴盼望说，这个人说的是真的吗？", "盼望说：当心，他也是个谄媚者；要记住我们曾经由于听了这种人的话而付出的代价。什么话！没有锡安山？我们不是从快乐山上亲眼目睹过天国的大门吗？再说，我们现在不是凭着信心行事吗？我们还是往前走吧，免得那个拿鞭子的人又追上来。你应该早给我这个教训，我现在把它悄悄讲给你听：2“我儿，不可听了教训，而又偏离知识的言语。”喂，我的兄弟，别听他的话，我们还是相信灵魂能够得救吧。", "基督徒说：我的兄弟，我不是因为怀疑我们所相信的真理才问你那个问题，而是为了要考验你，同时要从你那儿取得显示你的心地诚实的证明。至于这个人，我知道他是给魔鬼弄瞎了眼。你我还是往前去吧，既然我们知道我们相信的是真理，并且5“没有虚谎是从真理出来的。”", "盼望说：现在我为神的荣耀抱着希望，又感到欢乐。于是他们离开那个人；而那人讥笑着他们，径自走了。"], "en_paras": ["HOPE. I see him; let us take heed to ourselves now, lest he should prove a flatterer also. So he drew nearer and nearer, and at last came up unto them. His name was Atheist, and he asked them whither they were going.", "CHR. We are going to Mount Zion.", "Then Atheist fell into a very great laughter.", "CHR. What is the meaning of your laughter?", "ATHEIST. I laugh to see what ignorant persons you are, to take upon you so tedious a journey, and you are like to have nothing but your travel for your pains.", "CHR. Why, man, do you think we shall not be received?", "ATHEIST. Received! There is no such place as you dream of in all this world.", "CHR. But there is in the world to come.", "ATHEIST. When I was at home in mine own country, I heard as you now affirm, and from that hearing went out to see, and have been seeking this city this twenty years; but find no more of it than I did the first day I set out. [Jer. 22:12, Eccl. 10:15]", "CHR. We have both heard and believe that there is such a place to be found.", "ATHEIST. Had not I, when at home, believed, I had not come thus far to seek; but finding none, (and yet I should, had there been such a place to be found, for I have gone to seek it further than you), I am going back again, and will seek to refresh myself with the things that I then cast away, for hopes of that which, I now see, is not.", "CHR. Then said Christian to Hopeful his fellow, Is it true which this man hath said?", "Hopeful's gracious answer", "Hope. Take heed, he is one of the flatterers; remember what it hath cost us once already for our hearkening to such kind of fellows. What! no Mount Zion? Did we not see, from the Delectable Mountains the gate of the city? Also, are we not now to walk by faith? Let us go on, said Hopeful, lest the man with the whip overtake us again. [2 Cor. 5:7] You should have taught me that lesson, which I will round you in the ears withal: \"Cease, my son, to hear the instruction that causeth to err from the words of knowledge.\" [Prov. 19:27] I say, my brother, cease to hear him, and let us \"believe to the saving of the soul\". [Heb. 10:39]", "CHR. My brother, I did not put the question to thee for that I doubted of the truth of our belief myself, but to prove thee, and to fetch from thee a fruit of the honesty of thy heart. As for this man, I know that he is blinded by the god of this world. Let thee and I go on, knowing that we have belief of the truth, \"and no lie is of the truth\". [1 John 2:21]", "HOPE. Now do I rejoice in hope of the glory of God. So they turned away from the man; and he, laughing at them, went his way.", "I saw then in my dream, that they went till they came into a certain country, whose air naturally"]}]}, {"num": 20, "id": "chapter-18", "badge_label": "CHAPTER 20", "title_zh": "第十八章 着魔之地", "title_en": "Chapter 18: The Enchanted Ground", "desc": "斥退无神论者的嗤笑狂言；穿过着魔之地：彼此谈论归主经历提振灵性；基督宝血与称义真道的深刻交通。", "blocks": [{"sub_zh": "斥退无神论者的嗤笑狂言", "sub_en": "Atheist's Mockery and Vain Boastings Rebuffed", "zh_paras": ["接着我在梦里看见他们来到一个郊外，那儿的空气会使一个陌生人打瞌睡。盼望开始觉得昏昏沉沉，只想睡觉；因此他对基督徒说，我现在非常瞌睡，几乎眼睛都睁不开了；我们躺下睡一会吧。", "基督徒说：绝对不可以；恐怕睡着以后我们再也不会醒过来了。", "盼望说：为什么，我的兄弟？对一个作工的人来说，睡眠是甜蜜的；要是睡一会儿，我们可以恢复我们的精神的。", "基督徒说：你不记得牧人的话吗？他叫我们要小心谨防着魔之地。他的意思就是不要我们睡着。6“所以我们不要睡觉，像别人一样，总要警醒谨守。”", "盼望说：我承认我是错了；要是没有你跟我在一起的话，我会由于沉睡而冒性命的危险。我看出贤者的话是对的，7“两个人总比一个人好。”这些日子以来，有你作我的同伴真是我的幸运；你会因你的劳苦而得到上好的奖赏的。", "基督徒说：那么，为了避免在这个地方打瞌睡，我们还是好好谈谈吧。", "盼望说：我完全同意。", "基督徒问：从哪儿谈起呢？", "盼望说：从神开始找我们的时候谈起。要是你高兴的话，请你先讲。", "基督徒说：我先唱一首歌给你听：圣徒睡眼惺忪的时候，让他们来听这两个天路旅客怎样谈心；让他们向那两个人学习，无论如何不能让蒙胧欲睡的眼睛合闭。圣徒们只要能友爱地互助，就能经常保持清醒，连地狱也不在乎。", "然后基督徒开始说，我问你一个问题。你最初怎么会想做你现在所做的事？", "盼望说：你的意思是不是说，我当初怎么会关心到自己的灵魂的？", "基督徒说：是，我正是这意思。", "盼望说：有很长一段时期，我很欣赏在市集上展览并出售的那些东西 ——我相信，要是至今我还贪爱着那些东西，我现在一定已经陷进沉沦和毁灭的深渊了。", "基督徒问：它们是些什么东西呢？", "盼望说：世界上所有的珍宝和财富。同时我也很喜欢闹酒、大吃大喝、发誓、说谎、荒唐、不守安息日等等，这些事情都会毁坏我的灵魂。但是由于听到和思量神圣的事情（我听到你以及在浮华市集因他的信心和良好行为而被杀的忠信的一些事情） ，我终于发觉1“那些事的结局就是死；”并且为了这些事，2“神的忿怒必临到那悖逆之子。”", "基督徒问：你当时是不是马上就服服贴贴的悔悟了？", "盼望说：不；我并不愿意立刻知道罪的邪恶，也不愿意知道随犯罪而来的永远的处罚；当神的道最初开始震动我的心灵的时候，我反而拼命闭住眼睛，不要接触它的亮光。", "基督徒说：圣灵开始在你身上作工的时候，你为什么会有这副样子呢？", "盼望说：原因是——1．我不知道这是神在我身上作工。我从来没想到神首先用对罪的觉悟来改变罪人。2．当时我的肉体还是觉得罪恶非常甜蜜，我不愿意舍弃它。3．我不知道怎么跟的老伴侣分手，因为我非常喜欢他们和他们的行为。4．我觉悟的时候非常烦恼、非常惊恐，我实在受不了，甚至想起这件事也叫我受不了。", "基督徒说：那么，这么说来，你有时候能够摆脱掉你的烦恼吗？", "盼望说：的确能够；可是它还会回到我心上来，在那种时候我感到跟过去同样痛苦，甚至比过去还要痛苦。", "基督徒说：怎么，什么事情会使你又想起你的罪来的？", "盼望说：许多事情呢，譬如说：1．只要我在街上遇到一个好人；或者2．要是我听见什么人读《圣经》 ；或者3．当我头痛的时候；或者4．如果人家告诉我，我的邻居生病；或者5．当我听见教堂里为死人敲钟的时候；或者6．当我想到自己死去的时候；或者7．听到别人突然的死亡；8．特别是在考虑到自己问题的时候，想到自己得赶快作出决定才是。", "基督徒问：当你通过以上任何的方式感觉到自己有罪的时候，你能不能随时很便当地摆脱犯罪的感觉？", "盼望说：不，我不能；因为要是那样做的话，我的良心会更不安；并且，只要我一想到再继续犯罪（虽然我已经决定不这样做） ，我会感到加倍的痛苦。", "基督徒说：那么你怎么办呢？", "盼望说：我认为我得改过自新，因为不然的话，我一定会堕入地狱。", "基督徒说：你有没有设法改过呢？", "盼望说：有；我不但避开罪恶，还避开罪恶的伙伴，同时我还履行宗教上的本分，如祈祷、念经、为罪恶痛哭、对邻居说实话等等。这些我都做了，还作了许多别的事，多得举不胜举。", "基督徒说：那么你认为自己没有问题了吗？", "盼望说：是的，有一个时期我有这样的想法；可是终于我的烦恼又来临了，而且总是在我每次改过自新以后。"], "en_paras": ["tended to make one drowsy, if he came a stranger into it. And here Hopeful began to be very dull and heavy of sleep; wherefore he said unto Christian, I do now begin to grow so drowsy that I can scarcely hold up mine eyes, let us lie down here and take one nap.", "CHR. By no means, said the other, lest sleeping, we never awake more.", "HOPE. Why, my brother? Sleep is sweet to the labouring man; we may be refreshed if we take a nap.", "CHR. Do you not remember that one of the Shepherds bid us beware of the Enchanted Ground? He meant by that that we should beware of sleeping; \"Therefore let us not sleep, as do others, but let us watch and be sober.\" [1 Thess. 5:6]", "HOPE. I acknowledge myself in a fault, and had I been here alone I had by sleeping run the danger of death. I see it is true that the wise man saith, Two are better than one. Hitherto hath thy company been my mercy, and thou shalt have a good reward for thy labour. [Eccl. 9:9]", "CHR. Now then, said Christian, to prevent drowsiness in this place, let us fall into good discourse.", "HOPE. With all my heart, said the other.", "CHR. Where shall we begin?", "HOPE. Where God began with us. But do you begin, if you please.", "CHR. I will sing you first this song:--", "When saints do sleepy grow, let them come hither, And hear how these two pilgrims talk together: Yea, let them learn of them, in any wise, Thus to keep ope their drowsy slumb'ring eyes. Saints' fellowship, if it be managed well, Keeps them awake, and that in spite of hell.", "CHR. Then Christian began and said, I will ask you a question. How came you to think at first of so doing as you do now?", "HOPE. Do you mean, how came I at first to look after the good of my soul?", "CHR. Yes, that is my meaning.", "HOPE. I continued a great while in the delight of those things which were seen and sold at our fair; things which, I believe now, would have, had I continued in them, still drowned me in perdition and destruction.", "CHR. What things are they?", "Hopeful's life before conversion", "HOPE. All the treasures and riches of the world. Also, I delighted much in rioting, revelling, drinking, swearing, lying, uncleanness, Sabbath-breaking, and what not, that tended to destroy the soul. But I found at last, by hearing and considering of things that are divine, which indeed I heard of you, as also of beloved Faithful that was put to death for his faith and good living in Vanity Fair, that \"the end of these things is death\". [Rom. 6:21-23] And that for these things' sake \"cometh the wrath of God upon the children of disobedience\". [Eph. 5:6]", "CHR. And did you presently fall under the power of this conviction?", "HOPE. No, I was not willing presently to know the evil of sin, nor the damnation that follows upon the commission of it; but endeavoured, when my mind at first began to be shaken with the Word, to shut mine eyes against the light thereof.", "CHR. But what was the cause of your carrying of it thus to the first workings of God's blessed Spirit upon you?", "HOPE. The causes were, 1. I was ignorant that this was the work of God upon me. I never thought that, by awakenings for sin, God at first begins the conversion of a sinner. 2. Sin was yet very sweet to my flesh, and I was loath to leave it. 3. I could not tell how to part with mine old companions, their presence and actions were so desirable unto me. 4. The hours in which convictions were upon me were such troublesome and such heart-affrighting hours that I could not bear, no not so much as the remembrance of them, upon my heart.", "CHR. Then, as it seems, sometimes you got rid of your trouble.", "HOPE. Yes, verily, but it would come into my mind again, and then I should be as bad, nay, worse, than I was before.", "CHR. Why, what was it that brought your sins to mind again?", "HOPE. Many things; as,", "1. If I did but meet a good man in the streets; or,", "2. If I have heard any read in the Bible; or,", "3. If mine head did begin to ache; or,", "4. If I were told that some of my neighbours were sick; or,", "5. If I heard the bell toll for some that were dead; or,", "6. If I thought of dying myself; or,", "7. If I heard that sudden death happened to others;", "8. But especially, when I thought of myself, that I must quickly come to judgment.", "CHR. And could you at any time, with ease, get off the guilt of sin, when by any of these ways it came upon you?", "HOPE. No, not I, for then they got faster hold of my conscience; and then, if I did but think of going back to sin, (though my mind was turned against it), it would be double torment to me.", "CHR. And how did you do then?"]}, {"sub_zh": "穿过着魔之地：彼此谈论归主经历提振灵性", "sub_en": "Entering the Enchanted Ground & Hopeful's Account of Conversion", "zh_paras": ["基督徒问：既然你已经改变了，怎么还会这样的呢？", "盼望说：有几件事情促成这个情况，尤其是下面这些格言：1“所有的义都像污秽的衣服”——2“凡有血气的，没有一人因行律法称义”——3“这样，你们作完了一切所吩咐的，只当说，我们是无用的仆人” ，以及许多此类的格言。我开始这样推论：如果我所有的义都像污秽的衣服；如果没有人能因行律法而称义；如果我们一切都做了，还是无用的仆人；那么想靠律法进天堂不过是一种愚行。我还这样想：假定一个人欠一家店铺一百镑，而在欠下了这笔债以后每次到店里买东西都得付现款；但是如果他的旧债没有付清，店主还是可以告他一状，把他送进监牢，非到他付清债款不能恢复自由。", "基督徒说：那么，你把这件事怎么应用在你自己身上呢？", "盼望说：我是这样想的：由于犯了种种的罪，我欠了神一大笔债，即使我现在改过，也不能勾清那笔债；因此虽然我现在一切错误都矫正了，我还这样想：我怎样才能摆脱由于过去犯罪而给自己带来的这个进地狱的危险呢？", "基督徒说：应用得非常好，请你讲下去。", "盼望说：自从我作了最近一次的悔过以后，另外一件使我烦恼的事是：假如我仔细察看我现在所做的最好的事情，我还看得见新的罪跟那事情混在一起；因此我不得不作出这样的结论：尽管我过去满以为自己很好，已经尽了种种责任，虽然我过去的生活毫无瑕疵，我一天中犯的罪就足够把我送下地狱。", "基督徒问：那么你怎么办呢？", "盼望说：怎么办！我没有把心事向忠信倾吐以前，真不知道怎么办呢；我跟他很熟识。他对我说，除非我能得到一个从来没犯过罪的人的义，我自己的和全世界的义都不能拯救我。", "基督徒问：你认为他说的是实话吗？", "盼望说：要是他在我很满意于我自己的改过的时候这样对我说，我就会送他一个“傻瓜”的称号来报答他这番好意；可是现在我既然看到自己的缺点和附在我最好行为上的罪，我不得不同意他的意见。", "基督徒问：当他初次向你建议的时候，你认为有没有这样一个可以正确地说是从未犯过罪的人呢？", "盼望说：我得承认，我开头觉得他这话很奇怪；不过，跟他相处一些时候，跟他多交谈一些话以后，我就完全有了信心。", "基督徒问：你有没有问他那个人是谁，以及怎样才能靠那人称义？", "盼望说：我问了他；他说是坐在至高者右边的主耶稣。因此，他说，你得靠祂称义，深信祂在世的时日所行的一切，以及祂被钉在木头上的时候所受的痛苦。我还问他，那个人的义怎么这样有力量，能够使另外一个人在神面前称义。他说，那个人就是大能的神，祂那样行事，那样受死，并不是为了祂自己，而是为了我，如果我相信祂的话，祂就成为我的替身，因而祂的所作所为都成为我的，祂那些作为所具有的价值也都归到我身上来。", "基督徒问：后来你怎样呢？", "盼望说：我讲了些不情愿相信的话，因为我认为他是不肯救我的。", "基督徒问：那么忠信对你怎么说？", "盼望说：他叫我试去找祂看看。我说那简直是太冒昧了。他说，不会的；因为祂还请我去呢。说着他给了我一本耶稣的著作，鼓励我更放胆找祂去；关于那本书，他这么说，书里面每一笔字，每一个标题都比天地还要坚定；于是我问他，我到了祂那儿的时候，应该做些什么。他说我得跪下切切恳求天父把祂启示给我。过后我又问他，我应该怎样向祂祈求。他说，去吧，你会发现他在施恩座上，祂终年坐在那儿，随时准备着饶恕、赦免所有来到他跟前的人。我对他说，我不知道到了那儿该说什么话。他教我这样说：求神对我这样一个罪人发慈悲，使我认识和相信耶稣基督；因为我知道，要是没有祂的义，或者我不相信祂的义，我就", "会完全毁啦。主啊，我听说檷是个慈悲的神，并且指定了檷的儿子耶稣基督做救世主；而且檷愿意把祂赐给我这样一个可怜的罪人（我的确是个罪人） ；主啊，因此求檷用这个机会，通过檷的儿子耶稣基督，在拯救我的灵魂中扩大檷的恩典。阿们。", "基督徒问：你有没有照他所说的做去？", "盼望说：有的，做了又做，不知做了多少次了。", "基督徒问：天父有没有把祂的儿子显示给你呢？", "盼望说：没有；第一次，第二次，第三次，第四次，第五次都没有，第六次也没有。", "盼望和忠信的谈话。", "基督徒问：那么你怎么办？", "盼望说：怎么办？我真不知道怎么办了。", "基督徒问：你有没有想不要再祈祷了？", "盼望说：有；想过不止一两百次哩。", "基督徒问：那么为什么你没有停止祈祷呢？", "盼望说：我相信忠信告诉我的是实在的事情，也就是说，如果没有基督的义，全世界都不能救我，因此我想，要是我停止祈祷，我就会死掉，而我只能死在恩典的宝座旁边。同时我又想：1“虽然迟延，还要等候；因为必然临到，不再迟延。”因此我继续祈祷，直到天父把他的儿子显示给我。", "基督徒问：他怎样向你显示的呢？", "盼望说：我并不是通过肉眼看见他，而是用心中的眼睛；事情的经过是这样的：有一天我非常苦恼——我想我平生从来没有那么苦恼过；我之所以那么痛苦是由于我重新又看到我的罪是多么严重，多么污秽不堪。我那时除了地狱和灵魂的永远定罪之外，别无期待，忽然间我想我看见主耶稣从天上望着"], "en_paras": ["HOPE. I thought I must endeavour to mend my life; for else, thought I, I am sure to be damned.", "CHR. And did you endeavour to mend?", "HOPE. Yes; and fled from not only my sins, but sinful company too; and betook me to religious duties, as prayer, reading, weeping for sin, speaking truth to my neighbours, &c. These things did I, with many others, too much here to relate.", "CHR. And did you think yourself well then?", "HOPE. Yes, for a while; but at the last, my trouble came tumbling upon me again, and that over the neck of all my reformations.", "CHR. How came that about, since you were now reformed?", "HOPE. There were several things brought it upon me, especially such sayings as these: \"All our righteousnesses are as filthy rags.\" [Isa. 64:6] \"By the works of the law shall no flesh be justified.\" [Gal. 2:16] \"When ye shall have done all those things, say, We are unprofitable\", [Luke 17:10] with many more such like. From whence I began to reason with myself thus: If ALL my righteousnesses are filthy rags; if, by the deeds of the law, NO man can be justified; and if, when we have done ALL, we are yet unprofitable, then it is but a folly to think of heaven by the law. I further thought thus: If a man runs a hundred pounds into the shopkeeper's debt, and after that shall pay for all that he shall fetch; yet, if this old debt stands still in the book uncrossed, for that the shopkeeper may sue him, and cast him into prison till he shall pay the debt.", "CHR. Well, and how did you apply this to yourself?", "HOPE. Why; I thought thus with myself. I have, by my sins, run a great way into God's book, and that my now reforming will not pay off that score; therefore I should think still, under all my present amendments, But how shall I be freed from that damnation that I have brought myself in danger of by my former transgressions?", "CHR. A very good application: but, pray, go on.", "HOPE. Another thing that hath troubled me, even since my late amendments, is, that if I look narrowly into the best of what I do now, I still see sin, new sin, mixing itself with the best of that I do; so that now I am forced to conclude, that notwithstanding my former fond conceits of myself and duties, I have committed sin enough in one duty to send me to hell, though my former life had been faultless.", "CHR. And what did you do then?", "HOPE. Do! I could not tell what to do, until I brake my mind to Faithful, for he and I were well acquainted. And he told me, that unless I could obtain the righteousness of a man that never had sinned, neither mine own, nor all the righteousness of the world could save me.", "CHR. And did you think he spake true?", "HOPE. Had he told me so when I was pleased and satisfied with mine own amendment, I had called him fool for his pains; but now, since I see mine own infirmity, and the sin that cleaves to my best performance, I have been forced to be of his opinion.", "CHR. But did you think, when at first he suggested it to you, that there was such a man to be found, of whom it might justly be said that he never committed sin?", "HOPE. I must confess the words at first sounded strangely, but after a little more talk and company with him, I had full conviction about it.", "CHR. And did you ask him what man this was, and how you must be justified by him?", "HOPE. Yes, and he told me it was the Lord Jesus, that dwelleth on the right hand of the Most High. And thus, said he, you must be justified by him, even by trusting to what he hath done by himself, in the days of his flesh, and suffered when he did hang on the tree. I asked him further, how that man's righteousness could be of that efficacy to justify another before God? And he told me he was the mighty God, and did what he did, and died the death also, not for himself, but for me; to whom his doings, and the worthiness of them, should be imputed, if I believed on him. [Heb. 10, Rom. 6, Col. 1, 1 Pet. 1]", "CHR. And what did you do then?", "HOPE. I made my objections against my believing, for that I thought he was not willing to save me.", "CHR. And what said Faithful to you then?", "HOPE. He bid me go to him and see. Then I said it was presumption; but he said, No, for I was invited to come. [Matt. 11:28] Then he gave me a book of Jesus, his inditing, to encourage me the more freely to come; and he said, concerning that book, that every jot and tittle thereof stood firmer than heaven and earth. [Matt. 24:35] Then I asked him, What I must do when I came; and he told me, I must entreat upon my knees, with all my heart and soul, the Father to reveal him to me. [Ps. 95:6, Dan. 6:10, Jer. 29:12,13] Then I asked him further, how I must make my supplication to him? And he said, Go, and thou shalt find him upon a mercy-seat, where he sits all the year long, to give pardon and forgiveness to them that come. I told him that I knew not what to say when I came. And he bid me say to this effect: God be merciful to me a sinner, and make me to know and believe in Jesus Christ; for I see, that if his righteousness had not been, or I have not faith in that righteousness, I am utterly cast away. Lord, I have heard that thou art a merciful God, and hast ordained that thy Son Jesus Christ should be the Saviour of the world; and moreover, that thou art willing to bestow him upon such a poor sinner as I am, (and I am a sinner indeed); Lord, take therefore this opportunity and magnify thy grace in the salvation of my soul, through thy Son Jesus Christ. Amen. [Exo. 25:22, Lev. 16:2, Num. 7:89, Heb. 4:16]", "CHR. And did you do as you were bidden?", "HOPE. Yes; over, and over, and over.", "CHR. And did the Father reveal his Son to you?", "HOPE. Not at the first, nor second, nor third, nor fourth, nor fifth; no, nor at the sixth time neither.", "CHR. What did you do then?", "HOPE. What! why I could not tell what to do.", "CHR. Had you not thoughts of leaving off praying?", "HOPE. Yes; an hundred times twice told.", "CHR. And what was the reason you did not?", "HOPE. I believed that that was true which had been told me, to wit, that without the righteousness of this Christ, all the world could not save me; and therefore, thought I with myself, if I leave off I die, and I can but die at the throne of grace. And withal, this came into my mind, \"Though it tarry, wait for it; because it will surely come, it will not tarry.\" [Heb. 2:3] So I continued praying until the Father showed me his Son.", "CHR. And how was he revealed unto you?", "HOPE. I did not see him with my bodily eyes, but with the eyes of my understanding; [Eph. 1:18,19] and thus it was: One day I was very sad, I think sadder than at any one time in my life, and this sadness was through a fresh sight of the greatness and vileness of my sins. And as I was then looking for nothing but hell, and the everlasting damnation of my soul, suddenly, as I thought, I saw the Lord Jesus Christ look down from heaven upon me, and saying, \"Believe on the Lord Jesus Christ, and thou shalt be saved.\" [Acts 16:30,31]", "But I replied, Lord, I am a great, a very great sinner. And he answered, \"My grace is sufficient for thee.\" [2 Cor.12:9] Then I said, But, Lord, what is believing? And then I saw from that saying, \"He that cometh to me shall never hunger, and he that believeth on me shall never thirst\", that believing and coming was all one; and that he that came, that is, ran out in his heart and affections after salvation by Christ, he indeed believed in Christ. [John 6:35] Then the water stood in mine eyes, and I asked further. But, Lord, may such a great sinner as I am be indeed accepted of thee, and be saved by thee? And I heard him say, \"And him that cometh to me, I will in no wise cast out.\" [John 6:37] Then I said, But how, Lord, must I consider of thee in my coming to thee, that my faith may be placed aright upon thee? Then he said, \"Christ Jesus came into the world to save sinners.\" [1 Tim. 1:15] \"He is the end of the law for righteousness to every one that believeth.\" [Rom. 10:4] \"He died for our sins, and rose again for our justification.\" [Rom. 4:25] \"He loved us, and washed us from our sins in his own blood.\" [Rev. 1:5] \"He is mediator betwixt God and us.\" [1 Tim. 2:5] \"He ever liveth to make intercession for us.\" [Heb. 7:24,25] From all which I gathered, that I must look for righteousness in his person, and for satisfaction for my sins by his blood; that what he did in obedience to his Father's law, and in submitting to the penalty thereof, was not for himself, but for him that will accept it for his salvation, and be thankful. And now was my heart full of joy, mine eyes full of tears, and mine affections running over with love to the name, people, and ways of Jesus Christ.", "CHR. This was a revelation of Christ to your soul indeed; but tell me particularly what effect this had upon your spirit.", "HOPE. It made me see that all the world, notwithstanding all the righteousness thereof, is in a state of condemnation. It made me see that God the Father, though he be just, can justly justify the coming sinner. It made me greatly ashamed of the vileness of my former life, and confounded me with the sense of mine own ignorance; for there never came thought into my heart before now that showed me so the beauty of Jesus Christ. It made me love a holy life, and long to do something for the honour and glory of th
