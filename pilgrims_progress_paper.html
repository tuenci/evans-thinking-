 like, began thus to enter into some talk with Christian.", "WORLD. How now, good fellow, whither away after this burdened manner?", "CHR. A burdened manner, indeed, as ever, I think, poor creature had! And whereas you ask me, Whither away? I tell you, Sir, I am going to yonder wicket-gate before me; for there, as I am informed, I shall be put into a way to be rid of my heavy burden.", "WORLD. Hast thou a wife and children?", "CHR. Yes; but I am so laden with this burden that I cannot take that pleasure in them as formerly; methinks I am as if I had none. [1 Cor 7:29]", "WORLD. Wilt thou hearken unto me if I give thee counsel?", "CHR. If it be good, I will; for I stand in need of good counsel.", "WORLD. I would advise thee, then, that thou with all speed get thyself rid of thy burden; for thou wilt never be settled in thy mind till then; nor canst thou enjoy the benefits of the blessing which God hath bestowed upon thee till then.", "CHR. That is that which I seek for, even to be rid of this heavy burden; but get it off myself, I cannot; nor is there any man in our country that can take it off my shoulders; therefore am I going this way, as I told you, that I may be rid of my burden."]}, {"sub_zh": "老世故诱劝离弃十架窄路", "sub_en": "Worldly Wiseman's Crafty Counsel to Forsake the Wicket Gate", "zh_paras": ["老世故说：那么我劝你尽快解除你的重负；因为它若没有解除，你心里就永远不会平安，你也就不能享到神赐给你的福份。", "基督徒说：这正是我的目的，我就是要解除这重负；但是我自己无法摆脱它；再说，我的家乡也没有一个人能把它从我的肩上拿下来；所以我才走这条路。我不是刚刚告诉过你了吗，这正是为了要解除我的重负呀。", "老世故说：谁告诉过你，走这条路就可以把它解除呢？", "基督徒说：是一个看上去非常高尚而可敬的人；他的名字，我记得，是宣道师。", "老世故说：他真该死，给你这种劝告！世界上没有一条比他指点给你的更难走、更危险的路了；你如果听他的话，以后一定会发现我这话说得没错。我看得出，你在路上遇到了什么啦；因为我看见你身上有灰心沼的泥污；不过那只是走上这条路的人不可避免的苦难的开端。我年纪比你大，你听着：在你走的这条路上，你还会碰到疲乏、痛苦、饥饿、艰险、无衣无食、刀剑、黑暗、狮子、毒龙，总而言之，死亡，以及其他的一切。这些事情完全是真实的，因为许多人都曾证实过。为什么去听一个陌生人的胡扯而随便把自己毁了？", "基督徒说：哎呀，先生，我背上的重负比你所说的那些东西更可怕；不但如此，我还觉得在路上无论碰到什么我都不在乎，只要能解除我的重负就是。", "老世故说：最初你怎样发觉这重负的？"], "en_paras": ["WORLD. Who bid thee go this way to be rid of thy burden?", "CHR. A man that appeared to me to be a very great and honourable person; his name, as I remember, is Evangelist.", "WORLD. I beshrew him for his counsel! there is not a more dangerous and troublesome way in the world than is that unto which he hath directed thee; and that thou shalt find, if thou wilt be ruled by his counsel. Thou hast met with something, as I perceive, already; for I see the dirt of the Slough of Despond is upon thee; but that slough is the beginning of the sorrows that do attend those that go on in that way. Hear me, I am older than thou; thou art like to meet with, in the way which thou goest, wearisomeness, painfulness, hunger, perils, nakedness, sword, lions, dragons, darkness, and, in a word, death, and what not! These things are certainly true, having been confirmed by many testimonies. And why should a man so carelessly cast away himself, by giving heed to a stranger?", "CHR. Why, Sir, this burden upon my back is more terrible to me than all these things which you have mentioned; nay, methinks I care not what I meet with in the way, if so be I can also meet with deliverance from my burden.", "WORLD. How camest thou by the burden at first?", "CHR. By reading this book in my hand.", "WORLD. I thought so; and it is happened unto thee as to other weak men, who, meddling with things too high for them, do suddenly fall into thy distractions; which distractions do not only unman men, as thine, I perceive, have done thee, but they run them upon desperate ventures to obtain they know not what.", "CHR. I know what I would obtain; it is ease for my heavy burden.", "WORLD. But why wilt thou seek for ease this way, seeing so many dangers attend it? especially since, hadst thou but patience to hear me, I could direct thee to the obtaining of what thou desirest, without the dangers that thou in this way wilt run thyself into; yea, and the remedy is at hand. Besides, I will add, that instead of those dangers, thou shalt meet with much safety, friendship, and content."]}, {"sub_zh": "转向西奈山险峰与烈火惊惧", "sub_en": "Turning Aside to Mount Sinai & The Terrors of the Law", "zh_paras": ["基督徒说：看了我手里的这本书以后才发觉的。老世故先生", "老世故说：我早就猜着了；因为有好多软弱的人都是如此，他们也爱探讨这种太高深的问题，结果都弄得神经错乱；这种迷乱不但叫人失魂落魄，就像我在你身上所看到的情形一样，并且还会使人不顾一切地冒险追求他们自己也莫名其妙的东西。", "基督徒说：我知道我会得到什么；我的重负会得到解除。", "老世故说：可是既然明知道这样做有许多危险，为什么还要用这种方式去获得解除呢？尤其是，只要你耐心听我讲，我就能够指点你达到目的，同时还不至遇到走这条路的许多危险；而且办法就近在咫尺。我还要加一句，不但没有危险，你还会得到安全、友谊和满足。", "基督徒说：先生，请告诉我这个秘密。", "老世故说：唔，就在那边有个乡村 ——叫做道学村，那儿住着一个叫做合法的绅士，他是个非常公正而负有声誉的人，他能帮助人从肩上卸除像你这种负担；而且，据我所知，他已经做了不少这种好事；同时还能医治人们由于重负所引起的神经病。就像我对你说的，你可以去找他，马上会得到他的帮助。他的家离这儿不到一英里路，要是他不在家，他有个年青漂亮的儿子叫做学礼，说起来，他的本领也不下于那老头儿；我说，你的重负在那儿可以获得解除；如果你不想回到原来的住处（我的确也不希望你回去） ，你可以把妻子和儿女搬到这个村子里来住，这儿有好多空房子，你花不了多少钱就可以租到一幢；这儿吃的东西又便宜又好；", "无疑的，你的生活会更幸福，因为你会跟一些名誉既好、气派又大的体面人做邻居。", "基督徒这时候真是进退两难；不过，他不一会就作出了结论，他想，要是这位绅士说的是真话，我就该听他的劝告；于是他抱着这样的想法和他继续谈下去。"], "en_paras": ["CHR. Pray, Sir, open this secret to me.", "WORLD. Why, in yonder village--the village is named Morality-- there dwells a gentleman whose name is Legality, a very judicious man, and a man of very good name, that has skill to help men off with such burdens as thine are from their shoulders: yea, to my knowledge, he hath done a great deal of good this way; ay, and besides, he hath skill to cure those that are somewhat crazed in their wits with their burdens. To him, as I said, thou mayest go, and be helped presently. His house is not quite a mile from this place, and if he should not be at home himself, he hath a pretty young man to his son, whose name is Civility, that can do it (to speak on) as well as the old gentleman himself; there, I say, thou mayest be eased of thy burden; and if thou art not minded to go back to thy former habitation, as, indeed, I would not wish thee, thou mayest send for thy wife and children to thee to this village, where there are houses now stand empty, one of which thou mayest have at reasonable rates; provision is there also cheap and good; and that which will make thy life the more happy is, to be sure, there thou shalt live by honest neighbours, in credit and good fashion.", "Now was Christian somewhat at a stand; but presently he concluded, if this be true, which this gentleman hath said, my wisest course is to take his advice; and with that he thus further spoke.", "CHR. Sir, which is my way to this honest man's house?", "WORLD. Do you see yonder hill?", "CHR. Yes, very well.", "WORLD. By that hill you must go, and the first house you come at is his.", "So Christian turned out of his way to go to Mr. Legality's house for help; but, behold, when he was got now hard by the hill, it seemed so high, and also that side of it that was next the wayside did hang so much over, that Christian was afraid to venture further, lest the hill should fall on his head; wherefore there he stood still and wotted not what to do. Also his burden now seemed heavier to him than while he was in his way. There came also flashes of fire out of the hill, that made Christian afraid that he should be burned. [Ex. 19:16, 18] Here, therefore, he sweat and did quake for fear. [Heb. 12:21]", "When Christians unto carnal men give ear, Out of their way they go, and pay for 't dear; For Master Worldly Wiseman can but shew A saint the way to bondage and to woe."]}, {"sub_zh": "宣道师严厉斥责与指出大罪恶", "sub_en": "Evangelist Reappears and Convinces Christian of His Great Error", "zh_paras": ["基督徒说：先生，从哪条路可以到达那个体面人的家？", "老世故说；你看见那边有座小山吗？", "基督徒说：看得很清楚。", "老世故说：你走过小山，看见第一幢房子就是他的家。", "基督徒就这样离开了他原来所走的路，转向合法先生的家去求助了；但是，哎呀，他一走到那座小山的跟前，小山看上去却显得那么高，而且靠近路旁的一边是那么陡削，以致他不敢再往前冒险，生怕小山会崩坍下来，压在他的头上；因此他忽地站住，不知所措了。同时他的负担好像也比先前在路上时更重了。小山还发出一闪一闪的火光，", "基督徒害怕身上会着火，直吓得冒出一身冷汗来，而且不住地发抖。现在他开始懊悔听了老世故先生的话。他正懊恼万状时，看见宣道师向他走来；一看到他，基督徒不禁羞惭得面红耳赤。宣道师越走越近；后来走到他跟前，用严厉而可畏的神情盯着他，开始对他说话。宣道师问：你在这儿干吗，基督徒？基督徒不知道该怎么回答才好；只是哑口无言地站在他面前。随后宣道师又问，你是不是我所遇见的在毁灭城墙外哭喊着的那个人？", "基督徒说：我正是，亲爱的先生。宣道师说：我不是指点过你往那小门去的路吗？"], "en_paras": ["And now he began to be sorry that he had taken Mr. Worldly Wiseman's counsel. And with that he saw Evangelist coming to meet him; at the sight also of whom he began to blush for shame. So Evangelist drew nearer and nearer; and coming up to him, he looked upon him with a severe and dreadful countenance, and thus began to reason with Christian.", "EVAN. What dost thou here, Christian? said he: at which words Christian knew not what to answer; wherefore at present he stood speechless before him. Then said Evangelist further, Art not thou the man that I found crying without the walls of the City of Destruction?", "CHR. Yes, dear Sir, I am the man.", "EVAN. Did not I direct thee the way to the little wicket-gate?", "CHR. Yes, dear Sir, said Christian.", "EVAN. How is it, then, that thou art so quickly turned aside? for thou art now out of the way.", "CHR. I met with a gentleman so soon as I had got over the Slough of Despond, who persuaded me that I might, in the village before me, find a man that would take off my burden.", "EVAN. What was he?", "CHR. He looked like a gentleman, and talked much to me, and got me at last to yield; so I came hither; but when I beheld this hill, and how it hangs over the way, I suddenly made a stand lest it should fall on my head."]}, {"sub_zh": "剖析老世故的三重险恶错谬", "sub_en": "The Threefold Deceit of Worldly Wiseman Laid Bare", "zh_paras": ["基督徒说：是的，亲爱的先生。宣道师说：那你怎么这样快就掉了方向？因为你现在已经不在那条路上了。", "基督徒说：我一越过灰心沼就遇见一位绅士，他劝告我说，在前面的那个乡村里可以找到一个能够解除我的负担的人。宣道师说：他是什么人？", "基督徒说：他很像一位绅士，对我讲了许多话，最后我被说服了；因此我就到这儿来了；可是当我看到这座突兀的小山矗立在这路上，我蓦地停住脚，生怕它会崩坍，压到我的头上来。宣道师说：那位绅士对你说了些什么？", "基督徒说：唔，他问我往哪儿去，我就告诉了他。宣道师说：那么他怎么说？", "基督徒说：他问我有没有家眷。我也告诉了他。不过我说我给背上的负担压得好苦，不再像从前那样能够享受到骨肉的乐趣了。宣道师说：以后他怎么说？", "基督徒说：他叫我赶快摆脱我的负担；我告诉他说，我巴不得图个一身轻快。所以我说，我要到那个小门那儿去，到了那里就可以获得进一步的指示，知道如何才能到达得救的地方。他就说他能指点我一条更好的路，又近、又不会有像你，先生，叫我走的那条路上的那些艰险；他说这条路会引我到一个绅士的家，那个绅士有本领解除我的重担；我信了他的话，便从你指点的那条路上转到这条路上来，满心希望能早日摆脱我的重负。可是我到了这地方，看到这里的情形，我为了怕有危险（就像我刚刚说过的那样） ，就停住了；但是我不知道该怎么办。", "于是宣道师说，再停留一会儿，我要把《圣经》讲给你听。因此他就站着发抖。然后宣道师说， “你们总要谨慎，不可弃绝那向你们说话的。因为那些弃绝在地上警戒他们的，尚且不能逃罪，何况我们违背那从天上警戒我们的呢。”他还说， “只是义人必因信得生；他若退后，我心里就不喜欢他。”他还引用了这两句话这么说：你就是投入这种大不幸的人；你已经开始弃绝至高者的劝告，从平安的路上缩回你的脚，甚至几乎冒着沉沦的危险。"], "en_paras": ["EVAN. What said that gentleman to you?", "CHR. Why, he asked me whither I was going, and I told him.", "EVAN. And what said he then?", "CHR. He asked me if I had a family? And I told him. But, said I, I am so loaden with the burden that is on my back, that I cannot take pleasure in them as formerly.", "EVAN. And what said he then?", "CHR. He bid me with speed get rid of my burden; and I told him that it was ease that I sought. And said I, I am therefore going to yonder gate, to receive further direction how I may get to the place of deliverance. So he said that he would shew me a better way, and short, not so attended with difficulties as the way, Sir, that you set me in; which way, said he, will direct you to a gentleman's house that hath skill to take off these burdens, so I believed him, and turned out of that way into this, if haply I might be soon eased of my burden. But when I came to this place, and beheld things as they are, I stopped for fear (as I said) of danger: but I now know not what to do.", "EVAN. Then, said Evangelist, stand still a little, that I may show thee the words of God. So he stood trembling. Then said Evangelist, \"See that ye refuse not him that speaketh. For if they escaped not who refused him that spake on earth, much more shall not we escape, if we turn away from him that speaketh from heaven.\" [Heb. 12:25] He said, moreover, \"Now the just shall live by faith: but if any man draw back, my soul shall have no pleasure in him.\" [Heb. 10:38] He also did thus apply them: Thou art the man that art running into this misery; thou hast begun to reject the counsel of the Most High, and to draw back thy foot from the way of peace, even almost to the hazarding of thy perdition.", "Then Christian fell down at his feet as dead, crying, \"Woe is me, for I am undone!\" At the sight of which Evangelist caught him by the right hand, saying, \"All manner of sin and blasphemies shall be forgiven unto men.\" [Matt. 12:31, Mark 3:28] \"Be not faithless, but believing.\" [John 20:27] Then did Christian again a little revive, and stood up trembling, as at first, before Evangelist.", "Then Evangelist proceeded, saying, Give more earnest heed to the things that I shall tell thee of. I will now show thee who it was that deluded thee, and who it was also to whom he sent thee. --The man that met thee is one Worldly Wiseman, and rightly is he so called; partly, because he savoureth only the doctrine of this world, [1 John 4:5] (therefore he always goes to the town of Morality to church): and partly because he loveth that doctrine best, for it saveth him best from the cross. [Gal 6:12] And because he is of this carnal temper, therefore he seeketh to pervert my ways, though right. Now there are three things in this man's counsel, that thou must utterly abhor."]}, {"sub_zh": "基督徒深切悔罪与领受赦罪恩言", "sub_en": "Christian's Deep Repentance and Encouragement to Return", "zh_paras": ["这时候基督徒跟死人一样扑倒在那个人脚前喊道， “我真该死，我完蛋了！”宣道师看见这种情形，一把拉住他的右手说，3“人所有的罪过和亵渎都会得到赦免。不要没有信心，只要相信。”基督徒这才稍稍振作起精神，颤抖着站起来，就像原先那样，站在宣道师的面前。", "于是宣道师继续说，注意听着我将要讲给你听的事情。我现在告诉你，欺骗你的是谁，他叫你去找的那个人是谁。你碰到的是老世故，这个名字和他这个人配得正合适；因为一则他只喜欢世俗的学说 ——所以他总是到道学村去做礼拜；二则他最喜欢那种学说，因为那是他可以逃避十字架的最好办法；由于他具有这种世俗的气质，他才要曲解我的正确的路线。这个人的话里有三点你得绝对深恶痛绝。1. 他使你离开正路。2. 他千方百计使你觉得十字架讨厌。3. 他引你走上那通向死亡领域的道路。第一，你必须痛恨他叫你离开正路；不只这样，你还得痛悔你自己同意了他；因为这样做就是为了听", "从一个老世故的劝告而拒绝神的宝训。神说，1“要努力进窄门， ”就是我指点你去的那扇门；“因为引到永生那门是窄的，找着的人也少。”这个邪恶的人使你离开这小门，离开通往这门的路，几乎把你引到灭亡；因此要痛恨他叫你离开正路，也痛恨你自己，因为你听了他的话。第二，你得痛恨他想出种种方法使你讨厌十字架；因为你应当3“看它比埃及的财物还宝贵。”并且荣耀的王已经告诉你，4“得着生命的，将要失丧生命。”还有，5“人到我这里来，若不爱我胜过爱自己的父母、妻子、儿女、弟兄、姊妹和自己的性命，就不能作我的门徒。”因此我说，要是有人拚命劝诱你，说十字架会带来死亡，你得痛恨这个", "说法，因为根据真理，不经过死亡，你就不会得到永生。第三，你得痛恨他引你到那条通向死亡领域的道路。关于这一点，你得考虑他叫你去找的是谁，同时也得想到那个人是多么无能，他哪有力量解除你的负担。", "基督徒说：先生，你的看法怎么样？我还有希望吗？我现在还可以往回走，再到小门那儿去吗？为了这件事，我不会被弃绝，从那儿带着羞耻给打发回头吗？我真懊悔听了这个人的话。请问我的罪过能得到赦免吗？", "于是宣道师对他说，你的罪很重，就因为你有罪，所以你做了两件坏事：你舍弃那条好路而走上被禁止走的路；不过在小门那边的人还是会接待你的，因为他对所有的人都怀着善意；只是，他说，你要小心不要再离开那条路，1“恐怕他发怒，你们便在道中灭亡。”于是基督徒准备走回去；宣道师吻了他以后，又对他笑了一笑，祝他成功。他急速地走着，一路上跟任何人都不讲话，即使有人问他什么，他也不回答。在他还没有回到由于听从了老世故先生的劝说而离去的那条路上之前，他就好像一个一直在禁地上走路的人一样，认为自己一点也不安全。这样走着，他后来到达了那扇小", "门。小门上面写着，2“叩门的，就给他开门。”因此他不止一次地敲着，嘴里说——我现在可以进去吗？虽然我曾经是个叛徒，那里面的人是否会开门让我羞愧？那么我要在至高处永远把他赞美。", "基督徒到达了那扇门。"], "en_paras": ["1. His turning thee out of the way. 2. His labouring to render the cross odious to thee. And, 3. His setting thy feet in that way that leadeth unto the administration of death.", "First, Thou must abhor his turning thee out of the way; and thine own consenting thereunto: because this is to reject the counsel of God for the sake of the counsel of a Worldly Wiseman. The Lord says, \"Strive to enter in at the strait gate\" [Luke 13:24], the gate to which I sent thee; for \"strait is the gate that leadeth unto life, and few there be that find it.\" [Matt. 7:14] From this little wicket-gate, and from the way thereto, hath this wicked man turned thee, to the bringing of thee almost to destruction; hate, therefore, his turning thee out of the way, and abhor thyself for hearkening to him.", "Secondly, Thou must abhor his labouring to render the cross odious unto thee; for thou art to prefer it \"before the treasures in Egypt.\" [Heb. 11:25,26] Besides the King of glory hath told thee, that he that \"will save his life shall lose it.\" [Mark 8:35; John 12:25; Matt. 10:39] And, \"He that cometh after me, and hateth not his father, and mother, and wife, and children, and brethren, and sisters, yea, and his own life also, he cannot be my disciple.\" [Luke 14:26] I say, therefore, for man to labour to persuade thee, that that shall be thy death, without which, THE TRUTH hath said, thou canst not have eternal life; this doctrine thou must abhor.", "Thirdly, Thou must hate his setting of thy feet in the way that leadeth to the ministration of death. And for this thou must consider to whom he sent thee, and also how unable that person was to deliver thee from thy burden.", "He to whom thou wast sent for ease, being by name Legality, is the son of the bond-woman which now is, and is in bondage with her children [Gal 4:21-27]; and is, in a mystery, this Mount Sinai, which thou hast feared will fall on thy head. Now, if she, with her children, are in bondage, how canst thou expect by them to be made free? This Legality, therefore, is not able to set thee free from thy burden. No man was as yet ever rid of his burden by him; no, nor ever is like to be: ye cannot be justified by the works of the law; for by the deeds of the law no man living can be rid of his burden: therefore, Mr. Worldly Wiseman is an alien, and Mr. Legality is a cheat; and for his son Civility, notwithstanding his simpering looks, he is but a hypocrite and cannot help thee. Believe me, there is nothing in all this noise, that thou hast heard of these sottish men, but a design to beguile thee of thy salvation, by turning thee from the way in which I had set thee. After this, Evangelist called aloud to the heavens for confirmation of what he had said: and with that there came words and fire out of the mountain under which poor Christian stood, that made the hair of his flesh stand up. The words were thus pronounced: 'As many as are of the works of the law are under the curse; for it is written, Cursed is every one that continueth not in all things which are written in the book of the law to do them.' [Gal. 3:10]", "Now Christian looked for nothing but death, and began to cry out lamentably; even cursing the time in which he met with Mr. Worldly Wiseman; still calling himself a thousand fools for hearkening to his counsel; he also was greatly ashamed to think that this gentleman's arguments, flowing only from the flesh, should have the prevalency with him as to cause him to forsake the right way. This done, he applied himself again to Evangelist in words and sense as follow:", "CHR. Sir, what think you? Is there hope? May I now go back and go up to the wicket-gate? Shall I not be abandoned for this, and sent back from thence ashamed? I am sorry I have hearkened to this man's counsel. But may my sin be forgiven?", "EVAN. Then said Evangelist to him, Thy sin is very great, for by it thou hast committed two evils: thou hast forsaken the way that is good, to tread in forbidden paths; yet will the man at the gate receive thee, for he has goodwill for men; only, said he, take heed that thou turn not aside again, 'lest thou perish from the way, when his wrath is kindled but a little.' [Ps. 2:12] Then did Christian address himself to go back; and Evangelist, after he had kissed him, gave him one smile, and bid him God-speed. So he went on with haste, neither spake he to any man by the way; nor, if any asked him, would he vouchsafe them an answer. He went like one that was all the while treading on forbidden ground, and could by no means think himself safe, till again he was got into the way which he left, to follow Mr. Worldly Wiseman's counsel. So, in process of time, Christian got up to the gate. Now, over the gate there was written, 'Knock, and it shall be opened unto you.' [Matt 7:8]", "\"He that will enter in must first without Stand knocking at the Gate, nor need he doubt That is A KNOCKER but to enter in; For God can love him, and forgive his sin.\""]}]}, {"num": 6, "id": "chapter-4", "badge_label": "CHAPTER 6", "title_zh": "第四章 窄门", "title_en": "Chapter 4: The Wicket Gate", "desc": "抵达窄门与叩门之声；好心开门搭救脱离仇敌毒箭；窄路与宽路的永恒分界。", "blocks": [{"sub_zh": "抵达窄门与叩门之声", "sub_en": "Arrival at the Wicket Gate & Knocking with Earnest Prayer", "zh_paras": ["最后，一个名叫好心、态度严肃的人来到门旁，问门外是谁？他从哪儿来？要什么？", "基督徒说：我是个可怜的负罪的人。我从毁灭城来，要到锡安山去，为了要逃避将来的忿怒。先生，因为我知道到那儿去得经过这扇门，所以我要知道你肯不肯让我进去？", "好心说：我完全愿意让你进来；说着他就开了门。", "基督徒的脚刚踏进门坎，那个人一把把他拉了进去。基督徒就问，这是什么意思？那个人说，离开这门不远，有一座堡垒由魔王掌管着；在那儿，他和他手下的人对所有到这门前来的人放冷箭，企图不等他们进门就把他们射死。", "于是基督徒说，我真是万幸，不过想起来还要发抖。他走进去以后，开门的那个人问他，是谁指点他来的。", "基督徒说：宣道师教我到这儿来敲门，我就真的照办了；他还说，你，先生，会告诉我该怎么办。", "好心说：门是向你开着的，谁也不能把它关起来。", "基督徒说：现在我开始获得我冒险的好处了。", "好心说：可是你怎么独个儿来呢？"], "en_paras": ["knocked, therefore, more than once or twice, saying--", "\"May I now enter here? Will he within Open to sorry me, though I have been An undeserving rebel? Then shall I Not fail to sing his lasting praise on high.\"", "At last there came a grave person to the gate, named Good-will, who asked who was there? and whence he came? and what he would have?", "CHR. Here is a poor burdened sinner. I come from the City of Destruction, but am going to Mount Zion, that I may be delivered from the wrath to come. I would therefore, Sir, since I am informed that by this gate is the way thither, know if you are willing to let me in?", "GOOD-WILL. I am willing with all my heart, said he; and with that he opened the gate.", "So when Christian was stepping in, the other gave him a pull. Then said Christian, What means that? The other told him. A little distance from this gate, there is erected a strong castle, of which Beelzebub is the captain; from thence, both he and them that are with him shoot arrows at those that come up to this gate, if haply they may die before they can enter in.", "Then said Christian, I rejoice and tremble. So when he was got in, the man of the gate asked him who directed him thither?", "CHR. Evangelist bid me come hither, and knock, (as I did); and he said that you, Sir, would tell me what I must do.", "GOOD-WILL. An open door is set before thee, and no man can shut it."]}, {"sub_zh": "好心开门搭救脱离仇敌毒箭", "sub_en": "Good-will Welcomes Christian Inside from the Arrows of Beelzebub", "zh_paras": ["基督徒说：因为我的邻居里面没有一个人像我那样看出了自己所处的险境。", "好心说：他们有人知道你来吗？", "基督徒说：有，我的妻子和儿女首先看见我，叫我回去；还有些邻居也站在那里喊我回去；可是我用手指头塞住耳朵，就这样子来啦。", "好心说：难道没有人跟着你，要劝你回去吗？", "基督徒说：有，顽固和柔顺都追上了我；不过他们眼见怎么样也不能说服我，顽固就先走了回去，一面还奚落着我，柔顺却跟我走了一小段路。", "好心又问道：那么那一个又为什么也没有跟你到底呢？", "基督徒说：我们本来是一块儿走的，后来走到灰心沼，两个人都忽然跌了进去。然后我的邻居柔顺就失去勇气，不愿再往前去了。因此他从靠近他家的一边爬出泥沼，对我说我可以单独占有那个好地方，他可不干啦；他就这样走掉，而我就来了——他步了顽固的后尘，我就找上这扇门来啦。", "好心接着说：哎呀，可怜的人！难道他这样轻看天国的荣耀，而认为不值得冒一些艰险去得到它吗？", "基督徒说：的确，我把柔顺的事都实实在在地对你说了，如果我也完全老老实实地把我自己的事说出来，显然我不比他好多少。不错，他回家去了；然而我听了老世故先生一番世俗的话，也掉头往死亡的道路走去。"], "en_paras": ["CHR. Now I begin to reap the benefits of my hazards.", "GOOD-WILL. But how is it that you came alone?", "CHR. Because none of my neighbours saw their danger, as I saw mine.", "GOOD-WILL. Did any of them know of your coming?", "CHR. Yes; my wife and children saw me at the first, and called after me to turn again; also, some of my neighbours stood crying and calling after me to return; but I put my fingers in my ears, and so came on my way.", "GOOD-WILL. But did none of them follow you, to persuade you to go back?", "CHR. Yes, both Obstinate and Pliable; but when they saw that they could not prevail, Obstinate went railing back, but Pliable came with me a little way.", "GOOD-WILL. But why did he not come through?", "CHR. We, indeed, came both together, until we came at the Slough of Despond, into the which we also suddenly fell. And then was my neighbour, Pliable, discouraged, and would not venture further. Wherefore, getting out again on that side next to his own house, he told me I should possess the brave country alone for him; so he went his way, and I came mine--he after Obstinate, and I to this gate.", "GOOD-WILL. Then said Good-will, Alas, poor man! is the celestial glory of so small esteem with him, that he counteth it not worth running the hazards of a few difficulties to obtain it?"]}, {"sub_zh": "窄路与宽路的永恒分界", "sub_en": "The Distinction Between the Narrow Way and the Broad Paths", "zh_paras": ["好心说：唔！原来他碰到你啦？啊！他会叫你到合法先生那儿去找安逸的！他们俩都是大骗子。你可听了他的话没有？", "基督徒说：听是听啦，还不敢完全听；我去找合法先生，我发现在他家附近有一座山，我怕那山会压到我头上来；因此我不得不停止。", "好心说：那座山叫许多人丧命，以后还会叫更多人丧命，幸亏你没有让它把你压得稀烂。", "基督徒说：我正苦闷地思索的时候，要不是幸亏宣道师又碰见我，咳，我真不知道会有怎样的下场呢；那真是神的慈悲，我又碰到了他，不然的话，我就不会走到这儿来了。可是我现在终于来了，其实像我这样一个人，只配死在那座山下，而不配这样站在我的主人面前讲话的；但是，哦，我竟然还能进到这儿来，这对我是多大的恩宠呀！", "好心说：不管到这儿来的人过去的行为怎样，我们对哪一个都不见却。他们1“到我这里来的，我总不丢弃他；”好基督徒，来，跟我走一小段路，我要告诉你关于你必须走的路。看前面；你看到这条狭窄的路吗？这就是你得走的路；这是我们的祖先们，先知们，基督和他的使徒们砌的路；这是像用尺划的那么直的一条路。这是你得走的路。", "基督徒说：难道没有任何弯道曲径，会使得陌生人迷途吗？", "好心说：有，有许多条路都通到这条路上，它们又弯又阔。不过你就可以凭这个来辨别正路和邪路，只有正的一条又窄又直。", "这时我在梦中看见基督徒又问他能不能把他背上的重负去掉；因为他还没有解脱掉，并且不靠别人的帮助是绝对无法卸除的。", "好心对他说，至于你的负担，在没有到达得救的地方以前，还是安心扛着它吧；因为到了那个地方它自然而然会从你背上落下来的。"], "en_paras": ["CHR. Truly, said Christian, I have said the truth of Pliable, and if I should also say all the truth of myself, it will appear there is no betterment betwixt him and myself. It is true, he went back to his own house, but I also turned aside to go in the way of death, being persuaded thereto by the carnal arguments of one Mr. Worldly Wiseman.", "GOOD-WILL. Oh, did he light upon you? What! he would have had you a sought for ease at the hands of Mr. Legality. They are, both of them, a very cheat. But did you take his counsel?", "CHR. Yes, as far as I durst; I went to find out Mr. Legality, until I thought that the mountain that stands by his house would have fallen upon my head; wherefore there I was forced to stop.", "GOOD-WILL. That mountain has been the death of many, and will be the death of many more; it is well you escaped being by it dashed in pieces.", "CHR. Why, truly, I do not know what had become of me there, had not Evangelist happily met me again, as I was musing in the midst of my dumps; but it was God's mercy that he came to me again, for else I had never come hither. But now I am come, such a one as I am, more fit, indeed, for death, by that mountain, than thus to stand talking with my lord; but, oh, what a favour is this to me, that yet I am admitted entrance here!", "GOOD-WILL. We make no objections against any, notwithstanding all that they have done before they came hither. They are in no wise cast out [John vi.37]; and therefore, good Christian, come a little way with me, and I will teach thee about the way thou must go. Look before thee; dost thou see this narrow way? THAT is the way thou must go; it was cast up by the patriarchs, prophets, Christ, and his apostles; and it is as straight as a rule can make it. This is the way thou must go.", "CHR. But, said Christian, are there no turnings or windings by which a stranger may lose his way?", "GOOD-WILL. Yes, there are many ways butt down upon this, and they are crooked and wide. But thus thou mayest distinguish the right from the wrong, the right only being straight and narrow. [Matt 7:14]", "Then I saw in my dream that Christian asked him further if he could not help him off with his burden that was upon his back; for as yet he had not got rid thereof, nor could he by any means get it off without help.", "He told him, As to thy burden, be content to bear it, until thou comest to the place of deliverance; for there it will fall from thy back of itself."]}]}, {"num": 7, "id": "chapter-5", "badge_label": "CHAPTER 7", "title_zh": "第五章 解释者的住所", "title_en": "Chapter 5: The Interpreter's House", "desc": "抵达住所与严肃之人的画像；满是尘土的客厅与福音洒水打扫；情欲与耐心的两个孩子。", "blocks": [{"sub_zh": "抵达住所与严肃之人的画像", "sub_en": "Arrival at the Interpreter's House & The Picture of the Grave Person", "zh_paras": ["接着基督徒开始束紧腰带，准备上路了。于是那个人就告诉他，他离开这扇门走一段路以后会走到解释者的门前，他得在那儿敲门，那个人会给他看许多好东西。于是基督徒和他的朋友告别，他的朋友又一次祝他成功。", "于是他继续往前走，后来走到解释者的住所，他接连敲几下门；随即一个人走出来，问他是谁。", "基督徒说：先生，我是一个旅客，这房子的主人的一个相识叫我来拜访他，以便从他得到教益；因此我要跟房主人谈谈。于是那个人就喊房主人，主人不一会儿出来了，问基督徒要什么。", "基督徒说：先生，我是从毁灭城来的，正上锡安山去；站在路头上一扇小门旁的那个人告诉我说，要是来拜访你，你会给我看许多无比美好的东西，而这些东西在旅途中对我会有帮助。", "于是解释者说，进来，我会给你看对你有益的东西。说着他就吩咐他的仆人点上蜡烛，叫基督徒跟他走；然后他领他走进一间密室，叫他的仆人打开一扇门；门一打开，基督徒就看见一个非常严肃的人像挂在墙上，他的样子是这样的：眼睛朝天，手里拿着《圣经》 ，嘴唇上写着真理的法则，世界在他的背后。他站在那儿好像是在向人类恳求，头顶上有一圈金色的光辉。", "基督徒说，这是什么意思？"], "en_paras": ["Then Christian began to gird up his loins, and to address himself to his journey. So the other told him, That by that he was gone some distance from the gate, he would come at the house of the Interpreter, at whose door he should knock, and he would show him excellent things. Then Christian took his leave of his friend, and he again bid him God-speed.", "Then he went on till he came to the house of the Interpreter, where he knocked over and over; at last one came to the door, and asked who was there.", "CHR. Sir, here is a traveller, who was bid by an acquaintance of the good-man of this house to call here for my profit; I would therefore speak with the master of the house. So he called for the master of the house, who, after a little time, came to Christian, and asked him what he would have.", "CHR. Sir, said Christian, I am a man that am come from the City of Destruction, and am going to the Mount Zion; and I was told by the man that stands at the gate, at the head of this way, that if I called here, you would show me excellent things, such as would be a help to me in my journey.", "INTER. Then said the Interpreter, Come in; I will show that which will be profitable to thee. So he commanded his man to light the candle, and bid Christian follow him: so he had him into a private room, and bid his man open a door; the which when he had done, Christian saw the picture of a very grave person hang up against the wall; and this was the fashion of it. It had eyes lifted up to heaven, the best of books in his hand, the law of truth was written upon his lips, the world was behind his back. It stood as if it pleaded with men, and a crown of gold did hang over his head.", "CHR. Then said Christian, What meaneth this?", "INTER. The man whose picture this is, is one of a thousand; he can beget children [1 Cor. 4:15], travail in birth with children [Gal. 4:19], and nurse them himself when they are born. And whereas thou seest him with his eyes lift up to heaven, the best of books in his hand, and the law of truth writ on his lips, it is to show thee that his work is to know and unfold dark things to sinners; even as also thou seest him stand as if he pleaded with men: and whereas thou seest the world as cast behind him, and that a crown hangs over his head, that is to show thee that slighting and despising the things that are present, for the love that he hath to his Master's service, he is sure in the world that comes next to have glory for his reward. Now, said the Interpreter, I have showed thee this picture first, because the man whose picture this is, is the only man whom the Lord of the place whither thou art going, hath authorised to be thy guide in all difficult places thou mayest meet with in the way; wherefore, take good heed to what I have shewed thee, and bear well in thy mind what thou hast seen, lest in thy journey thou meet with some that pretend to lead thee right, but their way goes down to death."]}, {"sub_zh": "满是尘土的客厅与福音洒水打扫", "sub_en": "The Dusty Parlour Cleansed by the Gospel of Grace", "zh_paras": ["解释者说：画像中的人是个不可多得的人。他能生儿女，受生产的痛苦，并且在儿女生下来以后亲自抚养他们。你看到他眼睛朝天，手里拿着《圣经》 ，嘴唇上写着真理的法则，这是让你知道他的工作是认识黑暗的一面，把它显示给罪人；你还看见他站在那儿好像向人类恳求似的；你还看见这个世界给撇在他背后，他头顶上有一圈光轮，这表示由于他为了热爱为他主人服务而轻视眼前的一切，在未来的世界里，他一定会得到荣耀作为报酬。", "解释者又说：我先给你看这张画像，是因为画里的这个人是在你可能碰到的所有困境中唯一的引导人，他是你要去的那个地方的主人授权他担负起这个职责的；因此，要注意我给你看的一切，牢牢记住你所看到的一切，免得日后上当，在路上碰到佯称要引你到正路上去的人，而实际上却把你带到死亡之路上去。", "然后解释者拉着他的手领他走进一间从来没有打扫、因而满是灰尘的大客厅；他看了一会后，解释者吩咐一个人来打扫。他一开始打扫，灰尘就在满屋子里飞扬，基督徒的喉咙几乎给噎住了。接着解释者对站在旁边的一个少女说，拿点水来洒这房间；这样做了之后，房间就很便当地打扫得干干净净了。", "于是基督徒说，这是什么意思？", "解释者回答说：客厅就等于一个从来没有受到福音的仁慈的恩典洁净过的人的心；灰尘就等于使整个人堕落的原罪和内心的腐败。头一个开始打扫的是律法；但是后来拿水来洒的是福音。刚才你看到第一个人开始打扫的时候，灰尘满屋子飞扬，使他无法打扫得干净，而且你的喉咙几乎给噎住了；这是让你知道，律法，凭它的作用，非但不能洗净心里的罪；反而使它复活，给它力量，使它在心灵里扩大起来；虽然律法能发现罪恶并禁止罪恶，但是没有力量克服它。你还看到那少女在房间里洒水后打扫起来就方便多了；这表示福音在心灵里起了良好、宝贵的作用，于是，就像你看到那少女用水洒在地板上使灰尘落下来那样，罪给制胜了，灵魂由于信心7 也", "就洁净了，结果才能作为荣耀的君王的住所。我在梦中又看到解释者拉着他的手领他走进一间小屋子，那儿有两个小孩坐在各自的椅子上。大的一个叫做情欲，另外一个叫做耐心。情欲看上去很不高兴；而耐心却很镇静。于是基督徒问，情欲为什么这样不开心？解释者回答说，他们的保护人要等到明年年初才让他得到美好的东西；但是他现在就要；而耐心却愿意等待。"], "en_paras": ["Then he took him by the hand, and led him into a very large parlour that was full of dust, because never swept; the which after he had reviewed a little while, the Interpreter called for a man to sweep. Now, when he began to sweep, the dust began so abundantly to fly about, that Christian had almost therewith been choked. Then said the Interpreter to a damsel that stood by, Bring hither the water, and sprinkle the room; the which, when she had done, it was swept and cleansed with pleasure.", "CHR. Then said Christian, What means this?", "INTER. The Interpreter answered, This parlour is the heart of a man that was never sanctified by the sweet grace of the gospel; the dust is his original sin and inward corruptions, that have defiled the whole man. He that began to sweep at first, is the Law; but she that brought water, and did sprinkle it, is the Gospel. Now, whereas thou sawest, that so soon as the first began to sweep, the dust did so fly about that the room by him could not be cleansed, but that thou wast almost choked therewith; this is to shew thee, that the law, instead of cleansing the heart (by its working) from sin, doth revive, put strength into, and increase it in the soul, even as it doth discover and forbid it, for it doth not give power to subdue. [Rom. 7:6; 1 Cor. 15:56; Rom. 5:20]", "Again, as thou sawest the damsel sprinkle the room with water, upon which it was cleansed with pleasure; this is to show thee, that when the gospel comes in the sweet and precious influences thereof to the heart, then, I say, even as thou sawest the damsel lay the dust by sprinkling the floor with water, so is sin vanquished and subdued, and the soul made clean through the faith of it, and consequently fit for the King of glory to inhabit. [John 15:3; Eph. 5:26; Acts 15:9; Rom. 16:25,26; John 15:13]", "I saw, moreover, in my dream, that the Interpreter took him by the hand, and had him into a little room, where sat two little children, each one in his chair. The name of the eldest was Passion, and the name of the other Patience. Passion seemed to be much discontented; but Patience was very quiet. Then Christian asked, What is the reason of the discontent of Passion? The Interpreter answered, The Governor of them would have him stay for his best things till the beginning of the next year; but he will have all now: but Patience is willing to wait.", "Then I saw that one came to Passion, and brought him a bag of treasure, and poured it down at his feet, the which he took up and rejoiced therein, and withal laughed Patience to scorn. But I beheld but a while, and he had lavished all away, and had nothing left him but rags.", "CHR. Then said Christian to the Interpreter, Expound this matter more fully to me."]}, {"sub_zh": "情欲与耐心的两个孩子", "sub_en": "The Two Children: Passion and Patience", "zh_paras": ["然后我看见一个人带一袋财宝到情欲面前，倾倒在他的脚边，他很高兴地把它们拾起来，一面还讥笑耐心。可是不一会工夫我看见他把所有的东西都花费掉，剩下的只是一身破衣服。", "于是基督徒对解释者说，请把这件事详细说明一下。", "解释者就说：这两个小孩代表两种典型：情欲代表世俗的人，耐心代表来世的人；因为就像你看到的，情欲要在今年里，就是说今世里，得到一切；世俗的人都是这样，他们现在就要所有的好东西，他们不能为着他们应得的份等到明年，也就是说等到来世。在他们看来， “手中一只鸟胜过林中的两只， ”他们信奉这句俗语胜于信奉一切关于来世的好处的神圣的见证。可是就像你看见的，他很快地都花费净尽，不久只剩下一身破衣衫，所有这种人到末了都是这样情形。", "于是基督徒说，现在我看出耐心最聪明，而这是有好几个理由的。首先，因为他肯等待上好的东西。其次因为他会得到他应得的荣耀，而另一个人只落得一身破衣衫。", "解释者说：不但如此，你还可以再加一句，那就是，来世的荣耀是永远不会消失的；而今世的一切都会过去的。因此情欲并不为了他先得到好东西而有理由取笑耐心；相反地，倒是耐心由于最后得到好东西而有理由讥笑他；因为前者一定得让位给后者，后者一定有时回运转的日子；可是后者就不需要让位给别人；因为没有接着来承继的人了。因此，谁先得到一份的，总有一天会花掉；而最后得到的人一定会永久守住；所以对财主们就这样说，1“你该回想你生前享过福，拉撒路也受过苦；如今他在这里得安慰，你倒受痛苦。”", "基督徒说：那么我看出最好不要贪慕目前的东西，而要期待将来的。"], "en_paras": ["INTER. So he said, These two lads are figures: Passion, of the men of this world; and Patience, of the men of that which is to come; for as here thou seest, Passion will have all now this year, that is to say, in this world; so are the men of this world, they must have all their good things now, they cannot stay till next year, that is until the next world, for their portion of good. That proverb, 'A bird in the hand is worth two in the bush', is of more authority with them than are all the Divine testimonies of the good of the world to come. But as thou sawest that he had quickly lavished all away, and had presently left him nothing but rags; so will it be with all such men at the end of this world.", "CHR. Then said Christian, Now I see that Patience has the best wisdom, and that upon many accounts. First, because he stays for the best things. Second, and also because he will have the glory of his, when the other has nothing but rags.", "INTER. Nay, you may add another, to wit, the glory of the next world will never wear out; but these are suddenly gone. Therefore Passion had not so much reason to laugh at Patience, because he had his good things first, as Patience will have to laugh at Passion, because he had his best things last; for first must give place to last, because last must have his time to come; but last gives place to nothing; for there is not another to succeed. He, therefore, that hath his portion first, must needs have a time to spend it; but he that hath his portion last, must have it lastingly; therefore it is said of Dives, \"Thou in thy life-time receivedst thy good things, and likewise Lazarus evil things; but now he is comforted, and thou art tormented.\" [Luke 16:25]", "CHR. Then I perceive it is not best to covet things that are now, but to wait for things to come.", "INTER. You say the truth: \"For the things which are seen are temporal; but the things which are not seen are eternal.\" [2 Cor. 4:18] But though this be so, yet since things present and our fleshly appetite are such near neighbours one to another; and again, because things to come, and carnal sense, are such strangers one to another; therefore it is, that the first of these so suddenly fall into amity, and that distance is so continued between the second.", "Then I saw in my dream that the Interpreter took Christian by the hand, and led him into a place where was a fire burning against a wall, and one standing by it, always casting much water upon it, to quench it; yet did the fire burn higher and hotter.", "Then said Christian, What means this?", "The Interpreter answered, This fire is the work of grace that is wrought in the heart; he that casts water upon it, to extinguish and put it out, is the Devil; but in that thou seest the fire notwithstanding burn higher and hotter, thou shalt also see the reason of that. So he had him about to the backside of the wall, where he saw a man with a vessel of oil in his hand, of the which he did also continually cast, but secretly, into the fire."]}, {"sub_zh": "墙边的烈火与暗中浇油的基督", "sub_en": "The Fire Burning Against the Wall & The Oil of Christ's Grace", "zh_paras": ["解释者说：你说得对，2“因为所见的是暂时的，所不见的是永远的。”可是，虽然是这样情形，但是由于肉体的欲望和眼前的东西是那么接近，而未来的东西跟肉欲又离得那么远，因此前两者就不谋而合，而后两者之间的距离却一直保持下去。", "这时我在梦里看见解释者牵着基督徒的手，领他到一个地方，那儿的墙边烧着熊熊的篝火，有一个人站在火旁，老往火里浇着大量的水，想要扑灭它；可是火越烧越旺，越来越炽。", "于是基督徒说，这是什么意思？", "解释者回答说：这火是恩典在心里所做的工作；那个用水浇火、想要扑灭它的是魔鬼；不过你看到，尽管如此，火却越烧越旺、越来越炽，其中有个道理，你马上可以明白。说着他就领他到墙的后面，他看到在那儿有一个人拿着一桶油，同样不停手地（然而悄悄地）往火上浇着。", "基督徒又问道，这是什么意思？", "解释者回答道：那是基督，他不断地用恩典的油浇灌那已经在人心里展开的工作；由于使用了这个办法，不管魔鬼怎么做，基督的子民的心灵还是有福的。至于你看到那个人站在墙后保持那火，不让熄灭，这说明一个受到引诱的人不容易看到恩典在心里怎样继续起作用。我还看见解释者又牵着他的手，把他领到一个非常可爱的地方，那儿有一座又美丽又雄伟的宫殿；", "基督徒看见了大为高兴。他还看见有些人穿着黄金一般的衣服在那上面走来走去。"], "en_paras": ["Then said Christian, What means this?", "The Interpreter answered, This is Christ, who continually, with the oil of his grace, maintains the work already begun in the heart: by the means of which, notwithstanding what the devil can do, the souls of his people prove gracious still. [2 Cor. 12:9] And in that thou sawest that the man stood behind the wall to maintain the fire, that is to teach thee that it is hard for the tempted to see how this work of grace is maintained in the soul.", "I saw also, that the Interpreter took him again by the hand, and led him into a pleasant place, where was builded a stately palace, beautiful to behold; at the sight of which Christian was greatly delighted. He saw also, upon the top thereof, certain persons walking, who were clothed all in gold.", "Then said Christian, May we go in thither?", "Then the Interpreter took him, and led him up towards the door of the palace; and behold, at the door stood a great company of men, as desirous to go in; but durst not. There also sat a man at a little distance from the door, at a table-side, with a book and his inkhorn before him, to take the name of him that should enter therein; he saw also, that in the doorway stood many men in armour to keep it, being resolved to do the men that would enter what hurt and mischief they could. Now was Christian somewhat in amaze. At last, when every man started back for fear of the armed men, Christian saw a man of a very stout countenance come up to the man that sat there to write, saying, Set down my name, Sir: the which when he had done, he saw the man draw his sword, and put a helmet upon his head, and rush toward the door upon the armed men, who laid upon him with deadly force; but the man, not at all discouraged, fell to cutting and hacking most fiercely. So after he had received and given many wounds to those that attempted to keep him out, he cut his way through them all [Acts 14:22], and pressed forward into the palace, at which there was a pleasant voice heard from those that were within, even of those that walked upon the top of the palace, saying--", "\"Come in, come in; Eternal glory thou shalt win.\"", "So he went in, and was clothed with such garments as they. Then Christian smiled and said; I think verily I know the meaning of this."]}, {"sub_zh": "荣美宫殿与奋勇进门的披甲勇士", "sub_en": "The Stately Palace & The Valiant Man Girding on the Sword", "zh_paras": ["这时候基督徒说，我们可以到那边去吗？", "于是解释者领着他向宫殿的大门走过去；啊，原来早有一大群人站在门口，都想进去但是又不敢进去。离门口不远，有个人坐在一张桌子旁边，桌上放着一本书和一只角制的墨水瓶，用来登记要进门去的人的名字；他还看见在门里面站着好些顶盔贯甲的人在门旁把守着，看他们的样子似乎要毫不留情地伤害那想要进门去的人。这时候基督徒的确感到惊奇。最后，当所有的人由于害怕那些穿戴盔甲的人而掉头跑开的时候，基督徒看见一个态度非常坚决的人走到登记人员那儿说，请写下我的名字，先生。登记手续办好之后，他看见那个人拔出利剑，戴上头盔，朝着门向那些穿戴盔甲的人猛冲过去，他们拼命围攻他；但是那个人毫不气馁，狠命地乱刺乱砍。直到他自己受了伤，同时也", "伤了好几个拦阻他进去的人之后，他在那些人中间杀出一条路来，闯进宫殿里去了。这时候里面响起一片欢欣的声音，就是那些在宫殿顶上走来走去的人也欢呼起来了，他们喊说 ——快进门，进门来；你将赢得永远的荣名。他就这样进去了，并且穿上像他们一样的衣服。基督徒这才领会地笑着说，我想我的确知道这是什么意思。", "基督徒说：现在让我去吧。解释者说，不，别走，等我再给你多看一点东西，然后你再继续走你的路。于是他又牵着他的手，把他带进一间黑洞洞的房间，那儿有一个铁笼子，里面坐着一个人。这人看上去似乎很悲伤；他的一对眼睛盯着地上，两手合握着，唉声叹气，好像心要碎了似的。", "于是基督徒问道，这是什么意思？解释者就让他跟那个人谈话。", "于是基督徒问他说，你是做什么的？他回答说，我过去不是这样的。"], "en_paras": ["Now, said Christian, let me go hence. Nay, stay, said the Interpreter, till I have shewed thee a little more, and after that thou shalt go on thy way. So he took him by the hand again, and led him into a very dark room, where there sat a man in an iron cage.", "Now the man, to look on, seemed very sad; he sat with his eyes looking down to the ground, his hands folded together, and he sighed as if he would break his heart. Then said Christian, What means this? At which the Interpreter bid him talk with the man.", "Then said Christian to the man, What art thou? The man answered, I am what I was not once.", "CHR. What wast thou once?", "MAN. The man said, I was once a fair and flourishing professor, both in mine own eyes, and also in the eyes of others; I once was, as I thought, fair for the Celestial City, and had then even joy at the thoughts that I should get thither. [Luke 8:13]", "CHR. Well, but what art thou now?", "MAN. I am now a man of despair, and am shut up in it, as in this iron cage. I cannot get out. Oh, now I cannot!"]}, {"sub_zh": "铁笼中的绝望之人与良心噩梦", "sub_en": "The Man in the Iron Cage of Despair", "zh_paras": ["基督徒说：你过去是什么样的呢？他说：我过去是个正派、出色的信徒，我自以为是这样的，别人看来也是这样；我过去有资格进天国，我自己也相信确有资格，那时侯一想起将来要到那儿去，我就高兴。", "基督徒说：唔，那么你现在怎么样呢？那个人说：现在我是个绝望透顶的人，就像关在铁笼子里一样脱不了绝望的囚禁。我逃不出去。哦，我现在不能了！", "基督徒说：你是怎样弄到这个地步的？那个人说：我轻忽了我以往所具备的警惕和镇静；我放纵了情欲；得罪了《圣经》的光和神的仁慈；我使圣灵担懮，他就离开我了；我去招引魔鬼，他就来了；我触怒了神，被他弃绝了；我的心变得这样冷酷，我不能忏悔了。", "于是基督徒对解释者说，难道像这样的人就没有希望了吗？解释者说，你问他好啦。", "于是基督徒说，难道你什么希望也没有，不得不给禁锢在这个无望的铁笼里吗？那个人说，没有，什么希望也没有了。", "基督徒说，怎么，神之子是非常慈悲的。那个人说：我重新又把祂钉在十字架上了；我瞧不起祂；我瞧不起祂的正义；我“将祂的血当作平常” ；我3“又亵慢施恩的圣灵”。因此我自己关掉了所有希望之门，现在只有那要把我当作敌人一样吞灭了的必临的审判和非常的愤怒威吓着我，可怕的威吓，恐怖的威吓。"], "en_paras": ["CHR. But how camest thou in this condition?", "MAN. I left off to watch and be sober. I laid the reins, upon the neck of my lusts; I sinned against the light of the Word and the goodness of God; I have grieved the Spirit, and he is gone; I tempted the devil, and he is come to me; I have provoked God to anger, and he has left me: I have so hardened my heart, that I cannot repent.", "Then said Christian to the Interpreter, But is there no hope for such a man as this? Ask him, said the Interpreter. Nay, said Christian, pray, Sir, do you.", "INTER. Then said the Interpreter, Is there no hope, but you must be kept in the iron cage of despair?", "MAN. No, none at all.", "INTER. Why, the Son of the Blessed is very pitiful.", "MAN. I have crucified him to myself afresh [Heb. 6:6]; I have despised his person [Luke 19:14]; I have despised his righteousness; I have \"counted his blood an unholy thing\"; I have \"done despite to the Spirit of grace\". [Heb. 10:28-29] Therefore I have shut myself out of all the promises, and there now remains to me nothing but threatenings, dreadful threatenings, fearful threatenings, of certain judgement and fiery indignation, which shall devour me as an adversary.", "INTER. For what did you bring yourself into this condition?"]}, {"sub_zh": "梦见审判日战兢惊醒之人", "sub_en": "The Trembling Dreamer Awakening to the Day of Judgment", "zh_paras": ["基督徒说：你为什么把自己搞到这个地步呢？那个人说：为了肉欲、逸乐和现世的好处；我当时指望从这些事情上得到快乐；可是现在所有这些东西都在刺痛我，像可怕的蛆虫那样咬着我。", "基督徒说：难道你现在不能忏悔自新吗？那个人说：神已经不听我的忏悔。《圣经》也不鼓励我的信心；是的，祂自己把我关在这铁笼里；即使用全世界的人的力量，也没法放我出去。哦，永恒，永恒！我怎么对付我得经历的永远的苦难呢！", "于是解释者对基督徒说，记住这个人的苦难，让它作为你永远的警惕。", "基督徒说：啊，这真叫人害怕！愿神帮助我，使我谨慎、清醒，帮助我祈祷，使我不致再蹈这个人的复辙，自投苦难的罗网。先生，现在是我该上路的时候了吧？", "解释者说：等我再给你看一件事，你就可以上路了。", "于是他又拉着基督徒的手，领他走进一个房间，那儿有个人正从床上爬起来，一面穿衣服，一面发抖。"], "en_paras": ["MAN. For the lusts, pleasures, and profits of this world; in the enjoyment of which I did then promise myself much delight; but now every one of those things also bite me, and gnaw me like a burning worm.", "INTER. But canst thou not now repent and turn?", "MAN. God hath denied me repentance. His Word gives me no encouragement to believe; yea, himself hath shut me up in this iron cage; nor can all the men in the world let me out. O eternity, eternity! how shall I grapple with the misery that I must meet with in eternity!", "INTER. Then said the Interpreter to Christian, Let this man's misery be remembered by thee, and be an everlasting caution to thee.", "CHR. Well, said Christian, this is fearful! God help me to watch and be sober, and to pray that I may shun the cause of this man's misery! Sir, is it not time for me to go on my way now?", "INTER. Tarry till I shall show thee one thing more, and then thou shalt go on thy way.", "So he took Christian by the hand again, and led him into a chamber, where there was one rising out of bed; and as he put on his raiment, he shook and trembled. Then said Christian, Why doth this man thus tremble? The Interpreter then bid him tell to Christian the reason of his so doing. So he began and said, This night, as I was in my sleep, I dreamed, and behold the heavens grew exceeding black; also it thundered and lightened in most fearful wise, that it put me into an agony; so I looked up in my dream, and saw the clouds rack at an unusual rate, upon which I heard a great sound of a trumpet, and saw also a man sit upon a cloud, attended with the thousands of heaven; they were all in flaming fire: also the heavens were in a burning flame. I heard then a voice saying, \"Arise, ye dead, and come to judgement\"; and with that the rocks rent, the graves opened, and the dead that were therein came forth. Some of them were exceeding glad, and looked upward; and some sought to hide themselves under the mountains. [1 Cor. 15:52; 1 Thes. 4:16; Jude 14; John 5:28,29; 2 Thes. 1:7,8; Rev. 20:11-14; Isa. 26:21; Micah 7:16,17; Ps. 95:1-3; Dan. 7:10] Then I saw the man that sat upon the cloud open the book, and bid the world draw near. Yet there was, by reason of a fierce flame which issued out and came from before him, a convenient distance betwixt him and them, as betwixt the judge and the prisoners at the bar. [Mal. 3:2,3; Dan. 7:9,10] I heard it also proclaimed to them that attended on the man that sat on the cloud, Gather together the tares, the chaff, and stubble, and cast them into the burning lake. [Matt. 3:12; 13:30; Mal. 4:1] And with that, the bottomless pit opened, just whereabout I stood; out of the mouth of which there came, in an abundant manner, smoke and coals of fire, with hideous noises. It was also said to the same persons, \"Gather my wheat into the garner.\" [Luke 3:17] And with that I saw many catched up and carried away into the clouds, but I was left behind. [1 Thes. 4:16,17] I also sought to hide myself, but I could not, for the man that sat upon the cloud still kept his eye upon me; my sins also came into my mind; and my conscience did accuse me on every side. [Rom. 3:14,15] Upon this I awaked from my sleep."]}, {"sub_zh": "辞别解释者与系紧腰带前行", "sub_en": "Christian Takes His Leave with the Comforter Ever Abiding", "zh_paras": ["于是基督徒问，他为什么这样发抖？解释者便叫他讲给基督徒听他为什么这样子。他就开始说，今晚我睡着的时候，在睡梦中看见天空变得乌黑；同时还有极可怕的霹雳和闪电，我愁苦极了；我在梦中向上一看，看见云朵以超乎寻常的速度飞行着，我又听到响亮的号筒声，还看见一个人驾着云，周围侍立着无数的天使；他们都发出火焰；天空里也是熊熊的火焰。接着我听见一个声音说，3“起来，你们死了的人，来受审判！”这句话一说完，岩石都裂了开来，坟墓都敞开，里面的死人全都走出来。他们有的非常欣喜，仰起头望着；有的要把自己藏在山岩底下。", "基督徒问道：你为什么看到这些东西就这样害怕？那个人说：啊，我以为审判的日子来了，而我还没有准备好哩。使我最害怕的是，天使们提上去好几个人而丢下了我；还有，地狱的深坑就在我站的地方旁边张着嘴。我的良心也折磨着我；并且，我认为神怒形于色地老盯着我。接着解释者对基督徒说，你有没有仔细想过这些事？", "基督徒说：想过的，它们叫我又害怕又抱着希望。", "解释者说：要牢牢记住这些事情，让它们作为你腰间的刺棒，在你必须走的路上驱策你向前。于是基督徒开始束紧腰带，准备上路。这时解释者说，好基督徒，愿圣灵跟你常在一起，指引你通往天国的路。", "基督徒就这样走了，口里说着 ——在这儿，我看到了稀罕和有益的事情，看到了快乐的和可怕的光景，这些都使我的意志坚定，把任务承当，那么让我来把这些事情细细思量，让我弄明白为什么我会看到这一切事迹，哦，好解释者，让我对你感激。这时我在梦里看见基督徒走的那条路上两旁都有墙围着，那两道墙叫做救世。因此背着重负的基督徒就在这条路上奔跑，由于背上的负荷，他跑得相当吃力。他这样一直跑到一个比地面稍高一点的地方，那儿屹立着一个十字架，在下面略低一点的地方有一个坟墓。我在梦里看见，基督徒正走到十字架前面的时候，他的重负在肩膀上松了开来，忽然从背", "上落下来，一直滚到墓穴旁边，然后掉进去不见了基督徒卸下了重负。这时候基督徒高兴极了，浑身感到无比的轻快，欣然说道， “因他的痛苦我得到安息，因他的死亡我得到生命。 ”他惊奇地站了一会儿；因为他觉得很奇怪，一看见这十字架，他的重负竟然就得到了解除。于是他看了又看，直到眼泪汪汪地沿着面颊滚下来。他正站在那儿呆望、哭泣的时候，有三个浑身发出光亮的人走到他跟前来向他招呼说， “愿你平安;”第一个就对他说，3“你的罪赦了 .”第二个把他身上的破衣衫脱掉，给他换上一套衣服；第三个在他额上打了个印记，还给他一卷上面打了戳记的册子，吩咐他一面走路一面看，并且要在天门的入口处交出来。他们说完就", "走了。"], "en_paras": ["CHR. But what is it that made you so afraid of this sight?", "MAN. Why, I thought that the day of judgement was come, and that I was not ready for it: but this frighted me most, that the angels gathered up several, and left me behind; also the pit of hell opened her mouth just where I stood. My conscience, too, afflicted me; and, as I thought, the Judge had always his eye upon me, shewing indignation in his countenance.", "Then said the Interpreter to Christian, Hast thou considered all these things?", "CHR. Yes, and they put me in hope and fear.", "INTER. Well, keep all things so in thy mind that they may be as a goad in thy sides, to prick thee forward in the way thou must go. Then Christian began to gird up his loins, and to address himself to his journey. Then said the Interpreter, The Comforter be always with thee, good Christian, to guide thee in the way that leads to the City. So Christian went on his way, saying--", "\"Here I have seen things rare and profitable; Things pleasant, dreadful, things to make me stable In what I have begun to take in hand; Then let me think on them, and understand Wherefore they showed me were, and let me be Thankful, O good Interpreter, to thee.\"", "Now I saw in my dream, that the highway up which Christian was to go, was fenced on either side with a wall, and that wall was called Salvation. [Isa. 26:1] Up this way, therefore, did burdened Christian run, but not without great difficulty, because of the load on his back.", "He ran thus till he came at a place somewhat ascending, and upon that place"]}]}, {"num": 8, "id": "chapter-6", "badge_label": "CHAPTER 8", "title_zh": "第六章 十字架", "title_en": "Chapter 6: The Cross and the Sepulchre", "desc": "十字架下重担脱落滚入空墓；三位发光之人的恩惠与华美新衣；路旁的愚蠢、懒惰与傲慢之徒。", "blocks": [{"sub_zh": "十字架下重担脱落滚入空墓", "sub_en": "At the Cross: The Heavy Burden Rolled Away into the Sepulchre", "zh_paras": ["这时我在梦里看见他继续这样走着，后来走到一块洼地上，在那里，也就是在这条路的近旁，有三个人睡得正香，他们的脚踝上全上着脚镣。他们一个叫做愚蠢，一个叫做懒惰，第三个叫做傲慢。", "基督徒看见他们那样躺着，就走过去，心想也许能把他们喊醒，他喊道，你们就像在桅杆顶上睡觉的人，因为你们下面就是死海——一个无底的深渊。醒来，走开吧，要是你自己愿意走开，那么我就帮你们除下脚镣。他还对他们说，要是那个4“如同吼叫的狮子，遍地游行”的魔鬼从这里走过，你们一定会成为他的口中物。他们被喊醒听他说完这话，就望着他，开始作如下的回答：愚蠢说， “我看不出有什么危险； ”懒惰说， “再睡一会吧； ”傲慢说， “每个人得靠自己。 ”说完他们又躺下去睡觉，基督徒也就继续走他的路。不过他一想到这帮人身处险境，他如此仗义要帮助他们，唤醒他们，劝告他们，自愿帮他们解除", "脚镣，而他们却一点不把他的好意当一回事，他不免觉得很懊恼。他正在烦闷的时候，看见两个人从他走着的窄路的左边墙上滚了下来；他们急急忙忙向他走来。其中一个叫做形式主义者，另一个叫做虚伪。就像我刚才说过的，他们来到他跟前，他就同他们攀谈起来。基督徒说：先生，你们从哪儿来，要到哪儿去？形式主义者和虚伪说：我们生长在高傲之地，现在为了要得嘉奖准备到锡安山去。虚伪"], "en_paras": ["stood a cross, and a little below, in the bottom, a sepulchre. So I saw in my dream, that just as Christian came up with the cross, his burden loosed from off his shoulders, and fell from off his back, and began to tumble, and so continued to do, till it came to the mouth of the sepulchre, where it fell in, and I saw it no more.", "Then was Christian glad and lightsome, and said, with a merry heart, \"He hath given me rest by his sorrow, and life by his death.\" Then he stood still awhile to look and wonder; for it was very surprising to him, that the sight of the cross should thus ease him of his burden. He looked therefore, and looked again, even till the springs that were in his head sent the waters down his cheeks. [Zech. 12:10] Now, as he stood looking and weeping, behold three Shining Ones came to him and saluted him with \"Peace be unto thee\". So the first said to him, \"Thy sins be forgiven thee\" [Mark 2:5]; the second stripped him of his rags, and clothed him with change of raiment [Zech. 3:4]; the third also set a mark on his forehead, and gave him a roll with a seal upon it, which he bade him look on as he ran, and that he should give it in at the Celestial Gate. [Eph. 1:13] So they went their way.", "\"Who's this? the Pilgrim. How! 'tis very true, Old things are past away, all's become new. Strange! he's another man, upon my word, They be fine feathers that make a fine bird.", "Then Christian gave three leaps for joy, and went on singing--", "\"Thus far I did come laden with my sin; Nor could aught ease the grief that I was in Till I came hither: What a place is this! Must here be the beginning of my bliss? Must here the burden fall from off my back? Must here the strings that bound it to me crack? Blest cross! blest sepulchre! blest rather be The Man that there was put to shame for me!\"", "I saw then in my dream, that he went on thus, even until he came at a bottom, where he saw, a little out of the way, three men fast asleep, with fetters upon their heels. The name of the one was Simple, another Sloth, and the third Presumption.", "Christian then seeing them lie in this case went to them, if peradventure he might awake them, and cried, You are like them that sleep on the top of a mast, for the Dead Sea is under you--a gulf that hath no bottom. [Prov. 23:34] Awake, therefore, and come away; be willing also, and I will help you off with your irons. He also told them, If he that \"goeth about like a roaring lion\" comes by, you will certainly become a prey to his teeth. [1 Pet. 5:8] With that they looked upon him, and began to reply in this sort: Simple said, \"I see no danger\"; Sloth said, \"Yet a little more sleep\"; and Presumption said, \"Every fat must stand upon its own bottom; what is the answer else that I should give thee?\" And so they lay down to sleep again, and Christian went on his way."]}, {"sub_zh": "三位发光之人的恩惠与华美新衣", "sub_en": "The Three Shining Ones Bestow Peace, Garments, and a Rolled Seal", "zh_paras": ["基督徒说：你们为什么不从这条路开头的那扇门进来？你难道不知道《圣经》里写着“不从门进去，倒从别处爬进去，那人就是贼，就是强盗？”形式主义者和虚伪说，他们的乡邻都认为从那扇门进去路太远；因此他们总是像他们两人刚才那样抄近路越墙而来的。", "基督徒说：不过这样做是违背了我们要去的那地方主人彰明昭著的告诫；这样，岂不是要被认为有意违反他吗？形式主义者和虚伪说，至于这一点，他大可不必担心；因为他们是按照惯例行事；并且如果需要的话，还可以拿出证据来证明这习俗已经存在一千多年之久了。但是，基督徒说，你们的行为经得起法律的考验吗？形式主义者和虚伪说，既然这习俗已经有一千年以上的历史，毫无疑问，任何公正的法官都会认为它是合法的；况且，他们说，如果我们已经走到这路上来了，当初究竟怎么来的又有什么关系？我们要是已经来到这条路上，不就得啦；你也不过是走在这条路上，虽然据我们晓得，你是从那扇小门", "进来的；而我们这两个越墙过来的，岂不是也在这条路上走着；那么，请问你有什么比我们强呢？"], "en_paras": ["Yet was he troubled to think that men in that danger should so little esteem the kindness of him that so freely offered to help them, both by awakening of them, counselling of them, and proffering to help them off with their irons. And as he was troubled thereabout, he espied two men come tumbling over the wall on the left hand of the narrow way; and they made up apace to him. The name of the one was Formalist, and the name of the other Hypocrisy. So, as I said, they drew up unto him, who thus entered with them into discourse.", "CHR. Gentlemen, whence came you, and whither go you?", "FORM. and HYP. We were born in the land of Vain-glory, and are going for praise to Mount Zion.", "CHR. Why came you not in at the gate which standeth at the beginning of the way? Know you not that it is written, that he that cometh not in by the door, \"but climbeth up some other way, the same is a thief and a robber?\" [John 10:1]", "FORM. and HYP. They said, That to go to the gate for entrance was, by all their countrymen, counted too far about; and that, therefore, their usual way was to make a short cut of it, and to climb over the wall, as they had done.", "CHR. But will it not be counted a trespass against the Lord of the city whither we are bound, thus to violate his revealed will?", "FORM. and HYP. They told him, that, as for that, he needed not to trouble his head thereabout; for what they did they had custom for; and could produce, if need were, testimony that would witness it for more than a thousand years."]}, {"sub_zh": "路旁的愚蠢、懒惰与傲慢之徒", "sub_en": "Simple, Sloth, and Presumption Sleeping in Fetters", "zh_paras": ["基督徒说：我是按照主人的规则行事的；你们却是依从你们自己不可靠的想法行事。你们已经被这条路的主人认为是贼了；所以即使你们走到这条路的终点，恐怕也不能算数。你们没得到他的指示自己走来，也就会得不到他的怜悯自己离去。他们对这番话不作什么答复；只是对他说，请他还是少管闲事吧。然后我看见他们自顾自地走路，不再交谈，那两个人只对基督徒说，对于律法和仪式，他们敢说他们跟他同样谨慎地遵守。所以，他们说，除了你身上穿的那件衣服以外，我们看不出你和我们有什么区别，那衣服，据我们猜想，是你的邻居给你遮身体用的。形式主义者", "基督徒说：依靠律法和仪式你们是不会得救的，因为你们没有从那扇门进来。至于我身上穿的这件衣服，是我要去的那地方的主人给我的，就像你们说的，给我遮身体用的。我把它看做祂对我的恩典，因为过去我除了破衣衫，什么都没有。并且，一路上我还可以这样安慰自己。我想，我到达城门口的时候，那儿的主人一定会永远认识我，因为我身上穿的是那天他把我身上的破衣衫脱下来时，白白地赐给我的一件衣服。此外，我前额上还有一个记号，你们也许没有注意到，它是我主人最亲信的心腹侍从在我的负担从肩上脱落的那天打在我额上的。我还要告诉你们，当时我还拿到一卷打了印的册子，", "让我在路上看了可以得到安慰；他还吩咐我到达天门的时候，就把它交出来，作为准可以放我进去的证据；我恐怕这些东西你们都没有，因为你们不是从那扇门进来的。他们对这番话都不作答；只是相视而笑。然后我看见他们都往前走去，可是基督徒走在前面，他不再和他们谈话，只顾自言自语着，有时候带着叹息的口吻，有时候露着自慰的语气；他还常常翻阅那发亮的人给他的那本小册子，读过以后，他顿时精神百倍。"], "en_paras": ["CHR. But, said Christian, will your practice stand a trial at law?", "FORM. and HYP. They told him, That custom, it being of so long a standing as above a thousand years, would, doubtless, now be admitted as a thing legal by any impartial judge; and besides, said they, if we get into the way, what's matter which way we get in? if we are in, we are in; thou art but in the way, who, as we perceive, came in at the gate; and we are also in the way, that came tumbling over the wall; wherein, now, is thy condition better than ours?", "CHR. I walk by the rule of my Master; you walk by the rude working of your fancies. You are counted thieves already, by the Lord of the way; therefore, I doubt you will not be found true men at the end of the way. You come in by yourselves, without his direction; and shall go out by yourselves, without his mercy.", "To this they made him but little answer; only they bid him look to himself. Then I saw that they went on every man in his way without much conference one with another, save that these two men told Christian, that as to laws and ordinances, they doubted not but they should as conscientiously do them as he; therefore, said they, we see not wherein thou differest from us but by the coat that is on thy back, which was, as we trow, given thee by some of thy neighbours, to hide the shame of thy nakedness.", "CHR. By laws and ordinances you will not be saved, since you came not in by the door. [Gal. 2:16] And as for this coat that is on my back, it was given me by the Lord of the place whither I go; and that, as you say, to cover my nakedness with. And I take it as a token of his kindness to me; for I had nothing but rags before. And besides, thus I comfort myself as I go: Surely, think I, when I come to the gate of the city, the Lord thereof will know me for good since I have this coat on my back--a coat that he gave me freely in the day that he stripped me of my rags. I have, moreover, a mark in my forehead, of which, perhaps, you have taken no notice, which one of my Lord's most intimate associates fixed there in the day that my burden fell off my shoulders. I will tell you, moreover, that I had then given me a roll, sealed, to comfort me by reading as I go on the way; I was also bid to give it in at the Celestial Gate, in token of my certain going in after it; all which things, I doubt, you want, and want them because you came not in at the gate.", "To these things they gave him no answer; only they looked upon each other, and laughed. Then, I saw that they went on all, save that Christian kept before, who had no more talk but with himself, and that sometimes sighingly, and sometimes comfortably; also he would be often reading in the roll that one of the Shining Ones gave him, by which he was refreshed.", "I beheld, then, that they all went on till they came to the"]}]}, {"num": 9, "id": "chapter-7", "badge_label": "CHAPTER 9", "title_zh": "第七章 艰难山", "title_en": "Chapter 7: The Hill Difficulty", "desc": "走小路的形式与虚伪之徒；攀登艰难山与半山凉亭的瞌睡；惊慌失措的胆怯与猜疑之人。", "blocks": [{"sub_zh": "走小路的形式与虚伪之徒", "sub_en": "Formalist and Hypocrisy Tumbling Over the Wall", "zh_paras": ["然后我看见他们都走到艰难山下面，在山脚边有一个泉源。那儿除了从那扇门直达的一条路之外，还有两条路；顺着山脚一条向左转弯，一条向右转弯，但是窄的一条路一直通到山上去，登山的这条路就叫做艰难。基督徒这会儿走到泉水旁边去喝水，恢复了精神；然后开始上山，边走边唱着， ——山虽然高，我一心想要攀登 ——困难绊不住我的脚跟；因为我看到生命之路就在这里。来，鼓起勇气，别畏惧，也别泄气！纵然艰难，你最好还是走正路，邪路虽然平坦，到头来依旧是悲苦。", "这时那两个人也走到了山脚下；他们看见那山既陡又高，同时又看见另外还有两条路，他们以为这两条路会跟基督徒走的那条路在山后会合 ——因此他们就决定走这两条路。一条路叫做危险，另一条叫做灭亡。于是一个人走那条名叫危险的路，给引进一座大森林里；另一个直接走上那条名叫灭亡的路，给引到一个被层层阴暗的山岳包围着的旷野上，他在那儿一失足，倒下去，再也爬不起来了。", "然后我朝基督徒看，望着他登山，由于山路陡峭，他先是奔跑，继而慢步，最后双手着地爬行起来了。山腰里有一个美好的亭子，这是山主人建造起来供辛苦的旅客们休息的。因此基督徒到了那儿便坐下休息。接着他从怀里掏出那小册子来读，从里面获得安慰；他又重新细看他在十字架旁边得到的那件衣服或者外衣。疑惑他这样自鸣得意了一会，终于打起瞌睡来，后来就睡熟了。可是这一睡就睡到傍晚，天快黑了；在酣睡中他的小册子从手里掉了下来。他睡得正香的时候，来了一个人，把他唤醒，说，1“懒惰人哪，你去察看蚂蚁的动作，就可得智慧。”基督徒一听这话就惊跳起来，赶"], "en_paras": ["foot of the Hill Difficulty; at the bottom of which was a spring. There were also in the same place two other ways besides that which came straight from the gate; one turned to the left hand, and the other to the right, at the bottom of the hill; but the narrow way lay right up the hill, and the name of the going up the side of the hill is called Difficulty. Christian now went to the spring, and drank thereof, to refresh himself [Isa. 49:10], and then began to go up the hill, saying--", "\"The hill, though high, I covet to ascend, The difficulty will not me offend; For I perceive the way to life lies here. Come, pluck up heart, let's neither faint nor fear; Better, though difficult, the right way to go, Than wrong, though easy, where the end is woe.\"", "The other two also came to the foot of the hill; but when they saw that the hill was steep and high, and that there were two other ways to go, and supposing also that these two ways might meet again, with that up which Christian went, on the other side of the hill, therefore they were resolved to go in those ways. Now the name of one of these ways was Danger, and the name of the other Destruction. So the one took the way which is called Danger, which led him into a great wood, and the other took directly up the way to Destruction, which led him into a wide field, full of dark mountains, where he stumbled and fell, and rose no more."]}, {"sub_zh": "攀登艰难山与半山凉亭的瞌睡", "sub_en": "Ascending the Hill Difficulty & The Perilous Sleep in the Arbour", "zh_paras": ["忙上路，迈开大步加快速度走到山顶。他到达山顶的时候，有两个人急速迎面跑来；一个叫做胆怯，一个叫做疑惑。基督徒对他们说，先生们，怎么回事？你们跑的路不对啊。胆怯回答说，他们原来是到锡安城去的，而且已经走过那艰难的地方；不过，他说，我们朝前走，碰到的危险越来越多；因此我们掉过头，往回走了。对，疑惑说，因为就在我们前面的路上躺着两只狮子，它们是睡着还是醒着，我们不知道；我们总认为，要是我们走近它们的身边，它们会立刻把我们撕得粉碎。", "于是基督徒说，你们这些话叫我害怕起来了；可是我到哪儿去才安全呢？要是我回到老家去，那儿是准备给硫磺火烧掉的，那我准得灭亡啦。要是我能到达天国，在那儿一定是安全的。我得冒险走去。走回头路只有死亡；向前走虽然有死亡的恐惧，可是到后来可以得到永生。我还是向前走吧。于是疑惑和胆怯奔下山去，基督徒继续往前走去。不过，他又想起了他们说的话，伸手到怀里去取他的小册子，想拿出来念念，安慰安慰自己；可是他摸来摸去，找不到它。于是基督徒大为恐慌，不知所措；因为他需要那个过去常常给他安慰的东西，那个作为他进天国去的通行证的东西。因胆怯", "此他感到心慌意乱，走投无路。最后他想起他在山坡上那个亭子里睡过觉；于是他就跪下去，请求神原谅他这种愚蠢的行为；然后掉头下山寻找他那本小册子去了。谁能充分道出基督徒在走回头路时内心所感到的痛苦呢？他有时叹息，有时流泪，不断地责备自己做了这件傻事，那个地方仅仅是为了让他疲劳的时候进去休息一会儿而建造的，而他竟在那里睡大觉。他就这样又悔又急地走下山去，一路上小心地望着路的两旁，希望能找到在旅途上多次给他安慰的那卷小册子。他这样走着，后来他望得见他在那儿睡过觉的那个亭子了；可是见了亭子反而加深他的痛苦，因为这使他重新想起他在那儿睡"], "en_paras": ["\"Shall they who wrong begin yet rightly end? Shall they at all have safety for their friend? No, no; in headstrong manner they set out, And headlong will they fall at last no doubt.\"", "I looked, then, after Christian, to see him go up the hill, where I perceived he fell from running to going, and from going to clambering upon his hands and his knees, because of the steepness of the place. Now, about the midway to the top of the hill was a pleasant arbour, made by the Lord of the hill for the refreshing of weary travellers; thither, therefore, Christian got, where also he sat down to rest him. Then he pulled his roll out of his bosom, and read therein to his comfort; he also now began afresh to take a review of the coat or garment that was given him as he stood by the cross. Thus pleasing himself awhile, he at last fell into a slumber, and thence into a fast sleep, which detained him in that place until it was almost night; and in his sleep, his roll fell out of his hand. Now, as he was sleeping, there came one to him, and awaked him, saying, Go to the ant, thou sluggard; consider her ways and be wise. [Prov. 6:6] And with that Christian started up, and sped him on his way, and went apace, till he came to the top of the hill.", "Now, when he was got up to the top of the hill, there came two men running to meet him amain; the name of the one was Timorous, and of the other, Mistrust; to whom Christian said, Sirs, what's the matter? You run the wrong way. Timorous answered, that they were going to the City of Zion, and had got up that difficult place; but, said he, the further we go, the more danger we meet with; wherefore we turned, and are going back again.", "Yes, said Mistrust, for just before us lie a couple of lions in the way, whether sleeping or waking we know not, and we could not think, if we came within reach, but they would presently pull us in pieces."]}, {"sub_zh": "惊慌失措的胆怯与猜疑之人", "sub_en": "Meeting with Timorous and Mistrust & The Recovered Roll", "zh_paras": ["觉的邪恶行为。因此他一路走着，为自己这场罪恶的睡眠失声痛哭，他说：我真该死啊！竟然在白天睡着！竟然在困难中睡着！竟然这样放纵自己的肉体，利用那个休息处所来达到肉体的舒服，而山主人盖这个亭子只是供旅客们在那里恢复一下精神的啊！我白走了多少路啊！以色列人由于他们的罪恶也遭到这种情形；他们又得经过红海回来；而我现在就得痛苦地走着，要是没有那一趟罪恶的睡眠我就可能很愉快地踏着步子的。要是没有睡着，我这会儿已经走了多少路了呀！本来只需要走一趟的路，现在得走三趟；不仅如此，现在我又要陷入黑暗中了，因为天快黑啦。哦，我刚才没有睡着就", "好啦！这会儿他又来到了亭子里，在那儿坐下来哭了一会；但是就像他所希望的那样，他终于伤心地朝高背长靠椅下面张望，看到了他的小册子；他颤抖着赶忙把它拾起来，放进怀里。谁也无法形容这个人拾到了他的小册子后是多么的快活呀！因为这本小册子就是他的生命和能够进入他所渴望的天国的保证。因此他把它放在怀里，感谢神指引他的眼睛朝它横着的那地方望去，然后带着欢喜的眼泪又开始赶路了。啊，这一段上山的路他走得多轻快呀！可是，他还没有走到山顶，太阳就下山了；这又使他想起了那场睡眠的荒谬；因此他又悲伤起来：哦，罪恶的睡眠，由于你，我才会在旅途中陷入黑暗！我得在夜", "里赶路，我的脚得在黑暗里奔走；由于我的罪恶的睡眠，我得听那些阴惨的动物的叫声。现在他又记起了疑惑和胆怯讲的事情，他们看到了狮子多么害怕。于是基督徒又自忖道，这些野兽在夜里漫游，猎取食物；要是我在黑暗里碰到它们，有什么办法逃避它们呢？我怎么样避免给它们撕得粉碎呢?他这样一路走着。但是当他正为了他那倒霉的错误行为而痛哭时，抬头看见前面有一座雄伟的宫殿，它叫做美丽，就在路旁。"], "en_paras": ["CHR. Then said Christian, You make me afraid, but whither shall I fly to be safe? If I go back to mine own country, that is prepared for fire and brimstone, and I shall certainly perish there. If I can get to the Celestial City, I am sure to be in safety there. I must venture. To go back is nothing but death; to go forward is fear of death, and life-everlasting beyond it. I will yet go forward. So Mistrust and Timorous ran down the hill, and Christian went on his way. But, thinking again of what he had heard from the men, he felt in his bosom for his roll, that he might read therein, and be comforted; but he felt, and found it not. Then was Christian in great distress, and knew not what to do; for he wanted that which used to relieve him, and that which should have been his pass into the Celestial City. Here, therefore, he begun to be much perplexed, and knew not what to do. At last he bethought himself that he had slept in the arbour that is on the side of the hill; and, falling down upon his knees, he asked God's forgiveness for that his foolish act, and then went back to look for his roll. But all the way he went back, who can sufficiently set forth the sorrow of Christian's heart? Sometimes he sighed, sometimes he wept, and oftentimes he chid himself for being so foolish to fall asleep in that place, which was erected only for a little refreshment for his weariness. Thus, therefore, he went back, carefully looking on this side and on that, all the way as he went, if happily he might find his roll, that had been his comfort so many times in his journey. He went thus, till he came again within sight of the arbour where he sat and slept; but that sight renewed his sorrow the more, by bringing again, even afresh, his evil of sleeping into his mind. [Rev. 2:5; 1 Thes. 5:7,8] Thus, therefore, he now went on bewailing his sinful sleep, saying, O wretched man that I am that I should sleep in the day-time! that I should sleep in the midst of difficulty! that I should so indulge the flesh, as to use that rest for ease to my flesh, which the Lord of the hill hath erected only for the relief of the spirits of pilgrims!", "How many steps have I took in vain! Thus it happened to Israel, for their sin; they were sent back again by the way of the Red Sea; and I am made to tread those steps with sorrow, which I might have trod with delight, had it not been for this sinful sleep. How far might I have been on my way by this time! I am made to tread those steps thrice over, which I needed not to have trod but once; yea, now also I am like to be benighted, for the day is almost spent. O, that I had not slept!", "Now, by this time he was come to the arbour again, where for a while he sat down and wept; but at last, as Christian would have it, looking sorrowfully down under the settle, there he espied his roll; the which he, with trembling and haste, catched up, and put it into his bosom. But who can tell how joyful this man was when he had gotten his roll again! for this roll was the assurance of his life and acceptance at the desired haven. Therefore he laid it up in his bosom, gave thanks to God for directing his eye to the place where it lay, and with joy and tears betook himself again to his journey. But oh, how nimbly now did he go up the rest of the hill! Yet, before he got up, the sun went down upon Christian; and this made him again recall the vanity of his sleeping to his remembrance; and thus he again began to condole with himself: O thou sinful sleep; how, for thy sake, am I like to be benighted in my journey! I must walk without the sun; darkness must cover the path of my feet; and I must hear the noise of the doleful creatures, because of my sinful sleep. [1 Thes. 5:6,7] Now also he remembered the story that Mistrust and Timorous told him of; how they were frighted with the sight of the lions. Then said Christian to himself again, These beasts range in the night for their prey; and if they should meet with me in the dark, how should I shift them? How should I escape being by them torn in pieces? Thus he went on his way. But while he was thus bewailing his unhappy miscarriage, he lift up his eyes, and behold there was a very stately palace before him, the name of which was Beautiful; and it stood just by the highway side.", "So I saw in my dream that he made haste and went forward, that if possible he might"]}]}, {"num": 10, "id": "chapter-8", "badge_label": "CHAPTER 10", "title_zh": "第八章 美丽宫殿", "title_en": "Chapter 8: The Palace Beautiful", "desc": "狮子守门与美丽宫殿的守门人警醒；谨慎、虔诚、仁爱与贤慧的款待；共进晚宴与倾心倾诉十架恩典。", "blocks": [{"sub_zh": "狮子守门与美丽宫殿的守门人警醒", "sub_en": "The Lions in the Narrow Way & The Porter Watchful", "zh_paras": ["我在梦里看见他加快脚步向前走去，希望有可能的话就在那儿住宿。他还没有走多远，就走进一条很窄的小路，这小路离开那门房还有八分之一英里的路。他一面走，一面留心张望着，终于看见路上有两只狮子。他想，现在我看到了把疑惑和胆怯吓退的危险物了（狮子是给锁住了的，但是他看不见铁链）。接着他怕起来，也想照他们的样子退回去，因为他认为前面只有死路一条。但是名叫警醒的看门人在门房里瞧见基督徒停下来，好像要回头走的样子，就喊他，说，你的胆量这么小吗？别害怕狮子，因为它们是给锁住了的，故意放在那儿来考验有信心的人，同时也可以发现没有信心的人。走在路当中就不会受到伤害。", "接着我看见他继续往前走，不过因为害怕狮子浑身直发抖；可是由于他注意看门人给他的指示，他只听见它们吼叫，而并没有受到它们的伤害。于是他拍着手，一直走到大门前看门人站的地方。他就对看门人说，先生，这是什么房子？我可以在这里过夜吗？看门人回答说，这房子是这座山的主人修建的，他是为了旅客的安全和休息而造的。看门人又问他从哪儿来，上哪儿去。", "基督徒说：我是从毁灭城来的，要到锡安山去；因为太阳已经下山了，我希望，要是可能的话，在这儿过夜。", "看门人说：你叫什么名字？", "基督徒说：我现在的名字是基督徒，本来的名字是邪恶；我是雅弗的后裔，神要使他的后裔住在闪的帐棚里。", "看门人说：你怎么这么晚才来呢？太阳已经下山了。", "基督徒说：我本来会早一点儿到这儿来的，可是，我真该死！我在山腰上的亭子里睡着了；不，尽管这样，如果我没有在睡眠中丢了我的证件，我还是很早就会到这儿的，我走到山顶的时候，摸了一下才发觉丢了，于是不得不伤心地回到我睡觉的地方，找到了它再到这儿来。", "看门人说：好，我要把这地方的一个贞女请出来，如果她听你谈过以后，觉得满意，她会按着这一家的规矩，带你去见其余的人。于是看门人警醒打一下铃，铃声响后，一个端庄美丽、名叫谨慎的少女从房子里走出来，问看门人为什么叫她。", "看门人回答道：这个人从毁灭城来，到锡安山去，因为觉得疲倦而且天又黑了，他问我能不能让他在这儿过夜；我对他说我要请你出来，等你跟他谈过以后，按照这一家的规矩，认为应该怎么办就怎么办。", "于是她问他从哪儿来，上哪儿去，他都一一回答了。她又问他怎么走上这条路的，他也告诉了她。"], "en_paras": ["get lodging there. Now, before he had gone far, he entered into a very narrow passage, which was about a furlong off the porter's lodge; and looking very narrowly before him as he went, he espied two lions in the way. Now, thought he, I see the dangers that Mistrust and Timorous were driven back by. (The lions were chained, but he saw not the chains.) Then he was afraid, and thought also himself to go back after them, for he thought nothing but death was before him. But the porter at the lodge, whose name is Watchful, perceiving that Christian made a halt as if he would go back, cried unto him, saying, Is thy strength so small? [Mark 8:34-37] Fear not the lions, for they are chained, and are placed there for trial of faith where it is, and for discovery of those that had none. Keep in the midst of the path, no hurt shall come unto thee.", "\"Difficulty is behind, Fear is before, Though he's got on the hill, the lions roar; A Christian man is never long at ease, When one fright's gone, another doth him seize.\"", "Then I saw that he went on, trembling for fear of the lions, but taking good heed to the directions of the porter; he heard them roar, but they did him no harm. Then he clapped his hands, and went on till he came and stood before the gate where the porter was. Then said Christian to the porter, Sir, what house is this? And may I lodge here to-night? The porter answered, This house was built by the Lord of the hill, and he built it for the relief and security of pilgrims. The porter also asked whence he was, and whither he was going.", "CHR. I am come from the City of Destruction, and am going to Mount Zion; but because the sun is now set, I desire, if I may, to lodge here to-night.", "POR. What is your name?", "CHR. My name is now Christian, but my name at the first was Graceless; I came of the race of Japheth, whom God will persuade to dwell in the tents of Shem. [Gen. 9:27]", "POR. But how doth it happen that you come so late? The sun is set.", "CHR. I had been here sooner, but that, \"wretched man that I am!\" I slept in the arbour that stands on the hillside; nay, I had, notwithstanding that, been here much sooner, but that, in my sleep, I lost my evidence, and came without it to the brow of the hill and then feeling for it, and finding it not, I was forced with sorrow of heart, to go back to the place where I slept my sleep, where I found it, and now I am come.", "POR. Well, I will call out one of the virgins of this place, who will, if she likes your talk, bring you into the rest of the family, according to the rules of the house. So Watchful, the porter, rang a bell, at the sound of which came out at the door of the house, a grave and beautiful damsel, named Discretion, and asked why she was called.", "The porter answered, This man is in a journey from the City of Destruction to Mount Zion, but being weary and benighted, he asked me if he might lodge here to-night; so I told him I would call for thee, who, after discourse had with him, mayest do as seemeth thee good, even according to the law of the house.", "Then she asked him whence he was, and whither he was going, and he told her. She asked him also how he got into the way; and he told her. Then she asked him what he had seen and met with in the way; and he told her. And last she asked his name; so he said, It is Christian, and I have so much the more a desire to lodge here to-night, because, by what I perceive, this place was built by the Lord of the hill for the relief and security of pilgrims. So she smiled, but the water stood in her eyes; and after a little pause, she said, I will call forth two or three more of the family. So she ran to the door, and called out Prudence, Piety, and Charity, who, after a little more discourse with him, had him into the family; and many of them, meeting him at the threshold of the house, said, Come in, thou blessed of the Lord; this house was built by the Lord of the hill, on purpose to entertain such pilgrims in. Then he bowed his head, and followed them into the house. So when he was come in and sat down, they gave him something to drink, and consented together, that until supper was ready, some of them should have some particular discourse with Christian, for the best improvement of time; and they appointed Piety, and Prudence, and Charity to discourse with him; and thus they began:", "PIETY. Come, good Christian, since we have been so loving to you, to receive you in our house this night, let us, if perhaps we may better ourselves thereby, talk with you of all things that have happened to you in your pilgrimage.", "CHR. With a very good will, and I am glad that you are so well disposed.", "PIETY. What moved you at first to betake yourself to a pilgrim's life?", "CHR. I was driven out of my native country by a dreadful sound that was in mine ears: to wit, that unavoidable destruction did attend me, if I abode in that place where I was."]}, {"sub_zh": "谨慎、虔诚、仁爱与贤慧的款待", "sub_en": "Reception by Discretion, Piety, Charity, and Prudence", "zh_paras": ["然后她问他在路上看到了和遇到了什么事情，他也说了。最后她问他叫什么名字，他就说，我叫做基督徒，我特别希望在这儿过夜，因为据我知道，这地方是这座山的主人为了安慰旅客们并保障他们的安全而建造的。她微笑着，同时眼睛里含着泪水；她顿了一顿说，我去喊两三个家里人来。她就跑到门口把贤慧、虔诚和仁爱三个人叫了来，她们跟他谈了一会儿后，把他当作自己人看待；她们很多人在门口迎接他，说，请进来，你这位被主人祝福的人；这房子是这座山的主人特地为招待这样的旅客而造的。于是他鞠了一躬，跟着她们走了进去。他到了里面坐下来以后，她们请他喝了一些东西，大家都同意，在晚饭还没有准备好以前，为了", "尽量利用时间起见，她们中间有些人应该特别跟基督徒谈谈；她们选出了虔诚、贤慧和仁爱跟他谈话；她们就这样开始：虔诚说：喂，好基督徒，既然我们对你这么友爱，今天晚上在我们房子里接待你；要是对我们有帮助的话，让我们谈谈你旅途中所遇到的一切事情。", "基督徒说：我非常愿意，你们这样有兴趣，我很高兴。虔诚说：最初是什么使你投身于天路旅客的生涯？", "基督徒说：我耳朵里有一种可怕的声音驱使我离开我的家乡；就是说，如果我在原来的地方待下去，我就不可避免地要遭到毁灭。虔诚说：可是你怎么会这样离开家乡的？", "基督徒说：是照着神的意旨做的；因为我害怕遭到毁灭，又不知道往哪儿去好；我正在战抖、哭泣的时候，碰巧来了一个叫做宣道师的人，他指点我到那扇小门那儿去（不然的话，我决计找不到那扇小门的） ，我就这样被引到这条把我直接带到这房子来的路上。虔诚说：难道你没有经过解释者的住宅吗？", "基督徒说：有，在那儿还看到些我一辈子也忘不了的事情；尤其是那三件事情 ——那就是，尽管撒但的破坏，基督依然一直在人心里维持着恩典的工作；那个人怎样继续犯罪，弄到没有希望得到神的怜悯的地步；还有那个在睡眠中以为审判的日子已经来到的人所做的梦。虔诚说：怎么，他把他的梦告诉了你吗？", "基督徒说：是的，而且我认为那是一个够可怕的梦。在他告诉我的时候，我吓得心惊肉跳；可是现在我倒觉得很高兴能听到那个梦。虔诚说：你在解释者家里所看到的就是这些吗？", "基督徒说：不，他还带我去看一座雄伟的宫殿，里面的人都穿着黄金般的衣服；我还看见一个大胆的人来到宫殿门前，有一批穿戴盔甲的人站在门口不让他进去，他在他们中间冲了过去，后来他给请进宫去，赢得了永恒的荣耀。我觉得那些情景使我全心向往！我本来可以在那个好人的家里耽上一年，但是我知道我得赶路。虔诚说：你在路上还看到什么吗？", "基督徒说：看到什么！咳，还没有走多远，我就看见一个人，就像我所想象的那样，挂在十字架上直淌着血；一见到他，我的负担顿时就从背上落了下来；我本来给重担压得直呻吟，可是那时侯它从我身上滑了下来。这在我身上是件奇妙的遭遇，因为我从来没有碰到过这种事情；我正抬头看的时候（因为那时我没法不看） ，三个全身发亮的人向我走来。其中一个见证说我的罪已经得到赦免；另一个脱掉我身上褴褛的衣服，给我穿上这件你现在看到的绣花的外衣；第三个在我额上印了这个你现在看见的记号，还给我这本盖了印的小册子（说着他从怀里把它掏出来） 。", "看门人向谨慎介绍基督徒。虔诚说：不过你看到的还不止这些吧，对不对？"], "en_paras": ["PIETY. But how did it happen that you came out of your country this way?", "CHR. It was as God would have it; for when I was under the fears of destruction, I did not know whither to go; but by chance there came a man, even to me, as I was trembling and weeping, whose name is Evangelist, and he directed me to the wicket-gate, which else I should never have found, and so set me into the way that hath led me directly to this house.", "PIETY. But did you not come by the house of the Interpreter?", "CHR. Yes, and did see such things there, the remembrance of which will stick by me as long as I live; especially three things: to wit, how Christ, in despite of Satan, maintains his work of grace in the heart; how the man had sinned himself quite out of hopes of God's mercy; and also the dream of him that thought in his sleep the day of judgement was come.", "PIETY. Why, did you hear him tell his dream?", "CHR. Yes, and a dreadful one it was. I thought it made my heart ache as he was telling of it; but yet I am glad I heard it.", "PIETY. Was that all that you saw at the house of the In
