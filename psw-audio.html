body fluids. - Ensure that your underclothing cannot be seen through your uniform. - Keep your hair away from your face and up off your collar. - Use makeup sparingly. Avoid chewing gum. - Be aware that cigarette smoke and cooking odours can be absorbed into your uniform. These odours can be unpleasant to many clients. - Do not wear perfume, cologne, or aftershave. Strong scents may cause nausea or breathing problems in some clients. - Keep fingernails clean, short, and neatly shaped. Long nails can scratch the client. Artificial nails present an infection risk to clients, so they are not appropriate for support workers in any setting. - Do not wear jewellery (even if parts of your body are pierced). Jewellery may scratch or cause injury to your client and yourself and may pose infection-control risks. It may offend some clients as well. - Depending on your agency's policies, you may be asked to cover tattoos that may offend some clients.", "cn_text": "端庄、职业、得体的个人仪表，彰显出你对受助案主、医护同事以及对你自身的崇高尊重，它向外界无声传递出一个明确的信号：你无比庄重、严谨地对待自己的神圣工作。 BOX 1.2 专业仪表 13 项实践金科玉律： 1. 严格遵守着装制度：无条件执行雇主机构关于工作制服的一切着装规定。 2. 工服洁净合身端庄：穿着干净整洁、合身得体、端庄不起褶皱的工作制服（Scrubs）。 3. 佩戴官方身份胸卡：严格依规佩戴印有个人全名及照片的正式工号胸卡。 4. 袜履洁净无破损：穿着干净、无抽丝破损、色调合宜的袜子。 5. 专业安全防护鞋：穿着舒适、防滑、支撑力强且容易消毒的专用医护鞋；鞋面必须形成坚固屏障，切实保护双脚免遭体液污物溅洒伤害。 6. 严防内衣外透：务必确保内衣颜色与轮廓绝不会透过工作制服被外界隐约透视。 7. 长发利落盘起束后：长发必须整齐盘起束于脑后离开衣领，严防头发遮面、落入伤口或餐盘。 8. 妆容清淡禁嚼口香糖：仅允许化极淡职业妆；在值班和照料长者时绝对严禁咀嚼口香糖。 9. 严防二手烟与厨房油烟：必须清醒认识到烟草烟雾与烹饪油烟极易被工服纤维吸收；这些刺激性异味会令衰弱病患极其厌恶恶心。 10. 坚决执行“绝对无香化”政策：绝对严禁喷涂任何香水、古龙水、须后水或使用浓香护肤品！浓烈香精气味会直接诱发呼吸道脆弱长者的哮喘发作、剧烈咳嗽甚至呼吸衰竭。 11. 指甲修短圆润坚决杜绝假指甲：指甲必须保持洁净、剪短磨圆，防止在翻身清洁时划破脆弱皮肤；假指甲（Artificial Nails）缝隙极易藏匿多重耐药超级细菌，是引发医院交叉感染的高危元凶，在任何照护场景下均绝对禁止留贴假指甲！ 12. 禁止佩戴任何饰品：严禁佩戴首饰与吊坠饰物（即使身体有穿孔）。饰物极易刮伤长者脆弱皮肤，易在失智长者撕扯中扯裂耳垂，形成严重感控隐患，且可能冒犯某些长者。 13. 遮盖潜在冒犯性刺青：根据机构制度，在岗期间必须通过长袖等方式妥善遮盖可能令某些长者感到不安或冒犯的文身图案。 ![Figure 1.3 Well-Groomed Support Worker](../images/chapter01/fig13wellgroomedworker.png) 图 1.3 教学图示：标准职业仪表支持工作者示范 FIGURE 1.3: This support worker is well groomed. Her uniform and shoes are clean. Her hair is worn in a simple style and is kept out of her face and off her collar. She is not wearing any jewellery, except a watch. Her name tag is easily visible and approved by her employer. (Source: Sorrentino, S. A. [2000]. Mosby's textbook for nursing assistants [5th ed., p. 37]. Mosby.)"}, {"section_idx": 28, "title_en": "Confidentiality, Lifelong Learning & Advocacy", "title_zh": "走廊交谈防窃听、终身进修与敢于为案主发声 (Confidentiality, Lifelong Learning & Advocacy)", "start_time": 2312.14, "end_time": 2395.01, "duration": 82.87, "en_text": "...never talk with a client about another client, even if you avoid using names. Also, avoid talking about clients, co-workers, and your employer where you can be overheard; if you need to discuss a client's care with team members, make sure that other clients, families, and visitors cannot hear you. People overhearing may think you are talking about them or their family members. This assumption can lead to misinformation and confusion, which can be distressing to those affected. - Lifelong learning: Equipment and techniques for caring for clients can become outdated, and it is the responsibility of all caregivers to keep current with the information that affects the care they give. To keep your knowledge up to date, attend workshops and in-services that are offered by your employer, get clarifications from your supervisor, and read up about new equipment or practices that you are uncertain about. - Advocating for the client: Support workers will often make important observations about the client or family, and these observations must be communicated to the health care team. Sharing this information is especially important if a client is unable to speak for themselves. It is also the responsibility of professionals to avoid taking shortcuts in their care, as doing so may seriously harm the client. Shortcuts include taking longer breaks, skipping tasks listed on the client's care plan, or failing to apply theory on hygiene learned in school to client practice.", "cn_text": "- 走廊与公共区域绝不妄议案情：在任何时候，绝不可当着一名服务对象的面去议论另一名服务对象，哪怕你刻意隐去了姓名！此外，坚决杜绝在任何可能被旁人无意听到的场所（如病区走廊、电梯间、茶水间、餐厅）谈论案主、同事或雇主；如果确需与医护同仁交接探讨某位案主的病情，必须确保其他长者、家属及来访访客绝对听不到你们的谈话内容。路过偷听到的旁人极易误以为你们是在窃窃私语讨论他们自己或其患病的家属；这种误解与猜疑会导致严重的信息混乱、信任破裂与当事人的心理创伤。 - 终身学习与业务精进（Lifelong learning）：临床照护所使用的仪器设备与操作指南随时在更新换代，时刻掌握与自己所提供照护密切相关的最新医学资讯，是每一位护理工作者的法定义务。为了确保专业知识与时俱进，必须积极参加雇主组织的业务培训和在职工作坊（In-services），虚心向上级督导请教，并主动研读掌握自己尚不熟悉的新设备或新技术规范。 - 勇于为服务对象代言发声（Advocating for the client）：支持工作者朝夕相处，往往能最敏锐观察到案主或家属的细微心理生理异常，这些关键观察必须第一时间准确汇报给跨学科团队。当案主本身失语、认知障碍而无法为自己辩护表达时，支持工作者的代言尤为神圣。同时，恪守职业道德意味着在临床照护中绝对严禁“走捷径 / 偷工减料”（Taking shortcuts）——走捷径会给脆弱案主带来致命伤害！典型的违规走捷径行为包括：擅自延长个人休息时间、擅自省略照护计划上规定的翻身或口腔护理步骤、或在临床实操中擅自抛弃学校里严谨教授的无菌洗手与消毒感控规程。"}, {"section_idx": 29, "title_en": "BOX 1.3 Keeping Personal Matters Out of Workplace", "title_zh": "BOX 1.3 严守界限：将私人琐事彻底排除在执业场所之外 (BOX 1.3 Keeping Personal Matters Out of Workplace)", "start_time": 2395.01, "end_time": 2492.74, "duration": 97.73, "en_text": "BOX 1.3: Keeping Personal Matters Out of the Workplace - Make personal calls only during scheduled breaks. Use a client's phone only for urgent matters. Always ask for permission before using a client's phone. - Do not discuss your personal problems at work. - Do not let your family and friends visit you at work. - Arrange your personal appointments outside of your scheduled work hours. - Do not use your employer's supplies or equipment for personal matters. - Do not try to raise funds at work, even if the funds are for a good cause. - Discretion about personal matters: Discretion in support work includes keeping personal matters out of the workplace. Your role is to focus on your clients and the task at hand. Do not discuss with clients your family matters and personal problems or the problems of others (BOX 1.3). No matter how well you think you know a client, remember that your relationship must remain professional. It would be inappropriate to discuss your personal problems with your client. - Using acceptable speech and language: The way you speak at home and in casual social settings may not be appropriate for a work setting. Even if you are speaking with a co-worker, others could hear you and be offended by what you say or how you say it. Your speech and language must remain professional while you are on the job. To avoid offending clients or co-workers, never use foul, vulgar, or abusive language. Also, avoid using slang. Speak gently and clearly; never yell or shout. And never fight or argue with clients, their family members, or your co-workers.", "cn_text": "BOX 1.3 执业纪律规范：将个人私事彻底排除在工作场所之外 1. 私人电话严格受限：仅允许在法定的工休排歇时间内接打私人电话。严禁使用案主家中的电话，除非发生紧急危重求救状况；即便紧急使用案主电话，亦必须事先征得案主明确许可。 2. 严禁在工作中诉苦宣泄：绝不可在工作场所与案主或同事讨论个人的婚姻矛盾、家庭琐事或经济债务危机。 3. 谢绝亲友工作探访：绝不可让家人、朋友或孩子在你的工作时间前往照护现场探望陪聊。 4. 私人就医预约安排：看牙、体检、汽车年检等一切私人事务必须安排在排班工时之外。 5. 严禁公器私用：绝对不可将雇主或案主家的消毒液、手套、洗涤耗材或打印纸张据为私用。 6. 严禁在工作场所募捐或推销：绝对严禁在工作场所向长者、家属或同事推销个人产品或搞筹款集资，哪怕出于慈善目的。 - 对个人隐私保持职业克制（Discretion about personal matters）：专业素养要求将一切个人私事完全排除在照护现场之外。你的天职是全身心聚焦于眼前的服务对象和正在执行的护理任务。无论你自认为与某位长者多么熟稔亲密，时刻切记：你们之间是神圣严肃的医患职业关系，绝非世俗的私人密友！向患病长者倾倒你个人的家庭烦恼是极度不专业、自私且严重失德的行为。 - 文明得体的职业语言规范（Using acceptable speech and language）：你在自己家里或非正式社交场合中的随意说话方式，在医疗工作场所中是完全不适宜的。即便你只是在和同事闲聊，旁人亦极易听见并受到冒犯。在执业期间，你的言辞谈吐必须时刻展现专业修养。为了避免伤害服务对象或冒犯同事，绝对严禁使用任何粗鄙脏话、低俗词汇、侮辱性或虐待性字眼！尽量避免使用市井俚语。说话必须轻柔、温和而吐字清晰；严禁大喊大叫！在任何情形下，绝对严禁与服务对象、家属或医护同事发生言语争吵或肢体冲突！"}, {"section_idx": 30, "title_en": "Client-Centred Care & DIPPS Acronym", "title_zh": "以服务对象为中心的核心内涵与 DIPPS 六大基石 (Client-Centred Care & DIPPS Acronym)", "start_time": 2492.74, "end_time": 2655.91, "duration": 163.18, "en_text": "THE GOAL OF SUPPORT WORK: IMPROVED QUALITY OF LIFE THROUGH CLIENT-CENTRED CARE Client-centred care (also known as compassionate or person-centred care) or caring means having concern for the dignity, independence, preferences, privacy, and safety of clients and their families at all times. It is important that any communication with or care given to a client be individualized for that client. The goal of support work is to demonstrate true client-centred care by following this principle and treating clients with kindness, honesty, sensitivity, comfort, discretion, respect, and understanding. Many people who require support are coping with serious illness, disability, personal issues, or challenges, and they depend on the care given to them for survival and improved quality of life. The acronym DIPPS is a reminder of the six principles of client-centred care—Dignity, Independence, Individualized care, Preferences, Privacy, and Safety—which is the goal of support work: - To preserve their dignity: Dignity is the state of feeling worthy, valued, and respected. People need to feel dignified. - To live independently: Clients need to do what they can for themselves. - To have all care individualized for each client: No person is identical to another person, so care should be personalized to each client. - To express their preferences: Clients need to make choices and explain how they want to have things done. - To preserve their privacy: Clients need to know that their bodies and their affairs are treated respectfully and protected from public view (FIGURE 1.4). - To be safe from harm: Clients need to live in an environment that is as hazard free as possible. They also need to feel secure about the care provided. When well and able-bodied, most people take the fulfillment of the six needs listed above for granted. When they are living with disabilities or suffer serious illnesses, however, these needs may be more difficult to fulfill. Those who rely on others for personal care may worry about losing their dignity, and they may not feel free to express their wishes. For example, clients living in long-term care facilities may have to eat what is provided and socialize only at prearranged times. They may share a room with another client and find that private moments are rare. Safety concerns are serious issues for clients with illnesses or disabilities. For example, they may worry about reaching the bathroom without falling. Clients with illnesses or disabilities do not all have the same needs. However, most have at least some of the needs just discussed. To help you recognize clients' needs, Providing Client-Centred Care boxes throughout the text discuss the goal of support work, which is to follow the principles of client-centred or compassionate care when performing procedures with clients (BOX 1.4).", "cn_text": "支持工作的终极崇高宗旨：通过“以服务对象为中心的人本关怀”全面改善生活品质！ “以服务对象为中心的照护”（Client-centred care，亦被称为慈爱关怀 Compassionate care 或以人为本的人性化照护 Person-centred care）的核心内涵在于：在任何时候，对长者及其家属的人格尊严、自立自理能力、个性化偏好、隐私权及生命安全始终怀抱深切真诚的关切。支持工作者与案主的每一次沟通交谈、所实施的每一项具体照护操作，都必须针对该个体的独特情况实现高度的“个性化定制”（Individualized）。支持工作的终极崇高使命，就是通过秉持这一原则，以仁善、诚实、敏锐、舒适、克制、尊重与深刻理解去善待每一位长者。许多需要支持照料的人士都在苦苦抵御重病折磨、严重残障或人生重大危机；他们完全依赖我们所给予的照料来维系生存并重获生命的尊严。 首字母缩略词 DIPPS 是时刻警醒我们践行以服务对象为中心照护的六大根本伦理原则——即尊严、自立、个性化、偏好、隐私与安全： 1. 捍卫人格尊严（Dignity）：尊严是个体感受到自身有价值、受重视与受尊敬的精神心理状态。任何人都需要活得有尊严； 2. 激发自立生活（Independence）：案主需要尽其最大可能亲手完成自己尚有能力完成的事情，绝不包办替代； 3. 全程个性化定制（Individualized care）：世界上没有任何两个人是完全相同的，因此照护措施绝不可千篇一律，必须因人而异量身定制； 4. 尊重自主偏好与选择权（Preferences）：案主拥有自主做出选择并明确表达他们希望如何被照护的绝对权利； 5. 神圣捍卫身体与生活隐私（Privacy）：案主需要切实体会到自己的身体躯干与个人私人事务受到极度尊重，严防暴露在公众视线之下（参见图 1.4）； 6. 远离伤害确保安全（Safety）：案主需要在尽可能零危险隐患的环境中生活，且对所接受的照护怀有充分的安全信任感。 在身体健全健康时，大多数人往往将这六项基本生存需要的满足视作理所当然；然而，一旦身患残疾瘫痪或遭遇重病打击，这些基本需要的满足便会变得异常艰难。那些连擦洗如厕都不得不依赖他人协助的长者，时刻深陷在丧失人格尊严的巨大恐慌之中，他们往往不敢自主表达内心的真实意愿。例如，长住长期照护机构的老人往往只能吃配餐提供的固定食物，只能在规定时间参加活动，往往需要与陌生病友共居一室而几乎毫无私密空间。跌倒等安全顾虑更是心腹大患——许多长者每天都在恐惧自己独自下床去洗手间时会不会再次跌倒骨折。 患病或残障的长者虽然具体需求各不相同，但绝大多数都深刻经历着上述心理困境。全书中贯穿设立的“提供以服务对象为中心的照护”（Providing Client-Centred Care）特色专栏，时刻指导学员在临床为长者执行每项操作时，必须严格贯彻落实 DIPPS 人本照护基石（参见 Box 1.4）。 ![Figure 1.4 Client Phone Privacy](../images/chapter01/fig14clientphoneprivacy.png) 图 1.4 教学图示：保护服务对象的通话与书信隐私权 FIGURE 1.4: A client talks privately on a telephone. (Source: Sorrentino, S. A. [2008]. Mosby's textbook for nursing assistants [7th ed., p. 137]. Mosby.) 【临床启示】即便长者身患重病入住机构，其私人居室依然是其神圣不可侵犯的领地。服务对象的私人通话、信件及个人物品受法律严格保护，未经许可严禁偷听偷窥。"}, {"section_idx": 31, "title_en": "BOX 1.4 DIPPS Action Steps", "title_zh": "BOX 1.4 DIPPS 临床实践十项落地行动准则 (BOX 1.4 DIPPS Action Steps)", "start_time": 2655.91, "end_time": 2760.91, "duration": 105.0, "en_text": "BOX 1.4: DIPPS—Principles of Client-Centred Care, the Goal of Support Work When performing every procedure listed in this textbook, it is important to advocate on behalf of the client's quality of life by promoting: Dignity • Independence • Individualized Care • Preferences • Privacy • Safety To do so, take the following steps: - Check the client's care plan before starting any procedure to familiarize yourself with the client's personalized care plan, personal preferences, and safety considerations. - Knock before entering the client's room. - Address the person by name, and introduce yourself using your name and title. - Explain the procedure before starting and explain each step throughout the procedure. Informed clients are usually more willing to assist and less likely to react out of fear. Accordingly, they are less likely to injure themselves or their caregivers during the procedure. - Obtain the client's consent for any procedure before starting. - Ensure that all care is tailored to respect the diversity of each client. - Protect the person's rights throughout the procedure, including the person's right to privacy. - Identify the client's ability to perform the procedure and guide the client to self-assist so as to remain as independent as possible. - Handle the person gently during the procedure and observe safety guidelines at all times to minimize the risk for injury to the client or to yourself. - Follow standard practice to decrease the risk for pathogen spread. Critical thinking, decision making, and problem-solving are crucial to the support worker's role but are often difficult when a person is new to the job. To help you with the problem-solving process, this text includes Supporting boxes that present examples of problems faced by support workers and how the problems were solved.", "cn_text": "BOX 1.4 原书操作规范：DIPPS 人本照护实践十步标准法 在执行本教材所列出的每一项临床操作程序时，支持工作者必须始终站在维护服务对象生命品质的立场上，全力捍卫： 尊严（Dignity）• 自立（Independence）• 个性化（Individualized Care）• 偏好（Preferences）• 隐私（Privacy）• 安全（Safety） 具体必须严格执行以下十步标准化行动程序： 1. 操作前必核对护理计划（Check Care Plan）：在开始执行任何操作前，必须首先仔细查阅案主的个性化护理计划，全面熟悉其个性化需求、个人偏好及安全注意事项； 2. 进门前必须先敲门（Knock Before Entering）：进入案主居室前务必先轻声敲门，等待应允后再进入； 3. 亲切尊称姓名并主动自报家门（Address by Name & Introduce Yourself）：使用其偏好的尊称称呼长者，主动报出自己的全名及职业头衔（如：“李奶奶您好，我是您的支持工作者王明”）； 4. 操作前及操作全过程务必详细解释（Explain the Procedure）：在开始前详尽解释要做什么，并在操作全过程中解释每一步正在做什么。获得充分知情的长者通常更乐意主动配合，且更不易因惊恐而产生抗拒抵抗反应；因此，能够极大规避长者自伤或弄伤护理员的职业暴露风险； 5. 操作前必须获得长者知情同意（Obtain Consent）：在实施任何身体接触与照护操作前，必须首先征得长者的知情同意； 6. 依从文化多样性个性化施护（Respect Diversity）：确保所有照护细节均尊重每位长者的文化、信仰及个人生活习惯的多样性； 7. 全过程捍卫人权与隐私权（Protect Rights & Privacy）：在整个操作过程中严守隐私，拉合床帘、关闭房门，操作中仅暴露正在清洗或治疗的身体部位，严防身体裸露； 8. 评估自理能力并鼓励自主参与（Promote Independence）：精准评估长者残存的自理功能，鼓励并引导长者自己动手做力所能及的动作，维系其最大限度的自立机能； 9. 轻柔操作并严守安全规范（Handle Gently & Observe Safety）：动作轻柔敏捷，时刻遵守人体工效学与安全规范，锁定轮椅与床刹，将长者与自身的损伤风险降至最低； 10. 严格执行标准感染控制规程（Follow Infection Control Practices）：严格落实手部卫生、规范佩戴手套与防护用品，彻底切断病原体交叉传播途径。 批判性思维、临床决策与解决实际问题是支持工作者角色的核心灵魂，但对初入职场的新人而言往往充满挑战。为了帮助大家掌握科学的问题解决全流程，本教材在各章中特别设计了“临床支持实战案例”（Supporting boxes）特色专栏，生动呈现一线支持工作者所遭遇的真实伦理困境与照护难题，并剖析最佳破解之道。"}, {"section_idx": 32, "title_en": "Critical Thinking & Four Pillars of Problem-Solving", "title_zh": "临床批判性思维与问题解决的四大决策支柱 (Critical Thinking & Four Pillars of Problem-Solving)", "start_time": 2760.91, "end_time": 2825.93, "duration": 65.02, "en_text": "CRITICAL THINKING, DECISION MAKING, AND PROBLEM-SOLVING Support workers think critically and make many decisions in the course of a workday. For example, they estimate the time each task will take and plan the best way to complete their work on time, taking into account the various needs of the client. Many decisions involve critical thinking in order to solve problems. When solving problems, consider the following: - The goal of support work: Solutions to problems should not compromise the six principles of client-centred care: dignity, independence, individualized care, preferences, privacy, and safety, or DIPPS. - The client's viewpoint: Involve clients in solving problems that concern them. Examine the problem from the client's point of view. - Scope of practice: Learn and observe the rules of your workplace. Know the limits of your role. - Supervisor's viewpoint: Decide if the problem is one that you can handle on your own or one that your supervisor should handle. Your supervisor should provide guidance about which problems you can deal with on your own.", "cn_text": "临床批判性思维、临床决策与照护问题解决 在每天的工作流程中，支持工作者无时无刻不在运用批判性思维做出大量的临床决策。例如，在兼顾服务对象多维需求的前提下，合理预估每项护理任务所需的时间跨度，并科学规划出确保在排班时间内高质量完工的最优工作路径。许多日常决策都必须依托批判性思维来解决错综复杂的现场问题。 在面对临床难题进行问题解决与决策时，支持工作者必须立足于以下四大核心支柱进行系统考量： 1. 始终对齐支持工作的终极宗旨（The Goal of Support Work）：任何问题的解决方案，都绝不可牺牲或损害“以服务对象为中心”的 DIPPS 六大根本基石（尊严、自立、个性化、偏好、隐私与安全）。 2. 充分站在服务对象的立场视角（The Client's Viewpoint）：只要该问题涉及长者自身，就必须主动邀请长者共同参与探讨解决；必须设身处地从长者的视角与切身利益来审视审判问题。 3. 严守法定执业范围红线（Scope of Practice）：熟练掌握并严格遵守所在机构的规章制度与省级法律界限，清醒知晓自己角色的权力极限，严禁越权擅断。 4. 深刻理解上级督导的专业视角（Supervisor's Viewpoint）：清醒辨析该问题究竟是属于自己有权独立现场解决的范畴，还是属于必须立即上报交由主管护士介入决策的范畴。主管督导护士应当就哪些问题支持工作者可以自主处置、哪些问题必须立即上报提供清晰的指引规范。"}, {"section_idx": 33, "title_en": "CHAPTER REVIEW · KEY POINTS", "title_zh": "核心知识要点总结 (CHAPTER REVIEW · KEY POINTS)", "start_time": 2825.93, "end_time": 2999.38, "duration": 173.45, "en_text": "CHAPTER REVIEW · KEY POINTS - The ultimate goal of support work is to improve the client's quality of life by following the principles of client-centred care (DIPPS). The support worker tends to the person's needs, which include physical needs as well as helping to relieve loneliness, providing comfort, encouraging independence, and promoting the person's self-respect. Care should always be individualized to each client. A support worker's services to people in their homes help them remain independent and continue to live with their families. Support workers make a difference in people's lives. - Support workers can work in community-based or facility-based settings. Duties will vary according to the setting. - Most of a support worker's responsibilities can be grouped into six categories: (1) personal care, (2) support for nurses and other health care providers, (3) family support, (4) social support, (5) housekeeping or home management, and (6) documenting and reporting any basic assessments, observations, and care provided in the client's record or chart. - Depending on their setting, people receiving health care and support services are known by different terms, such as patient (in a hospital), resident (in a live-in facility), or client (in the community). - The people supported can be grouped according to their problems, needs, and ages. - At this point, support workers in most provinces and territories are still considered health care providers not regulated through legislation, or unregulated care providers (UCPs). Support workers are accountable to their supervisors, employers, and clients; they do not presently have an organization or college that governs their role. Regulated care providers are health care providers licensed and regulated by the province or territory to carry out care that is within their scope of practice. - There are many members of the health care team, with the client always at the centre of care. - It is important that support workers understand their scope of practice and never act beyond their role. - In many settings, support workers are supervised by nurses or other professionals. - Professionalism includes having a positive attitude, a sense of responsibility, a professional appearance, being discreet about client information, being a lifelong learner, advocating for the client, being discreet about personal matters, and using acceptable speech and language. - While discussing the client with co-workers, support workers must use discretion at all times and honour the client's right to confidentiality. Confidentiality means respecting and guarding personal and private information about another person. - Part of being a professional, reflective practice reviews consist of a review and self-evaluation of any care provided and identification of ways to improve clinical performance. - When thinking critically, making decisions, and solving problems, support workers must consider the principles of client-centred care (DIPPS), the client's viewpoint, their scope of practice, and their supervisor's viewpoint.", "cn_text": "第 1 章核心知识要点权威回顾（KEY POINTS）： 1. 支持工作的终极使命：支持工作的根本宗旨在于践行 DIPPS 六大人本原则以提升长者的生命品质。支持工作者全方位满足长者的身心需求，排遣孤独、倾注温情抚慰、激发自主自立、维护人格尊严。照护必须全程个性化。入户服务能赋能长者在熟悉的家中自立生存，支持工作者真正改变了他人的生命轨迹。 2. 执业场所多样性：支持工作者既可执业于社区环境亦可执业于院舍机构，具体职责随场所特性动态调整。 3. 六大核心职责体系：(1) 个人生活照料；(2) 协助护士及其他医护人员；(3) 家庭系统支持；(4) 社交人际支持；(5) 家务管理；(6) 基础评估、观察所见与照护记录书面汇报。 4. 受助人群的三大称谓：医院中称为患者（Patient），全寄宿机构中称为院舍长者（Resident），社区家庭中称为案主（Client），通称为服务对象。 5. 受助人群九大分类：可依据健康问题、多维需求与年龄跨度清晰归纳为九大核心类别。 6. 未受监管照护者（UCPs）法定属性：目前在绝大多数省份支持工作者属于 UCPs，向督导、雇主及案主问责，暂无专门法定行业公会直接发牌管理；而受监管专业人员（如护士、医生）由省级专业公会直接发牌规制。 7. 以案主为中心的跨学科团队：医疗团队汇聚多学科专业力量，但服务对象始终处于整个照护体系的正中央核心。 8. 执业范围红线原则：深刻领悟所在省份教育标准与雇主制度所界定的执业范围（Scope of Practice），绝不擅自越权。 9. 多层级督导机制：在绝大多数场景下，支持工作者接受注册护士（RN）或实用护士（RPN/LPN）等专科人员的临床督导。 10. 专业素养八大支柱：专业素养涵盖积极阳光态度、高度责任心、专业规范仪表、案主信息保密审慎、终身学习、敢于为长者发声、将个人私事完全排除于职场外、文明合宜的语言谈吐。 11. 信息隐私保密权（Confidentiality）：与同事探讨案情时必须严守保密义务，尊重并全力捍卫服务对象的一切个人健康与私人隐私信息。 12. 反思性执业回顾（Reflective Practice Review）：作为专业素养的核心，从业者必须定期对自身实施的各项照护进行批判性自省评估，确保持续精进临床操作品质。 13. 临床决策四大维度：在运用批判性思维解决问题时，必须综合平衡 DIPPS 人本照护宗旨、案主切身视角、法定执业范围以及上级督导的专业指引。"}, {"section_idx": 34, "title_en": "CRITICAL THINKING IN PRACTICE", "title_zh": "临床实践中的批判性思维案例情境 (CRITICAL THINKING IN PRACTICE) (Page 18)", "start_time": 2999.38, "end_time": 3024.89, "duration": 25.51, "en_text": "CRITICAL THINKING IN PRACTICE In the clinical setting, a resident tells you that she has been getting out of bed on her own at night, even though she was instructed to ask for assistance whenever ambulating. She has fallen several times in the past and fractured her wrist the last time she fell. How will you respond? What will you do? As a student, what rules must you follow to protect patients and residents?", "cn_text": "在临床长照机构实习中，一位长期入住的长者悄悄告诉你：她最近每天夜间都自己偷偷下床走动去洗手间，尽管医护团队三令五申要求她每次离床走动前必须按呼叫铃寻求人员协助。该长者过去曾多次发生严重跌倒，在上一次跌倒中甚至导致了手腕粉碎性骨折。老人家哀求你替她保守这个“秘密”，不要告诉护士。 - 你应当如何与长者沟通回应？ - 你必须立刻采取什么临床行动？ - 作为一名实习学员或在职支持工作者，你必须严格遵守哪些安全铁律来全力保护病患与长者的生命安全？ 【权威临床决策精解与实战行动准则】 1. 治疗性沟通与共情劝导：切勿用严厉生硬的口吻训斥长者。首先以温和共情的态度肯定其渴望自主自立的心情，但必须耐心向其解释：既往多次跌倒且伴有严重骨折史，夜间视线昏暗、突发体位性低血压极易再次发生致命跌倒，可能导致严重的股骨颈骨折、长期卧床、完全丧失自理能力甚至危及生命。 2. 果断干预与团队安全闭环汇报：离开房间前立即落实跌倒防范措施：确保病床摇降至最低安全高度，将呼叫铃手柄放置在长者健侧唾手可及之处，清理床旁与地面一切障碍物，开启夜间照明地灯。最为关键的一步：支持工作者绝不可为了向长者盲目承诺而隐瞒安全隐患，必须在离开房间后第一时间立即向当班主管督导护士（Supervising Nurse）如实汇报该高危隐患！以便跨学科团队紧急重新评估长者的跌倒风险指数，调整防跌倒干预计划（如安装离床重力感应报警垫、提高夜间巡视频率等）。 3. 实习学生守则与伦理底线：生命安全（Safety）在支持工作一切价值排序中始终位列最高优先级！支持工作者绝不能隐瞒长者的高危行动。对案主生命安全和严重躯体伤害的预防，具有绝对的压倒性，绝对优先于长者个人“不愿声张”的盲目要求。"}]}, {"ch_num": 2, "title_en": "The Canadian Health Care System", "title_zh": "加拿大医疗卫生保健体系", "audio_url": "audio/psw/ch2_master.mp3", "duration": 1818.22, "size_bytes": 14546434, "voice": "en-CA-LiamNeural", "timeline": [{"section_idx": 1, "title_en": "Objectives", "title_zh": "学习目标 (Objectives)", "start_time": 0.0, "end_time": 41.04, "duration": 41.04, "en_text": "After reading this chapter, the learner should be able to do the following: • Describe medicare and how it has evolved. • Identify the federal, provincial, and territorial roles in the Canadian health care system. • Summarize the principles of medicare described in the Canada Health Act. • Differentiate among primary, secondary, and tertiary health care deliveries. • Identify how the focus of the Canadian health care system is shifting to home care. • Explain why health promotion and disease prevention are important functions of the Canadian health care system. • Recognize the emerging importance of home care and the support worker's role in providing some of these services.", "cn_text": "完成本章研读后，学习者应当能够达成以下核心专业能力考核目标： • 阐述加拿大公费全民医疗保险体系（Medicare）的本质特征及其历史演进脉络。 • 明确界定加拿大联邦政府、各省及地区政府在国家医疗卫生体系中各自承担的法定职能与分工。 • 提炼并熟练掌握《加拿大健康法案》（Canada Health Act）所确立的全民医疗五大核心基石原则。 • 准确鉴别与区分初级、二级与三级医疗卫生照护服务（Primary, Secondary, and Tertiary Care）的执业场景与临床内涵。 • 深入理解并辨识加拿大医疗卫生服务重心从传统医院机构向社区居家照护（Home Care）深刻战略转移的时代背景与动因。 • 深入阐释“健康促进”（Health Promotion）与“疾病预防”（Disease Prevention）为何成为现代加拿大医疗卫生体系不可或缺的核心功能。 • 深刻认识居家照护日益凸显的战略地位，以及支持工作者在向案主提供这些基础支持服务中所发挥的关键前沿角色。 【核心专业术语表】Chapter 2 Key Terms (Page 21) | 英文核心术语 (Key Term) | 音标 (Phonetic) | 权威中文译名 | 原版学术定义与临床内涵 (Definition & Clinical Context) | | :--- | :--- | :--- | :--- | | accessibility | /əkˌsɛsəˈbɪləti/ | 可及性 / 获得合理照护原则 | 《加拿大健康法案》五大基石原则之一。明确规定所有居民必须在不受任何额外财务阻碍或歧视的前提下，公平、合理地获得受保医疗服务。 (p. 22) | | benefits | /ˈbɛnɪfɪts/ | 补充医疗保险福利 | 通过所缴纳的保险保费或雇主保险所提供的特定医疗补助服务。例如由牙医执行且消费者无需自付额外费用的牙科医疗项目。 (p. 30) | | Canada Health Act (1984) | /ˈkænədə hɛlθ ækt/ | 《加拿大健康法案》 (1984) | 奠定加拿大全民公费医疗的联邦核心根本大法。界定了受保医疗服务的法定范围，并确立了各省/地区为获取联邦全额医疗现金拨款所必须严格遵守的五大准则（全面性、普遍性、便携性、可及性与公立管理）。 (p. 21) | | comprehensiveness | /ˌkɒmprɪˈhɛnsɪvnəs/ | 全面性原则 | 《加拿大健康法案》五大基石原则之一。明确规定该保险计划必须全面覆盖医院内所有医学必需服务，以及医师与口腔颌面外科医生所提供的必需治疗。 (p. 22) | | disease prevention | /dɪˈziːz prɪˈvɛnʃən/ | 疾病预防 | 旨在阻止疾病、身体机能损伤或意外创伤发生的一系列前置干预策略与公共卫生行动。 (p. 31) | | health promotion | /hɛlθ prəˈmoʊʃən/ | 健康促进 | 通过为个人、群体和整个社区提供关键卫生科普知识与行动工具，赋权大众做出明智健康抉择，从而全面增进与维护人群健康福祉的战略举措。 (p. 31) | | home care | /hoʊm kɛər/ | 居家照护 / 上门支持服务 | 在服务对象个人居住住所（包括私人家庭、辅助生活居所或持牌照护住所）内所提供的医疗卫生与生活支持服务。 (p. 27) | | medicare | /ˈmɛdɪˌkɛər/ | 加拿大全民公费医疗系统 | 加拿大的全国性医疗卫生保险体系，通过公共税收全额资助，为所有永久居民和公民提供免自费的医学必需医疗服务。 (p. 21) | | portability | /ˌpɔːrtəˈbɪləti/ | 可携带性 / 跨省便携原则 | 《加拿大健康法案》五大基石原则之一。确保居民在跨省求学、搬迁、换工作、境内旅游或在海外短期停留期间，仍能持续享受原居住省份所提供的医疗保障。 (p. 21) | | primary health care delivery | /ˈpraɪmɛri hɛlθ kɛər/ | 初级卫生保健服务 | 居民与医疗保健体系发生的第一道接触点（如家庭医生门诊、执业执照护士门诊、社区诊所或远程健康热线），聚焦于健康促进与早期筛查。 (p. 25) | | public administration | /ˈpʌblɪk ədˌmɪnɪˈstreɪʃən/ | 公立非营利性管理原则 | 《加拿大健康法案》五大基石原则之一。明确规定各省的公费医疗保险计划必须由非营利性的公共法定机构全权行政主管，并向公众及立法机关完全公开负责。 (p. 22) | | quaternary care | /ˈkwɑːtərˌnɛri kɛər/ | 四级前沿超特精专医疗 | 三级医疗（Tertiary Care）的极度专精延伸层级，包含在顶级科研教学医院开展的高难度实验性药物疗法或开创性尖端复杂外科手术。 (p. 26) | | secondary health care delivery | /ˈsɛkənˌdɛri hɛlθ kɛər/ | 二级专业专科医疗服务 | 医疗照护的中级层级，涵盖专业评估、确诊与专科治疗，通常在具备精密医疗仪器设备和专业检验病理实验室的综合医院由专科医师执行。 (p. 26) | | telehealth | /ˈtɛliˌhɛlθ/ | 远程医疗健康呼叫中心 | 设立专用医疗健康电话呼叫中心网络（如安省 Telehealth Ontario / 811 热线），由注册护士 24 小时向致电公众提供专业的健康分诊咨询与就医指引。 (p. 26) | | tertiary health care delivery | /ˈtɜːrʃiˌɛri hɛlθ kɛər/ | 三级高阶专精重症医疗 | 在大型学术研究型教学医院所提供的高难度、高度技术密集型专精医疗服务（如重症监护、复杂心胸外科及神经外科）。 (p. 26) | | traditional healing | /trəˈdɪʃənl ˈhiːlɪŋ/ | 原住民传统医学与身心疗愈 | 融入加拿大原住民传统世界观的身心疗愈知识与实践体系，运用神圣仪式、动植物与矿物草药、能量疗法或身体推拿手法实现全人平衡。 (p. 24) | | universality | /ˌjuːnɪvɜːrˈsæləti/ | 全民普遍受保原则 | 《加拿大健康法案》五大基石原则之一。规定各省全体永久居民在完全相同的条款与条件下，人人享有均等的受保基础医疗卫生服务权利，严禁阶层差异。 (p. 22) |"}, {"section_idx": 2, "title_en": "Belief in Universal Access & Medicare", "title_zh": "崇高信念与全民公费医疗系统概述 (Belief in Universal Access & Medicare)", "start_time": 41.04, "end_time": 74.57, "duration": 33.53, "en_text": "Most Canadians believe that quality health care should be available to all Canadian citizens, regardless of their ability to pay for services. Canada's national health insurance system, known as medicare, which is envied throughout the world, was developed to achieve this goal. Medicare uses provincial or territorial taxes and federal taxes to pay for all medically necessary health services for all permanent residents. As members of Canada's changing health care system, support workers have an increasingly important role to play.", "cn_text": "绝大多数加拿大人坚信：每一位公民无论个人贫富、无论是否具备即时支付能力，都应当享有获得高品质医疗卫生服务的神圣权利。享誉全球并令世人称羡的加拿大国家医疗保险体系——通称“全民医疗体系”（Medicare）——正是为了践行这一崇高愿景而建立。Medicare 汇集各省/地区税收与联邦政府税收，共同出资全额支付所有永久居民在医学上所必需的一切医疗服务费用。作为身处这一不断变革与重塑的医疗卫生系统中的专业从业者，支持工作者（PSW / HCA）所肩负的使命与角色正变得前所未有的关键与崇高。"}, {"section_idx": 3, "title_en": "An Interlocking Public System", "title_zh": "联邦与省/地区交织的医疗管理架构 (An Interlocking Public System)", "start_time": 74.57, "end_time": 140.4, "duration": 65.83, "en_text": "CANADA'S CURRENT HEALTH CARE SYSTEM Canada's publicly funded health care system is best described as an interlocking set of health insurance plans, with the federal government and the 10 provincial and 3 territorial governments sharing responsibilities within Canada's health care system. The provincial and territorial governments fund health care services with assistance from the federal government. To receive their full share of federal funding for health care, provincial and territorial medicare plans must meet five criteria—comprehensiveness, universality, portability, accessibility, and public administration (see BOX 2.1 on page 22)—that are provided in the federal government's Canada Health Act. Medicare provides access to universal, comprehensive coverage for hospital and physician services that are medically necessary. These services are administered and delivered by the provincial and territorial governments to Canadian residents with no payment necessary upon delivery of the service. However, each province or territory is responsible for developing its own health care policies, so some policy inconsistencies may exist from one province to another.", "cn_text": "加拿大现行医疗卫生保健体系架构 加拿大由公共税收资助的医疗卫生保健体系，最贴切的描述是一个“环环相扣、相互咬合的医疗保险网络”：由加拿大联邦政府与 10 个省政府、3 个地区政府共同分工协作、分级承担管理权责。各省及地区政府在联邦政府财政专项转移支付（Canada Health Transfer, CHT）的鼎力协助下，直接规划、资助并组织实施境内的医疗照护服务。为了有资格全额申领联邦每年拨付的巨额医疗专款，各省与地区的医保计划必须无条件恪守联邦《加拿大健康法案》中所明文规定的五大核心准则：全面性、普遍性、便携性、可及性与公立管理（详见第 22 页 BOX 2.1）。 Medicare 为全加居民提供了全面覆盖所有“医学必需”的医院住院与执业医师诊疗服务的普惠保障。这些服务由各省和地区政府直接管理运营并交付到千家万户手中，受助居民在接受诊断治疗的当下无需掏出钱包支付任何医疗费用（即现场零自付费用）。然而，由于每个省份与地区拥有制定本辖区具体卫生行政政策的宪法自主权，因此在不同省份之间，具体的资助细节和边缘服务覆盖范围存在一定程度的地区差异与政策不一致。"}, {"section_idx": 4, "title_en": "The Five Principles of Medicare", "title_zh": "BOX 2.1 《加拿大健康法案》规定的全民医疗五大准则 (The Five Principles of Medicare)", "start_time": 140.4, "end_time": 237.22, "duration": 96.82, "en_text": "BOX 2.1: The Principles of Medicare, as Listed in the Canada Health Act (1984) 1. Comprehensiveness. The insurance plan must pay for all medically necessary services. In a hospital, all necessary drugs, supplies, and diagnostic tests are covered. A range of necessary services provided outside a hospital are also covered. 2. Universality. Every permanent resident of a province or territory is entitled to receive the insured health care services provided by the plan, on similar terms and conditions. 3. Portability. People can keep their health care coverage even if they are unemployed, change jobs, relocate between provinces and territories, or travel within Canada or abroad. However, if they are moving, it is their responsibility to inform their province or territory and to register with their new province or territory. During the transition, they will be covered by their previous jurisdiction's health coverage for up to 3 months (see Supporting Mr. Wloch: An Example of Canada's Health Insurance Portability box on page 31). 4. Accessibility. People can receive medically necessary services regardless of their income, age, health status, gender, or geographical location. Additional charges (privatization) for publicly insured services are not permitted. 5. Public administration. The insurance plan must be run by a public organization on a nonprofit basis. The public organization must be accountable to the citizens and the government of the province or territory.", "cn_text": "BOX 2.1 专栏文献：《加拿大健康法案》（1984年）确立的全民医疗五大根本基石原则 1. 全面性原则（Comprehensiveness）：各省医保计划必须全额资助并支付所有医学上必需的医疗服务。在医院住院期间，所有必需的处方药品、医用消耗器材以及生化影像诊断检查全部受保；医院之外由执业医生提供的一系列必需医疗诊治亦在受保之列。 2. 全民普遍受保原则（Universality）：所在省份或地区的每一位合法永久居民，均在完全相同且公平的法定条款与条件下，享有获得该医保计划所覆盖的所有受保医疗服务的合法权利。 3. 跨省便携与延续性原则（Portability）：居民在失业、更换工作单位、跨省或跨地区永久搬迁、境内跨省旅行或短期赴海外旅行期间，其享有的公费医疗保障资格绝不因此中断或失效。但是，若发生跨省永久搬迁，居民有法定义务主动通知原籍省份卫生厅，并及时向新迁入省份的卫生管理部门登记建档；在过渡期内，原居住省份将继续为其提供长达 3 个月的过渡医疗保障（参见第 31 页弗洛赫先生跨省迁徙案例）。 4. 平等合理可及性原则（Accessibility）：全体居民在获得医学必需的诊疗服务时，绝不受其个人经济收入、年龄阶段、既往健康状况、生理性别或所处偏远地理位置的限制或歧视。绝对严禁针对公费受保项目向病患额外收取任何“加急费”、“挂号自费”或变相私有化费用！ 5. 公立非营利性统一管理原则（Public Administration）：医保计划必须由非营利性的公共法定管理机构全权统一运营管理。该公立机构必须保持高度财政与运营透明，直接向全省广大纳税公民以及省立法议会全面负责。"}, {"section_idx": 5, "title_en": "Early Challenges & The Great Depression", "title_zh": "早期自费苦难、大萧条与互助萌芽 (Early Challenges & The Great Depression)", "start_time": 237.22, "end_time": 306.74, "duration": 69.53, "en_text": "The Evolution of Canada's Health Care System In the first part of the twentieth century, individuals in Canada were expected to pay the entire amount of their doctors' bills and hospital fees. Often, there were no \"set fees\" for services; that is, for the same treatment, a physician could charge one patient a certain amount and another patient an entirely different fee, depending on what the physician thought the patient could afford to pay. Those who could not afford to pay sometimes had to access charity through community agencies such as the Victorian Order of Nurses, the Red Cross, and local churches (FIGURE 2.1), and some people just went without health care altogether. The Great Depression of the 1930s had a dramatic effect on Canada's health care system. Families struggled to feed, clothe, and house their members and could not possibly pay their medical bills. A serious illness or stay in a hospital caused financial disaster for many. The cost of care prevented others from even seeking medical treatment, so those who had illnesses and disabilities would instead depend on family members and neighbours to provide care. These hardships inspired Canadians to create a prepaid medical and hospitalization insurance plan.", "cn_text": "加拿大全民公费医疗体制的百年演进史 在 20 世纪前叶，加拿大社会的医疗完全遵循纯市场自费模式，个人必须自行承担全部的诊所看诊账单与住院费用。彼时医疗收费往往没有统一的标准规约：对于完全相同的医疗操作，医生往往凭借自己对病患家庭经济状况的直观判断，向富有者索取高昂费用，而向贫困者收取较少费用。那些完全无力负担诊费的极度贫困底层，只能向加拿大维多利亚护士会（VON）、红十字会以及地方教会等民间慈善机构乞求施舍救助（参见图 2.1），甚至有大量贫民在患病后完全得不到任何医疗救治而悲惨离世。 20 世纪 30 年代的“经济大萧条”（The Great Depression）给加拿大医疗卫生体系带来了极其沉重而深刻的剧烈震荡。成千上万的家庭在温饱与住所边缘苦苦挣扎，根本无力支付哪怕一张微薄的医药账单。突如其来的一场严重疾病或一次紧急住院，往往直接导致整个家庭倾家荡产、沦为赤贫。沉重的高昂费用逼得许多患病长者与残疾人士不敢涉足诊所一步，只能完全依赖家属与邻里的简陋看护勉强度日。正是在这场深重的人道灾难与生活苦难中，加拿大人民深刻觉醒，萌生了共同出资构建“预付制全民住院与医疗保险制度”的坚定历史信念。 ![Figure 2.1 Historical Victorian Order of Nurses](../images/chapter02/fig21vonhistorical.png) 图 2.1 历史教学图示：20世纪初期民间慈善机构上门照护 FIGURE 2.1: In the first part of the twentieth century, charitable services were provided by community agencies such as the Victorian Order of Nurses for Canada. (Courtesy VON Canada [Victorian Order of Nurses].) 【教学意图】：直观呈现 20 世纪公费医疗诞生前，加拿大脆弱贫困病患完全依赖 VON 等非营利慈善志愿护士登门救济的真实历史风貌。"}, {"section_idx": 6, "title_en": "Tommy Douglas & The Birth of Medicare", "title_zh": "萨斯喀彻温省的破冰革新与汤米·道格拉斯 (Tommy Douglas & The Birth of Medicare)", "start_time": 306.74, "end_time": 427.44, "duration": 120.7, "en_text": "In 1947, under Premier Tommy Douglas, Saskatchewan became the first province to introduce a public insurance plan that covered the costs of hospital services (BOX 2.2). By 1972, all provinces and territories had extended their insurance plans to also cover medical services provided outside hospitals. Again, provincial and territorial governments and the federal government shared the health care expenses roughly equally. Modern medicare began that year, giving all permanent residents free access to the same quality of hospital and medical care, regardless of their personal financial status. BOX 2.2: Tommy Douglas, the \"Greatest Canadian\" In the spring of 2004, the Canadian Broadcasting Corporation (CBC) invited Canadians to submit their nominations for the \"Greatest Canadian\" of all time. Canadians responded with thousands of worthy suggestions. After 6 weeks of voting, Canadians chose Tommy Douglas. You might be wondering who he was and why Canadians are grateful for his contributions to this country. Thomas Clement Douglas (1904–1986) reorganized Saskatchewan's post-war employment, social, and public health policies. Douglas's reforms became his legacy, as they formed the basis for Canada's social and health care policies, which continue to exist today. For example, as Canada's health minister (1944–1948), he took the first steps toward what we now call medicare, by: • Establishing a minimum wage and ensuring a maximum 44-hour workweek and paid 2-week vacation leave, rights some workers take for granted today • Overseeing increases in old-age pensions and mother's allowance • Legislating that medical and hospital benefits be given to welfare recipients at no out-of-pocket cost to them at the time of care These are just a few of the many contributions that Tommy Douglas made. Without him, Canada would be a very different country today. We can all be grateful for the role he played in making Canada the country that it is.", "cn_text": "1947 年，在省长汤米·道格拉斯（Tommy Douglas）的无畏魄力推动下，萨斯喀彻温省（Saskatchewan）敢为人先，成为全加拿大乃至北美大陆第一个成功推出公费住院医疗保险计划的省份（详见 BOX 2.2）。截至 1972 年，加拿大所有省份和地区均已顺应时代潮流，全面将公立医保覆盖范围从医院内部拓展至医院外部的门诊就医。在此阶段，各省/地区政府与联邦政府大致均摊了全部医疗公共开支。自此，现代意义上的加拿大全民公费医疗体制宣告全面确立——不论个人贫富贵贱，所有永久居民均平等享有免费获得同等优质医院与诊疗救护的神圣权利。 BOX 2.2 历史风云人物专栏：汤米·道格拉斯 —— “最伟大的加拿大人” 在 2004 年春季，加拿大广播公司（CBC）面向全国公众发起轰动一时的海选征集，推选加拿大建国以来“最伟大的加拿大人”（The Greatest Canadian）。全加民众热烈响应，提交了数万名卓越候选人。历经长达 6 周的全国性全民公投，加拿大人民最终将这一至高无上的历史荣耀桂冠授予了汤米·道格拉斯。学员可能会好奇：这位伟人究竟是谁？为何数代加拿大人至今仍对他怀揣如此无尽的感激？ 托马斯·克莱门特·道格拉斯（Thomas Clement Douglas，1904–1986）在二战后主政萨省期间，大刀阔斧重构了该省的就业、社会福利与公共卫生政策。他的开创性立法改革成为了他留给国家最宝贵的政治遗产，直接奠定了现代加拿大社会福利与全民医疗制度的基石： • 创立最低法定工资保障制度，确立法宝级的每周最长 44 小时工作制及两周带薪年假权利——这些在当今被视作理所当然的劳工权益，在当年皆由他披荆斩棘率先确立； • 统筹推动提高长者养老金（Old-Age Pensions）及单身母亲扶助津贴； • 颁布历史性法令，强制规定向社会救助领取者提供完全免费的医疗和住院保障，在就医时严禁其自掏腰包。 这仅仅是汤米·道格拉斯毕生卓越功勋中的冰山一角。倘若没有他当年的先驱创举，今日的加拿大将呈现出截然不同的冷酷图景。每一位生活在这片土地上的人，都由衷感恩他为塑造一个充满慈爱、公平与温情的加拿大所做出的不朽历史贡献。"}, {"section_idx": 7, "title_en": "The Federal Role in Health Care", "title_zh": "联邦政府的五大核心法定职责 (The Federal Role in Health Care)", "start_time": 427.44, "end_time": 484.73, "duration": 57.29, "en_text": "The Federal Role in Health Care The federal government is responsible for the following: • Administering the Canada Health Act and providing provincial funding • Providing direct delivery of health care services to specific groups, such as First Nations people living on reserves; Inuit peoples; serving members of the Canadian Forces and the Royal Canadian Mounted Police (RCMP); eligible veterans; and inmates of federal penitentiaries • Developing and carrying out government policy and programs that promote health and prevent disease; for example, the federal government approves drugs, assesses health risks posed by environmental hazards, and provides funds to support public health programs such as prenatal health education • Transferring tax money to the provinces and territories to share the cost of medically necessary health care services • Prohibiting service providers (such as physicians) from billing clients extra charges and user fees and ensuring that all the provinces and territories provide the same quality and type of care.", "cn_text": "联邦政府在医疗卫生中的五大法定职责 根据加拿大宪法与《加拿大健康法案》，联邦政府直接履行以下五项国家层面的重大核心权责： 1. 监管法案执行与划拨财政资金：全权行政主管《加拿大健康法案》的法定遵循情况，依法向各省与地区划拨巨额医疗专项现金转移支付。 2. 向特定法定群体直接提供医疗照护：直接承担特定特殊人群的直接医疗卫生服务交付，包括：居住在保留地内的第一民族（First Nations）原住民；因纽特（Inuit）族群；加拿大武装部队现役官兵；加拿大皇家骑警（RCMP）现役警员；符合法定优抚条件的退役退伍军人；以及联邦监狱在押服刑犯人。 3. 制定国家卫生政策与疾病预防国家战略：负责国家层面的处方药品与疫苗上市审批、评估环境有害因素造成的健康风险，并出资资助国家级公共卫生计划（如产前优生优育科普教育）。 4. 税收转移支付共担医疗成本：通过联邦医疗转移支付（CHT），将中央税收按人口比例返还并拨付给各省及地区，共担必需医疗开销。 5. 铁腕杜绝额外自费乱收费并维护全国统一品质：严格立法禁止任何医疗服务提供者（如执业医师或诊所）向受助案主巧立名目收取额外费用或自费挂号费，确保各省各地区维持全国一致的受保标准与照护品质。"}, {"section_idx": 8, "title_en": "Health Canada's Role in Indigenous Health Care", "title_zh": "BOX 2.3 加拿大卫生部在原住民医疗中的历史角色演变 (Health Canada's Role in Indigenous Health Care)", "start_time": 484.73, "end_time": 569.64, "duration": 84.91, "en_text": "BOX 2.3: Health Canada's Role in Indigenous Health Care - 1945: Health services for this population were transferred from the Department of Indian Affairs to Health Canada. - 1962: Through the new Medical Services Branch, Health Canada started to provide direct health services to First Nations people on reserves and to the Inuit in the North. - 1974: A governmental policy acknowledged that although no treaty required the government to provide health care to Indigenous people, Health Canada would ensure the availability of services. - 1979: A new Indian Health Policy stated that uninsured benefits would rely on \"professional medical and dental judgement\" and recognized \"the need for community development, a strong relationship between First Nations people, the federal government, and the Canadian health system.\" - Mid-1980s: Work began so that First Nations, Métis, and Inuit communities would have more control of their own health services. - 1998: The Canadian government published Gathering Strength: Canada's Aboriginal Action Plan, which emphasized Health Canada's commitment to diabetes and tuberculosis initiatives, the development of the Aboriginal Healing Foundation, and a healing strategy related to Indian residential schools, in partnership with the Department of Indian Affairs and Northern Development. - 2000: The Medical Services Branch was renamed the First Nations and Inuit Health Branch (FNIHB).", "cn_text": "BOX 2.3 历史文献专栏：加拿大卫生部在原住民健康医疗中的演进编年史 - 1945 年：针对原住民群体的医疗卫生事务正式由原印第安事务部移交至加拿大卫生部统筹主管。 - 1962 年：通过新成立的医疗服务分局（Medical Services Branch），卫生部开始直接为保留地内的第一民族原住民及北部极地因纽特人提供现场面对面的直接医疗卫生服务。 - 1974 年：联邦政府出台官方政策正式确认：即便早期历史条约未曾明确强制规定政府必须提供医疗保障，加拿大卫生部亦将全力确保原住民享有充分的医疗可及性。 - 1979 年：颁布全新《印第安人健康政策》，明确受保范围外的补助福利将依托“专业的医学与牙科临床判断”，并深刻认识到“推进社区发展、在第一民族、联邦政府与加拿大医疗卫生体系之间建立牢固纽带的紧迫必要性”。 - 1980 年代中叶：全面启动赋权进程，使第一民族、梅蒂斯人（Métis）与因纽特社区逐步拥有自主统筹与管理本族群卫生医疗事务的自决控制权。 - 1998 年：加拿大政府正式发布《凝聚力量：加拿大原住民行动计划》（Gathering Strength），重点落实卫生部对糖尿病与结核病攻坚防范的战略承诺，成立原住民疗愈基金会，并联合相关部门开展针对“原住民寄宿学校历史创伤”的专项身心疗愈救助。 - 2000 年：正式重组并将医疗服务分局更名为“第一民族与因纽特人健康分局”（FNIHB）。"}, {"section_idx": 9, "title_en": "TRC Seven Health Calls to Action", "title_zh": "BOX 2.4 加拿大真相与和解委员会关于健康的七大呼吁 (TRC Seven Health Calls to Action)", "start_time": 569.64, "end_time": 704.23, "duration": 134.59, "en_text": "BOX 2.4: Truth and Reconciliation Commission of Canada's Seven Health Calls to Action The Truth and Reconciliation Commission of Canada (2015) identified seven Health Calls to Action (Calls 18 to 24) necessary to redress the legacy of residential schools: 18. We call upon the federal, provincial, territorial, and Aboriginal governments to acknowledge that the current state of Aboriginal health in Canada is a direct result of previous Canadian government policies, including residential schools, and to recognize and implement the health-care rights of Aboriginal people as identified in international law, constitutional law, and under the Treaties. 19. We call upon the federal government, in consultation with Aboriginal peoples, to establish measurable goals to identify and close the gaps in health outcomes between Aboriginal and non-Aboriginal communities, and to publish annual progress reports and assess long-term trends... 20. In order to address the jurisdictional disputes concerning Aboriginal people who do not reside on reserves, we call upon the federal government to recognize, respect, and address the distinct health needs of the Métis, Inuit, and off-reserve Aboriginal peoples. 21. We call upon the federal government to provide sustainable funding for existing and new Aboriginal healing centres to address the physical, mental, emotional, and spiritual harms caused by residential schools, and to ensure that the funding of healing centres in Nunavut and the Northwest Territories is a priority. 22. We call upon those who can effect change within the Canadian health-care system to recognize the value of Aboriginal healing practices and use them in the treatment of Aboriginal patients in collaboration with Aboriginal healers and Elders where requested by Aboriginal patients. 23. We call upon all levels of government to: (i) Increase the number of Aboriginal professionals working in the health-care field; (ii) Ensure the retention of Aboriginal health-care providers in Aboriginal communities; (iii) Provide cultural competency training for all healthcare professionals. 24. We call upon medical and nursing schools in Canada to require all students to take a course dealing with Aboriginal health issues, including the history and legacy of residential schools, the United Nations Declaration on the Rights of Indigenous Peoples, Treaties and Aboriginal rights, and Indigenous teachings and practices.", "cn_text": "BOX 2.4 重大人道文献：加拿大真相与和解委员会（TRC）关于医疗卫生的七项历史性行动呼吁 加拿大真相与和解委员会（TRC，2015年）明确提出了消除原住民寄宿学校深重创伤所必须彻底践行的七大卫生健康行动呼吁（第 18 条至第 24 条）： - 第 18 条：呼吁联邦、省、地区及原住民政府共同承认：加拿大原住民当前的健康劣势与困境是过去政府错误政策（包括强迫寄宿学校）的直接恶果；并切实承认并全面落实国际法、宪法及历史条约所确立的原住民医疗健康权利。 - 第 19 条：呼吁联邦政府与原住民深入协商，设立明确可衡量的考核指标，彻底消除原住民与非原住民社区之间的健康差距（涵盖婴儿死亡率、产妇健康、自杀干预、心理健康、成瘾康复及慢性病防治等），并每年向社会公开进展报告。 - 第 20 条：呼吁联邦政府妥善解决针对非保留地原住民的管辖权法律争议，切实尊重并满足梅蒂斯人（Métis）、因纽特人及离乡非保留地原住民的独特健康需求。 - 第 21 条：呼吁联邦政府为既有及新建的原住民疗愈中心提供持续长效的财政资助，重点修复寄宿学校所遗留的身体、心理、情绪与灵性四重创伤，并优先保障努纳武特（Nunavut）与西北地区疗愈中心的充足资金。 - 第 22 条：呼吁加拿大医疗系统决策者充分承认原住民传统医学疗愈体系的崇高价值；在原住民病患主动提出要求时，医护人员必须尊重其意愿，主动邀请原住民传统草药师与长者（Elders）协同开展联合诊治。 - 第 23 条：呼吁各级政府：(i) 大力扩招并培养原住民医护专业人才；(ii) 确保原住民医护工作者长期扎根并服务于原住民本地社区；(iii) 为全体在职医护人员强制开展文化胜任力（Cultural Competency）与反种族歧视专业培训。 - 第 24 条：呼吁全加所有医学院与护士院校，强制要求全体在校生必修原住民健康专题课程，系统研习寄宿学校历史创伤、联合国《原住民权利宣言》以及原住民传统医学智慧。 ![Figure 2.2 First Nations Perspective on Wellness](../images/chapter02/fig22firstnationswellness.png) 图 2.2 教学图示：第一民族关于全人健康与福祉的世界观哲学 FIGURE 2.2: A First Nations perspective on health and wellness. (Source: First Nations Health Authority [FNHA]. [2019].) 【教学意图】：展示原住民神圣的圆形四象限全人健康模型，强调生理（Physical）、智性心理（Mental）、情绪心理（Emotional）与灵性信仰（Spiritual）在家庭与社区环抱中的高度和谐共生。"}, {"section_idx": 10, "title_en": "Primary, Secondary, Tertiary & Quaternary Care", "title_zh": "初级、二级、三级与四级医疗服务全貌 (Primary, Secondary, Tertiary & Quaternary Care)", "start_time": 704.23, "end_time": 839.57, "duration": 135.34, "en_text": "Primary, Secondary, and Tertiary Health Care Delivery In the past, most health care funding went to hospitals and equipment, and the focus of health care was to make people better after they became ill. The Canadian government has recognized that secondary or tertiary health care delivery, while still important, can be shortened or prevented altogether with adequate preventive measures taken in the primary health care delivery stage. Every province and territory provides primary, secondary, and tertiary health care (FIGURE 2.3). • Primary health care delivery is the first point of contact that most people have with the health care system (e.g., through a doctor, a nurse, or another health care provider, or perhaps through phone-based or computer-based services). Primary health care delivery usually takes place in the community, but it can also take place within a hospital. Primary health care delivery offers a wide range of services, focusing mostly on health promotion, early diagnosis of disease or disability, and disease prevention. Coordinated primary health care teams include family doctors, nurses, nurse practitioners, and other health care providers. • Secondary health care delivery includes assessment, diagnosis, treatment, and preventive services that are associated with more complex medical issues. This type of care is generally provided by specialist physicians and other specialized health care providers. An example of secondary health care delivery would be a referral from a family doctor or nurse practitioner to a medical specialist for a specific medical issue that may require diagnosis and treatment. It can take place in the community (such as the specialist doctor's office) or in a hospital. • Tertiary health care delivery is a specialized, highly technical level of health care that takes place in large research and teaching hospitals. Tertiary health care delivery usually takes place within specialized care units such as a critical care unit and requires advanced diagnostic and treatment support services as well as highly specialized personnel. It is the most expensive level of health care delivery. • A new specialized section of tertiary health care delivery is called quaternary care, which includes experimental medicines or surgical procedures. Because it is so highly specialized, not every health care centre will offer quaternary care.", "cn_text": "初级、二级、三级与四级医疗服务交付全景 在历史上，加拿大绝大部分医疗财政资金曾全盘涌向大型医院和重型设备，传统医疗理念的重心局限于病人在患病后前往医院求医。然而，现代加拿大政府深刻意识到：二级专科医疗与三级重症医疗固然至关重要，但若能在“初级卫生保健”阶段落实充分的前置预防，绝大多数急难重症完全可以被预防、推迟甚至彻底避免！在加拿大每个省份与地区，均完整提供以下梯次医疗服务（参见图 2.3）： • 初级卫生保健（Primary Care）：绝大多数公民与医疗体系发生的第一道接触点（例如家庭医生门诊、诊所执业护士、社区卫生服务中心或致电 Telehealth 远程健康热线）。初级照护主要立足于社区，亦可在社区医院门诊开展，其核心聚焦于健康科普宣教、疾病或残障的极早期筛查确诊、以及前置预防干预。紧密协作的初级团队由家庭医生、注册护士、执业高级护士（NP）及专职健康人员组成。 • 二级专业专科医疗（Secondary Care）：涵盖针对更为复杂的疑难医学健康问题所展开的专科评估、鉴别诊断与专项治疗。此类照护由专科医生（Specialists，如心脏科专科医师、骨科专科医师）与各专科医护团队担纲。最典型的途径是：家庭医生在初诊发现病情复杂后，依法向病患出具转诊介绍信（Referral），转介至专科诊所或综合医院接受深层次专科诊治。 • 三级高阶专精重症医疗（Tertiary Care）：在大型医科大学附属研究型教学医院中开展的高精尖、高技术密集型专精医疗服务。三级照护通常依托于医院内的特殊专科监护单元（如心脏重症 ICU、神经外科手术室），需要尖端精密检查设备和国家级医学专家团队保驾护航。这是整个医疗体系中运营成本最为高昂、技术难度最高的医疗层级。 • 四级超特前沿医疗（Quaternary Care）：作为三级专精医疗的最新延伸层级，四级医疗专指在极少数顶尖学术科研中心开展的前沿实验性药物临床试验、极罕见病尖端基因疗法或开创性超高难度外科手术。由于其极其专精前沿，绝大多数普通医院并不设立四级医疗单元。 ![Figure 2.3 Levels of Health Care Comparison](../images/chapter02/fig23levelsofcare.png) 图 2.3 教学图示：初级、二级与三级医疗服务层级对比 FIGURE 2.3: A brief comparison of primary, secondary, and tertiary levels of health care. 【教学意图】：以阶梯式图示清晰展现初级门诊（Primary Care）、专科转诊（Secondary Care）与教学医院重症手术（Tertiary/Quaternary Care）的服务定位与转诊路径。"}, {"section_idx": 11, "title_en": "The Historical Shift to Home Care", "title_zh": "医院向社区居家照护的战略重心大转移 (The Historical Shift to Home Care)", "start_time": 839.57, "end_time": 988.99, "duration": 149.42, "en_text": "Home Care Over the years, the Canadian health care system has seen a shift in focus from hospital care to home care. Traditionally, people entered the health care system through hospitals. However, over the past two decades, the role and structure of hospitals have changed dramatically. Operating a hospital requires a tremendous amount of money. Over a third of all health care spending goes into running hospitals. Therefore, in order to cut costs, most provincial and territorial governments have reduced the number of hospitals: hundreds of hospitals have closed, merged, or been converted into other types of health care facilities. Partly to save money and partly as a result of technological advances, and also to reduce infection rates, clients are now sent home sooner after hospital procedures than they used to be. Each year, fewer clients stay in hospital overnight, and if they do stay overnight, they stay for shorter time periods than they would have in the past. In order to support patients who leave hospitals early, governments have gradually increased spending on home care. Home care is health care and support services provided to people in their places of residence, including private homes, licensed live-in care facilities, and assisted-living facilities (see Chapter 3). Home care is the most common of the community-based services, and support workers are needed and are actively recruited to work in all home care areas. Home care was first created to provide care for people who needed at-home assistance after hospital discharge. Today, home care provides community care and support to a wide range of people. Clients include older persons; families with children; people who are living with mental, physical, or developmental disabilities; people with short-term and long-term medical conditions; and people in the recovery, rehabilitative, or final stages of a life-ending disease. Home care services provide assistance to families who need help with a new baby. They enable people with disabilities to get up in the morning and get ready for school or work. They help people adjust to a disability or recover from an illness (FIGURE 2.4). They enable people who are dying to remain at home rather than be admitted to a hospital. One major focus of home care is to enable people to remain in their homes, so they can be as healthy as possible and remain independent for as long as possible. For some people, home care replaces hospital or other facility care. For others, home care allows them to maintain their health and independence, thus delaying or preventing admission to a facility.", "cn_text": "居家照护（Home Care）的崛起与战略重心大转移 纵观近数十年的发展历程，加拿大医疗卫生系统经历了一场从以传统医院为中心向以社区居家照护为核心的深层次历史性战略大转移。在传统观念中，医院是人们步入医疗体系的唯一主门户。然而在过去二十年间，医院的社会定位与组织架构发生了翻天覆地的剧变。维持一家现代化综合医院的高昂运营需要天文数字般的资金支持——全加超过三分之一的公共医疗开支被消耗在医院运转之中！为了遏制医疗成本的恶性膨胀，绝大多数省份与地区政府断然缩减了急性病床与医院数量：全加上百家医院被依法关停、合并或改建为康复慢病中心。 缩减开支的财政刚性需求、现代微创医疗技术的突飞猛进、以及降低医院院内交叉感染率（Nosocomial Infection）的临床要求，共同促成了病患在接受手术后被极快安排出院返回居家的崭新常态。现如今，不仅留院过夜的病患人数逐年锐减，且病患的平均住院日（Length of Stay）相比过去大幅缩水。为了切实兜底并支撑那些提前出院返回家庭的脆弱病患，各省政府将原本用于医院的庞大财政预算持续转移并大幅倾斜至“居家照护”领域！居家照护，是指在服务对象个人居住场所（包括其私人独栋居所、持牌机构住宅或辅助生活居所）内所交付的医疗卫生与全方位生活照料。居家照护已成为加拿大最主流的社区服务形态，一线支持工作者（PSW）更成为全加各地最为紧缺、招聘最为炙手可热的刚需专业人才！ 居家照护最初设立的初衷，纯粹是为了向出院返家的病患提供过渡期的伤口擦拭与生活协助。而在当今时代，居家照护的服务对象已全方位扩展至全社会的广阔人群：包括独居或患病的高龄长者；抚育婴幼儿的困难家庭；身患心理精神障碍、肢体残疾或智力发育障碍的人士；饱受各类急慢性顽疾困扰的病患；处于创伤康复期的伤者；以及身患绝症处于生命终末期的临终安宁关怀案主。居家照护人员协助年轻母亲为新生儿沐浴换尿布；协助高位截瘫青年清晨起床离床、穿衣洗漱以按时出门上班上学；搀扶中风长者重新适应生活（参见图 2.4）；并让身患晚期癌症的长者能够安详尊严地在自己熟悉的家庭床榻上走完生命最后一程，免除凄凉死在冰冷病房中的遗憾。 居家照护的核心执业宗旨，在于赋能人们有尊严地长久留居在自己的家庭之中，尽一切可能维系其最佳身体健康，并在最长的时间尺度内捍卫其独立自主的生活自理能力。对许多案主而言，上门居家照护彻底替代了高昂的住院；对更多长者而言，居家照护维系了其身心功能，从而大幅推迟甚至彻底避免了被无奈送入养老院（长期照护机构）的命运。 ![Figure 2.4 Support Worker Assists Senior at Home](../images/chapter02/fig24homecareassistance.png) 图 2.4 教学图示：支持工作者正在为居家独居长者提供生活照护 FIGURE 2.4: This man receives assistance through home care services so he can continue to live by himself at home. (iStockphoto/Dean Mitchell.) 【教学意图】：生动展现居家支持工作者登门协助肢体受限长者，使其能够维系独立自理尊严、持续在熟悉的私人家庭环境中生活的真实场景。"}, {"section_idx": 12, "title_en": "Four Categories of Home Care Services", "title_zh": "居家照护的核心分类体系 (Four Categories of Home Care Services)", "start_time": 988.99, "end_time": 1097.45, "duration": 108.46, "en_text": "Home Care Services and Funding Support workers provide most home care support services. In most provinces and territories, support services are provided by both public and private agencies that can be either for-profit or not-for-profit organizations. Every province and territory has a publicly funded home care program... All provinces and territories offer: • Client assessment—determining if the person is eligible for services • Case coordination and management (see Chapter 10) • Nursing services • Support services for eligible clients Home care services are classified into the following categories: 1. Personal care services: These nonmedical services offered through home care, often by support workers, include assisting with activities of daily living (ADLs—e.g., bathing, feeding, mobility, and dressing) and providing comfort care to clients who are dying. 2. Home support services: These services, often provided by support workers to clients who live at home, include assisting with home management, assisting with ADLs, and assisting with taking medications. 3. Professional services: Therapies and treatments provided by the relevant health care providers, which include nursing care, physiotherapy, occupational therapy, speech therapy, nutrition counselling, social work, respiratory therapy, paramedic and emergency medical technician (EMT) services, nail care, and in-home blood testing. 4. Support for instrumental activities of daily living (IADLs): These services, often provided by support workers, include shopping with a client, assisting a client with banking, and teaching a client how to follow a recipe. Volunteer services such as Meals on Wheels (FIGURE 2.5) and friendly visiting can be provided by anyone who meets the volunteer criteria.", "cn_text": "居家照护四大核心服务范畴与公共资助体系 在加拿大一线医疗实践中，支持工作者承担了绝大多数的居家支持操作。在各省与地区，上门服务是由公立直管机构以及受政府资助委派的私立商业性（For-profit）或非营利性（Not-for-profit）照护机构协同执行。所有省份均无一例外地设立了由公共税收资助的官方居家照护体系，统一向公众提供以下核心服务： • 案主专业评估：由个案经理全面上门评估，判定案主是否符合政府免费居家照护的准入资格； • 个案统筹与临床管理：制定个性化长期照护方案（参见第 10 章）； • 专业上门护理：派遣注册护士处理复杂换药与注射； • 合格案主的一线生活支持服务：派遣支持工作者上门提供日常生活照料。 具体而言，加拿大官方将居家照护细分为以下四大核心职能范畴： 1. 个人身体照护服务（Personal Care Services）：主要由支持工作者执行的非技术性个人生理照料，涵盖基础日常生活活动（ADLs——如盆浴淋浴擦浴、喂饭协助、床上轴线翻身与轮椅转移、协助穿脱衣物及个人梳理修饰），以及为临终关怀案主提供舒适抚慰护理。 2. 家庭支持维护服务（Home Support Services）：支持工作者在案主家中开展的家居环境支持，包括协助家庭日常事务管理、整理床铺、基础卫生打扫、协助日常生活活动以及协助督导案主按时自服药物。 3. 专业医护执业服务（Professional Services）：由持牌注册医护人员登门提供的技术性诊疗与康复服务，包括：专业伤口护理与导尿管更换、物理治疗（PT）、作业康复治疗（OT）、言语语言治疗（ST）、临床营养配餐咨询、注册社会工作者心理疏导、呼吸治疗、急救技术员（EMT）转运、专业医疗修甲、以及上门静脉抽血检验等。 4. 工具性日常生活支持服务（Support for IADLs）：支持工作者协助维持案主在社区独立生活所需的高阶技能，包括：陪伴案主前往超市采购食品杂货、协助案主前往银行网点处理存取款理财账单、以及耐心指导案主依照健康食谱学习膳食烹饪。 此外，社会志愿服务（如著名的“流动爱心送餐”Meals on Wheels，参见图 2.5）以及长者温情结对走访，则由符合资历的民间社会义工通力承担。"}, {"section_idx": 13, "title_en": "How Home Care Is Governed and Delivered", "title_zh": "BOX 2.5 居家照护的行政管理与交付模式 (How Home Care Is Governed and Delivered)", "start_time": 1097.45, "end_time": 1152.79, "duration": 55.34, "en_text": "BOX 2.5: How Home Care Is Governed and Delivered How home care is governed and delivered differs across the provinces and territories. In all jurisdictions, the ministries or departments of health and social or community services are responsible for home care services. These departments monitor the services and decide on budgets, policies, and standards of care. Service delivery involves the following: • Assessing clients' needs • Determining clients' eligibility for government-sponsored professional and support services • Coordinating and monitoring home care services provided by private or not-for-profit agencies • Providing information and referrals to other long-term care services (e.g., volunteer-based community services such as Meals on Wheels), some of which charge user fees to the client • Providing placement services to assisted-living facilities and extended care facilities (known in some provinces as long-term care facilities)", "cn_text": "BOX 2.5 制度专栏：加拿大各省居家照护的行政主管与服务交付机制 各省与地区在居家照护的行政管理体制与具体落地模式上呈现出鲜明的区域特色。但在所有辖区内，省卫生厅（Ministry of Health）以及社会与社区服务厅均牢牢掌握居家照护的最终行政领导权，负责宏观监督全行业执业水准、严格审批财政预算、制定执业法规并设立全省统一的临床照护标准。各省具体的一线服务交付流程包括以下五大关键环节： • 科学评估受助案主的多维照护需求； • 依法裁定案主是否有资格免费申领政府全额资助的专业护理与生活支持工时； • 严格统筹、调度并持续质控那些由政府购买服务、外包给商业或非营利性机构的一线照护服务； • 为案主提供权威资讯指引，转介至其他长期照护补充服务（如 Meals on Wheels 爱心送餐等民间志愿服务，部分项目仅向案主象征性收取极低原料成本费）； • 全权主导案主入住辅助生活居所（Assisted-Living）及长期照护院舍（Long-Term Care / 养老院）的官方排期评估与轮候安置（Placement Services）。"}, {"section_idx": 14, "title_en": "Table 2.1 Provincial/Territorial Health Insurance Programs", "title_zh": "表 2.1 全加各省与地区官方医疗保险计划名称一览表 (Table 2.1 Provincial/Territorial Health Insurance Programs)", "start_time": 1152.79, "end_time": 1200.96, "duration": 48.17, "en_text": "TABLE 2.1: Provincial and Territorial Health Insurance Programs | Province / Territory | Official Name of Public Health Insurance Plan | | :--- | :--- | | Alberta | Alberta Health Care Insurance Plan (AHCIP) | | British Columbia | Medical Services Plan (MSP) | | Manitoba | Manitoba Health | | New Brunswick | Medicare | | Newfoundland and Labrador | Medical Care Plan (MCP) | | Northwest Territories | NWT Health Care Insurance Plan | | Nova Scotia | Medical Services Insurance (MSI) | | Nunavut | Nunavut Health Care Plan | | Ontario | Ontario Health Insurance Plan (OHIP) | | Prince Edward Island | Medicare | | Quebec | Régie de l'assurance maladie du Québec (RAMQ / Medicare) | | Saskatchewan | Saskatchewan Medical Care Insurance Plan | | Yukon | Yukon Health Care Insurance Plan |", "cn_text": "表 2.1 加拿大各省及地区官方全民公费医疗保险计划名称大全 | 省份 / 地区 | 官方公费医疗保险计划正式法定名称 | 行业与民间常用法定缩写 | | :--- | :--- | :--- | | 阿尔伯塔省 (Alberta) | Alberta Health Care Insurance Plan | AHCIP | | 卑诗省 (British Columbia) | Medical Services Plan | MSP | | 曼尼托巴省 (Manitoba) | Manitoba Health | Manitoba Health | | 新不伦瑞克省 (New Brunswick) | Medicare | Medicare | | 纽芬兰与拉布拉多省 (Newfoundland & Labrador)| Medical Care Plan | MCP | | 西北地区 (Northwest Territories) | NWT Health Care Insurance Plan | NWT Health | | 新斯科舍省 (Nova Scotia) | Medical Services Insurance | MSI | | 努纳武特地区 (Nunavut) | Nunavut Health Care Plan | Nunavut Health | | 安大略省 (Ontario) | Ontario Health Insurance Plan | OHIP | | 爱德华王子岛省 (Prince Edward Island) | Medicare | PEI Medicare | | 魁北克省 (Quebec) | Régie de l'assurance maladie du Québec | RAMQ (太阳卡) | | 萨斯喀彻温省 (Saskatchewan) | Saskatchewan Medical Care Insurance Plan | Sask Health | | 育空地区 (Yukon) | Yukon Health Care Insurance Plan | Yukon Health | ![Figure 2.5 Meals on Wheels Hot Food Delivery](../images/chapter02/fig25mealsonwheels.png) 图 2.5 教学图示：社区流动爱心送餐（Meals on Wheels）正在登门为居家案主递送热食 FIGURE 2.5: Delivery of hot meals to clients in their homes. (U.S. Air Force photo/Airman 1st Class Katrina Heikkinen.) 【教学意图】：直观呈现社区非盈利志愿力量与公共医疗体系协同发力，确保独居衰弱长者每日获得热食营养支持的温馨图景。"}, {"section_idx": 15, "title_en": "Challenges Facing Medicare", "title_zh": "医疗体系承受的前所未有之重压 (Challenges Facing Medicare)", "start_time": 1200.96, "end_time": 1351.54, "duration": 150.58, "en_text": "HEALTH CARE CHALLENGES, SUPPLEMENTARY SERVICES, AND TRENDS Challenges The Canadian health care system has come under stress in recent years. Many factors challenge the country's ability to provide quality, universal health care, and these factors are expected to continue into the future. They include the following: • Worker shortages. Many rural and remote areas face severe shortages of physicians, nurses, and other health care workers. The growing trend of people moving to bigger cities leaves smaller communities in need of educated workers. There is an increasing need for support workers in both rural and urban settings throughout many provinces. • Aging of the baby boomer generation (those born between 1945 and 1964). Canadian society is aging. For the older population to live safely and with dignity and independence, the costs of our health care system will rise. • Increasing numbers of Canadians require care. People aged 65 and older are the fastest-growing age group in Canada, and this trend is expected to continue for decades. Many of today's older persons live with one or more chronic health challenges, have mobility issues, or experience a mental health problem, all of which may require medical intervention. • Aging of health care workers. Health care workers are also aging. Many studies are investigating the effects of different types of work on older bodies. One finding is that older workers have fewer injuries, but the injuries they have tend to be more severe. • Long waiting lists for surgeries, diagnostics, and medical procedures. Long wait times cause stress and a possible worsening of their condition for many clients in need of treatment. • Long waiting times for admission to long-term care facilities. Clients who are ill and waiting for long-term care placement must often stay in an acute-care hospital because it is unsafe for them to live at home. Overcrowded hospital units and emergency departments have resulted. To remedy the situation, many hospitals have restructured their care delivery to include continuing care units, where these clients can await long-term care admission. • The steadily rising cost of care. Of all the challenges facing the health care system, its rising cost is the greatest. Drugs and technology that help treat diseases and disabilities are better than ever before. However, these advances come at a high price due to the cost of developing them. Building and labour costs, too, are always spiralling upward, and taxpayers bear the burden.", "cn_text": "加拿大医疗卫生体系面临的七大严峻挑战 近年来，加拿大公费医疗体制正承受着前所未有的极限重压。多重结构性深层矛盾正持续冲击国家维系高质量、均等化全民公费医疗的能力，且这些压力在未来数十年内将愈演愈烈： 1. 医护人力资源极度匮乏（Worker Shortages）：在广大偏远乡村和北部偏僻地区，执业医师、护士及支持工作者呈现断崖式短缺。人口向特大都市集聚的不可逆趋势，使得小型城镇极度缺乏合格医护人才。在加拿大各省，不论是乡村家庭还是都市社区，支持工作者（PSW）的需求量正呈爆炸式攀升。 2. “婴儿潮一代”集体步入古稀之年（Aging of Baby Boomers）：出生于二战后（1945–1964年）极其庞大的婴儿潮一代如今已全线迈入高龄阶段。为了让这一庞大群体能够安全、体面、有尊严且尽可能独立地生活，国家公共医疗财政开支注定呈刚性指数级激增。 3. 亟需长期照护的受助长者基数激增：65 岁及以上高龄群体是加拿大全社会增长最为迅猛的人口梯队。当今多数长者身体同时罹患一种或数种慢性器质性疾病，伴随肢体活动障碍或认知障碍（失智症），需要长期密集的医疗与护理干预。 4. 医护从业人员自身人口老龄化（Aging of Workers）：医护队伍本身亦不可阻挡地面临高龄化。医学人体工程学研究表明：年长医护人员凭借丰富经验虽然发生工伤的频次相对较少，但一旦发生扭伤摔伤，其组织创伤与骨折严重程度远超年轻同行，康复极慢。 5. 择期手术、诊断造影与专科诊治排期漫长（Wait Times）：漫长的手术与核磁CT等待时间，不仅给饱受病痛折磨的案主及其家庭带来沉重精神焦虑，更随时面临基础病情在等待中恶化衰竭的潜在临床风险。 6. 养老院公立床位排期过长致使医院急诊严重压床（ALC 危机）：由于社区长期照护机构（LTC）床位极度紧缺，大批已脱离生命危险但生活完全无法自理、无法安全返家的患病长者，只能常年滞留在昂贵的急症医院病房（即“备选照护级别”ALC 现象），直接导致各大综合医院急诊室人满为患、一床难求。为破解此僵局，许多医院被迫自建“过渡延续照护单元”（Continuing Care Units），供长者苦等养老院床位。 7. 医疗新技术与人力运营成本的失控飞涨（Rising Costs）：在所有严峻考验中，医疗总成本的无底洞式飞涨是最大、最根本的生存威胁！靶向新药、生物制剂与尖端诊疗仪器的研发上市成本呈天文数字；医疗基建与人力薪酬持续走高，最终全部沉重地压在纳税人的脊梁上。"}, {"section_idx": 16, "title_en": "Supplementary Benefits & Regionalization", "title_zh": "补充医疗保险、商业保险与大区化管理改革 (Supplementary Benefits & Regionalization)", "start_time": 1351.54, "end_time": 1463.78, "duration": 112.25, "en_text": "Additional (Supplementary) Services & Private Health Insurance Provinces and territories provide coverage to certain people (e.g., older persons, children, and recipients of social assistance) for services that are not generally covered under the publicly funded health care system. These supplementary health benefits often include prescription drugs, dental care, vision care, medical equipment and appliances (e.g., prostheses, wheelchairs), independent-living assistance, and the services of other health care providers such as chiropractors. The level of coverage varies across the country. Additional health insurance, sometimes referred to as benefits, covers services that are not government funded... Those who do not qualify for supplementary benefits under government plans pay for these services with individual, out-of-pocket payments or through private health insurance plans... Health Care Trends & Regional Authorities To reduce some of the pressures placed on our health care system, new ways of providing care have been introduced to Canadians, with the intent of providing quality care while avoiding needless spending. Instead of Canadians' relying on hospitals and doctors, there is a trend toward providing alternative care in clinics, in health care centres, and through home care. Many families now seek medical services not only from doctors but also from nurse practitioners. Medical advances have led to more surgical procedures being done through day surgery on an outpatient basis... Most provinces and territories have tried to control costs and improve delivery by decentralizing decision making on health care delivery to the regional or local board level. Such regional authorities are managed by elected and appointed members who oversee hospitals, long-term care homes, home care, and public health services in their areas. As part of these reforms, provincial and territorial governments are now focused on two areas: • Health promotion and disease prevention • Home care", "cn_text": "政府补充医疗福利、商业私立保险与卫生大区化治理革新 为了保障最脆弱群体的生存底线，各省和地区政府通常制定专门政策，向特定特惠群体（如 65 岁以上长者、未成年儿童、以及低收入社会救助金领取者）提供公费医保常规项目之外的“补充医疗福利”（Supplementary Health Benefits）。这些补充福利通常涵盖：部分门诊处方药（如安省 ODB 计划）、基础牙科保健、眼科验光配镜、医用矫形辅助器材（假肢、电动轮椅等轮椅设备补贴）、自立生活辅具以及整脊按摩（Chiropractic）等专科理疗。全国各省在此类福利的报销额度上差异极大。 凡不符合政府免费补充福利资格的广大普通居民，若需享受上述牙医、眼科、处方药或物理康复，必须自掏腰包全额自费支付，或通过其雇主单位统一购买的“商业私立健康保险”（Private Health Insurance / Group Benefits）按比例报销。商业保险的具体承保条款、自付免赔额（Deductibles）及报销上限完全取决于雇主购买的保单险种，各保险公司之间千差万别。若既无政府特惠资格、又无商业保险兜底，案主必须由个人储蓄完全自费承担。 现代医疗改革趋势与大区化管理架构 为了纾解医疗体系承受的重压，加拿大近年来大力推行一系列精益医疗革新举措：全面推行以日间门诊日间微创手术（Day Surgery）替代长期住院；大力普及高级执业护士（Nurse Practitioner, NP）独立坐诊，分担家庭医生的基础就诊压力；并大力推广多学科社区健康服务中心。 在宏观行政体制层面，绝大多数省份打破了过去由各个医院各自为政、盲目采购设备的混乱格局，全面推行“卫生大区化治理改革”（Regionalization / 如安省各区域健康整合网络及卫生局）。通过建立跨区域卫生管理局，统筹调配该区域内所有医院、长期照护养老院、上门居家照护机构以及公共卫生预防资源，实现医疗资源的集约化高效运转。在这一宏观顶层重塑之下，全加各省与地区政府将卫生财政与政策资源最优先投向了两大战略高地： 1. 健康促进与疾病前置预防（Health Promotion & Disease Prevention）； 2. 社区居家照护（Home Care）。"}, {"section_idx": 17, "title_en": "Alternative Health Practices", "title_zh": "替代医学与传统医学的融合 (Alternative Health Practices)", "start_time": 1463.78, "end_time": 1504.39, "duration": 40.61, "en_text": "Alternative Health Practices Alternative health practices are health treatments that have not been taught or practised in traditional medical communities and offer therapies that differ from standard medical practice (see Chapters 23, 44, and 45). They include massage therapies, homeopathy, herbal medicines (including the use of cannabis), and acupuncture. These practices are gaining widespread acceptance by the same medical community (also known as Western medicine) that once disregarded them and are now often ordered by physicians and used in conjunction with traditional treatments. Many of these services are also now covered by some provincial and territorial health care plans.", "cn_text": "替代疗法与西方主流医学的有机融合 替代健康疗法（Alternative Health Practices）是指那些未曾纳入西方传统医学院经典教学体系、在操作机理与哲学上异于标准常规医学的各类特色治疗方法（参见第 23、44 及 45 章）。常见形式涵盖注册推拿按摩疗法（RMT）、顺势疗法（Homeopathy）、天然草药与植物提取物疗法（包括医用大麻的应用）、以及传统中医针灸疗法（Acupuncture）。 曾经对这些非主流疗法持怀疑甚至排斥态度的西方主流医学界（Western Medicine），如今正全面转变观念，广泛接纳并认可这些传统经验智慧的临床疗效。现如今，执业医师常常根据患者慢性疼痛、神经麻痹或恶心呕吐等临床指征，主动开具针灸或按摩处方，将其作为常规药物手术的重要辅助协同疗法；部分省份的公费医保或雇员商业保险亦已正式将特定替代疗法列入受保支付范围。"}, {"section_idx": 18, "title_en": "Health Promotion & Support Worker's Vital Role", "title_zh": "健康促进与疾病预防：支持工作者的非凡价值 (Health Promotion & Support Worker's Vital Role)", "start_time": 1504.39, "end_time": 1578.22, "duration": 73.82, "en_text": "Health Promotion and Disease Prevention Traditionally, the purpose of a health care system has been to diagnose, treat, and cure illnesses. A more recent approach to health care, however, involves developing ways to promote health and prevent diseases from occurring. Preventing illness and injury, while keeping people healthy, is more effective and cheaper than providing treatments in hospitals. • Health promotion refers to strategies that improve or maintain health and independence. • Disease prevention refers to strategies that prevent the occurrence of disease or injury. Support workers contribute to health promotion and disease prevention and are needed now more than ever because they provide nonmedical care and services that can help prevent major health problems. Take, for example, Mr. Lukovic, who has been on bedrest for a long time. He is at risk for pressure ulcers, pneumonia, and blood clots. To prevent these complications, you, as his support worker, help him keep his skin clean and dry, change his position in bed frequently, and help him perform range-of-motion exercises. By doing these important things for Mr. Lukovic, you can help improve his quality of life now and prevent him from developing illness or disability in the future.", "cn_text": "健康促进、疾病预防与支持工作者的前沿预防使命 在传统医学观念中，医疗体系的唯一功能局限于在疾病发生后进行诊断、用药和手术治愈。然而，现代前沿医疗的核心理念实现了颠覆性升华：全力探索并实施能够促进大众健康、阻止疾病发生的各种源头治理途径！防患于未然、保护广大民众远离创伤与病痛，其临床有效性与经济成本效益，远远优于等病入膏肓后再送进 ICU 抢救。 • 健康促进（Health Promotion）：指一切旨在提升、增进并长久维系个体身心健康功能与独立自理自立能力的宏观与微观干预策略。 • 疾病预防（Disease Prevention）：指一切旨在从根源上阻止特定器质性疾病发生、阻断感染途径或预防人身伤害意外事故的防控策略。 支持工作者（PSW）在前沿预防和健康促进中扮演着无可替代的中流砥柱角色——在当今医疗重构格局下，社会对 PSW 的渴求比以往任何历史时期都更为迫切！因为正是支持工作者日复一日所提供的基础、非医疗性贴身照护，在最前线成功阻击了无数足以致命的恶性并发症。以长期绝对卧床的长者卢科维奇先生（Mr. Lukovic）为例：久卧病榻的他时刻面临着罹患致死性深层压疮（褥疮）、坠积性肺炎（Pneumonia）以及下肢深静脉血栓（DVT）的高危风险。为了阻止这些毁灭性并发症的发生，你作为他的专职支持工作者，时刻协助他保持受压皮肤的绝对清洁与干爽，按时每两小时严格为他执行轴线翻身变换体位，并在床旁耐心协助他完成全套四肢关节活动度维持训练（Range-of-Motion Exercises）。通过为你负责的卢科维奇先生严谨执行这些看似微小平凡的照护细节，你不仅当场大幅升华了他的晚年生活品质，更在医学实质上直接挽救了他的生命，阻止了他在未来陷入更为深重的伤残与危局！"}, {"section_idx": 19, "title_en": "Supporting Mr. Wloch: Health Insurance Portability", "title_zh": "临床实战案例：弗洛赫先生跨省迁徙与医保便携性 (Supporting Mr. Wloch: Health Insurance Portability)", "start_time": 1578.22, "end_time": 1639.9, "duration": 61.68, "en_text": "Supporting Mr. Wloch: An Example of Health Insurance Portability in Canada Ivan Wloch is a 65-year-old widower who was seriously injured about 6 months ago in an explosion at the factory where he works, just a few weeks before he was to retire. In the months since his accident, he has been cared for at home by nurses, physiotherapists, and occupational therapists for the severe burns he received to his face and right arm. Since he was also blinded in the accident, he requires support workers to assist him with taking a bus to his various appointments, as well as with his banking and grocery shopping. Mr. Wloch, who lives in Manitoba, has decided that he would like to move in with his married daughter, who lives in Nova Scotia. He has been told that his private insurance, through his employer, would still cover his ongoing treatments and support after he moves. He was also informed that he could switch his provincial health insurance once he moves, to ensure ongoing coverage. How can he learn how to switch his provincial health insurance coverage?", "cn_text": "临床支持实战案例：弗洛赫先生跨省迁徙 —— 加拿大医保便携性原则生动实践 伊万·弗洛赫先生（Ivan Wloch）是一位 65 岁高龄的鳏夫。约 6 个月前，就在他即将正式退休的前数周，他所供职的工厂不幸发生剧烈突发爆炸，致使他身负重伤。在爆炸发生后的这半年里，他一直留在家中接受由注册护士、物理治疗师及作业康复治疗师组成的上门多学科居家照护，以持续治疗他面部与右臂遭受的大面积严重烧伤。由于在剧烈爆炸中不幸双目失明，他如今高度依赖支持工作者（PSW）每日协助他搭乘无障碍公共交通前往各大医院专科诊所复诊，并协助他完成去银行办理业务和去超市采买食品杂货等日常活动。 目前常住曼尼托巴省（Manitoba）的弗洛赫先生经过深思熟虑，决定搬迁至新斯科舍省（Nova Scotia）与自己已婚的女儿一家同住。其原雇主处购买的商业团体伤残保险已向他确认：在他跨省搬迁后，仍将全额继续报销其后续的专科康复治疗与生活支持费用。此外，相关社工亦告知他：依据《加拿大健康法案》的法定便携性准则，在他跨省搬家后，可以合法申请转换各省之间的公立医保卡，确保其公费医疗待遇无缝延续。那么，弗洛赫先生应当通过何种合规途径系统了解如何将曼省医保转为新斯科舍省医保的具体行政流程？ 【本章复习与核心要点回顾】Chapter 2 Review (Page 32)"}, {"section_idx": 20, "title_en": "KEY POINTS", "title_zh": "核心要点清单 (KEY POINTS)", "start_time": 1639.9, "end_time": 1802.28, "duration": 162.38, "en_text": "1. Canada's publicly funded health care system is best described as an interlocking set of 10 provincial and 3 territorial health insurance plans. 2. Medicare provides access to universal, comprehensive coverage for medically necessary hospital and physician services. These services are administered and delivered by the provincial and territorial governments and are provided at no additional cost to the client. 3. To receive their full share of federal funding for health care, the provincial and territorial health insurance plans must meet the five criteria of the Canada Health Act: comprehensiveness, universality, portability, accessibility, and public administration. 4. The Truth and Reconciliation Commission of Canada: Calls to Action (2015) document identified seven Calls to Action for health care that are necessary to redress the legacy of residential schools for Indigenous Canadians. 5. Health care delivery is divided into primary, secondary, and tertiary delivery categories. Primary care is aimed at preventing illness whenever possible. Tertiary health care delivery is the most expensive to deliver. 6. Many factors challenge and stress the Canadian health care system. These factors include: (1) severe shortages of physicians, nurses, and other health care workers in rural areas; (2) the aging of the baby boomer generation; (3) long waiting lists; and (4) the steadily rising cost of care and new technology, which is the greatest challenge. 7. Supplementary health benefits often include prescription drugs, dental care, vision care, medical equipment and appliances, independent-living assistance, and the services of other health care providers, such as chiropractors. The level of coverage varies across the country. 8. Residents may have private insurance plans that pay for these supplementary services. 9. New trends in health care include: (1) alternative care in clinics, (2) health care centres, and (3) home care programs. 10. To control costs, provincial and territorial governments are focusing on: (1) health promotion and disease prevention and (2) home care. 11. Support workers provide most home care support services. 12. In most provinces and territories, support services are provided by for-profit and not-for-profit public and private agencies. Every province and territory has a publicly funded home care program, but the funding per client will vary depending on the province's funding policies. Home care services are classified by (1) personal care services, (2) home support services, (3) nursing and professional services, and (4) support for IADLs.", "cn_text": "1. 加拿大公共税收资助的医疗体制，最精准的定义是一个由 10 个省和 3 个地区医疗保险计划严密交织、分工咬合的全国性协作网络。 2. Medicare 为全民提供免自费、普遍且全面覆盖医学必需的医院住院与医生诊疗服务，由各省/地区直接交付执行，在接受服务时受助者无需自掏腰包。 3. 各省及地区为全额获取联邦财政医疗拨款，必须全面恪守《加拿大健康法案》确立的五大法定准则：全面性、普遍性、便携性、可及性与公立管理。 4. 加拿大真相与和解委员会（TRC，2015）明确颁布了关于医疗卫生的七大行动呼吁，作为消除原住民寄宿学校历史创伤不可或缺的制度举措。 5. 医疗卫生服务划分为初级、二级与三级照护三大梯次。初级保健立足于前置疾病预防；三级高精尖重症医疗则是整个系统中运营成本最为昂贵的层级。 6. 加拿大医疗体系正经受多重深层压力的严酷考验，包括：偏远乡村地区医护人才严重短缺；婴儿潮一代不可阻挡的高龄老龄化；门诊手术与专科检查排期漫长；以及最根本的威胁——医疗技术、前沿新药与运营成本的失控飞涨。 7. 补充医疗福利通常涵盖处方药、牙科、眼科配镜、轮椅假肢等辅具器材以及整脊理疗；各省在具体报销额度上存在地域政策差异。 8. 广大居民主要通过雇主团体或个人出资购买商业私立健康保险，用于报销上述公立受保项目之外的补充医疗费用。 9. 现代医疗创新潮流包括：在社区门诊开展日间微创诊疗、设立综合性社区健康中心、以及全面推进居家照护项目。 10. 为有效遏制成本失控并改善生命质量，各省与地区政府已将战略核心聚焦于两大赛道：健康促进与疾病前置预防，以及大力扩张居家照护。 11. 一线支持工作者（PSW / HCA）承担了全加绝大多数居家生活照料与支持服务的具体执行。 12. 在绝大多数省份和地区，支持服务由受政府资助外包的商业盈利性或非盈利性公共及私立机构负责承办。各省皆有公立居家照护资助大纲，但具体获批工时取决于本省政策；服务体系严格细分为：个人身体照护、家庭生活支持、专业护理康复、以及工具性日常生活（IADLs）协助四大门类。"}, {"section_idx": 21, "title_en": "CRITICAL THINKING IN PRACTICE", "title_zh": "临床批判性思维修炼 (CRITICAL THINKING IN PRACTICE)", "start_time": 1802.28, "end_time": 1818.24, "duration": 15.96, "en_text": "How do the following issues affect our Canadian health care system: (a) escalating costs of care, (b) privatization of services, (c) continuity of care, and (d) electronic health records?", "cn_text": "试结合加拿大当代社会现实，深入批判性分析以下四大焦点议题如何深层次塑造并影响我国当前的医疗卫生体制走向： (a) 医疗成本的刚性失控飞涨（Escalating costs of care）：导致政府财政不堪重负，迫使管理层必须推行医院床位精简、推行日间手术，并将医疗重心向成本较低的社区居家预防大幅转移。 (b) 医疗服务的私有化隐患与争议（Privatization of services）：私立诊所的滋生是否会破坏《加拿大健康法案》的平等可及性原则？是否会催生“有钱人插队就医、贫困者苦苦排队”的二元不公体制？ (c) 临床照护的连续性与无缝衔接（Continuity of care）：当病患在急性医院、康复中心、家庭医生诊所与上门支持工作者之间流转时，如何确保临床生命体征信息与个性化照护计划不发生脱节断层？ (d) 全数字化电子健康档案的普及（Electronic health records, EHR）：电子病历如何彻底终结“各机构信息孤岛”，使跨学科团队与一线 PSW 能够在第一时间精准掌握案主最新的用药过敏史与照护注意事项？"}]}, {"ch_num": 3, "title_en": "Workplace Settings", "title_zh": "工作场所与执业环境", "audio_url": "audio/psw/ch3_master.mp3", "duration": 738.12, "size_bytes": 5905742, "voice": "en-CA-LiamNeural", "timeline": [{"section_idx": 1, "title_en": "Objectives", "title_zh": "学习目标 (Objectives)", "start_time": 0.0, "end_time": 34.2, "duration": 34.2, "en_text": "After reading this chapter, the learner should be able to do the following: • Differentiate between community-based care and facility-based care. • Differentiate among acute care, subacute care, and long-term care. • Describe the different community-based and facility-based settings where support workers are employed. • Identify the challenges and benefits associated with working in each of the following settings: community, long-term care, acute care, and working directly for a client. • Identify what is important to you when deciding on an employment setting.", "cn_text": "完成本章研读后，学习者应当能够达成以下核心专业能力考核目标： • 准确鉴别与区分“社区型照护”（Community-Based Care）与“机构型照护”（Facility-Based Care）的本质差异与服务模式。 • 深入理解并辨析“急性照护”（Acute Care）、“亚急性/过渡照护”（Subacute Care）以及“长期照护”（Long-Term Care）的临床定位与照护需求。 • 系统掌握吸纳支持工作者（PSW / HCA）从业执业的各类主要社区场景与各类机构场所的组织架构与服务功能。 • 深刻洞察并明确列举在以下四类核心工作场景中从业所面临的独特执业优势（Benefits）与挑战考验（Challenges）：社区居家照护、长期照护养老机构、急性综合医院、以及直接受雇于案主本人的私人照护。 • 确立符合个人职业发展期望与性格特质的从业价值观，为明智抉择未来长远的执业发展环境奠定坚实认知基础。 【核心专业术语表】Chapter 3 Key Terms (Page 35) | 英文核心术语 (Key Term) | 音标 (Phonetic) | 权威中文译名 | 原版学术定义与临床内涵 (Definition & Clinical Context) | | :--- | :--- | :--- | :--- | | acute care | /əˈkjuːt kɛər/ | 急性医疗照护 | 为在相对较短的时间跨度内（通常数天至数周）所提供的医疗卫生服务，旨在紧急诊断、抢救并积极治疗突发的急危重症或急性健康创伤。 (p. 36) | | acute illness | /əˈkjuːt ˈɪlnəs/ | 急性疾病 / 急危重症 | 突发且通常较为凶险的疾病过程，患者往往能迅速康复，或在短期内急剧恶化乃至致命。 (p. 36) | | adult day program | /ˈædʌlt deɪ ˈproʊɡræm/ | 成人日托康乐计划 | 在日间为居住在家庭中的长者或残障人士提供专业监护、社交康乐文娱活动、营养午餐及基础身心支持的日间社区照护中心（亦称成人日间活动中心）。 (p. 37) | | assisted-living facility | /əˈsɪstɪd ˈlɪvɪŋ fəˈsɪləti/ | 辅助生活照护居所 | 一种专为在穿衣、沐浴、服药等日常生活自理（ADLs）上需要特定生活协助，但尚未虚弱到需要 24 小时密集临床特级护理的群体所设立的居所型机构。 (p. 39) | | chronic illness | /ˈkrɒnɪk ˈɪlnəs/ | 慢性疾病 (持续性疾病) | 病程漫长、发展缓慢且往往伴随终生无法彻底治愈的器质性进行性疾病，需长期依靠药物与康复支持维持稳定（亦称 Persistent Illness）。 (p. 36) | | community-based facility | /kəˈmjuːnəti beɪst fəˈsɪləti/ | 社区型居住照护机构 | 坐落在普通社区居民区内的小型居住型机构，既提供半独立生活支持，又便利案主随时融入并利用周边社区公共资源。 (p. 36) | | community day program | /kəˈmjuːnəti deɪ ˈproʊɡræm/ | 社区日间活动项目 | 参见成人日托康
