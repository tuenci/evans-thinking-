<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>《加拿大支持工作者教材》（第5版）专业原声有声典藏版 · Sorrentino & Wilk</title>
  <meta name="description" content="Elsevier 官方《加拿大支持工作者教材》（Sorrentino's Canadian Textbook 5th Ed.）专业真人声双语有声典藏版。采用加拿大自然医学音色沉稳诵读，声文同步光标伴读，支持后台锁屏播放与离线下载。">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-studio: #0c0b0a;
      --bg-radial: radial-gradient(ellipse at 50% 25%, #221c16 0%, #120f0d 60%, #070605 100%);
      --card-bg: rgba(26, 22, 18, 0.85);
      --card-border: rgba(226, 184, 116, 0.22);
      --accent-gold: #E2B874;
      --accent-gold-dark: #C99757;
      --accent-glow: rgba(226, 184, 116, 0.35);
      --text-main: #F7F2EC;
      --text-muted: rgba(247, 242, 236, 0.65);
      --text-dim: rgba(247, 242, 236, 0.40);
      --font-serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", Georgia, serif;
      --font-display: "Cinzel", Georgia, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-studio);
      background-image: var(--bg-radial);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: var(--font-sans);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Top HUD */
    .hud-top {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      padding: 12px 16px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(12, 11, 10, 0.82);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hud-capsule {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .hud-btn:hover {
      color: var(--accent-gold);
      border-color: var(--accent-gold);
      background: rgba(226, 184, 116, 0.1);
    }

    .hud-btn-gold {
      color: #0c0b0a;
      background: var(--accent-gold);
      border-color: var(--accent-gold);
      font-weight: 600;
    }

    .hud-btn-gold:hover {
      background: #f0caa0;
      color: #000;
    }

    .hud-title-zone {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--accent-gold);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Layout */
    .app-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 80px;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 32px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .app-container {
        grid-template-columns: 1fr;
        gap: 24px;
        padding-bottom: 120px;
      }
    }

    /* Player Card (Sticky Left on Desktop) */
    .player-card {
      position: sticky;
      top: 76px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    /* Vinyl Stage */
    .cover-stage {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 0 auto 20px;
    }

    .cover-img-wrap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(0,0,0,0.6);
      border: 1px solid rgba(226, 184, 116, 0.3);
      z-index: 2;
      background: #1a1612;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .cover-badge {
      font-family: var(--font-display);
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }

    .cover-book-title {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
      color: #fff;
      margin-bottom: 6px;
    }

    .cover-sub {
      font-size: 11px;
      color: var(--text-dim);
    }

    /* Track Meta */
    .track-badge {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent-gold);
      background: rgba(226, 184, 116, 0.12);
      border: 1px solid rgba(226, 184, 116, 0.28);
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .track-title {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .track-author {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    /* Scrubber */
    .scrub-container {
      width: 100%;
      margin-bottom: 18px;
    }

    .scrub-bar {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      cursor: pointer;
      position: relative;
    }

    .scrub-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent-gold);
      box-shadow: 0 0 10px var(--accent-glow);
      cursor: pointer;
      border: 2px solid #fff;
      transition: transform 0.1s ease;
    }

    .scrub-bar::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .scrub-times {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      margin-top: 6px;
    }

    /* Transport Controls */
    .transport-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .btn-transport {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-transport:hover {
      background: rgba(226, 184, 116, 0.2);
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      transform: scale(1.05);
    }

    .btn-play-hero {
      width: 60px;
      height: 60px;
      background: var(--accent-gold);
      border: 1px solid var(--accent-gold);
      color: #0c0b0a;
      font-size: 22px;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .btn-play-hero:hover {
      background: #f0caa0;
      color: #000;
      transform: scale(1.08);
    }

    /* Secondary Controls */
    .extra-controls {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
    }

    .btn-pill {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-muted);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-pill:hover, .btn-pill.active {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      background: rgba(226, 184, 116, 0.1);
    }

    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-gold);
      text-decoration: none;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(226, 184, 116, 0.1);
      border: 1px solid rgba(226, 184, 116, 0.3);
      margin-top: 14px;
      transition: all 0.2s ease;
    }

    .btn-download:hover {
      background: var(--accent-gold);
      color: #000;
    }

    /* Script / Teleprompter Section (Right) */
    .script-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .script-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
    }

    .script-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent-gold);
    }

    .script-hint {
      font-size: 12px;
      color: var(--text-dim);
    }

    .script-scroll-box {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .script-entry {
      background: rgba(26, 22, 18, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 18px 20px;
      transition: all 0.25s ease;
      cursor: pointer;
      position: relative;
    }

    .script-entry:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(226, 184, 116, 0.3);
    }

    .script-entry.audio-active {
      background: rgba(226, 184, 116, 0.12);
      border-color: var(--accent-gold);
      box-shadow: 0 4px 20px rgba(226, 184, 116, 0.15);
      border-left: 4px solid var(--accent-gold);
    }

    .entry-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .entry-title-en {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent-gold);
    }

    .entry-timestamp {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .script-entry.audio-active .entry-timestamp {
      background: var(--accent-gold);
      color: #000;
      font-weight: 600;
    }

    .entry-body-en {
      font-family: var(--font-serif);
      font-size: 15px;
      line-height: 1.7;
      color: #F7F2EC;
      margin-bottom: 10px;
    }

    .entry-body-cn {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-muted);
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
      padding-top: 8px;
    }

    /* Playlist Modal */
    .playlist-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 360px;
      max-width: 90%;
      background: #14110e;
      border-left: 1px solid var(--card-border);
      box-shadow: -10px 0 30px rgba(0,0,0,0.8);
      z-index: 200;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .playlist-drawer.open {
      transform: translateX(0);
    }

    .playlist-header {
      padding: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .playlist-header h3 {
      font-size: 16px;
      color: var(--accent-gold);
    }

    .btn-close-drawer {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
    }

    .playlist-items {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .playlist-card {
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .playlist-card:hover, .playlist-card.active {
      background: rgba(226, 184, 116, 0.12);
      border-color: var(--accent-gold);
    }

    .playlist-card-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .playlist-card-meta {
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 199;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <!-- Top Navigation HUD -->
  <header class="hud-top">
    <div class="hud-capsule">
      <div class="hud-group">
        <a href="psw-reader.html" class="hud-btn hud-btn-gold" title="返回网页无删减研读版">
          <span>📖 返回双语研读版</span>
        </a>
      </div>

      <div class="hud-title-zone">
        <span>《加拿大支持工作者教材》（第5版）有声典藏版</span>
      </div>

      <div class="hud-group">
        <button class="hud-btn" onclick="openPlaylistDrawer()" title="选择章节">
          <span>📑 章节列表</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Hidden HTML5 Audio Element -->
  <audio id="audioPlayer" preload="auto"></audio>

  <!-- Main App Container -->
  <main class="app-container">
    <!-- Left Column: Audio Player Stage -->
    <aside class="player-card">
      <div class="cover-stage">
        <div class="cover-img-wrap">
          <div class="cover-badge">ELSEVIER 5TH EDITION</div>
          <div class="cover-book-title">Canadian Support Worker</div>
          <div class="cover-sub">Sorrentino & Wilk</div>
        </div>
      </div>

      <div class="track-badge" id="trackBadge">CHAPTER 3</div>
      <h2 class="track-title" id="trackTitle">Workplace Settings</h2>
      <div class="track-author" id="trackAuthor">朗诵：Liam (加拿大医者导师 · 自然原声)</div>

      <!-- Scrubber -->
      <div class="scrub-container">
        <input type="range" class="scrub-bar" id="scrubBar" min="0" max="100" value="0" oninput="onScrubInput(this)" onchange="onScrubChange(this)">
        <div class="scrub-times">
          <span id="timeCurrent">00:00</span>
          <span id="timeDuration">--:--</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="transport-row">
        <button class="btn-transport" onclick="seekRelative(-15)" title="快退 15 秒">↺ 15</button>
        <button class="btn-transport btn-play-hero" id="btnPlayPause" onclick="togglePlay()" title="播放/暂停">▶</button>
        <button class="btn-transport" onclick="seekRelative(30)" title="快进 30 秒">30 ↻</button>
      </div>

      <!-- Secondary Controls -->
      <div class="extra-controls">
        <button class="btn-pill" id="btnSpeed" onclick="cycleSpeed()">1.0x</button>
        <button class="btn-pill" id="btnTimer" onclick="cycleSleepTimer()">⏱ 定时</button>
      </div>

      <a href="#" class="btn-download" id="btnDownload" download>
        <span>📥 下载本章广播级母带 MP3</span>
      </a>
    </aside>

    <!-- Right Column: Synchronized Teleprompter Script -->
    <section class="script-column">
      <div class="script-header">
        <div class="script-title">声文同步讲授剧本 · Synchronized Narration Script</div>
        <div class="script-hint">点击任意段落即可跳转播放</div>
      </div>

      <div class="script-scroll-box" id="scriptScrollBox">
        <!-- Dynamically injected entries -->
      </div>
    </section>
  </main>

  <!-- Chapter Playlist Drawer -->
  <div class="drawer-backdrop" id="drawerBackdrop" onclick="closePlaylistDrawer()"></div>
  <aside class="playlist-drawer" id="playlistDrawer">
    <div class="playlist-header">
      <h3>教材章节有声选集</h3>
      <button class="btn-close-drawer" onclick="closePlaylistDrawer()">&times;</button>
    </div>
    <div class="playlist-items" id="playlistItems">
      <!-- Injected chapters -->
    </div>
  </aside>

  <script>
    const MANIFEST_DATA = {"book_title_en": "Sorrentino's Canadian Textbook for the Support Worker (5th Ed.)", "book_title_zh": "《加拿大支持工作者教材》（第5版）· 典藏有声研读版", "voice": "en-CA-LiamNeural", "mastering": "EBU R128 (-16 LUFS, TP <= -1.5 dBTP) + 80Hz Highpass + 3.2kHz Clarity Boost", "chapters": [{"ch_num": 1, "title_en": "The Role and Responsibilities of the Support Worker", "title_zh": "支持工作者的角色与职责", "audio_url": "audio/psw/ch1_master.mp3", "duration": 3024.87, "size_bytes": 24199639, "voice": "en-CA-LiamNeural", "timeline": [{"section_idx": 1, "title_en": "Objectives", "title_zh": "学习目标 (Objectives)", "start_time": 0.0, "end_time": 50.9, "duration": 50.9, "en_text": "After reading this chapter, the learner should be able to do the following: 1. Identify the role support workers play within the health care team. 2. Describe the goal of support work. 3. Differentiate between activities of daily living (ADLs) and instrumental activities of daily living (IADLs). 4. Describe the main responsibilities of the support worker. 5. Describe the importance of understanding the roles and responsibilities of support work. 6. Distinguish between regulated and unregulated health care providers. 7. Describe the significance of having a professional approach to support work. 8. Identify the things to consider when thinking critically and solving problems. 9. List the principles of client-centred care.", "cn_text": "完成本章研读后，学习者应当能够达成以下核心专业能力考核目标： 1. 明确支持工作者在整个跨学科医疗卫生照护团队中所扮演的角色。 2. 阐述支持工作的根本执业宗旨与终极目标。 3. 准确区分“基础日常生活活动”（ADLs）与“工具性日常生活活动”（IADLs）。 4. 详尽阐述支持工作者的六大核心工作职责范畴。 5. 阐明深刻理解支持工作角色范畴与法定责任对执业安全的重要意义。 6. 明晰受监管专业医护人员与未受监管健康照护人员的法律界限。 7. 阐明在日常支持工作中秉持专业素养与严谨态度的重要价值。 8. 掌握在进行临床批判性思维与解决实际照护难题时必须考量的四大核心要素。 9. 准确列举“以服务对象为中心”的 DIPPS 核心人本照护原则。"}, {"section_idx": 2, "title_en": "What is a Support Worker & Client?", "title_zh": "支持工作者的定义与服务对象 (What is a Support Worker & Client?)", "start_time": 50.9, "end_time": 73.82, "duration": 22.92, "en_text": "Support workers provide care and assistance to clients of any age who have defined health care needs and who require help with their daily activities, whether they live in a facility or in the community. Client is a general term for any person receiving care or support services in a community setting, such as hospital patients, facility residents, and clients in the community.", "cn_text": "支持工作者（Support Worker）为处于任何年龄段、具有明确医疗健康与照护需求，且在日常生活活动中需要协助的人士提供专业照料与支持服务，无论其身处机构环境还是社区之中。“服务对象”（Client）是对在各类照护场景中接受医疗照护或支持服务的所有个体的总称，涵盖医院中的患者（Patients）、照护机构中的院舍长者/居民（Residents）以及居住在社区家庭中的案主（Community Clients）。"}, {"section_idx": 3, "title_en": "The Ultimate Goal of Support Work", "title_zh": "支持工作的终极目标 (The Ultimate Goal of Support Work)", "start_time": 73.82, "end_time": 111.72, "duration": 37.9, "en_text": "The ultimate goal of support work is to improve the quality of life of the client and family by offering client-centred care and support in a safe, kind, sensitive, caring, and understanding manner. Support workers can make a difference in people's lives by alleviating loneliness, providing empathy, ensuring comfort, encouraging independence, and promoting the client's self-respect (FIGURE 1.1). They support the client and family in a holistic manner by addressing the client's physical, psychological, social, cognitive, cultural, and spiritual needs and advocate for the client by speaking or acting on the client's behalf.", "cn_text": "支持工作的终极目标在于：通过以一种安全、仁善、敏锐、慈爱与理解的方式提供“以服务对象为中心的照护与支持”，全面提升服务对象及其家庭的生活质量。支持工作者通过排遣孤独、倾注同理心、确保身心舒适、鼓励自立自主并维护服务对象的自尊心，真正改变并丰盈人们的生命历程（参见图 1.1）。他们以“全人照护（Holistic Care）”的理念支持服务对象及其家庭，全面满足服务对象在身体生理、心理情绪、社交人际、智力认知、文化传统及精神灵性六大维度的多维需求，并在必要时代其发声或采取行动，忠实捍卫服务对象的合法权益。 ![Figure 1.1 Support Worker Comforting Client](../images/chapter01/fig11supportworkercomfortingclient.png) 图 1.1 教学图示：支持工作者给予服务对象温情抚慰 FIGURE 1.1: A support worker comforts a client. (iStockphoto/FG Trade.) 【临床启示】体温般的肢体触碰与专注倾听，是消除机构长者孤独感、传递安全感最有力的非语言沟通工具。"}, {"section_idx": 4, "title_en": "Teamwork, Legislation, and Professional Discretion", "title_zh": "团队协作、执业规制与专业严谨性 (Teamwork, Legislation, and Professional Discretion)", "start_time": 111.72, "end_time": 150.72, "duration": 39.0, "en_text": "Support workers may work as part of a health care team or work individually with a client. Legislation, employer policies, and a client's condition all influence how support workers function and how much supervision they need. They may collaborate with health care providers or with professionals outside of the health care sector, depending on the needs of their clients. Support workers must use discretion at all times and honour the client's right to confidentiality whenever discussing the client's case with co-workers. Support workers are expected to adapt their work style to the setting and to the needs and wishes of the client receiving care.", "cn_text": "支持工作者既可以作为多学科医疗照护团队的一员协同工作，也可以一对一单独为某位服务对象提供照护。省级法律法规、雇主管理规章制度以及服务对象自身的健康状况，共同决定了支持工作者具体如何履行职责以及需要接受何种程度的临床督导。根据服务对象的实际需求，他们可能需要与专业医护人员协作，亦可能需要与医疗卫生体系之外的其他专业人士协作。在任何时候与同事探讨案情时，支持工作者都必须秉持高度的审慎明辨（Discretion），并恪守服务对象的隐私保密权（Right to Confidentiality）。支持工作者必须具备高度的专业灵活性，能够根据不同的工作环境以及受助个体的具体需求与意愿，敏锐调整自身的工作方式与服务风格。"}, {"section_idx": 5, "title_en": "Support Work Across Canada", "title_zh": "加拿大各省职业称谓与现状差异 (Support Work Across Canada)", "start_time": 150.72, "end_time": 265.92, "duration": 115.2, "en_text": "The nature of support work varies across the country. There are differences in educational programs, work settings, job responsibilities, and terms used to describe support workers. Some sections of this text may not apply to support work in your particular city, province, or territory. If you are unsure about which parts apply to your area, ask your instructor or employer. The term support worker refers to the worker who provides personal care and support services. However, assisted-living worker, personal support worker, personal attendant, patient care assistant, resident care aide, resident care attendant, health care aide, home care attendant, home support worker, nursing aide, nursing attendant, community health worker, or continuing care assistant—among other titles—may be used in your province or territory to describe similar (but not always equivalent) jobs. The Appendix at the end of this book lists the support worker's titles in each province and territory. Because of the wide variety of titles, the general public may not be aware of what support workers are called in their own province or territory or even within a facility they use. It is the role of support workers, their employing agencies, other health care providers, and their province's or territory's Ministry of Health to inform others of their role and how it fits in their current health care structure. This list may also include several titles that are not equivalent to one another. For example, in Ontario, developmental service workers (DSWs) play a different role and follow different educational standards than personal support workers (PSWs), and yet both are considered to be support workers within the health care team. In some parts of Canada, the term personal attendant refers to a worker who is supervised directly by the person for whom they provide support services; personal attendants support people with physical disabilities. Educational programs to become a personal attendant are generally shorter than those for support workers.", "cn_text": "支持工作的性质在加拿大全境各省与地区之间存在一定差异。这种差异体现在培训教育大纲、工作场所类型、具体工作职责以及用于描述该职业的官方头衔上。本书中的某些章节可能并不完全适用于你所在的特定城市、省份或地区。如果你对自己所在地区适用的具体法规存在疑问，请及时向你的授课教师或雇主咨询。 “支持工作者”（Support Worker）是一个统称，特指提供个人照护与支持服务的专业从业人员。然而，在各个省份或地区，可能会使用以下头衔来描述类似（但并非完全等同）的岗位：辅助生活护理员（Assisted-living worker）、个人支持工作者（Personal support worker, PSW）、私人照护员（Personal attendant）、病患照护助理（Patient care assistant）、院舍照护助理（Resident care aide）、院舍照护员（Resident care attendant）、医疗保健照料员（Health care aide, HCA）、居家护理员（Home care attendant）、居家支持工作者（Home support worker）、护理助理（Nursing aide）、护士助手（Nursing attendant）、社区卫生工作者（Community health worker）或持续照料助理（Continuing care assistant, CCA）等。本书文末的附录详细汇总列出了各个省与地区对该岗位的官方头衔。 正因为头衔百花齐放，社会公众往往并不完全了解在自己所在的省份、地区乃至他们所使用的医疗机构中这些护理人员的正式称谓。支持工作者本人、其受雇机构、医疗团队中的其他医护人员以及各省和地区的卫生厅（Ministry of Health），均肩负着向社会大众普及该岗位职责及其在当前医疗卫生体系中定位的宣教责任。 需要特别指出的是，上述列出的诸多头衔之间并不能直接划等号。例如在安大略省，“发育障碍服务工作者”（Developmental Service Worker, DSW）与“个人支持工作者”（PSW）承担不同的职责角色，遵循完全不同的教育培训标准，但两者均被视为跨学科医疗团队中的支持工作者。在加拿大的某些地区，“私人照护员”（Personal Attendant）特指直接由接受服务者本人进行管理与督导的工作人员；私人照护员专门为肢体残疾人士提供生活支持，其成为私人照护员的培训课程时长通常明显短于标准支持工作者。"}, {"section_idx": 6, "title_en": "Workplace Settings & \"Eyes and Ears\"", "title_zh": "多元化工作场所与主管督导者的“眼睛和耳朵” (Workplace Settings & \"Eyes and Ears\")", "start_time": 265.92, "end_time": 344.18, "duration": 78.26, "en_text": "Support workers work in a variety of settings (see Chapter 3 for definitions and details of workplace settings). In all settings, support workers ensure the safety of their clients, including those who are living with cognitive or mental health challenges. Services provided by support workers to clients in their homes can enable some clients to live independently or with their families. Support workers may also assist clients with social support, or social reintegration, as they prepare to move into an assisted-living facility or group home. In long-term care facilities, support workers assist clients with complex health challenges. Support workers also provide comfort and end-of-life care to dying clients so that they can die with dignity. They are often the supervisor's \"eyes and ears,\" meaning that because they are the person who spends the most time with the client, they are most likely to observe or hear things that should be reported to the supervisor, who may be a nurse or another type of health care worker. Observing and reporting are very important parts of the support worker's role and can have a great impact on a client's care. Support workers may have to consult with other health care providers, such as social workers or physiotherapists, and may also have to consult with other professionals, such as the client's employers, clergy, or teachers, depending on the client's individual care plan.", "cn_text": "支持工作者的执业场所极为广泛多样（有关各类工作场所的精准定义与详细规范，参见第 3 章）。在所有执业场所中，支持工作者都必须时刻筑牢服务对象的安全防线，特别是针对那些患有认知障碍或心理精神健康挑战的脆弱人群。支持工作者在案主家中提供的居家入户服务，能够赋能许多长者与病患在自己的家中独立生活或与家人共享天伦。当案主准备入住辅助生活设施（Assisted-living facility）或集体居所（Group home）时，支持工作者还会协助案主获得社交支持或实现社会功能重聚融入（Social reintegration）。在长期照护院舍（Long-term care facilities）中，支持工作者协助患有复杂重度健康挑战的长者；他们亦为处于生命弥留阶段的垂危病患提供安宁抚慰与临终关怀，确保长者能够怀抱尊严安详离世。 支持工作者往往是临床督导护士的“眼睛和耳朵”（\"Eyes and Ears\"）：这意味着，由于支持工作者是与服务对象朝夕相处、陪伴时间最长的专业人员，他们最有可能第一时间观察到或听到需要向上级督导汇报的异常体征与病情变化——督导人员可能是注册护士或另一类专业医疗照护人员。敏锐的观察（Observing）与严谨的汇报（Reporting）是支持工作者角色中举足轻重的组成部分，对服务对象的照护质量与生命安全有着深远影响。 根据每位服务对象个性化照护计划的具体要求，支持工作者在日常工作中可能需要与其他医护人员进行跨学科会商（例如社会工作者或物理治疗师），亦可能需要与医疗卫生体系之外的其他专业人士进行沟通协作（例如案主的受雇雇主、神职人员/牧师或学校教师）。"}, {"section_idx": 7, "title_en": "The Six Categories of Responsibilities", "title_zh": "支持工作者的六大职责范畴概述 (The Six Categories of Responsibilities)", "start_time": 344.18, "end_time": 372.1, "duration": 27.91, "en_text": "A support worker's general responsibilities, depending on the jurisdiction in which they work, can be grouped into six categories: (1) personal care, (2) support for nurses and other health care providers, (3) family support, (4) social support, (5) housekeeping or home management, and (6) documenting and reporting any basic assessments, observations, and care provided in the client's record or chart.", "cn_text": "根据支持工作者所执业的司法辖区（所在省份或地区），其日常通用工作职责大体可归纳为六大核心范畴： 1. 个人生活照料（Personal care）； 2. 协助护士及其他医疗卫生团队成员（Support for nurses and other health care providers）； 3. 家庭系统支持（Family support）； 4. 社交与人际支持（Social support）； 5. 家务清洁或家居管理（Housekeeping or home management）； 6. 在案主病历档案中记录并汇报所提供的基础评估、观察所见及照护措施（Documenting and reporting any basic assessments, observations, and care provided）。"}, {"section_idx": 8, "title_en": "Personal Care: ADLs & IADLs", "title_zh": "1. 个人生活照料：ADLs 与 IADLs (Personal Care: ADLs & IADLs)", "start_time": 372.1, "end_time": 449.74, "duration": 77.64, "en_text": "Personal care responsibilities include assisting with activities of daily living (ADLs). These are the self-care actions that people perform every day to remain independent and to function effectively in society. Support workers help with daily activities such as eating, bathing, grooming, dressing, and toileting (\"elimination\"). They assist clients with limited mobility to change positions or move from one place to another and also help promote the client's safety and physical comfort. In community settings, support workers also assist clients with instrumental activities of daily living (IADLs), which are the complex and necessary skills needed to successfully live independently. These IADLs may include assisting the client with handling finances, assisting with management of medications, arranging transportation, shopping, preparing meals, assisting with using a telephone or other communication devices, and doing housework and basic home maintenance. The support worker is not responsible for deciding what should or should not be done for the client. However, while providing personal care, the support worker observes for and reports any changes in the client's behaviour or health. Such information is important to share with the appropriate person (either the charge nurse or the client's primary care nurse).", "cn_text": "个人生活照护职责包括协助服务对象完成基础日常生活活动（Activities of Daily Living, ADLs）。这些是人们为了维持自立生存并在社会中正常行使机能而每天必须执行的基本自我照料行为。支持工作者协助完成诸如进食（Eating）、沐浴（Bathing）、梳理修饰（Grooming）、穿衣（Dressing）以及如厕排泄（Toileting / Elimination）等日常活动。他们协助活动受限的长者变换体位（Change positions）或在床、轮椅之间转移搬运，并全力促进长者的机体安全与生理舒适。 在社区入户环境中，支持工作者还会协助案主完成工具性日常生活活动（Instrumental Activities of Daily Living, IADLs）。这些是维持在社区中独立生活所必需的复杂高阶生活技能，包括：协助案主管理日常财务收支、协助服药管理（按医嘱服药）、安排交通出行、外出采购食品杂物、烹饪配制健康餐食、协助使用电话或其他通讯设备，以及操持日常家务和基本房屋维护保养。 支持工作者没有权力擅自决定应当为案主做什么或不该做什么（必须严格遵照医嘱与照护计划）。然而，在提供个人照护的过程中，支持工作者必须敏锐观察并及时汇报服务对象在行为表现或健康状态上的任何细微变化。将这些宝贵信息第一时间共享给对口负责人（病区主管护士 Charge Nurse 或案主的责任护士 Primary Care Nurse），对保障照护安全具有决定性意义。"}, {"section_idx": 9, "title_en": "Support for Nurses and Other Providers", "title_zh": "2. 协助护士与其他医护人员 (Support for Nurses and Other Providers)", "start_time": 449.74, "end_time": 474.31, "duration": 24.58, "en_text": "Support workers assist nurses or other health care team members by following the established care plan for each client; for instance, they may be required to clean equipment, measure and report vital signs, or assist with simple wound care. Support workers might also assist with oxygen therapy, heat or cold applications, and range-of-motion (ROM) exercises.", "cn_text": "支持工作者通过严格执行为每位服务对象量身定制的既定照护计划（Established Care Plan），全力协助护士及其他医疗团队成员；例如，他们可能会被要求清洗消毒医疗辅助器材、测量并记录汇报生命体征（体温、脉搏、呼吸、血压）、或协助进行简单无菌伤口换药照料。在经过专门技能培训并获授权委派的情形下，支持工作者还可能协助实施氧气吸入疗法（Oxygen therapy）、冷热敷物理治疗应用（Heat or cold applications）以及关节活动度康复训练（Range-of-motion / ROM exercises）。"}, {"section_idx": 10, "title_en": "Family Support", "title_zh": "3. 家庭系统支持 (Family Support)", "start_time": 474.31, "end_time": 504.89, "duration": 30.58, "en_text": "In many facilities, support workers assist with admissions and discharges by introducing the client and family to the facility and helping the client unpack and settle in. In private homes, support workers help families care for loved ones who are living with health issues or need assistance with ADLs. Some families may need help with preparing meals and doing household chores; other families may need help with child care. Support worker services often give family caregivers a break from their duties.", "cn_text": "在诸多照护机构中，支持工作者通过向服务对象及其家属介绍机构的设施环境、帮助案主拆箱整理行李并安顿入住，积极协助办理入院（Admissions）与出院（Discharges）手续。在私人家庭中，支持工作者协助家庭照料患病或在日常生活活动中需要照护的挚爱亲人。有些家庭可能需要协助备餐与操持家务；有些家庭可能需要协助照料年幼儿童。支持工作者所提供的入户服务，往往能为长期处于高压状态下的家庭照护者（Family caregivers）提供极其珍贵的喘息休息机会（Respite break），防止家庭照料者身心崩溃。"}, {"section_idx": 11, "title_en": "Social Support", "title_zh": "4. 社交与人际支持 (Social Support)", "start_time": 504.89, "end_time": 530.21, "duration": 25.32, "en_text": "Support workers may help clients participate in social activities. These activities provide the client with enjoyment, recreation, and a chance to meet with friends. They may organize games and outings or may be hired privately to be a client's companion. Support workers may also be responsible for teaching clients to learn to live independently and to cook, clean, or shop by themselves.", "cn_text": "支持工作者可以协助服务对象参与丰富多彩的社交活动。这些活动为长者带来身心愉悦、文娱享受以及与亲朋好友聚会交往的契机。他们可以组织益智桌游与户外远足郊游，亦可作为私人受雇的专业陪伴者（Companion）。支持工作者还可能负责对服务对象进行功能康复指导，培训他们重新掌握自立生活的技能，学会自己动手做饭烹饪、打扫清洁或独立去超市采购。"}, {"section_idx": 12, "title_en": "Housekeeping or Home Management", "title_zh": "5. 家务管理与家居环境维系 (Housekeeping or Home Management)", "start_time": 530.21, "end_time": 561.19, "duration": 30.98, "en_text": "Support workers often do a variety of housekeeping tasks in a facility setting, including making beds, delivering meals, tidying up living areas, and maintaining supplies. In a private home, housekeeping is called home management. Services depend on the needs of the person and the resources available to provide these services. Duties may include assisting clients with their IADLs, doing light housekeeping, doing laundry, and preparing and serving nutritious meals.", "cn_text": "在机构环境中，支持工作者经常执行一系列家务保洁任务，包括整理铺床更单、运送分发餐盘、整理收拾起居区域以及补充维护护理消耗用品。在私人家庭环境中，家务工作被称为“家居管理”（Home Management）。具体服务内容完全取决于案主的个体需求以及该家庭可调用的资源条件。日常职责可能包括：协助案主执行工具性日常生活活动、从事日常轻度家务清洁、洗涤晾晒与熨烫衣物，以及规划烹饪并端送符合膳食指南的营养餐食。"}, {"section_idx": 13, "title_en": "Documenting and Reporting", "title_zh": "6. 基础评估、观察记录与书面汇报 (Documenting and Reporting)", "start_time": 561.19, "end_time": 617.14, "duration": 55.94, "en_text": "As part of their professional accountability, all health care workers are legally responsible for reporting and documenting any client care they provide, as well as basic assessments and important observations about their clients. Examples of basic assessments or observations include if the client complains of pain, or if they refuse to eat. Understanding what is important to report is part of the support worker's need to think critically (see page 13). Depending on the agency, documentation may be in a written or electronic format (see Chapter 26). The A Day in the Life boxes on pages 5-9 describe three support workers' typical workdays—in the community, in a long-term care facility, and in a hospital setting. In each box, the word nurse may mean registered nurse (RN), registered practical nurse (RPN), or licensed practical nurse (LPN), depending on the staffing policies of that particular agency.", "cn_text": "作为其职业问责制（Professional Accountability）的法律组成部分，所有医疗卫生工作者对自己所提供的任何照护服务、所执行的基础临床评估以及对案主的重要观察所见，均承担严格的记录与汇报法律责任。基础评估或临床观察的典型范例包括：案主是否主动主诉疼痛、或者案主是否出现拒食不吃等反常征象。敏锐理解哪些信息属于必须紧急向上汇报的危急值与异常点，是支持工作者运用批判性思维的必备核心素养（参见第 13 页）。根据受雇机构的性质不同，文书记录既可以采用纸质手写表单，亦可采用电子病历系统（Electronic Format，详见第 26 章医学文书详解）。 原书第 5 至 9 页所呈现的“支持工作者的一天”（A Day in the Life）真实案例模块，详尽生动地记录了三位支持工作者在不同临床场景下的典型一日实操记录——分别涵盖社区入户环境、长期照护院舍环境以及综合医院病区环境。在各个案例中，出现的“护士”（Nurse）一词根据具体机构的岗位编制政策，可能代表注册护士（RN）、注册实用护士（RPN）或执照实用护士（LPN）。"}, {"section_idx": 14, "title_en": "NOTE on Timeframes", "title_zh": "临床实操时间节点说明 (NOTE on Timeframes)", "start_time": 617.14, "end_time": 633.38, "duration": 16.25, "en_text": "NOTE: The timeframes stated below are approximate times only. The actual amount of time to complete the work stated may vary according to a support worker's assigned workload, a client's changing state of health, or staffing shortages.", "cn_text": "【临床执业重要提示】下文所述的时间节点仅为近似预估时间。完成每项工作实际耗费的时间，会因支持工作者当天受指派的工作负荷强度、服务对象动态波动的病情健康状况或机构人员短缺情况而发生合理浮动。"}, {"section_idx": 15, "title_en": "A Day in the Life of a Support Worker: In the Community / Home Care", "title_zh": "场景 1：社区入户照护 —— 史蒂芬的一天 (A Day in the Life of a Support Worker: In the Community / Home Care) (Pages 4 - 6)", "start_time": 633.38, "end_time": 860.57, "duration": 227.18, "en_text": "In the Community (Home Care) Each evening, Stephen receives his assignment for the next day from his supervisor. He uses the details in the assignment to plan his day. He consults a city map and plans his route. The people he is assigned to visit are living with a range of physical, emotional, and social issues and disabilities. Their major issues are briefly described below. - Ms. Lau, 32, is living with cerebral palsy. She uses a wheelchair. She lives alone. Two days per week, she works outside the home. She receives home care to help her prepare for work. - Mr. O'Connor, 59, is recovering at home from a stroke. He is paralyzed on one side of his body and has a speech-language disorder. His wife is his primary caregiver. Mr. O'Connor receives home care three mornings a week. Mrs. O'Connor, 51, is at work during Stephen's visit. - Mr. Horowitz, 71, is living with dementia. His wife, 67, is caring for him at home. The couple gets emotional and social support from family and friends. Mrs. Horowitz looks after her husband's personal care needs. They receive 2 hours of home care per week to give Mrs. Horowitz a break. - Ms. Adams, 25, is a single mother on social assistance. She is recovering from a Caesarean section. She gets very little social and emotional support. She has newborn twins and three young children aged 1, 3, and 4 years. Below are the tasks and activities that Stephen performs on a typical day at work. At all times he provides emotional support and provides care that is client centred. - 0715 to 0830 hours (7:15 a.m. to 8:30 a.m.) • Travels to first appointment; arrives at 0730 hours • Assists Ms. Lau with showering, grooming, and dressing • Helps Ms. Lau to prepare breakfast, clean up kitchen, and make bed • Records care provided, including any relevant observations - 0830 to 1000 hours (8:30 a.m. to 10:00 a.m.) • Travels to next appointment; arrives at 0900 hours • Assists Mr. O'Connor with elimination, bathing, shaving, hair care, and mouth care • Prepares breakfast for Mr. O'Connor and assists him with eating • Cleans up kitchen and makes bed • Takes Mr. O'Connor for a brief walk; he is learning to walk with a cane • Assists Mr. O'Connor with elimination again • Records care provided, including any relevant observations - 1000 to 1215 hours (10:00 a.m. to 12:15 p.m.) • Travels to next appointment; arrives at 1015 hours • Listens to Mrs. Horowitz, who is crying and says she is \"worn out; telephones supervisor, who, in turn, calls the Horowitzes' case manager; case manager schedules a visit • Assists Mr. Horowitz with elimination, bathing, shaving, hair care, and mouth care • Cleans kitchen and does light housework in main living areas • Prepares lunch for Mr. Horowitz and assists him with eating • Records care provided, including any relevant observations - 1215 to 1530 hours (12:15 p.m. to 3:30 p.m.) • Takes break for lunch • Travels to next appointment; arrives at 1330 hours, the same time as the public health nurse • Helps children wash faces and hands • Prepares lunch for Ms. Adams and the three older children while the nurse assists Ms. Adams with breastfeeding the infants; feeds 1-year-old • Helps children with oral hygiene after lunch • Prepares three dinners; leaves one in the refrigerator and the others in the freezer • Records care provided, including any relevant observations • Reports observations from the day to nurse supervisor (would report unusual findings immediately throughout the day to supervisor) • Drives home", "cn_text": "在社区环境中（居家照护 —— 史蒂芬的一天） 每天傍晚，史蒂芬（Stephen）会从主管那里接收次日的派单任务。他依据任务单上的详尽信息规划自己一天的行程，查阅城市地图并测算最优行驶路线。指派给他上门探访的案主们，正处于各类身体、心理情绪与社交功能障碍之中。四位案主的核心情况简述如下： - 刘女士（Ms. Lau，32岁）：患有脑性瘫痪（Cerebral palsy），依靠轮椅代步，目前独居。她每周有两天外出工作；她接受居家照护，主要是协助她做好早晨出门上班前的准备。 - 奥康纳先生（Mr. O'Connor，59岁）：中风（脑卒中）康复期，在家休养。他一侧肢体偏瘫并伴有言语语言障碍。其51岁的妻子是他的主要家庭照料者。奥康纳先生每周有三个上午接受居家照护；在史蒂芬上门服务期间，其妻子正好外出上班。 - 霍洛维茨先生（Mr. Horowitz，71岁）：患有失智症（认知症）。其67岁的妻子在家照料他。老夫妇能从亲朋好友处获得情感与社交支持，妻子负责照顾丈夫所有的个人日常生活自理需求。他们每周接受 2 小时居家照护支持，以便让妻子得到宝贵的喘息休息机会。 - 亚当斯女士（Ms. Adams，25岁）：领取社会救助金的年轻单亲母亲，刚接受了剖宫产手术（剖腹产）处于术后康复期，几乎得不到任何社交与情感支持。她膝下一对刚出生的双胞胎婴儿，以及另外三名幼童（分别为 1 岁、3 岁和 4 岁）。 以下是史蒂芬在典型工作日所执行的任务与活动。在整个过程中，他时刻给予案主情感支持，并践行以服务对象为中心的照护： - 07:15 - 08:30 (0715 to 0830 hours) • 驾车前往第一个派工住址；于 07:30 准时抵达刘女士家； • 协助刘女士完成淋浴洗澡、个人梳理修饰与穿衣； • 协助刘女士制作早餐、清理洗净厨房、整理铺好床铺； • 规范记录所提供的各项照护操作，包括任何相关的临床观察所见。 - 08:30 - 10:00 (0830 to 1000 hours) • 驱车前往下一个住址；于 09:00 抵达奥康纳先生家； • 协助奥康纳先生如厕排泄、擦浴、刮脸剃须、头发梳理及口腔护理； • 为奥康纳先生制作早餐，并耐心协助其进食； • 清洁收拾厨房餐具，整理铺好床铺； • 搀扶奥康纳先生进行短距离步行锻炼；他正在康复治疗师指导下学习使用手杖行走； • 再次协助奥康纳先生完成如厕排泄； • 详细记录所实施的照护及相关临床观察。 - 10:00 - 12:15 (1000 to 1215 hours) • 驱车前往下一处案主家；于 10:15 抵达霍洛维茨先生家； • 进门发现霍洛维茨太太正在抹泪饮泣，哭诉自己已经“彻底心力交瘁、精疲力竭（worn out）”；史蒂芬立即电话联络自己的主管护士，主管护士随即致电该家庭的官方个案经理（Case Manager）；个案经理迅速安排了紧急上门家访评估； • 协助霍洛维茨先生完成如厕排泄、沐浴洗澡、剃须、梳头及口腔护理； • 清洁厨房，对主要起居活动区域进行轻度家务打扫； • 为霍洛维茨先生制作午餐，并协助进食； • 规范记录照护操作与霍洛维茨太太情绪危机的观察。 - 12:15 - 15:30 (1215 to 1530 hours) • 享受个人午餐休息时间； • 驱车前往下一个家庭；于 13:30 抵达亚当斯女士家，此时公共卫生护士（Public Health Nurse）也恰好同时抵达； • 协助孩子们清洗脸部和双手； • 为亚当斯女士和三个较大的孩子制作午餐，此时公共卫生护士协助亚当斯女士为双胞胎婴儿进行母乳喂养；史蒂芬负责给 1 岁的幼童喂饭； • 午餐后协助孩子们完成餐后口腔清洁护理； • 提前烹制好三顿晚餐分量：留一份在冷藏室内，其余两份密封贴好标签放入冷冻室储存； • 全面记录所提供的照护操作及相关观察要点； • 向护士主管口头汇报全天的观察情况（若日间出现任何异常体征，史蒂芬都会在第一时间随时向上级汇报）； • 驾车下班返回家中。"}, {"section_idx": 16, "title_en": "A Day in the Life of a Support Worker: In a Long-Term Care Facility", "title_zh": "场景 2：长期照护院舍 —— 克莱尔的一天 (A Day in the Life of a Support Worker: In a Long-Term Care Facility) (Pages 5 - 7)", "start_time": 860.57, "end_time": 1149.26, "duration": 288.7, "en_text": "In a Long-Term Care Facility Claire works on a unit in which the residents, mostly older people, require help with ADLs. The eight residents assigned to her live with a range of physical, emotional, and social issues and disabilities. - Miss McDonald, 94, lives with a partial disability due to rheumatoid arthritis. - Mr. Schmidt, 82, is recovering from surgery. He lives with urinary incontinence, which causes him anxiety. - Mrs. Lawson, 88, is living with a heart condition and osteoarthritis. - Mr. Delgado, 63, has been paralyzed on one side following a stroke. He is unable to speak but is able to understand both written and spoken language. - Mr. Taylor, 71, is living with the early stages of Parkinson's disease. He has diabetes and poor vision as well. - Mrs. Sanchez, 81, is partially disabled due to multiple leg and hip fractures. She lives with osteoporosis. She is also depressed. - Mr. Bouchard, 89, is recovering from pneumonia. He has age-related hearing impairment. - Mrs. Khan, 44, is living with severe disability from multiple sclerosis. She lives with urinary and fecal incontinence. Below are the tasks and activities that Claire performs on a typical day at work. At all times she provides emotional support and provides care that is client centred. - 0700 to 0715 hours (7:00 a.m. to 7:15 a.m.) • Receives report from nurse on the conditions of all residents on the unit • Receives assignment of care requirements, appointments, and activities scheduled for residents • Plans morning's tasks and activities - 0715 to 0845 hours (7:15 a.m. to 8:45 a.m.) • Helps seven of the residents get out of bed • Provides partial hygiene care to six residents, a shower for one resident, and a tub bath for another • Assists with elimination and changes their incontinence briefs • Assists residents with dressing and accompanies them to the dining room • Returns to the unit; provides partial hygiene to Mrs. Khan • Observes that the cut on Mrs. Khan's arm looks red and swollen and feels warm to the touch; makes a written record of it and gives a verbal report to the nurse • With help from another support worker, moves Mrs. Khan from her bed to a wheelchair • Transports Mrs. Khan to the dining room for breakfast • Records care provided, including any relevant observations - 0845 to 0930 hours (8:45 a.m. to 9:30 a.m.) • Assists residents with breakfast, ensuring that all have a nutritious breakfast and that special diets are followed • Encourages Mr. Taylor, Mrs. Lawson, and Miss McDonald to eat • Assists Mrs. Khan with eating; transports Mrs. Khan back to her unit • Returns to dining room and accompanies other residents back to their units • Records each resident's dietary intake in dietary intake record • Records care provided, including any relevant observations - 0930 to 1130 hours (9:30 a.m. to 11:30 a.m.) • Reports to nurse that Mr. Taylor (who has diabetes) did not eat • With assistance, lifts Mrs. Khan and settles her in bed • Assists residents with mouth care and elimination; changes their incontinence briefs • Reports on the conditions of residents to replacement support worker; takes a 15-minute break • Completes hygiene and grooming care for residents who received only partial care before breakfast • At 1030 hours, accompanies residents to games room • Makes beds and changes linens • Repositions Mrs. Khan in bed to prevent pressure ulcers • Tidies rooms and living areas • At 1130 hours, accompanies residents back to their units from games room - 1130 to 1300 hours (11:30 a.m. to 1:00 p.m.) • Reports on the conditions of residents to replacement support worker; takes a 30-minute break for lunch • Checks care requirements for each resident and plans the afternoon's tasks and activities • Accompanies residents to the dining room • Supervises residents and assists with feeding, as required • Accompanies residents back to their units • Assists residents with elimination and changes their incontinence briefs • Assists with mouth care • Makes sure that residents rest after lunch, as directed • Records each resident's dietary intake in dietary intake record • Records care provided, including any relevant observations - 1300 to 1500 hours (1:00 p.m. to 3:00 p.m.) • Assists residents with elimination and changes their incontinence briefs • Greets new resident, Mrs. Griffiths, and her family; introduces them to the facility; assists Mrs. Griffiths with unpacking • Introduces Mrs. Griffiths to other residents • Repositions Mrs. Khan • Comforts Mrs. Griffiths, who is feeling upset and lonely • Takes Mrs. Sanchez and Mrs. Griffiths for a walk • Assists residents with elimination and changes their incontinence briefs • Records care provided, including any relevant observations • Provides a verbal report to the nurse concerning each client's care", "cn_text": "在长期照护院舍中（养老院病区 —— 克莱尔的一天） 克莱尔（Claire）在一家长期照护院舍病区工作，病区内的长者（绝大多数是老年人）在日常生活活动（ADLs）中都需要协助。指派给她照料的 8 位长者患有各种复杂的生理、心理与社交功能障碍： - 麦克唐纳小姐（Miss McDonald，94岁）：因严重的类风湿关节炎导致肢体部分残疾； - 施密特先生（Mr. Schmidt，82岁）：外科术后恢复期，患有尿失禁，失禁问题令他常年处于焦虑之中； - 劳森太太（Mrs. Lawson，88岁）：患有慢性心脏病以及骨关节炎； - 德尔加多先生（Mr. Delgado，63岁）：中风后导致一侧偏瘫，丧失言语能力，但能够完全理解口头语言与书面文字； - 泰勒先生（Mr. Taylor，71岁）：处于帕金森病早期，同时伴有糖尿病及严重视力减退； - 桑切斯太太（Mrs. Sanchez，81岁）：因多次发生下肢和髋部骨折导致部分残疾，伴有骨质疏松症，且处于抑郁状态； - 布夏先生（Mr. Bouchard，89岁）：肺炎康复期，患有老年性听力减退； - 汗太太（Mrs. Khan，44岁）：因多发性硬化症导致重度残疾，伴有大小便双重失禁。 以下是克莱尔在典型白班中的工作实录。在全天各个时刻，她始终给予长者情感支撑，并践行以服务对象为中心的照护： - 07:00 - 07:15 (0700 to 0715 hours) • 参加晨间大交班，听取交班护士关于病区内所有长者夜间身心状况的详细报告； • 接收当天的照护任务单，核对长者照护需求、检查预约及日程活动； • 制定并优化上午各项工作与照护活动的行动计划。 - 07:15 - 08:45 (0715 to 0845 hours) • 协助其中 7 位长者起床离床； • 为 6 位长者提供晨间部分身体清洁，协助 1 位长者进行淋浴，协助另 1 位长者进行盆浴； • 协助长者如厕排泄，并更换污染的失禁纸尿裤/防漏垫； • 协助长者穿衣整理，并护送陪伴他们前往病区中央大餐厅就餐； • 返回病房单元，为卧床的汗太太提供床旁部分身体卫生护理； • 关键临床观察：敏锐发现汗太太手臂上的一处皮肤划痕呈现红肿、发热体征；克莱尔立即进行书面记录，并当场向责任护士做出紧急口头汇报； • 在另一位支持工作者的通力配合下（双人搬运），将汗太太从病床上平稳安全转移至轮椅上； • 用轮椅护送汗太太前往餐厅享用早餐； • 详细记录所完成的照护内容与临床观察。 - 08:45 - 09:30 (0845 to 0930 hours) • 在大餐厅协助长者享用早餐，确保所有人都能摄入充足营养，并严格核对特殊治疗饮食； • 耐心鼓励食欲不佳的泰勒先生、劳森太太和麦克唐纳小姐进食； • 细心喂助无法自理的汗太太进餐；餐毕护送汗太太乘轮椅返回病房休息； • 返回大餐厅，陪伴并护送其他长者安全返回各自的病房单元； • 在长者专用膳食摄入记录单（Dietary Intake Record）上精确登记每位长者的进食百分比； • 规范记录所执行的照护操作。 - 09:30 - 11:30 (0930 to 1130 hours) • 紧急向责任护士汇报：患有糖尿病的泰勒先生早餐几乎分文未进（可能引发低血糖反应）； • 在同事协助下，将汗太太从轮椅抬起并舒适安顿在病床上； • 协助长者进行餐后口腔卫生清洁与排泄如厕，更换失禁护理垫； • 向接班顶岗支持工作者详细口头交班长者状况，享受合法的 15 分钟工间工休； • 为早餐前仅接受了部分清洁的长者补齐完整的个人卫生与梳理修饰； • 于 10:30 护送长者前往病区康乐活动室参加益智桌游活动； • 返回整理床铺，彻底更换汗渍与污损床单被套； • 为卧床的汗太太执行轴线翻身与体位变换，运用软枕减压以预防压疮（褥疮）； • 整理打扫房间与公共起居区域； • 于 11:30 再次前往活动室，陪伴长者返回各自病房。 - 11:30 - 13:00 (1130 to 1300 hours) • 向替班同事交班长者最新动态；享受 30 分钟午餐休息； • 核对长者下午最新的照护医嘱与需求，制定下午的活动流程； • 陪伴长者前往餐厅享用午餐； • 在餐厅进行全场监护，按需协助吞咽困难或进食不便的长者喂食； • 午餐结束后，护送陪伴长者安全返回病房； • 协助长者如厕排泄，更换清洁失禁护理垫； • 协助长者进行餐后漱口与义齿清洁等口腔护理； • 遵照医嘱，确保长者在午餐后舒适平卧或半卧位安静午休； • 在膳食摄入记录单上登记每位长者的午餐进食量； • 详实记录所实施的各项照护与重要观察。 - 13:00 - 15:00 (1300 to 1500 hours) • 协助长者排泄，检查并更换失禁短裤； • 热情迎接刚办理入住的新长者格里菲思太太（Mrs. Griffiths）及其家属；向他们详细介绍院舍环境与设施；协助格里菲思太太拆箱整理个人衣物与生活用品并妥善归位； • 将格里菲思太太引见介绍给病区内的其他长者认识； • 为卧床的汗太太再次执行减压翻身与体位摆放； • 发现新入住的格里菲思太太情绪低落、深感孤独与不安，克莱尔坐在其身旁给予亲切温情的安慰与心理疏导； • 陪伴桑切斯太太与新来的格里菲思太太在院舍安全走廊内散步交流； • 协助长者如厕排泄，更换失禁纸尿裤； • 全面记录所完成的照护内容； • 在白班结束前，向当班责任护士就每位长者的全天护理反应与观察所见进行详尽严谨的面对面口头大交班。"}, {"section_idx": 17, "title_en": "A Day in the Life of a Support Worker: In a Hospital", "title_zh": "场景 3：综合医院急性外科病房 —— 吉娜的一天 (A Day in the Life of a Support Worker: In a Hospital) (Pages 7 - 9)", "start_time": 1149.26, "end_time": 1410.34, "duration": 261.07, "en_text": "In a Hospital Gina works on a surgical unit, which is one type of acute care. Most clients on this unit have had surgery for fractures (broken bones). Others have had hip- or knee-replacement surgery. A few are waiting for their surgery. Many of these clients are living with additional health issues. Gina assists with the care of 10 clients. - Miss Kwan, 66, sustained a thigh bone (femur) fracture. - Mr. McDuff, 76, sustained a recent spine fracture and lives with osteoporosis. - Mrs. Sadiq, 46, sustained shoulder and rib fractures, and lives with osteoporosis and quadriplegia. - Mrs. Clark, 85, sustained a hip fracture. She lives with osteoporosis and Alzheimer's disease. - Mr. Keene, 44, sustained fractures in the thigh bone and left knee. - Mr. Cross, 55, has had a knee replacement. He lives with arthritis. - Mrs. Pocza, 82, has sustained a hip fracture and lives with osteoporosis. - Ms. Hill, 35, has sustained multiple fractures involving her spine, thigh bone, and ankle. - Mrs. Leblanc, 74, has had a hip replacement. She also lives with diabetes. - Mr. Paes, 82, has sustained a hip fracture. He also lives with hearing impairment. Below are the tasks and activities that Gina performs on a typical day at work. At all times she provides emotional support and provides care that is client centred. - 0700 to 0710 hours (7:00 a.m. to 7:10 a.m.) • Receives assignment on care requirements • Plans morning's tasks and activities - 0710 to 0800 hours (7:10 a.m. to 8:00 a.m.) • Provides hygiene care to four clients, including assisting with oral hygiene and hair care and providing partial bed baths • Assists with elimination • Records care provided, including any relevant observations - 0800 to 0845 hours (8:00 a.m. to 8:45 a.m.) • Accompanies dietary staff as they deliver breakfast trays • Positions and arranges trays for clients; assists clients with eating • Listens to Mrs. Pocza's concerns about her surgery; calls for the nurse, who answers Mrs. Pocza's questions • Records clients' food and fluid intakes • Assists clients with elimination • Records care provided, including any relevant observations - 0845 to 1130 hours (8:45 a.m. to 11:30 a.m.) • Assists clients with hygiene, elimination, showers, and baths, as required • Reports on the conditions of clients and care requirements to replacement support worker; takes a 15-minute break • Makes and changes beds • Assists with two discharges; helps clients pack • Helps nurse to reposition clients, as required • Assists clients with leg exercises and coughing and deep-breathing exercises • Records care provided, including any relevant observations - 1130 to 1300 hours (11:30 a.m. to 1:00 p.m.) • Reports on the conditions of clients and care requirements to replacement support worker; takes a 30-minute break for lunch • Checks the condition and care requirements of each client and plans afternoon tasks • Accompanies dietary staff as they deliver lunch trays • Positions and arranges trays for clients; assists clients with eating • Observes that Mr. McDuff's intravenous (IV) fluid is running low; notifies nurse immediately • Records food and fluid intakes • Assists clients with elimination and mouth care • Records care provided, including any relevant observations - 1300 to 1500 hours (1:00 p.m. to 3:00 p.m.) • Removes Mr. Paes's dentures before his medications are given • Assists clients with elimination • Observes drainage under Miss Kwan's cast; notifies nurse immediately • Answers call from nurse; provides comfort to Mrs. Clark, who is upset • Assists clients with leg exercises and coughing and deep-breathing exercises • Assists with admitting two clients • Helps nurse reposition clients, as required • Records care provided, including any relevant observations • Provides a verbal report to the nurse who is responsible for each of these clients (NOTE: In many hospitals, a client is assigned to a primary care nurse. A support worker might be assigned to help care for the clients of several nurses so would have to report observations about the clients he or she works with to each client's primary care nurse.)", "cn_text": "在综合医院中（急性外科骨科病房 —— 吉娜的一天） 吉娜（Gina）在一家综合医院的外科病区工作，这是急性照护（Acute Care）的一种典型类型。该病区收治的大多数患者均因骨折（骨骼断裂）接受了急诊手术，其他患者则刚接受了全髋关节或全膝关节置换手术，少数患者正在等待择期手术。这些患者中的绝大多数同时合并有慢性基础疾病。吉娜协助照料其中的 10 位患者： - 关小姐（Miss Kwan，66岁）：股骨（大腿骨）骨折术后； - 麦克达夫先生（Mr. McDuff，76岁）：近期发生脊柱骨折，患有严重骨质疏松症； - 萨迪克太太（Mrs. Sadiq，46岁）：肩关节与多发肋骨骨折，伴有骨质疏松症及高位截瘫（四肢瘫痪 Quadriplegia）； - 克拉克太太（Mrs. Clark，85岁）：髋部骨折术后，伴有骨质疏松症与阿尔茨海默病（失智症）； - 基恩先生（Mr. Keene，44岁）：股骨及左膝关节复合粉碎性骨折； - 克罗斯先生（Mr. Cross，55岁）：刚接受了全膝关节置换术，患有关节炎； - 波茨卡太太（Mrs. Pocza，82岁）：髋关节骨折术后，伴有严重骨质疏松； - 希尔女士（Ms. Hill，35岁）：复合多发性创伤骨折，累及脊柱、股骨与踝关节； - 勒布朗太太（Mrs. Leblanc，74岁）：全髋关节置换术后，合并患有糖尿病； - 佩斯先生（Mr. Paes，82岁）：髋关节骨折术后，合并伴有老年性重度听力衰退。 以下是吉娜在典型白班中的工作实录。在全天各个时刻，她始终为伤痛中的患者提供情感支撑，严格落实以服务对象为中心的床旁照护： - 07:00 - 07:10 (0700 to 0710 hours) • 参加晨会，接收管辖 10 位外科手术患者的医疗照护交班指令； • 规划上午各项翻身、排泄及生活照护行动步骤。 - 07:10 - 08:00 (0710 to 0800 hours) • 为 4 位患者提供晨间基础卫生清洁，包括协助进行口腔护理、头发梳理及床上部分擦浴； • 协助卧床患者使用便盆或尿壶排泄； • 规范记录照护操作与临床观察。 - 08:00 - 08:45 (0800 to 0845 hours) • 陪同营养膳食科工作人员分发患者的早餐托盘； • 调节摇升病床摇把，为患者摆放并调整进餐托盘支架；按需协助患者进食； • 发现波茨卡太太对即将到来的手术充满恐惧与忧虑，吉娜耐心倾听并立即呼叫责任护士，由护士进病房向老人详细解答手术答疑； • 精确测量并记录患者的食物摄入比例与液体摄入量； • 协助患者如厕排泄； • 详细记录照护操作。 - 08:45 - 11:30 (0845 to 1130 hours) • 按需协助患者完成个人深度卫生清洁、如厕、淋浴及床上擦浴； • 向替班支持工作者口头交班患者状况与待办事项，享受 15 分钟工间工休； • 规范制作与更换术后防压疮无菌病床床单； • 协助办理 2 位康复患者的出院手续，协助打包随身行李并安全护送离院； • 配合责任护士为大手术患者进行轴线翻身与术后被动体位摆放； • 关键术后康复协助：遵医嘱协助患者执行下肢功能锻炼（防止深静脉血栓 DVT），并指导协助患者进行深呼吸与有效咳嗽排痰训练（预防肺不张与坠积性肺炎）； • 规范记录所实施的照护操作与生命体征。 - 11:30 - 13:00 (1130 to 1300 hours) • 向替班同事全面交班，享受 30 分钟午餐轮休； • 检查每位患者最新的临床状况与照护要求，排定下午的工作次序； • 陪同膳食科员工分发午餐托盘； • 为患者安放餐盘，协助进餐； • 危急体征抢先发现：吉娜在巡视病房时敏锐观察到麦克达夫先生的静脉输液袋（IV Fluid）即将滴空输尽；她毫不延误，第一时间立即按铃通知责任护士更换液体，避免了输液针管回血堵塞； • 记录全员午餐饮食摄入量与饮水量； • 协助患者完成餐后如厕排泄与口腔清洁； • 书写并录入系统照护记录。 - 13:00 - 15:00 (1300 to 1500 hours) • 重要用药前护理准备：在护士给佩斯先生口服发药之前，吉娜提前为佩斯先生摘除取出其上下活动义齿（假牙），以防服药吞咽胶囊药片时发生误吸卡喉甚至窒息； • 协助患者如厕排泄； • 危急渗血渗液发现：吉娜在为关小姐翻身时，敏锐观察到其大腿石膏固定托架（Cast）下方有液体渗出渗血痕迹；她立即紧急通报责任护士进场评估，有效防范了术后活动性出血并发症； • 应护士站传呼机呼叫，进病房为因骨折疼痛深感沮丧焦虑的克拉克太太提供心理抚慰与温情陪伴； • 协助患者再次执行下肢关节屈伸锻炼以及深呼吸有效咳嗽排痰肺部物理治疗； • 协助办理 2 位急诊新收患者的入院手续； • 配合责任护士为多发骨折患者实施轴线翻身与体位减压； • 全面书写并核验当天所有的病历照护记录； • 在下班前，向分别负责这些患者的多位主管责任护士进行一对一的闭环口头交接汇报。 【医院责任制整体护理与层级汇报模式注解】 (NOTE: In many hospitals, a client is assigned to a primary care nurse. A support worker might be assigned to help care for the clients of several nurses so would have to report observations about the clients he or she works with to each client's primary care nurse.) 【原书临床机制解析】在加拿大诸多大型医院中，病患普遍采用“责任制责任护士”（Primary Care Nurse）进行专案管理。一名支持工作者通常被同时指派协助多名不同责任护士所管辖的患者。因此，支持工作者必须清晰明确每位患者对应的责任护士是谁，并将其全天观察到的病人体征与异常准确交接给该患者各自的专责护士，杜绝推诿遗漏。"}, {"section_idx": 18, "title_en": "People Who Receive Support Services", "title_zh": "受助人群的通用专业称谓 (People Who Receive Support Services)", "start_time": 1410.34, "end_time": 1475.11, "duration": 64.78, "en_text": "People receiving health care and support services are known by different terms, depending on the setting. A person receiving care in a hospital is usually called a patient. A person living in a live-in facility is called a resident. A person receiving care or support services in the community is called a client. Client is also an all-encompassing term for people receiving health care or support services: hospital patients, facility residents, and clients in the community. Whether the individual receiving care is known as a client, patient, or resident, always remember that he or she is a person. Every person is unique, with unique life experiences and situations, desires and opinions. Each will have different needs and different abilities. Support workers work with people from a variety of cultures or backgrounds (see Chapter 7). Part of the support worker's job is to accept this diversity among people. The Respecting Diversity boxes that appear throughout this text outline the importance of diversity and how people's backgrounds influence who they are and what they do.", "cn_text": "接受医疗保健与支持服务的人群，根据其所处的医疗照护场所不同，在专业上被冠以不同的称谓： - 在综合医院或急性照护机构中接受治疗护理的人士，通常被称为患者（Patient）； - 在全寄宿式照护机构（养老院、护理院、辅助生活院舍）中长住的人士，被称为院舍长者 / 居民（Resident）； - 在社区或私人家庭环境中接受支持照护服务的人士，被称为案主 / 客户（Client）； - 同时，“服务对象”（Client）也是一个统摄全局的尊称总称，泛指一切在医院、机构或社区中接受照护支持的个体。 无论被照料的个体在术语上被称为案主、患者还是院舍长者，支持工作者都必须时刻铭记：他或她首先是一个活生生、有尊严的“人”（Person）。每一个人都是独一无二的，拥有独一无二的人生履历、生活境遇、内心愿望与观点立场。每个人都有截然不同的生理心理需求以及残存的机能水平。支持工作者需要与来自多元文化、不同种族、不同宗教与社会背景的人士共事（详见第 7 章多元文化照护）。包容并接纳人与人之间的文化多元性（Diversity），是支持工作者职业素养不可或缺的基石。全书中贯穿设立的“尊重多元文化”（Respecting Diversity）特色专栏，深刻阐释了多元文化包容的重要性，并剖析了文化背景如何深刻塑造个体的言行举止与价值取向。"}, {"section_idx": 19, "title_en": "Nine Categories of Clients Grouped by Issues, Needs, and Ages", "title_zh": "加拿大受助人群的九大核心类别 (Nine Categories of Clients Grouped by Issues, Needs, and Ages)", "start_time": 1475.11, "end_time": 1720.58, "duration": 245.47, "en_text": "Clients can be grouped according to their issues, needs, and ages: - Older persons. Aging is a normal process and is not an illness or disease. Many older persons enjoy good health. However, body changes normally occur with the aging process. Social and emotional changes may also occur (see Chapter 43). The risks for contracting serious illnesses and becoming disabled increase with age. Most older persons remain at home as long as possible. Others are unable to manage even with assistance and move into a live-in facility. Throughout the text, issues relevant to older persons are discussed. - People with disabilities. Some people are living with disabilities due to illness, injury, or conditions present at birth. Disabilities may affect physical functioning, mental functioning, or both. Many adults with disabilities live in their own homes. Many work outside their homes. Support workers might help clients living with disabilities with their ADLs or might be responsible for teaching them how to perform the ADLs independently. - People with medical issues. Medical issues include illnesses, diseases, and injuries. These may include short-term (such as a broken bone), long-term (such as diabetes or multiple sclerosis), or progressive and life-threatening (such as some types of cancer) issues. - People having surgery. Surgical clients are those being prepared for surgery or who have recently had surgery. Preoperative care includes preparing the client for what to expect after surgery and addressing the client's fears and anxieties. Needs after surgery relate to relieving pain and discomfort, preventing complications, and helping the client adjust to body changes. People recover from surgeries in hospitals or in their homes. - People with mental health issues. Mental health issues range from mild to severe. Some people function normally but need help making decisions or coping with life stresses. Others are severely affected and need assistance with ADLs. - People needing rehabilitation. Rehabilitation is the process of restoring a person to the highest possible level of functioning through the use of therapy, exercise, or other methods. The person may need to regain functions lost due to surgery, illness, or accident. Some hospitals have special rehabilitation units. Many people receiving support at home and in long-term care settings require rehabilitation. - Children. When hospital care is needed, children are admitted to the pediatric unit. In some areas of Canada, support workers are hired to work in pediatric units (FIGURE 1.2). However, most support work for children occurs in community settings and long-term care facilities. Some children who receive care are living with physical or intellectual disabilities. Others need care because a parent has a medical challenge or has just had a new baby. The Focus on Children boxes and Chapter 42 discuss issues related to caring for children. - Birth parents and newborns. Complications and difficulties can occur at any time during pregnancy and even up to 6 to 8 weeks following childbirth. Some new birth parents need assistance with their own care or with their newborn's care. Most support work with birth parents and newborns takes place in the home (see Chapter 41). - People requiring special care. Some people who have serious and complex medical conditions need special care and equipment. Hospitals have special care units, including critical care units, coronary care units, kidney dialysis units, burn units, and emergency departments. In some areas of Canada, support workers are hired to work in these units. Support workers might transport people from one unit to another; take specimens to the lab; assist clients with bathing, feeding, mobility, or toileting; and assist other health care providers with special procedures. In some parts of Canada, support workers are not allowed to provide personal care to clients in unstable or critical conditions.", "cn_text": "根据受助个体的健康问题、照护需求与年龄跨度，服务对象可清晰归纳为九大核心类别： - 老年人群（Older persons）：衰老是一个不可逆转的正常生理过程，其本身绝非一种病态或疾病。许多老年人身体康健、精神矍铄。然而，机体生理结构的衰退性改变会随着增龄自然发生，社会人际与心理情绪的变化亦往往随之而来（详见第 43 章老年照护）。随着年龄增长，罹患急慢性严重疾病与出现失能的风险显著上升。绝大多数长者都渴望尽可能长久地留在家中生活；一部分长者在即便有外力协助下仍无法安全维持自理时，才会选择入住寄宿型长照机构。全书各章节将对长者照护展开系统阐述。 - 残障 / 残疾人士（People with disabilities）：一部分群体因罹患重病、意外创伤或先天性发育异常而生活在残障状态之中。残疾可能损害其躯体运动机能、心理智力机能，或二者兼有。许多成年残障人士完全能够居住在自己的私人住所中，甚至正常外出工作。支持工作者可以协助残障案主完成其日常生活活动（ADLs），或承担康复训练职责，教会他们如何独立执行这些自我照护技能。 - 内外科医疗疾患人士（People with medical issues）：医疗疾患涵盖各种急性病、慢性疾病及外伤创伤。按病程可划分为短期突发性问题（如单处骨折）、长期慢性慢性病（如糖尿病、多发性硬化症），或是进行性恶化、危及生命的重症（如某些类型的晚期恶性肿瘤）。 - 围手术期外科手术患者（People having surgery）：外科手术患者包括正在接受术前准备的案主，或刚完成外科手术的术后病患。术前护理（Preoperative care）的核心在于让患者提前知晓术后康复流程、缓解其内心的恐惧与濒死焦虑；术后照护的重点则在于有效缓解疼痛与身体不适、积极预防肺栓塞及压疮等严重并发症，并协助患者逐步适应机体结构的术后改变。手术康复既可在医院病房内进行，亦可在患者家中展开。 - 心理与精神健康障碍人士（People with mental health issues）：心理精神健康问题的严重程度从轻微的情绪失调跨越到重度精神障碍。一部分案主在日常生活中能够维持正常社会机能，但在重大决策或应对生活极端压力事件时需要外力心理支持；另一部分严重受损的重症患者，则连最基本的进食穿衣等 ADLs 均需要全面协助。 - 需要康复治疗的人士（People needing rehabilitation）：康复（Rehabilitation）是指通过物理治疗、运动疗法、作业治疗或其他专科康复手段，将个体的身心功能恢复至其“所能达到的最高机能状态”的动态治疗过程。案主往往需要重新赢回因手术创伤、严重疾患或意外事故所丧失的肢体或言语功能。部分医院设立有专门的康复医学病区；在居家社区及长期照护机构中，大量长者与案主都需要持续接受康复支持。 - 儿童与儿科患者（Children）：当儿童患病需要住院救治时，会收治于医院儿科病房（Pediatric Unit）。在加拿大某些省份或地区，医院儿科病房会聘请支持工作者协助照料患儿（参见图 1.2）。然而，绝大多数针对儿童的支持服务发生在社区家庭或长期照护设施中。接受照护的儿童一部分患有先天性躯体或智力缺陷；另一部分儿童则是因为其父母突遭重病瘫痪，或家中刚刚迎来新生儿而需要协助照料大龄幼儿。全书设立的“聚焦儿童照护”（Focus on Children）专栏及第 42 章将对儿童照护展开深入剖析。 - 产妇与新生儿群体（Birth parents and newborns）：在整个妊娠期乃至产后 6 至 8 周的产褥期内，随时可能出现严重的产科并发症与育儿困难。一部分新手产妇在产后自我身体复原或新生儿哺乳抚育上亟需外力协助。支持工作者对产妇和新生儿的支持工作绝大部分在家庭环境中实施（详见第 41 章母婴照护）。 - 需要重症特级监护的特殊病患（People requiring special care）：患有极其严重且复杂的内外科病情的危重症个体，需要全天候严密监护与精密医疗设备支持。综合医院设立有一系列专科重症监护单元，包括重症监护病房（ICU/Critical Care Unit）、冠心病重症监护室（CCU）、血液透析室（Kidney Dialysis Unit）、烧伤救治病区（Burn Unit）及急诊抢救室（Emergency Department）。在加拿大某些省份，医院会聘请支持工作者在这些重症科室工作。支持工作者的职责可能包括：在科室之间安全转运重症病患、运送关键血标本至中心实验室、协助患者完成皮肤擦浴、喂食、体位移动或排泄，以及协助专科医生和护士开展复杂的专科诊疗操作。在加拿大某些管辖区，法律严格规定严禁支持工作者对处于生命体征极其不稳定或处于病危垂死状态下的患者独立提供个人照料。 ![Figure 1.2 Support Worker Caring for Sick Child](../images/chapter01/fig12supportworkercaringforsickchild.png) 图 1.2 教学图示：支持工作者在医疗机构中关爱呵护患病儿童 FIGURE 1.2: A support worker provides care to a sick child. (iStockphoto/FatCamera.) 【临床启示】儿童绝非缩小的成人；与患儿沟通需保持视线平视、运用充满童趣的温和语言，在协助治疗的同时守护患儿的心理安全感。"}, {"section_idx": 20, "title_en": "The Health Care Team", "title_zh": "医疗卫生照护团队的本质 (The Health Care Team)", "start_time": 1720.58, "end_time": 1745.38, "duration": 24.79, "en_text": "A team is a group of people working together toward a common goal. Health care teams include professionals with a variety of skills and knowledge who work together to meet the client's needs. Their goal is to provide quality care. Many professionals, including support workers, are involved in the care of one client. Which professionals are involved depends on the needs of the client.", "cn_text": "团队是指一群为了达成共同目标而协同工作的人。医疗卫生照护团队汇聚了具备不同专业技能与知识背景的各类专业人士，他们彼此协作，全力满足服务对象的全面健康需求。他们的核心目标是提供高品质的临床照护（Quality Care）。在任何一位服务对象的照护流程中，往往都会有包括支持工作者在内的多位专业人员共同参与；具体有哪些专业人员介入，完全取决于服务对象的个体健康与照料需求。"}, {"section_idx": 21, "title_en": "Regulated and Unregulated Workers", "title_zh": "受监管专业人员与未受立法监管人员的法定界限 (Regulated and Unregulated Workers)", "start_time": 1745.38, "end_time": 1834.27, "duration": 88.9, "en_text": "Health care professions are either regulated or unregulated. A regulated profession is self-governing. It has a professional organization called a college, which sets education and licence requirements. It also establishes the scope of practice, code of ethics, and standards of conduct for its members. In the case of a complaint about a member's conduct, the college investigates and, if necessary, disciplines members guilty of misconduct. Each regulated health care profession has legislation that details the roles and responsibilities of its members. Nursing is one of many regulated health care professions. Unregulated care providers (UCPs) are health care providers who perform clearly identified services under the direction and supervision of a client, family member, regulated health care provider, or employer. However, UCPs are not regulated through legislation and are not members of an organization or professional college that governs their role. While UCPs do not currently follow any official code of ethics, they must adhere to the codes of behaviour dictated by their employers (see Chapter 4, Box 4.1, for A Sample Code of Ethics for Support Workers, on page 51). At this point, support workers in most provinces and territories are considered to be UCPs. TABLE 1.1 describes the titles and positions of the common health care team members. It also specifies whether they are regulated or unregulated workers.", "cn_text": "医疗卫生保健行业中的工种被清晰划分为两大法定类别：受监管职业（Regulated Professions）与未受监管照护人员（Unregulated Care Providers, UCPs）。 1. 受监管专业医护人员（Regulated Workers）： 受监管职业具备法定“行业自我管理权（Self-governing）”。每个受监管行业都依法设立有省级法定的专业行业公会（称为 College，如安大略省护士公会 CNO、内外科医师公会 CPSO 等），由公会统一步署该工种的教育准入大纲和执业发牌考试要求。行业公会负责制定其会员的法定执业范围（Scope of practice）、职业伦理准则（Code of ethics）以及执业行为规范（Standards of conduct）。一旦社会公众或患者投诉某位执业人员存在医疗过失或失当行为，行业公会有权依法介入调查；若查证属实，公会有权对违纪会员处以停牌、罚款、吊销执照或取消从业资格等纪律惩戒。每个受监管职业均有专门的省级法律法规（如《受监管健康职业法》RHPA）详尽规制其会员的权利与义务。护理专业（涵盖注册护士 RN、注册实用护士 RPN/LPN）便是最具代表性的受监管专业之一。 2. 未受监管照护提供者（Unregulated Care Providers, UCPs）： 未受立法监管照护者是指在服务对象本人、家属、受监管医护人员（如督导护士）或受雇机构的管理与督导下，执行明确生活支持与照料任务的健康照料从业人员。然而，UCPs 并非由省级专门立法直接发牌监管，他们也不隶属于任何管理其从业资质的法定行业公会（College）。虽然目前绝大多数省份尚未为 UCPs 颁布强制性的法定职业伦理准则，但他们必须严格遵守受雇机构所制定的员工执业行为守则（Codes of Behaviour）（参见第 4 章第 51 页 Box 4.1《支持工作者职业伦理守则范本》）。在现阶段，加拿大绝大多数省份和地区的支持工作者（PSW / HCA）均属于未受监管照护人员（UCPs）。 下表 Table 1.1 详尽列出了加拿大跨学科医疗照护团队中常见的 19 类核心成员头衔、工作职责及其监管属性。"}, {"section_idx": 22, "title_en": "Scope of Practice and Limitations", "title_zh": "执业范围与严禁越权 (Scope of Practice and Limitations)", "start_time": 1834.27, "end_time": 1876.49, "duration": 42.22, "en_text": "Support workers must understand what to do, what not to do, and the limit and extent of a health care worker's role as determined by their province's educational standards and employer's policies in order to protect clients from harm. The term scope of practice is not a copyrighted term, and it is not intended only for regulated professionals. Instead, it is used to identify what a support worker may and may not do in relation to client care. Never act beyond the legal limits of your role. Also, never perform a function or task that you have not been trained to do. If you perform a task that is outside these limits, you could harm a client and create serious legal problems for yourself and your employer.", "cn_text": "为了切实保护服务对象免受人身伤害，支持工作者必须深刻理解自己“该做什么”、“绝不该做什么”，以及由其所在省份教育培训大纲和雇主管理规章制度所界定的职责边界与权限范畴。“法定执业范围”（Scope of Practice）并非受版权保护的专属词汇，它绝非仅适用于受监管的注册医护人员；恰恰相反，在全行业中，它被广泛用于精准界定支持工作者在照护案主时“被法律允许执行的操作”与“被法律严格禁止执行的行为”。 绝不可越权执行超出你法定角色界限的任何操作！同时，绝对严禁执行你从未接受过正规院校临床技能培训的任何技术性任务！如果你胆敢越过这一红线擅自操作，你极有可能直接导致案主伤残甚至死亡，并为你自己以及你的受雇机构招致灾难性的重大法律诉讼追责与刑事责任。"}, {"section_idx": 23, "title_en": "Three Sources of Scope of Practice", "title_zh": "执业范围的三大决定性权威来源 (Three Sources of Scope of Practice)", "start_time": 1876.49, "end_time": 1966.15, "duration": 89.66, "en_text": "The support worker's scope of practice in any province, territory, city, or municipality is determined from three important sources. Those sources include the following: 1. Provincial/territorial educational standard of practice: Many provinces now follow either the national or provincial program standards, which dictate what support workers need to be taught in their educational programs. The support worker educational program includes information on the scope of practice for support work in that province or territory. Students will learn about the laws and the support worker's professional responsibilities in their part of the country. Students should ask their instructors if they require any clarification. (Please visit [Nova Scotia CCA Scope of Practice Document](http://www.novascotiacca.ca/DocumentViewer.aspx?elementId=106908&portalName=ha) to view an example of a scope of practice document for the province of Nova Scotia.) 2. Employer's policies: Every employer has written policies that establish what can and cannot be done by support workers. These policies should be read carefully before starting work. 3. Supervisor: On the job, the supervisor is the best source of clarification of the employer's policies. It is far better to ask for direction than risk harming a client, so never hesitate to ask questions or request clarification about any procedure.", "cn_text": "在任何省份、地区、城市或市镇，支持工作者的执业范围均由以下三大核心支柱权威决定： 1. 各省/地区官方教育大纲与执业标准（Educational Standards）：加拿大许多省份目前均严格遵循国家级或省级教学大纲标准，明确规制院校在支持工作者培训项目中必须教授的理论与操作技能。学生将在学习中系统掌握所在地区的法律法规及法定职责界限。若有任何疑问，学生应当主动向教师请教。（读者可参阅加拿大新斯科舍省继续照料助理 CCA 官方执业范围文件范本）。 2. 雇主机构的管理规章制度（Employer's Policies）：每一家正规医疗机构或社区机构都拥有详尽的书面规章制度，黑纸白字地明确界定该机构内支持工作者被允许执行与严禁涉足的任务清单。在正式上岗提供照护前，必须逐条研读这些制度。 3. 临床主管督导（Supervisor）：在临床第一线，督导护士是解答与澄清雇主制度疑难的最权威来源。主动向上级护士请教指导，其安全价值远远高于冒险违规操作而致案主于险境！因此，在对任何临床操作的合规性产生哪怕一丝疑虑时，绝不可盲目臆断，必须毫不犹豫地向上级请示。"}, {"section_idx": 24, "title_en": "Professional Development and Lifelong Learning", "title_zh": "职业素养提升、终身学习与反思性执业回顾 (Professional Development and Lifelong Learning)", "start_time": 1966.15, "end_time": 2027.14, "duration": 60.98, "en_text": "Being a professional requires critical thinking and reflective practice review. Critical thinking is the ability to think clearly and logically, using reflection and reason, based on knowledge obtained from experience, observation, or education. A reflective practice review is a self-evaluation of care provided with the goal of identifying ways to improve clinical performance and caregiving. Health care is an ever-changing field. It is the responsibility of every professional in the field to ensure that all clinical skills and knowledge are up to date, since their own health and safety and the health and safety of co-workers and clients are at stake. Depending on the region, many postgraduate certificate courses and workshops may be available to support workers, such as advanced palliative care, conflict management courses, or medication management. Support workers also need to be aware of the scope of practice in their province or territory, since some, in particular situations, have been asked to perform tasks that are not within the support worker's scope.", "cn_text": "成为一名真正的专业从业者，离不开临床批判性思维与持续的反思性执业回顾。批判性思维（Critical Thinking）是指立足于从实践经验、敏锐观察或正规教育中获取的专业知识，运用反思与理性逻辑进行清晰、严密推理思考的心智能力。反思性执业回顾（Reflective Practice Review）是指从业人员在完成临床照护后对自己所提供的服务进行自我剖析与自省评估，其终极目标在于发现自身不足并找出持续优化临床执业表现与照护技巧的具体途径。 医疗保健是一个日新月异、知识技术快速迭代的领域。确保自身的临床技能与前沿照护知识时刻保持在最新状态，是该领域中每一位从业人员神圣不可推卸的职业责任——因为这不仅直接关乎服务对象的安危，亦直接牵涉到同事及支持工作者自身的健康与人身安全。根据所在地区不同，许多针对支持工作者的毕业后进修认证课程和专题工作坊可供深造选修，例如高级安宁舒缓疗护（Advanced Palliative Care）、职场冲突管理（Conflict Management）或药物协助管理（Medication Management）等。支持工作者还必须时刻保持法律敏锐度，时刻清晰知晓本省执业范围红线，因为在某些临床特殊情境下，个别机构或人员可能会违规要求支持工作者去执行并不在其法定执业范围内的危险技术性操作。"}, {"section_idx": 25, "title_en": "The Supervision of Support Workers", "title_zh": "支持工作者的临床督导机制 (The Supervision of Support Workers)", "start_time": 2027.14, "end_time": 2175.67, "duration": 148.54, "en_text": "In facilities, in the community, or in private homes, support workers may be supervised by a nurse or other health care provider. A registered nurse (RN) is licensed and regulated by the province or territory to maintain overall responsibility for the planning and provision of client care. Some RNs have university degrees and even postgraduate education. Others have community college diplomas. RNs assess clients, make nursing diagnoses, develop care plans, and implement and evaluate nursing care. They also carry out physicians' orders. An RN is usually a team leader of the health care team, which includes RPNs or LPNs (see below), support workers, and other allied health care providers. A licensed practical nurse (LPN), also known as a registered practical nurse (RPN), is licensed and regulated by the province or territory to carry out basic nursing procedures and provide client care. RPNs and LPNs have a community college diploma, although many also have university degrees and even postgraduate education. Like RNs, they must hold a current nursing registration in the province that they practise in. RPNs or LPNs function in a decision-making position when caring for stable clients with uncomplicated health issues, but when providing care to clients with serious and unstable health issues, they assist RNs and help with complex procedures. RPNs and LPNs often supervise support workers. Some clients, particularly in a live-in environment, may be assigned to a primary care nurse, who is responsible for the ongoing management of the health of a client. Duties of this nurse include liaising with other health care team members, the client, and her or his family. In an acute-care environment, the primary care nurse may or may not be directly involved in providing the client care on a daily basis but will oversee the work of those who do, including the support worker. In some situations, a support worker may be supervised by a professional other than an RN, RPN, or LPN. For example, in the recreation department of a long-term care facility, support workers may report to a recreational therapist. In the community, a supervisor may be a social worker, a physiotherapist, or another health care provider. Some support workers are hired and supervised directly by clients. These support workers must be particularly aware of provincial or territorial legislation that limits the tasks and procedures they can perform.", "cn_text": "无论是在院舍机构、社区中心还是私人家庭中，支持工作者通常都在护士或其他专业医护人员的督导下开展工作： 1. 注册护士（RN）督导：注册护士由省或地区法定发牌监管，对服务对象整体照护计划的制定与实施承担全面法律责任。RN 通常拥有四年制护理学士学位甚至研究生学历；他们负责全面评估案主病情、下达护理诊断、制定并动态调整照护计划、组织实施并评价护理成效，并严格执行医师医嘱。RN 通常是跨学科医疗团队的领队，统筹指挥 RPN/LPN、支持工作者及其他相关辅助医护人员。 2. 注册实用护士（RPN / LPN）督导：RPN/LPN 同样由省或地区依法发牌监管，具备公立学院大专文凭。他们与 RN 一样必须持有本省有效的年度注册护士执照。当面对病情稳定、预后明朗的慢性病案主时，RPN/LPN 处于独立的临床决策地位；而在照护病情凶险不稳定的危重患者时，他们协助 RN 并配合完成复杂操作。在长期照护院舍等机构中，RPN/LPN 经常直接担任支持工作者的现场主管护士。 3. 责任制护士（Primary Care Nurse）：在院舍或急重症环境中，案主常被指定由一名责任护士负责其长期的全面健康管理，负责与团队成员及家属保持全方位联络。在急性照护环境中，责任护士虽然不一定事必躬亲地处理每项基础擦洗，但负责全面监督一线护理人员（包括支持工作者）的实际操作质量。 4. 非护士专业人员的跨界督导：在某些特殊岗位上，支持工作者的主管可能并非护士。例如在养老院康乐文娱部，支持工作者可能直接向康乐治疗师（Recreational Therapist）汇报；在社区环境中，督导人员可能是注册社会工作者、物理治疗师或其他专业医护人员。 5. 案主本人直接雇佣与自主督导：一部分支持工作者是由案主本人（如高位截瘫但智力清晰的年轻残疾人）直接出资雇佣并由案主自行管理的私人护理员。在此类情形下，支持工作者更必须保持高度的法律警惕性，清醒界定本省限制未受监管人员执行的技术性医疗禁区，严防盲从案主要求而触犯法律底线。"}, {"section_idx": 26, "title_en": "Being a Professional & Positive Attitude", "title_zh": "什么是真正的专业素养？(Being a Professional & Positive Attitude)", "start_time": 2175.67, "end_time": 2215.2, "duration": 39.53, "en_text": "Professionalism is an approach to work that demonstrates respect for others, commitment, competence, and appropriate behaviour. Being cheerful and friendly, keeping work schedules, performing tasks competently, and being helpful are all part of a professional approach. To be a true professional, you must demonstrate the following: - Positive attitude: You need to show a good attitude about your job. The work you do is very important. People rely on you to give efficient care and support. You need to believe that you and your work are valuable and show that you enjoy your work. Be enthusiastic, considerate, and courteous.", "cn_text": "专业素养（Professionalism）是一种在职业活动中充分展现对他人尊重、高度敬业承诺、精湛操作胜任力以及端庄合宜言行举止的工作方式与精神境界。保持乐观开朗与亲切友善、严格守时遵守排班、精益求精胜任操作任务、乐于助人并展现团队协作，皆是专业职业素养的具体体现。要成为一名名副其实的专业人士，你必须在工作中践行以下准则： - 积极阳光的职业态度（Positive attitude）：你必须对自己的本职工作展现出发自内心的积极态度。你所从事的支持工作对他人生命意义非凡，长者与病患完全依赖你所提供的高效照护与心理支撑。你必须坚信自己与自己的工作具有崇高的社会价值，并由衷热爱这份事业。始终保持热情、体贴与温良有礼。"}, {"section_idx": 27, "title_en": "Practices for a Professional Appearance", "title_zh": "BOX 1.2 专业仪表规范 13 条黄金法则 (Practices for a Professional Appearance)", "start_time": 2215.2, "end_time": 2312.14, "duration": 96.94, "en_text": "A professional, appropriate appearance shows respect for the people in your care, your co-workers, and yourself. It indicates that you take your job seriously. BOX 1.2: Practices for a Professional Appearance - Follow your employer's dress code policies. - Wear a clean, well-fitting, modest, and wrinkle-free uniform. - Wear a name badge or photo ID, per your employer's policy. - Wear clean stockings or socks that are in good repair. - Wear comfortable and clean shoes that give you good support. Shoes should provide a safe barrier for your feet from spills and
