门诺会中央委员会（MCC）步入百年华诞；门诺灾难服侍处（MDS）：北美救灾急先锋。", "blocks": [{"sub_zh": "第十一章", "sub_en": "CHAPTER 11", "zh_paras": ["身处门诺弟兄会大家庭，意味着我们本身就是更为宏大的重洗派属灵家谱上的一根繁茂枝条。“我们的属灵大家庭，是上帝用来深切呵护我们的一种方式”——这句在信徒间耳熟能详的温情喟叹，用以形容整个广义门诺会大家庭再恰当不过。", "作为门诺弟兄会的一员，我们深知：当这个庞大宗族中的任何一位成员遭遇患难灾祸时，重洗派家族的其他肢体必会倾囊相助、施以援手。我们更深知：这份源源不断的爱心与援助，绝不仅局限于宗派内部的家人，更是“奉基督的名”（In the Name of Christ），毫无保留地白白倾倒给那些素昧平生、身处绝境的贫寒之人。", "自1941年起，“奉基督的名”这行庄严的字样，便被清晰地印制或缝缀在门诺会中央委员会（Mennonite Central Committee，简称 MCC）所分发的每一批救济物资之上。作为历史最为悠久的跨门诺派联合救济机构，在第二次世界大战期间及战后废墟中，MCC 的博爱圣工跨越了整个欧洲大陆，救助了成千上万在战火中家破人亡的贫苦家庭。", "在英国伦敦，MCC 同工艾琳与约翰·考夫曼夫妇（Eileen and John Coffman）正在将 MCC 运来的衣物分发给那些房屋被炸毁、蜷缩在地下防空洞中的难民家庭。1941年4月，夫妇俩致信 MCC 总会领袖，提议在每一件捐赠衣物上都附上一枚特制标签，印上一句“简短却有力的口号，诸如‘奉基督的名’——这将极大拓展基督的圣工，因为我们分发的是由我们信徒亲手缝制并甘心奉献的衣物。”", "很快，“奉基督的名”不仅出现在每一件御寒衣物上，更广泛印制在温暖的百家被（comforters）、圣诞礼物包以及各类高营养肉类罐头上。通过这句纯朴而深沉的宣告，MCC 的核心身份与存在基石触及了全球数以百万计的生灵——不仅在欧洲，更深入非洲、亚洲、拉丁美洲以及中东大地的每一个苦难角落。"], "en_paras": ["Connections To be part of the Mennonite Brethren family is to be part of the larger Anabaptist family tree. “Our family is God’s way of taking really good care of us,” is a familiar sentiment and one that fits the larger Mennonite family. To be Mennonite Brethren is to know that when calamity strikes a member of this extended family, the rest of the Anabaptist family will come to your aid. It is to know, further, that assistance is extended not only to other family members but also to needy strangers “in the name of Christ.” Since 1941, this phrase, “In the name of Christ,” has been stamped or affixed to relief supplies distributed by Mennonite Central Committee, the oldest inter- Mennonite agency. During and after World War 2, MCC’s work stretched across Europe and aided thousands of families devastated by war. In London, England, MCC workers Eileen and John Coffman were sharing clothing from MCC with families who had lost their homes and were living in underground shelters. In April 1941, the couple wrote to MCC leaders suggesting that a label be included on donated clothing with a “little slogan such as, ‘In the Name of Christ’ (that would) be useful in promoting the cause of Christ, as we administer the clothing which is made and donated by our people.” Soon, “in the name of Christ” began to appear not only on clothing but also on relief supplies such as comforters, Christmas bundles and cans of meat. Through this simple phrase, MCC’s identity and reason for being has reached millions of people—not only in Europe, but in countries throughout Africa, Asia, Latin America and the Middle East."]}, {"sub_zh": "携手服事众人", "sub_en": "Working Together to Serve Others", "zh_paras": ["北美各派门诺人的首次跨宗派空前大联合，发生在整整一个世纪前的1920年。当时，一个来自苏俄的门诺会特别代表团远渡重洋抵达北美。由于俄国国内剧烈的政治动荡、内战浩劫与毁灭性的大饥荒，那里的门诺弟兄姊妹正面临着濒临绝境的极端苦难。他们向北美大陆的同宗骨肉发出了撕心裂肺的求救呼吁。", "北美各派门诺人以两种切实行动迅速作出了历史性回应：筹集紧急人道主义救济，以及全力协助难民海外移民。", "全美重洗派各教会迅速合力创建了一家联合救济机构——门诺会中央委员会（MCC）。来自堪萨斯州希尔斯伯勒的门诺弟兄会牧长 P.C. 海因伯特（P.C. Hiebert）众望所归，被推选为这家初创救济机构的首任主席。在 MCC 的统筹协调下，美加两国的重洗派信徒迅速筹集了100万美元巨款，并紧急派出三位美国同工，冒着枪林弹雨将救命的救援物资运送至俄国与乌克兰的门诺村落。他们就地开设了免费施粥厨房，并运去大量粮食良种与现代拖拉机，协助乡亲们在焦土上重耕家园。", "二战爆发期间，美加两国的跨门诺派协同合作拓展到了一个全新的历史舞台。两国青年信徒普遍面临国家的战时兵役征召。得益于历史和平教会（门诺会、贵格会、弟兄会）领袖们不懈的奔走与法理陈情，良心拒服兵役者（Conscientious Objectors，简称 COs）获得了从事“具有国家重要性”的非军事实体替代役（Civilian Alternative Service）的法定选择权。", "在加拿大，全国10,851名良心拒服兵役者中，约有7,500人是门诺会信徒；在美国，申请良心拒服兵役身份的12,000名青年中，门诺人占据了38%（共4,665人）。虽然绝大多数门诺良心拒服兵役青年更渴望作为非武装战地医护兵奔赴前线，或深入战乱国家从事纯粹的人道救援，但当时的国家政策直至战后很久才允许此类选择。", "“平民公共服务营”（Civilian Public Service，简称 CPS）的运转采纳了一种政企协约机制：美国联邦政府负责指派具体劳动工程项目，而教会机构则全权承担营地日常食宿运转及青年在工余时间的精神与灵性牧养。负责门诺派 CPS 营地的教会机构正是 MCC，它总共统筹管理了23处大型基地营地。", "首批替代役营地于1941年正式启动。这批坚守和平信念的 CPS 青年投身于惊心动魄的森林灭火第一线，开山辟路，筑坝截流，植树造林，在广袤农田中构筑等高梯田保护水土；他们甘愿在医学与科学前沿人体实验中充当“小白鼠”测试新疗法；深入饱受钩虫病肆虐的贫民窟建造公共卫生设施；并在恶劣的收容所中悉心护理精神病患者与边缘失足少年。", "这种让来自不同背景的青年同吃同住、并肩苦干的深刻经历，对整整一代年轻人的生命轨迹产生了难以估量的深远塑造。“这批来自门诺派各个细分宗派的年轻男子（以及志愿奉献的年轻姊妹）投身服务营地的宏大运动，对北美门诺人产生的深远塑造，或许超过了历史上任何单一的经历，”自1986年至1998年担任门诺灾难服侍处主任的罗威尔·德特威勒（Lowell Detweiler）动情地总结道，“以往被称为‘地上安静之民’的门诺人，自此开始昂首走出狭隘的族群藩篱，放眼向外开展全方位的服事事工。”", "这些青年重返家园时，带回了扎实的劳动技能、跨宗派的深厚友谊，以及对基督徒舍己服侍价值的坚定信念。他们激励自己的母会社区积极支持开创全新的服事实践，深信基督徒不仅应当在战时见证和平，在和平年代同样应当全心服事；向更广袤的世界舍己服事，正是活出基督徒生命样式的题中之义。", "这一良心拒服兵役的苦难历程，直接催生了日后名垂教会史册的“门诺灾难服侍处”（MDS）、“门诺志愿服侍团”（MVS）以及“门诺和平志愿队”（PAX）。许多参与过 CPS 的门诺弟兄会青年退役后考入圣经神学院深造，日后成为了门诺弟兄会宗派的中流砥柱与资深牧长。", "更为震撼的是，由于 CPS 营员的亲身体验，精神心理健康在二战后成为了北美门诺人合力攻坚的核心社会议题。在战争期间，被指派到州立公立精神病院从事繁重看护工作的 CPS 营员们，震惊地目睹了病房内非人道、甚至绝望残酷的生存惨状。最终，在全美22个州的公立精神病院中服役的门诺良心拒服兵役者，联合将他们的实地见闻公之于众，以期推动彻底的社会人道体制改革。", "基于这批 CPS 青年历时四年默默收集的大量第一手确凿文献记录，1946年5月6日出版的美国《生活》（Life）杂志刊登了一篇轰动全美的长篇调查报道，彻底揭露了精神病院触目惊心的悲惨现实。报道直言不讳地指出：“由于公共舆论的漠视与立法机构在预算拨款上的极度吝啬，一个又一个州任由其看护和治疗精神疾病患者的公共医疗机构，堕落演变为近乎贝尔森（Belsen）纳粹集中营样式的非人炼狱！”", "在许多机构中，CPS 青年通过实际行动推动并改革了州立医院的护理规范。但在更多情况下，州立医院的人们长久铭记门诺 CPS 护理队员的原因，不是因为他们刻意宣讲改革，而是因为这群年轻人每天勤勤恳恳、任劳任怨地干着最脏最苦的重活，且对每一位身心备受摧残的病患倾注了发自肺腑的真诚关怀与尊严尊重。", "“在第二次世界大战期间，没有任何一个基督教教会群体像美国门诺人那样，对精神疾病领域有过如此密集而深度的切身体验，”曾担任 CPS 志愿者、后来直至去世一直担任一所门诺精神康复医院首席执行官的埃尔默·M·埃迪格（Elmer M. Ediger）深刻指出，“在整整四年时间里，1,500名门诺青年‘零距离、亲力亲为’地投身于精神疾病看护第一线，并将这些震撼经历毫无保留地带回母会分享。他们形成了一套前瞻性的崇高异象：如果能将纯正出于基督之爱的动机与专业的精神病学护理结合起来，必将在苦难人群中成就何等宏大的善工！”", "1947年，MCC 正式启动了自己的精神健康事工计划。至1967年，MCC 已在美国兴建了7所高水准精神专科医院，并在加拿大兴建了1所；随后成立了专门的附属机构“门诺心理健康服务中心”进行统一统筹。如今，这些医疗中心已发展为独立的社区公共服务实体，而“门诺健康服务处”（MHS）更将其专业网络拓宽至北美各类精神卫生中心、养老退休社区以及智力与发育障碍康复项目，并在这些专业机构与门诺会、门诺弟兄会及基督弟兄会等教会之间搭建起紧密合作的桥梁。"], "en_paras": ["North American Mennonites first rallied together 100 years ago in 1920 when a delegation of Mennonites from Russia visited North America. Mennonites in Russia were facing extreme hardships from the political upheaval and extreme famine in their country, and they appealed to their brothers and sisters on this continent for assistance. North American Mennonites responded in two ways: providing relief and assisting with immigration. Anabaptists in the U.S. formed a united relief agency, Mennonite Central Committee. A Mennonite Brethren from Hillsboro, Kansas, P.C. Hiebert, was chosen to lead the fledgling agency. Under MCC, Anabaptists in Canada and the U.S. raised $1 million and sent three American workers to deliver aid to Russian and Ukrainian villages. Food kitchens were established, and seeds and tractors were sent to help with land cultivation. Inter-Mennonite cooperation embraced a new cause in Canada and the U.S. during World War 2. Mennonites in both countries had to face conscription. Thanks to the efforts of leaders from the historic peace churches, conscientious objectors (COs) were given the option to perform civilian alternative service work of “national importance.” In Canada, about 7,500 of the 10,851 conscientious objectors were Mennonites. In the U.S., 38 percent (4,665) of the 12,000 men who requested CO status were Mennonites. Many Mennonite COs would have preferred to do relief work in war-torn countries or on the battleground as medics, but national policy did not allow for these options until much later. The administration of Civilian Public Service was a cooperative arrangement in which the U.S. government assumed responsibility for the work projects, while church agencies assumed responsibility for camp life and the nonworking time of the men. The church agency responsible for Mennonite CPS camps was MCC, which operated a total of 23 base camps. The first alternative service camps were opened in 1941. CPS workers fought forest fires, built roads, constructed dams, planted trees, built contour strips on farms, served as “guinea pigs” for medical and scientific research, built sanitary facilities for hookworm-ridden communities and cared for people with mental illnesses and juvenile delinquents. The experience of strangers forced to live and work together had a profound impact on the young men. “This movement of young men (and volunteer women) from a wide variety of Mennonite groups into service camps has probably had a more profound effect on North American Mennonites than any other single experience,” says Lowell Detweiler, Mennonite Disaster Service director from 1986 until 1998. “Once the ‘quiet in the land,’ Mennonites began to look outward for service ministries (Detweiler, 32). The men came home with new skills, new friendships and a belief in the value of service. They rallied their home communities to support new forms of service, believing they needed to serve not only in wartime but in peacetime too. Service to the wider world was part of what it meant to be Christian. The CO experience spawned Mennonite Disaster Service, Mennonite Voluntary Service and Mennonite PAX service. Many Mennonite Brethren participants found their way to Bible school or Bible college and became leaders in the MB church. Because of their CPS experience, mental health became a rallying cause among Mennonites after World War 2. During the war, CPS workers assigned to mental health institutions found the hospital situations desperate. Eventually, American conscientious objectors who had worked in the hospitals of 22 states shared their observations with the public to help effect reform. Based on the documentary evidence gathered over four years by CPS men, the May 6, 1946, issue of Life magazine exposed the deplorable state of affairs. The article said: “Through public neglect and legislative penny-pinching, state after state has allowed its institutions for the care and cure of the mentally sick to degenerate into little more than concentration camps on the Belsen pattern.” In some situations, CPS men influenced practices at state hospitals by reforming them. In most cases, the Mennonite CPS units in a state hospital are not remembered for their focus on reforms, but as people who did an honest day’s work and had a genuine interest in the patient. “No other church group had ever had such a concentrated experience with mental illness as the American Mennonites during World War 2,” says Elmer M. Ediger, a former CPS volunteer who went on to serve as CEO of a Mennonite mental health hospital before his death. “During a four-year period, 1,500 Mennonites had a ‘hands on’ involvement with mental illness, which they shared freely with their home congregations. They developed a vision of what might be done with rightly motivated psychiatric aids and mental health professionals.” In 1947, MCC began its own mental health program. By 1967, MCC had established seven mental hospitals in the U.S. and one in Canada, and Mennonite Mental Health Services was formed as a subsidiary of MCC to oversee these institutions. Today these hospitals are independent community services, and Mennonite Health Services supports not only mental health centers but also retirement communities and developmental disabilities programs in North America and helps to link these agencies to Mennonite, Mennonite Brethren and Brethren in Christ churches."]}, {"sub_zh": "门诺会中央委员会（MCC）步入百年华诞", "sub_en": "MCC Turns 100", "zh_paras": ["MCC 是一家全球性的非营利基督教组织，致力于通过紧急救济、社会发展与缔造和平（Relief, Development, Peacebuilding），彰显并传递上帝的救赎大爱与怜悯心肠。在所开展的一切项目中，MCC 始终坚持与本土合作伙伴和当地教会建立深厚伙伴关系——当地最真实的需要，永远是确立 MCC 事工优先次序的唯一准绳。", "作为一个深植于重洗派信仰土壤的机构，MCC 竭力将“缔造和平”融入其所做的一切事工细胞之中：在应对突发天灾人祸时，它协同本土组织公平公正地分发救援物资，最大限度遏制因争抢资源可能引发的族群冲突；在长期社区发展项目中，MCC 深入听取社区民众的心声，确保援助举措真正解决民众的切身生计痛点；MCC 亦在国际公共领域大声疾呼，倡导并推动有助于促成全球持久和平的公义政策。", "若要定义今日 MCC 的博大事工版图，恰如“盲人摸象”寓言中的七位盲人——身体的每一个部位都独具特色且不可或缺，而整体的力量则远远超越了个体器官的总和：MCC 既是印度烈日下指导农耕技术的水稻农艺师，也是美国法庭与社区中践行修复性司法的和解同工；既是在尼泊尔高山村落传授妇女调配高营养“超级营养面粉”以确保幼儿健全成长的培训导师，也是在刚果民主共和国丛林诊所中协助抗击 COVID-19 致命疫情的白衣使者。", "MCC 创立于1920年，这意味着2020年是该机构的百岁诞辰。MCC 原本筹备在2020年举行盛大的百年庆典，但受全球新冠疫情阻隔，线下实体盛会大多被迫取消或转至云端举行。", "回溯该救济机构走过的整整一个世纪的风雨历程，自2010年至2020年执掌 MCC 的执行总干事 J·罗恩·拜勒（J Ron Byler）感慨万千：“在 MCC 跨越百年的光辉历程中，面对接踵而至的艰难险阻，MCC 的全体同工与全球合作伙伴始终展现出非凡的开拓韧性与智慧才干。2020年亦是如此，我们与合作伙伴在全球疫情大流行的肆虐之下，全力奔赴各地去满足最苦难人群的燃眉之急。然而上帝始终以无比的信实恩待我们，在过去的岁月里步步引领看顾，使我们能在重重危机之中‘奉基督的名’广施上帝的慈爱与恩典。为此，我们唯有向神献上满腔的感恩！”", "MCC 在黎巴嫩紧急危机中的果断作为，生动展现了该机构在疫情围困中开展服事所面临的严峻考验。2020年1月，黎巴嫩首都贝鲁特的人民生活在水深火热之中：2019年爆发的全国性大规模民众抗议，暴露了社会对政府治理的极度不满；学校大面积停课，货币断崖式贬值，恶性通货膨胀吞噬着民生。随后而至的新冠疫情更是雪上加霜，店铺关门歇业，就业岗位荡然无存，医疗系统几近瘫痪。寄居当地的叙利亚与巴勒斯坦难民，以及陷入赤贫的黎巴嫩底层民众，所能获取的生活物资比以往任何时候都更加匮乏。", "然而灾难并未止步。2020年8月4日，贝鲁特港口因违规存放的2,750吨硝酸铵发生惊天特大爆炸，瞬间造成数百人罹难、数千人伤残，大半个城市的建筑物沦为瓦砾废墟。其中包括紧邻港口的卡兰蒂娜（Karantina）贫民区——那里聚居着大量难民、外来劳工与赤贫的黎巴嫩家庭。", "与妻子一同担任 MCC 黎巴嫩、叙利亚与伊拉克事务代表的加里·梅休（Garry Mayhew）在爆炸次日深入灾区勘验废墟时痛心地说：“这里看起来宛如被重型火炮反复犁过的战火焦土！”在这场前所未有的复合型危机中，前行的道路充满了未知与迷雾。", "黎巴嫩绝非孤例。在 MCC 开展圣工的全球数十个国家，新冠疫情使得医疗健康与粮食救济的需求呈现爆发式剧增；而与此同时，MCC 同工及其合作伙伴团队自身的人身安全与健康亦面临着致命威胁。更为严峻的是，疫情初期对 MCC 的资金链造成了重创——捐赠者的经济状况普遍受损，一年一度的线下救济义卖会全部取消，全美各地的二手慈善义卖店（Thrift shops）亦被迫阶段性停业关门。", "即便如此，MCC 展现出惊人的应变力，迅速调整工作部署，继续“奉基督的名”服事实体人群：", "在贝鲁特，MCC 与当地伙伴重新设计了粮食救济分发流程——推行精准预约制、强制佩戴防护口罩、严格保持社交距离以守护受助者的生命健康；紧接着迅速启动受损民居与小微商铺的修缮重建工程，并为心灵遭受重创的儿童提供长效心理与情感抚慰支持；", "在全球各地，MCC 全面强化公共卫生防疫工程，普及防疫抗疫科学常识，搭建移动卫生洗手消毒站，开凿并提供清洁安全的饮用水源；和平倡导、医护健康以及农业科技培训全面转战线上虚拟课堂，或在开阔的户外场所有序分散进行；", "2020年在美国本土分发的优质肉类罐头数量创下历史新高，以救助那些深陷经济泥潭的赤贫家庭；", "MCC 联合门诺灾难服侍处（MDS）与 Everence 金融管家机构，设立专项扶持救助金，重点向因疫情陷入困境的有色人种重洗派教会倾斜，协助他们按时发放教牧工资并救助贫困会友。", "MCC 的圣工之所以能在狂风骤雨中稳健挺立，离不开其忠心支持群体的大力托举——信徒们同样展现出极强的适应力，将一年一度的传统实物救济义卖会搬上网络进行线上慈善拍卖，为家庭设立全新的筹款倡议，个人捐款额更是不降反升。不可否认，如同许多全球慈善组织一样，疫情使 MCC 的运转遭遇了沉重挑战，被迫精简预算开支、冻结部分岗位并暂缓启动新项目，但其服事的脚步却从未停歇。", "门诺弟兄会信徒以丰富多样的方式全力支持 MCC 的圣工：", "广大信徒志愿申请成为 MCC 短期或长期海外服事同工；", "积极参与发起、创办并志愿运营MCC 二手慈善义卖店（MCC Thrift Shops）——通过义卖二手捐赠物资为 MCC 全球救济筹集善款。自1972年首店创立以来，MCC Thrift 已成长为一个横跨北美大陆、拥有近100家连锁门店的庞大网络，在深度赋能本土社区的同时全力托举国际差传。在疫情前的2019年，美加两国的 MCC Thrift 义卖店每月创收平均突破120万美元！", "投身于 MCC 旗下的公平贸易社会企业——“一万个村庄”（Ten Thousand Villages）。该机构通过在北美展卖全球弱势手工艺人的精美手工作品，讲述作品背后的生命故事，为这些身处贫困、若非此便无工可做的手工艺人提供体面而长效的稳定收入，帮助千家万户摆脱贫困、负担子女教育、医疗与住房；", "各堂会定期为全球难民与贫寒学童收集组装学校学习包、婴儿护理包、卫生清洁包以及家庭救济应急包；", "各堂会信徒与各地物资资源中心的志愿者聚在一起，一针一线地缝制精美的百家被与保暖毛毯，为深陷战争与天灾绝境的人们送去基督的温暖；", "每年在美加两国举办的40场大型 MCC 救济拍卖会（Relief Sales），筹集善款常年稳定突破600万美元！", "门诺弟兄会各社区还别出心裁地开辟了独特的支持模式。在部分地区，门诺男高音与男低音们联合组建了声乐诗班，借高水准的巡回音乐会提升公众知晓度并募集救济善款。例如，位于加州的“西海岸门诺男声合唱团”（West Coast Mennonite Men’s Chorus）已连续倾情献唱超过40年，累计为 MCC 筹集了逾50万美元的宝贵善款。"], "en_paras": ["MCC is a global, non-profit organization that strives to share God’s love and compassion through relief, development and peacebuilding. In all its programs, MCC is committed to relationships with local partners and churches—their needs guide MCC’s priorities. As an Anabaptist organization, MCC strives to make peace a part of everything it does. When responding to disasters, it works with local groups to distribute resources to minimize conflict. In its development work, MCC consults with communities to make sure projects meet their needs. MCC also advocates for policies that will lead to a more peaceful world.", "Defining the ministry of MCC today is like the seven blind men who tried to describe an elephant by feeling a different part of its body—every part is unique and important, but the sum of the animal is greater than the individual parts. MCC is an agricultural worker in India and a restorative justice worker in the U.S. It is teaching women in Nepal to make super flour so that their families will get the nutrients they need and supporting health clinics in DR Congo in their response to the COVID-19 pandemic. MCC was organized in 1920, making 2020 the agency’s 100th birthday. MCC intended to celebrate its centennial in 2020, but in-person centennial celebrations were canceled or became virtual due to the coronavirus pandemic. Reflecting on the relief agency’s anniversary, J Ron Byler, MCC executive director from 2010 to 2020, says: “Throughout MCC’s 100 years, MCC’s staff and partners have had to be creative and resourceful in spite of challenges they encountered. This year (2020) has been no different, as we and our partners meet people’s needs in the midst of the coronavirus pandemic. But God has been faithful over all these years, helping us and guiding us as we share God’s love and compassion in the name of Christ in the midst of crisis. For this we are thankful.” MCC’s response to a crisis in Lebanon is one example of the challenges MCC faced in its ministry during the pandemic. In January 2020, people in Beirut, Lebanon, were struggling. Massive political demonstrations in 2019 revealed the Lebanese people’s dissatisfaction with their government. Schools closed, and the value of Lebanese currency dropped as inflation rose. The COVID-19 pandemic made matters worse, causing shops to close, employment opportunities to dry up and health needs to increase. Syrian and Palestinian refugees and Lebanese people who were living in poverty had even fewer resources than before. And then, on Aug. 4, 2020, an improperly stored supply of ammonium nitrate exploded in the city’s port, causing death, injuries and devastation of property throughout the city. This included the Karantina neighborhood, where many refugees, migrant workers and impoverished Lebanese people live. Garry Mayhew, who serves with his wife as an MCC representative for Lebanon, Syria and Iraq, surveyed the damage the next day. “It looks like a war zone,” he said. The way forward in responding to the needs of the Lebanese people in this new crisis wasn’t clear. And Lebanon wasn’t the only place where MCC needed to determine and adapt its response. In countries around the world where MCC works, COVID-19 increased the need for health care and food while MCC and partner organization staff needed to protect their own health. At the same time, the pandemic initially affected MCC’s funding sources as donors’ finances were impacted, relief sales were canceled and thrift shops were temporarily closed. Nevertheless, MCC adjusted and continued to meet needs in the name of Christ. In Beirut, MCC and its partners adapted their food distribution system by setting up appointments, using masks and physically distancing to protect the health of the recipients. Plans to rebuild homes and small businesses were made and children received support for their emotional and social health. Around the world, MCC’s health programs were strengthened through teaching COVID-19 prevention techniques, distributing hygiene and sanitation stations and making clean water available. Trainings for peacebuilding, healthcare and farming techniques went virtual where possible or took place individually or in outdoor group settings where people could spread apart. More canned meat was distributed in 2020 than usual in the U.S. to help people who were struggling financially. MCC, along with Mennonite Disaster Service and Everence Financial, funded grants to Anabaptist churches, often churches of color, that needed help to pay their staff or assist their members. MCC’s work continued with the support of its constituents who also adapted to COVID-19 by turning relief sales into virtual auctions, creating new fundraisers for families and increasing individual donations. COVID-19 made MCC’s work more challenging, as was true for many organizations, with budget and staff positions cuts and suspension of new projects.", "Mennonite Brethren support MCC in a variety of ways. Mennonite Brethren volunteer as MCC workers for both short- and long-term assignments. We have been involved in initiating and staffing thrift shops that sell recycled goods to raise funds for MCC. Since its inception in 1972, MCC Thrift has grown into a network of nearly 100 shops across North America, supporting local communities and international ministry. In 2019, prior to COVID-19, MCC Thrift shops in Canada and the U.S. averaged more than $1.2 million a month in revenue. Mennonite Brethren also use their gifts to serve at Ten Thousand Villages, MCC U.S.’s Fair Trade social enterprise. Ten Thousand Villages provides vital, fair income by selling handicrafts and telling the stories of the people who made them. Ten Thousand Villages works with artisans who would otherwise be unemployed or underemployed. This income helps pay for food, education, health care and housing. Mennonite Brethren also collect items for school, infant care, hygiene and relief kits that are distributed to vulnerable individuals around the world. And we come together with other volunteers at Material Resource Centers to stitch quilts and sew blankets to provide comfort to people who are facing crises. More than $6 million is raised annually through 40 MCC relief sales across Canada and the U.S.", "Mennonite Brethren have devised unique ways to support MCC. In some communities, Mennonite men have banded together to sing and use their concerts to raise awareness and funds for the cause. For example, the West Coast Mennonite Men’s Chorus in California has been performing for more than 40 years and has raised more than half a million dollars for MCC."]}, {"sub_zh": "门诺灾难服侍处（MDS）：北美救灾急先锋", "sub_en": "MDS: North American Disaster Response", "zh_paras": ["创立于1950年的门诺灾难服侍处（Mennonite Disaster Service，简称 MDS），或许是所有跨门诺派联合机构中最接地气、最富草根生机的实干组织。作为一个跨越美加两国的双国籍实体，MDS 代表广泛的门诺派及相关重洗派教会，直接奔赴美加本土遭受飓风、洪水、龙卷风、野火等重大自然灾害的第一线开展灾后重建与人道救援。", "除了位于宾夕法尼亚州阿克隆（Akron）的精干总部以及位于曼尼托巴省温尼伯的区域办事处的少数专职行政人员外，这支庞大救援网络的骨干与血肉完全是由成千上万名无私奉献的志愿义工铸就而成。地方基层分队按区域统筹编组，每个大区均由经验丰富的志愿者领袖挂帅执掌。MDS 与美国红十字会、救世军（The Salvation Army）等主流教会与专业灾难救援组织保持着深度的战略合作，更与美国联邦应急管理署（FEMA）及其各州应急机构、加拿大应急响应组织保持着制度化协同。", "在所有跨门诺派联合实体中，MDS 被公认为拥有最为宽广的宗派代表性与支持面：从恪守传统马车出行的“旧秩序门诺派”（Old Order Mennonites）、比奇阿米什人（Beachy Amish），到门诺教会（Mennonite Church）、门诺弟兄会（MB）、基督弟兄会（Brethren in Christ）以及保守门诺派（Conservative Mennonites）……当灾难来临之时，他们纷纷穿上印有 MDS 鲜明标识的工作服，并肩挥汗如雨。", "担任 MDS 西海岸行动协调员的史蒂夫·维斯特（Steve Wiest）是加州金斯堡一间美国门诺弟兄会堂会（Hope Kingsburg）的资深会友，在 MDS 和 MCC 拥有长达数十载的服事阅历。2021年，维斯特全身心投入到了加州天堂镇（Paradise）的灾后重建前线——那里在2018年爆发的“坎普特大野火”（Camp Fire）中化为焦土，超过13,000栋民宅在一夜之间被火海吞噬。这是加利福尼亚州历史上最具破坏力、亦是整个美国一个世纪以来伤亡损失最惨重的特大山火。", "历经近三年时光，天堂镇居民心头的心理创伤依然血肉模糊。“凡是亲身经历过那场炼狱大火、不得不从滔天火舌中仓皇逃命、甚至冒死穿透火海逃生的人，这一辈子都将背负难以抹去的心理创伤，”维斯特深有感触地说道。", "正是由于洞悉这一灵魂深处的苦痛，MDS 的义工们在挥锤建房的同时，始终愿意停下手中的活计，耐心倾听每一位灾后业主的倾诉。维斯特指出，MDS 所做的事工中，有极大一部分是重燃人们心头的盼望，陪伴他们走过心灵医治的死荫幽谷。“我们花大量的时间安静坐下来，听他们倾诉那场浩劫中的生死故事，”维斯特说，“在天堂镇，你根本不需要刻意去寻找悲剧——在杂货店收银台前，或者在路边的卷饼餐车旁随便跟人寒暄几句，扑面而来的全都是字字泣血的浩劫创伤。”", "当 MDS 义工们在天堂镇挥汗如雨修缮三年前被毁的家园时，2021年加州爆发的新一轮野火再度肆虐。截至2021年9月1日，全州已有超过3,600栋建筑被烈焰焚毁。其中2021年最大的一场山火——“迪克西山火”（Dixie Fire），其起火点与2018年坎普山火几乎重合，只是蔓延方向相反。在短短一天之内，迪克西山火几乎将具有悠久淘金热历史的格林维尔历史古镇（Greenville）夷为平地。", "2021年8月，正当 MDS 施工队奋力施工时，坎普火场周边的火势仍在失控蔓延，5,000多名专业消防员鏖战火海。MDS 义工有时能直接望见50英里外冲天而起的巨大烟柱。“你能清晰闻到空气中浓烈的刺鼻烟味，常常清晨起来看见车身覆盖着一层厚厚的火山灰，”维斯特回忆道。", "天堂镇的重建工作还因疫情肆虐而愈加错综复杂。随着当地新冠确诊病例的激增，MDS 不得不在2021年9月按防疫要求阶段性暂停了现场施工，并在6栋已经破土动工的房屋完工前将外地义工疏散返乡。但所有人坚定承诺：风暴过后，他们必将重返前线，善始善终完成未竟的家园重建！", "在经历灾难打击的社区中，MDS 的身影往往是“最先到达、最后撤离”的存在；义工们全力以赴攻坚社会中最贫弱孤寡家庭悬而未决的住房刚需。在施工建造中，凡是条件允许，MDS 义工修建和加固的房屋在抗震、抗风、防火标准上均达到高规格，足以抵御未来的风暴洗礼。在此过程中，业主们往往与这群帮助他们重返家园的素衣义工结下了跨越一生的生死情谊。", "2020年，超级飓风“劳拉”（Hurricane Laura）横扫墨西哥湾沿岸，正面袭击了 MDS 在2005年“丽塔飓风”（Hurricane Rita）过后为灾民修造的一批坚固民宅。长期担任 MDS 志愿项目主管的卡尔·杜贝（Carl Dube）与同工专程赶往现场回访，探查房屋是否经受住了风暴考验。“灾民的保险理赔勘察员目瞪口呆地直言，按照常理，在如此狂暴的飓风正面直击下，这栋房子根本没有任何理由还能完好无损地矗立在那里，”杜贝动情地说，“当业主们紧紧拥抱当年亲手修建这栋房屋的施工者时，激动得热泪盈眶——正是这群工匠的手艺，让这栋房子傲然顶住了时速高达150英里的毁灭性狂风，以及高出室内地板整整两英尺的汹涌风暴潮！”", "门诺人、阿米什人以及一切志同道合的重洗派基督徒，拥有一种深刻扎根于圣经的真道洞见——坚信真正的信仰必然体现为一个彼此深切相爱、全心呵护邻舍的活泼共同体。16世纪的重洗派先驱用生命去爱护身边的苦难之人；而作为其血脉后裔的门诺人，百年来从未背离这一神圣的属灵产业。在欧洲、在北美、在世界每一个角落，门诺人一次又一次庄严立约，誓要“奉耶稣的名”舍己服事众人。", "这究竟是为什么？因为我们门诺人坚信：真实的基督信仰，必须在生命每一个现实维度中活出馨香的见证！", "重洗派教父门诺·西蒙斯（Menno Simons）生前反复宣讲的一大核心主题，正是真信仰必结出仁义的善果。在他那篇名垂青史的经典论述中，西蒙斯写道：", "“真正属福音的信仰……绝不可能沉睡不醒，而是必然在一切公义的行为与仁爱的话语中全然彰显出来：……它给赤身者穿上衣裳；给饥饿者吃饱饭食；安慰心中忧伤哀恸之人；给颠沛流离、无家可归者提供温暖的遮蔽之所；它扶助并宽慰每一个悲戚绝望的生灵！”"], "en_paras": ["Established in 1950, Mennonite Disaster Service (MDS) is probably the most grassroots of all inter-Mennonite agencies. MDS is a bi-national (Canada and the U.S.) agency that responds to disasters in these two countries on behalf of many Mennonite and related groups. Except for a small staff at headquarters in Akron, Pennsylvania, and a regional office in Winnipeg, Manitoba, volunteers make up the entire network. Local units are grouped into regions and each region has its volunteer leadership. MDS cooperates with other church and disaster response groups including the American Red Cross and The Salvation Army. MDS works in close cooperation with the Federal Emergency Management Agency and its state counterparts in the U.S. and the Emergency Measures Organization in Canada. MDS is recognized among inter-Mennonite agencies as having the widest diversity of constituent support. Old Order Mennonites, Beachy Amish, Mennonite Church, Mennonite Brethren, Brethren in Christ, Conservative Mennonites and others wear the MDS badge. Steve Wiest, MDS West Coast operations coordinator and a member of Hope Kingsburg, a USMB congregation in Kingsburg, California, has a history of working with MDS and MCC. In 2021, Wiest was involved with MDS’s work in Paradise, California, rebuilding some of the 13,000 homes destroyed in 2018 by the Camp Fire. The Camp Fire was the most destructive wildfire in California history and the worst in the U.S. in a century. Nearly three years later, the trauma was still raw for Paradise residents. “People that live through a fire and had to run from the flames or run through the flames will suffer for the rest of their lives,” Wiest says. That’s why MDS volunteers take time to listen to the homeowners they are working with. Wiest says a big part of what MDS does is give people hope and help them heal. “We spend time listening to them tell their story,” Wiest says. With respect to the Paradise community, Wiest says, “It doesn’t take much to go around town and hear the stories of trauma. You talk to the checkout clerk at the grocery store or somebody you meet at the taco truck, and there are the stories.” While MDS volunteers were in Paradise to rebuild homes destroyed three years ago, the 2021 fires added to California’s losses. As of Sept. 1, 2021, more than 3,600 buildings had been destroyed in 2021. The largest fire of the 2021 California wildfire season was the Dixie Fire, which started in about the same place as the 2018 Camp Fire but moved in the opposite direction. In one day, the Dixie Fire destroyed nearly all of the historic Gold Rush town of Greenville. As of August 2021, as the MDS crew worked, the Camp Fire was still growing, despite the efforts of more than 5,000 firefighters. MDS volunteers could sometimes see smoke clouds from wildfires 50 miles away. “You could smell the smoke, and sometimes see the cars covered with ash,” Wiest says. MDS’s work in Paradise was complicated by COVID-19. As COVID-19 cases continued to grow in the Paradise area, MDS paused its work there in September 2021 and sent volunteers home before they were able to complete the six homes they had started. But they will be back to finish what they started. Often the last to leave a disaster-affected community, MDS volunteers work to address unmet needs for the most vulnerable in the community. Whenever possible, homes built and repaired by MDS volunteers are constructed to withstand future disasters. In the process, homeowners often build long lasting relationships with the MDS volunteers who helped them recover and return home. In 2020, Hurricane Laura crossed over homes MDS built after Hurricane Rita in 2005. Carl Dube, long time MDS volunteer project director, and others checked in with homeowners to see how the houses had fared. “Their insurance adjuster said that there was no reasonable expectation for that house to still be there,” Dube says. “They were excited to meet some of the people responsible for this house that withstood the 150-mph winds and storm surge two feet higher than the floor.” Mennonites, Amish and like-minded Christians have a biblical understanding of faith that embraces a community of caring for each other and our neighbors. The Anabaptists of the sixteenth century cared for others. Their descendants, the Mennonites, have never been able to escape this heritage. In Europe, in North America and around the world, Mennonites have committed themselves again and again to service in Jesus’ name. Why? Because we Mennonites believe that authentic faith is expressed in every dimension of life. One recurring theme of Menno Simons was that true faith should “bear fruit.” In his classic words, “True evangelical faith...cannot lie dormant, but manifests itself in all righteousness and words of love:…it clothes the naked; it feeds the hungry; it comforts the sorrowful; it shelters the destitute; it aids and comforts the sad.”"]}, {"sub_zh": "门诺会世界大会（MWC）：同一个信仰大家庭", "sub_en": "MWC: A Family of Faith", "zh_paras": ["每隔六年，当来自五大洲四大洋的重洗派信徒汇聚在世界某一座城市，开展为期一周的在基督里骨肉至亲的大团圆庆典时，人们便能领略到整个广义门诺会大家庭无比恢宏的全景画卷。", "总部设于加拿大安大略省基奇纳（Kitchener）与哥伦比亚波哥大（Bogotà）的门诺会世界大会（Mennonite World Conference，简称 MWC），正是这一普世家庭大团圆的统筹组织者。首届 MWC 大会于1925年在瑞士巴塞尔举行，汇聚了来自北美、荷兰、法国与德国的代表。2022年第17届全球代表大会在印尼三间本土门诺宗派（爪哇福音教会、印尼穆里亚基督教会、印尼基督徒会友联合会）的热忱邀请下在印尼举行，因疫情采取线上线下混合形式召开。", "以美国门诺弟兄会为代表的美国重洗派大家庭，于2015年在宾夕法尼亚州 Harrisburg 荣耀主办了第16届 MWC 全球代表大会（简称 PA 2015）。该届大会吸引了来自全球77个国家的8,454名注册代表齐聚一堂；令人扼腕的是，另有数百位海外代表因未获美国签证而未能成行——例如来自肯尼亚的伊斯特利团契诗班（Eastleigh Fellowship Choir），全团30位成员中仅有5人最终侥幸获得签证，在大会第三晚代表全团献诗。", "“极其热衷于追溯家谱与家族姓氏的北美门诺人，总喜欢在新结识的朋友间玩一种‘门诺游戏’（Mennonite game）——不停地追问‘你是否认识某某……？’直到最终找出两人共有的某个远房亲戚，”MWC 官方刊物《信使报》（Courier）主编卡拉·布劳恩（Karla Braun）在2015年10月的社论中风趣地写道，“然而，当来自全球77个国家的门诺会与基督弟兄会信徒汇聚在宾州时……这一‘门诺游戏’早已彻底超越了肉体血缘的局限。来自世界天涯海角的弟兄姊妹，不出三言两语便能找到彼此深邃的生命交集：MCC 的一线海外义工服事经历、彼此代祷名单上的宣教士名字、参与‘国际青年志愿交流项目’（IVEP）或‘青年重洗派门诺交流网络’（YAMEN）的往昔岁月，以及各大宗派联合机构……都成了发掘属灵‘亲属’的肥沃土壤！”", "布劳恩动情地记述道：“在 PA 2015 的每一次相遇中，我们血脉相连的骨肉深情都在不断升华：我们用彼此的母语同声歌唱赞美，我们携手为穷人搭建木屋，我们一起装配蔬菜罐头，我们穿针引线缝制百家被，我们在手腕上绘制海娜纹饰，我们在绿茵场上同场竞技踢足球——这一切，都是我们‘同心合一’共同度过的美好时光！”", "全球重洗派大家庭日益展现的多元融合，生动体现在大会核心领导层的构成上——迎来了 MWC 历史上首位来自全球南方（Global South）的总干事：塞萨尔·加西亚（César García，来自哥伦比亚门诺弟兄会的优秀教牧学者）；与他并肩配搭的有主席 J·纳尔逊·克雷比尔（J. Nelson Kraybill，美国）、副主席丽贝卡·奥西罗（Rebecca Osiro，肯尼亚）、司库苏诺科·林（Sunoko Lin，美国/印尼）以及候任主席亨克·斯滕弗斯（Henk Stenvers，荷兰）。", "“我们全球属灵共同体的同心合一，绝非人类自身血气努力所能达成，亦非我们凭借任何组织手腕所能制造出来的产物，”总干事加西亚深刻指出，“这是上帝无偿赐予我们的神圣恩赐，是圣灵今日在我们中间亲自运行结出的善果。真正的圣徒相通与灵里契合，绝非依靠冰冷的机构章程或繁文缛节所能维系，而是单单奠基于基督在十字架上的流血舍命——在那里，上帝亲自创造了一支全新的子民，涵盖了世界上千姿百态的文化、种族、部落与方言！”", "每六年一次的全球全体大会大团圆，绝非 MWC 的全部职能。MWC 于2009年设立了四大常设专业委员会——信仰与生活委员会、和平委员会、执事委员会以及宣教委员会——它们被誉为 MWC 维系全球共同体的“心脏四大心室”，将全球重洗派教会网络在团契相交、敬拜颂赞、谦卑服事与福音见证中紧密脉动相连。每个委员会由8至10位由执行委员会严格遴选的各大洲杰出代表与专业学者组成：", "信仰与生活委员会：就基督信仰与实践提供教牧神学咨询，代表重洗派传统参与普世神学前沿对话；", "和平委员会：搭建和平议题的国际交流平台，全力声援扶持正在和平试炼中苦苦挣扎的成员教会，与探索和平身份认同的堂会深入对话，并为全球教会每年一度的“和平主日”（Peace Sunday）研发敬拜资源；", "宣教委员会：为 MWC 各成员教会提供普世差传与海外服事的资源交流平台，汇聚了全球120多家重洗派跨文化差会与海外服事机构；", "执事委员会：专注于 MWC 成员教会的福祉，尤其在成员身处严酷患难逼迫与人道危机之时，为处于患难中的总会提供倾听、代祷、慰藉与切实支援。例如自2017年起，执事委员会全力投入应对刚果民主共和国开赛省（Kasai）叛军叛乱引发的惨烈人道主义灾难。", "“要构建一个与当代世俗政治权柄迥然不同的‘另类属灵共同体’，必须依托于一个跨越国界、跨越文化、生动活出彼此依存、舍己之爱与人人平等的全球性基督身体，”塞萨尔·加西亚由衷疾呼，“唯有这样一种充满圣洁生机的共同体，才能向世人雄辩地证明：因着基督的爱，人类完全有能力跨越极端民族主义与狭隘族群中心主义的重重鸿沟！”", "MWC 各大区巡回代表积极在本区域各教会之间穿针引线。这些兼职志愿同工负责联络、深耕并支持 MWC 正式成员教会、准成员教会、潜在意向教会、地方基层堂会以及 MWC 各协同伙伴机构。此外，MWC 还通过协同运作 MCC 的 YAMEN 青年交流网络、推动“全球重洗派历史名录”建设、编纂重洗派历史与神学权威出版物，以及指导“青年重洗派委员会”（YABs），持续促进各成员国青年面对面的生命碰撞与配搭服事实践。", "在 PA 2015 举行的“全球青年峰会”上，年轻人纷纷挥笔致信慰问李相民（Sang-Min Lee）——这位韩国历史上首位因拒绝服兵役而身陷囹圄的门诺派良心拒服兵役青年。在热忱写下鼓励便条的青年中，便有一位来自哥伦比亚的良心拒服兵役者奥斯卡·苏亚雷斯（Oscar Suarez），他后来荣任 YABs 青年委员会拉丁美洲区域总代表。", "在哥伦比亚，年满18岁的青年男子必须强制服役1至3年，退伍后方能获得服役结业证书；在现实社会中，若没有这份军方证书，找寻体面工作将举步维艰。“我的家人对我没有这张退伍证书的未来充满了忧虑，但他们和我的母会全力支持我的信仰抉择，”这位主修音乐的大三学子坦言道。他对哥伦比亚“公正和平组织”（Justapaz）及其他维权团体的奔走深怀盼望。自2009年起，部分良心拒服兵役者得以依据宪法信仰自由条款免除兵役，且拒服兵役者无需完成兵役亦获准从大学顺利毕业；然而，每一位良心拒服兵役者仍必须在法庭上孤身进行旷日持久的法律拉锯战。", "苏亚雷斯的决绝选择在母会的青少年团契中掀起了巨大波澜。“年轻人对重洗派和平教导展现出前所未有的浓厚兴趣，好几位青少年正极其严肃地考虑拒绝服兵役，”他说。教会亦全面走入社区，向公众宣讲良心拒服兵役的和平福音真道。“弟兄姊妹的全然托举坚固了我的心志。这一严峻的试炼，反而将我的家庭、我的教会与整个社区紧紧凝聚在了一起！”", "借由 MWC 的普世网络，基督徒在遭受逼迫、误解与阻力的幽暗时刻，能够寻见守望相助的坚实后盾，并肩践行重洗派的和平与生命团契见证。", "“随着重洗派全球信徒的大多数不可逆转地向‘全球南方’转移，MWC 各成员教会之间以及教会内部的丰富多样性持续攀升——不仅体现在种族、文化、语言与神学思潮上，更深刻体现在贫富经济鸿沟之上，”自1990年至2012年掌舵 MWC 长达22年的总干事拉里·米勒（Larry Miller）深刻反思道，“巨大的贫富悬殊，构成了重洗派-门诺会信仰大家庭中实现‘彼此祝福、相互赋能’最为根本的现实挑战。”", "建立全球南北教会之间更加深度的互惠互通、平等相待，是整个重洗派大家庭未来面对的世纪大考。MWC 正携手各大差传服务机构，竭力引领这一神圣的历史进程。", "“能真切地知道我们绝非孤身一人前行，这是何等美好的属天确据！”担任 MWC 南部非洲区域总代表的门诺弟兄会姊妹弗朗西斯卡·伊班达（Francisca Ibanda）动情地由衷赞叹。正如 MWC 资深编辑卡拉·布劳恩所总结的那样：“只要对耶稣基督的纯正信仰成为凝聚我们的属灵黏合剂，那么普天之下，人人皆是骨肉至亲！”"], "en_paras": ["A significant snapshot of the larger Mennonite community is taken every six years when Anabaptists from around the globe gather in one location for a week-long celebration of kinship in Christ. Mennonite World Conference (MWC), a community of Anabaptist-related churches with offices in Kitchener, Ontario, and Bogotà, Colombia, organizes the global family reunion. The first MWC gathering was in Basel, Switzerland, in 1925, and drew representatives from North America, Holland, France and Germany. The 17th Assembly will be in Indonesia in 2022 at the invitation of the three Indonesian Mennonite denominations: Gereja Injili Di Tanah Jawa, Gereja Kristen Muria Indonesia and Sinode Jemaat Kristen Indonesia. Due to the global pandemic, the 2022 gathering will be a hybrid event. U.S. Anabaptist groups, including U.S. Mennonite Brethren, hosted the 16th assembly, held in Pennsylvania in 2015. PA 2015 drew 8,454 registrants from 77 countries, and several hundred more were denied visas to enter the country. For example, Eastleigh Fellowship Choir from Kenya, who performed on the third evening of Assembly, was represented by only five of its 30 members due to denied visas. “North American Mennonites keenly interested in genealogy and family names love to play ‘the Mennonite game’ by asking new acquaintances, ‘Do you know...?’ until they find a relative in common,” writes MWC Courier editor Karla Braun in her October 2015 editorial. “But as Mennonites and Brethren in Christ from 77 countries gathered in Pennsylvania…the Mennonite game wasn’t only about bloodlines. From all corners of the globe, it didn’t take long before we could find a connection: Mennonite Central Committee service workers, missionary prayer lists, participants in the International Volunteer Exchange Program (IVEP) or Young Anabaptist Mennonite Exchange Network (YAMEN) exchanges and denominational bodies provided fertile ground for finding ‘relatives,’” writes Braun. “Our sense of kinship grew with every encounter at PA 2015: we sang in each other’s languages, built a house, canned vegetables, stitched quilts and comforters, were inked with henna designs, played football—together.” The growing diversity of the global Anabaptist family is reflected in the officers, including the first general secretary from the Global South, César García (a Mennonite Brethren from Colombia) – along with J. Nelson Kraybill (president, USA), Rebecca Osiro (vice- president, Kenya), Sunoko Lin (treasurer, USA/Indonesia) and Henk Stenvers (president-elect, Netherlands). “The unity of our global community has not been the result of human effort or something that we are able to produce,” says García. “It is a gift of God that we can enjoy today through the work of the Holy Spirit in our midst. True communion is made possible not by institutional laws and formalities, but by the work of Christ on the cross, where God created a new people including many cultures, races, tribes, and languages.” The grand family reunion experience of Assemblies is not the only function of MWC. Formed in 2009, four commissions—Faith and Life, Peace, Deacons and Mission—are “chambers of the heart,” linking the global community of Anabaptist-related churches for fellowship, worship, service and witness. Each commission consists of eight to 10 members selected by the Executive Committee for continental representation or specialist capacity. The Faith and Life Commission receives and provides counsel on Christian faith and practice and represents Anabaptist perspectives in global conversations. The Peace Commission provides a forum for peace-related issues: supporting member churches facing peace struggles, conversing with churches asking questions about a peace identity and producing an annual worship resource for Peace Sunday. The Mission Commission provides MWC member churches with resources and a forum for dialogue on global witness and service. It brings together more than 120 Anabaptist global service and mission agencies. The Deacons Commission focuses on the welfare of the churches within MWC, particularly in times of duress, and offers member conferences listening, prayer, encouragement and support in times of need. For example, since 2017, the Deacons Commission has responded to the humanitarian disaster in DR Congo caused by a rebel group in Kasai province. “An alternative community to the political powers of today requires a transnational, cross-cultural, global community that lives out the Christian values of interdependency, love and equality,” says César García. “That kind of community is the only way of showing the world that it is possible to overcome nationalisms and ethnocentrisms.” MWC regional representatives build fraternal connections with churches in their region. These part- time volunteer staff are responsible for developing and supporting relationships with MWC member, associate-member and potential-member churches; local congregations; and MWC-related partners and agencies. MWC also facilitates face-to-face fellowship, personal encounters and cooperative experiences among its members through collaboration in MCC’s YAMEN (Young Anabaptist Mennonite Exchange Network), participation in the Global Anabaptist History profile, publications on Anabaptist history and theology, and the Young Anabaptists (YABs) committee. At the Global Youth Summit at PA 2015, young adults wrote encouragements to Sang-Min Lee, the first Mennonite conscientious objector in South Korea, who was imprisoned for refusing to serve in South Korea’s military. Among the note writers was Oscar Suarez, a CO from Colombia, who has since been named Latin American representative to the YABs committee. In Colombia, every 18-year-old man must complete one to three years of military service and earn a certificate of completion, without which, it is very hard to find employment. “My family is worried for my future because I don’t have this certificate, but they and my church are supportive of my decision,” the third-year music student says. He is hopeful about the work of Justapaz and other advocacy groups. Since 2009, some COs have been able to avoid military service on the grounds of faith. Also, objectors are now able to graduate from university without completing military service. However, each CO is still required to legally fight for these rights. Suarez’s choice has started a discussion with the youth in his congregation. “Young people are more interested in learning about the Anabaptist teaching of peace, and some teenagers are seriously considering not serving in the military,” he says. The church is also becoming more involved in sharing in the community about the message of conscientious objection. “Their support has strengthened my resolve. This challenge has brought my family, my church and the community together,” he says. Through MWC, Christians find solidarity and support to live out their Anabaptist values of peace and community amid hardship or resistance. “As the Anabaptist-related majority moved to the global South, diversity between and within MWC member churches continued to increase, not only ethnically, culturally, linguistically and theologically, but also economically,” writes Larry Miller, MWC’s general secretary from 1990-2012. “Disparity of wealth is one of the most basic obstacles to mutual blessing in the Anabaptist-Mennonite family of faith.” Developing a greater mutuality between the churches of the North and South is the challenge facing the Anabaptist family. MWC, together with other agencies, is attempting to guide the process. “It’s good to know that we are not alone,” says Francisca Ibanda, MWC regional representative for southern Africa and a Mennonite Brethren. “Where our faith in Jesus Christ is the binding agent,” says MWC’s Braun, “everyone is family.”"]}, {"sub_zh": "全球重洗派信徒版图与会友统计", "sub_en": "Worldwide Membership", "zh_paras": ["《2018年门诺会世界大会全球名录》权威数据显示：遍及全球86个国家和地区的重洗派关联教会受洗会友总数已达 2,131,199人！相较于2000年名录所载（63个国家、197个宗派实体、1,203,995名受洗信徒），实现了惊人的历史性大跨越。", "各大洲受洗信徒人数增长趋势表（2000–2018）", "在2018年，受洗会友人数突破30,000人的其他国家包括：坦桑尼亚（66,350人）、泰国（63,518人）、津巴布韦（50,287人）、德国（47,492人）、巴拉圭（36,009人）、肯尼亚（35,575人）、墨西哥（34,041人）以及安哥拉（30,555人）。", "全球受洗门诺会与基督弟兄会信徒人数排名前六位的国家："], "en_paras": ["The 2018 Mennonite World Conference world directory shows that the number of baptized members in Anabaptist-related congregations in 86 countries now stands at 2,131,199, a huge increase from the 2000 directory that showed 1,203,995 baptized believers in 197 bodies in 63 countries.", "Baptized Members by Continent (2000–2018):", "In 2018, the other countries with more than 30,000 members were Tanzania (66,350), Thailand (63,518), Zimbabwe (50,287), Germany (47,492), Paraguay (36,009), Kenya (35,575), Mexico (34,041) and Angola (30,555).", "The six countries with the most baptized Mennonite and Brethren in Christ members:"]}, {"sub_zh": "跨门诺派联合机构权威指南", "sub_en": "Guide to Inter-Mennonite Agencies", "zh_paras": ["跨门诺派机构在日常交流中多以英文缩写简称呈现。以下收录了门诺弟兄会深度参与协同运作的主要跨门诺派联合机构名录（本名录并非穷尽列举）：", "CIM（Council of International Anabaptist Ministries / 国际重洗派宣教委员会）：汇聚北美重洗派宣教差会及其海外关联事工的联合协同平台。", "Everence：北美重洗派专属的金融与信仰资源管家专业服事机构。", "Meetinghouse（宣道社团）：由门诺会与基督弟兄会主流期刊主编与文字出版人构成的专业新闻传媒协作组织。", "MCC（Mennonite Central Committee / 门诺会中央委员会）：北美门诺会与基督弟兄会联合创办的救济、服侍与缔造和平旗舰机构。", "MDS（Mennonite Disaster Service / 门诺灾难服侍处）：立足北美的草根专业自然灾难紧急应对与灾后重建救援机构。", "MEDA（Mennonite Economic Development Associates / 门诺经济发展促进会）：通过具有商业智慧与市场机制的可持续发展模式，服侍赋能全球低收入群体的专业机构。", "MHS（Mennonite Health Services / 门诺健康服务处）：通过将医疗健康机构与门诺会、基督弟兄会深度联结，提供医疗管理与照护赋能的专业服事网络。", "MWC（Mennonite World Conference / 门诺会世界大会）：凝聚全球五大洲门诺会与基督弟兄会各总会教会的普世圣徒团契大家庭。"], "en_paras": ["Inter-Mennonite agencies are often referred to by acronyms. Here is a list of some of the inter-Mennonite agencies in which Mennonite Brethren are involved. This list is not exhaustive. Council of International Anabaptist Ministries (CIM): North American Anabaptist mission agencies and affiliated overseas ministries Everence : an Anabaptist stewardship ministry Meetinghouse : a cooperating group of Mennonite and Brethren in Christ editors Mennonite Central Committee (MCC): the relief, service and peace agency of North American Mennonite and Brethren in Christ churches Mennonite Disaster Service (MDS): a North American disaster relief agency Mennonite Economic Development Associates (MEDA): serves low-income people around the world through a business-oriented approach to development Mennonite Health Services (MHS): supports health care agencies by connecting them to Mennonite and Brethren in Christ development Mennonite World Conference (MWC): a fellowship of Mennonite and Brethren in Christ churches around the world"]}]}, {"num": 14, "id": "chap-12", "badge_label": "CHAPTER 14", "title_zh": "第十二章：未来的挑战", "title_en": "Chapter 12: The Challenge for the Future", "desc": "信仰纽带前瞻与基督根基祝祷 (Loewen’s Vision & Benediction)。", "blocks": [{"sub_zh": "第四部分", "sub_en": "PART FOUR", "zh_paras": ["1960年代那部风靡一时的科幻老剧《迷失太空》（Lost in Space）在2018年被重新翻拍上映。无论是当年的原版还是崭新的重置版，剧中罗宾逊一家都在一个陌生未知的新世界中竭力经受生存技能的严峻考验。", "在某些引人深思的层面上，门诺弟兄会大家庭与《迷失太空》中那个身处异星的家庭颇有几分神似。我们今天正置身于未来学哲学家们所称的“后现代世界”（The Postmodern World）。后现代语境之所以极具挑战性，恰恰在于人们发现它几乎无法被贴上固定的标签（它本身就是“现代主义之后”的时代代名词），并且难以被简单勾勒描摹。正如莱昂纳德·斯威特（Leonard Sweet）所精辟指出的那样：“如果说谷登堡时代的［现代］世界是一场对秩序、规制、稳固、单一性与确定性的狂热执念；那么谷歌时代的［后现代］世界则是一场对混沌、不确定性、差异性、开放度、多元化与剧烈变革的狂热追逐。”", "门诺弟兄会大家庭同样在其宗派体制结构内部面临着深刻的裂变与重组。本书的初版是由“门诺弟兄会北美总会”（General Conference）编撰出版的，而这一组织实体在旧千年的最后一年通过民主表决，体面地结束了自身的历史使命，将其下属事工全面交由各主权国家总会承担。本书的美国修订版出版之际，正值美国门诺弟兄会总会（USMB）积极扩充专业同工团队、组建全新的植堂理事会，以扎实推进其面向2025年远景目标的关键时刻。", "面对未来，我们对门诺弟兄会教会当怀有怎样的期许？在新世纪的航道中，我们需要具备怎样的属灵生存技能？我们面对的新现实究竟是什么？因 COVID-19 全球疫情所引发的剧烈变迁，又将如何深远地重塑未来的教会事工格局？", "“后现代主义”这一概念在哲学层面上建立于解构主义大师雅克·德里达（Jacques Derrida）的理论之上。根据德里达及当代传播学理论家的观点，客观的“终极实在”（Ultimate Reality）在认识论上被认为是无法确知穷尽的；每一个文化群体都在使用自己的词汇、通过讲述各自的故事来主观“建构”自身的现实。如果我们将这种学术语汇转借到基督信仰语境中，或许可以说：人类对“终极实在”（即我们所认识信靠的独一上帝）的终极寻索，唯有在我们于上帝的“终极叙事”（Ultimate Story——即上帝藉着耶稣基督成就的十字架救赎大能）中找寻到属于自己的位置时，方能得到全然的满足与安息。基督信仰的宏大叙事无可辩驳地宣告：太初有道的圣言道成肉身——耶稣基督，亲自将作为终极实在的三一真神完全启示显明了出来。", "作为门诺弟兄会的一员，我们讲述着属于我们自己未完待续的生命故事，以此作为在现实中真切经历“上帝乃是终极实在”的生动见证。我们热忱邀请世人一同将这份救赎叙事接纳为他们自身的生命故事。", "在漫长的历史岁月里，门诺弟兄会大家庭曾艰难摸索如何精准定义我们生命的核心叙事主线。我们曾一度极易陷入借用源自俄国历史传统的民族文化纽带（包括我们引以为豪的低地德语文化遗产）来定义自我；然而，当面对一个汇聚了印度泰卢固语信徒以及刚果民主共和国法语信徒的普世大家庭时，这种单一狭隘的族群标签显然苍白无力、毫无说服力。", "唯有那些融合了福音派属灵滋养与重洗派信仰根基的神学特质，才为我们生命故事的主线提供了真正的灵魂底色。或许，界定我们身份故事最为凝练精当的表述，就是将我们这个大家庭描述为：一场活在圣灵复兴之中的普世宣教差传运动（a renewal missionary movement）。", "我们在圣灵里经历的生命复兴，与我们对新约圣经所启示的“作门徒的圣约共同体”模式的全然委身密不可分。我们在上帝神圣使命中的崇高角色，就是呼召普世万民来到主耶稣基督至高无上的公义主权之下生活。门诺弟兄会信徒正是那群将这一伟大叙事内化为自身生命、欣然接受被上帝收养接纳进入这个以天父为家长的神圣家庭之中的儿女。", "门诺弟兄会的故事，正如我们身处其中摸索前行的后现代世界一样，是完全开放未完的。未来的世纪大考严峻地要求我们：必须深刻审视那些塑造我们故事的时代变量，并由衷发问：“我们的家庭纽带，当如何赋予我们属灵的能力，去向世人呈现一个充满信服力与感召力的生命故事？”", "首先，我们面临的第一大挑战，是以一种既具宽广包容性、又具鲜明纯正信仰特质的方式，讲述我们家族的生命故事。", "作为当代的门诺弟兄会信徒，我们由衷感恩今天已不再由某种特定的外在方言腔调或古板服饰规条来定义我们的身份。我们欣喜地看到，我们的各堂会正以前所未有的宽广胸怀，张开双臂欢迎来自不同肤色与民族背景的新成员。我们在次要神学壁垒上作出了健康的拆毁——主餐圣餐不再仅仅向本宗派受洗的信徒封闭，而是向所有公开认信归入耶稣基督名下的圣徒完全敞开。我们竭尽所能，绝不让任何狭隘的“重洗派怪癖”将任何慕道渴慕之人拒之门外。当我们懂得避免让非本质的次要琐事疏远身旁共同敬拜的弟兄姊妹时，我们便行在了美善的道中。", "然而，主耶稣却严厉告诫我们切不可盲目迎合世俗社会的悦纳与赞誉。祂亲自宣告：那些为顺服遵行上帝的公义国度而甘受逼迫的人是有福的（马太福音 5:11）。要想在这个价值相对、泥沙俱下的多元化世俗世界中拥有一个真正值得向世人诉说的故事，我们必须坚持将我们的故事永远聚焦锚定在十字架的救赎大爱之上！我们将义无反顾地跟随耶稣——哪怕必须以牺牲我们的世俗声誉、社会地位与世人喝彩为代价。在历史的长河中，门诺人始终将“跟从耶稣”理解为一声呼召信徒向世俗随波逐流进行彻底决裂与反潮流（radical social nonconformity）的神圣天职。我们面向未来的最大考验，正是坚定拣选并躬身学习那条通往永生的“窄路”生命样式！", "其次，我们的大家庭亟需一批充满属灵远见的宣讲者，能够引领我们清晰描绘、准确阐明并在日常生活中全然活出上帝统治的国度叙事。", "坚决委身于“颠倒天国”（Upside-down Kingdom，由著名学者唐纳德·克雷比尔所倡导的经典概念）神圣价值观的教牧领导力，对于得着这个后现代世界至关重要。教会必须向自身群体中最优秀、最具才智的弟兄与姊妹发出号召，挑战他们践行自我牺牲的仆人式领袖风范——并且教会必须以宽广的胸襟由衷接纳他们承担领袖重任。重洗派传统的教会领导力以“彼此互惠、相互依存”（mutuality）为鲜明标记，倡导全教会共同体与教牧团组建深度同工团队并肩服事。", "全教会同心合意的聚集敬拜，是使我们生命被这一国度叙事所塑造陶造的关键圣礼实践。当我们归荣耀于三一真神时，我们便在建造属灵共同体，在筑牢坚贞信仰。在极其注重切身体验与全身心投入的后现代语境中，我们的崇拜既要保持对传统圣道礼仪的庄严承继，亦需焕发契合当下的鲜活体验。敬拜不断重塑并坚固我们的集体认信身份，赋予我们与永生上帝及信仰大家庭至关重要的属灵相通——而绝不向那些逼迫教会沦为追求新奇噱头、随波逐流、受商业市场逻辑驱动的世俗“塞壬海妖之歌”妥协屈膝！", "第三，家庭纽带必须通过独特超凡的人际生命关系彰显于世。", "主耶稣曾明言：世人之所以能够认出我们是祂的家人与门徒，正是由于我们彼此之间拥有那份超乎寻常的舍己相爱（约翰福音 13:35）。一个满有圣灵复兴的宣教差传运动，必定通过体贴入微的彼此相顾来彰显这份圣爱。门诺弟兄会运动若要在未来继续焕发生机活力，就必须烙刻上牺牲性慷慨施予的鲜明烙印。", "正如之前的现代世界一样，当今后现代世界在骨子里依然奉行实用功利主义与“底线思维”。一个人对金钱与物质财富的实际运用，赤裸裸地暴露了他灵魂深处最核心的价值取向。面对大批身处极端贫困苦难之中的全球属灵家人，坐拥西方丰沛物质资源的我们，必须毫无保留地对神国公义大肆投资，向饱受欺压痛苦的人群放胆宣告福音的好消息！", "最后，我们这个大家庭未来的生命形态，取决于我们如何悉心维系并深耕我们的家庭纽带。", "爱，必定在一个不断向外扩展的同心圆团契中倾倒出来。上帝呼召我们彻底跨越狭隘孤立的个人敬虔主义藩篱，义无反顾地融入作为基督有形身体的“圣约共同体”——圣洁的教会之中。地方堂会之间在区域差传宣教中应当结为生死与共的战略同盟。整整一代怀揣炽热国度异象、对门诺弟兄会普世大家庭满怀赤子之心的领袖正在被神兴起，他们必将引领我们与其他主权国家总会一道，迈入彼此平等、互尊互助、同气连枝的全新伙伴关系纪元！"], "en_paras": ["for the Future", "The quirky 1960s television show about a family “Lost in Space” got a reboot in 2018. In both the original and the remake, the Robinson family tests their survival skills in a strange new world. The Mennonite Brethren family resembles the “Lost in Space” TV family in some striking ways. We live in what futurist philosophers are calling “The Postmodern World.” The postmodern environment is particularly challenging because it has proven impossible to label (it is the age after “modernism”) and difficult to describe. As Leonard Sweet writes, “If the Gutenberg [modern] world was a rage for order, regulation, stability, singularity and fixity, the Google [postmodern] world is a rage for chaos, uncertainty, otherness, openness, multiplicity and change.” The Mennonite Brethren family also faces significant change within our denominational structures. This book was first published by the General Conference of Mennonite Brethren churches, a structure that voted itself out of existence in the last year of the old millennium and shifted its ministries to the national conference. This book’s United States revision is being published during a time when USMB is expanding staff and forming a new Church Planting Council to effectively move forward with its goals for 2025. What can we anticipate for the Mennonite Brethren church of the future? What kind of survival skills will we need for this new century? What is the new reality? How will the shifts we experienced because of COVID-19 significantly shape ministry going forward? The notion of postmodernism rests on a philosophy suggested by deconstructionist Jacques Derrida. According to Derrida and other communication theorists, ultimate reality is impossible to know. Each culture “constructs” its own reality by using words, by telling stories. If we as Christians use this terminology, we might say that the search for Ultimate Reality (whom we know as God) can be satisfied by finding our place in the “Ultimate Story’’ (God’s saving act through Jesus Christ). The Christian story makes the claim that the Word Jesus Christ reveals God as the Ultimate Reality. As Mennonite Brethren, we tell our own unfinished story as one expression of the search to truly experience God as the Ultimate Reality. We invite others to claim this narrative as their own story. In the past, the Mennonite Brethren family struggled to define our central storyline. We were tempted to use ethnic cultural ties from our Russian past that included our Low German heritage, but that descriptor was not persuasive in a family that includes Telegu speakers in India and French speakers in DR Congo. Theological distinctives, including both evangelical influences and Anabaptist roots, provide clues for the storyline. Perhaps the most succinct way of identifying our story is to speak of the family that lives as a renewal missionary movement. Our renewal by the Holy Spirit is bound up with a commitment to a New Testament model of the discipling community. Our role in God’s mission is to invite the world to live under the sovereign rule of Jesus the Lord. Mennonite Brethren are among those who make this story their own, those who accept adoption into this family with God as our parent. The MB story, like the postmodern world in which we seek to find our way, is open-ended. The challenge of the future demands that we consider factors which shape our story and then ask, “How will our family ties empower us to offer a story that others will find compelling?” Our first challenge is to tell the family story in a way that is both inclusive and distinct. As Mennonite Brethren we are pleased that a particular dialect or way of dressing can no longer identify us. We are glad that our churches increasingly welcome members from many ethnicities. We have lowered some theological barriers. The Lord’s Supper is open to all who claim faith in Jesus, not just baptized believers. We’ve done our best not to let our “Anabaptist quirks” keep anyone away. We are doing well when we avoid letting nonessentials distance us from fellow worshipers. Yet, Jesus warns against seeking social acceptance. He says that those who face persecution for their commitment to God’s rule are blessed (Matthew 5:11). To have a story worth telling in our pluralistic world, we will need to continue to center our story on the cross. We will follow Jesus—even at the cost of the death of our reputations and popularity. Historically, Mennonites have understood following Jesus as a call to radical social nonconformity. Our greatest challenge for the future is to choose and learn the lifestyle of the narrow way. Second, our family will need proclaimers who can lead us into visualizing, describing and living out the story of God’s rule. Leadership committed to “upside-down Kingdom” values (a term popularized by Donald Kraybill) will be essential to reach the postmodern world. The church must issue the challenge of self-sacrificial servant leadership to its best and brightest women and men—and be open to having them lead. Anabaptist church leadership is marked by mutuality, involving the community in ministry teams with its pastors. Worshipping together is a vital practice for being shaped by the story. As we glorify God, we build community, and we build faith. Experience and participation are important values in the postmodern world, so our worship must balance fresh experience with tradition. Worship reinforces our corporate identity, offering vital communion with God and the family of faith without succumbing to the siren song that compels us to seek to be novel, innovative and market-driven. Third, family ties are demonstrated through distinctive relationships. Jesus said that his family would be identified by the remarkable love they have for each other (John 13:35). A renewal missionary movement expresses love through mutual care. If the Mennonite Brethren movement is to remain vital, it must be marked by sacrificial generosity. Like the modern world before it, the postmodern world lives by the bottom line. Use of money and possessions reveals our most deeply held values. With a global family that is desperately poor, we with Western wealth must invest profoundly in the kingdom proclamation of good news for the oppressed. Finally, the future shape of our family will be determined by how well we maintain our family ties. Love is expressed by fellowship in ever-expanding circles. We are invited to move beyond individual piety to become part of the covenant community that is the church. Congregations partner with others in regional mission. A generation of visionary leaders with a burning passion for the Mennonite Brethren global family will lead us into a new partnership of equals with other national conferences."]}, {"sub_zh": "信仰纽带前瞻与基督根基祝祷 (Loewen’s Vision & Benediction)", "sub_en": "Loewen’s Vision & Benediction", "zh_paras": ["三十多年前，资深重洗派神学家霍华德·勒温（Howard Loewen）曾为门诺弟兄会构建家庭纽带勾勒了一幅恢宏的异象蓝图。那些掷地有声的话语在今天依然振聋发聩。他向全教会发出了五重神圣呼召：", "对我们所承继的“重洗派—敬虔派”基督信仰神圣根基，保持日益觉醒与深刻体认；", "向世上贫穷困苦之人，全力宣讲耶稣基督天国救赎的福音好消息；", "借由严谨专注的属灵操练，持续滋养圣灵重生的活泼生命；", "以整本圣经为绝对依归，全然聚焦于顺服遵行跟从主耶稣基督；", "在心灵深处与上帝普世的至亲大家庭，建立骨肉相连的至深交通！", "重洗派属灵教父门诺·西蒙斯（Menno Simons）生前在他所有神学著作的扉页上，始终亲手工整题写着同一句圣经经文。对于今天审视这支承载着他尊贵名号的属灵大家庭的我们而言，这句经文正是最完美、最神圣的劝勉与祝祷：", "“因为那已经立好的根基就是耶稣基督，此外没有人能立别的根基。”", "——《哥林多前书》3章11节"], "en_paras": ["More than 30 years ago theologian Howard Loewen outlined the Mennonite Brethren vision for building family ties. His words still ring true today. He called for: (1) a growing awareness of our Anabaptist-pietist Christian roots; (2) good news proclamation of Jesus’ Kingdom for the poor; (3) spiritual rebirth nurtured by spiritual discipline; (4) biblical focus on obediently following Jesus; and (5) kinship with the global family of God. The Bible verse that Menno Simons placed on the title pages of all his writings is an appropriate benediction for this look at the family that bears his name: “For no one can lay any foundation other than the one already laid, which is Jesus Christ” (1 Corinthians 3:11)."]}]}, {"num": 15, "id": "chap-biblio", "badge_label": "CHAPTER 15", "title_zh": "附录：推荐阅读与引用书目", "title_en": "Appendix: Recommended Reading & Works Cited", "desc": "推荐阅读书目；引言。", "blocks": [{"sub_zh": "推荐阅读书目", "sub_en": "RECOMMENDED READING", "zh_paras": ["Becker, Palmer. 《重洗派精粹：独特基督信仰的十大记号》（Anabaptist Essentials: Ten Signs of a Unique Christian Faith）. Harrisonburg, VA: Herald Press, 2017.", "Bender, Harold S. 《门诺·西蒙斯全集》（The Complete Works of Menno Simons）. Scottdale, PA: Herald Press, 1956.", "Bragt, Thielman J. van. 《殉道者之镜》（Martyrs Mirror）. Compiled by Menno Saute, 1944.", "U.S. Conference of Mennonite Brethren Churches. 《门诺弟兄会信仰宣言》（Confession of Faith of the Mennonite Brethren）, 2014.", "Board of Faith and Life. 《门诺弟兄会信仰宣言：注释与教牧应用》（Confession of Faith Commentary and Pastoral Application）. Winnipeg, MB: Kindred Productions, 2000.", "Detweiler, Lowell. 《铁锤敲击盼望：门诺灾难服侍处五十年图文实录》（The Hammer Rings Hope: Photos and Stories from Fifty Years of Mennonite Disaster Service）. Scottdale, PA: Herald Press, 2000.", "Dueck, Abe J. 《庆祝150周年：遍布全球的门诺弟兄会》（Celebrating 150 Years: The Mennonite Brethren Church Around the World）. Winnipeg, MB: Kindred Productions, 2010.", "Dueck, Abe J., Bruce L. Guenther, and Doug Heidebrecht, eds. 《重塑身份与使命：门诺弟兄会150周年沉思录》（Renewing Identity and Mission: Mennonite Brethren Reflections After 150 Years）. Winnipeg, MB: Kindred Productions, 2011.", "Geddert, Timothy J. 《如今安好：在伦理困境中寻求共识》（All Right Now: Finding Consensus on Ethical Questions）. Waterloo, ON and Scottdale, PA: Herald Press, 2008.", "Keim, Albert. 《平民公共服务营的故事：图解民事替代役史》（The CPS Story: An Illustrated History of Civilian Public Service）. Intercourse, PA: Good Books, 1990.", "Loewen, Jacob A., and Wesley J. Prieb. 《唯独圣灵的宝剑》（Only the Sword of the Spirit）. Winnipeg, MB: Kindred Productions, 1997.", "Murray, Stuart. 《赤诚的重洗派：激进信仰的核心基石》（The Naked Anabaptis     /* State Variables */
    let currentLang = 'zh'; // 'zh' or 'en'
    let currentTheme = 'cream';
    let currentFontSize = 18;
    let currentFontFamily = 'song';
    let currentLineHeight = 1.78;

    // View state: 0 = Book Home Page (书籍首页), 1..N = reading pages
    let currentPageIdx = 0; 
    let currentSpreadIdx = 0; 
    let PAGES = []; // Computed client-side
    let isPaginating = false;

    /* Initialize Application */
    function init() {
      applyResponsiveScale();
      const urlParams = new URLSearchParams(window.location.search);
      const isStandalone = urlParams.has('standalone') || urlParams.has('isolated') || urlParams.has('focus') || urlParams.has('share') || window.location.hash.includes('standalone');

      if (isStandalone) {
        // Point 4: Always start at Book Home Page (Page 0) for exclusive share links!
        currentPageIdx = 0;
        currentSpreadIdx = 0;
      } else {
        loadSavedState();
      }

      paginateAndRender();
      setupKeyboard();
      setupGestures();
      setupIdleTimer();
      setupAutoFullscreen();
    }

    /* Detect single-page mobile/portrait mode */
    function isSinglePageMode() {
      return window.innerWidth <= 960 || window.innerHeight > window.innerWidth;
    }

    /* ========================================================
       DYNAMIC CLIENT-SIDE PAGE FITTING ENGINE
       Integer line height quantization + binary search split.
       Zero line clipping, dense filling, no wasted space!
       ======================================================== */
    function paginateAndRender() {
      if (isPaginating) return;
      isPaginating = true;

      const savedChNum = getActiveChapterNum();
      const leafL = document.getElementById('leaf-left');
      const bodyL = document.getElementById('body-left');
      const headerL = document.getElementById('header-left');
      const single = isSinglePageMode();

      // Available dimensions
      let targetWidth = bodyL ? bodyL.clientWidth : 0;
      if (!targetWidth || targetWidth < 100) {
        targetWidth = single ? (window.innerWidth - 36) : 480;
      }

      // Calculate exact available height for reading body text from physical leaf container
      let availHeight = 0;
      if (leafL) {
        const cs = window.getComputedStyle(leafL);
        const padTop = parseFloat(cs.paddingTop) || (single ? 44 : 28);
        const padBottom = parseFloat(cs.paddingBottom) || (single ? 14 : 22);
        const headerH = 32; // 22px height + 10px margin-bottom
        const innerLeafH = leafL.clientHeight - padTop - padBottom;
        availHeight = innerLeafH - headerH;
      }
      if (!availHeight || availHeight < 150) {
        availHeight = single ? (window.innerHeight - 90) : 460;
      }

      // Integer line height quantization: strictly prevent partial line clipping!
      const fs = currentFontSize;
      const lh = currentLineHeight;
      const lineH = fs * lh;
      const maxLines = Math.max(4, Math.floor(availHeight / lineH));
      const targetHeight = (maxLines * lineH) - 3;

      const measure = document.getElementById('measure-leaf');
      measure.style.width = targetWidth + 'px';
      measure.style.fontSize = currentFontSize + 'px';
      measure.style.lineHeight = currentLineHeight;
      if (currentFontFamily === 'kai') {
        measure.style.fontFamily = 'var(--font-kai)';
      } else if (currentFontFamily === 'sans') {
        measure.style.fontFamily = 'var(--font-sans)';
      } else {
        measure.style.fontFamily = 'var(--font-serif-zh)';
      }
      measure.style.textAlign = 'justify';
      measure.style.textJustify = 'inter-ideograph';
      measure.style.wordBreak = 'break-word';

      PAGES = [];
      const chapters = BOOK.chapters;

      for (const ch of chapters) {
        const chStartPage = PAGES.length + 1;
        ch.startPage = chStartPage;
        let isChFirst = true;
        let curHtml = '';

        const headerHtml = `
          <div class="ch-first-header">
            <div class="ch-label-num">— ${ch.badge_label} —</div>
            <div class="ch-headline">${currentLang === 'en' && ch.title_en ? ch.title_en : ch.title_zh}</div>
          </div>
        `;

        curHtml = headerHtml;

        for (const block of ch.blocks) {
          const subTitle = (currentLang === 'en' && block.sub_en) ? block.sub_en : block.sub_zh;
          if (subTitle) {
            const subHtml = `<div class="subheading-banner">${subTitle}</div>`;
            measure.innerHTML = curHtml + subHtml;
            if (measure.scrollHeight > targetHeight && curHtml !== headerHtml) {
              PAGES.push({
                chapterNum: ch.num,
                chapterTitle: ch.title_zh,
                chapterTitleEn: ch.title_en,
                isChFirst,
                html: curHtml
              });
              isChFirst = false;
              curHtml = subHtml;
            } else {
              curHtml += subHtml;
            }
          }

          const paras = (currentLang === 'en' && block.en_paras && block.en_paras.length > 0) ? block.en_paras : block.zh_paras;
          for (let pIdx = 0; pIdx < paras.length; pIdx++) {
            let p = paras[pIdx];
            let isParaStart = true;

            while (p.length > 0) {
              let pFormatted = '';
              if (isChFirst && curHtml === headerHtml && isParaStart && p.length > 0) {
                const firstChar = p.charAt(0);
                const rest = p.slice(1);
                pFormatted = `<p><span class="drop-cap">${firstChar}</span>${rest}</p>`;
              } else if (isParaStart) {
                pFormatted = `<p>${p}</p>`;
              } else {
                pFormatted = `<p class="p-continue">${p}</p>`;
              }

              measure.innerHTML = curHtml + pFormatted;
              if (measure.scrollHeight <= targetHeight) {
                curHtml += pFormatted;
                p = '';
              } else {
                // Overflows: binary search maximum fitting prefix
                let low = 1;
                let high = p.length;
                let bestFit = 0;

                while (low <= high) {
                  const mid = Math.floor((low + high) / 2);
                  let testFrag = '';
                  if (isChFirst && curHtml === headerHtml && isParaStart && mid > 0) {
                    testFrag = `<p><span class="drop-cap">${p[0]}</span>${p.slice(1, mid)}</p>`;
                  } else if (isParaStart) {
                    testFrag = `<p>${p.slice(0, mid)}</p>`;
                  } else {
                    testFrag = `<p class="p-continue">${p.slice(0, mid)}</p>`;
                  }

                  measure.innerHTML = curHtml + testFrag;
                  if (measure.scrollHeight <= targetHeight) {
                    bestFit = mid;
                    low = mid + 1;
                  } else {
                    high = mid - 1;
                  }
                }

                if (bestFit >= 20) {
                  const prefix = p.slice(0, bestFit);
                  const punctMatch = prefix.search(/[，。！？；、：“”‘’（）《》][^，。！？；、：“”‘’（）《》]*$/);
                  if (punctMatch !== -1 && punctMatch >= bestFit - 14) {
                    bestFit = punctMatch + 1;
                  }

                  let fitHtml = '';
                  if (isChFirst && curHtml === headerHtml && isParaStart) {
                    fitHtml = `<p><span class="drop-cap">${p[0]}</span>${p.slice(1, bestFit)}</p>`;
                  } else if (isParaStart) {
                    fitHtml = `<p>${p.slice(0, bestFit)}</p>`;
                  } else {
                    fitHtml = `<p class="p-continue">${p.slice(0, bestFit)}</p>`;
                  }

                  curHtml += fitHtml;
                  PAGES.push({
                    chapterNum: ch.num,
                    chapterTitle: ch.title_zh,
                    chapterTitleEn: ch.title_en,
                    isChFirst,
                    html: curHtml
                  });
                  isChFirst = false;
                  curHtml = '';
                  p = p.slice(bestFit);
                  isParaStart = false;
                } else {
                  if (curHtml.trim().length > 0) {
                    PAGES.push({
                      chapterNum: ch.num,
                      chapterTitle: ch.title_zh,
                      chapterTitleEn: ch.title_en,
                      isChFirst,
                      html: curHtml
                    });
                    isChFirst = false;
                    curHtml = '';
                  }
                  curHtml = pFormatted;
                  p = '';
                }
              }
            }
          }
        }

        if (curHtml.trim().length > 0) {
          PAGES.push({
            chapterNum: ch.num,
            chapterTitle: ch.title_zh,
            chapterTitleEn: ch.title_en,
            isChFirst,
            html: curHtml
          });
        }
      }

      // Restore position or keep at Book Home (0)
      const urlParams = new URLSearchParams(window.location.search);
      const isStandalone = urlParams.has('standalone') || urlParams.has('isolated') || urlParams.has('focus') || urlParams.has('share') || window.location.hash.includes('standalone');

      if (isStandalone) {
        currentPageIdx = 0;
        currentSpreadIdx = 0;
      } else if (currentPageIdx > 0 && savedChNum > 1) {
        const targetCh = BOOK.chapters.find(c => c.num === savedChNum);
        if (targetCh && targetCh.startPage) {
          currentPageIdx = targetCh.startPage;
          currentSpreadIdx = Math.ceil(currentPageIdx / 2);
        }
      } else if (currentPageIdx > 0) {
        currentPageIdx = Math.max(1, Math.min(currentPageIdx, PAGES.length));
        currentSpreadIdx = Math.ceil(currentPageIdx / 2);
      } else {
        currentPageIdx = 0;
        currentSpreadIdx = 0;
      }

      isPaginating = false;
      renderCurrentView();
      renderToc();
    }

    function getActiveChapterNum() {
      if (currentPageIdx === 0) return 1;
      const curP = isSinglePageMode() ? PAGES[currentPageIdx - 1] : PAGES[(currentSpreadIdx * 2) - 2];
      return curP ? curP.chapterNum : 1;
    }

    function renderMobileHomeHtml() {
      const hero = renderBookHomeHeroHtml();

        <div class="book-home-wrap mobile-home-container">
          ${hero}
          <div style="padding-top: 10px;">
            ${dir}
          </div>
