s to bring people together for restitution and reconciliation. We encourage prison visitation programs as well as rehabilitation and re- entry of prisoners into society. Active peacemaking is also the aim of several inter- Mennonite agencies in which Mennonite Brethren participate. Mennonite Central Committee (MCC) fosters peace in North America and around the world through peace education training, conflict resolution and mediation, trauma healing, inter-faith bridge building and advocacy. Mennonite Disaster Service (MDS) works at peacemaking by serving communities that have faced natural disasters. The story of these agencies is told in chapter 11.", "Peacemaking begins with restoring our relationship with God, then with our intimate family and friends and moves in ever widening circles: through acquaintances, our workplaces, to the world at large."]}, {"sub_zh": "面对战争与国家军役的神圣抉择 (Responding to War & Military Service)", "sub_en": "Responding to War & Military Service", "zh_paras": ["当和平的波纹触及世界地缘政治时，必然引发门诺弟兄会对于“基督徒当如何回应战争”的根本考量。门诺弟兄会坚信：耶稣关于“爱仇敌”的神圣命令，绝非某种在天下太平时高谈阔论、在战争爆发时便随手抛弃的装饰品；和平是基督徒终生不可妥协的生命存在方式！以爱报恨的神圣能力，完全源于我们在基督里领受的新造生命；圣灵借着神家里弟兄姊妹的同心守望，赐予我们在狂澜中坚守信仰的超然胆量。", "早期重洗派毫不含糊地教导：“挥舞刀剑杀戮，与基督的教训绝对水火不容！”他们坚决反对国家政权使用武力强加任何宗教信仰。门诺·西蒙斯曾亲眼目睹德国农民战争与明斯特狂热分子企图以武力建立政权而惨遭血洗的灭顶之灾，这一惨痛历史促使他毕生带领信徒毫不动摇地走基督和平的十字架道路。", "俄国门诺弟兄会历史上同样在“刀剑”问题上经历过泣血的惨痛教训：在1917年十月革命后的恐怖内战与土匪屠戮中，少数信徒擅自组建了武装自卫民兵（Selbstschutz），结果招致了更具毁灭性的报复浩劫。历史学家约翰·A·托伊斯沉痛记录道，后来的教会总会会议对这一举动进行了严正斥责，将其定性为“不仅在战术上是一场自取灭亡的灾难性大错，更在神学上严重践踏背叛了重洗派数百年纯正的圣经非抵抗原则，必须永远被视为门诺历史上的一处深沉墨黑的伤痛污点”（托伊斯，108–109页）。", "面对当代北美门诺弟兄会信徒中关于军役和警务服役的多元现实看法，2013年美国门诺弟兄会总会（USMB）信仰与生命委员会专门召开了全国专题神学研讨大会，深入考量圣经和平教训的当代应用；并于2014年正式通过了全面修订后的《信仰宣言》第十三条。修订后的条文在坦诚面对现实多元处境的同时，毫不含糊地重申了我们对圣经和平信仰的历史性终生委身：", "“作为和平缔造者，我们竭力缓解苦难、化解争端、促进公义，并努力终结一切暴力与战争，使世人能清晰得见基督舍己大爱的真实彰显。如同其他传统和平教会（Historic Peace Churches）一样，我们当中的许多人坚定选择不参与任何军事作战，而是全身心投身于各类非军事的替代役爱心服事！”", "门诺弟兄会由衷感谢全能上帝，北美国家政权在法律上正式设立了“良心拒服兵役者”（Conscientious Objectors, CO）的合法权利，并为那些在信仰良心上拒绝拿枪杀人的青年提供了广泛的社会“替代性服役”（Alternative Service）。全宗派教牧同工明确受召：“必须循循善诱地辅导青年一代信徒，将他们的青春与才智甘心奉献于缓解人间苦难、化解世间争端的慈爱服事之中，而绝不要在刀光剑影的军事冲突中拿起毁灭生灵的武器！”（《信仰宣言注释与教牧应用》，150–151页）。", "缔造和平更包含了恒切祷告的神圣呼召：跟从耶稣的人天天为那些逼迫仇恨我们的人代祷（马太福音 5:44），为君王和一切在位的世俗掌权者献上恳求与祝祷（提摩太前书 2:2），并切切祈求上帝赐下胆量，使和平的福音在这动荡世代得以放胆广传（歌罗西书 4:4）。祷告正是信徒全副属灵军装中不可或缺的利刃，赋能我们在与这幽暗世界执政掌权者的属灵空前争战中，坚立不摇、得胜有余（以弗所书 6:10-18）！"], "en_paras": ["This leads us to consider how Mennonite Brethren respond to war. Mennonite Brethren believe Jesus’ call to love the enemy requires that we make peacemaking a way of life. Nonresistance is not an awkward accessory that we pull out in times of war. The power to return love for hate comes from our new nature in Christ. The Spirit enables us to live faithfully by providing a supportive community of believers within the family of God. The early Anabaptists taught that “the use of the sword” was contrary to the teachings of Christ. They opposed the use of force by the state to enforce particular Christian beliefs. The Anabaptists recognized that nations had a legitimate duty to use the sword for police action. Menno Simons witnessed the tragedy of the Peasant Revolt in which early radical reformers were crushed after seeking to defend an independent state; that event helped convince him to lead the Dutch Anabaptists in the way of Christ. Mennonite Brethren in Russia also struggled with the issue of “the sword.” In the terror-filled chaos following the 1917 revolution, Russian Mennonites organized a self-defense force. There were heavy losses. According to historian John A. Toews, subsequent church conferences condemned the action as “not only a tactical blunder, but also a gross violation of historic biblical nonresistance. It must always be regarded as a dark blot on the pages of Mennonite history” (Toews, 108-9). Given the present-day diversity of opinion regarding military and police service within USMB churches, in 2013 the USMB Board of Faith and Life convened a study conference to consider contemporary application of biblical teaching on peace. In 2014 a revised Article 13 was adopted that recognizes both current diversity and the historic commitment to peace. The revision of Article 13 addresses the issue of military involvement as follows: “As peacemakers we alleviate suffering, reduce strife, promote justice and work to end violence and war, that others may see a demonstration of Christ’s love. As in other Peace Churches, many of us choose not to participate in the military but rather in alternative forms of service.” Mennonite Brethren are grateful to God that governing authorities in North America have provided alternative service for those who choose not to enter military service. The MB church is called “to counsel youth to offer themselves in loving service to reduce strife and alleviate suffering rather than take up arms in military conflict” (Confession of Faith Commentary and Pastoral Application, 150-51). Peacemaking includes a call to prayer. Followers of Jesus pray for their enemies (Matthew 5:44) and for government officials and those in authority (1 Timothy 2:2).We pray for bold proclamation of the good news of peace (Colossians 4:4). Prayer is part of the believer’s spiritual armor, enabling us to take our stand in the great conflict with the principalities and powers of this evil world (Ephesians 6:10-18).", "Three objections have been raised to military nonparticipation as God’s way for God’s family. First, doesn’t the Old Testament teach that God endorses the use of violence by nation-states? Second, can anyone point to modem examples of this type of radical peacemaking, even on a small scale? Third, should Christians use violence to defend the powerless when threatened by powerful evil forces?"]}, {"sub_zh": "面对“积极缔造和平”的三大严峻质疑与神圣回应 (Challenges to Active Peacemaking)", "sub_en": "Objection 1: Old Testament War and Peace", "zh_paras": ["在现实世界中，常常有人对将“拒绝参与杀戮”作为上帝家庭的生活方式提出三大尖锐质疑：", "质疑一：难道旧约圣经没有明确记载上帝命令以色列民族国家使用刀剑军队发动战争吗？", "质疑二：在真实的现实世界中，这种激进的和平道路真的行得通吗？有任何令人信服的实际见证吗？", "质疑三：当无辜软弱的邻舍面临凶残暴力的生命威胁时，基督徒难道不应当动用致命武力进行保护吗？", "有人认为，旧约上帝命令以色列剿灭迦南仇敌的记载，是反对重洗派和平观的铁证。对此，门诺弟兄会给予了四重深邃的圣经回应：", "以基督为圣经诠释的最高峰：门诺弟兄会阅读圣经的起点是道成肉身的耶稣基督，而非旧约以色列的神权国家政治！耶稣的话语是上帝向人类发出的最清晰、最权威的启示，整本旧约圣经唯有在耶稣基督的生平与十字架光照下才能被正解。耶稣毫无保留地命令门徒必须爱仇敌；对基督而言，每一个神国子民的首要天国国籍唯在天上，在爱仇敌的原则上基督没有向任何交战国国民开出任何豁免特权！", "生命与死亡的终极主权唯独在神手中：重洗派深刻注意到，上帝与以色列建国的首要神迹作为，正是全权施行大能救赎他们出埃及、过红海（出埃及记 12–15章）。以色列在此过程中完全是被动见证上帝审判与拯救的旁观者；暴虐的埃及法老所遭受的灭顶之灾，完全是上帝公义审判其背叛神圣主权的作为，绝非出于以色列人自己的血气刀剑之功。", "旧约自身深藏着和平的至高轨迹：诗篇一再歌颂上帝打折弓、断绝枪、焚烧战车的和平救赎（诗篇 37:14-15；46:9）；先知书更是满怀盼望地眺望那万国将刀打成犁头、把枪打成镰刀、不再学习战事的荣耀末世，宣告以色列的终极使命是作列国万邦的和平之光（以赛亚书 2:4；60:1-3）。", "旧约战争的作战模式完全违背任何现代世俗战争的逻辑：在旧约特定战争记载中，争战胜败完全取决于对神的信靠与吹响号角，而非世俗精良武器（约书亚记 6章；士师记 6–7章；历代志下 20章）；战利品中的战车马匹甚至被神命令直接废除毁坏（约书亚记 11:9；撒母耳记下 8:4），这与现代毁灭性的机械化国家战争有着本质的区别。", "值得深思的是，作为替代非抵抗原则的主要基督教伦理——传统“正义战争理论”（Just War Theory）——其初衷同样是立足于新约对和平的渴慕，试图通过设定极其严苛的道德门槛（如严禁杀害非战斗平民、仅作为迫不得已的极刑手段）来极力限制暴力的蔓延，它本身就承认了战争绝非基督徒的崇高理想，而是堕落受造界在两恶相权取其轻时的无奈叹息。"], "en_paras": ["For some, God’s command to destroy Israel’s enemies seems an ironclad objection to the Anabaptist interpretation of Jesus’ words. If God orders war in the Old Testament, isn’t Jesus simply referring to personal relations? God surely has not changed his mind about war, has he? First, as Mennonite Brethren, we begin with Jesus not the Old Testament. We understand that Jesus speaks the clearest word from God, and we interpret the rest of Scripture in light of what he said and did. Jesus clearly calls us to love our enemies. For Jesus, our primary citizenship is in the kingdom of heaven, and he offers no exceptions for citizens of warring nations. Second, we as Anabaptists note that in the Bible, life and death are in God’s hands. God’s first act with the nation of Israel was the miraculous deliverance from Egypt through the Red Sea. According to Exodus 12-15, Israel was called to witness God’s deliverance and judgment. Egypt, the aggressor and oppressor, received the judgment due their rebellion against God. Third, the Old Testament includes a tradition in which God’s ways are the way of peace. The Psalms speak of God’s act of delivering Israel and destroying the weapons of war (Psalm 37:14-15; 46:9). The prophets look forward to a day when war will cease, and Israel will fulfill its role of being a light to the nations (Isaiah 2:4; 60:1-3). Fourth, when the Old Testament attributes to God the commands to go to war, the battle plans are unconventional by any modern standard. Trumpets and faith count more than weapons (Joshua 6; 10; Judges 6-7; 2 Chronicles 20). Weapons gained as spoils of war are destroyed as part of God’s policy (Joshua 11:9; 2 Samuel 8:4). Old Testament wars differ significantly from modern warfare. This review suggests some of the ways Mennonite Brethren have responded to the objection that the Old Testament seems to approve war. It is noteworthy that the just war theory, a primary Christian alternative to nonresistance, is based on New Testament peace teachings rather than reference to Old Testament war stories. This just war theory seeks to limit violence by protecting noncombatants. Just war theory is a strategy of last resort, deemed necessary as the lesser of two evils in a fallen world."]}, {"sub_zh": "质疑二的神圣回应：和平之道在现实中能行得通吗？", "sub_en": "Objection 2: Can Christians Live in the Way of Peace?", "zh_paras": ["有些人嘲弄：和平教会的立场难道不是不切实际的空想吗？和平之道在枪口下真的管用吗？", "门诺弟兄会由衷感恩在移居国所享受的自由与庇护；然而，真正的非抵抗信仰，坚信我们的安全保障来自全能的上帝，绝非来自冰冷的枪炮！", "正如当年面对烈火窑炉时断然拒绝跪拜巴比伦帝国金像的但以理三位好友所掷地有声宣告的：“我们所事奉的神能将我们从烈火的窑中救出来……即或不然，王啊，你当知道我们决不事奉你的神，也不拜你所立的金像！”（但以理书 3:17-18）。", "对门诺弟兄会而言，对上帝的圣洁忠诚，永远高于苟全性命的世俗自由；顺服上帝的旨意，远比肉体生命本身更为崇高！因此，我们的伦理抉择从来不取决于世俗的所谓“实用功利效果”；我们之所以躬行和平，绝不是因为这样做能确保我们飞黄腾达、名利双收。", "然而，在人类历史上，以爱化解仇恨所结出的奇妙果实数不胜数。让我们见证两个震撼人心的真实历史典范：", "典范一：美国独立战争时期的彼得·米勒", "在美国独立战争期间，宾夕法尼亚州一位亲英效忠派分子迈克尔·威特曼（Michael Wittman），曾公然当众将浓痰唾沫啐在门诺教会德高望重的领袖彼得·米勒（Peter Miller）脸上。米勒默默擦干面庞，未发一言，绝不还手报复。数日之后，威特曼因叛国罪被乔治·华盛顿将军的大军抓获并被判处绞刑。米勒获悉消息后，不顾年迈体衰，徒步在严寒中跋涉整整70英里赶赴福吉谷军营，跪倒在华盛顿将军面前恳求赦免死囚威特曼的性命。华盛顿将军大为震惊，问道：“这个威特曼究竟为你做过什么大恩大德，竟值得你甘愿徒步70英里来挽救你朋友的性命？”米勒平静答道：“朋友？报告将军，他是普天之下视我为眼中钉、恨我入骨的至死死敌！”华盛顿将军被这浩瀚的基督之爱深深震撼，热泪盈眶地说道：“既然如此，我谨以总司令的名义签署特赦令——条件是将威特曼全权交由你亲自照料！”米勒与威特曼并肩踏上归途，死敌从此化为了生死挚友！", "典范二：刚果内战中的萨法里·穆塔贝沙", "在刚果残酷的现代内战中，年幼的萨法里·穆塔贝沙（Safari Mutabesha）亲眼目睹残暴的反叛军武装分子破门而入，当着全家人的面极其残忍地残杀了他的牧师父亲。在辗转流亡卢旺达与布隆迪后，萨法里在马拉维的难民营中参与服事，加入了一个践行和平、认罪与舍己之爱的青年门诺小组。", "一天，当年那位亲手枪杀他父亲的叛军指挥官竟然也流落到了这个难民营！周围所有认出凶手的人因惊恐万分四散奔逃，唯独年轻的萨法里浑身战兢地独自一人穿过空地，缓缓走向这位双手沾满鲜血的刽子手。", "萨法里伸出颤抖的双手，泪流满面却深情地说道：“我的弟兄，你好吗？你还记得我吗？我就是当年被你亲手枪杀的那位牧师的亲生儿子……然而，我的弟兄，上帝创造的你是美好的；杀人的不是真正的你，而是潜藏在你里面那个魔鬼的罪性！请来我家住吧，现在正是你领受基督赦免与救恩的神圣时刻！”", "这位杀人不眨眼的叛军头目当场扑通跪倒在泥地上失声痛哭！他接受了萨法里的真诚邀请，在萨法里家中同住同吃整整三年之久，生命彻底被基督更新翻转。今天，这位曾经的双手沾满血腥的凶犯，已经成长为国际门诺弟兄会的一位全职牧师，向全非洲放胆见证这和解的和平福音！萨法里感慨万千地作证：“正是借着这样的活见证，和平的信息才真正深深扎下了根！世人亲眼看到这福音是有血有肉、带着牙齿的大能真理！全能的上帝正在使用我们，教会正在不断扩张，成千上万的失丧灵魂正在回转归信耶稣基督！”"], "en_paras": ["Some may object: Isn’t the Peace Church’s interpretation of Jesus’ words impractical? Does the way of peace work? Mennonite Brethren have always been grateful for the freedoms we’ve received in the nations where we have lived as pilgrims and strangers (1 Peter 2:11). True nonresistance, however, depends on God, not guns, for protection. In the spirit of the three Hebrew youths who refused to worship the image of the empire in Daniel 3, we confess that “the God we serve is able to deliver us,… but even if he does not,…we will not serve your gods or worship the image.” Faithfulness is a higher value than freedom. Obedience to God ranks higher than human life itself. So, our ethics are not determined by how well they work. We do not practice peacemaking because it makes us successful. On the other hand, reports abound of how peacemaking produces good results. Consider these two stories—one from the American Revolutionary War and a second from the recent internal conflict in Congo.", "Michael Wittman, a British loyalist from Pennsylvania, spat in the face of Mennonite church leader Peter Miller. Miller refused to retaliate. A few days later, Miller received word that Wittman had been sentenced to be hanged for treason by General Washington. Miller walked to Valley Forge to beg for Wittman’s life. Washington asked Miller what Wittman had done for him that would impel him to walk 70 miles to save his friend’s life. “Friend? He counts himself my bitterest enemy,” Miller replied. “In that case,” Washington said, “I issue a pardon on the condition that Wittman is charged to your care.” Miller and Wittman returned home, no longer as enemies but as friends. Safari Mutabesha witnessed the violent murder of his father when terrorists invaded their home in Congo. After fleeing to Rwanda and Burundi, Safari was ministering in a refugee camp in Malawi, part of a self-designated “Menno Group” that practiced peace, repentance and love. One day a rebel military commander appeared, and everyone but Safari fled. Trembling, Safari approached the man. “My brother, how are you?” Safari said. “Do you remember me? I’m the son of the pastor you killed. But, my brother, you are good. It’s not you that killed, it’s the thing inside you that is bad. Come to my house. It’s your time to receive Christ.”", "The rebel accepted, lived with Safari for three years and is now a Mennonite Brethren pastor, giving testimony to the gospel of peace. Safari says, “Because of this testimony the message of peace is now grounded. People see it has teeth. God is using us, the church is continuing, and people are accepting Jesus Christ.”"]}, {"sub_zh": "质疑三的神圣回应：以暴力保护无辜邻舍是爱的体现吗？", "sub_en": "Objection 3: Does love for the unprotected neighbor permit the use of violent force?", "zh_paras": ["在2013年全美神学研讨大会上，许多教牧同工最深沉的心理关切，正是当无辜弱小遭受残暴袭击时该如何应对。部分信徒认为，为了保护至亲舍己，有时可能不得不动用致命武力制止行凶；而另一批重洗派信徒则切切呼召全教会坚信上帝必有其超然手段约束邪恶、看顾无辜，信徒当甘心效法受苦基督的心志，甚至准备好与无辜受害者一同受难。", "二战时期一位老牧师的真实对话，生动揭示了这种处境的深邃厚度：", "当时，美国联邦调查局特工深入调查一位刚从苏联大屠杀逃难至美的门诺弟兄会老牧师。当被逼问其对美国的效忠忠诚度时，老牧师深情答道：“我深爱这片土地。它赐予了我们前所未有的信仰自由。为了这片土地上的人民，我随时甘愿舍弃自己的性命！”", "特工紧追不舍地设下道德陷阱：“那么，倘若暴徒冲进你家，企图当着你的面屠杀你的全家、凌辱你的妻子和女儿，你难道还会坚持所谓‘非抵抗’而不拔枪开火吗？！”", "老牧师饱经风霜的目光穿透特工的灵魂，平静答道：“在那个恐怖的瞬间我究竟会如何做，我无法在此时凭血气空夸海口……但是，尊敬的长官，您是否愿意静下心来，听我向您详细述说——上一次那场一模一样的惨剧真实发生在我身上时，我究竟是如何走过来的？！”", "特工顿时目瞪口呆、哑口无言，默默收起卷宗，满怀敬畏地离开了老牧师的家。"], "en_paras": ["One of the primary concerns voiced at the 2013 Study Conference on contemporary peacemaking was concern for unprotected neighbors under violent threat. The position expressed defended the use of violence in personal situations threatening family members and, by extension, to just military action to defend powerless nations. For some Christians, the willingness to give one’s life to protect another suggests that they may need to take life to defend another. Others call us to trust God to provide a means to restrain evil and to protect the innocent and to suffer with innocent victims of violence. One anecdote indicates the difficulty of such dire circumstances. During World War 2, federal agents investigated the convictions of a Mennonite Brethren pastor immigrant from the Russian terrors of the 1920s. When questioned about his loyalty, the pastor replied, “I love this country. It has given us freedom. I would gladly give my life for America.”", "The agent persisted. “What would you do if violent people would threaten to kill your family and rape your wife and daughters?” The pastor’s reply sent the speechless agent on his way. “I don’t know what I would do in that circumstance,” the pastor said. “Would you like me to tell what I did the last time that happened?”"]}, {"sub_zh": "教会与国家政权 (Church and State)", "sub_en": "Church and State", "zh_paras": ["与和平神学紧密相连的，是基督徒如何看待国家政权。新修订的《信仰宣言》第十三条庄严宣告：“因为耶稣基督是唯一的至高之主，祂的神圣榜样与天国诫命，绝对凌驾于世俗狭隘的民族主义与一切人类世俗政权的强制命令之上！”", "虽然门诺弟兄会万分感恩历代世俗政府在法律层面上赐予我们信仰自由与良心豁免，但在《信仰宣言》第十二条中，我们宣告：我们最首要的公民身份与至死效忠，唯独属于基督永恒的国度，而绝非属于任何地上的世俗国家或社会建制！", "我们承认世俗政府在普遍启示中是上帝维护人类社会基本秩序的神圣设立（罗马书 13:1-5）；在政府促进社会福祉、维护公平法治的范围内，它是在履行神所赋予的职责。然而，一旦世俗政权的命令与上帝的圣洁诫命发生根本冲突时，基督徒义不容辞的圣经责任就是：“顺从神，不顺从人，是应当的！”（使徒行传 5:29）。", "在传统上，重洗派对世俗政权抱持着清醒的“分别态度”（Separationist Attitude）。这深深植根于1527年《施莱特海姆宣言》所确立的“两重国度秩序”——“一重在基督的完全之内，另一重则在基督的完全之外”。传统观点认为，世俗政府是为这个未蒙救赎的堕落世界而设立的，国家政权必然以强制力、刀剑和暴力来维持恶性平衡，基督徒绝不能介入这种暴力机器的运作。", "然而，在当代多元民主社会中，门诺弟兄会日益以更积极的方式参与到各级社区与社会正义的服事之中。《信仰宣言》第十二条明确叮咛我们：“基督徒应当在社会中与众人携手同工，捍卫弱小者的权益、关顾赤贫之人、促进公义、正直与真理……并放胆在世人面前见证抵制一切贪污腐败、歧视与不公！”", "上帝对我们的呼召，绝不仅限于消极地作一名良心拒服兵役者，而是拥有更宏大的先知性见证胸怀：", "在种族张力日益加剧的社会中，我们受召放胆抵制种族歧视、性别歧视与阶级压迫；", "在门诺弟兄会宗派内部，我们热烈拥抱日益蓬勃增长的新移民族裔教会，主动打破传统单一特权，与各族裔弟兄姊妹平等分享领导职分与属灵资源；", "牢记我们在世上不过是客旅与寄居的属灵“异乡人”，以基督敞开的怀抱热情接待一切移民与寄居的弱势群体（申命记 24:17-18；马太福音 25:31-46；希伯来书 13:1-2）；", "深刻省察并坚决抵制那种将“本国世俗经济优渥特权”凌驾于全球其他地区赤贫人口生死之上的拜偶像贪婪诱惑！", "最后，门诺弟兄会深信圣经所教导的个人内在诚实与“拒绝起誓”之间有着不可分割的神圣纽带。几个世纪以来，门诺信徒在世俗商界与社会上赢得了“说真话的百姓”的崇高美誉。我们字面遵行主耶稣与雅各使徒关于严禁起誓的圣训（马太福音 5:33-37；雅各书 5:12）——坚决拒绝在世俗公堂或社团中对天发誓！因为我们确信：无论是否在誓言之下，基督徒在任何时刻、任何处境中，口中的言语都必须绝对诚实无伪，是就说是，不是就说不是；以此向全宇宙见证我们对上帝天国的绝对赤诚与忠贞！"], "en_paras": ["Closely related to the question of peacemaking is the issue of the Christian’s relationship to the state. The revised Article 13 concludes with the statement that “Because Jesus is Lord, His example and teaching take priority over nationalism and the demands of human authorities.” While Mennonite Brethren have been grateful to God for governments that have allowed them freedom of conscience in Article 12 of the Confession of Faith, we confess that our primary citizenship and allegiance belong to Christ’s Kingdom, not the state or society. We see the government as part of God’s plan to give order to society. God has instituted government structures (“principalities and powers” of Ephesians 6:12; Romans 13:1-5) to reward good and restrict evil. To the extent that government promotes well-being and maintains law and order, it is acting within its God-given mandate. When governmental demands contradict God’s will, our responsibility as Christians is to “obey God rather than human beings” (Acts 5:29). Traditionally, Mennonites have held a separationist attitude toward government. This attitude grows out of the notion, expressed in the Schleitheim Confession of 1527, of two orders, “one inside the perfection of Christ and the other outside the perfection of Christ.” According to separationists, government exists for the world. The state uses coercion and violence to keep evil in check. Christians cannot be involved in such actions. Increasingly, however, Mennonite Brethren have become active in local, state and national governments. Article 12 of our Confession of Faith reminds us that as Christians we are to “cooperate with others in society to defend the weak, care for the poor and promote justice, righteousness and truth.... [And to] witness against corruption, discrimination and injustice.” We have already addressed the call to be conscientious objectors to military service. What other issues demand a faithful witness? God calls us to have a broader vision for our corporate witness. In an increasingly diverse society, we are challenged to witness against racism, sexism and classism. We are called to share power within denominational structures with other ethnic groups, whose membership is growing among Mennonite Brethren. We are challenged to respond compassionately to immigrant brothers and sisters, keeping in mind that as spiritual “foreigners” in this world, we are to show hospitality to strangers (Deuteronomy 24:17-18; Matthew 25:31-46; Hebrews 13:1-2). We are challenged to recognize and resist the idolatrous temptation to put our own economic security ahead of those experiencing overwhelming poverty in other parts of the world. We believe the Bible teaches that there is a close relationship between social relationships and the issue of integrity and the oath. Mennonites have enjoyed a reputation as people who speak the truth. Mennonites take literally the prohibition against swearing of oaths (Matthew 5:33-37; James 5:12). Refusing to take an oath is a witness to our commitment to speak the truth at all times, whether we are under oath or not and to our primary allegiance to the kingdom of God."]}]}, {"num": 9, "id": "chap-07", "badge_label": "CHAPTER 9", "title_zh": "第七章：门徒即宣教士", "title_en": "Chapter 7: Disciples are Missionaries", "desc": "成为门徒：归信、悔改与终生救恩 (Becoming a Disciple)；全球宣教的悲壮与荣耀历程 (Global Mission)；本土化浪潮、伙伴关系与 Multiply 的诞生 (Transformation & Indigenization)。", "blocks": [{"sub_zh": "第 7 章：门徒即宣教士 (Disciples Are Missionaries)", "sub_en": "CHAPTER 7", "zh_paras": ["她毅然站立了起来。", "那是2003年在美国科罗拉多州埃斯特斯公园（Estes Park）举行的全国青少年大会，现场聚集了1,420名热血青年。当讲台发出呼召，邀请青年人全人委身于一生背起十字架跟从耶稣时，年轻的乔安娜·查帕（Joanna Chapa）从人群中毅然起立响应。“在聚会的某一刻，讲员深情呼召：凡甘愿为耶稣活出激进圣洁的一生、不论代价几何立志背起自己的十字架跟从救主的人，请从座位上站立起来，”乔安娜回忆道，“在那神圣的瞬间，我内心深处清楚地知道——这正是我一生所渴求的方向！当时我其实并不完全清楚这究竟意味着什么，更不知道前路漫漫主会带领我走向何方。”", "正如乔安娜的见证所昭示的：跟从耶稣，意味着在日常岁月中一步一个脚印地忠心向前。当时乔安娜是德克萨斯州拉格鲁利亚恩典点教会（GracePoint Church in La Grulla）的敬拜主领。她回忆说，当现场一千多名青年人在埃斯特斯公园同声高唱敬拜上帝时，一股神圣的敬畏震颤掠过她的全身。“在绝大多数聚会中，我坐在那里，心中深深向主祷告，梦想着有朝一日自己能亲自参与主领全国青年大会的敬拜，或参与筹备这样的属灵盛宴，”她说，“殊不知，那正是圣灵亲自在我心灵深处栽种下的先知性异象与属天呼召！”", "随后，乔安娜与其敬拜团队受邀主领了一场早间崇拜，并在大会闭幕聚会上作了感人至深的结束祷告。“我清楚记得自己站在浩大的讲台上，放眼望向台下成百上千张年轻的面庞，内心深切感到上帝将继续引领我进入更多如此被主使用、令人敬畏降卑的侍奉禾场。”乔安娜随后受邀担任了接续三届全国大会的筹备核心成员；2007年在阿纳海姆大会上，她再次主领全场敬拜。她说，世上没有任何一种满足与荣耀，能超越上帝亲手赐下异象并亲手将之荣耀成全！", "乔安娜一往无前地跟从上帝的呼召。从门诺弟兄会著名的塔伯尔学院（Tabor College）毕业后，她全职加入了全球宣教差会 Multiply，担任地区宣教动员主任，并毅然立下终生海外宣教誓约，作为 Multiply 的长期宣教士远赴南美洲秘鲁服事。如今，她与 Multiply 秘鲁团队的同工们紧密配搭，深入秘鲁当地门诺弟兄会教区各堂会，在门徒训练战略制定、青年领袖全方位装备培植等关键事工上全力扶持。“我最深沉的愿景，就是竭力装备并造就当地教会领袖，使他们真正成为能够‘倍增造就门徒’的忠心门徒；带领他们的堂会与家庭与造物主建立更为深邃的亲密关系，无论救主呼召他们往何处去，都在那里活出大能的宣教使命！”", "乔安娜的生命历程，生动见证了门诺弟兄会历代坚守的信念：跟从耶稣，不仅意味着从上帝白白领受永生救恩，更意味着必须毫不保留地将上帝的浩瀚大爱与世人分享！神家里的每一位成员，都有神圣职责热情邀请世人融入上帝永恒的信仰大家庭。", "主耶稣颁布的至高训令——“所以，你们要去，使万民作我的门徒”（马太福音 28:19-20）——正是门诺弟兄会思考救恩神学的终极出发点。耶稣降世，亲自揭开了上帝天国统治的历史序幕，向普世宣告：“日期满了，神的国近了！你们当悔改，信福音！”（马可福音 1:15）。随后，祂直接向具体的个人发出呼召：“来跟从我！”（马可福音 1:17）。", "门诺弟兄会深信：跟从耶稣的神圣呼召，始终始于个人生命的悔改归正。而生命重生的终极宏大语境，正是上帝的“天国”与“主权统治”。在福音书的众多比喻中，耶稣清晰阐明：天国正是由那群甘心顺服上帝圣洁旨意的蒙救赎共同体所构成的。而上帝的旨意，向来具有逆世俗潮流的先知性特质，是对既有堕落社会秩序的一场彻底的神圣决裂！"], "en_paras": ["She stood. One of 1,420 youth attending the 2003 National Youth Convention in Estes Park, Colorado, Joanna Chapa stood in response to an invitation to choose a life of following Jesus. “There was a session that we were invited to stand from our chairs if we were willing to live radical lives for Jesus and pick up our crosses to follow him, no matter what the cost,” she says. “I remember in that moment I knew I wanted to be about this. I didn’t really know what that meant, much less what was ahead and what he would invite me to.” As Joanna testifies, following Jesus is about being faithful, one step at a time. Joanna was a worship leader at GracePoint Church in La Grulla, Texas, at the time. She says chills came over her as more than 1,000 people sang at Estes. “I sat there most sessions and dreamt of the day that I could help lead worship and/or help plan a National Youth Convention,” she says. “Little did I know, that was actually the Spirit of God placing in me a prophetic calling or dream into what he was going to invite me into.” Joanna and her church worship team were asked to lead a morning worship service, and she closed the last session in prayer. “I remember standing on that stage, looking out to everyone there and sensing within me that God was going to keep inviting me to more opportunities like this in which I would be humbled and in awe of what he does,” she says. Joanna served on the planning team for the next three conventions, also joining the worship team at Anaheim in 2007, where she says she realized nothing is more satisfying and fulfilling than when God gives and fulfills dreams. Joanna has continued to follow God’s call. After graduating from Tabor College, she worked with Multiply as a regional mobilizer and has committed to serve as a long-term missionary with Multiply in Peru. She and other members of Multiply’s Peru team are coming alongside the Peruvian MB conference churches in discipleship strategies and the training and equipping of young leaders in a variety of ways. “My desire is to help train and equip the local church leaders to be disciples that make disciples, that call their churches and families to a deeper intimacy with their Creator and to be missional wherever the Lord invites them.”", "Joanna has experienced what Mennonite Brethren believe: to follow Jesus means not only receiving salvation from God but also sharing God’s love with others. Members of the family invite others to become part of God’s household of faith. Jesus’ command, “Go and make disciples of all nations” (Matthew 28:19-20), is the starting point for Mennonite Brethren thinking on salvation. Jesus inaugurated the reign of God, saying, “The kingdom of God has come near. Repent and believe the good news!” (Mark 1:15). Then he directed the call to specific individuals. “Come,” he said, “follow me” (Mark 1:17). Mennonite Brethren believe that the call to follow Jesus begins with a call to personal conversion. The context for conversion is “the kingdom” or “reign” of God. In his parables, Jesus interprets the kingdom as the community of those who do God’s will. The will of God is countercultural, a radical departure from the established order."]}, {"sub_zh": "成为门徒：归信、悔改与终生救恩 (Becoming a Disciple)", "sub_en": "Becoming a Disciple", "zh_paras": ["主耶稣呼召人的第一个命令动词，正是“悔改”（Repent）。悔改不仅是一种内心情感的自责，更是思想范式的彻底重置与崭新行动的实际开启。对于古代以色列人而言，耶稣宣告神国统治，意味着上帝正在跨越任何狭隘的血统与国族界限，呼召出一个由万民汇聚而成的崭新圣约子民；而对今天的我们而言，悔改意味着我们的生命目的发生了翻天覆地的彻底转变：我们从昔日以自我为中心的自私沉沦中彻底回转，走向全心全意爱神爱人、舍己服事他人的奉献人生！“回转”（Turn）这一词汇，深刻彰显了悔改主题那极富行动力的一面。", "门诺弟兄会历来使用“归信 / 重生”（Conversion）这一词汇，来精确描绘一个人从罪恶中彻底抽身、全人转向永活上帝的神圣历程。当年爱德华·维斯特在俄国点燃的伟大灵性复兴（为后来门诺弟兄会的建立铺平了道路），最核心的呼喊正是生命的真实归信。在维斯特看来，归信是对在基督耶稣里享有确实、亲密的个人救恩体验的神圣邀请，这与当时俄国老教会中沦为形式主义的“死记硬背式信仰”形成了天壤之别！真实归信彻底将罪人从负罪感的枷锁中释放出来，赐予人与神和好的深沉属天平安，并带来坚不可摧的得救确据。", "在历史上，对于那些已然在头脑中熟知福音教义、却迫切需要将真道在个人生命中融会贯通的成年人而言，强调经历一次明确的个人归信时刻具有极高的属灵纯全度：内心经历深切的罪恶挣扎与撕裂，随后靠着信心经历奇妙的属灵突破与全新委身，这完全切合他们的历史语境。归信是广阔宏大救恩历程中的关键里程碑：凡真心归信基督的人，必在每日生活中结出生命被翻转的悔改果子，随后接受全身浸礼，正式被接纳加入地方堂会。", "在门诺弟兄会敬虔家庭中长大的年轻一代的见证中，许多孩子往往在家庭餐桌旁、礼拜堂讲台前或暑期青少年营会中的某一关键时刻，“敞开心门接纳耶稣进驻心怀”；而另一些人则在成年之后经历信仰飞跃。有些人经历惊心动魄的圣灵强烈责罪与瞬间荣耀翻转；而对另许多人而言，走向信仰与其说是一场突发的危机事件，不如说是一个春风化雨般水到渠成的漫长生命历程——这些人在漫长岁月中耳濡目染身边基督徒朋友忠贞圣洁的日常生活、深入观察信仰共同体的彼此相爱、一次又一次聆听神道真理的详尽阐释，最终在不知不觉中，早已全心将自己的一生忠诚归顺于主基督，而未必能精准指出某年某月某日那场惊心动魄的所谓“危机时刻”。", "在今天，由传统奋兴布道会所刻意营造的某种戏剧化“危机归信”模式已不再被绝对化推崇；然而，门诺弟兄会始终毫不妥协地坚称：活泼、亲密且真实可感的个人鲜活信心，永远是检验真归信的不可磨灭的标志！我们谨遵圣经启示，庄严宣告我们在加入这个信仰大家庭时真正经历了“圣灵重生”，被永恒上帝正式领养为祂宝贵的儿女！", "由此，让我们梳理清晰这一系列的救恩范畴：", "“归信”（Conversion）：是一个人转变为基督跟从者的神圣生命体验与历程；", "“悔改”（Repentance）：是从一切罪恶彻底转向圣洁上帝的坚决决志，伴随着甘心顺服神国统治的全新思想心智；", "“救恩”（Salvation）：是全能上帝白白赐予绝望罪人的浩瀚恩典作为。救恩完美涵盖了归信、悔改、信心、受洗归主以及融入教会大家庭的全部维度。救恩包含了上帝在信徒最初归信时所成就的称义大功，包含了上帝借着内住圣灵在信徒一生岁月中持续进行、使我们越来越效法基督圣洁模样的成圣大工，更包含了在末世荣耀再临时、主亲自将我们接入永恒荣耀新天新地之中的终极圆满成全！", "门诺弟兄会尤其着重强调：上帝的伟大拯救，绝非将我们塑造成孤芳自赏的属灵游侠，而是直接将我们紧紧连接在神圣的信仰共同体之中！在身体彼此问责、彼此守望的团契中，我们的门徒生命方能茁壮成长；我们既在神家里的哺育中蒙受造就，更在投身舍己服事世人的过程中迈向成熟！"], "en_paras": ["Jesus’ first word of command is “repent.” Repentance involves a new way of thinking, new action. For Israel, Jesus’ announcement of the rule of God meant God was calling out a new people irrespective of nationality or ethnicity. For us, it means getting our minds around the idea that our purpose has changed. We turn from being centered on self to serving others. The word “turn” points to the action side of the repentance theme. Mennonite Brethren have used the word “conversion” to describe the turning from sin and turning to God. The earliest revival of Eduard Wuest in Russia, which paved the way for the founding of the MB church, emphasized the importance of conversion. Conversion was an invitation to a sure and personal experience of salvation in Jesus Christ, as opposed to simply a “memorized faith,” as had become the church tradition among Russian Mennonites. Conversion freed the seeker from guilt, granted peace with God and promised the assurance of salvation. The emphasis on a specific experience of conversion had great integrity when applied to adults who understood the theological principles of the gospel but needed to appropriate it to their own lives. A psychological struggle with guilt and the breakthrough to a new commitment fit their context. Conversion was an event in the larger experience of salvation. Those who converted to Christ gave evidence of a changed life, were baptized by immersion and were accepted into the membership of the congregation. Most testimonies of those raised in Mennonite Brethren homes tell of children who “accept Jesus into their heart” in a crisis moment at home, church or summer camp. Others accept Christ later in life. Some come to a moment of conviction and are gloriously transformed. For others, coming to faith is more of a process than a single event. These adults often witness the faithful life of a Christian acquaintance, explore the life of the faith community, hear repeated explanations of the gospel and find themselves confessing their own allegiance to Christ without being aware of a crisis of conversion. The emphasis on a crisis conversion experience, as fostered by revivalism, is not as strong today. Mennonite Brethren continue to insist on a personal, living faith as a mark of conversion. We use biblical language to say that we are “born again” as we join the family of faith. We are adopted as God’s children. So, in review: “conversion” is the experience or process by which a person becomes a follower of Christ. “Repentance” is turning from sin to God, an act accompanied by a new mindset that accepts God’s rule. “Salvation” is what God does in giving grace to a sinner. Salvation describes conversion, repentance, faith, baptism and inclusion in the church. Salvation is what God has done at conversion, what God continues to do in transforming us to be like Christ and what God will finish when he receives us into his presence as part of the new creation. Salvation includes the growth in Christ that comes as the Holy Spirit indwells the believer, producing the fruit of the new life. Mennonite Brethren emphasize that God’s saving act joins us to the community of faith. We grow in discipleship as we experience the accountability of the body. Our aim is to grow to be like Christ. We grow both as we are nurtured and as we serve others. (See chapter 5 for a more complete description of the way we encourage family members to grow as disciples.)"]}, {"sub_zh": "全球宣教的悲壮与荣耀历程 (Global Mission)", "sub_en": "Global Mission", "zh_paras": ["从诞生之日起，门诺弟兄会便深刻确信：忠贞的基督门徒，必须同时在世上充当“世上的盐”与“世上的光”（马太福音 5:13-14）。作门徒的忠信生命，必然在本地社区与普世地极的广阔见证中全然彰显！在大使命中，基督以至高权柄呼召我们要使万民作祂的门徒。", "正如已故门诺弟兄会杰出属灵领袖J.B.托伊斯（J.B. Toews）所精辟总结的：门诺弟兄会本质上正是一场以属灵复兴为源动力的普世宣教运动！自十九世纪九十年代起，门诺弟兄会便持续不断向全球各地差派了大批宣教士。", "在名著《信仰的朝圣之路》（A Pilgrimage of Faith）中，托伊斯深情讲述了北美门诺弟兄会首位海外宣教士彼得·韦德尔（Peter Wedel）感人至深的英雄悲歌：", "彼得·韦德尔原本是北美大草原上一位极富恩膏的杰出巡回布道家。在1884年南达科他州举行的全美总会年会上，韦德尔走上讲台，向全体大会代表倾心吐意，分享了他内心日夜燃烧、对海外远方未得之民灵魂的深沉重担。全会代表泪流满面地苦苦哀求韦德尔留在北美继续他卓有成效的拓荒布道，竭力劝阻他不要远赴非洲西部的喀麦隆——在那个时代，由于气候恶劣、致命的黑水热（恶性疟疾）肆虐，喀麦隆被世人惊恐地公认为“白人宣教士的坟场”！", "那天深夜，韦德尔独自一人在会场外的茫茫玉米地里通宵踱步，呼天抢地向神求问旨意。清晨，全身被冰冷朝露湿透的韦德尔步伐坚定地重返大会讲台，向全体会众发出了那句响彻教会历史的誓言：", "“顺服上帝的呼召，绝对凌驾于世间一切其他的良机之上！我别无选择，我必须去喀麦隆！”", "启程赴非后不到两年，年轻的韦德尔便染上致命的黑水热，在非洲丛林中英勇殉道、安息主怀！", "然而，韦德尔的壮烈殉道非但没有吓退后人，反而在整个门诺弟兄会青年群体中彻底引爆了一场席卷全宗派的海外宣教献身狂潮！无数热血青年沿着韦德尔的血迹奋勇前行，不仅奔赴非洲黑暗大陆，更义无反顾地远渡重洋深入印度与中国腹地！韦德尔当年的神圣顺服，成为了门诺弟兄会海外普世宣教事业永不磨灭的奠基石（托伊斯，97页）。", "从历史上看，门诺弟兄会之所以在全宗派体制层面上紧密组织起来，其最根本的驱动力正是为了确保以我们独特的门诺弟兄会纯正信仰特质去开展宣教。这一宣教神学深深植根于我们福音派重洗派的深厚沃土：", "纯全的福音布道动机：不遗余力地以言以行、放胆宣扬耶稣基督救赎的纯正福音；", "完全以教会为根基：宣教既从地方圣约共同体中孕育、辨识、差派、代祷与供给，其终极神圣目标同样是在异邦万民中建立起扎根圣经、忠贞作门徒的健康本土地方教会；", "以上帝的天国为导向的全人关怀事工：当负责救济二战俄国难民的“慈惠福利委员会”与“宣教差会”正式合并时，教会的组织架构完美契合了其神学内核——在门诺弟兄会历史上最大规模的宣教工场拓展中，福音反响最热烈、教会增长最迅猛的，始终是那些身处社会最底层、饱受苦难煎熬的赤贫人群！", "在二十世纪上半叶，北美门诺弟兄会积极向刚果、印度与中国差派了大批宣教士。而在第二次世界大战之后，随着教会逐步由讲德语转向英语，加之青年人在战时替代役中深入参与公共精神卫生等社会救助，促使全教会对本土社会的宣教需要有了空前清醒的认识，各大教区随即掀起了大规模的本土植堂浪潮。", "回顾北美门诺弟兄会的国际宣教拓荒史：1899年，首批由总会正式差派的宣教士N.N.海伯特（N.N. Hiebert）与苏茜（Susie Hiebert）夫妇远赴印度泰卢固语人群中服事，开创了宏大的印度宣教工场。早期国际宣教洋溢着一种深厚真挚的“属灵家庭亲情”：后方差派母会与前线宣教士亲如一家；主日学教师与敬虔父母日夜祷告求主呼召自己的儿女献身海外宣教；姊妹们自发组织妇女宣教团契，定期禁食祷告、给宣教士写信慰问、缝制棉被衣物寄往灾区并倾囊奉献；宣教士动辄在工场上忠心扎根数十年，舍弃世俗财富、牺牲健康甚至献出年轻生命。", "正是在如此泣血的奉献中，一间间充满生机的教会拔地而起！当年宣教士流泪撒种的印度与刚果民主共和国两大最早工场，今天门诺弟兄会的会友人数已分别激增至20万人与10万人以上，远远超越了北美母会的人数规模！二战之后，福音版图进一步辐射至巴拉圭、哥伦比亚、巴西、秘鲁、日本、墨西哥、埃塞俄比亚、德国、奥地利与巴拿马；到了二十世纪五十年代，北美门诺弟兄会常驻海外的宣教士总数高达279人！"], "en_paras": ["From the start, Mennonite Brethren have perceived faithful disciples to be both “salt” and “light” (Matthew 5:13-14). Faithful discipleship expresses itself in a life of witness, locally and globally. In the Great Commission, Jesus calls us to make disciples of all nations. According to the late Mennonite Brethren church leader J.B. Toews, the Mennonite Brethren church is a renewal missionary movement. Since the 1890s, Mennonite Brethren have sent missionaries around the world. In A Pilgrimage of Faith , Toews tells the story of the first North American Mennonite Brethren missionary. Peter Wedel was an effective itinerant evangelist in North America. At the 1884 General Conference in South Dakota, Wedel shared with the delegates his growing burden for unreached people in other lands. The conference pleaded with Wedel to continue his evangelistic ministry rather than go to Cameroon, a country known as a westerner’s graveyard because of its treacherous climate and raging black fever.", "Wedel spent the night walking the cornfields and seeking an answer from God. Wet with the morning dew, he announced to the convention, “Obedience supersedes all other opportunities. I cannot but go to Cameroon.” Just short of two years from his departure, Wedel was dead, a victim of black fever. His death sparked a dramatic movement. Others followed, going not only to Africa, but to India and China as well. Wedel’s act of obedience became a cornerstone of Mennonite Brethren foreign missions (Toews, 97). Historically, Mennonite Brethren organized in a denominational or institutional sense out of the desire for Mennonite Brethren convictions to characterize the way we do mission. These convictions reflect the MB church’s evangelical Anabaptist roots. First, Mennonite Brethren mission is inspired by an evangelistic motivation—to proclaim, in word and deed, the good news of Jesus Christ. Second, the effort is church based, both in its sending and in its goal. The covenant community discerns, calls out, sends, supports and receives missionaries. The purpose is to plant Bible-believing churches. Third, mission is kingdom-oriented, centered on holistic ministry to the poor. When the Board of General Welfare (charged with assisting Mennonite Brethren refugees from Russia) combined with the Board of Missions, organization was following theology. In our largest mission efforts, the most receptive response has come from the poorest segment of society.", "At first, it was easier for Mennonite Brethren to evangelize in other cultures than among closer neighbors. Mennonites migrated to Russia with an explicit agreement not to proselytize Russian Orthodox Church members. Mennonite Brethren in Russia sent their first missionaries to India, but they also began to evangelize closer neighbors. In the first half of the twentieth century in North America, Mennonite Brethren did evangelistic work among German- and Russian-speaking neighbors. Apart from a mission to the Comanche people in Oklahoma and several city mission projects in the United States and Canada, Mennonite Brethren did little witnessing among English-speaking neighbors. They were much more purposeful in sending missionaries to other countries, principally DR Congo, India and China. Since World War 2, Mennonite Brethren have been much more active in domestic church planting. During and after the war, congregations moved away from using the German language to avoid identification with the Nazi regime. Many engaged in North American life during the war through their alternative service activities which helped them become aware of social needs, especially in public mental health. Today, both national and district conferences have active programs for launching new churches. The international mission program of North American Mennonite Brethren began in 1898. Peter Wedel, accompanied by his wife, Martha, and Henry and Maria Enns had paved the way with their mission work with the Baptists in Cameroon. The first Mennonite Brethren conference-appointed missionaries, N.N. and Susie Hiebert, left to serve among the Telugu-speaking people of India in 1899. Although forced to return because of ill health, N.N. Hiebert became a leader of Mennonite Brethren mission efforts. Early international mission has been characterized as having a “family spirit.” Sending churches knew their missionaries personally. Congregations were well informed about missionary activities and organized church life to promote missions. Sunday school teachers and parents prayed that their children would be called into ministry. Women formed missionary societies to pray, correspond with missionaries, gather supplies for the poor and raise funds. The church called out its most gifted leaders to administer the mission efforts. Missionaries served extended terms of service, sacrificing family, wealth, health and even life itself. As a result, churches were established. India and DR Congo, the earliest mission fields with the largest missionary staffs, now number more than 200,000 and 100,000 Mennonite Brethren church members, respectively. After World War 2, mission outreach proliferated, with new fields opening in Paraguay and Colombia, then Brazil, Peru, Japan, Mexico, Ethiopia, Germany, Austria and Panama. By the 1950s, North American missionaries totaled 279."]}, {"sub_zh": "本土化浪潮、伙伴关系与 Multiply 的诞生 (Transformation & Indigenization)", "sub_en": "Transformation & Indigenization", "zh_paras": ["二十世纪中叶，全球政治风云变幻，反殖民独立运动席卷亚非拉大地。在杰出宣教总干事J.B.托伊斯等领袖的高瞻远瞩引领下，门诺弟兄会宣教政策果断迎来了具有划时代意义的“本土化”（Indigenization）深刻转型：原本由西方宣教士一手包办主导的宣教工场，以惊人的魄力全权交接托付给当地本土教会领袖自主治理！", "在那场深刻的历史反思中，北美教会彻底摒弃了居高临下的属灵家长制心态，不再将海外新兴教会视作需要庇护的“婴孩”，而是深情接纳其为在基督里完全平等的“弟兄与姊妹”！原本不对等的宗派管辖关系，升华演变成一种成熟、相互尊重的跨国属灵伙伴关系（Partnership）。", "随着宣教异象的不断深化，总会宣教机构的名称经历了历史性的演变：从早期的“海外宣教与服务部”（BOMAS），更名为“国际门诺弟兄会宣教与服务差会”（MBMSI）；2011年至2018年更名为“MB Mission”；2018年1月，MB Mission 正式与加拿大专注于本土植堂的 C2C Network 大能合并，并于2019年以崭新的全方位全球宣教差会品牌——Multiply（倍增宣教差会）全新启航！", "今天，在各大洲已成熟建立的门诺弟兄会全国总会，完全独立自主确立本地宣教战略，并按需邀请北美同工以伙伴身份协同作战。据 Multiply 官方统计：在遍布全球的宣教网络中，差会与近百位全球宣教士及近百位各国本土领袖紧密携手，仅一年内便在68个国家见证了近400间崭新堂会的拓植建立，数千人受洗归主，数百位青年领袖接受了高阶门徒与宣教装备！"], "en_paras": ["The middle decades of the 20th century brought turmoil to missions. Revolutions swept out colonial governments. Beginning with the leadership of board director J.B. Toews, indigenization characterized Mennonite Brethren mission policy. Missionary-led fields were turned over to indigenous leaders. At that time, “with the growing international rejection of all colonial imperialism, there [had] also arisen a principal rejection of the missionary-centered gospel ministry.” Under this emerging attitude, North Americans no longer saw themselves as caring for infants and children but sharing with sisters and brothers. The family relationship matured into a policy of partnership. The name of the denominational mission agency changed from the original Board of Missions and Services (BOMAS) to Mennonite Brethren Missions and Services International (MBMSI), and from 2011 to 2018 was called MB Mission. In January 2018, MB Mission merged with C2C Network, a church planting agency that began as a British Colombia provincial ministry. The new ministry was launched in 2019 as Multiply. Today, where national conferences are established, they determine direction and invite North American partnership as needed. In 2020, Multiply reported that the mission agency saw 377 churches planted and 5,560 people baptized in 68 nations as reported by 89 global workers and 91 national leaders. Multiply also saw 463 people participate in mission and discipleship training, 12 global partnership video calls with an average of 58 participants and 279 churches involved in global missions through Multiply."]}, {"sub_zh": "当代宣教的前沿实践与战略反思 (Contemporary Mission Work)", "sub_en": "Contemporary Mission Work", "zh_paras": ["Multiply 在中美洲巴拿马的事工，完美诠释了当代门诺弟兄会宣教的多边伙伴协作本质：早在二十世纪五十年代，宣教士便在哥伦比亚和巴拿马建立了教会；自二十一世纪初以来，哥伦比亚门诺弟兄会自身成熟后，主动差派自己的宣教士前往巴拿马，深入当地边缘落后的沃纳安原住民族群（Wounaán）中开展门徒培训、领袖装备与社区综合发展。近年来，巴拿马本土信徒更是反向与哥伦比亚同工携手，深入哥伦比亚偏远的乔科雨林地区，向那里尚未得闻福音的沃纳安原住民部落同胞联合开展跨国宣教与植堂！这种波澜壮阔的图景生动印证了当今全球宣教的新格局：“宣教已彻底打破单向流动，转变为从全地走向全地（From Everywhere to Everywhere）！”", "在当今国际宣教战略中，最重要的焦点聚集在被称为“10/40 之窗”的核心地带（即赤道以北纬度10度至40度之间的亚非欧广大腹地）。这片广袤区域居住着超过40亿人类，占全球人口半数以上，其中90%的人口处于福音未得状态，更有约16亿人此生从未听闻过一次耶稣基督的圣名！在这片区域涵盖的56个国家中，Multiply 已在其中13个国家派驻了长期宣教团队与本土福音工匠。", "另一项极具代表性的创举是“2000团队”（Team 2000）：三对年轻夫妇及其子女立下长达十年的圣约委身，深入泰国都市未得之民中拓荒植堂，不仅在全泰建立了众多充满活力的堂会，更将福音火种大举拓殖至邻近的缅甸、老挝与柬埔寨！", "在跨入二十一世纪的今天，门诺弟兄会的宣教战略正面临三大时代性的深刻考量：", "全球化将未得之民送到了我们的家门口：今天在北美本土，已蓬勃涌现出阿拉伯语、华语、埃塞俄比亚语、克木语、旁遮普语、斯拉夫语等数十个不同族裔背景的门诺弟兄会堂会！日本门诺弟兄会甚至反向向美国加州差派宣教士建立教会！宣教的资源不再单单局限于北美内部，Multiply 宣教工场的前沿同样不再仅仅局限在海外远方。宣教绝非“本地与海外”的二选一，而是“既在本地、又在万邦”的兼备战略！", "本土化与多元伙伴协作机制：如何在全力激发地方堂会本地福音外展主动性的同时，继续坚固大区与全美大家庭联合开展普世宣教的凝聚力，是摆在当代教牧领袖面前的现实课题。", "短期宣教与长期深耕的忠心管家职分：在现代交通通讯极其飞速的时代，短期访宣人数已大幅超越长期常驻宣教士。短宣固然为激发信徒宣教热忱、亲身体验普世宣教前沿提供了极佳视窗；然而，真正扎实有深度的福音外展，必须以长期建立深厚信任关系、熟练掌握当地语言文化、以及甘心长年扎根为代价。全教会必须以清醒的属灵智慧履行财务与时间管家职分，警惕避免因盲目追求热闹昂贵的短宣而挤占了前线最需要长久深耕的战略宣教资金，确保一切宣教举措真正服事于普世教会的长期健康与生命倍增！", "今天的门诺弟兄会已然成长为一个遍布全地五大洲的普世信仰宗族。我们心怀同一个荣耀异象：耶稣正以至高权柄在普世各国各方各民中呼召失丧灵魂认罪悔改归信基督，融入彼此守望的圣洁门徒共同体，向这世界穷乏绝望的人群放胆倾注天国的和平福音！"], "en_paras": ["Multiply’s involvement in Panama illustrates the cooperative nature of contemporary Mennonite Brethren missionary work. The MB Board of Missions and Services began churches in Colombia in the 1940s and in Panama in the late 1950s. Since the early 2000s, Colombian Mennonite Brethren missionaries have been serving among the Wounaán people of Panama in discipleship, leadership training, children’s outreach and community development. For many years, Einer and Girlesa Zuluaga of Colombia were the only Mennonite Brethren missionaries in Panama. They have now been joined by a North American worker. Recently, the Panamanians have begun partnering with the Colombians in the remote Chocó region of Colombia to evangelize, disciple and plant churches among the unreached Wounaán people of that region of Colombia. Increasingly, MB mission efforts are “from everywhere to everywhere.” The growing focus for international mission work has been the “10/40 window,” between 10 degrees latitude north and 40 degrees latitude north of the equator, currently home to more than four billion people; 90 percent are unevangelized. Some 1.6 billion of them have not heard the message of Jesus even once. Of the 56 countries in this region, Multiply is at work in 13, through both long-term missionaries and national workers. Another Multiply initiative is Team 2000. It started in 2000 when six people and their young families made a 10-year commitment to church planting among unreached people in an urban center of Thailand. Since then, this team has been instrumental in planting numerous churches in Thailand and nearby Myanmar. The three couples are now serving on teams made up of both national leaders and missionaries, with gospel influence extending to Thailand, Laos, Myanmar and Cambodia. In recent years, Multiply has shifted its focus from sending out North American missionaries as the pioneer church planters to supporting national leaders and their teams of church planters. This support involves a combination of North American workers helping the national leaders, assisting temporarily with finances and mobilizing prayer. Examples of this shift are now developing in Malawi, the Philippines and Turkey. Several issues stand at the forefront of Multiply. First, globalization has brought many unreached people groups to our own doorstep. There are now Arabic, Chinese, Ethiopian, Khmu, Punjabi and Slavic (among numerous others) Mennonite Brethren congregations in North America. Japan has sent missionaries to plant churches in Thailand and also in California. Multiply regional directors in Europe and Central Asia and Central and South America hail from the areas that they direct. The resources for mission are no longer exclusively inside of North America nor is the reach of Multiply exclusively outside of North America. Second, localization has precipitated changes in partnerships. The North America General Conference structure which previously owned Multiply has been dissolved. Local congregations find priorities that compete with denominational mission efforts. Some congregations have turned their focus from the world to their own neighborhood. Multiply is seeking ways to encourage local evangelistic initiative while continuing to help the larger North American family cooperate to reach the world. Increasingly, the language of “both-and” replaces that of “either-or”: mission is both local and global. Third, “participation” has an entirely new meaning. In a world where it takes only milliseconds to communicate with someone across the globe, second-hand mission reports lose luster next to first-hand mission experiences. Short-term mission travelers outnumber long-term missionaries. Short-term ministry offers opportunities for a closer look at the international church, exposure to international church planters and the direct challenge to give more generously or to consider personal long-term ministry. But there are also dangers in relying on short-term missions. Usually, evangelizing with integrity requires time to build relationships, familiarity with the culture and facility for the local language. A quick, up-close study may in fact provide less perspective than a thoughtful report from far away. Stewardship is also an issue. Are funds diverted from effective, economical long-term projects for exciting but expensive short-term trips? Or, more positively, do mission trips to difficult Majority World situations replace luxury vacations to tropical resorts? Short-term mission endeavors require thoughtful vigilance to ensure that they contribute to long-term church health. The Mennonite Brethren family is a worldwide clan now. We share a common vision. Jesus calls people in all parts of the globe to be converted, to become members of the discipling community and to proclaim Jesus’ good news for the poor."]}]}, {"num": 10, "id": "chap-08", "badge_label": "CHAPTER 10", "title_zh": "第八章：齐心同工", "title_en": "Chapter 8: Working Together", "desc": "与加拿大的协同事工；Multiply（全球宣教差会）。", "blocks": [{"sub_zh": "第三部分", "sub_en": "PART THREE", "zh_paras": ["我们常以“神的家”（家庭）这一语言来描述门诺弟兄会的群体特质。家庭总是在变迁与成长之中：因着新生与联姻，新成员受到热烈欢迎；当家人离世时，我们同声哀悼。一个属灵的大家庭同样会经历欢庆与哀伤、得着与失去的时刻。北美门诺弟兄会曾经历的一次重大割舍发生在2002年——当时美国与加拿大两国的门诺弟兄会，正式结束了长达一个多世纪、被称为“北美总会”（General Conference）的跨国协同事工。", "1999年，来自美加两国的代表投票表决解散北美总会，并将其下属事工分别移交给美国总会和加拿大总会。一个移交工作小组就涉及的事工达成了谅解备忘录；2002年7月25日至27日，两国总会的最后一次联合大会在不列颠哥伦比亚省的阿伯茨福德（Abbotsford, British Columbia）举行。对某些人而言，这场标榜为“感恩庆典”的三日聚会，其氛围更像是一场庄严的葬礼。有些人选择缺席，而那些出席的人心中亦充满着难言的伤感。", "在闭幕庆典之夜，北美总会执行秘书马文·海因（Marvin Hein）面对1500多名会众坦言，他深切体会到众人心中所承受的失落感。“但是，”海因微笑着说，“当挚爱的亲人离世时，我们绝不会抵制葬礼。我们很少乐意面对肉体离开这个世界的现实，但我们仍会参加追思礼拜，缅怀故人，为他们一生走过的道路感谢上帝，并分担家人的哀伤。我们既要紧紧持守那份美好的回忆，也要懂得释怀放手。当我们向北美总会挥手作别时，所需要的正是这种精神。我们需要放手释怀那段曾经充满蓬勃活力、如今将由全新形式所承继的神国事工。”"], "en_paras": ["We use the language of family to talk about ourselves as Mennonite Brethren. Families change and grow. New members are welcomed thanks to births and marriages. We mourn the loss of family members when they die. A spiritual family also experiences times of celebration and sadness, gains and losses. One loss North American Mennonite Brethren experienced was in 2002, when the United States and Canada officially concluded more than a century of cooperative ministry known as the General Conference. In 1999, delegates from Canada and the U.S. voted to dissolve the General Conference and transfer its ministries to the U.S. and Canadian conferences. A transfer team negotiated memorandums of understanding for the affected ministries, and a final gathering of the binational conference was held July 25-27, 2002, in Abbotsford, British Columbia. For some, the three-day event, billed as a celebration, was more like a funeral. There were some who chose not to attend, and others who attended did so with great sadness.", "On the final night of the celebration, Marvin Hein, General Conference executive secretary, told the audience of more than 1,500 that he empathized with the sense of loss many were experiencing. “But,” Hein said with a grin, “we do not boycott funerals when loved ones die. We rarely welcome the idea of a departure from this earth, but we attend memorial services to remember the departed, thank God for the life lived and share in the family’s sadness. We both hold on, remembering, and we let go. It is something of that spirit we need when we bid farewell to the General Conference. We need to let go of what was once a very vibrant part of the kingdom work and now will be replaced by the new.”"]}, {"sub_zh": "与加拿大的协同事工", "sub_en": "Ministry with Canada", "zh_paras": ["在长达123年的岁月里，美加两国的门诺弟兄会在普世宣教、文字出版、神学院教育以及神学信仰引导等领域紧密同工。北美总会始创于1879年，即第一批门诺弟兄会移民从俄国抵达北美五年之后。它是这批初来乍到的门诺弟兄会移民建立的首个跨区域组织架构。1900年，北美门诺弟兄会正式采纳了首份《门诺弟兄会信仰宣言》，确立了自身作为一个独立宗派的身份，并清晰阐明了核心信仰教义。", "到1909年，北美总会划分为三个大区——南部区、中部区，以及囊括整个加拿大地区的北部区。1912年，加利福尼亚州、华盛顿州和俄勒冈州的各堂会联合组建了太平洋区。在随后的四十余年间，北美总会的架构始终由这四大区构成。1954年，加拿大和美国分别成立了各自的全国性总会（National Conferences），下设各地区区会，但双方依然在北美总会的旗帜下紧密合作，共同支持并运作多项跨国联合事工。", "2002年北美总会解散时，双方共有的四大事工为：门诺弟兄会普世宣教与服侍部（MB Missions/Services International，现名 Multiply Multiply（全球宣教差会））、信仰与生活委员会（Board of Faith and Life）、涵盖亲族出版社（Kindred Productions）在内的资源事工委员会（Board of Resource Ministries），以及门诺弟兄会圣经神学院（Mennonite Brethren Biblical Seminary）。如今，尽管我们仍在普世宣教领域并肩作战，但神学教育与信仰生活层面的治理已转由两国各自的全国总会承担。亲族出版社转为加拿大门诺弟兄会总会（CCMBC）的事工分支。今天，美加两国的门诺弟兄会主要在两大核心领域继续紧密同工：全球宣教与历史文献典藏。", "门诺弟兄会历史委员会（MB Historical Commission）", "由美国门诺弟兄会总会（USMB）与加拿大门诺弟兄会总会（CCMBC）共同拥有的历史委员会，致力于促进美加两国乃至全球门诺弟兄会教会对自身历史传统的理解与传承。该委员会协同运作由四个档案中心组成的网络——两个位于加拿大，两个位于美国。自1969年成立以来，委员会协助统筹门诺弟兄会珍贵历史档案的收集、保存与诠释工作，包括堂会议事录、大会会议纪要、个人手稿书信、期刊杂志及历史照片。", "除了为各地堂会提供丰富的文献资源外，历史委员会还编辑出版《门诺信仰人物谱》（Profiles of Mennonite Faith），这是一套记录重洗派与门诺会杰出信徒在各样境遇中践行基督忠心见证的系列传记。截至2021年，该丛书已出版70篇，每半年发行一次，免费分发给门诺弟兄会各堂会。", "历史委员会设立了四项常设项目——三项研究资助金和一项实习计划。“门诺弟兄会研读资助金”（MB Study Grants）每年颁发，旨在推动符合门诺弟兄会神学与历史关怀的研究、创意作品与学术报告。“凯蒂·芬克·维贝研究资助金”（Katie Funk Wiebe Research Grant）专门支持关于全球门诺弟兄会女性历史与贡献的学术研究。一年一度的“档案发展资助金”（Archival Development Grant）则资助世界各地门诺会档案馆的软硬件建设。此外，历史委员会每年夏季还为美加两国的高校或神学院学生提供暑期档案实习机会，使他们能在北美门诺弟兄会各档案机构中获取实际的档案管理与研究经验。"], "en_paras": ["For 123 years, Mennonite Brethren in the U.S. and Canada worked together in missions, publishing, seminary education and theological guidance. The General Conference began in 1879, five years after the first Mennonite Brethren immigrants from Russia arrived in North America. It was the first organized conference body for the newly arrived Mennonite Brethren immigrants. Mennonite Brethren in North America accepted the first Mennonite Brethren Confession of Faith in 1900, which defined them as a separate denomination and clarified their beliefs.", "By 1909 the General Conference was divided into three districts—the Southern District, Central District and Northern District, which included all of Canada. In 1912, the congregations in California, Washington and Oregon formed the Pacific District. For the next four decades, the General Conference structure consisted of these four districts. Then in 1954, Canada and the U.S. formed their own national conferences, each with regional conferences, but they continued partnering together as the General Conference, supporting and operating a number of binational ministries. When the General Conference was dismantled in 2002, the four joint ministries were MB Missions/ Services International (now Multiply), Board of Faith and Life, Board of Resource Ministries, including Kindred Productions, and Mennonite Brethren Biblical Seminary. While we continue to work together in global mission, theological education and issues of faith and life have shifted to the national conferences. Kindred Productions became a ministry of the Canadian Conference of MB Churches (CCMBC). Today, U.S. and Canadian Mennonite Brethren work together in two areas: global missions and historical preservation.", "MB Historical Commission The Mennonite Brethren Historical Commission, owned jointly by USMB and CCMBC, fosters historical understanding and appreciation of the Mennonite Brethren church in Canada, the U.S. and globally. The commission works with a network of four archival centers—two in Canada and two in the U.S. Since it was formed in 1969, the commission has helped to coordinate the collection, preservation and interpretation of Mennonite Brethren archival records: congregational meeting minutes, conference proceedings, personal papers, periodicals and photographs. In addition to providing a variety of congregational resources, the Historical Commission publishes Profiles of Mennonite Faith, a series of biographies about Anabaptists and Mennonites who in various ways exemplified Christian faithfulness. These biographies, 70 as of 2021, are published semiannually and are distributed free of charge to Mennonite Brethren congregations. The commission sponsors four activities—three grants and one internship. MB Study Grants are awarded annually to promote research, creative productions and presentations of theological and historical interest to Mennonite Brethren. The Katie Funk Wiebe Research Grant promotes research on the history and contributions of Mennonite Brethren women around the world. The annual Archival Development Grant supports the development of Mennonite archives around the world. The Historical Commission also sponsors a summer archival internship for a U.S. or Canadian college or seminary student to gain practical archival experience at the North American Mennonite Brethren archival institutions."]}, {"sub_zh": "Multiply（全球宣教差会）", "sub_en": "Multiply", "zh_paras": ["正如本书各处所记载的，宣教始终位于门诺弟兄会身份认同的核心。在长达120年的岁月里，宣教一直是北美总会各项工作与全体大会的核心议题。从1880年到1948年，总会全体会议议程上的第一项事务永远是宣教——涵盖布道、本土拓植与海外差传。门诺弟兄会各堂会给予宣教事工的经济奉献，历来远远超过对其他任何事工的投入。自1880年代以来，北美门诺弟兄会绝大多数的重要领袖，都在其公共事奉生涯的某个阶段担任过宣教士、布道家、植堂牧者或宣教差会董事。", "北美门诺弟兄会的普世宣教差传机构在历史上曾使用过不同名称，目前定名为“Multiply（全球宣教差会）”（Multiply）。Multiply 于2019年由原本的 MB Mission 与加拿大门诺弟兄会总会的本土植堂事工机构 C2C Network 合并而成。这一合并源于一项全新的宣教异象——盼望北美门诺弟兄会信徒能在地方社区、全国范围乃至全球工场活出全方位的使命人生。Multiply 由此作为一项跨宗派事工正式启动，旨在促进本地、全国与全球层面的教会拓植。", "然而，这次合并并未取得预期的顺遂效果。仅仅六个月后，Multiply 便剥离了其事工中跨宗派教会拓植的相关板块。由 USMB 与 CCMBC 选举产生的代表及董事会任命成员组成的 Multiply 董事会，提请美加两国总会对该项事工进行全面评估。在专业咨询顾问的协助下完成的这项评估，促成了一系列至今仍在深化的改革。2020年新组建的 Multiply 董事会正积极物色新任总干事。曾促使 Multiply 与 C2C 分立的部分财务忧虑现已得到妥善解决。Multiply 继续致力于培训并差派长期与短期同工，在未得之民中开展全人整全的教会拓植事工。", "在美国本土的协同事工", "今天，美国门诺弟兄会不仅与加拿大属灵家庭成员在事工上密切合作，在美国本土各堂会与区会之间亦保持着深度的携手同行。这些共享的事工中，有些曾是全国性或跨国性的伙伴关系，而有些则是专为服事美国门诺弟兄会而设立的。", "高等教育", "抵临北美不久，门诺弟兄会先辈便深切体会到为教会领袖提供高等教育的迫切需要。1908年，在当地门诺弟兄会领袖的主导下，位于堪萨斯州希尔斯伯勒（Hillsboro, Kansas）的泰博学院与预备中学（Tabor College and Academy）创立，开始提供基督教博雅教育。已故教会历史学家约翰·A·托斯（John A. Toews）曾写道，泰博学院作为“教会领袖的核心培养基地”，其“对门诺弟兄会教育与宣教事业产生的属灵影响力，无论怎样高度评价都绝不过分”（引自《门诺弟兄会历史》，第273页）。", "1930至1940年代美国堂会从平信徒义务传道向受薪全职牧者转型的浪潮，以及加拿大在随后十年间出现的类似转变，催生了宗派内部对专业教牧神学培育的迫切诉求。区域与全国性需求的多元化，打破了泰博学院作为美加两国宗派唯一高等教育提供者的格局。1944年，又有两所神学教育机构（后来均发展为大学）相继开学：位于加州弗雷斯诺的太平洋圣经学院（Pacific Bible Institute），以及位于曼尼托巴省温尼伯的门诺弟兄会圣经学院（Mennonite Brethren Bible College）。", "1954年，美加跨国高等教育体系正式走向本土化分工。美国总会接管了泰博学院与太平洋圣经学院（现弗雷斯诺太平洋大学，Fresno Pacific University，简称 FPU）。", "如今，泰博学院由中部区会、东部区会、拉丁美洲门诺弟兄会区会以及南部区会共同拥有。每个区会在泰博学院董事会中均派有代表。截至2020年，该校约500名住校学生来自全美38个州和全球15个国家。泰博学院提供29个学士学位项目、4个硕士学位项目及8个在线学位课程。众多学子积极参与艺术活动、20个学生自治社团以及19支校级运动代表队。", "弗雷斯诺太平洋大学由太平洋区会全权拥有。除位于弗雷斯诺东南部的大学主校区及在线教育项目外，学校还在中央山谷地区设有四个区域教学中心——北弗雷斯诺、贝克斯菲尔德（Bakersfield）、默塞德（Merced）及维塞利亚（Visalia）。FPU 为本科生提供30多门主修专业及100多个研究方向，并设立了45个极具特色的研究生学位项目。全校在读学生约4000人，涵盖传统全日制本科生、成人进修学历提升生及研究生。此外，每年有6000多名教育界与商界专业人士修读其继续教育课程。该校许多学生是其家族中第一代大学生。校体育代表队“太阳鸟队”（Sunbird）在15项体育赛事中竞技角逐。", "2010年，弗雷斯诺太平洋大学正式接管了门诺弟兄会圣经神学院（MBBS），该院现更名为弗雷斯诺太平洋圣经神学院（Fresno Pacific Biblical Seminary）。美国总会于1955年创办了 MBBS，最初由太平洋圣经学院和泰博学院派出资深教授担任教席与行政领导。1960年代在 J.B. 托斯（J.B. Toews）院长的带领下，神学院确立了自身作为重洗派神学学术重镇的地位，尤其强调圣经神学与堂会实践服事的结合。自1975年起的二十年间，MBBS 由美加两国总会联合协办，在此期间为来自美加本土及全球各地的门诺弟兄会培养了大量教牧领袖。", "1995年，面对牧者人才培养需求的激增，加之许多潜在神学生希望就近求学的愿望，MBBS 相继在加拿大阿伯茨福德和温尼伯设立了教学中心。1999年，MBBS 成为坐落于不列颠哥伦比亚省兰里市西三一大学校园内的加拿大神学院联合会（ACTS）的正式成员。至2010年，受招生人数下降和预算吃紧的双重压力影响，各方评估认为弗雷斯诺独立校区已难以单独维系。因此，2010年6月，弗雷斯诺的神学院校产与办学权正式移交给了弗雷斯诺太平洋大学。今天，弗雷斯诺太平洋圣经神学院不仅颁发道学硕士学位（M.Div.），还开设婚姻与家庭治疗、基督教事工、旧约、新约、神学以及城市宣教等文学硕士（M.A.）学位。神学院下设三大独具特色的研究与培训中心：社区转型中心、重洗派研究中心，以及驻地心理咨询辅导中心。", "门诺弟兄会基金会（MB Foundation）", "三十而立，对许多人而言是一个里程碑式的年龄节点。有些人视其为青春的终结，另一些人则将其看作走向成熟成年的开端。对于门诺弟兄会基金会而言，正是后者。美国门诺弟兄会的这一管家事工机构在2020年迎来了其依法注册成立30周年的庆典。", "尽管该管家事工实体于1990年依法注册成立，但为门诺弟兄会大家庭管理属灵与物质资源的忠心服侍，早在1880年便已启航。“三十年彰显了成熟稳健；而一百四十年的渊源则体现了基业的长青与深厚底蕴——这正是受托人所必须具备的核心品质，”门诺弟兄会基金会总裁兼首席执行官乔恩·维贝（Jon Wiebe）在当时的专访中如此表示。", "门诺弟兄会资源管家事工的源头可追溯至1880年。当时初到美国的移民开始在各堂会筹集奉献，以支持北美本土及普世各地的布道圣工。到1898年，总会确立了将“宣教基金”扩充至5万美元永久基金的目标。1904年，总会收到了第一笔计划性奉献——一块80英亩的农田。随着北美总会的日益发展壮大，其通过汇集资金、稳健投资与提供贷款来支持宣教与教育事工的努力亦同步扩展。1908年，总会设立受托人董事会（Board of Trustees），专门处理法律与资产事宜。在受托人董事会下设立了财务行政委员会，该委员会于1933年改组为管家委员会（Stewardship Committee），负责看管向宣教基金以及1924年设立的教育发展基金所作的奉献款项。", "长期的持续发展促使受托人董事会于1972年正式设立管家事工部（Stewardship Department），以开发面向美加两国信徒的计划性奉献教育项目。至1987年，事实证明因地制宜的本地化管理能更好地服务各自国家的总会。因此，美国门诺弟兄会组建了“门诺弟兄会管家事工部”，提供奉献规划、管家教育、遗产规划、财务管理、基金管理、投资方案及堂会贷款等全套专业服务。不久之后，管家事工部的同工和董事会开始探讨转型为独立基金会的可行性。经过深入细致的研讨与磋商，美国总会批准了该项决议。", "1990年门诺弟兄会基金会正式注册成立时，拥有1600万美元总资产、1050万美元贷款规模、1280万美元投资凭单，仅有5名全职员工。而到了其成立30周年之际，门诺弟兄会基金会已成长为一个总资产达2.51亿美元、拥有20名专业员工的宏大专业机构。", "门诺弟兄会基金会的崇高使命，是为门诺弟兄会群体中的个人、堂会及机构提供符合圣经原则的财务管家解决方案，予以支持和赋能。除提供各类全面的金融与信托服务外，基金会还通过“新一代领袖基金”（Leadership Generation Fund，简称 LeadGen）设立奖学金，扶持正在探索全职奉献道路的青年才俊；并举办面向婴儿潮一代、教会建设者及空巢长者的“欢庆华年”（Celebrate!）全国研讨聚会。2020年4月，基金会设立了“COVID-19 堂会纾困基金”，在疫情肆虐期间为门诺弟兄会各堂会提供急难救助。该纾困基金于2021年底功成身退，剩余善款按原定计划全数转入教会拓植项目。"], "en_paras": ["As recorded elsewhere in this book, mission is at the center of Mennonite Brethren identity. It was the dominant theme in the work and meetings of the General Conference for 120 years. From 1880 to 1948, the first item of business on the conference agenda was always mission—evangelism, home mission and foreign mission. Mission always received a greater amount of financial support from Mennonite Brethren churches than any other cause. Since the 1880s, most of the major Mennonite Brethren leaders in North America have at some time in their public ministry been missionaries, evangelists, church planters or mission board members. The North American global mission efforts have been known by various names and is currently called Multiply. Multiply was formed in 2019 when MB Mission merged with C2C Network, the CCMBC church planting ministry. The merger was part of a new mission vision that North American Mennonite Brethren would live on mission locally, nationally and globally. Multiply was launched as a cross-denominational ministry that would facilitate church planting locally, nationally and globally. The merger did not go well and after six months Multiply released the multi-denominational church planting aspects of its ministry. The Multiply Board of Directors, which consists of representatives elected by USMB and CCMBC and members appointed by the board, requested that CCMBC and USMB conduct a review of the ministry. That review, completed with the help of a consultant, led to several changes that continue to unfold. The Multiply Board, newly appointed in 2020, is currently searching for a new Multiply general director. Financial concerns that, in part, led to the de-merger of Multiply and C2C have been addressed. Multiply continues to train and send both long- and short-term workers to engage in holistic church planting among the least reached. Working together in the U.S. Today, U.S. Mennonite Brethren not only cooperate in ministry with our Canadian family members but also with one another here in the United States. Some of these shared ministries were once national or binational partnerships while others were initiated to specifically serve Mennonite Brethren in the U.S.", "Higher Education Soon after their arrival in North America, Mennonite Brethren sensed the need to provide college education for church leadership. In 1908, with local MB leadership, Tabor College and Academy in Hillsboro, Kansas, began to offer Christian liberal arts education. The late historian John A. Toews writes that Tabor’s “spiritual impact on the educational and missionary endeavors of the MB conference can hardly be overestimated” in its role as “the chief training ground for church leadership” (MB History, 273). The shift from lay ministers to professional pastors in the 1930s and 40s in the U.S. and in Canada within the next decade precipitated a concern for denominational pastoral training. Regional and national needs led to changes in Tabor College’s role as the sole provider of higher education for the denomination in Canada and the U.S. In 1944, two more schools (which eventually evolved into universities) began offering classes: Pacific Bible Institute in Fresno, California, and Mennonite Brethren Bible College in Winnipeg, Manitoba. In 1954, the binational MB higher education program was nationalized. The U.S. Conference took responsibility for Tabor College and Pacific Bible Institute (now Fresno Pacific University.) Today, Tabor College is owned by the Central District Conference, Eastern District Conference, Latin America MB Conference and Southern District Conference. Each district conference has a representative on the Tabor College Board of Directors. As of 2020, 38 states and 15 countries were represented on the residential campus of about 500 students. Tabor College offers 29 bachelor’s degree programs, four master’s degree programs and eight online programs. Many students are involved in the fine arts, 20 student-led organizations and 19 varsity sports teams. Fresno Pacific University is owned by the Pacific District Conference. In addition to the main campus in southeast Fresno and an online program, the university has four additional centers in the Central Valley—North Fresno, Bakersfield, Merced and Visalia. FPU offers undergraduate students more than 30 degree options and more than 100 areas of study as well as 45 distinctive graduate programs. About 4,000 traditional-age undergraduate, adult degree completion and graduate students are enrolled at FPU. More than 6,000 education and business professional take continuing education courses. Many students are the first in their families to attend college. Sunbird athletic teams compete in 15 sports. In 2010, Fresno Pacific University took ownership of Mennonite Brethren Biblical Seminary (MBBS), now Fresno Pacific Biblical Seminary. The U.S. Conference (USMB) founded MBBS in 1955, and Pacific Bible Institute and Tabor College provided senior faculty members as teachers and administrators. In the 1960s, during the presidency of J.B. Toews, the seminary established itself as an Anabaptist learning center, emphasizing biblical theology and practical congregational ministry. For 20 years, beginning in 1975, MBBS was sponsored by both CCMBC and USMB. During this time, the Fresno seminary served Mennonite Brethren from Canada, the U.S. and around the world. In 1995, the need for an increase in the number of trained pastors, coupled with the desire of many potential seminary students to study closer to home, resulted in the launch of MBBS teaching centers in Abbotsford and Winnipeg. In 1999, MBBS became a full member of the Association of Canadian Theological Seminaries (ACTS) located on the campus of Trinity Western University in Langley, British Columbia. By 2010, declining enrollments and budget constraints had led to the conclusion that the Fresno campus was no longer viable on its own. So, in June 2010, the seminary property in Fresno was transferred to Fresno Pacific University. Today Fresno Pacific Biblical Seminary offers an M.Div. degree as well as M.A. degrees in marriage family therapy, Christian ministries, Old Testament, New Testament, theology and urban mission. Three centers within the seminary provide unique training: Center for Community Transformation, Center for Anabaptist Studies and On-Site Counseling Center.", "MB Foundation Turning 30 is a significant milestone for many people. For some, it marks the end of youth, while others see it as the beginning of adulthood. For MB Foundation, it was the latter. The stewardship ministry of U.S. Mennonite Brethren celebrated the 30th anniversary of its incorporation in 2020. While the stewardship ministry was incorporated in 1990, the work and ministry of stewarding resources for the Mennonite Brethren family began in 1880. “Thirty years reflects maturity; 140 years reflects longevity and strength—additional important attributes for a fiduciary to have,” said Jon Wiebe, MB Foundation president and CEO, in an interview at the time. The early roots of Mennonite Brethren stewardship date back to 1880 when immigrants to the U.S. began gathering funds from churches to support evangelistic work in North America and around the world. By 1898 the conference set a goal of increasing the Mission Fund to a $50,000 endowment. In 1904 the conference received its first planned gift of 80 acres of farmland. As the North American General Conference grew, so did its efforts to support mission efforts and education by collecting, investing and loaning funds. In 1908 the Board of Trustees was created to focus on legal and property issues. Working under the Board of Trustees was the Financial Administrative Committee that in 1933 became the Stewardship Committee, charged with caring for money donated to the Mission Fund and the Educational Endowment Fund, created in 1924. Continued growth prompted the Board of Trustees in 1972 to create an official Stewardship Department to develop a planned giving program geared toward educating constituents in the U.S. and Canada. By 1987 it became apparent that localized management would better serve the respective conferences. And so, in the U.S., MB Stewardship Ministries was formed to provide gift planning, stewardship education, estate planning, financial management, endowment fund management, an investment program and loans. Soon after, Stewardship Ministries staff and board began to explore forming a foundation. After many meetings and discussions, the U.S. Conference approved the move. When MB Foundation was incorporated in 1990, it did so with $16 million in assets, $10.5 million in loans, $12.8 million in certificates and five staff members. At the time of its 30th anniversary, MB Foundation was a $251 million corporation with a staff of 20. The mission of MB Foundation is to encourage and assist individuals, congregations and ministries in the Mennonite Brethren community with biblical financial stewardship solutions. In addition to offering a variety of financial services, MB Foundation serves USMB through the Leadership Generation Fund (LeadGen) to provide scholarships to young adults who are exploring ministry opportunities and through Celebrate!, national gatherings designed for boomers, builders and empty-nesters. MB Foundation established the COVID-19 Church Relief Fund in April 2020 to assist Mennonite Brethren churches during the pandemic. The fund was closed at the end of 2021 and remaining funds were directed to church planting, as originally planned."]}]}, {"num": 11, "id": "chap-09", "badge_label": "CHAPTER 11", "title_zh": "第九章：美国的门诺弟兄会", "title_en": "Chapter 9: Mennonite Brethren in the U.S.", "desc": "治理架构与异象重塑；三大核心委身；USMB 的事工运作模式。", "blocks": [{"sub_zh": "第九章", "sub_en": "CHAPTER 9", "zh_paras": ["家庭成员的增多与生活的变迁，往往会催生许多家庭的房屋改建工程。改建房屋总是免不了纷扰杂乱——墙体被拆除，空间被重新布局，新的居室被加建出来。有些改造工程会遭遇意想不到的阻碍而走弯路，而且由于不可预见的开支，预算往往屡屡超支。然而，当一切尘埃落定——整洁恢复如初、搬迁的物件各归其所之时——全家人都会由衷赞赏这些改变为居家生活带来的品质提升与温馨体验。", "在2000年代初，美国门诺弟兄会对其“属灵家园”——美国门诺弟兄会总会（United States Conference of Mennonite Brethren Churches，简称 USMB）进行了一场深刻的重组与革新。虽然容纳各项事工的组织架构发生了深刻变革，但致力于促使教会增长与栽培信徒门徒的坚定委身始终未变。从这个意义上说，这些改变并非一次颠覆信仰传统的“极端”翻新。", "强化全国性总会的努力始于2000年，当时 USMB 与加拿大门诺弟兄会总会（CCMBC）正式开启了解散跨国“北美总会”的程序。当时，加拿大总会的全国组织架构已相当成熟完备，而 USMB 的全国性事工则相对薄弱，长期处于实力雄厚的北美跨国总会的遮蔽之下。USMB 领袖深刻意识到，亟需确立全新的异象与坚强的领导核心，以回答“下一步该往何处去？”这一历史性追问。", "早在1980年代末，教会便曾提出过同样的追问。1988年，USMB 制定了开拓新教会并物色、装备新植堂领袖的量化战略目标——“2000年异象”（Vision 2000）。其目标是盼望到2000年，USMB 能增长至25,000名会友及180间堂会。具体规划为：激励地方堂会实现自体增长；各大区会在全国总会的协力下，每年植立5间新教会，其中30间将开拓在不同的族裔群体之中。", "新教会的建立必然需要大量领袖。因此，总会呼吁已建成的成熟堂会，发掘并培育相当于其会友总数2%的人才，以承担教牧事奉与差传宣教的领袖职分。为了落实这些宏伟目标，两项核心事工应运而生。由洛亚尔·芬克（Loyal Funk）领航的新倡议——“统合事工”（Integrated Ministries），专注于与新兴移民社区中建立的教会建立有机联结。得益于统合事工的推动，USMB 大家庭迅速拓宽，迎来了斯拉夫/俄语、韩语、西班牙语、日语、埃塞俄比亚语以及华语等多元族裔堂会的加入。", "1996年，“美国宣教部”（Mission USA）正式创立，专注于新堂开拓、既有教会更新以及领袖领导力培育。在执行总监埃德·博施曼（Ed Boschman）的带领下，新教会在亚利桑那州、犹他州、内布拉斯加州、俄克拉荷马州等地相继植立。步入21世纪之际，“2000年异象”设定的各项量化指标圆满达成：USMB 麾下堂会增至180间，会友总数达26,219人；正式接纳了45间跨文化族裔堂会，远超原定30间的目标。", "当 USMB 领袖展望未来时，又确立了三大核心目标：物色一位全职全国执行总干事；由 Mission USA 在全美各大都会中心统筹协调植堂事工，力争到2005年开拓20间新教会；聘请一支兼职区域资源拓展团队，为 Mission USA 及其他事工（包括从北美总会移交至全国总会的工作）筹集发展基金。2000年 USMB 全国大会的与会代表热烈拥抱了这一宏大异象，并全票通过了近100万美元的全国预算。", "看起来，USMB 的“房屋改建”正朝着理想的方向大步迈进。然而，事态的发展并未如预期般顺遂。出席2002年大会的代表们获悉：全国总会执行总干事未能如期聘就，预期的筹款策略亦未能达到预期成效。受此影响，包括 Mission USA 在内的多项全国事工被迫压缩规模、紧缩编制。"], "en_paras": ["in the U.S. Growth and change within a family prompt many a home remodeling project. Remodeling is messy, as walls are knocked down, spaces reconfigured and rooms added. Some remodeling projects are detoured by unexpected obstacles and more times than not the price tag increases thanks to unforeseen expenses. But when all is said and done—when tidiness is restored and displaced belongings have found a home—the family appreciates the ways in which the changes have improved or enhanced their home. In the early 2000s, U.S. Mennonite Brethren significantly revamped their “home” — the United States Conference of Mennonite Brethren Churches (USMB). While the structure that housed ministries changed, the commitment to grow the church and disciple believers remained the same. In this sense, the changes did not represent an “extreme” makeover. Efforts to strengthen the national conference were initiated in 2000 as USMB and the Canadian Conference of MB Churches (CCMBC) began the process of dissolving the binational General Conference. While CCMBC’s national structure was well developed, USMB ministries were less so and stood in the shadow of a strong binational conference. USMB leaders recognized the need for a new vision and new leadership to help answer the question, “What’s next?” That same question was raised in the late 1980s, and in 1988, USMB adopted numeric goals for planting new churches and calling out and preparing leaders for these new churches. The goals of “Vision 2000” were to see USMB grow to 25,000 members and 180 congregations by the year 2000. Specifically, local congregations were challenged to grow, and the districts, with the help of the national conference, would establish five new churches per year with 30 of these churches being started among different ethnic peoples. Leaders would be needed for these new churches. Established congregations were asked to call out and help prepare two percent of their membership for leadership roles in pastoral ministry and missions. Two ministries emerged to meet these goals. Integrated Ministries, a new effort led by Loyal Funk, connected with churches formed among immigrant communities. As a result of Integrated Ministries, the USMB family grew to include Slavic/Russian, Korean, Hispanic, Japanese, Ethiopian and Chinese congregations.", "Mission USA was formed in 1996 to focus on planting new churches and renewing existing churches as well as leadership development. Mission USA executive director Ed Boschman led the effort and new churches were planted in Arizona, Utah, Nebraska, Oklahoma and elsewhere. Coming into the 21st century, the numeric goals of Vision 2000 had been met. USMB numbered 180 congregations with a total membership of 26,219. Forty-five transcultural congregations were welcomed, exceeding the goal of 30. As USMB leaders considered the future, three goals emerged: securing a full-time national executive director, coordinated church planting by Mission USA in metro centers around the U.S. with the goal of planting 20 new churches by 2005 and hiring a team of part-time regional fundraisers to solicit funds for Mission USA and other ministries, including work done by the General Conference that would move to the national level. Delegates to the 2000 USMB convention embraced this energetic vision and affirmed a national budget of nearly $1 million. It appeared that the USMB “remodel” was going in the right direction. But things did not develop as planned. Delegates to the 2002 convention learned that a national conference executive director had not been hired and that the funding strategy had not worked as hoped. Consequently, ministries were downsized, including Mission USA."]}, {"sub_zh": "治理架构与异象重塑", "sub_en": "Governance and Vision", "zh_paras": ["正如许多家庭在经济上难免遭遇艰难时刻一样，这对于美国门诺弟兄会而言也是一段充满试炼的艰难时期。随着 USMB 领袖审慎评估解散跨国总会带来的深远冲击，深入考察宗派内部奉献模式的变化，以及门诺弟兄会信徒奉献时间与志愿服务方式的转变，他们开始探索一套全新的治理机制。", "教会事工委员会（Board of Church Ministries）建议放弃以往由多个独立委员会分立运作的模式，转而组建一个集约化的“超级”领导董事会（Leadership Board），并推行以专业同工为主导驱动的治理模式。这个由9名成员组成的领导董事会，在五大区会之间保持均衡代表性，统筹管理以往受托人董事会、信仰与生活委员会、传媒委员会以及 Mission USA 的各项职能。同时，设立一年一度的“全美机构董事峰会”（Institutional Board Summit），将领导董事会执行委员会与来自各区会、门诺弟兄会基金会、两所高校及神学院，以及Multiply（全球宣教差会）的代表汇聚一堂，共同提供资源支持并拟定 USMB 的核心议程。各类专项工作团队则视实际需要灵活委派。", "该治理模型于2004年正式通过，查克·布勒（Chuck Buller）获聘为首任全职 USMB 全国执行总监。唐·莫里斯（Don Morris）随后加入团队，出任 Mission USA 主任。", "虽然 USMB 迄今仍由单一董事会统辖领导，但对这一治理模式的微调与优化从未间断。例如，实践很快表明，领导董事会由于事务繁杂，无法充分顾及深层的神学教义议题；因此，全美“信仰与生活委员会”（Board of Faith and Life）于2006年正式恢复设立。", "2014年物色新任全国执行总监的过程，推动了一场更为深远的体制机制革新。自2007年起担任该职的埃德·博施曼宣布退休意向，领导董事会敏锐地意识到，这不仅是交接领导棒的契机，更是全盘检视 USMB 组织架构、核心异象与战略目标的良机。", "在组织咨询专家乔治·布拉德（George Bullard）的协助下，一项历时两年的事工与架构全面评估展开，约40位深具洞见的 USMB 牧长领袖共同参与，为未来绘制总体发展方向。他们的研究成果由一个写作小组汇聚提炼，随后交由战略工作团队进一步打磨精进。在此过程中，领导董事会与全美峰会的与会者深入审议了各项草案并提出宝贵意见。", "最终形成的纲领性文献明确确立了三大核心委身：本地、全国与全球层面的教会倍增/植堂/布道传福音；刻意门徒训练；领袖培育。USMB 的一切事工与活动，都将以“赋能地方教会发挥其全部事奉潜能”为基准来进行检验。异象宣言描绘了一幅生动蓝图：各门诺弟兄会堂会将围绕这一项或多项核心委身，形成富有生机的有机联络网络。这份名为《未来故事》（The Future Story）的十年异象愿景，巧妙地以一位身处2025年的人回溯过去的视角写就，生动描绘了 USMB 各项事工在过去十年间所经历的蜕变与飞跃。", "这项新异象的其他关键要素包括：结束“全美机构董事峰会”的运作机制，组建专注于战略领导力议题的“全国战略团队”（National Strategy Team），并将 USMB 首席行政同工的职衔确立为“全国总监”（National Director）。由于这一新战略并未改动 USMB 的章程细则，2014年大会代表并未就该战略提案进行法定表决，但代表们齐声确认并签署了该异象与战略，以此作为指引 USMB 直至2025年的前进航标。"], "en_paras": ["Most families go through some tough times financially, and this was one of those times for U.S. Mennonite Brethren. As USMB leaders considered the impact of dissolving the General Conference and explored denominational giving patterns and shifts in the way Mennonite Brethren volunteer their time, they began to look at a new form of governance. Instead of continuing with a multiple-board model, the Board of Church Ministries recommended forming one “super” board and using a model that would be staff driven. The nine-member Leadership Board would represent a balance among the five districts and would manage the functions of the Boards of Trustees, Faith and Life and Communication as well as Mission USA. An annual Institutional Board Summit would bring together the Leadership Board executive committee and representatives from the district conferences, MB Foundation, the two colleges and seminary and MBMS International, now Multiply, for support and to identify agenda for USMB. Project teams would be appointed as needed. This model was approved in 2004, and Chuck Buller was hired as the first fulltime USMB executive director. Don Morris joined the USMB staff as the Mission USA director. While a single board continues to lead USMB, adjustments to the single board governing model have been ongoing. For example, it quickly became clear that the Leadership Board was not able to adequately address theological matters, so in 2006 the national Board of Faith and Life was reinstated. A significant renovation was prompted by the search for a new USMB executive director in 2014. Ed Boschman, who had served in this role since 2007, had announced his intention to retire, and the Leadership Board felt this was an appropriate occasion to review not only the USMB structure but also its vision and goals. The two-year ministry and structure review was led by consultant George Bullard and involved 40-some USMB individuals who set a general direction for the future. Their conclusions were developed by a writing team whose work was then refined by a strategy team. Along the way, Leadership Board and National Summit participants reviewed the various documents and gave their input. The summary document identified three core commitments: local, national and global church multiplication/church planting/evangelism; intentional disciple-making and leadership development. All USMB activities would be measured in terms of helping local churches reach their full ministry potential. The vision statement envisioned networks of MB churches formed around one or more of the core commitments. The 10- year vision statement, called “The Future Story,” was written from the perspective of someone in 2025 looking back and describing how USMB ministries had changed and developed during the preceding decade. Other elements of this new vision included retiring the Institutional Board Summit, forming a National Strategy Team to focus on strategic leadership issues and giving the USMB lead staff member the title of national director. Because this new strategy did not alter USMB bylaws, delegates to the 2014 convention were not asked to vote on the proposed strategy. But they did affirm this vision and strategy to guide USMB until 2025."]}, {"sub_zh": "三大核心委身", "sub_en": "Core Commitments", "zh_paras": ["USMB 的崇高异象，是赋能每一间地方门诺弟兄会堂会，在我们的福音派与重洗派独特信仰底色之内，完全发挥上帝所赐予的事工潜能。为实现这一目标，USMB 采纳了一项关键战略：建立坚强有力的全国统筹服务机制，在宣教与事工层面为地方堂会及各大区会提供激励、支持与全方位资源；专注于教会与领袖之间的生机性联络网络，全力深耕三大核心委身：", "教会倍增与布道传福音（Church multiplication and evangelism）", "刻意门徒训练（Intentional disciple-making）", "领袖培育（Leadership development）", "这三大核心委身，构成了展望2025年美国门诺弟兄会堂会群体风貌的基石与灵魂。虽然这些委身并非凭空而生，但在全国同工团队与各门诺弟兄会事工分支中，却涌动着全新的活力与饱满的热忱，全力激励并装备各堂会。", "教会倍增与布道传福音，是美国门诺弟兄会使命与事工不可或缺的生命线。在埃德·博施曼（1996–2001）和唐·莫里斯（2004–2016）的先后领导下，Mission USA 作为 USMB 的植堂与教会更新事工服侍了整整二十年。在此期间，Mission USA 广泛借鉴整合了各类植堂机构的优势资源，其中包括加拿大总会的植堂事工机构 C2C Network。", "随着 USMB 领导董事会深入探讨如何最佳落实对教会倍增与布道的新一轮聚焦，2015年 USMB 领袖探寻 C2C 是否能作为 USMB 的植堂执行机构。这一提议促使 C2C 探索将其服侍工场拓宽至加拿大国境之外；同时也与 MB Mission（Multiply（全球宣教差会）前身）领袖日益清晰的异象产生共鸣——即认定宣教应被定义为本地、全国与全球层面的统一体，且必须深植于每间地方教会、区会及全国总会的异象、战略与架构核心。", "因此，2016年，Mission USA 功成身退，美国本土的植堂事工全面与 C2C 携手展开。MB Mission 与 C2C Network 的合并计划持续推进；2019年1月，Multiply 正式宣告诞生，作为一家植根于门诺弟兄会传统的差传机构，开展跨宗派服侍，以促进本地、全国及全球的教会植立。", "然而，USMB 与 C2C/Multiply 之间的这一合作模式仅维持了三年。2019年10月，Multiply 宣布终止其在美国本土的植堂运营板块。面对骤变，全国总会与各大区会迅速接盘，为羽翼未丰的新植堂点提供托底支持，但随之而来的领导真空急需制度化填补。", "这一职责由 USMB 新设立的“植堂理事会”（Church Planting Council）承接，由“植堂动员主任”（Church Planting Mobilizer）统筹主持。植堂动员主任与各区会植堂委员会密切同工，并与 USMB 各堂会构建协同网络，以孕育推进植堂项目。动员主任同时统辖由 USMB 五个区会各派代表组成的植堂理事会。植堂理事会密切追踪各区会乃至全国范围内的一切植堂动态，扶持并激励牧者与教会网络植立新堂点及拓展分堂，并协同推进教会更新振兴项目。此外，由一批门诺弟兄会牧者自发创立的“网络倡议”（The Network），亦为各地植堂者提供项目统筹管理与全方位牧养关怀支持。", "领袖教育与发展倡议（LEAD Initiatives）", "为地方堂会牧者与同工提供针对性专业资源，全面深耕“刻意门徒训练”与“领袖培育”两大核心委身。门徒与领袖绝非自然而然一蹴而就。无论我们在基督里的属灵“年资”几何，所有的基督徒都需要得到持续的滋养与装备，以便在上帝的国度中尽展恩赐与才干。LEAD 倡议为牧者与领袖奠定了扎实基石，帮助他们在深化个人信仰生命的同时，提升教牧事奉成效，建立紧密的同工网络。", "LEAD 培育体系涵盖但不限于以下核心板块：", "LEAD 教练陪伴（LEAD Coaching）：由经验丰富的认证教练网络为教牧同工与领袖提供一对一生命陪伴式辅导，促进个人灵命成长与服事生命境界的提升；", "LEAD 研学同侪群（LEAD Cohorts）：为渴望深入探讨特定专题的同行者提供线上微型研讨平台，全员免费参与；", "LEAD 播客（LEAD Pods）：USMB 官方定期推出的灵命成长与领导力培育专属播客节目。"], "en_paras": ["The USMB vision is to empower each local Mennonite Brethren church to reach its full, God-given ministry potential within the framework of our evangelical and Anabaptist distinctives. To achieve this goal, USMB adopted a strategy of building a strong national presence to encourage, support and help resource local churches and districts for mission and ministry, focusing on organic networking of churches and leaders and zeroing in on three core commitments. These three core commitments are: · Church multiplication and evangelism, · Intentional disciple-making and ·
