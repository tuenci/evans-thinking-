nnonite Brethren church as well as today (66-68). (1) The need for systematic Bible teaching is primary. Rejection of lifeless formalism leads to joyous expression, but this must be directed by thorough biblical instruction. (2) Because religious ferment is subject to powerful emotional expression with shallow intellectual consideration, there is a keen need for spiritual discernment. Emotion and personal experience are servants, not masters; obedience born of biblical study is to be our guide. (3) Leadership is to be entrusted to members with integrity and spiritual balance. (4) While strong and wise leaders are needed, dictatorship is suspect and to be rejected. Congregational participation and action are necessary for a strong church polity. (5) A strong ethical emphasis is needed. Happiness divorced from holiness leads to false freedom. Faith and practice must be kept in proper balance. (6) Meaningful church worship is essential. Lukewarm worship opens the door to hyper-emotional expressions. Radical renewal demands appropriate worship forms."]}, {"sub_zh": "首次向北美的移民潮 (The First Migration to North America)", "sub_en": "The First Migration to North America", "zh_paras": ["俄国门诺弟兄会随后进入了迅猛增长的黄金时期。到了1872年，即建会仅12年后，门诺弟兄会的受洗会友人数已达约600人。各地堂会代表齐聚一堂，召开了历史性的第一届门诺弟兄会全国家庭年会，不仅同心领受圣灵更新的培灵信息，更制定了雄心勃勃的福音拓展与跨区域植堂宣教大计。大会正式选举成立了宣教监督委员会，并全职差派了五位巡回布道家奔赴各地宣讲天国福音。", "从1874年至1880年间，受俄国沙皇政府推行“全员强制服兵役法案”（企图取消门诺信徒永久免役特权）以及经济土地瓶颈的强烈驱使，约有18,000名门诺信徒毅然决然掀起了向北美大陆的大移民浪潮。在这浩浩荡荡的移民大军中，包含了大批门诺弟兄会信徒，以及由雅各布·A·维贝长老（Jacob A. Wiebe）于1867年创立的克里米亚门诺弟兄会（Krimmer MB Church）的35户敬虔家庭。", "初来乍到的新移民在北美大草原上面临着难以想象的拓荒艰辛：居住在极其简陋阴暗的草皮泥屋（sod houses）中、遭受遮天蔽日的蝗灾摧残、农作物严重缺乏销售市场、以及子女教育资源的极度匮乏。据托伊斯记载，在北美拓荒早年（1874–1879），教会生活同样充斥着神学分歧与内部张力：来自俄国不同殖民背景的移民群体，在浸礼的具体细节（如向前倾三次或向后浸一次）、与浸信会的关系、以及与其他门诺老教派的相处原则上各持己见。", "1878年，门诺弟兄会领袖在内布拉斯加州亨德森（Henderson）举行了具有里程碑意义的首届全美州际教牧领袖峰会。该次历史性聚会的核心议题，乃是将原本四散各州的门诺弟兄会堂会紧密联合为一个统一的宣教共同体！对失丧灵魂的福音迫切感与普世宣教异象，从此成为了横跨百余年、将全美门诺弟兄会紧紧凝聚在一起的最强大纽带。当时困扰他们的一些次要神学争论（如姊妹亲吻问安礼、女性蒙头、纪律除名尺度等），在今天看来已不再是核心障碍，但在当时却在一定程度上阻碍了他们与其他门诺宗派的全面合并。", "到了二十世纪之交，门诺弟兄会的蓬勃堂会已牢牢扎根于堪萨斯州、内布拉斯加州、北达科他州、南达科他州、俄克拉荷马州、科罗拉多州，以及加拿大马尼托巴省和萨斯喀彻温省；不久之后，福音的帐幕进一步大举拓展至加利福尼亚州、蒙大拿州、德克萨斯州、俄勒冈州和华盛顿州！"], "en_paras": ["The Mennonite Brethren church in Russia grew rapidly. By 1872, 12 years after its founding, the Mennonite Brethren church numbered about 600 members. Representatives met for the first Mennonite Brethren church family gathering, a time of inspirational meetings and planning for evangelistic church extension.", "A committee was elected to supervise the work of evangelism, and five men were appointed to itinerant evangelistic ministry. From 1874 to 1880, some 18,000 Mennonites migrated from Russia to North America, prompted by the Russian government’s plans to introduce universal military service and economic factors. Among the immigrants were many Mennonite Brethren and a group of 35 families from the Krimmer (Crimea) MB Church founded under Elder Jacob A. Wiebe in 1867. The new settlers experienced all the hardships of pioneer life, including primitive sod houses, grasshopper plagues, lack of markets for their produce and limited educational opportunities. According to Toews, church life in the early years (1874-79) in North America was also characterized by religious ferment and inner tensions. Settlers from different Russian colonies disagreed about issues such as mode of baptism and relations with Baptists and other groups of Mennonites. In 1878, the first interstate meeting of Mennonite Brethren leaders was held near Henderson, Nebraska, where the primary issue was uniting Mennonite Brethren congregations for mission purposes. An interest in evangelism and mission has continued to bind Mennonite Brethren congregations together through the years. The other early issues seem less significant today, including the “sister kiss,” head coverings for women, excommunication, mode of baptism and relations with Baptists, but these worked against achieving a merger with other Mennonite groups. By the turn of the century, Mennonite Brethren congregations had been established in Kansas, Nebraska, North and South Dakota, Oklahoma, Colorado, Manitoba and Saskatchewan and, soon afterward, in California, Montana, Texas, Oregon and Washington."]}, {"sub_zh": "俄国革命与后续的移民 (The Russian Revolution and Later Migrations)", "sub_en": "The Russian Revolution and Later Migrations", "zh_paras": ["在北美拓荒的同时，1875年之后留守俄国本土的门诺弟兄会，也开始主动寻求与更广泛的传统门诺老教会冰释前嫌、携手同工。双方定期举行联合神学协商会议，就洗礼与圣餐等核心议题达成深刻共识。在1884至1885年间，俄国门诺殖民地迎来了规模空前的灵性大复兴，成千上万的人悔改归主、受洗加入教会，门诺弟兄会的会友人数呈现爆炸式增长。一大批极具学识与威望的杰出领袖脱颖而出，尤其是在教师知识分子阶层中涌现了大批优秀圣徒。", "在第一次世界大战爆发前的整整三十年（1885–1914），被教会史学家公认为俄国门诺弟兄会的“黄金时代”。门诺弟兄会的领袖在整个泛门诺社群中担任了举足轻重的领导职务；门诺殖民地向全俄境内广泛辐射开辟了诸多新兴定居点，在这些新村落中门诺弟兄会占有极高的人口比例。高等教育的飞跃普及、现代农业经济的空前繁荣、作为兵役替代役的“林业服役”（Forestry Service, 俄文 Forstei）体制的稳固确立、以及福音书刊出版物的大规模印刷分发，共同构成了这一黄金时代的辉煌画卷。", "从建会伊始，俄国门诺弟兄会便将落实主耶稣的大使命视为教会存在的根本命脉。无论是流放西伯利亚的威胁，还是投掷下狱的危险，都无法阻挡信徒向身边的斯拉夫俄国邻舍放胆见证基督！布道家们跋山涉水散发福音单张与圣经译本。由于沙皇法律严禁诱使东正教徒改教，门诺弟兄会智慧地指导那些新归信的俄罗斯族信徒加入当地的浸信会堂会。在海外宣教方面，教会从起初的单纯经济奉献支持西方差会，迅速跃升为亲自差派宣教士建立海外工场——门诺弟兄会的首个独立海外宣教工场在遥远的印度大地上结出了累累硕果！"], "en_paras": ["After 1875, the Mennonite Brethren who remained in Russia began to work in concert with the larger Mennonite church. Joint conferences were held to discuss issues like baptism and the Lord’s Supper. In 1884-85, large-scale revivals resulted in conversions, baptisms and growth in Mennonite Brethren church membership. Strong Mennonite Brethren leaders emerged, especially from the ranks of the teaching profession. The three decades preceding the First World War have been described as the “golden age” of the Russian Mennonite Brethren church. Mennonite Brethren assumed positions of leadership within the larger Mennonite community. Mennonite colonies expanded into new settlements in many parts of Russia; these contained a high concentration of Mennonite Brethren. Educational growth, economic prosperity, forestry service as an alternative to military conscription and the production and distribution of Christian literature characterized these years. From its inception, the Russian Mennonite Brethren church actively pursued evangelism and missions. Fulfilling the great commission was understood as fundamental to the church. Risk of imprisonment or exile did not keep people from witnessing to Russian neighbors. Evangelists distributed Bibles and witnessed to the good news. Because of a law prohibiting proselytizing, ethnic Russian converts were advised to join the Baptist church. Participation in foreign missions began with financial support of mission societies and quickly moved beyond it, with the first Mennonite Brethren mission field established in India."]}, {"sub_zh": "动荡年代、世界大战与全球大迁徙 (Revolution, World Wars and Migrations)", "sub_en": "Revolution, World Wars and Migrations", "zh_paras": ["然而，俄国门诺社群繁花似锦的黄金盛世，随着1914年第一次世界大战的爆发以及1917年俄国十月革命的烈焰，瞬间化为了灰烬与泡影。由于文化、语言和血统上被敌对视作德意志敌国的同盟，门诺信徒遭受了俄国社会的残酷猜忌与仇视打压。", "当德意志帝国军队一度控制乌克兰全境时，面对凶残暴徒的洗劫，俄国门诺信徒在持守“非抵抗原则”上发生了痛苦的分裂——部分年轻人违背了历代信徒的和平传统，擅自组织了武装自卫民兵（德文 Selbstschutz）。这场惨痛的悲剧后来被公认不仅在军事战术上是一场自取灭亡的灾难性溃败，更在神学上严重践踏背叛了重洗派数百年纯正的圣经非抵抗和平主义信仰。", "随着德军撤退，随之而来的俄国内战与无政府主义残暴土匪武装（如臭名昭著的马赫诺匪帮）的血腥洗劫，使门诺殖民地沦为了人间地狱。从1920年至1922年，空前绝后的极度大饥荒、斑疹伤寒等致命瘟疫席卷乌克兰荒原，白骨露野。危急关头，大洋彼岸的北美与欧洲门诺信徒紧急动员，正式组建了门诺中央委员会（Mennonite Central Committee, MCC）！1922年3月，MCC的第一批满载着救命面粉与药品的救济列车终于奇迹般冲破重重关卡抵达乌克兰灾区，奉基督的慈爱圣名挽救了成千上万在死亡线上挣扎的饥民生命！", "令人肃然起敬的是，在战火纷飞与社会失序的至暗绝境中，俄国门诺信徒反而经历了全境普遍的灵性大复兴，以前所未有的热忱向身旁的俄罗斯邻舍敞开宣教怀抱。由于苏俄早期政策一度允许对东正教教徒公开传教，加之布尔什维克政权明令禁止传道人继续在公立学校任教，反而促使许多具备深厚学养的门诺弟兄会教师彻底全职献身于巡回布道。1924至1925年的圣灵大复兴，不仅彻底点燃了全境的福音烈火，更为那些即将逃离俄国的信徒注入了坚不可摧的属灵生命力。", "在1923年至1929年间，约有20,000名门诺难民历尽千辛万苦成功逃离苏联大清洗的前夜，移民定居加拿大；其中约有四分之一是坚贞的门诺弟兄会信徒。", "而那些未能及时逃离的门诺弟兄姊妹，则不得不直面斯大林无神论专制极权的残酷迫害浩劫：所有的礼拜堂被强行充公查封没收，宗教自由被彻底践踏剥夺；无数敬虔的牧师、长老和骨干领袖被成批逮捕，惨遭枪决或流放到冰天雪地的西伯利亚古拉格集中营在繁重劳役中悲壮殉道；那些因信仰良心拒绝服兵役的青年信徒，更是在枪口下慷慨赴死，用鲜血见证了对基督和平福音的至死忠诚。", "从1930年至1940年，有组织的残酷反宗教迫害进一步常态化与制度化。第二次世界大战期间（1941–1943），德军对乌克兰的暂时占领为废墟中的教会带来了短暂的宗教自由喘息；当德军节节败退撤退时，约有35,000名门诺信徒冒着漫天炮火跟随大军西逃。最终，约有12,000名历经九死一生的幸存者成功抵达西德占领区，随后大批移居加拿大，并深入南美洲的巴拉圭查科荒原和巴西开辟了崭新的家园。", "历经烈火的淬炼与全球大迁徙的洗礼，门诺弟兄会这棵从重洗派古老树干上抽出的幼苗，终于超越了单一的地域与疆界，在北美、南美乃至普世各处深深扎根，成长为一棵荫庇万民的参天大树！"], "en_paras": ["The prosperous golden age of the Russian Mennonite colonies was shattered by the events of World War 1 (1914- 18) and the Russian Revolution (1917-18). Because their culture identified them with the German military foe, Mennonites experienced hostile treatment from the Russians. When German troops gained control of Ukraine for a time, the Mennonites divided on the issue of nonresistance, with some forming armed units of self- defense. Later, it was recognized that this was not only a tactical blunder but a violation of their historic biblical nonresistance. The Mennonites of Russia were caught in the events of the civil war that followed, as well as the terrors of bandit attacks. They experienced the ravages of malnutrition, disease epidemics and famine from 1920 to 1922. Relief assistance by European and American Mennonites, who organized to form the Mennonite Central Committee (MCC), finally arrived in March 1922, saving thousands from starvation. During the time of war and anarchy, Russian Mennonites experienced widespread spiritual revival and engaged in unprecedented missionary outreach to their Russian neighbors. Communist policies allowed for open proselytizing among Russian Orthodox church members for a time. When the Communist government barred ministers from teaching in public schools, many Mennonite Brethren teachers were freed for evangelistic ministry. The revivals of 1924-25 not only fueled the fires of evangelism, but also enriched the Christian experience of many who fled Russia for Canada. Some 20,000 Mennonites immigrated to Canada between 1923 and 1929, about a quarter of them Mennonite Brethren. The Mennonites who were unable to escape faced the atheistic policies of the Stalinist regime. Church property was liquidated and religious freedom denied. Ministers were exiled to Siberian concentration camps or killed. Conscientious objectors to military service faced martyrdom.", "From 1930 to 1940, anti-religious oppression was even more firmly institutionalized. German occupation of Ukraine during World War 2 (1941-43) offered a brief interlude of relative religious freedom. When the German armies retreated, 35,000 Mennonites tried to escape with them. Some 12,000 eventually reached Western zones in Germany and migrated to Canada and South America."]}]}, {"num": 6, "id": "chap-04", "badge_label": "CHAPTER 6", "title_zh": "第四章：圣道之民", "title_en": "Chapter 4: People of the Word", "desc": "福音派与敬虔主义的影响 (Evangelical Pietist Influences)；重洗派对圣经的诠释 (The Anabaptist Interpretation of Scripture)；门诺弟兄会的圣经诠释原则 (MB Principles of Interpretation)。", "blocks": [{"sub_zh": "第二部分：家族特质与信念 (PART TWO: Family Distinctives)", "sub_en": "CHAPTER 4", "zh_paras": ["历代以来，门诺弟兄会始终自勉为“圣道之民”（People of the Book）。正是对圣经夜以继日的潜心研读，点燃了孕育门诺弟兄会教会诞生的属灵大复兴之火。", "当我们凝眸回望门诺弟兄会建会初期的岁月，几幅令人动容的生动画卷便跃然眼前：", "首先，我们看见在十九世纪中叶南乌克兰的门诺村庄中，一小群一小群渴慕真道的信徒在民宅中聚集，同心查考圣经与恒切祈祷。大家围绕着所选读的圣经经文，展开热烈而深沉的属灵对话与思想激荡。学校导师托比亚斯·沃斯（Tobias Voth）创办的基督教文献社所发行的属灵读物，为信徒的讨论注入了丰厚的养分；推动他们深入探索的议题涵盖了福音布道、普世宣教、以及个人与基督日渐亲密的生命契合。重洗派先贤门诺·西蒙斯（Menno Simons）的经典著述成为了他们学习的重要导师。这种查经虽然具有极其鲜明的理性求索深度，但它绝非冰冷抽象的经院学术探讨，而是直接催生出椎心泣血的认罪悔改、生命重生与灵性大觉醒！", "接着，我们看见两位年轻的门诺弟兄会传道人在农田劳作间歇于田埂上相遇。当时，一个极其棘手且充满争议的神学实践难题正困扰着羽翼未丰的新生教会。他们该如何寻求上帝明确的指引？只见这两位传道人倚靠在木质栅栏旁，伸手探入那鼓鼓囊囊的粗布大衣口袋，掏出随身携带、已被翻得卷边磨损的新约圣经。他们的手腕上虽然没有佩戴现代流行的“若是耶稣会怎么做”（WWJD）的时尚手环，但他们心中毫不迟疑地确信：任何现实棘手问题的合宜解决方案，必能在眼前这本至圣真道中寻得！主耶稣借着祂在世上的崇高一生以及在“登山宝训”中所颁布的神圣诫命，正是他们寻求前路方向的唯一神圣起点。", "随后，我们看见了规模宏大的查经研讨大会（Bible Conferences）。在这里，满有圣灵能力的大能布道家深入浅出、逐章逐节地剖析讲解圣经真道。全场人头攒动、座无虚席，会场后方甚至挤满了站立听道的渴慕人群；由于涌入的听众实在太多，教会不得不支搭起巨型帆布大帐篷以容纳溢出的会众。这些查经奋兴大会无论在十九世纪的俄国门诺殖民地，还是在随后的北美门诺弟兄会堂会中，都深受欢迎，成为了全会众的属灵盛宴。", "最后，我们看见教会正为某些深奥经文的精确诠释而经历着激烈的思想角力与痛苦挣扎。圣经摊开在桌前，与会者的面庞因内心的极度紧张而紧绷。面对崇拜自由尺度的难题，起初的圣经研讨并未如预期般瞬间带来完全的共识；极端的长老甚至专断地对其他同工实施了绝罚除名。在某些时刻，圣经的诠释一方面应许着属天的深层合一，另一方面却似乎激化着肢体间的摩擦张力。这要求信徒付上更深的代价，继续携手深入研经、彼此倾听。最终，在德高望重的敬虔长老带领下，全教会无论男女老幼全体成员共同在圣道面前展开深入的“信仰共同体集体辨析”（Community Discernment），圣灵奇妙地开启照亮了整个属灵家庭的悟性，最终达成了满有平安、喜乐与合一的深刻共识！", "这些源自历史深处的珍贵画卷，至今依然在当代门诺弟兄会的堂会生活中不断重现。", "全心委身于研读并绝对顺服上帝的话语，构成了我们身份认同的至深核心。本章旨在深入反思我们属灵大家庭的这一宝贵特质：我们对圣经的理解具有哪些鲜明特征？在圣经诠释方面，我们与其他福音派教会拥有哪些广泛的共同根基？又有哪些独特的视角真正属于重洗派与门诺弟兄会的特色？"], "en_paras": ["Mennonite Brethren have been “people of the Book.” Study of the Bible sparked the renewal movement that birthed the Mennonite Brethren church. Envisioning those earliest days of Mennonite Brethren life, various scenes come to mind. First, one sees small groups of people in some of the Mennonite villages of southern Russia meeting in homes for Bible study and prayer. There is a lively give-and- take around the selected Scripture texts. Discussions are informed by reading materials provided by the Christian Literature Society organized by schoolmaster Tobias Voth. Issues that prompt further study include evangelism, world mission and a growing personal relationship with Christ. The writings of Menno Simons instruct the study. There is a decidedly intellectual stimulus, but the Bible study is not merely academic. It leads to repentance, conversion, revival. Next, one sees two Mennonite Brethren ministers meeting in the fields as they go about their farming. A controversial question is troubling the young church. How will they find direction? The two ministers lean against a fence post and reach into bulging coat pockets to retrieve their New Testaments. There are no WWJD (What Would Jesus Do) bracelets on their wrists, but both assume that the practical solution to a real problem will be found in this book. What Jesus teaches through his life and the Sermon on the Mount is the starting point for their search for direction. Later, we see Bible conferences. Here dynamic preachers expound the Scriptures. High excitement is evidenced by standing-room-only attendance. Tents are erected to contain overflow crowds. The Bible conferences are popular, not only in the Russian colonies but in the Mennonite Brethren congregations of North America. Finally, we see the church struggling for clear interpretation of biblical passages. Bibles are open, and faces are taut with tension. Biblical study has not produced the expected consensus over the difficult question of freedom in worship. Elders have banned other leaders. Interpretation of Scripture promises unity even as it seems to provoke disintegration. Further study, further work together, is required. Eventually, it is community discernment in the Word, led by respected elders but including all members, that produces consensus, unity and satisfaction that the Spirit has illumined the church community’s understanding. These scenes from the past continue to be replayed in contemporary settings in the Mennonite Brethren church."]}, {"sub_zh": "福音派与敬虔主义的影响 (Evangelical Pietist Influences)", "sub_en": "Evangelical Pietist Influences", "zh_paras": ["门诺弟兄会与马丁·路德等十六世纪抗罗宗教改先驱完全共享“唯独圣经、唯独信心”（sola scriptura, sola fide）的核心神学公式。早期重洗派坚决主张：以罗马教皇为首的教阶体制权威，绝对无权擅自颁布任何违背圣经的人为教义。如同路德一样，早期重洗派学者大多精通希伯来文与希腊文圣经原文，并坚定主张圣经必须被翻译成普通平民妇孺皆懂的母语方言。门诺弟兄会虽然缺乏路德那样繁琐的经院学术外衣，但完全继承了改教家对圣经作为“信仰与生活唯一权威准则”的磐石般信心，并欣然接纳了包含66卷书的抗罗修正典全书。", "在门诺弟兄会对圣经的使用历程中，多种神学潮流的交织影响显而易见。门诺弟兄会自诞生之日起，便展现出对外界纯正神学思潮格外开放接纳的胸襟。这在很大程度上与其诞生的特殊历史语境息息相关：十九世纪中叶原本相对封闭自守的俄国门诺社会，正逐步向外界的技术、教育、文学以及宗教思潮大门敞开；这种时代的开放，恰好与信徒内心深处对经历上帝更深同在的迫切渴望相撞击。", "在深刻塑造门诺弟兄会圣经诠释进路的思潮中，主要包括了：十六世纪激进重洗派传统、十九世纪欧洲敬虔主义运动（Pietism）、以及主流福音派神学（含基要主义、浸信会神学以及灵恩运动）。相比于大多数其他门诺宗派分支，门诺弟兄会受保守福音派神学资源的滋养尤为深厚。这种开放胸襟在极大地坚固信徒忠贞作门徒的同时，也在一定程度上给自身特质带来了挑战与张力。", "路德宗敬虔派牧师爱德华·维斯特为十九世纪俄国门诺大觉醒做出了不可磨灭的历史贡献，而敬虔主义的深远影响在此后一个半世纪中始终伴随着门诺弟兄会。在此有必要对“敬虔主义”（Pietism）这一术语作一番澄清：“敬虔”（Piety）通常是一个饱含褒义的词汇，用以描绘纯洁圣洁的生活；而“伪善的敬虔”（Piousness）则带有贬义色彩，往往令人联想到法利赛人自以为义的虚伪嘴脸；“敬虔主义”则是一场深切强调个人内在真实宗教生命体验的属灵运动，它坚信内住的圣灵当下正真实临在、大能运行，并持续在信徒生命中结出属灵成长的硕果。", "在权威专著《唯有圣灵的宝剑》（Only the Sword of the Spirit, 1997）中，雅各布·洛温（Jacob Loewen）与韦斯利·普里布（Wesley Prieb）精辟梳理了门诺弟兄会深蒙敬虔主义滋养的七大宝贵恩泽：", "重视个人与家庭小型查经祈祷小组；", "切切呼召人必须在清晰意识下做出信靠救恩的明确个人决志；", "渴望在心灵深处经历与上帝面对面的真实相遇；", "充满温暖融洽的基督徒肢体相交团契；", "高度聚焦于白白的救赎恩典、基督荣耀再临、个人传福音见证以及跨宗派基督徒在主里的合一；", "确信上帝对个人参与教会教牧领袖服事的清楚呼召。", "从教会历史上看，浸信会（Baptist）对门诺弟兄会的影响既可被视作一支独立的外部力量，亦可被归入这一广阔的敬虔潮流之中。正如敬虔派一样，德国浸信会之所以迅速被俄国门诺信徒所接纳，是因为双方完全共享德意志语言与文化底色，且同样极力倡导个人重生、深入研经与火热布道。此外，浸信会对门诺弟兄会的影响尤为深远：它直接影响了门诺弟兄会建立全会众参与的堂会治理模型；曾为早期弟兄会提供了一份非正式采纳的权威信仰宣言蓝本；并进一步坚固确立了门诺弟兄会将全身浸礼作为圣经唯一合宜洗礼方式的神学决定。", "在当代，那些坚定强调重生得救、圣经绝对权威、基督十架代赎大功、以及热心投身慈惠关怀与福音宣教的基督徒，被通称为“福音派”（Evangelicals）。门诺弟兄会与广义福音派在个人布道热忱、保守稳健的圣经诠释、崇尚个人敬虔生活以及唯独恩典得救等核心教义上完全同气连枝。我们通过积极加入全美及全球福音派联会、普世宣教差会以及各类跨宗派福音机构，大力推动福音派大家庭的深入合作。", "此外，门诺弟兄会历史上对生命经历体验与圣灵持续作工的看重，也使得部分堂会自然敞开接纳了现代灵恩运动的某些积极成分：许多堂会在当代敬拜赞美诗歌与神学思考中吸收了灵恩派的养分，对圣灵的恩赐彰显、信主后圣灵更新的生命经历、以及属灵争战等议题保持着探求兴趣。门诺弟兄会内部至今仍在持续展开坦诚神学对话，辨析这些思潮与我们独特的重洗派神学底色之间的契合与张力。", "然而，客观而言，敬虔主义与福音派思潮并非在所有层面上都对门诺弟兄会产生全然正面的促进。正如洛温与普里布所警示的几大潜在弊端：", "过分强调特定日期的个人决志时刻：容易过度催化情绪主义，而忽视了许多人归信基督实际上是一个长期潜移默化的渐进生命历程。", "过度聚焦于个人内省灵性：容易将信仰私密化（Private Faith），进而无形中侵蚀瓦解了重洗派最为核心的新约教会观——即顺服与作门徒必须牢牢根植于看得见的教会信徒团契共同体之中。", "与早期浸信会的部分交往：在历史上曾引发门诺弟兄会与其他传统门诺弟兄宗派之间某些不必要的伦理与教义摩擦。", "德国浸信会及部分敬虔派对世俗军国主义的妥协接纳：在根本上与门诺派对于耶稣非抵抗和平教导的执守背道而驰。"], "en_paras": ["Commitment to studying and obeying the Word of God is at the core of who we are. This chapter reflects on this important quality of our family life. What characterizes our understanding of the Bible? What do we have in common with other evangelical churches regarding biblical interpretation? What perspectives are distinctly Anabaptist and Mennonite Brethren? Mennonite Brethren share with Protestant reformers like Martin Luther the formula sola scriptura, sola fide : the Bible alone, faith alone. The early Anabaptists agreed that a hierarchical church authority, headed by the pope in Rome, had no right to decree Christian doctrine. Like Luther, early Anabaptist Bible students were experts in reading the Bible in their original languages, and they agreed that the Bible should be translated into the common language of the people. Mennonite Brethren, while lacking the academic sophistication of Luther, shared the reformer’s confidence in the Bible as the only guide for faith and life. They also accepted the Protestant canon of 66 books. Several influences are evident in the Mennonite Brethren use of Scripture. The Mennonite Brethren have been particularly open to outside theological influences. Perhaps this is due to the circumstances of their birth.", "The relatively closed Mennonite society of mid-century Russia was opening to a larger world of technology, education, literature and religious ideas. This opening coupled with an intense desire for a deeper experience of God marked early Mennonite Brethren experience. Among the movements that have affected Mennonite Brethren interpretation are 16th century Anabaptism, 19th century European Pietism and mainstream evangelicalism (including fundamentalism, Baptist theology and charismatic movements). More than most other Anabaptist-Mennonite groups, the Mennonite Brethren have been influenced by conservative Christian sources. This openness has both strengthened faithful discipleship and threatened it. Eduard Wuest, a Lutheran Pietist, contributed significantly to the religious awakening among Mennonites in Russia, and Pietism continues to influence the Mennonite Brethren experience one-and-a-half centuries later. An explanation about the term “Pietism” is in order. Piety, usually a word with positive connotations, describes holy living. Piousness, on the other hand, has negative overtones and is associated with Pharisaic self-righteous hypocrisy. Pietism is a movement that emphasizes the personal religious experience. It carries the expectation that the Holy Spirit is present, active and powerful in producing spiritual growth. In their book, Only the Sword of the Spirit (1997), Jacob Loewen and Wesley Prieb summarize the positive themes for which Mennonite Brethren are indebted to the Pietist movement. They include personal and small group Bible study; the call for a conscious and personal decision to accept salvation; a deeply-felt encounter with God; warm Christian fellowship; an emphasis on grace, Christ’s return, personal evangelism and Christian unity; and a personal sense of God’s call to congregational leadership. Historically, the Baptist influence on Mennonite Brethren can be identified as a separate force. Theologically, however, the Baptists hold enough in common with the Pietists that their influence can be included under that broad stream. Like the Pietists, the German Baptists were accepted because they shared the German language and culture with the Mennonites. Like the Pietists, they encouraged personal conversion, Bible study and evangelism. The Baptists were also important to Mennonite Brethren for influencing a congregational model of church governance, supplying an early confession of faith (that was informally accepted for a time) and reinforcing the decision to institute immersion as the mode of baptism. Today, Christians who stress conversion, the authority of Scripture, atonement through the cross and ministries of care and evangelism are called “evangelicals.” Mennonite Brethren share with evangelicals a concern for personal evangelism, conservative biblical interpretation, personal piety and salvation by grace. We promote evangelical cooperation by joining national evangelical and mission organizations. We cooperate in broader evangelistic outreach and parachurch agencies. The historical emphasis on experiential faith and the ongoing work of the Holy Spirit has also opened Mennonite Brethren to continuing charismatic influences. Many Mennonite Brethren churches have adopted much of the music and theology of these movements. Charismatic sign gifts, post-conversion experiences of the Holy Spirit and spiritual warfare have attracted interest. Mennonite Brethren continue to converse with one another about the compatibility of these influences with our particular theological perspective. Not all aspects of Pietism and evangelicalism have positively influenced the Mennonite Brethren church. Loewen and Prieb, for example, identify the following concerns. Emphasis on a personal conversion experience at a specific date intensifies the emotions involved and misunderstands the fact that coming to faith usually involves a process. Emphasis on personal spirituality suggests a private faith and erodes Anabaptist understandings of the New Testament, which places obedience and discipleship within the church community. Historically, the Mennonite Brethren church’s Baptist connections created various ethical and doctrinal tensions between Mennonite Brethren and other Mennonites. Finally, the militaristic orientation of the German Baptists and some of the Pietists is alien to the Mennonite understanding of Jesus’ teaching."]}, {"sub_zh": "重洗派对圣经的诠释 (The Anabaptist Interpretation of Scripture)", "sub_en": "The Anabaptist Interpretation of Scripture", "zh_paras": ["门诺弟兄会由衷认同并深切感激敬虔主义与保守福音派对其圣经理解的塑造；但与此同时，门诺弟兄会始终坚定坚称：自己的圣经进路具有极其鲜明的独特性，因为我们完整承袭并持守了重洗派独树一帜的圣经诠释学（Hermeneutic）！这一独特特质尤为体现在我们看待圣经全书的宏观架构、以及坚持在“信仰共同体”中集体诠释圣经的实践之上。", "在圣经观的宏观架构上，早期重洗派开创性地实践了“基督聚焦的正典观”（Focused Canon），这与传统上僵化的“平面正典观”（Flat Canon）形成了极其鲜明的对比（洛温与普里布语）。", "所谓“平面正典观”，主张既然整本圣经的每一句话都是上帝神圣默示的真道，那么经文中的每一个字句、每一处历史记载在指导基督徒今日生活时，都应当被赋予绝对同等的权威分量。持有这种平面进路的人往往得出结论：旧约圣经主要是针对古代地缘政治国家而写，因此旧约中神许可以色列动用刀剑军队征战的记载，在今天依然可以成为现代基督徒支持国家发动世俗战争与动用死刑的神圣借口；同时，该进路将新约圣经仅仅简化为针对个人私德的道德指导，进一步助长了个人主义式的灵修避世倾向。平面正典观的致命硬伤，在于它未能将耶稣基督活生生的生平言行与十字架榜样作为整本圣经正典的终极圆心，并且严重歪曲或彻底忽视了旧约圣经中对于圣约伦理关系、公义公平以及怜悯关顾寄居异客的核心呼声！", "与此截然相反，门诺弟兄会坚决奉行“基督聚焦的正典观”！这种神圣进路绝非将圣经的某些部分贬低为次要，而是精准揭示了整本圣经大救赎信息的完美合一性：基督正是这全部启示的心脏与锚点！在诠释圣经的过程中，没有任何一卷正典书卷被忽视遗漏，但整本圣经从创世记到启示录的全部字句含义，唯有通过耶稣基督的生平、受死、复活与十字架圣训，才能真正被正确理解与终极照亮！", "此外，门诺弟兄会全然承袭了重洗派著名的“共同体释经学”（Community Hermeneutics / 信仰社群集体辨识）。这意味着：我们对圣经权威真道的正确诠释，绝非取决于某个主教阶层的专断权威，亦非取决于某个神学名家的闭门造车，而是完全取决于全体神家里的人作为属灵大家庭，在圣灵的光照下一同诵读、共同辨明神的心意！", "共同体释经在激进宗教改革破晓时分以及门诺弟兄会诞生的关键时刻，均扮演了决定性的角色。想当年，正是因为共同体释经的核心分歧，导致了格列伯等人与瑞士改教大师慈运理的公开决裂：慈运理屈从于苏黎世世俗市议会的政治权势，允许世俗政客限制并阉割教会对新约圣经真理的践行；而重洗派先驱坚决主张：唯有蒙恩得救的信仰共同体，才有资格一同查考圣经，并必须毫不妥协地将共同体所领会的圣经真理在每日生活中彻底付诸实践！同样，十九世纪五十年代俄国门诺殖民地的伟大复兴，正是从一户户信徒围坐在一起的家庭查经小组中破土而出的。早期门诺弟兄会化解一切重大神学争议的法则，从来不是某个权威领袖的个人一言堂，而是整个信仰共同体一同在圣道面前深切研讨祈祷，限制任何个人的绝对权力，最终孕育出一批批全员积极参与的查经大会。"], "en_paras": ["Mennonite Brethren recognize and appreciate that Pietism and conservative evangelicalism have shaped their interpretation of the Bible. But Mennonite Brethren also hold that their approach to Scripture is distinctive because they retain an Anabaptist “hermeneutic” or method of interpretation. This is seen particularly in their approach to the Bible and in interpreting Scripture as a faith community. The early Anabaptists practiced a “focused canon,” in contrast to a “flat canon” (Loewen and Prieb). The flat canon argues that, since the Bible is the Word of God, every word must be given equal weight. This approach therefore concludes that the Old Testament primarily addresses nation states and sanctions the use of military force. The same approach sees the New Testament as addressing primarily individuals and reinforces the pietistic emphasis on individual encounter with God. The flat canon fails to give primary weight to the life and teachings of Jesus, who is seen by Anabaptists as the canon’s center. The flat canon also distorts or misses the Old Testament emphasis on covenant relations, justice and concern for the stranger. Mennonite Brethren follow the focused canon approach. This practice does not relegate parts of the Bible to secondary status; rather, it reveals the unity of the biblical message. Christ is at the heart of this message.", "Nothing in the canon is ignored in the interpretive process, but the meaning of all parts is understood through the life of Jesus. Mennonite Brethren also accept the Anabaptist notion of “community hermeneutics,” also known as “community interpretation.” This means that our interpretation of Scripture depends on the process of reading and discerning the Bible together as a Christian family. Community hermeneutics was important in the early days of the Anabaptist reformation and in the birth of the Mennonite Brethren church. It was the issue that caused the Anabaptists to split with the reformer Ulrich Zwingli in the Swiss reformation of the early 16th century. Zwingli allowed civil authorities to limit the church’s practice of, and understanding of, the New Testament. The Anabaptists insisted that the community of faith should read the Bible together, then put its understanding of the Bible into practice. Similarly, the 1850s renewal in the Russian Mennonite communities was born of Bible study in small groups. The early Mennonite Brethren settled controversial questions by deliberating together as a community of faith and limiting the authority of individuals, even if they were leaders. They developed the practice of Bible study conferences, in which biblical texts were explained and studied together."]}, {"sub_zh": "门诺弟兄会的圣经诠释原则 (MB Principles of Interpretation)", "sub_en": "MB Principles of Interpretation", "zh_paras": ["在正式颁布的《门诺弟兄会信仰宣言》（MB Confession of Faith）第二条中，我们庄严确立了指导圣经诠释的三大核心神学原则：", "全本圣经皆是圣灵所神圣默示的；", "同一位保惠师圣灵亲自引导信仰共同体正确诠释这默示的圣经文本；", "主耶稣基督是诠释并遵行整本圣经的终极透镜与绝对权威。", "让我们对照《门诺弟兄会信仰宣言》第二条的庄严条文，深入领会这三大原则："], "en_paras": ["The MB Confession of Faith recognizes three specific principles of biblical interpretation. First, the entire Bible is Spirit-inspired. Second, the Holy Spirit guides the community of faith to interpret the Spirit-inspired text. Third, Jesus is the lens through which all Scripture is to be interpreted. Let us consider these three principles by referring to the MB Confession of Faith (Article 2)."]}, {"sub_zh": "原则一：圣经是上帝完全可靠的话语，是信仰与生活的权威指南", "sub_en": "Principle 1: Infallible Word of God", "zh_paras": ["“我们信全部圣经都是上帝藉着圣灵所默示的……我们接纳圣经为上帝完全可靠（infallible）的话语，是基督徒信仰与生活的权威指南。”（马太福音 5:17-20；提摩太后书 3:14-17）", "当我们宣告圣经是神圣默示时，我们所宣告的正是圣经至高无上的神圣权威。圣经之所以成为我们一生的绝对指南，完全因为它是永活上帝亲自向我们所说的话语。门诺弟兄会欣然采纳大公教会传统的经典范畴来描述上帝的启示：我们承认上帝借着受造的浩瀚宇宙、历史中的公义审判与奇妙恩典、以及人类内心的道德良知向全人类说话，这被称为“普遍启示”；然而，唯有通过上帝的“特殊启示”，我们才能得知上帝主动在历史中借着亚伯拉罕、摩西、大卫、耶利米等先知与以色列立下圣约；更是借着这一特殊启示，上帝在道成肉身的耶稣基督身上，将其自身的本体全然向世人显明！而这写成文字的圣道——圣经——正是上帝使这无价的特殊启示世代长存、白白赐予我们的属天宝库。", "在二十世纪七十年代北美福音派爆发的关于“圣经无误论”（Inerrancy）的激烈神学论战中，门诺弟兄会学者与教牧领袖曾深入探求最合乎圣经本意的精确措辞。支持“无误论”字眼的人主张，圣经原稿在科学、地理与历史细节上同样字字绝对无误；而另一批门诺弟兄会学者则严谨指出：圣经最初的原本手稿早已不复存在，且圣经本身的著书主旨从来不是为了充当现代自然科学或地理学的权威教科书，圣经作者在记叙宇宙时完全采用了其所处历史时代的日常表达方式。", "经过深思熟虑与共同辨识，门诺弟兄会在《信仰宣言》中最终确立了两个更为深邃、平衡且扎实的圣经要点：", "首先，圣经是“上帝完全可靠无谬的话语”（the infallible Word of God）。这一神圣宣告坚固了我们的信心：圣经在引领我们认识上帝拯救旨意与圣洁心意上，绝不可能误导我们，它是向上帝儿女启示真理的完全值得信赖的源泉！", "其次，圣经是“信仰与生活的权威指南”（authoritative guide for faith and practice）。我们的焦点绝非仅仅停留在拥有教义上的“纯正信条”（Orthodoxy，正统信仰），更是全力聚焦于在每日生活中活出“纯正的顺服践行”（Orthopraxis，正道实践）！圣经拥有至高权柄呼召基督徒天天舍己跟从耶稣的十字架道路；基督生平与教训的神圣权威，赋予了教会按马太福音18章实施救赎性教会纪律的神圣使命。圣经正是这蒙救赎圣约共同体活出忠心见证的永恒灯塔。"], "en_paras": ["“We believe that the entire Bible was inspired by God through the Holy Spirit…. We accept the Bible as the infallible Word of God and the authoritative guide for faith and practice” (Matthew 5:17-20; 2 Timothy 3:14- 17). When we confess that the Bible is inspired, we are speaking about the authority of Scripture. The Bible is our guide because it is God’s Word to us. Mennonite Brethren accept traditional, orthodox categories to describe the revelation of God. We recognize that God speaks through creation, God’s judgments and grace and human conscience; this is called general revelation. But only through God’s special revelation do we learn that God initiated a covenant relationship with Israel through Abraham, Moses, David, Jeremiah and others. Through special revelation, God communicated the very being of God in the person of Jesus Christ. The written Word, the Bible, makes God’s special revelation available to us.", "Mennonite Brethren have struggled to find the proper terminology to describe their high view of Scripture. In the fundamentalist evangelical debate of the 1970s, some argued for use of the phrase “inerrancy of the Bible.” For most of those favoring this term, inerrancy described the original documents (as penned by the biblical authors) as including truth about science, geography and history, in addition to theological truth. Other Mennonite Brethren argued in favor of a different terminology. They pointed out that the original documents are no longer available to us. They noted that the Bible does not claim authority in matters such as science and geography. In fact, biblical authors seemed to adopt the conventions of their day in speaking about the universe Mennonite Brethren have settled on the language in our Confession of Faith to make two emphases. First, the Bible is “the infallible Word of God.” This term supports the understanding that the Bible cannot mislead us regarding God’s will. It is a completely reliable source for revealing God’s Word to us. Second, the Bible is “the authoritative guide for faith and practice.” Our emphasis is not simply on right doctrine (orthodoxy) but on faithful obedience (orthopraxis) as well. The Bible has the authority to call Christians to follow the way of Jesus. The authority of Christ’s life and teaching is passed to the church as a call to church discipline (Matthew 18:15-20). The Bible guides the faithful practice of the redeemed community."]}, {"sub_zh": "原则二：圣灵亲自引导信仰共同体共同辨识并诠释圣经", "sub_en": "Principle 2: Community Discernment", "zh_paras": ["“我们信同一位圣灵亲自引导信仰共同体去诠释圣经。”", "如前所述，共同体释经是我们圣经观中不可或缺的灵魂所在。在具体的教牧实践中，门诺弟兄会的共同体释经展现为：我们热烈鼓励每一位信徒在个人灵修和小组团契中勤勉研读圣经。那些长期委身于信徒团契生活、因熟练掌握圣经原文语言与文学体裁等释经工具而具备恩赐的圣经教师与学者，在诠释过程中提供专业的辅助；然而，任何教师绝不因其拥有高深的神学学位而享有凌驾于全教会之上的专断霸权，他们乃是与全教会所有忠心贡献恩赐的弟兄姊妹一同平等服事！", "当某个神学或伦理实践议题过于复杂或在地方堂会引发争议时，我们绝不擅自独断，而是主动虚心寻求更广泛的弟兄姊妹的智慧。我们极力效法《使徒行传》15章的历史典范——当年外邦人加入教会的资格引发剧烈争端时，使徒与长老齐聚耶路撒冷大会同心商议。门诺弟兄会历来设立由德高望重的教牧同工组成的专责委员会（历史上曾称为“信仰与生命委员会”或“咨询与建议委员会”），负责梳理需要全教会深入交通的重大议题。该委员会潜心研究后，会正式召集全教区性质的“神学研讨研读大会”（Study Conference），广邀全教会代表通过专题论文、讲道阐释以及小组研讨，共同在神面前查考圣经。委员会随后汇集全会众所达成的广泛圣灵感动共识，将其凝练为决议提案，提交给全体堂会正式代表大会（Convention）进一步审议表决，最终确立为全宗派共同恪守的指引。", "这种神圣的共同体释经运作于四大基本神学前提之上：", "圣灵的光照：我们深信保惠师圣灵此时此刻真实内住在每一位信徒心里，大能开启我们明白经文真意；我们虽不求任何脱离圣经之外的“新启示”，但切切等候圣灵对既有圣经话语所赐下的全新洞见与照亮。", "以经解经与群体检验：整个属灵共同体有神圣责任，将一切个人所领受的感动或洞见，置于整本圣经的光照下严格检验——它是否完全合乎耶稣基督的教导？是否与新约书信及圣经全书的启示和谐一致？", "在爱心与互信中接纳差异：在共同体释经的探索中，观点分歧在所难免；真正的释经考验往往爆发于观点碰撞之时。正如保罗在哥林多前书11章19节所指出的，良性的观点碰撞有时能使经得起考验的人显明出来；而在这一切过程中，肢体间的交通必须始终充溢着基督舍己的圣爱与深沉的彼此信任。", "以生活结出的果子作为终极检验：共同体释经绝非满足于推导出漂亮的抽象教条，它的终极落脚点乃是忠心的生命实践——检验一个群体是否真正归正于圣经的试金石，正是他们每日所活出的道德与门徒生活！"], "en_paras": ["“the same Spirit guides the community of faith in the interpretation of Scripture.’’ As stated earlier, community hermeneutics is a central and distinctive element in our understanding of Scripture. In practical terms, Mennonite Brethren community hermeneutics means that Christians are encouraged to study the Bible in personal reading and in small groups. Teachers who have learned to discern God’s will by living in the community of believers and who have received interpretive tools—such as an understanding of biblical languages and literary styles—assist in the interpretation process. However, teachers do not have greater authority because of their academic preparation; they serve the community together with all who contribute their God- given gifts. When an issue becomes too complex or divisive to resolve in a local congregation, we consult our brothers and sisters. We try to follow the model of Acts 15, where delegates gathered in Jerusalem to discuss the entrance requirements into the church. Mennonite Brethren have traditionally depended on a group of leaders (called by various names in the past such as Board of Faith and Life or Board of Reference and Counsel) to identify issues in need of broader discussion. The board members study the issue and then call for a study conference, where members are invited to study the Bible through small group discussions, written papers and spoken messages. The board then discerns a consensus, which they present as a resolution to delegates from all churches at a convention, where the resolution undergoes further discussion, leading to a decision. Community hermeneutics operates with several assumptions. First, we assume that the Holy Spirit is active within believers to illumine the Scriptures. We do not expect new revelation or a new authoritative word from God, but we do expect illumination and fresh insights. Second, we believe it is the role of the community to test illumination against Scripture. Is it consistent with Jesus’ teaching, the New Testament, the Bible as a whole? Third, we can expect differences of opinion. Community hermeneutics is tested in times of conflict. While conflict may be healthy (1 Corinthians 11:19), communication in these situations must be characterized by charity and mutual trust. Fourth, community hermeneutics calls for faithful practice, not simply true doctrine. The test of a biblical people is their lifestyle. 3. We believe that “God revealed Himself supremely in Jesus Christ, as recorded in the New Testament.” Here our Confession reminds us that we hold to a Christ-centered interpretive strategy, one of the convictions of Anabaptist theology."]}, {"sub_zh": "原则三：耶稣基督是诠释整本圣经的核心透镜与最高峰", "sub_en": "Principle 3: Christ-Centered Lens", "zh_paras": ["“我们信上帝在耶稣基督里将自己至高无上地全然启示出来，正如新约圣经所明确记载的。”", "在此，《信仰宣言》振聋发聩地提醒我们：门诺弟兄会毫不动摇地持守重洗派神学的定海神针——“以基督为中心”（Christ-centered）的圣经诠释进路！", "耶稣基督的位格、生平、十字架舍命与荣耀教训，将不可见之独一真神的丰盛完完全全彰显无遗！因此，耶稣基督本身就是诠释整本圣经的唯一终极透镜，也是信徒顺服遵行圣经的至高权威！", "这一神圣原则在神学上常被称为“渐进启示”（Progressive Revelation）。某些世俗自由派学者曾曲解此词，将其套用为宗教进化的达尔文假说（宣称早期以色列人的上帝观念极其粗鄙野蛮，后随文明演进而逐步完善）；这绝非门诺弟兄会的立场！我们坚信：整本圣经是一部上帝在历史中展开宏伟救赎大工的宏大救恩史诗；随着救赎历史的不断推进，人类对上帝永恒神圣旨意的认识日益清晰圆满。从创世之初，上帝就是唯一的创造主与救赎主；随着上帝在历史中的作为层层展开，我们得以更加精准透彻地领会祂的计划。而在道成肉身的基督耶稣身上，我们获得了洞察上帝心肠的最荣耀、最透亮的新洞见！这活泼的道——耶稣基督——使我们终于能够豁然开朗地读懂旧约圣经中那些先前幽暗不明的段落！", "因此，门诺弟兄会确信，阅读与诠释整本圣经的正确起点，乃是主耶稣亲自颁布的“登山宝训”（马太福音 5–7章）及其平行经文。我们深信，登山宝训绝非某种遥不可及、留待遥远未来所谓“千年天国”才去履行的乌托邦空想，而是耶稣向当下活在地上的今日教会所发出的极其现实、迫切且必须履行的神圣门徒训令！", "在耶稣所宣告并呼召我们全力投身的神国统治中，祂着重展开了三大震动世界的核心主题：", "赐福给贫穷人：彻底的慷慨简朴", "耶稣的开篇宣告，便是天国的福音首先要传给贫穷无告之人（路加福音 4:18-19）。耶稣反复叮咛门徒要从对世俗物质财富的贪恋缠累中彻底脱释出来，放胆活出激进的舍己奉献与慷慨周济。将“简朴的生活”作为“基督舍己之爱”的自然流露，正是重洗派以基督为中心释经学的鲜明标识。", "呼召门徒作和平缔造者：爱与非抵抗", "当我们认罪悔改归主时，我们便在基督里与上帝和好，得享真实的属天平安；而这内心的深沉平安，强力驱动我们竭力与身旁的众人追求和平与和睦——从我们的至亲骨肉家庭开始，扩展到我们所在的社区邻舍，甚至毫不保留地延伸到逼迫我们的仇敌身上！我们坚定视其为基督徒作门徒生涯不可分割的核心命脉。", "呼召建立圣约共同体：彼此相属的神圣家庭", "耶稣深刻教导：要在这个堕落世道中活出登山宝训那看似“不可能完成的崇高伦理”，唯一的可能途径就是与我们在基督里的弟兄姊妹同心携手、并肩前行！作世上的盐、世上的光，绝非个人英雄主义式的孤胆游侠号召，而是主向我们发出的神圣请柬——邀请我们全身心融入一个看得见的圣约共同体：永生神的教会家庭！", "门诺弟兄会的圣经诠释战略无时无刻不在提醒着我们：查考圣经的崇高终点，绝非仅仅为了满足头脑知识的积累或神学概念的思辨，而是为了在圣灵的大能中，完完全全、甘心乐意地效法顺服耶稣基督的圣洁榜样！我们在圣经每一页文字中与基督深情相遇，欣然领会祂向我们所呼召的舍己大爱、慷慨慈惠、缔造和平的生命圣道；并万分感恩地置身于一个热烈教导并忠心践行这种天国生活方式的属灵大家庭之中！"], "en_paras": ["Jesus’ person, life and teaching reveal God, and thus Jesus is the lens through which all Scripture is to be interpreted, and the authority by which it is to be obeyed. This interpretive principle has sometimes been called “progressive revelation.” Some scholars use this term to mean that religion generally, and Israelite religion specifically, began with crude ideas about God that were refined through an evolutionary process. This is not the view of Mennonite Brethren. Rather, we see the Bible as the story of God’s work in the world. As the story progresses, so does our understanding of God’s purpose. From the beginning, God works as Creator and Redeemer. As God’s work unfolds, we are better able to interpret God’s purposes. In the person of Christ, we gain significant new insight into God’s will. This new Word, Jesus Christ, enables us to make better sense of parts that were formerly unclear. We understand that the place to begin biblical interpretation is Jesus’ Sermon on the Mount (Matthew 5-7) and its parallel texts. We take these texts as Jesus’ challenge to the church today, not as an idealistic program for some future kingdom of heaven. Jesus develops three themes in his proclamation of the kingdom of God in which we participate. First, he blesses the poor. Jesus’ message is that God’s rule is good news for the poor (Luke 4:18-19). He speaks frequently about freedom from the attachment to things. He calls for radical generosity. Generosity as an expression of simplicity is one of the themes of Anabaptist Christ-centered interpretation. Second, Jesus calls his followers to peacemaking. When we confess our sins, we have peace with God. That inner peace motivates us to pursue peaceful relationships with those around us, beginning with our families, our communities and even extending to our enemies. We see this as a vital part of Christian discipleship. Third, Jesus calls for community. Jesus teaches that the only way to practice his impossible ethic is together with our brothers and sisters. Being salt and light in the world is not a call to radical, rugged individualism. It is an invitation to a covenant community, the church family. The Mennonite Brethren interpretive strategy reminds us that the end of Bible study is not simply knowledge or understanding, but faithful obedience to the example of Jesus. We meet Jesus in the text and discover he asks for extravagant generosity. He models life-giving peacemaking. He invites us to be part of a family that teaches and practices this kingdom lifestyle."]}]}, {"num": 7, "id": "chap-05", "badge_label": "CHAPTER 7", "title_zh": "第五章：新约教会", "title_en": "Chapter 5: The New Testament Church", "desc": "家庭的扩增：全人宣教与生命重生 (Growing the Family)；救赎性的教会纪律 (Redemptive Discipline)；洗礼与主的晚餐：两项神圣记号 (Baptism and the Lord’s Supper)。", "blocks": [{"sub_zh": "第 5 章：新约教会 (The New Testament Church)", "sub_en": "CHAPTER 5", "zh_paras": ["在当今科技时代，追溯家族谱系变得前所未有的便捷。通过各类家谱寻根网站，任何人都可以轻松查阅远祖亲属的出生证明与跨洋移民档案。在家谱寻根已成为风靡北美的普遍爱好的今天，作为门诺弟兄会的信徒，我们同样由衷热爱追溯我们属灵大家庭的古老根脉。", "我们坚定将公元一世纪的新约初代教会，视为我们信徒共同体生活的神圣典范。我们细致研读《使徒行传》与使徒保罗的书信，从中寻觅维系属灵大家庭关系的宝贵原则；四福音书更是引领我们聆听我们的长兄——主耶稣基督——对于属灵家庭生活的亲切训诲。", "对新约起源的探寻，自然点燃了另一项深沉的关切：我们该如何在当下的地方堂会中，与最亲密的属灵家人彼此相待？在本章中，我们将深入反思新约教会的圣经模型，以及那些将门诺弟兄会紧紧维系在一起的家庭优良传统。正如某些血亲家族因共有的一头红发或非凡的音乐天赋而格外引人注目一样，门诺弟兄会同样以一系列极其鲜明、甚至独树一帜的属灵家庭价值观而享誉世界。"], "en_paras": ["Tracing family trees is easier than ever. Through ancestry.com or FamilySearch.org individuals can access distant relatives’ birth and immigration records. Genealogy has grown so popular as a hobby that in parts of North America it is second only to gardening. As Mennonite Brethren, we too like to trace our family back to its roots. We see the first-century church as the model for our life together as believers. We study the book of Acts and Paul’s letters for clues about family relations. The Gospels also direct us to what Jesus, our eldest brother, has to tell us about family life. Interest in our New Testament origins sparks a second interest. How are we related to our closest church family members? In this chapter, we want to reflect on the New Testament church model and some of the family traditions that tie us together as Mennonite Brethren. Just as some biological families stand out because they share the trait of red hair or unusual musical talents, so we as Mennonite Brethren are known for family values that are prominent, perhaps even unique."]}, {"sub_zh": "家庭的扩增：全人宣教与生命重生 (Growing the Family)", "sub_en": "Growing the Family", "zh_paras": ["新约圣经深刻教导：健康美好的属灵家庭生活，是信徒与天父维系亲密生命关系的不可或缺之沃土。正如初生婴孩唯有诞生在一个充满爱与关怀的家庭中才能获得最健康的哺育一样，在属灵层面上，传福音与生命重生同样是整个属灵大家庭的集体圣工。", "我们的《信仰宣言》第七条（“教会的使命”）精准指出了关于福音宣教的两大并立真理：", "首先，传福音是每一位信徒不可推卸的个体使命：“圣灵赐大能给每一个基督徒，为上帝的救恩作见证。”", "其次，传福音是我们作为大家庭日常生活的自然流露：“教会作为一个整体身体，在世上见证上帝的掌权统治。借着自身作为一个蒙救赎且从世俗罪恶中分别出来的圣洁共同体，教会向全世界彰显了上帝拯救的浩瀚旨意。”", "新约时代的教会，是一间极富宣教烈火的教会。《使徒行传》一再惊人地记载了成千上万的人悔改归主、认罪受洗、并欣然加入上帝荣耀大家庭的壮丽盛况。五旬节——这“教会的诞辰日”——本质上正是一场全会众齐心合力的大能集体见证（使徒行传 2:2, 14）。", "正如我们在前文所见，十六世纪的重洗派教会拥有炽热无比的宣教心志；十九世纪孕育出门诺弟兄会的俄国门诺大复兴，同样完全浸润在宣教的烈焰之中。今天的门诺弟兄会继续将福音布道作为全教会的核心焦点：充满健康活力的门诺弟兄会地方堂会，持续通过友谊布道、特殊福音盛会、儿童与青少年培育事工、以及在自己影响所及的社区开展慈惠关怀服务，向有需要的人倾注基督的爱；而在更广泛的宗派总会层面上，门诺弟兄会更是携手在北美及全球各地大举拓植建立崭新的教会！"], "en_paras": ["The New Testament teaches that good family life is essential for a healthy relationship with the Father. Just as babies are nurtured best when they are born into a family, so evangelism and conversion are family affairs spiritually. Our Confession of Faith (Article 7, “Mission of the Church”) points to twin truths regarding evangelism. First, evangelism is the responsibility of every believer: “The Holy Spirit empowers every Christian to witness to God’s salvation.” Second, evangelism is a function of our life as a family. “The church as a body witnesses to God’s reign in the world. By its life as a redeemed and separated community the church reveals God’s saving purposes to the world.” The New Testament church was an evangelistic church. The book of Acts repeatedly records astonishing numbers of people who repent, believe, are baptized and join the family of God. Pentecost, “the birthday of the church,” was an event of corporate witness (Acts 2:2, 14). The 16th century Anabaptist church, as we saw earlier, was keenly evangelistic. The 19th century Russian Mennonite awakening which produced the Mennonite Brethren church was evangelistic in character. The contemporary Mennonite Brethren church continues to make evangelism a focus. Healthy Mennonite Brethren congregations continue to plan local outreach through friendship evangelism, special events, children and youth programs and ministries to people in need in their circles of influence. As a larger family, Mennonite Brethren plant churches in North America and around the world."]}, {"sub_zh": "救赎性的教会纪律 (Redemptive Discipline)", "sub_en": "Redemptive Discipline", "zh_paras": ["在新约教会这个属灵大家庭中，充满爱心的管教与纪律，是维系属灵肢体之间、以及肢体与上帝之间健康生命的必要保障。我们的《信仰宣言》第六条深入阐明了门诺弟兄会对“教会纪律”的独到理解：其至高目的，绝非为了定罪惩罚或冷酷排挤，而是为了以牺牲舍己的爱，将跌倒走迷的软弱弟兄姊妹重新挽回、拥抱进圣洁的相交团契之中（马太福音 18:15-20）。", "早期重洗派先驱将积极实践教会纪律，视作将真教会从死板堕落的国家教会中彻底分别出来的核心标志之一。十九世纪门诺弟兄会的复兴先贤，同样高度看重这一圣洁实践：他们曾痛心疾首地规劝门诺老母会，责备其竟对教牧同工与普通教友的酗酒放荡和公开不忠熟视无睹、放弃戒规。门诺弟兄会坚决主张：唯有那些甘愿生活在信实守约中的信徒，方可同领主的圣餐。", "自十九世纪六十年代建会以来，门诺弟兄会一直在努力探求教会纪律实践的合宜平衡。早期总会会议记录表明，全教区年会常常需要严肃处理具体的道德伦理实践问题。在早先岁月中，总会曾明令禁止信徒购买商业人寿保险、禁止成员间轻浮戏谑、禁止出入世俗马戏团与戏院、严禁观看世俗电视节目、以及禁止姊妹在公共敬拜中不蒙头。在今天的现代人看来，早期的许多禁令难免带有一些律法主义的色彩；然而，它们无可辩驳地彰显出历代门诺弟兄会先贤对于天国圣洁呼召所抱有的无比肃穆与严谨敬畏！", "门诺弟兄会至今依然坚定持守对基督门徒相称行为的崇高期待。我们的《信仰宣言》第十二条明确禁止信徒宣誓起誓（马太福音 5:33-38；雅各书 5:12）、严禁加入任何秘密会社（如共济会等），并抵制一切“威胁玷污基督徒纯全品格”的世俗行为。尽管此类准则在世人眼中看似严苛，但它们时刻警醒每一位信徒：决不可效法这个世界的沉沦风俗！正如一位杰出门诺学者所庄严宣告的：跟从耶稣，意味着在世人面前活出一种激进的社会非同化（Radical Social Nonconformity）——彻底拒绝与世俗罪恶同流合污！", "今天，身处一个崇尚体制化暴力、物欲横流与纵欲享乐的世俗社会中，门诺弟兄会正竭力探索如何更有力地为和平的福音作美好见证。我们与其他保守福音派信徒一样，坚决反对堕胎杀婴、坚决抵制任何放纵的性革命浪潮；同时，我们也在死刑废除、消除种族不公、男女同工在教会领导层中的服事配搭、以及基督徒财富积累与管家责任等现实议题上，持续在圣经光照下寻求深层的群体共识。"], "en_paras": ["In the New Testament church family, discipline nurtured healthy relationships between spiritual siblings and with God. Our Confession of Faith (Article 6) describes the Mennonite Brethren interpretation of church discipline: its purpose is to win the erring sibling back into fellowship (Matthew 18:15-20). The early Anabaptists described active church discipline as one act that distinguished them from the state church. The 19th century revivalists also were active in the practice of discipline. They chided the “mother church” for failing to discipline pastors and other members for drunkenness and other public expressions of unfaithfulness. Mennonite Brethren limited the celebration of the Lord’s Supper to those who were willing to live within a covenant of faithfulness. Since the 1860s, the Mennonite Brethren church has struggled to find balance in the practice of church discipline. Church records show that conference proceedings often dealt with questions of ethical practice. In the early years, the conference prohibited things such as carrying life insurance, joking and jesting among members, attending circuses and theatres, viewing television and permitting women to worship without proper head covering. Many issues of earlier times appear legalistic to contemporary observers, but they demonstrate the seriousness with which Mennonite Brethren have taken the call to holiness. The Mennonite Brethren church continues to hold expectations about behavior that fits a follower of Christ. Our Confession of Faith (Article 12) forbids the swearing of oaths (Matthew 5:33-38; cf. James 5:12), participation in secret societies and behaviors “which threaten to compromise Christian integrity.” While rules such as these may seem to border on legalism, they also serve as a reminder that the believer is not to conform to the world. One Mennonite scholar declared that following Jesus means imitating Christ in one, and only one, dimension: radical social nonconformity. Today, Mennonite Brethren struggle with knowing how to be witnesses to the gospel of peace in a society that values institutional violence, affluence and self-gratification. Rejection of abortion and sexual license are values Mennonite Brethren share with other evangelical Christians. We continue to struggle toward consensus on issues such as capital punishment, racism, sharing leadership as men and women and the accumulation of wealth.", "Baptism and the Lord’s Supper Every family has rites and passages that define membership. The Mennonite Brethren church celebrates two rites—baptism and the Lord’s Supper, which we call “ordinances” or “signs.” Using the term “sign” distinguishes Mennonite Brethren from those who emphasize only God’s mediating grace in these acts. Mennonite Brethren are also distinguished from those who emphasize that these rites symbolize only an internal reality. The notion of “sign” is a biblical term, pointing to God’s saving acts (Exodus 10:1; Acts 4:16) and to human action (Exodus 12:13). Baptism is a sign of commitment, and the Lord’s Supper is a sign of covenant loyalty."]}, {"sub_zh": "洗礼与主的晚餐：两项神圣记号 (Baptism and the Lord’s Supper)", "sub_en": "Baptism", "zh_paras": ["每一个家庭都有其界定家庭成员身份的神圣礼仪与人生里程碑。门诺弟兄会坚定持守并隆重庆祝两项神圣的礼仪——洗礼与主的晚餐（圣餐）；我们在神学上审慎地称其为“礼仪”（Ordinances）或“记号”（Signs）。", "使用“记号”（Sign）这一严谨的圣经概念，将门诺弟兄会与那些认为礼仪本身能机械传递客观救恩典礼的传统宗派（如天主教的圣礼主义 Sacramentalism）清晰区分开来；同时也使我们区别于那些将礼仪仅仅贬低为毫无属灵实质的“纯主观内心象征”的极端主观派。“记号”是深具圣经渊源的词汇，它既大能指向永活上帝在历史中所施行的客观救赎大功（出埃及记 10:1；使徒行传 4:16），又生动包含着蒙恩罪人以身心相许的真诚顺服回应（出埃及记 12:13）。简言之：洗礼是信徒向基督终生全人委身的神圣记号；而主的晚餐则是全教会对圣约持守绝对忠诚的圣洁记号！", "自新约教会诞生之日起，便有一项公开的举动，向全宇宙正式宣告一个人已被神圣领养进入上帝的大家庭：信徒在悔改认罪、公开认信耶稣之后领受洗礼，并被正式“加添入”当地可见的地方堂会之中。洗礼是跨入圣约共同体的神圣成人礼！主耶稣颁布的大使命（马太福音 28:19-20）包含着唯一的根本动词命令：“使万民作我的门徒”；而紧随其后的两个修饰从句精准界定了门徒造就的神圣路径：“奉父、子、圣灵的名给他们施洗”，并且“凡我所吩咐你们的，都教训他们遵守”。", "为什么洗礼如此至关重要？", "洗礼是借着地方堂会加入基督身体的记号（《信仰宣言》第八条）。圣经生动描绘洗礼是“归入基督”（罗马书 6:3；加拉太书 3:27；哥林多前书 10:2-4），并受洗“成了一个身体”（哥林多前书 12:13）。“归入基督”意味着实实在在地融入以基督为元首的活泼群体之中——一切旧有的阶级仇恨、种族歧视与性别隔阂都被彻底粉碎抹去；洗礼将原本背景迥异甚至曾势不两立的人，奇迹般融为一个全新的合一体。在五旬节那天，凡听从福音的人“就受了洗；那一天，门徒约添了三千人”；《使徒行传》2章42–47节描绘了随后生机勃勃的教会生活：“主将得救的人天天加给他们”（47节）。新约经文一再将“洗礼”与“加入教会”紧密捆绑：人绝不可能脱离有形的教会而孤立属于基督；人绝不能只空谈归属于所谓‘宇宙无形教会’，却对眼前有血有肉的地方可见堂会拒绝做出实质的委身委身！", "洗礼是罪得彻底洁净的圣洁记号。正如《信仰宣言》所认信的：“洗礼标志着一个人的罪恶已被宝血彻底洗净；表明其人已向神真诚悔改己罪、蒙受了赦罪之恩、并在基督里向着罪彻底死去……”对于那些借着洗礼已被彻底洗净、全然成圣的人而言，任何不道德的放荡生活都是绝对不相称的（哥林多前书 6:11）。基督已洗净了教会，要使她荣耀圣洁、毫无瑕疵（以弗所书 5:26）；洗礼所彰显的十字架大能，彻底斩断了信徒效法旧俗的退路。", "洗礼象征着承受天国永生的大能新生命。“我们深信，当人们领受上帝拯救的恩赐时，他们应当受洗……在基督里一举一动满有新生的样式！”洗礼与天国大能、基督里的丰盛生命以及出死入生的属天荣耀紧密相连（歌罗西书 2:12）——我们与基督一同埋葬，并与祂一同复活，满怀圣洁的新生力量昂首前行！", "在今天后现代世俗文化中，洗礼在多个层面上极其“冒犯”世俗的敏锐感：", "首先，它是一项看似古老格格不入的传统仪式，往往被世俗人误解为某种落伍陈旧的形式；", "其次，洗礼标志着与过去生活方式的断然决裂！在那些基督徒面临残酷宗教迫害的国度里，正是“公开受洗”这一举动界定了信仰委身的彻底转变——许多异教社会可以容忍一个人私下做一段“请耶稣进我心”的心灵祷告，但一旦他公开走入水中受洗归入基督身体，便会瞬间引来全家族的孤立驱逐甚至杀身之祸！", "第三，洗礼引发世俗激辩，因为它要求人必须毫无保留地委身于耶稣在地上有形的教会家庭！在北美许多缺乏扎实洗礼真理教导的社区中，正是这种对具体地方堂会的终生委身常常令人望而却步——许多人宁可对抽象飘渺的“无形教会”说好，却千方百计逃避对现实生活中具体、有缺点的基督徒身体做出扎实问责。然而，正如复活后的基督拥有可摸可触的真实肉身一样，基督在地上的身体永远是由一群有血有肉的真实信徒所构成的弟兄姊妹团契！", "从历史上看，重洗派先贤为了持守这一纯正圣经真理，付出了极其惨烈的血腥代价。追随罗马天主教的陈规，主流公认的改教教派依然推行婴儿洗礼，试图以此洗除原罪并将无知的婴孩强行绑入社会圣约建制之中。重洗派虽然完全赞同洗礼是加入圣约团契的必经门槛，但坚决否定父母的代求或教会的功德足以使婴儿受洗具有任何真实的救恩效力！重洗派泣血高呼：唯有每一个人在圣灵感动下，亲自对耶稣基督做出悔改重生的公众信仰告白，方能得救并加入受救赎的真信徒教会！", "十九世纪门诺弟兄会的改革先驱，正是由于坚决回归信徒洗礼而掀起了划时代的复兴。尽管俄国门诺老教会当时并未实行婴儿洗，但他们却将社会公民特权与受洗会籍捆绑，沦为了背诵死要理问答的形式主义。门诺弟兄会毅然确立：洗礼唯独为“那些口里承认、心里相信耶稣基督为主和救主，立志舍己跟从基督……能够真正明白洗礼的神圣涵义、甘愿向基督和教会彼此问责、并完全出于个人自愿渴求受洗的人”而设立（《信仰宣言》第八条）！", "受洗候选人必须主动提出受洗申请；教会随后对其进行系统扎实的真理栽培辅导，使其彻底明了受洗对加入地方堂会的圣洁责任；受洗归主的新生信徒庄严立誓，自愿置身于彼此问责、圣洁顺服的弟兄团契之中。", "在洗礼的适宜年龄上，门诺弟兄会主张应当鼓励青少年信徒耐心等候，直到他们心智成熟、能够作为真正负有责任的教会成员参与教会生活时再行受洗（通常认为少年早期为较合宜的负责年龄）。", "而在洗礼的方式（Mode of Baptism）上，门诺弟兄会确立了新约原文字义上的全身浸礼（Immersion）。克里米亚门诺弟兄会（Krimmer MB）在历史上曾拥有面向前浸水三次的独特传统。今天，门诺弟兄会完全享有在任何最合宜的水域中施浸的自由——无论是在庄严肃穆的室内洗礼池，还是在清澈奔流的江河湖泊，抑或是户外储水槽与泳池之中。在洗礼礼成之后，全教会通常会为新受洗成员举行隆重的欢迎接纳礼拜，并一同欢然领受主的圣餐。"], "en_paras": ["From the beginning of the New Testament church, one act publicly identified those who had been adopted into the family of God. Believers were baptized upon confession of faith and were “added to the number” of those who composed the local congregation. Baptism is the rite of passage into the covenant community. The Great Commission (Matthew 28:19-20) has a single command: “make disciples of all nations.” Two explanatory phrases define disciple making: “baptizing them” and “teaching them to obey my commands.” Why is baptism so important?", "First, baptism is “a sign of incorporation into the body of Christ as expressed in the local church” (Confession of Faith, Article 8). Biblically, baptism is described as “into Christ” (Romans 6:3; Galatians 3:27; 1 Corinthians 10:2- 4) and “into one body” (1 Corinthians 12:13 NRSV). The phrase “into Christ” describes incorporation into the community of which Jesus is the head. Old distinctions of class, race and gender are erased. Baptism unites very different people, even former enemies, into one body. On Pentecost, those who accepted the evangelistic message “were baptized and added to their number.” Acts 2:42-47 describes church life following Pentecost: “...the Lord added to their number daily those who were being saved” (v. 47). Both references link baptism to inclusion in the church. One cannot belong to Christ without belonging to the church. One cannot belong to an invisible, universal church without a simultaneous commitment to a local, visible congregation. Second, baptism means cleansing. In the words of the confession, “Baptism is a sign of having been cleansed from sin. That a person has repented of sins, received forgiveness of sins, died with Christ to sin...” Immoral behavior is inappropriate for those who have been washed and sanctified through baptism (1 Corinthians 6:11). Christ has cleansed the church to make her pure, holy and without blemish (Ephesians 5:26). The cleansing power of the cross, which is significant in baptism, turns believers away from their old way of life.", "Third, baptism symbolizes the new life of salvation. “We believe that when people receive God’s gift of salvation, they are baptized [They have been] raised to newness of life.” Baptism is associated with new life, life in the kingdom of God and fullness of life in Christ (Colossians 2:12). We are buried with Christ in his death and raised with him to newness of life. Baptism is offensive to modern sensibilities in several ways. First, it is an ancient rite. Baptism was a common first century marker for conversion to Christianity, Judaism and other religions and may seem like a holdover today. Second, baptism marks a clear break from the past. In regions where Christians are persecuted, it is baptism that defines the change of commitment. Some people of other religions have accepted the fact that someone prayed a “Jesus-in-my-heart” prayer, yet have ostracized, perhaps even persecuted, someone for being baptized into the community of Christ’s followers. Third, baptism provokes controversy because it demands commitment to the family of Jesus. In North American communities that lack clear teaching about baptism, it is the commitment to a specific church family that sparks controversy. Some prefer to say yes to Jesus and his universal, invisible body but to say no to the body of Christ in a specific community. Just as the resurrection body of Christ had real physicality, so the body of believers is always a community of real flesh-and-blood people.", "Historically, for Anabaptists, this biblical understanding was very costly. Following the Roman Catholic lead, mainline Reformation churches baptized infants to wash away original sin and to bring them within the covenant community. Anabaptists agreed that baptism was the rite of incorporation into the covenant community. But they disagreed that the faith of the parents or the church was sufficient for the event to have meaning. Instead, the Anabaptists taught that each member needed to make a public confession of faith in Jesus to be saved and to join the community of the redeemed. As we have seen in chapter 1, this view of baptism led to bloody persecution. The 19th century Mennonite Brethren reformers insisted on a return to believers baptism. Even though the Mennonite church in the colonies did not baptize infants, citizenship was restricted to baptized church members. Mennonite Brethren reformers were critical of other Mennonite churches that prioritized reciting memorized catechisms to the neglect of “a genuine, loving faith” brought about by the Holy Spirit. The birth of the Mennonite Brethren church forced the community to develop its own baptismal practices. How would the new church practice believers baptism? The issue of eligibility was of first and foremost concern. They concluded that baptism is for “those who confess Jesus Christ as Lord and Savior and commit themselves to follow Christ,…for those who understand its meaning, are able to be accountable to Christ and the church, and voluntarily request it...” (Article 8). Candidates for baptism must take the initiative in requesting baptism. The one requesting baptism is given instruction regarding its meaning and the ensuing commitment to the local church. Newly baptized believers commit themselves to the practice of mutual accountability for disciplined obedience. Baptism is seen as a commitment to the lordship of Christ. Mennonite Brethren congregations have struggled, at times, with the appropriate age for baptism. There is no hard-and-fast rule, but the wording of our confession is meant to encourage young believers to wait for baptism until they can function as accountable church members. Generally, early adolescence has been seen as the age of accountability. By the time they reach adolescence, most prospective baptismal candidates can understand the concepts inherent in baptism and can legitimately confess that they will renounce allegiance with the world in return for membership in God’s family. Another question for the emerging Mennonite Brethren church was that of baptismal mode. Mennonite Brethren settled on immersion. The Krimmer Mennonite Brethren branch had the distinction of baptizing forwards (usually in running water). Today Mennonite Brethren churches are free to immerse in water that best suits the purpose of the event. Some congregations use baptisteries; others find lakes or rivers; some employ tanks, tubs or swimming pools. Most congregations follow baptism with formal reception of the newly baptized members into the church and with the celebration of the Lord’s Supper."]}, {"sub_zh": "主的晚餐 (The Lord’s Supper)", "sub_en": "The Lord’s Supper", "zh_paras": ["主的晚餐（圣餐）是门诺弟兄会所恪守的第二大神圣礼仪记号。正如洗礼一样，主餐被深深理解为一个神圣的圣约事件（Covenant Event）：如果说洗礼是跨入圣约共同体的门槛记号，那么主的晚餐则是全教会作为基督奥秘身体、永保合一团契的忠贞记号！", "正如洗礼一样，主餐的真理在激进宗教改革破晓及随后门诺弟兄会诞生的过程中，起到了至关重要的枢纽作用。瑞士重洗派先贤与门诺·西蒙斯完全一致确信：圣餐中的饼与杯，乃是基督身体与宝血的圣洁记号。他们毫不妥协地彻底摒弃了天主教关于饼酒瞬间化为基督实质血肉的“化质说”（Transubstantiation），同时也拒绝了路德宗主张饼酒之中带有基督物理临在的“同质说”（Consubstantiation）。", "在1860年的沙皇俄国，门诺弟兄会先贤在教堂之外于民宅中庄严同守主餐，这一惊世骇俗的举动直接成为了他们与传统母会彻底决裂、创建门诺弟兄会的导火索。弟兄们坚信：主的圣餐是专门为忠心作门徒的得救圣徒所预备的属天筵席，决不可与那些公开纵情罪中、毫无敬虔生活见证的挂名教友同吃同喝！他们切切渴慕在家庭中以更为频繁、亲密且纯全无伪的方式守主餐。", "一系列恢宏深邃的圣经真理，塑造了门诺弟兄会对主餐的理解：", "饼与杯大能彰显了耶稣在十字架上的彻底舍命代赎。门诺弟兄会领会基督的代赎之死，既是无罪圣洁的代罪羔羊为我们偿清了死亡的罪债，更是基督在十字架上彻底粉碎幽暗魔鬼权势的伟大得胜，也是信徒在世舍己效法的终生榜样！", "“新约的杯”牢牢聚焦于圣约的主题（马太福音 26:26-29；哥林多前书 11:23-26）。正如基督肉身的身体唯独是一个，这个圣约共同体同样构成了一个不可分割的身体。与基督、与众肢体之间水乳交融的亲密团契交通（Koinonia），正是上帝属灵子民的鲜明印记；主的晚餐是全教会至死合一的圣洁象征！", "主餐满怀盼望地前瞻着未来的荣耀凯旋——即在基督荣耀再临时，基督与祂所救赎的圣洁新妇在天国弥赛亚婚筵上的大团圆！正如使徒保罗在哥林多前书11章所叮咛的：“你们每逢吃这饼，喝这杯，是宣告主的死，直等到祂来！”", "关于何人有资格领受圣餐，在历史上曾经历过诸多神学探讨。早期门诺弟兄会主要实行严格的“闭门圣餐”（Closed Communion，仅限已受全身浸礼的门诺弟兄会会友领受）；而在二十世纪八十与九十年代，面对更广泛的福音派弟兄姊妹的融入，门诺弟兄会堂会逐渐向一切真心认信耶稣为主的重生成徒敞开怀抱。", "今天，《门诺弟兄会信仰宣言》第九条极其稳健平衡地阐明：主餐的参与资格广泛向“凡真正明白主餐神圣意义、在言语和日常生活中公开认信耶稣基督为主、甘心向其所在堂会彼此问责、并在神在人面前活在纯全和睦关系之中的一切信徒”敞开！同时，宣言严肃确认新约圣经的标准典范乃是“先受洗归主，后同领圣餐”。每次走向主餐桌前，必须伴随着诚实无伪的省察己心；当教会内部出现人际摩擦或罪恶破口时，全会众有责任先在彼此认罪、真诚悔改与爱中和睦之后，方可同赴圣席。", "关于守圣餐的频率，门诺弟兄会并无死板硬性的法令，通常各堂会依惯例按月度或季度举行；而在近年来，许多堂会深感主餐对滋养信徒属灵生命具有无与伦比的重要性，已逐步调整为隔周甚至每周举行。门诺弟兄会坚决不赞同新婚夫妇在婚礼仪式上举行私密性的“两人小圣餐”，因为圣餐在本质上是一项唯属于整个教会大家庭的圣约盛事！", "此外，另一项与主餐紧密相连的古老圣约礼仪——洗脚礼（Footwashing）——在门诺弟兄会的历史长河中留下了不可磨灭的深情印记。尽管在今天的部分堂会中已不再例行举行，但在青年一代信徒中，洗脚礼作为彰显彼此相爱与合一的象征正在强势复兴。洗脚礼是一个极其动人的敬拜时刻，它深刻提醒着神家里的每一个人：“必须在教会肢体关系中，时刻彰显基督那降卑自己、舍己服事、以及洗净彼此尘劳的舍己大爱”（《信仰宣言》第六条）！"], "en_paras": ["The Lord’s Supper is the second ordinance or sign practiced by the Mennonite Brethren church. Like baptism, the Lord’s Supper is understood to be a covenant event. If baptism is the sign of entry into the covenant community, the Lord’s Supper is the sign of unity with the body of Christ. Like baptism, the meaning of the Lord’s Supper played a significant role in the origins of Anabaptism and, later, of the Mennonite Brethren church. The Swiss Anabaptists and Menno Simons agreed that the bread and the cup were signs of Christ’s body and blood. They rejected the Roman Catholic belief that the bread and the cup were changed into Christ’s body and blood (transubstantiation) and the Lutheran doctrine that the elements contained the spiritual presence of Christ (consubstantiation). In Russia in 1860, the celebration of the Lord’s Supper outside a church building was an act of defiance that eventually led participants toward separation from the Mennonite church and the founding of the Mennonite Brethren. The Mennonite Brethren held that the Lord’s Supper is an event reserved for faithful disciples and should not be celebrated with those who rejected a godly lifestyle. Further, they requested communion in their homes in order to celebrate more frequently, more intimately and in a context of greater faithfulness. A series of biblical themes informs Mennonite Brethren understanding of the Lord’s Supper. First, the bread and the cup point to Jesus’ sacrificial death on the cross. Mennonite Brethren understand Jesus’ atoning death as the payment of the death penalty by the innocent victim, as Christ’s defeat of the enemy at the cross and as a model for how Christians are to live. Second, the phrase “the cup of the new covenant” centers on the covenant theme (Matthew 26:26-29; Mark 14:22-25; Luke 22:14-22; 1 Corinthians 11:23-26). As Christ’s physical body is one, so the covenant community forms a single body. Fellowship, the product of intimate relationships with Christ and with one another, marks the people of God. The Lord’s Supper symbolizes unity. Third, the Supper anticipates the future, that is, the fulfillment of the reign of God at the messianic banquet celebrated with his redeemed church. In 1 Corinthians 11, Paul reminds the church that “you proclaim the Lord’s death until he comes” with the Supper. The Supper looks forward to the great marriage supper of the Lamb at the end of the age. The question of who should be allowed to participate in communion has often been controversial. Are only baptized believers eligible? Only those baptized as Mennonite Brethren? Do Mennonite Brethren hold to “closed” or “open” communion? In the 1980s and 1990s, many Mennonite Brethren congregations began offering communion to anyone who confessed Jesus as Savior. The new openness reflected an interest in including believers who had not yet formalized their membership, believers who had been baptized as infants but were unwilling to be rebaptized and children too young for baptism. Recognizing the practice of the church, the Confession of Faith speaks of extending participation in the Lord’s Supper to “all those who understand its meaning, confess Jesus Christ as Lord in word and life, are accountable to their congregation and are living in right relationship with God and others” (Article 9). Our confession also acknowledges that the typical New Testament pattern was that baptism preceded participation in the Lord’s Supper. Application of this biblical principal calls for parents and church leaders to work together to ensure faithful participation in this covenant act. The invitation to participation must always be coupled with a call to self-examination. The church is responsible to practice discipline, repentance, confession and renewal when there is a breach in relationships within the congregation. The Mennonite Brethren church has no established directive regarding frequency of communion. Practice generally varies from quarterly to monthly commemoration. In the past, Mennonite Brethren shied away from weekly participation lest the event become superficial and hurried. Now, however, some congregations are celebrating communion every other week or even weekly because of its great significance in the church’s life with Christ. Mennonite Brethren believe that the private celebration of the Lord’s Supper by bridal couples to symbolize the marriage union is inconsistent with communion’s meaning as a uniquely church event. The New Testament practice of breaking bread together daily and weekly in homes was a powerful witness to their intimate fellowship. The need to balance the New Testament emphasis on the Lord’s Supper as a church event and the first century pattern of house churches suggests further reflection together on how the church can best remember the Lord’s death, recognize the Lord’s body and anticipate the Lord’s return. One other covenant event—footwashing—has historically been associated with Mennonite Brethren church life. Although it is no longer regularly practiced in most Mennonite Brethren congregations, the rite is increasingly popular among younger members as an expression of unity. Footwashing can be a worship event reminding family members “of the humility, loving service and personal cleansing that is to characterize the relationship of members within the church” (Article 6)."]}, {"sub_zh": "过肢体相爱的家庭生活：恩赐与作门徒 (Living as a Family)", "sub_en": "Living as a Family", "zh_paras": ["每一个家庭都有其周而复始的日常生活规律与温馨传统。对于门诺弟兄会这个大家庭而言，生命在作耶稣基督忠贞门徒中的健康成长，是我们的至高终极目标！", "门诺弟兄会坚信：门徒生命的成长，唯有置身于活生生的教会圣徒共同体中方能得到最完全的滋养。教会存在的首要宗旨，就是全力牧养培育我们的每一位成员，活出忠信跟从耶稣的圣洁一生。崇拜赞美、团契相交、深研真道与外展宣教，共同交织促进着整个门徒共同体的生生不息。", "为了装备圣徒各尽其职，上帝借着保惠师圣灵将丰富多彩的属灵恩赐满溢地赏赐给我们。门诺弟兄会坚信：新约圣经中所列出的一切属灵恩赐，在今天的世代中依然真实大能地运作运行！我们更深信，新约圣经所记录的恩赐清单并非封闭穷尽的，圣灵在今天同样能将音乐、艺术创作等现代才干转化为大能造就教会的属灵恩赐。使用一切恩赐（尤其是方言、医病与先知预言等神迹性记号恩赐）的绝对检验标准，在于它们是否完完全全为了造就、坚固并建造整个基督身体大家庭！"], "en_paras": ["Every family develops routines and traditions. These include weekly household chores, Christmas preparations and family vacations. We have been looking at the traditions associated with the special family events, but now we turn to our understanding of how the church is nurtured from day-to-day and week-to-week. For the Mennonite Brethren family, growth as disciples of Jesus is our primary aim. Mennonite Brethren hold that discipleship is nurtured within the church community. The primary purpose of church life, we believe, is to nurture our members to live as faithful followers of Jesus. Worship, fellowship, Bible study and outreach all contribute to the growth of the community of disciples. God equips us for service by empowering us with the gifts of the Holy Spirit. Mennonite Brethren believe that the spiritual gifts listed in the New Testament continue to be operative today. We also believe that, since no New Testament list is complete, the Spirit may empower the use of other abilities, such as music or drama, as spiritual gifts. The key to using all the gifts, especially the so- called charismatic or sign gifts (speaking in tongues, healing and prophecy), is that they build up the family as a whole. While some Mennonite Brethren encourage the development of tongues as a personal prayer language, more emphasis is usually placed on other gifts."]}, {"sub_zh": "会众治理体制与跨堂会联会架构 (Congregational Polity)", "sub_en": "Congregational Polity", "zh_paras": ["在教会体制上，门诺弟兄会并未推行死板划一的中央集权结构，各地方堂会有权根据自身处境确立合乎圣经的领袖领导架构。绝大多数门诺弟兄会堂会由敬虔的长老会（Elder Board）或堂会理事会（Church Council）负责教牧治理与属灵守望；而在一切重大关乎教会方向的重大决策上，全体会众均享有充分发言与投票表决的神圣权利。", "在门诺弟兄会诞生之初，先贤们为了坚决抵制老教会中教职阶层的专横独裁与属灵瞎眼，基于“信徒皆祭司”（Priesthood of all believers）的圣经真理，极其谨慎地防止任何个别传道人垄断绝对权力。门诺弟兄会深切领会：强有力且满有属天智慧的教牧领导，必须与全会众的广泛积极参与保持健康的张力平衡！", "与此同时，先贤们以卓越的属灵远见，迅速确立了各地方堂会绝不能各自为政、孤军奋战的原则，将众多地方堂会紧密联合为大区及全国性的“教区联会”（Conferences）。各地方堂会拥有充分的自主权开展本地牧养事工；而在植堂开拓、普世宣教、高等神学教育、全教区青少年培灵盛会、教牧领袖培育、以及教牧圣职按立与资质认证等重大战略圣工上，全国家庭则心怀同一异象，倾注全力携手同工！", "在个人主义与堂会地方孤立主义甚嚣尘上的当代浪潮中，我们必须更加警醒守护这一历经数百年风雨淬炼的宝贵家庭联合传统，使我们在基督里始终同心合意、奔向标杆！"], "en_paras": ["Mennonite Brethren do not have a prescribed congregational structure. Local bodies choose their own form of leadership structure. An elder board or a church council governs most Mennonite Brethren churches. The congregation is also given a voice in major decisions. Increasingly, larger congregations look to the pastoral staff for initiative in planning. At its birth, the Mennonite Brethren church reacted against what it perceived to be arbitrary and unspiritual pastoral leadership in the mother church. Insisting on the priesthood of all believers, the church was cautious about giving pastors too much authority. Mennonite Brethren recognized the need for wise, strong leadership balanced by congregational participation. They also quickly recognized the need to unite in larger inter-congregational groups, called conferences. Congregations set their own direction for local ministry, but they work together in these regional and national conferences to do church planting, world mission, higher education, larger youth events, pastoral leadership development, nurture and credentialing. Currently, the values of localism and individualism are challenging that healthy tradition. Commitment to the larger family groupings will demand continued vigilance by church leaders and fellowshipping congregations."]}]}, {"num": 8, "id": "chap-06", "badge_label": "CHAPTER 8", "title_zh": "第六章：缔造和平", "title_en": "Chapter 6: Peacemaking", "desc": "面对战争与国家军役的神圣抉择 (Responding to War & Military Service)；面对“积极缔造和平”的三大严峻质疑与神圣回应 (Challenges to Active Peacemaking)；质疑二的神圣回应：和平之道在现实中能行得通吗？。", "blocks": [{"sub_zh": "第 6 章：缔造和平 (Peacemaking)", "sub_en": "CHAPTER 6", "zh_paras": ["不朽巨著《殉道者之镜》（Martyrs Mirror）泣血记载了八百多位重洗派先贤为了坚守福音真道而英勇殉道的悲壮史诗。其中最动人心魄的见证之一，当属迪克·威廉斯（Dirk Willems）。威廉斯因坚守重洗派信仰被捕下狱并被判处死刑；在仅靠粗劣面包和清水维生而骨瘦如柴的绝境中，他奇迹般从二楼牢房破窗脱逃。一名荷枪实弹的狱卒在后紧追不舍，威廉斯拼尽全力踏过一片结了薄冰的池塘奔向自由。身材魁梧、衣食优渥的狱卒随后追赶，却瞬间压碎薄冰掉入刺骨的冰窟之中，发出绝望的濒死求救呼号。", "此时，已成功踏上对岸安全之地的威廉斯，是这荒野中唯一听见呼救的人。在基督那舍己之爱的强烈催逼之下，威廉斯毫不犹豫地毅然转身踏上薄冰，冒着生命危险将溺水的死敌从冰窟深渊中救拔上岸！而这名捡回性命的狱卒在长官的严令下，最终恩将仇报地将威廉斯重新逮捕。不久之后，这位满怀基督舍己之爱的义人，被残酷地绑上火刑柱活活烧死（《殉道者之镜》，741–742页）。", "一个发生在更近现代、以基督舍己之爱坦然面对暴力枪口的真实见证，发生在刚果民主共和国首都金沙萨。1997年的一个主日清晨，门诺弟兄会领袖帕基萨·奇米卡（Pakisa Tshimika）在教会遇见了青年贝特朗（Bertrand）。贝特朗当时刚从中非共和国九死一生逃亡而来，他在母国因勇敢揭露选举舞弊而惨遭无辜下狱。当时刚果军政府正暗中密谋绑架贝特朗，企图将其秘密遣返回国执行死刑。", "当帕基萨获悉这一险恶阴谋后，他与全家人毅然决然决定：在家中为贝特朗提供庇护之所！他们深知，一旦贝特朗在此被搜出，全家必遭株连灭门。果不其然，数日后，全副武装的总统府秘密特工气势汹汹地包围了帕基萨的住所，用枪口顶住他的胸膛发出死亡威胁。面对荷枪实弹的特工，帕基萨平静微笑着邀请这位手持冲锋枪的特工进屋喝热茶。", "在屋内，帕基萨坦然向特工分享了耶稣基督舍己大爱的信息，却坚决拒绝交出藏身屋内的贝特朗。帕基萨从容地对特工说：“请转告差遣你前来的长官——他们若想带走贝特朗，除非先踏过我帕基萨的尸体！”在随后的数周时间里，特工每天都上门拔枪恐吓帕基萨及其家人；而帕基萨一家始终以基督丰盛的款待与爱心相迎。最终，上帝奇妙开路，贝特朗安全脱险并成功逃往一个友好的西非国家。", "威廉斯与帕基萨的英雄见证，淋漓尽致地诠释了门诺弟兄会关于“缔造和平”（Peacemaking）的神圣神学认信：", "缔造和平是积极主动、满怀福音烈火、且完完全全以耶稣基督为绝对圆心的！", "它绝非消极懦弱的妥协退让，而是对一切暴力报复的断然弃绝！", "它的神圣起点，始于我们在基督里得享与上帝和好的属天平安；", "对于每一个生活在彼此扶持的信仰共同体中的信徒而言，缔造和平是一条极其现实、大有能力的生命活路！", "主耶稣深切呼召我们加入“和平缔造者”的神圣家族。在祂宣告天国大宪章的“登山宝训”开篇，耶稣宣告了著名的“八福”（马太福音 5:3-12）。在八福之中，主耶稣亲自赐福给和平的缔造者：“使人和睦的人有福了！因为他们必称为神的儿子。”通过赋予他们“神的儿子”这一崇高称谓，耶稣宣告：和平缔造者在性情与作为上最像上帝自己！", "紧接着，主耶稣提供了一系列生活案例，生动阐明祂如何借着一种“更高的义”来成全律法。那六段震撼人心的“只是我告诉你们”的对比教导（马太福音 5:17-48），深刻展现了耶稣如何将死板字句的律法，升华转变为积极缔造和平的活泼之义。", "耶稣关于彻底弃绝暴力报复的圣训，构成了重洗派数百年和平信念的基石。尽管外界习惯于将这一立场贴上“和平主义”（Pacifism）或“非抵抗”（Nonresistance）的标签，但耶稣在这里所呼召的，实则是一种极其刚强的“抗争”！然而正如神学家沃尔特·温克（Walter Wink）在其经典论文《第三条道路》（The Third Way）中所精辟剖析的：耶稣所开辟的道路，是以“非暴力”去彻底抵制、征服并瓦解罪恶！", "耶稣的原话最准确的领会应当是：“绝不要用暴力去回应暴力！”或者说：“绝不要在对抗邪恶的争战中使用邪恶的手段！”", "若能深刻明白耶稣讲道时的中东文化语境，我们便能洞察祂所举范例的无穷智慧：当耶稣教导我们“有人打你的右脸，连左脸也转过来由他打”时，祂所倡导的是一种彻底超越“迎头拼命”或“懦弱逃跑”两极的非暴力智慧战略！在古代社会，打人的右脸必须是用右手手背击打——这是上等人对下等人施加的极具侮辱性的羞辱耳光。如果受辱者动武还手，无异于以卵击石、自寻死路；如果低头任人宰割，则是怯懦妥协；耶稣对这两者皆予以否决！耶稣命令那受辱的下等人挺直腰板、“把左脸也转过来”——这神圣的举动瞬间在道德上将施暴者逼入绝境：因为要打左脸，施暴者必须握紧拳头平视击打，这无形中迫使施暴者不得不将受害者视作与自己完全平等的尊严之人！在这一范例及随后的教导中，耶稣呼召门徒运用属天的幽默、创意、胆识与生命厚度，以爱去吸收化解暴力，从而彻底击溃暴力的邪恶权势！", "在第六段对比教导中（马太福音 5:43-48），积极缔造和平的呼召达到了最高潮。耶稣彻底颠覆了世俗所谓的“当爱你的邻舍，恨你的仇敌”的陈规，发出震动宇宙的神圣挑战：“只是我告诉你们，要爱你们的仇敌，为那逼迫你们的祷告！”耶稣在这里描绘的是一种宏大的福音宣教战略：跟从基督的人，旨在借着舍己的爱，将世俗的仇敌彻底转化为基督里的挚友！这种生活方式虽然充满风险、要求极高、且必须付上牺牲的代价，但这就是基督自己的十字架道路！", "要让这种激进缔造和平的神圣呼召真正融入基督徒的实际生活，唯一的途径就是上帝的大家庭共同立约，在生活中携手并肩作和平的使者。新约使徒深刻领会：缔造和平是构建上帝子民共同体的至高指南。耶稣道成肉身降世，正是为了修复人与上帝之间早已破裂的仇敌关系；耶稣将原本世代血战仇杀的各方族群，在基督里重塑为一个崭新的合一家庭（加拉太书 3:26-28）；祂拆毁了阻隔在人与人之间中间隔断的墙，使原本的仇敌在基督的宝血中与神和好、彼此和睦，成为永生神家里的弟兄与姊妹（以弗所书 2:11-22）。", "新约书信生动地将信徒共同体的成员描绘为“使人与神和好的使者”：他们以爱服事仇敌（罗马书 12:20；13:8-10）、以善报恶（罗马书 12:17, 21；彼得前书 3:9）、竭力与众人和睦（罗马书 12:18；彼得前书 3:11），并至死效法那位在受苦时“口不出恶言、绝不还手报复”的基督榜样（彼得前书 2:21-25）。唯有置身于这和平的圣约团契之中，信徒方能领受元首基督与圣灵所赐下的大能，完满履行这“使人与神和好的神圣职分”（哥林多后书 5:11-21）。"], "en_paras": ["Martyrs Mirror tells the stories of 800 Anabaptists who died because of their commitment to the good news. One of these, Dirk Willems, was imprisoned for his faith, condemned to death and emaciated by a diet of bread and water, yet escaped from his second story cell. Pursued by a prison guard, Willems raced across a frozen pond to freedom. The guard, well fed and well clothed, fell through the thin ice. He cried out for help. Since Willems alone heard the cry, he felt constrained by the love of Christ to rescue his foe. Willems was subsequently rewarded for his merciful act by being recaptured and burned at the stake (Bragt, 741-42). A more recent story of meeting violent threats with the good news of Jesus took place in Kinshasa, Congo. Pakisa Tshimika met Bertrand in church one morning in 1997. Bertrand had recently escaped from his homeland, the Central African Republic, where he had been unjustly imprisoned for contesting election fraud. The military government in Congo plotted to kidnap Bertrand and return him to his country for execution. When Pakisa became aware of the plot, he and his family decided to provide Bertrand safe haven in their home, knowing that if Bertrand were found, they would also be incriminated. One day, the presidential secret service showed up at Pakisa’s house, threatening violence. Pakisa invited the agent, armed with a machine gun, into his house for tea. Pakisa shared the message of Jesus’ love with the agent but refused to release Bertrand. Pakisa asked the agent to inform the people who sent him that they would have to kill Pakisa first before they could have Bertrand. Agents came to the house every day for weeks to threaten Pakisa and his family. Pakisa responded with loving hospitality. Finally, God opened the door for Bertrand to escape to a friendly West African country. Willems and Pakisa illustrate what Mennonite Brethren believe about peacemaking. Peacemaking is active, evangelistic and Jesus-centered. It is rejection of violent retaliation. It begins when we find peace with God. Peacemaking is a realistic alternative for those who live within the supportive context of the faith community. Jesus calls us to join the peacemaker family. He opens his State of the Kingdom address (the Sermon on the Mount) with the Beatitudes (Matthew 5:3-12). In the Beatitudes, Jesus blesses peacemakers. By calling them “children of God,” Jesus announces that peacemakers are particularly like God. He then offers a series of case studies to illustrate how he came to fulfill the law through a “greater righteousness.” The six contrasting statements show how Jesus transforms a legalistic interpretation of the Law into the active righteousness of peacemaking (Matthew 5:17-48). Jesus’ words against violent retaliation have been the foundation of Anabaptist commitment to peacemaking. Although his strategy has been commonly labeled “pacifism” or “nonresistance,” Jesus does call for resistance. But, as Walter Wink points out in his article, “The Third Way,” Jesus’ form of resistance is the nonviolent resistance of evil. Jesus’ words are best interpreted, “Do not react to violence with violence,” or “Do not use evil in your fight against evil.” Understanding the cultural context of Jesus’ sermon gives fresh insight to Jesus’ examples. When Jesus teaches us to turn the other cheek, he is commending a nonviolent strategy of resistance that avoids either extreme of fight or flight. To strike on the right cheek involves an insulting backhand administered by a superior to an inferior. Violent reaction would be suicidal. No reaction would be cowardly. Jesus commends neither. Instead, Jesus calls the insulted, lower-ranking person to “turn the other cheek.” This has the effect of forcing the aggressor to treat the victim of violence as an equal. In this example, and in those that follow, Jesus calls for the use of humor and creativity—as well as strength—to absorb the violence, to defeat violent evil. Active peacemaking is underscored in the sixth contrasting statement (Matthew 5:43-48). Jesus overturns the conventional principle “love your neighbors but hate your enemies” by challenging us to love even our enemies. Jesus is describing an evangelistic strategy. Pray for your persecutors, Jesus says, reminding us that the Beatitudes are tied closely to the contrasting statements that follow. Peacemaking seeks to fulfill Christ’s mission for the church, to fulfill our Lord’s command to make disciples of all nations (Matthew 28:18-20). Followers of Christ try to turn enemies into friends. This lifestyle is risky, demanding and sacrificial, but it is the way of Christ. The only way that the call to radical peacemaking can become a practical part of the Christian life is for the family of God to covenant to be active peacemakers together. The apostles recognized that peacemaking was the fundamental guiding principle for forming the family of God. Jesus came to restore the broken relationship between God and humanity. Jesus created a new family out of formerly warring factions (Galatians 3:26-28). He tore down the barriers that divide people and created a new family in which enemies have been reconciled to live as brothers and sisters in Christ (Ephesians 2:11-22). The New Testament letters describe members of the believing community as ministers of reconciliation. They serve their enemies (Romans 12:20; 13:8-10), return good for evil (Romans 12:17, 21; 1 Peter 3:9), pursue peace with all people (Romans 12:18; 1 Peter 3:11) and follow the example of the one who refused to retaliate (1 Peter 2:21-25). It is only by living within the community of peace that members are empowered by the Lord and Spirit of the community to fulfill their ministry of reconciliation (2 Corinthians 5:11-21)."]}, {"sub_zh": "第三千禧年的和平缔造者 (Third Millennium Peacemakers)", "sub_en": "Third Millennium Peacemakers", "zh_paras": ["《门诺弟兄会信仰宣言》第十三条庄严宣告：", "“我们效法基督的榜样并遵行祂爱上帝、爱邻舍甚至爱仇敌的命令，在一切人际关系中积极追求和平与和好……作为和平缔造者，我们竭力缓解苦难、化解争端、促进公义，并努力终结一切暴力与战争，使世人能清晰得见基督舍己大爱的真实彰显！”", "门诺弟兄会将基督关于缔造和平的训诲，生动践行在极为广阔的现实处境中：", "首先，缔造和平始于我们的骨肉家庭。教会必须身先士卒，将基督的属天和平带入每一个家庭宅邸，挺身而出成为遭受家暴虐待的配偶与受虐儿童的刚强保护者，教导信徒在家庭冲突中坚决摈弃一切言语与肢体暴力，以圣经真理在爱中和解。门诺弟兄会坚决反对针对整个人类群体中任何脆弱肢体的暴力侵害。在《信仰宣言》第十四条中，我们庄严宣告：“胎儿、残障人士、贫困者、衰老者以及临终者，在面对社会不公时尤为脆弱无助；基督至圣地呼召我们必须全力关顾保护这些无力自卫的弱小群体！”在加利福尼亚州弗雷斯诺（Fresno），门诺弟兄会走在全社会最前沿，领导创办了“中央谷地正义联盟”（Central Valley Justice Coalition），营救了无数深陷现代人口贩卖与性奴役深渊的绝望受害者。", "其次，面对堂会内部的摩擦，门诺弟兄会深刻认识到自己同样无法天然免疫于人际冲突。教会受召必须作和平的避风港，在诚实、健康、充满爱心的坦诚交通中化解分歧、达成深层和睦。各堂会建立了明确的圣约守则，倡导坦率诚恳的爱心对话，坚决抵制任何背后毁谤与论断；同时为教牧同工制定了极为严谨的职业性道德守则，彻底杜绝任何形式的教牧权力滥用与情感剥削。", "在更广泛的社会层面，门诺弟兄会各堂会忠心效法基督，积极投身于调解邻里纠纷、缓和种族矛盾冲突、以及推动犯罪受害者与加害者之间的“恢复性司法”（Restitution and Reconciliation）。2018年，美国门诺弟兄会总会（USMB）全国正式代表大会以压倒性多数通过严正决议案，呼吁美国联邦政府立即废除在边境执法过程中强行将移民骨肉家庭拆散的残忍政策。大批门诺弟兄会平信徒投身于专业调解机构，促成深层和解；大力推进监狱探访、服刑人员属灵重生与回归社会的改造事工。", "在全宗派层面上，门诺弟兄会更是深度参与并主导了多个著名的跨门诺和平事工机构：", "门诺中央委员会（MCC）在北美及全球各大洲，通过系统性的和平教育培训、国际冲突调解斡旋、心理创伤医治、跨宗教桥梁搭建与正义呼吁，持久深耕和平土壤；", "门诺灾害救助服务处（MDS）则在飓风、洪水、火灾等特大自然灾害后，迅速组织数以万计的基督徒志愿者奔赴灾区，为贫困受灾家庭无偿重建家园。", "这种源自基督的和平之光，由内而外层层扩散：始于我们个人与上帝关系的修复，继而进入至亲家人与挚友，随后辐射至职场与邻舍，最终坦然面对整个世界的风云变幻！"], "en_paras": ["The MB Confession of Faith declares that “We actively pursue peace and reconciliation in all relationships by following Christ’s example and His command to love God, neighbors and even enemies…. As peacemakers we alleviate suffering, reduce strife, promote justice and work to end violence and war, that others may see a demonstration of Christ’s love.” Mennonite Brethren apply Christ’s teachings on peacemaking in many contexts. Peacemaking begins at home. The church is to take the lead in bringing peace to homes and families, to be an advocate on behalf of victims of spousal and child abuse, to foster reconciliation by teaching families to resolve conflict without violence. Mennonite Brethren oppose violence against vulnerable members of the human race. In Article 14, we confess that “the unborn, disabled, poor, aging and dying are particularly vulnerable to...injustices. Christ calls [us] to care for the defenseless.” An example of peacemaking at home is found in Fresno, California, where Mennonite Brethren are at the forefront of the Central Valley Justice Coalition to free those trapped by human trafficking.", "Mennonite Brethren are not immune to church conflict. The church is called to be a community of peace where the healthy exchange of differences brings reconciliation. MB churches have at times established covenants that encourage the practice of honest, loving exchanges and renounce gossip. MB pastors are guided by a sexual ethics policy that aims to do away with exploitation. MB churches are faithful to Christ by showing leadership in helping to resolve neighborhood disputes, racial tensions and animosity between victims of crimes and their offenders. In 2018, delegates to the USMB National Convention passed a statement calling on the U.S. government to abolish the practice of separating families as part of its border policing. Many Mennonite Brethren work in mediation service
