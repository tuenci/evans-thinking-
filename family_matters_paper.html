 Leadership development. These three core commitments are central to the vision of what will characterize U.S. Mennonite Brethren churches in 2025. While these core commitments are not new, there is a renewed energy and enthusiasm among national staff members and Mennonite Brethren ministries to encourage and equip congregations. Church multiplication and evangelism are essential to the mission and ministry of U.S. Mennonite Brethren. Under the direction of Ed Boschman (1996-2001) and then Don Morris (2004-2016), Mission USA served as the USMB church planting and church renewal ministry for 20 years. During this time, Mission USA drew on resources provided by a variety of church planting agencies, including C2C Network, the Canadian Conference church planting ministry. As the USMB Leadership Board discussed how best to carry out its renewed focus on church multiplication and evangelism, in 2015 USMB leaders asked if C2C could serve as the USMB church planting arm. This request prompted C2C to explore expanding its ministry beyond Canada and dovetailed with a growing vision among MB Mission leaders that mission would be defined as local, national and global and would be central to the vision, strategy and structure of every local church and district and national conference. So, in 2016, Mission USA was retired, and U.S. church planting was done in connection with C2C. Plans for the merger of MB Mission and C2C Network moved forward, and in January 2019, Multiply was launched as a Mennonite Brethren-based mission agency that serves cross denominationally to facilitate church planting locally, nationally and globally. The relationship between USMB and C2C/Multiply lasted just three years and in October 2019, Multiply ceased church planting operations in the U.S. The national and district conferences stepped in to support fledgling church plants, but the sudden loss of leadership needed to be addressed. That void was filled by USMB’s Church Planting Council, which will be directed by the church planting mobilizer. The church planting mobilizer will collaborate with district church planting committees and networks with USMB churches to develop church plant projects. The mobilizer will also oversees the Church Planting Council, comprised of representatives from each of the five USMB districts. The Church Planting Council keeps current of all church planting happenings within districts and nationally, supports and encourages networks of pastors and churches for planting new churches and campuses and can assist with church renewal projects. In addition, The Network, formed by a group of Mennonite Brethren pastors, will provide project management and church planter support. Leadership Education And Development (LEAD) Initiatives offer local church pastors and leaders resources designed to address the core commitments of intentional disciple-making and leadership development. Disciples and leaders don’t just happen. Regardless of our spiritual “age,” all Christians need to be nourished and equipped to put our gifts and talents to use in God’s kingdom. LEAD Initiatives provide a foundation for pastors and leaders to enhance their ministry and connect with others while also growing their own faith. The LEAD program includes, but is not limited to: LEAD Coaching, life-on-life coaching provided to pastors and leaders by a network of certified coaches for personal growth and life enhancement; LEAD Cohorts, online meeting places for small groups of individuals interested in learning more about a specific topic that are free to all participants; and LEAD Pods, the official USMB podcast devoted to spiritual growth and leadership development."]}, {"sub_zh": "USMB 的事工运作模式", "sub_en": "USMB Ministry Model", "zh_paras": ["鉴于 USMB 采纳的是以全职专业同工驱动的治理模式，全美各项事工高度依托一支由全职与兼职同工组成的团队。他们统一向全国总监汇报，全国总监则对领导董事会直接负责。除全国总监外，目前的常设全职同工包括行政秘书/财务主管，以及植堂动员主任；兼职专业同工则涵盖行政助理、《基督徒领袖》杂志主编、副主编、网站主管、社交媒体协调员以及全美领袖动员督导等。", "领导董事会由全美双年度代表大会（即 USMB Gathering 大会）选举产生的9位理事组成。此外，董事会还设有9位当然理事（ex-officio members）：包括来自 USMB 五大区会的区总牧（District Ministers）、门诺弟兄会基金会和Multiply（全球宣教差会）的首席负责人，以及来自 USMB 青年事工部和太平洋区会西语理事会的代表。", "全国战略团队（National Strategy Team，简称 NST）的成立旨在就战略领导力重大议题向领导董事会提供咨询洞见，并促进跨机构协同，以达成《未来故事》异象所确立的各项远景目标。虽然 NST 的核心成员由各区总牧、全国总监以及门诺弟兄会基金会与Multiply（全球宣教差会）的负责人组成，但该团队会定期邀请其他重要领袖参与，就特定前沿议题进行深入研讨与专项咨询。例如，在与刚果民主共和国及埃塞俄比亚移民建立的各堂会领袖举行深入座谈后，NST 于2019年主办了两次专题峰会，并设立了专门特别工作组，深入规划如何卓有成效地服侍并接纳渴望正式加入 USMB 大家庭的刚果与埃塞俄比亚堂会。", "USMB 信仰与生活委员会（Board of Faith and Life，简称 BFL）由4名全美特选理事，以及5位区总牧与全国总监作为当然理事共同组成。该委员会承担全宗派的教义教导监督职责，统管神学校约与教牧政策规约。在其日常职守中，BFL 编辑出版面向21世纪教会现实挑战的系列牧养专题手册，主办双年度的“全国新牧者入职培训导向营”（National Pastors' Orientation），并根据时代需要召集专题教义研讨大会（Study Conferences）。", "自2006年恢复以来，BFL 已召集了两次重要的教义研讨大会：2013年的首届专题大会聚焦《信仰宣言》第12条（社会与国家）与第13条（爱与非抵抗/缔造和平），有力推进了第13条条文与注释的重大修订历程；2019年的专题大会则以“圣经与教牧职分中的女性”为题，在长达20年的沉寂之后，重新在宗派内部开启了关于女性参与教牧事奉的坦诚、严谨的圣经对话。"], "en_paras": ["Because the USMB governance model is staff driven, national ministries rely on a team of full- and part-time staff that report to the national director who in turn is responsible to the Leadership Board. In addition to the national director, current staff include a fulltime administrative secretary/bookkeeper and church planting mobilizer. Part-time staff include an administrative assistant, Christian Leader editor, Christian Leader associate editor, webmaster, social media coordinator and national leadership mobilizers.", "The Leadership Board is comprised of nine members elected by delegates to the biennial national conventions, known as USMB Gathering. There are also nine ex-officio members of the Leadership Board: district ministers from the five USMB district conferences, lead staff members of MB Foundation and Multiply and a representative from USMB Youth and the Pacific District Conference Hispanic Council. The National Strategy Team (NST) is formed to advise the Leadership Board on strategic leadership issues and to encourage collaboration to fulfilling the goals outlined in the Future Story vision. While the district ministers, national director and lead staff members from MB Foundation and Multiply form the NST, the team regularly invites other leaders to educate and advise them on specific issues. For example, after meeting with leaders of congregations comprised of immigrants from DR Congo and Ethiopia, in 2019 the NST hosted two summits and formed a task force to strategize how to effectively serve and integrate the Congolese and Ethiopian congregations that want to become part of USMB. The USMB Board of Faith and Life (BFL) includes four members at large and the five district ministers and national director as ex-officio members. This board provides doctrinal oversight and is responsible for covenants and policies. Included in its duties, BFL publishes a pamphlet series addressing issues of significance to the 21st century church, hosts the biennial National Pastors’ Orientation and convenes study conferences as needed. Since 2006, BFL has hosted two study conferences. The first study conference, in 2013, focused on Articles 12 (Society and State) and 13 (Love and Nonresistance) of the Confession of Faith and was convened to aid the process of revising Article 13. The subject of the 2019 was “The Bible and Women in Pastoral Ministry.” This study conference was intended to resume the conversation around women in pastoral ministry after a 20-year hiatus."]}, {"sub_zh": "装备下一代", "sub_en": "Equipping the Next Generation", "zh_paras": ["美国门诺弟兄会历来将青年人的福音布道与门徒造就置于优先地位。在地方堂会层面，主日学、周间活动、青年团契、假期圣经学校（VBS）以及各类夏令营会，持续呼召青年一代归向基督，活出作主门徒的荣美生命。USMB 各区会主办丰富多彩的青少年夏令营、秋冬季研习营，并资助青年事奉实习计划。", "历史上曾有专门的全国委员会统筹协调全美青年事工。即便后来该委员会被精简并入其他治理架构，USMB 对新世代青年的庄严委身亦从未减退。", "1975年，首届“全美青年大会”（National Youth Conference，简称 NYC）在新墨西哥州歌罗瑞塔浸信会大会中心（Glorieta Baptist Conference Center）隆重举行，共有1,395名青年、青年导师与服事同工出席。这项每四年举办一次的青年盛会，选址于设施完备的高山营地，参会规模节节攀升——1999年创下了1,796人的历史新高；活动内容亦不断丰富，不仅包含多位重磅主题讲员与敬拜音乐会，还涵盖才艺展示以及由泰博学院和弗雷斯诺太平洋大学联合主办的高中毕业生毕业早餐会。", "2003年，大会在下午的自由活动时段首次融入了社区服侍环节。学生们搭乘大巴从科罗拉多州埃斯特斯公园（Estes Park）的落基山青年会营地前往博尔德市（Boulder），接受挑战在闹市街头实践“出人意表、不求回报的善行”。", "提供兼具深刻服侍体验的全国性盛会，成为2007年 NYC 策划团队的核心考量。为此，他们将大会场地移至加利福尼亚州阿纳海姆（Anaheim）的一家大型会议酒店。依托大都会成熟的社区网络，当地丰富的基于信仰的慈善与服侍机构足以让每一位参会青年亲身投入服侍实践。随后的“圣安东尼奥2011”大会以及在丹佛举办的“Named 2015”大会，继续为学子们提供兼具社会服侍、全场敬拜大会、专题工作坊挑战以及与全美门诺青年建立深厚友谊的宝贵机会。", "2019年，全美青年大会重返新墨西哥州歌罗瑞塔冒险营地，以“YouthCon 2019”的崭新面貌亮相。策划团队清醒意识到，此前酒店式会议环境的一大缺憾在于缺乏自然社群互动的空间；他们深切盼望年轻人体会围坐聚餐的亲密，拥有充裕的非正式漫谈空间，而山野营地的环境完美满足了这一渴望。营会鼓励年轻人下载 USMBYouth 专属手机应用。策划团队摒弃了仅依靠一两位名讲员的传统做法，起用了一支多元讲员团队，信息层层递进——从呼召青年成为上帝宏大叙事的一部分，直至激励他们对耶稣基督跟随与事奉的召唤坚定回应“我愿意”。", "YouthCon 2019 由 USMB 全国青年事工委员会（通称 USMB Youth）统筹策划，广泛招募了在各项专业领域深具专长的志愿同工。在2015年大会之后，USMB Youth 推出了全新异象战略：通过“网络倡议”赋能青年事工工作者；为高中生举办全国盛会；并通过“服侍计划”（Project:Serve）持续深化社会服侍传统，为各地青年团契服务本地社区的创意项目提供专项资助。", "YouthCon 2019 闭幕后，USMB Youth 重新审视其异象战略并作出了果断调整。除了继续通过“网络倡议”联络并赋能基层青年牧者外，基于对多方实际情况的综合考量，USMB Youth 决定告别长达数十年、每四年在学期中举行一次全国大会的旧模式，转向每年夏季举办名为“登峰营”（Ascent）的全国性夏令营。", "首届“登峰”全美夏令营于2021年6月在歌罗瑞塔冒险营地开营。尽管当时全球 COVID-19 疫情的各项防控规定对营会规模和活动开展带来了一定限制，但 USMB Youth 坚信，无论在营员人数还是活动深度上，该营会都必将迎来稳健增长。", "USMB 青年事工的第三大战略重心，是从单纯倡导志愿服侍，深化为通过“领袖输送通道”（The Leadership Pipeline）发掘并造就新一代领袖人才。自2022年起，一支兼职领袖动员团队正式启动运转，专门物色并培育有志于全职服事的优秀青年。该计划依托专属网站平台，地方堂会可在其上发布教牧实习岗位，青年实习生亦可展示个人事工档案，实现供需精准对接。", "USMB 青年还享有其他丰富的领导力造就与事奉契机：泰博学院设立的“信仰前沿”（Faith Front）项目，致力于激励基督徒青年锤炼事工领导力，尤为侧重教牧服事及其他教会全职圣工的准备；太平洋区会的“新一代领导力委员会”为青年提供宝贵的教牧实习岗位；Multiply 差会为青年提供多项跨文化短期宣教实践机会；门诺弟兄会基金会则通过其“新一代领袖基金”，为有志于在本地或全球服侍门诺弟兄会大家庭的高中生至神学院研究生提供丰厚的奖学金资助。"], "en_paras": ["U.S. Mennonite Brethren have prioritized evangelizing and discipling young people. In local congregations, Sunday school, midweek programs, youth groups and vacation Bible school and summer camps invite youth to follow Christ and live as his disciples. USMB district conferences host summer camps and fall and winter conventions and sponsor internships. For a time, a U.S. Conference board coordinated national youth ministry efforts. But even when that board was eliminated and its responsibilities were assumed by other boards, a commitment to USMB youth remained. In 1975, the first National Youth Conference (NYC) was held in New Mexico at the Glorieta Baptist Conference Center. A total of 1,395 youth, sponsors and event staff attended.", "The every-four-year event, held in a mountain setting at a full-service conference setting, grew in attendance—a high of 1,796 in 1999—and scope, including multiple keynote speakers and concerts as well as a talent show and seniors’ breakfast hosted by Tabor College and Fresno Pacific University. In 2003, a service component was added as an afternoon free-time option. Students were bused from the YMCA of the Rockies conference center in Estes Park, Colorado, to Boulder and were challenged to carry out “random acts of senseless kindness.” Offering a national event with a strong service component was a priority of the NYC 2007 planning team. So, they shifted the venue to a hotel in Anaheim, California. The large urban setting provided enough faith-based ministries that each NYC attendee could serve in some way. San Antonio 2011 and Named 2015 in Denver, Colorado, continued to provide students with the opportunity to serve as well as worship in general sessions, be challenged in workshops and connect with other USMB youth. In 2019, NYC returned to New Mexico and Glorieta Adventure Camps for YouthCon 2019. The 2019 planning team had determined that one of the weaknesses of the hotel setting was the lack of space for natural community. The team wanted youth to have meals together and plenty of places to gather informally, and the camp setting allowed for that. Participants were encouraged to download the USMBYouth app to their phones. Rather than one or two speakers, the organizers chose a team of speakers, and their messages progressed from an invitation to be part of God’s story to saying yes to Jesus’ call to follow and serve him. YouthCon 2019 was planned by members of the USMB National Youth Commission, known as USMB Youth, who recruited volunteers with expertise in specific areas needed to pull off a national event. USMB Youth had launched a new vision following NYC 2015 that focused on supporting youth workers via The Network, providing a national gathering for high school students and continuing an emphasis on service through Project:Serve which would help fund projects created by youth groups to serve their community. Following YouthCon 2019, USMB Youth re-evaluated its vision and strategy and adjusted. They continue to connect and resource youth workers via The Network. A variety of factors led USMB Youth to move away from a national youth event held every four years during the school year in favor of an annual summer camp called Ascent. The first national summer camp was held at Glorieta Adventure Camps in June 2021. Restrictions and protocols in place due to the COVID-19 global pandemic impacted camp attendance and available activities, but USMB Youth anticipate the camp will increase in terms of campers and activities. The third USMB focus shifted from promoting service to calling out and training new leaders through The Leadership Pipeline. A team of part-time leadership mobilizers began working in 2022 to identify and train young people for ministry. Their efforts will be supported by a Leadership Pipeline website where local churches can post openings for internships and interns can post profiles. Additional information about USMB Youth is available on the USMB website. Other leadership training and ministry opportunities available to USMB youth include Faith Front, a Tabor College program designed to encourage Christian youth to develop competencies for ministry leadership with special emphasis on pastoral ministry and other church vocations. The Pacific District Conference Next Generation Leadership Board offers internship opportunities for young adults, while Multiply offers young adults several short-term, cross-cultural ministry options. Through its Leadership Generation Fund, MB Foundation offers scholarships to high school through graduate students interested in serving the Mennonite Brethren family locally or globally."]}, {"sub_zh": "《基督徒领袖》杂志（Christian Leader）", "sub_en": "Christian Leader", "zh_paras": ["您是否知道，当《基督徒领袖》（Christian Leader）于1937年创刊时，它最初竟是一份专为那些迅速从德语转向英语的年轻信徒量身定制的青年刊物？", "门诺弟兄会历来积极善用各种传媒载体传播福音佳音，尤为重视文字印刷出版。历史上，在俄国殖民聚居区广泛分发基督教属灵书籍与单张，正是催生门诺弟兄会灵性复兴的核心催化剂之一。在门诺弟兄会移民离开俄国抵美十年后，领袖们迫切渴望拥有一份定期刊物，以便与散居各地的堂会保持交通联络。", "1884年，他们创办了德语刊物《锡安信使》（Zionsbote / Messenger of Zion）。直至1951年，这份德语期刊始终是北美门诺弟兄会的官方权威刊物。1951年，《基督徒领袖》正式接棒成为北美门诺弟兄会的官方旗舰出版物，共同服侍美加两国的信徒；直到1955年加拿大总会创办了自己的会刊《门诺先锋报》（MB Herald）。2019年，《门诺先锋报》全面转型为纯数字化线上刊物，使得《基督徒领袖》成为目前整个北美门诺弟兄会仅存的纸质印刷期刊。", "自1955年以来，《基督徒领袖》将内容重心聚焦于美国门诺弟兄会所关切的时代议题与各样事工动态。2010年，该杂志进行了全面改版，紧密贴合 USMB 的使命与异象。随后的数次版面升级，进一步强化了对 USMB 核心委身——植堂与布道、门徒训练及领袖培育的深度报道。", "2021年进行的一项全方位读者调研评估建议，《基督徒领袖》应继续坚持纸质印刷版与网络数字化版双轨并行发行。USMB 领导董事会批准了一项重要建议：正式设立“编辑委员会”，协助主编遴选时代课题并物色优秀的教义神学撰稿人；同时设立“审读委员会”，严把神学教义质量关。", "USMB 各堂会的所有会友和经常聚会者均可免费订阅《基督徒领袖》纸质版杂志。杂志绝大部分精彩内容亦可在官方网站查阅。此外，双周发行的免费电子资讯简报《C-Link》持续向信徒传递最新的要闻动态。"], "en_paras": ["Did you know that when the Christian Leader was first published in 1937, it was a youth publication designed to serve a constituency that was fast switching from German to English?", "Mennonite Brethren have actively communicated the good news through various media, especially print. Christian literature distributions in the Russian colonies were one catalyst for the renewal that produced the Mennonite Brethren church. A decade after Mennonite Brethren left Russia and arrived in the U.S., leaders wanted a periodical to communicate with their scattered churches. In 1884 they began publishing Zionsbotefi (Messenger of Zion). This German-language publication was the official periodical of North American Mennonite Brethren until 1951. That year Christian Leader became the official publication of the North American Mennonite Brethren, and it served both U.S. and Canadian Mennonite Brethren until 1955 when the Canadian Conference developed its own publication, MB Herald . The MB Herald became an online-only publication in 2019, making Christian Leader the only print periodical serving Mennonite Brethren in North America. Since 1955, Christian Leader has focused its content on the issues and activities of U.S. Mennonite Brethren. In 2010, the magazine underwent a thorough redesign which included an intentional focus on the USMB mission and vision. Subsequent redesigns have emphasized USMB’s commitment to church planting and evangelism, discipleship and leadership development. In 2021, a comprehensive review recommended that Christian Leader continue to be offered both in print and online. The USMB Leadership Board affirmed the recommendation that an Editorial Committee be formed to assist the editors in selecting topics and identifying writers for theological content and that a Review Committee look over this content. A free subscription to Christian Leader is available to all members and attendees of USMB churches. Most of the magazine content is available online. C-Link, a free e-news digest, is published biweekly."]}, {"sub_zh": "五大区会（District Conferences）", "sub_en": "District Conferences", "zh_paras": ["USMB 依据地理区划由五个地方区会组成。每个区会各自承担教牧监督关怀、本区域信仰与生活重大议题指引以及地方教会植堂拓植之责。", "中部区会（Central District Conference，简称 CDC）", "辖区幅员辽阔，涵盖爱荷华州、印第安纳州、内布拉斯加州、南达科他州、北达科他州、蒙大拿州、明尼苏达州及威斯康星州。CDC 麾下的39间堂会星罗棋布于广袤乡村、内城街区与城市近郊。除英语堂会外，还汇聚了西语、埃塞俄比亚语、拉科塔原住民（Lakota）、刚果以及斯拉夫语等多元族裔堂会。区会每年举办教牧退修会、青年大会及信徒大会，聘有一位全职区总牧及一位兼职教牧同工。", "东部区会（Eastern District Conference，简称 EDC）", "2019年，鉴于东部地区蕴藏的巨大发展潜力，原北卡罗来纳区会正式更名为东部区会。2020年，区会启动了正式接纳分布于佐治亚州、肯塔基州、缅因州、俄亥俄州、田纳西州及弗吉尼亚州等地刚果裔教会的历史进程。一百多年前，门诺弟兄会宣教士来到北卡罗来纳州的埃尔克帕克（Elk Park），委身服侍当地非裔美国人社区。EDC 正是这批宣教先驱百折不挠、克服难以想象的重重阻力、建立跨种族多民族教会的结晶。今天，这些堂会展现出独一无二的多元文化融合魅力，正以崭新蓬勃的姿态茁壮成长。2013年，位于北卡勒诺尔（Lenoir）的一间西语堂会正式加入 EDC。东部区会设有信仰与生活委员会以及基督教教育委员会，通过“城市事工研修院”（The Urban Ministry Institute）提供系统神学装备。该区会目前辖有9间堂会，由一位区总牧忠心牧养。", "拉丁美洲门诺弟兄会区会（Latin America MB District Conference，简称 LAMB）", "这是一个主要由西语裔信徒组成的区会，其前身是南部区会当年在得克萨斯州里奥格兰德山谷（Rio Grande Valley）开拓扎根的宣教圣工。虽然 LAMB 麾下堂会通常以西班牙语进行崇拜，但各堂会正积极增设英语聚会，以深入触及新一代年轻群体。LAMB 现辖11间堂会，每年举行联合敬拜与团契大会，由一位区总牧统筹服侍。", "太平洋区会（Pacific District Conference，简称 PDC）", "辖区横跨亚利桑那州、加利福尼亚州、内华达州、俄勒冈州、犹他州及华盛顿州，麾下共有122间堂会，按堂会数量计是全美规模最大的大区。全职区总牧与 PDC 信仰与生活委员会、本土宣教委员会、新一代领导力委员会以及西语理事会同心协力，众志成城，所成就的圣工远超单打独斗之所能，竭力践行主耶稣“去使万民作门徒”的大使命。", "南部区会（Southern District Conference，简称 SDC）", "涵盖阿肯色州、科罗拉多州、堪萨斯州、密苏里州以及俄克拉荷马州的41间堂会。区会聘有一位全职区总牧及一位青年事工牧师。由青年、管家、信仰与生活、教会拓展与布道四大委员会以及执行理事会共同领航，致力于实现三大战略目标：点燃植堂伙伴关系、动员关怀世界的年轻一代、深耕充满属灵活力的生机堂会。SDC 拥有底蕴深厚的小学、初中及高中青少年夏令营营会传统，并每年为初高中青年举办盛大的年度联合大会。"], "en_paras": ["USMB is comprised of five district conferences organized along geographic lines. Each district is responsible for pastoral oversight, local faith and life issues and church planting. The Central District Conference (CDC) covers a large territory: Iowa, Indiana, Nebraska, South Dakota, North Dakota, Montana, Minnesota and Wisconsin. The CDC’s 39 churches are located in rural, inner city and suburban communities. In addition to English-speaking congregations, CDC congregations include Hispanic, Ethiopian, Lakota, Congolese and Slavic congregations. The district hosts an annual pastors’ retreat, youth conference and adult conference and employs one full- time and an additional part-time district minister. In 2019 the North Carolina District Conference was renamed the Eastern District Conference (EDC) in recognition of potential growth. In 2020, the district began the process of welcoming Congolese churches in Georgia, Kentucky, Maine, Ohio, Tennessee and Virginia. More than 100 years ago, Mennonite Brethren missionaries came to work with the African American community in Elk Park, North Carolina. The EDC is a result of the perseverance of these men and women who overcame great odds and developed multi-racial congregations. Today these churches are a unique blend of cultures that are growing in fresh new ways. In 2013 a Hispanic congregation in Lenoir, North Carolina, joined the EDC. The EDC has a Board of Faith and Life and Christian Education Board that provides theological training through The Urban Ministry Institute. The district of nine congregations is served by a district minister. The Latin America District Conference (LAMB) is a predominantly Hispanic group born from mission work initiated by the Southern District Conference in the Rio Grande Valley. While LAMB congregations typically hold services in Spanish, congregations are adding English services to reach younger people. The 11 LAMB congregations meet annually for worship and fellowship and are served by a district minister. Comprised of 122 congregations in Arizona, California, Nevada, Oregon, Utah and Washington, the Pacific District Conference (PDC) is the largest regional conference in terms of member churches. A full-time district minister works with the PDC Board of Faith and Life, Home Missions Board, Next Generation Leadership Board and Hispanic Council to accomplish more together than they could individually as they seek to fulfill Jesus’ command to go and make disciples. The 41 churches of the Southern District Conference (SDC) are located in Arkansas, Colorado, Kansas, Missouri and Oklahoma. The district employees a full-time district minister and youth minister. Four commissions—Youth, Stewardship, Faith and Life and Church Extension and Evangelism—and an Executive Council guide the district’s goals of igniting church planting partnerships, mobilizing world engaging generations and cultivating vital congregations. The SDC has a strong summer camping program for elementary, junior high and high school students and holds an annual convention for junior and senior high youth."]}]}, {"num": 12, "id": "chap-10", "badge_label": "CHAPTER 12", "title_zh": "第十章：门诺弟兄会国际大家庭", "title_en": "Chapter 10: The International MB Family (ICOMB)", "desc": "非洲：安哥拉、刚果民主共和国、马拉维及其他地区；亚洲：印度、日本、克木人差传及其他工场；欧洲：奥地利、德国、立陶宛、葡萄牙及前线见证。", "blocks": [{"sub_zh": "第十章", "sub_en": "CHAPTER 10", "zh_paras": ["您是否曾参加过一次格外圆满的家族大团圆？来自天南地北的亲友齐聚一堂，重叙久违的骨肉深情，结识新添的家族成员。在基督徒的家族聚会中，大家一起数算恩典、分享见证、开展活动、同心颂赞与祈祷。有时我们起初可能还在犹豫是否成行，但聚会结束时，每个人都会为自己当初付诸行动而满心欢喜。", "门诺弟兄会国际共同体（International Community of Mennonite Brethren，简称 ICOMB）就是这样一个不断茁壮成长的属灵大家庭。在我们这一大家庭中，成长之所以成为常态，是因为我们是一间投身于上帝神圣宣教使命的教会。每当有人跨出安舒区，走向未曾听闻耶稣基督福音的偏远之地，属灵的新生儿便在此诞生；历经岁月的耕耘与浇灌，当地一群群萌芽的地方教会便正式注册成为一个崭新的门诺弟兄会教会团体。", "2017年，一次激动人心的 ICOMB 大家庭盛会在泰国隆重举行，汇聚了来自全球36个国家的约240名代表。通常情况下，ICOMB 每年举行一次全球峰会，由22个正式成员国家总会的领袖聚集在一起，进行深度的见证分享、同工装备与灵性勉励。而这一次，ICOMB 与Multiply（全球宣教差会）携手，特邀了另外15个新兴国家教会团体的领袖共襄盛举。2017年泰国峰会是 ICOMB 主办的第五次全球专题磋商会（前四次分别为：1999年在堪萨斯州威奇托举行的全球统合磋商会；2007年在加州弗雷斯诺以及2011年在曼尼托巴省温尼伯举行的两届高等教育磋商会；以及2009年在刚果举行的基督教教育磋商会）；这也是自1988年Multiply（全球宣教差会）前身在巴西库里蒂巴（Curitiba ’88）催生 ICOMB 以来，首次举行的以普世差传宣教为核心主题的全球盛会。", "ICOMB 的崇高宗旨，是促进各成员国家总会之间的深度团契联结与事工协同，以期在作主门徒与福音见证上结出更加丰硕的果子。可以说，ICOMB 就是门诺弟兄会的“全球联合总会”，将包括美国门诺弟兄会总会（USMB）在内的所有已成熟建制的地方性国家总会紧密凝聚在一起。ICOMB 致力于通过属灵共同体、跨国集会，以及远程教练指导、各大洲同侪研学网络等丰富资源，赋能并激励各国教会领袖。", "ICOMB 由所有成员国家总会共同出资维护。它没有庞大的财政预算，也不搞繁复的机构项目；其无可比拟的属灵权能，深植于全球肢体间真挚的生命联结与普世信仰认同之中。", "2004年，经过一个国际工作团队历时三年的集体研讨与推敲，《国际门诺弟兄会信仰宣言》（International Confession of Faith）正式获批通过，成为指引所有成员教会的纲领性告白。它与美国总会的《信仰宣言》及各国既有的门诺弟兄会信仰宣言高度契合融通。在表述风格上，它兼融“东西方思维之美”，将生动的救赎叙事与清晰的要点概括巧妙融合。", "它首先通过全景梳理从《创世记》到《启示录》的圣经宏大叙事，深刻回答了“上帝如何在世界中施行作为？”这一根本问题；随后，以五个凝练而深刻的维度回答了“门诺弟兄会信徒当如何回应？”：", "圣道之民（People of the Bible）", "崭新生活样式之民（People of a New Way of Life）", "圣约共同体之民（People of a Covenant Community）", "和好与和平之民（People of Reconciliation）", "盼望之民（People of Hope）", "2008年，一部由各大洲教会领袖共同撰写的辅导研读课本正式出版，以深化信徒对该宣言的理解与践行。截至2017年，该信仰宣言及其研学读本已被翻译为15种语言。每一个新申请加入的成员（即国家教会总会）都必须庄严认同这一国际信仰宣言。他们既可直接采纳原文，亦可将其作为基准蓝本，融入契合本土处境的特定教义侧重。", "基督教神学教育始终是 ICOMB 关注的重中之重。它设立并运作“全球奖学金基金”（Global Scholarship Fund），为那些学成后将在本国教会投身领袖培养的国家级教牧骨干提供深造资助。此外，ICOMB 还主导为刚果民主共和国300多所门诺会中小学校（涵盖1至12年级）编撰了基于重洗派核心价值观的成套统编教材。这套课程完全由刚果本土学者在 ICOMB 的资助下自主研发编写，有力重振了当地服侍近75,000名在校学子的门诺会教会教育系统。", "简而言之，ICOMB 就是属于您的国际大家庭。如果您正在研读本书，您很可能正在探索门诺弟兄会大家庭的信仰底蕴，或是正在担任门诺弟兄会的教牧领袖，亦或正在考虑接受信徒洗礼加入会友行列。请坚信，您绝非孤身一人！您深植于一间提供门徒造就与属灵呵护的地方堂会；这间地方堂会隶属于一个地方区会，区会隶属于美国门诺弟兄会全国总会（USMB），而 USMB 则是 ICOMB 全球共同体不可分割的一员。", "在世界每一个角落，您都拥有同气连枝的门诺弟兄会弟兄姊妹。他们当中，有人身处贫困窘境；有人饱受腐败专制政权的漠视与压制；有人正经历着严酷的信仰逼迫；亦有人生活在物质丰饶的国度。", "我们的第一身份，始终锚定在我们的主与救主耶稣基督里。", "其次，我们在认信身份上属于门诺弟兄会：我们坚信圣经是上帝无误的圣言；我们坚信唯独悔改并信靠耶稣基督方能得救；我们坚信圣灵带来的生命复兴；我们坚信教会是基督临在世界的身体；我们坚信和好——一份关乎全人生命、带来人与神和好以及人与人和睦的整全福音；我们坚信上帝的国度“既已临到，尚未完全”，基督的再临必按上帝的时间与旨意成全万有。", "第三，我们是一间负有差传使命的教会：我们竭力在地方社区、全国范围乃至地极全地，传扬耶稣基督救赎的福音好消息。", "在席卷全球的 COVID-19 疫情期间，身处世界各地的家庭成员因着地域环境的差异经历了不同程度的冲击。大家庭学会了更加感恩现代科技在维系彼此交通中所发挥的纽带作用。全球门诺弟兄会大家庭同样如此。2020年和2021年，ICOMB 年度峰会转战线上举行。2020年，共有80位代表参加了两次全球全体大会和四场大洲区域会议。尽管日本已是夜间10点，而温哥华尚是清晨6点，跨越相距达11,500英里的物理阻隔，各国代表依然能在线上彼此倾诉、同心祷告，并在各自屏幕前同领主餐圣餐。", "以下简要巡礼我们全球门诺弟兄会大家庭的生动版图——既涵盖 ICOMB 的正式成员，亦包括正在蓬勃孕育中的未来新伙伴。"], "en_paras": ["Mennonite Brethren Family Have you been part of a successful family gathering? Relatives come together from far and wide to catch up on old friendships and expand connections to new family members. Christian clans tell stories, do activities, sing and pray. Sometimes we’re not sure we want to go, but at the end, everyone is happy they put in the effort. The International Community of Mennonite Brethren (ICOMB) is a family that continues to grow. In our case, it’s because we are a church on God’s mission. New members are born because someone reached out to a region where the gospel of Jesus is not known. After some time, a cluster of local churches registers as a new Mennonite Brethren body. In 2017, an exciting ICOMB family gathering occurred in Thailand, bringing together some 240 delegates from 36 countries. Normally, ICOMB summits occur annually when leaders of the 22-member national churches gather for sharing, equipping and spiritual encouragement. This time, ICOMB invited leaders of another 15 emerging national church bodies in partnership with Multiply. Thailand 2017 was the fifth ICOMB- sponsored consultation (the others were the general global consultation in 1999 in Wichita, Kansas; higher education consultations in 2007 in Fresno, California, and in 2011 in Winnipeg, Manitoba; and a Congo-based education consultation in 2009), but it was the first global mission- focused consultation since 1988, when Curitiba ’88, sponsored by Multiply, gave birth to ICOMB. The purpose of ICOMB is to facilitate the relationships and ministries of its member national churches (conferences) for greater fruit in discipleship and witness. One could say that ICOMB is the international Mennonite Brethren conference, bringing together all the established national Mennonite Brethren churches, including the U.S. Conference of MB Churches (USMB). ICOMB equips and inspires national leaders through community, events and resourcing through long-distance coaching, continental cohort meetings, etc. ICOMB is supported by all national churches. It doesn’t have a big budget, nor many programs. Rather, its power lies in relationships and global identity. In 2004, after a three-year process guided by an international team, the International Confession of Faith was accepted as the guiding Confession for all members. It is compatible with the USMB Confession and all existing Mennonite Brethren Confessions. In an “east-meets-west” style, it combines narrative and point form. It answers the question, “How does God work in the world?” by summarizing the biblical story from Genesis to Revelation. It then answers the question, “How do Mennonite Brethren respond?” in five easy-to-remember points: We are People of the Bible; People of a New Way of Life; People of the Covenant Community; People of Reconciliation; and People of Hope. In 2008, a lesson book, written by leaders from every continent, was published to enhance engagement with the confession. By 2017, the confession and the lesson book had been translated into 15 languages. Every new member (i.e., national church) must adhere to the International Confession of Faith. They may accept it as is or use it as a template to write some of their own confessional emphases. Education is important to ICOMB. It operates the Global Scholarship Fund, giving grants toward study expenses of national leaders who will leverage advanced education for leadership training within their own national church. ICOMB also facilitated the development of a curriculum based on Anabaptist values for more than 300 Mennonite schools (Grades 1-12) in DR Congo. The curriculum was designed and written by Congolese, with funding from ICOMB, to revitalize the Mennonite-run school system there, serving nearly 75,000 students.", "In summary, ICOMB is your international family. If you are reading this, you are likely exploring the Mennonite Brethren family, serving as a Mennonite Brethren pastor or considering baptism and membership. You are not alone! You are part of a local church that provides discipleship and nurture in your faith. Moreover, your local church is part of a district church, which is part of the USMB national church. And USMB is part of ICOMB. You have Mennonite Brethren sisters and brothers in every part of the world. Some of them live in poverty. Some are neglected by corrupt or despotic governments. Some undergo active persecution. Some live where resources are plentiful. Our first identity is in Jesus Christ our Lord and Savior. Second, we are Mennonite Brethren in confessional identity. We believe the Bible is the Word of God. We believe that we must confess and believe on Jesus Christ for salvation. We believe in renewal. We believe in the church, which is Christ’s body in the world. We believe in reconciliation—a holistic gospel for the whole person, bringing peace with God and peace among humankind. We believe that the kingdom is here—and not yet; that Christ’s coming will resolve everything in God’s timing and purposes. And third, we are a church on mission. We share the good news of the gospel of Jesus locally, nationally and globally.", "During the global COVID-19 pandemic, family members have been impacted in slightly different ways because of where they live. And families have learned to appreciate the ways in which technology kept them connected with one another. The same is true for the global Mennonite Brethren family. In 2020 and 2021, the annual ICOMB summits were held online. A total of 80 people participated in two global and four regional meetings in 2020. In Japan it was 10:00 p.m. and in Vancouver it was 6:00 a.m., but delegates were still able to share with and pray for one another and to have communion even though some representatives were 11,500 miles apart. What follows is a brief description of the global Mennonite Brethren family, both current members of ICOMB and potential future members."]}, {"sub_zh": "非洲：安哥拉、刚果民主共和国、马拉维及其他地区", "sub_en": "Africa: Angola, DR Congo, Malawi and beyond", "zh_paras": ["安哥拉门诺弟兄会福音教会（IEIMA）", "其历史肇始于1980年代初。当时，一位在刚果服事的宣教士差遣受训领袖重返安哥拉开拓宣教与植堂。这些安哥拉信徒此前为躲避长达30年的惨烈内战（1975–2005）逃往刚果，并在那里与刚果门诺弟兄会相遇归主。然而，在残酷暴力动荡中诞生的教会难免背负沉重的历史创伤——深深的相互猜忌与内部纷争曾长期困扰着他们，领袖们发现很难化解彼此间大大小小的分歧。加之战争的浩劫使绝大多数民众极度贫困，至今整个国家仍在艰辛重建之中。", "即便如此，一所圣经学院通过去中心化的流动教学模式持续培养传道人，教学网络从首都罗安达一直延伸至靠近刚果边境的信徒密集区。这间拥有75个堂会、8,000名会友的教会，在历史上从未有过常驻的外籍宣教士提供现成护航，完全依靠本土信徒在圣灵引导下自立成长。ICOMB 通过教练陪伴、定期走访以及在其选举新领袖的全国代表大会上担任观察员，给予 IEIMA 持续的扶持。", "2020年，因缺乏完备的建筑物硬件基础设施，该国17间地方教会遭到政府勒令关闭。教会领袖正积极筹措资金以期早日重开堂点，并在基层牧者间重建深厚的同工纽带。受疫情冲击，信徒无法外出打工，严峻的经济形势导致严重粮荒。总会大力倡导信徒在房前屋后自种蔬菜以渡过难关，并严抓公共卫生防线。信徒们纷纷在家庭中设立祈祷聚会，委身个人研经，并放胆向邻舍传扬福音。", "刚果民主共和国门诺弟兄会教会共同体（CEFMC）", "拥有约500间堂会、近100,000名洗礼会友，是一座历经百年沧桑的历史名会。门诺弟兄会同工最早于1913年联合门诺会差会进入刚果工场。1922年，门诺弟兄会差会正式决议深耕刚果，并植立了第一间门诺弟兄会堂会。在短短二十年间，教会便创办了约200所学校，福音主要在广袤的农村聚落扎根蔓延。当时的大城市普遍被视为不易结出福音果子的刚硬之地。", "1960年刚果宣告独立，政治风云剧变迫使所有西方宣教士在一夜之间仓促撤离；无论本土领袖是否做足准备，刚果弟兄们毅然挑起了教会治理的千斤重担。由于此前缺乏系统的深造培训，初期在治理能力上面临巨大断层。随着外籍宣教士后来陆续重返，出于人身安全考量，他们选择驻扎在大城市。自那时起，教会开始在乡村与都会双向蓬勃并进，尤其在首都金沙萨（Kinshasa），如今已星罗棋布着约50间极具活力的门诺弟兄会堂会。", "基督教教育迄今仍是 CEFMC 最为耀眼的服事实践。在刚果，教会承担着替国家普及国民教育的法定使命。地方门诺弟兄会堂会统辖运作着约125所涵盖1至12年级的中小学校，造就35,000名莘莘学子。四所坐落于不同乡村社区的圣经学院，持续培训平信徒与全职教牧骨干。金沙萨更设有两所大专院校级别的神学院与医护培训学校。", "当前，CEFMC 正将福音的触角坚定延伸至深山密林中饱受欺凌压迫的巴特瓦（Batwa，即俾格米人）群体。刚果门诺弟兄会更树立起向毗邻刚果的9个周边邻国拓展差传的宏大宣教异象。在局势极度凶险动荡的刚果东部前线，一个由半打新兴教会构成的网络正坚韧挺立。", "尽管按人均收入计算，刚果民主共和国位列全球最贫困的十个国家之列，但 CEFMC 在几乎没有任何外援依傍的境遇下自主稳健运转。他们全面推行“基于本乡本土现有资产的社区发展模式”（Asset-Based Community Development），紧紧立足于手中现有的微薄资源开拓生机。在刚果、安哥拉乃至整个非洲大陆，门诺弟兄会教堂里永远回荡着高亢欢腾的赞美乐章与热烈持久的祷告祈求。地方堂会普遍通过诗班来造就青少年与成年信徒——诗班所吟唱的皆是朗朗上口的圣经经文与救赎叙事，这构成了他们最为锐利有效的福音布道利器。", "马拉维门诺弟兄会（MBCM）", "在2020年 ICOMB 举行的首届线上全球峰会上，马拉维门诺弟兄会被正式接纳为全权正成员。来自全球的数十位门诺领袖在洋溢着属天喜乐的庆典中，向他们致以最热烈的欢迎、祷告与祝福。", "MBCM 的传奇肇始于一位名叫巴哈蒂（野生/Safari）·穆塔贝沙（Safari Mutabesha）的年轻人。在亲眼目睹家人在刚果东部种族屠杀中惨遭杀害后，他九死一生仓皇出逃，最终沦落至马拉维多瓦（Dowa）附近的扎莱卡（Dzaleka）难民营。然而在这片逼仄的难民聚居区，他所面对的依然是绝望的种族敌视与人性的无尽黑暗。绝望之中，他忆起自己曾在刚果门诺弟兄会中所受的门徒训练，以及上帝赋予他传福音的特殊恩赐。于是，他放胆传扬“和平的福音”，指引那些深陷族群仇杀的难民归向真正的“和平之君”。", "2009年，难民营中第一间教会拔地而起。蒙神丰盛恩待，野生·穆塔贝沙与同工们迅速跨出难民营的高墙，深入周边马拉维本土的城镇与村庄拓植教会。2015年，为了给这场迅猛发展的属灵运动寻找长远战略伙伴，MBCM 通过官方网站主动联络了Multiply（全球宣教差会）。双方的同工关系迅猛升温，并在教牧培训、社区发展与整全植堂上结出了累累硕果。至2020年，MBCM 已迅速扩充至37间堂会、14,000名洗礼会友。", "在非洲大陆的其他角落，更多新兴的门诺网络正在破土而出，我们恒切祈求它们早日成长为独立的国家或区域总会：", "在布基纳法索（Burkina Faso），福音派门诺会（EMC）的先驱同工开创了面向纳内里格族（Nanerige）的圣经翻译圣工；如今 Multiply 同工接续深耕，一个兼具门诺弟兄会与 EMC 双重渊源的新兴教会群落正在孕育。", "在布隆迪（Burundi），一个新兴信徒团体全面认同 ICOMB 信仰宣言，正积极申请正式加入。", "在纳米比亚（Namibia），因着 Multiply 短期跨文化门徒造就团队（DMI）的开拓，一间母会带着多个分堂已生根发芽。", "在乌干达（Uganda），一个由30多间教会组成的新兴区会正翘首期盼与 ICOMB 建立正式盟约。", "在北非地区，尽管面临极端宗教势力的严密盯防与残酷压制，仍有大批地下基督徒家庭教会如雨后春笋般归向基督。在摩洛哥、毛里塔尼亚、阿尔及利亚、突尼斯、埃及、沙特阿拉伯以及也门，都可以寻见这些微小却坚韧的群羊——其中也门的重洗派信徒更幽默风趣地自称“也门诺派”（Yemennonites）。"], "en_paras": ["Igreja Evangélica dos Irmãos Menonitas em Angola (IEIMA, Evangelical Churches of Mennonite Brethren in Angola), began in the early 1980s when a missionary to Congo commissioned leaders to return to Angola to evangelize and plant churches. These Angolans had fled the 30-year civil war (1975-2005) and connected with the Mennonite Brethren church in Congo. The unfortunate legacy of a church born during such violent times was deep mistrust and internal conflict. Leaders found it hard to resolve major and minor differences. Moreover, the devastation of the war impoverished most of the population. They are still recovering. Nevertheless, a Bible school trains pastors in a decentralized model, reaching from the capital city of Luanda out to the majority membership located near the Congo border. This church of 8,000 members in 75 congregations never had a foreign missionary presence to guide them. ICOMB supports IEIMA through coaching, visits and observing their general assemblies when they elect new leaders. In 2020, 17 local churches were closed by the government because of a lack of infrastructure, specifically church buildings. Church leaders are raising funds to reopen the churches and to build relationships among local pastors. Because of COVID-19, church members are not able to travel, and the economic situation has led to a significant lack of food. The conference is encouraging members to grow vegetables to have something to eat and are emphasizing hygiene and handwashing. Members are meeting in their homes for prayer meetings, are engaged in personal Bible study and are evangelizing their neighbors. Communauté des Églises des Frères Mennonites au Congo (CEFMC, Community of MB Churches of Congo) numbers about 100,000 members in some 500 congregations. This church is around 100 years old.", "Mennonite Brethren workers went to Congo under the Mennonite mission board in 1913. In 1922, the MB Mission board finally agreed we should engage in Congo, and the first Mennonite Brethren congregation was planted then. Within 20 years, some 200 schools were operating, and the church grew primarily in the rural areas. The cities were not regarded as fertile for the gospel. In 1960, independence dramatically pushed all missionaries out; the Congolese took over church leadership, ready or not. There were major gaps in ability because of a lack of training. As missionaries gradually returned, they located in the cities, for security. Since then, the church has thrived in both rural and urban regions, particularly in Kinshasa, the capital, with around 50 Mennonite Brethren congregations. Education still is a major feature of CEFMC. The churches of Congo were mandated to run the schools. Local Mennonite Brethren churches and groups operate about 125 schools for grades 1-12, serving 35,000 students. Four Bible schools, located in various rural communities, train lay and pastoral leaders. Two college- level schools operate in Kinshasa, offering pastoral and medical training. CEFMC currently reaches out to the oppressed Batwa (pygmy) people deep in the forests. The Congolese MB church has a vision to reach the nine countries bordering DR Congo. A network of half a dozen churches is found in the challenging region of Eastern Congo. CEFMC operates with very little foreign assistance, even though its earnings per capita locate DR Congo among the 10 poorest nations on earth. They employ Asset-Based Community Development, working with resources already in hand. The church in Congo and Angola—indeed in most African regions—is alive with loud, exuberant worship and fervent prayer. Local congregations disciple youth and adults through choirs, which typically sing Scripture texts and stories. These choirs also are an effective outreach tool. The Mennonite Brethren Church in Malawi (MBCM) was welcomed as a full member of ICOMB in 2020 during ICOMB’s first ever online summit. Dozens of Mennonite Brethren leaders from around the world offered words of welcome, prayers and blessings in a joyful celebration. The story of MBCM begins with a young man, Bahati (Safari) Mutabesha, fleeing for his life after seeing his family killed in eastern DR Congo due to ethnic conflict. Safari ended up in the Dzaleka Refugee Camp, near Dowa, Malawi. However, here, too, he finds ethnic conflict and a near hopeless situation. He remembered his discipling in an MB church and his gifting as an evangelist. So, he began sharing the Gospel of Peace and pointed conflicted refugees to the Prince of Peace. And in 2009, a church was planted in the refugee camp. With God’s blessing on them, Safari and fellow workers began planting churches outside the refugee camp among nearby Malawian towns and villages. In 2015, in search of partnerships for their growing movement, the MBCM contacted MB Mission (now Multiply) through their website. This partnership grew rapidly and has resulted in further growth in training, community development and church planting. In 2020, MBCM counted 37 churches and 14,000 members. Elsewhere in Africa are other emerging networks and we pray these will become new national or regional churches. In Burkina Faso, Evangelical Mennonite Conference (EMC) workers began a Bible translation project with Nanerige people. Multiply workers have continued the work. An emerging church connects to both the Mennonite Brethren and EMC international church communities. In Burundi, an emerging group has embraced the ICOMB Confession of Faith and is seeking membership. In Namibia, one church with various satellites has grown out of the witness of Multiply’s short-term Disciple Making International (DMI) teams. An emerging conference of more than 30 churches in Uganda is interested in linking with ICOMB. In North Africa, significant numbers of underground groups are coming to Christ amid suspicion and opposition from radical Muslims. Small groups are found in Morocco, Mauritania, Algeria, Tunisia, Egypt, Saudi Arabia and Yemen—the latter colloquially call themselves “Yemennonites.”"]}, {"sub_zh": "亚洲：印度、日本、克木人差传及其他工场", "sub_en": "Asia: India, Japan, Khmu Mission and beyond", "zh_paras": ["印度门诺弟兄会总会（Conference of the Mennonite Brethren Churches in India）", "是我们历史最为悠久、会友规模最为庞大的国家总会。第一批门诺弟兄会海外宣教士从俄国（现乌克兰境内）远赴海得拉巴（Hyderabad），并在纳尔贡达（Nalgonda）建立了第一间堂会。如今，印度门诺弟兄会坐拥约1,000间地方堂会，洗礼会友高达近200,000人！", "历史上，印度教会是通过建立宣教“基地”（mission stations）或综合院落拓殖起来的。早期门诺弟兄会与浸信会差会携手，在海得拉巴东部购置了大片地产。然而在那个宣教时代，“宣教区划和睦协定”（Comity Agreement，源自威廉·克里为避免不同差会争夺灵魂而提倡的工场划分原则）占据主导地位。于是，门诺弟兄会与浸信会达成了一项“基地置换”协议：门诺弟兄会将东部的新基地让渡给浸信会，换取了海得拉巴以南的数处成熟基地。因此，今天的印度门诺弟兄会主要集中在海得拉巴城内及其南部广大乡村地区。人们至今仍能走访这些历史基地原址——它们如今已发展为大型综合学府，其中两处更孕育出拥有数千名会友的庞大堂会。", "昔日的宣教院落集礼拜堂、医院、学校、农场以及宣教士寓所于一体，全心聚焦于服侍处于社会最底层的赤贫“不可接触者”（达利特人，Dalits）。到1970年，差会政策的革新与印度本土民族意识的高涨相互激荡，推动印度门诺弟兄会实现了完全的自治与本土化治理。", "今天，印度教会按“以堂会为中心的事工单元”组织运转。实力雄厚的大教会纷纷组建并差派巡回布道队，产生倍增拓殖效应。教会拓展同工与牧者由坐落于海得拉巴近郊繁华小镇沙姆沙巴德（Shamshabad）的“门诺弟兄会百年圣经学院”（MB Centenary Bible College）负责悉心培养。学院在校本部实行英语授课，并在贴近基层教牧工人的多个区域教学点推行泰卢固语（Telugu）延伸神学教育。", "尽管 COVID-19 疫情带来了巨大的伤痛与生离死别，但教会近期的感恩庆典依然见证了复兴——切尼帕杜（Chennipadu）新教堂落成献堂礼拜便是一例。这场历时三天的感恩盛会汇聚了盛大的爱筵聚餐，整个村庄周围扎满了欢庆的帐篷，邻近各堂会纷纷送上属天的丰盛祝福。", "日本门诺弟兄会（Mennonite Brethren Church in Japan）", "诞生于1950年，源于北美门诺弟兄会差派宣教士的拓荒服侍。以国际大都市大阪为轴心，日本门诺弟兄会组织极为严密完备，自主运作独立神学院、青少年营会事工，并在其麾下绝大多数堂会（共29间）实现了全职受薪牧者的常态化牧养。", "在2015年隆重庆祝建会65周年之后，日本信仰与生活委员会开启了将《ICOMB 国际信仰宣言》进行深度本土处境化诠释的历程——尤其针对日本政界推动修改和平宪法、建立国防正规军的社会浪潮。修宪在日本社会引发了极大的争议。这一时代挑战促使日本教会在自身的文化与政治语境中，围绕和平神学开展深度的“自主神学反思”（self-theologizing）。", "此外，国家与教会双重老龄化的加剧，以及社会文化向“后现代”、“后佛教”世俗化心态的剧烈转变，构成了日本教会面对的另一大严峻现实，迫使教会深刻反思其福音见证与门徒培育的路径。", "2020年，日本门诺弟兄会总会为全新的综合会议中心兼神学院——“门诺弟兄会宣教中心”（MB Mission Center）举行了感恩献堂礼。同年晚些时候，疫情严重阻碍了实体教会活动，尤其是街头与公众布道；但各堂会迅速转战线上，并在全球网络中与普世肢体紧密相连。疫情亦促使日本总会将70周年感恩庆典移至线上隆重举行。", "老挝克木人差传（Khmu Mission）", "于2012年正式被接纳为 ICOMB 成员，是国际大家庭中最年轻的成员之一。1990年代初，老挝境内的本土牧者辗转联络到了居住在加州的克木族基督徒彭·考·克奥维莱（Phone Keo Keovilay）。克奥维莱因在越战期间的贡献而获得美国国籍。在门诺弟兄会圣经神学院（现弗雷斯诺太平洋圣经神学院）攻读学位期间，克奥维莱定期冒险返回老挝，暗中坚固扶持这些本土牧者。后来，出于安全考虑，他和妻子选择定居于泰国北部，在湄公河畔建立了一座跨国培训中心，隔河接待并装备老挝境内的教会领袖。", "如今，克木人差传已发展出350个教会团契，其中约半数拥有“正式建成的独立教堂”，其余则以家庭教会形式聚会。此外，通过牧者与信徒的奋力布道，福音还辐射至众多乡村“讲道据点”。在老挝，公开传教虽属违法，但基督教信仰受到官方承认，信徒被允许向有血缘关系的亲属分享信仰。克木族信徒于是详尽梳理自己的家族族谱，借探亲访友之机全力传福音——这彻底改写了传统北美门诺人寻找远亲的“门诺游戏”定义！", "由于泛灵论巫术传统在当地根深蒂固，受洗候选人在受洗前会被本土领袖（绝非外籍宣教士）严肃要求当场摘除身上的护身手镯与各类辟邪符咒，以此作为彻底决裂黑暗势力、单单委身基督的坚决宣告。有时村民会对教会充满敌意，甚至将村里的灾祸归咎于不再向山林精怪祭祀献牲的基督徒。", "尽管总会命名为“克木人差传”，其会友构成早已超越了单一的克木族：约五分之一的会友是苗族（Hmong），另有相当比例来自其他少数民族。Multiply（全球宣教差会）虽在资金与人力上提供长效支持，但克木人差传已具备健全的组织治理体系，由成熟的地方区会领袖统管各大片区，并怀揣着向整个东南亚（如缅甸、中国、越南、柬埔寨）克木族及其近亲族群传扬福音的远大国度抱负。", "亚洲同非洲一样，是门诺弟兄会未来生机与增长的核心阵地。我们的大家庭正在多个亚洲国家孕育新的群羊：", "缅甸（Myanmar）的宣教由三股力量汇聚推动：印度门诺弟兄会总会全额资助其神学院培养的本土宣教士常驻开荒；克木人差传借助其跨境族群网络拓植聚会点；以及一位由缅甸外劳成长为牧者的弟兄，在加拿大宣教士的协助下，不仅在曼谷近郊植立了面向缅甸劳工的堂会群，更将教会拓植回缅甸本土。", "菲律宾门诺弟兄会（Kapatirang Menonite Ng Pilipinas Incorporated）是一个由分布在不同大区的8间地方堂会、约670名会友组成的新兴总会。面对疫情，他们迅速运用 Facebook 与 YouTube 维持敬拜与团契；2021年9月，该会欣喜迎来17位初信者受洗（部分是由 Multiply 短期青年队领信归主的果子）。教会还在巴拉望州立大学开展校园宣教，并在布鲁克斯角（Brooke’s Point）营地举办了面向90位领袖的密集神学培训。", "中国（China）曾是北美门诺弟兄会历史上最大的海外宣教工场，派驻的宣教士人数超过其他任何地区。历经历史风云与沧桑变迁，今日极少数耄耋之年的老信徒仍依稀记得当年西方宣教士的音容；然而更重要的是，一间忠心服事基督的教会在艰辛岁月中生根发芽，在流动民工群体中涌现出全新的植堂见证。Multiply 同工正持续赋能本土教会领袖开拓植堂。", "在印度尼西亚（Indonesia），我们历史上曾通过教牧培育与穆里亚教会会议（Muria Synod）保持深厚交通。1970年代，毕业于门诺弟兄会圣经神学院的阿迪·苏坦托（Adi Sutanto）创立了号角基金会，由此孕育了印尼基督徒会友联合会（JMB / JKI）。JKI 是一场追求圣灵更新的跨国教会网络，在全球（包括美国、澳洲和荷兰）拥有超过45,000名会友。当今全球单间规模最大的门诺会超级堂会正是位于印尼三宝垄（Semarang）的 JKI 圣山堂，其会友规模达20,000人之巨！"], "en_paras": ["The Conference of the Mennonite Brethren Churches in India is one of our oldest national churches and the largest. The first MB missionaries went from Russia (now Ukraine) to Hyderabad and organized the first church in Nalgonda. Today India’s Mennonite Brethren church numbers around 200,000 members in some 1,000 congregations. Originally, the church was established in India through mission “stations” or compounds. The Mennonite Brethren bought several large properties in the region east of Hyderabad in cooperation with the Baptist missions. But during that period, comity held sway. This was William Carey’s idea of working in discrete fields to avoid direct “competition for souls.” Therefore, the Mennonite Brethren and the Baptists arranged a “swap”: the Mennonite Brethren ceded the new stations to the Baptists and received several stations south of Hyderabad. And so today, the India MB church is found in Hyderabad and rural districts to the south. One can still visit the original sites which have been turned into large schools and in two cases, Baptist congregations of several thousand members. The station compounds included churches, hospitals, schools, farming operations and missionary residences. They focused on reaching poverty-stricken “untouchables” (Dalits). By 1970, changing mission policy and rising nationalism combined to allow the India Mennonite Brethren church to emerge into autonomous self- governance. Today, the church is organized into congregation- centered ministry units. Larger local churches sponsor outreach teams, creating a multiplying effect. Church extension workers and pastors are trained through MB Centenary Bible College in Shamshabad, a bustling village near Hyderabad. The college teaches in English on campus and in Telugu in extension course programs in various centers closer to the pastoral workers. Despite the sorrows brought by COVID-19, recent celebrations included a successful dedication of the Chennipadu church building. The three-day celebration included large group meals, tents erected around the village and gifts of blessing from surrounding churches. The Mennonite Brethren church in Japan was born in 1950 because of the ministry of missionaries sent by Mennonite Brethren churches in North America. Centered in the metropolis of Osaka, the Japanese MB church is well organized, operating its own seminary, youth and camping programs and supporting full-time pastors in most of the 29 congregations. After celebrating its 65th anniversary in 2015, the Japanese Board of Faith and Life embarked on contextualizing the ICOMB International Confession of Faith in light of the government’s push to create a standing army. This is a constitutional change and controversial for many in Japan. This push is challenging the church to “self-theologize” on the question of peace in their context. Other major challenges are found in the aging of both country and church, coupled with a strong post-modern, post-Buddhist shift in the culture. These are calling the church to rethink its approach to witness and discipleship. In 2020, the Japanese MB Conference dedicated the MB Mission Center, a new conference center and seminary. Later that year, all church activities were severely restricted due to COVID-19, especially impacting evangelistic activities. But churches continued to minister online and were able to connect with Christians around the world. The pandemic also forced the Japan MB Conference to move their 70th anniversary celebration online. Accepted in 2012, the Mennonite Brethren church in Laos , Khmu Mission, is one of the newer members of ICOMB. In the early 1990s, pastors in the country contacted Phone Keo Keovilay, a Khmu Christian from Laos, living in California, who had earned a U.S. passport due to his contributions during the Vietnam War. Keovilay periodically returned to Laos to support these pastors during his studies at MB Biblical Seminary, now Fresno Pacific Biblical Seminary. Eventually he and his wife moved into northern Thailand (rather than Laos, for security reasons) and established a training center on the Mekong River, accessible to leaders in the growing church on the Laos side of the river. Today, there are 350 Khmu Mission church fellowships, approximately half with “built churches” and the rest meeting in homes. There are many more “preaching point” villages reached by the evangelistic efforts of pastors and others. While it is illegal to proselytize, Christianity is recognized, and people are permitted to share the faith with relatives. Khmu believers comb their family trees for opportunities to share the gospel—redefining the “Mennonite game” of discovering one’s relatives. The animistic worldview is still prevalent. Therefore, baptism candidates are asked (by local leaders, not expatriate missionaries) to remove bracelets or other amulets as an expression of faith and total commitment. Villagers may be hostile to a church because they may interpret bad experiences to be the fault of Christians who no longer make merit or provide daily offerings to the powers that be. Although the conference is called “Khmu Mission,” its membership reaches beyond the Khmu. Perhaps one-fifth of the members are Hmong and another small percentage are from various tribal origins. While Multiply continues to provide support through workers and finance, Khmu Mission has good structures, capable leaders over regionally organized groups of churches and a strong mission vision to reach Khmu and related groups in South East Asia (such as Myanmar, China, Vietnam and Cambodia). Asia will, like Africa, be an area of interest and growth for Mennonite Brethren. Our family is developing groups of churches in various countries. Outreach to Myanmar (Burma) comes from three sources. The India Mennonite Brethren church supports a worker who trained at their college. Khmu Mission has developed congregations through its expanding network. And finally, a Burmese migrant worker-cum- pastor is leading, together with Canadian missionaries, an expanding group of churches that he has planted near Bangkok, Thailand, as well as within his home country. Kapatirang Menonite Ng Pilipinas Incorporated (Mennonite Brethren of the Philippines) is an emerging conference composed of eight local churches in different regions of the country, with a total of about 670 members. In-person home Bible studies, visitations, campus outreaches and other ministries were put on hold because of COVID-19. Despite limited technology, the conference quickly pivoted to online services and used Facebook and YouTube to connect with their congregations with services, prayer meetings and chat groups. In September 2021, the group celebrated the baptism of 17 individuals. Some of these new believers were introduced to the gospel by Multiply TREK teams. The churches have a ministry on the Palawan State University campus and anticipate renovating their center, Brooke’s Point, once classes resume. The center was the site of two leadership training modules attended by a total of 90 pastors, church leaders and youth leaders. China was once our largest mission field. More North American Mennonite Brethren missionaries spent time there than in any other location. The Cultural Revolution removed all these missionaries and forced the church to go underground. Today, a tiny handful of very old Christians still remember some missionaries. More important is the growth of a church faithfully serving God in a hostile environment. Also, there is an emerging new work among migrant workers. Multiply workers are facilitating and supporting Chinese leaders who are planting churches. In the past, we have had close relations in Indonesia with the Mennonites of the Muria Synod through pastoral development. In the 1970s, MB Biblical Seminary (now Fresno Pacific Biblical Seminary) graduate Adi Sutanto founded the Sangkakala Foundation, which spawned the Jemaat Kristen Indonesia. JKI is a renewal-oriented family of churches of more than 45,000 members in a variety of countries, including the U.S., Australia and the Netherlands. The largest Mennonite church in the world is the JKI church, in Semarang, Indonesia, with some 20,000 members (Lapp, 104-116)."]}, {"sub_zh": "欧洲：奥地利、德国、立陶宛、葡萄牙及前线见证", "sub_en": "Europe: Austria, Germany, Lithuania, Portugal and beyond", "zh_paras": ["在流散北美四个世纪之后，16世纪重洗派运动的精神后裔——北美门诺人以宣教士的全新姿态重返欧洲故土。二战硝烟甫定，他们作为和好使者与救济干事，随门诺会中央委员会（MCC）奔赴德国、奥地利及西欧重灾区开展战后人道主义救济，这为日后门诺弟兄会的布道植堂叩开了历史的大门。", "奥地利门诺自由教会（Mennonitischer Freikirche Oesterreich）", "植堂始于上奥地利州首府林茨（Linz）近郊。战后初期，当地20个难民营里聚集了约30,000名绝望的难民。奥地利曾是16世纪天主教反宗教改革运动最为严酷的重镇，直到21世纪，国教政权传统依然极力压制独立自由教会的发展。历经数十载忠心而缓慢的拓荒，如今建立起由5间堂会、400多名会友构成的教区，在高度世俗化、物欲横流的现代社会中活出深邃而热切的灵性追求。", "德国：三大总会交相辉映（AMBD、VMBB、BTG）", "在莱茵河畔的新维德（Neuwied am Rhein），来自波兰与前苏联的门诺弟兄会难民携手成立了西欧本土第一间门诺弟兄会堂会，这标志着德国门诺弟兄会联合会（AMBD）的诞生。今天，新维德教会积极向来自叙利亚及中东各国的难民敞开怀抱，传扬基督的大爱。历经数十年开拓，同工将事工网络扩展至柏林以及前东德的德累斯顿。在疫情前，AMBD 麾下13间堂会拥有1,500多名会友；在疫情期间，其人数逆势增长，至2021年底已达1,700人。", "与此同时，早年在奥地利植堂的北美宣教士亦将福音触角延伸至邻近的德国巴伐利亚各城镇。最初这是一个跨越国境的单一联合网络；1970至1993年间，在渴望灵命复兴的路德宗信徒群体中相继建立了8间堂会。后来，由于地理阻隔与文化差异，巴伐利亚群体从 AMBD 独立出来，成立了巴伐利亚门诺弟兄会联合会（VMBB）。然而时过境迁，该联合会目前仅存4间堂会。回首反思，历史表明教会应当倾注更多心血去深耕认信身份，珍惜呵护滋养这一身份的核心信仰共同体。", "1987年苏联放宽出境限制法案的实施，引爆了德裔移民涌入德国的狂潮；1989年苏联的轰然解体更使这一移民洪流达到顶峰。他们被称为“归国定居者”（Aussiedler）。在德国政府统归于“其他认信派别”的约50万归国定居者中，包含了约30万浸信会与门诺会（统称“福音派自由教会”）信徒。大体而言，这批历经苏联严酷考验的归侨发现，自己很难融入德国本土西化、学术化的既有自由教会之中。于是，他们按在俄国长期形成的家庭聚会传统，自主创建了一批极具生命力的聚会。", "由于苏联体制下官方仅承认浸信会而取缔门诺会，使得这批归侨的宗派标签交织重叠。在德国建立的诸多归侨教会联盟中，重洗派浸礼会联盟（BTG）聚集了最高比例的门诺弟兄会信徒，是全德归侨教会中最稳健、最具规模的联合会。据 BTG 主席海因里希·克拉森（Heinrich Klassen）介绍，BTG 始于1989年的6间教会，如今已发展为拥有50间堂会、12,000名受洗会友的宏大宗派。BTG 自主运作一所圣经神学院及四大海外差会；拥有9支由近50人组成的巡回教牧事奉团队，在全德各堂会开展研讨会、植堂督导、神学建设及教牧关怀。BTG 各堂会还全力投身难民事工，将主日崇拜实时同传翻译为波斯语、土耳其语、阿拉伯语、俄语等多种语言，并在特大洪灾中派遣庞大义工团队运送救济物资、见证基督的大爱。", "立陶宛自由基督教会（LLKB）于2014年正式加入 ICOMB。在戈尔巴乔夫时代，为靠近德国，部分乌克兰与俄国门诺信徒迁居立陶宛克莱佩达，建立了自由基督教会。随着苏联解体与立陶宛独立，北美与欧洲门诺学者应立陶宛首任教育部长之邀创办了立陶宛基督教大学（LCC International University），现已成为立陶宛高等教育的璀璨明珠（现任校长玛琳·沃尔为美国门诺弟兄会教育家）。依托 LCC 的学术平台，北美与德国同工展开了扎实的宣教。如今7间堂会、200多名会友向社会作见证，开展日托中心、青少年夏令营，并已向海外（如巴西）差派宣教士。", "葡萄牙门诺弟兄会（IIMP）于2004年加入大家庭。北美宣教士于1980年代开拓，后与安哥拉弟兄同工，建立了融合葡萄牙本土与非洲移民的堂会；1990年代德国 BTG 亦差派同工到里斯本服侍俄语移民。2020年，该会正式获得国家法定宗教法人资格，现辖6间堂会、约200名会友。", "乌克兰（Ukraine）——门诺弟兄会的发源地", "历史在二十世纪末完成了奇妙的圆满循环。1990年代中期，门诺弟兄会重返其发祥地乌克兰开启宣教。如今，乌克兰本土已植立了25间堂会（外加被兼并的克里米亚半岛上的2间）。面对顿巴斯前线的战火硝烟，教会每周组织救济车队冒着炮火深入交火冲突区，为失去一切的难民运送粮食与救命药品；许多新堂直接在炮火连天的前线地带拔地而起。信徒勇敢地向前线官兵传福音，带领许多在数日后便壮烈捐躯的战士归主。乌克兰门诺弟兄会总会（AMBCU）即将正式成为 ICOMB 的正式一员。", "在吉尔吉斯斯坦（Kyrgyzstan），二战后流放的中亚德裔门诺人虽在冷战后大部迁往德国，但宣教士海因里希与安妮·伦佩尔夫妇（Heinrich & Annie Rempel）毅然重返中亚未得之民工场深耕30年。由他们开拓的新兴总会“门徒教会联盟”（Maschayaktyn Jamatty）已发展出5间堂会、2个新植堂点及众多家庭团契；在托克马克（Tokmok）建立的教会是该国历史上首间门诺弟兄会教堂，开设有疫情救济、戒毒康复中心、青年中心及盲人事工。", "在西班牙，巴塞罗那保留有一间忠心传扬基督的堂会；而在土耳其，因着一位宣教士与一位当地基督徒司机的奇妙偶遇，开启了北美与欧洲同工进驻该国的全新宣教篇章。"], "en_paras": ["After four centuries, Mennonites from North America— spiritual heirs of 16th century Anabaptists—returned to Europe on a mission. They came to Germany, Austria and other Western European nations as agents of reconciliation and ministers of relief with Mennonite Central Committee after World War 2. This opened the door for evangelism and church planting by Mennonite Brethren. The Mennonite Brethren national church in Austria is known as Mennonitischer Freikirche Oesterreich (Mennonite Free Church of Austria). Church planting began near Linz, the capital of Upper Austria, where some 30,000 refugees dwelt in 20 camps after the war. Austria was the site of aggressive Counter-Reformation efforts in the 1500s. Until the 21st century, the magisterial church resisted the development of free churches. Slow faithful growth has resulted in a conference of five congregations and more than 400 members, with heartfelt spirituality and longing to reach a post-churched, materialistic society. Germany has three conferences—AMBD, VMBB and BTG. In Neuwied am Rhein, refugees from Poland and the Soviet Union who had been Mennonite Brethren members united to form the first Mennonite Brethren congregation in Western Europe. This was the beginning of the AMBD conference (Arbeitsgemeinschaft Mennonitischer Brüdergemeinden in Deutschland). Today the Neuwied church reaches out faithfully to new immigrants coming to Germany from Syria and other Middle Eastern countries. Over time, mission workers from Germany and North America extended the AMBD fellowship, reaching to Berlin and former East Germany’s Dresden. Prior to COVID-19 AMBD’s 13 local churches had more than 1500 members. AMBD has grown during the pandemic, reaching 1,700 people by the end of 2021. “We are very grateful that, in addition to the online offerings, most churches still held presence services throughout the pandemic,” reported AMBD in the January 2022 ICOMB newsletter. “Churches often enjoy greater freedom than other sectors of society during this time. That is a reason to be very grateful.” AMBD hoped to gather in 2022 for its regular Pentecost conference. Meanwhile, North American missionaries planting churches in Austria had the opportunity to reach out to Bavarian towns. At first this was one network, straddling the border. From 1970 to 1993, eight local churches were founded in Bavaria among Lutherans looking for renewal. The Bavaria group felt distant geographically and culturally from the AMBD group, so the VMBB (Verband Mennonitischer Brüdergemeinden in Bayern) was formed. Today, only four churches remain. Two closed and two withdrew from the fellowship. Upon reflection, greater care could have been taken to cultivate our confessional identity and to love the primary community which nurtures that identity.", "In 1987, a new Soviet law governing exits came into effect, triggering a flood of migrants into Germany. The breakup of the Soviet Union in 1989 simply added to this effect. They are called Aussiedler (resettlers). While AMBD’s original members were Aussiedler, the German government officially grouped some half-million Aussiedler under the heading “Other Confessions.” Included among them were about 300,000 Baptists and Mennonites, also known as “evangelical free churches.” Broadly speaking, they discovered they were not at home among the AMBD or other established Mennonite churches founded through mission efforts. Therefore, they created their own congregations more reflective of their church experience in Russia. Also reflective of their Soviet experience was the challenge of identity when the government only recognized certain Christian labels. Baptist was recognized; Mennonite was not. Through the decades, many different alignments occurred. Therefore, as church networks and associations were established in Germany, some groups held more Mennonite Brethren individuals than others. The BTG (Bund Taufgesinnter Gemeinden) has the largest percentage of Mennonite Brethren among these associations and is one of the more stable and developed unions of Aussiedler congregations. Heinrich Klassen, chairman of the BTG, reports that the German Anabaptist Churches started to work together in 1989. BTG started with six churches. Today, 50 churches belong to BTG (with 12,000 members). BTG runs a Bible seminary and four mission agencies. At the start of 2022 they reported nine traveling ministry teams comprised of almost 50 people from various churches and partner ministries. The teams organize seminars, plan for church plants, work on theology, train leaders and offer pastoral care seminars for congregations. The BTG congregations are also engaged in refugee work and translate their worship services into Farsi, Turkish, Arabic, Russian and so on. BTG congregations are responding to recent floods by sending volunteers to meet practical needs and to share the love of Jesus. The Lithuania Free Christian Church (LLKB) joined ICOMB in 2014. In the Gorbachev era, Mennonites from Ukraine and Russia settled in Lithuania to be near Germany. They formed a church known as the Free Christian Church. When the Soviet Union broke up, herculean effort by Lithuanians achieved national independence in 1991. This paved the way for Mennonites interested in education to respond to a call from the new Minister of Education to establish a university. Today, LCC University is a major contributor to the Lithuanian educational scene. LCC President Marlene Wall is a MB educator from the United States. The establishment of LCC triggered mission efforts from North America and Germany. Today seven local churches with more than 200 members witness to Christ. Local congregations have a variety of local ministries, including a daycare, and together host summer camps for children and teens. They are also involved in church planting and have sent missionaries to other countries, most recently Brazil. Portugal is another one of ICOMB’s newer members; they joined in 2004. North American missionaries began leading outreach efforts there in the 1980s, later joined by Angolan leaders, resulting in several churches of Portuguese and African members. Joining them in the 1990s, BTG sent missionaries from Germany to work with Russian resettlers in Lisbon. The conference was legally recognized as a religious entity in 2020. Today there are six congregations with a total membership around 200 in the Igreja dos Irmaos Menonitas de Portugal (IIMP). Since achieving this recognition, IIMP is restructuring with the goal of enriching church relationships and unifying mission, ministries and vision. Leaders are building systems of pastoral care and developing strategies toward building financial health. The Mennonite Brethren movement has come full circle to its birthplace, Ukraine. Mission effort began in the mid-1990s. Today, there are 25 churches, plus two in Crimea, which became Russian after annexation. Individuals and churches from North America and Europe support programs for orphans and widows, and for an alternative education approach for teenagers and young adults.", "These approaches are the backbone of church planting, along with weekly relief trips into the conflict zone of East Ukraine to deliver food and medicine to people who have lost everything due to shelling. Churches have started very near to and inside the conflict zone. The church actively shares the gospel with Ukrainian troops, sometimes only days before they are killed in combat. The Association of the MB Churches of Ukraine (AMBCU) expects to become a member of ICOMB very soon. An ICOMB conference is also emerging in Kyrgyzstan. After World War 2, Kyrgyzstan became a place of refuge for many forcibly displaced Germans, including German Mennonites. However, missionary outreach among the indigenous population was slow, beginning only 20 years later. By the end of the 1980s, almost all ethnic Germans had emigrated to Germany. Just a few years later, missionaries like Heinrich and Annie Rempel, originally from nearby Tajikistan, returned to the region to plant churches among the people of Central Asia, among the least reached in the world. The Rempels have worked in the area for 30 years, 14 of them in-country. Their vision is to start new church planting efforts and to help scattered churches work together. Their ministry has recently been enhanced by their relationship with Kyrgyz Evangelical Alliance leaders. The emerging conference, named Maschayaktyn Jamatty (Disciples of Churches), includes five churches, two church plants and home groups that wish to become churches. The church in Tokmok, planted by Timurlan and Irina Abdyldaev, is the first-ever MB church in the country. Some of their ministries include pandemic relief, a rehabilitation center, youth work and a ministry to the blind. In Spain, church planting efforts in the 1980s went very slowly, and MB Mission (now Multiply) pulled out, leaving a single local church that still carries witness to Christ in Barcelona. And in Turkey, work began through a “chance” encounter between a Mennonite Brethren missionary and a Christian van driver. This has fostered a new initiative in Turkey, sending a significant number of North American and European workers into that country."]}, {"sub_zh": "拉丁美洲：巴西、哥伦比亚、墨西哥、巴拿马、巴拉圭、秘鲁、乌拉圭及其他地区", "sub_en": "Latin America: Brazil, Colombia, Mexico, Panama, Paraguay, Peru, Uruguay and beyond", "zh_paras": ["巴西门诺弟兄会福音教会全国大会（COBIM）", "始于1930年因逃避苏联迫害而迁徙至巴西原始亚热带丛林拓荒的门诺弟兄会难民。随着移民源源不断涌入，教会迅速拓展。1948年，巴西与巴拉圭的门诺弟兄会联合组建了“南美门诺弟兄会区会”，并整体挂靠作为北美门诺弟兄会总会的一个大区。", "1960年，巴西教会毅然跨越语言藩篱，放胆向讲葡萄牙语的巴西本土民众传福音并拓植教会，由此诞生了第二个本土教会联合会。随着南美大区职能的历史性淡化，以及巴西境内德语教会与葡语教会文化鸿沟的消弭，两派于1995年正式合二为一，组建了今天的 COBIM。", "该教会始终坚持活出整全的福音见证——关怀孤儿弃儿、扶助赤贫阶层、拯救吸毒成瘾者，创办高水准的中小学校，开展完备的教牧培训与野营营会。如今，COBIM 拥有80多间堂会、10,800名洗礼会友。近年来，领袖们厉行禁食祈祷与属灵复兴，催生了在巴西各新兴大区的爆发式植堂浪潮。COBIM 更主动差派跨文化宣教士前往安哥拉及非洲其他葡语国家宣教宣教。", "哥伦比亚门诺弟兄会教会联合会", "哥伦比亚是南美洲第一个迎来北美门诺宣教士的国家——早在1945年同工便深入乔科省（Chocó）印第安原住民部落开荒。此后，教会相继在卡利、麦德林和波哥大等核心都会扎根。反政府武装叛乱与贩毒集团肆虐带来的血腥暴力，反倒为教会播撒基督和平的福音开辟了宽阔通道。如今该联合会拥有44间堂会、2,500名会友，创办有一所高级中学与非正规教牧学院，长期与门诺会中央委员会（MCC）紧密合作开展社区重建。2020年，其专属宣教差会“我在这里”（Heme Aqui）正式获政府法人认可，并成功举办了联通哥伦比亚、乌拉圭、巴拉圭、巴西、巴拿马、墨西哥与秘鲁的跨国线上宣教峰会。", "墨西哥基督徒和平教会（ICPM）", "始于1950年代的宣教拓荒，截至2018年在3座城市拥有7间堂会、346名会友，2019年见证了31位信徒受洗。在科利马州阿尔瓦雷斯城，卡洛斯·奥尔特加牧师（Carlos Ortega）长期服侍少年犯及被贩毒集团收买充当职业杀手的边缘青少年。“他们大多是孤儿，自十二三岁起便被毒贩集团招募，试图在帮派中寻找失去的家庭归属感，”奥尔特加牧师通过足球运动与一对一门徒辅导舍命关怀他们。Multiply（全球宣教差会）在此设立的“马太培训中心”，为整个南美门诺弟兄会的年轻人提供门徒造就与宣教实战预备。", "巴拿马联合福音教会——门诺弟兄会", "独具特色：其麾下13间地方堂会、600名会友全部由乌瑙安族（Wounaán）和恩贝拉族（Emberá）印第安原住民构成！1950年代语言学家深入当地开展识字事工。差会从一开始便极力避免西方家长主义心态，深信原住民最适合在自己的同胞中结出果子，宣教士仅作为教练与顾问提供赋能。许多信徒是技艺精湛的手工艺大师，编织博物馆典藏级手工篮、雕刻珍贵玫瑰木与象牙果，成为教会自立的重要经济支柱。", "巴拉圭：双峰并立的门诺见证", "1930至1940年代逃离苏联的难民与早先来自加拿大的门诺人汇合，在巴拉圭开辟了五个德语聚落。巴拉圭教会积极向原住民和首都亚松森布道，最终形成了两大平行的门诺弟兄会总会：", "德语巴拉圭门诺弟兄会联合会：大力兴办中小学教育及“亚松森圣经学院”，该院已成为辐射整个南美洲的门诺神学重镇。其5所中学亦是极为锐利的植堂阵地，广播电视传媒事工深具影响力。尤为震撼的是其在亚松森最高戒备重犯监狱内部建立的“自由堂”（La Libertad）——外面的教会协助修缮监舍，为约500名重刑犯设立规范，并在高墙电网内建立起一间完全由服刑囚犯自主担任领袖、开展门训、敬拜、施洗与会友治理的“高墙内教会”！", "西语巴拉圭门诺弟兄会总会：2021年隆重庆祝建会50周年，拥有60多间堂会、3,766名会友（疫情前经常聚会者达7,500人），确立了在未来开拓50间新教会的雄心，已有14个新植堂点正在转为正式堂会。两大会议并肩携手，在巴拉圭全境为基督作无畏的见证。", "秘鲁门诺弟兄会总会始于1950年克里默门诺弟兄会（KMB）深入阿沙宁卡印第安部落的开拓；面对“光辉道路”游击队的残酷杀戮，外籍同工于1990年代撤离，本土教会自立挺立。1982年北部皮乌拉与苏拉纳特大洪灾中，Multiply（全球宣教差会）开展紧急救济，开启了沿海都会的植堂浪潮；2020年特鲁希略教会全面推行“培训与倍增”（Train & Multiply）门徒拓植体系。", "在乌拉圭，1948年10月22日在航行于大西洋的荷兰籍“沃尔伦丹号”（Volendam）客轮甲板上，18位逃亡的门诺难民创立了乌拉圭教会，如今拥有7间西语堂会；在委内瑞拉，加拿大卑诗省的华人门诺弟兄会于1991年差派宣教士进驻，植立了两间服侍华人移民的门诺弟兄会堂会；在阿根廷，亦有一间由巴拉圭门诺差传建立的堂会。"], "en_paras": ["The Mennonite Brethren national church in Brazil is referred to as COBIM: Convenção Brasileira das Igrejas Evangélicas Irmãos Menonitas (Brazilian Convention of Evangelical MB Churches). COBIM began as Mennonite Brethren migrated from Russia (Ukraine) to settle in virgin subtropical forests in 1930. Many more churches were established as Mennonite migration continued. In fact, similar migration into Paraguay led the Mennonite Brethren in both countries to form the South American MB Conference in 1948, which then in turn requested and became a district of the General Conference of the MB Church of North America. In 1960, the Brazil conference assertively engaged in reaching out to and planting churches among Portuguese- speaking Brazilians, ultimately forming a second association. Over time, the functionality of a South American district faded; and, within Brazil, the differences in language and culture between German and Portuguese churches waned. So in 1995, the two entities merged to form COBIM. The church has consistently offered holistic witness— serving orphans, people in need and individuals caught in the drug culture—by providing quality schools for children and youth, pastoral training, camps and more. Today, COBIM numbers more than 80 congregations and 10,800 members. In the last few years, leaders have committed to prayer, fasting and renewal. Rapid growth and visionary church planting in new regions of the country are the result. COBIM is also sending missionaries to Angola and other Portuguese-speaking countries in Africa. Colombia was the first South American country to receive a North American missionary—in 1945 among the indigenous Choco. Since then, churches have been established in Cali, Medellin and Bogota. In every area, the violent effects of numerous anti-government forces plus drug cartels have given the church opportunities to bring the gospel of peace. Today, Asociación de Iglesias Hermanos Menonitas de Colombia numbers 44 local congregations and 2,500 members. It has a high school, non-formal pastor training institutes and a legacy of working closely with Mennonite Central Committee to address many local needs. In 2020, the conference mission agency, Heme Aqui (Here I Am), was recognized by the government as a legal entity. That year they also hosted an online mission conference for pastors and mission leaders. A pre- conference online study was held in October followed by a three-day conference using YouTube and small group Zoom calls. Leaders from Colombia as well as Uruguay, Paraguay, Brazil, Panama, Mexico and Peru attended. “The congress is a first step in a strategy to mobilize the church toward fulfilling our mission,” says Jose Manual Prada Bernal. “With gratitude we can see ourselves in Latin America united in one desire: to understand and carry out the Great Commission of our Lord Jesus Christ.” In Mexico , mission work begun in the 1950s has produced Iglesia Cristiana de Paz en México, (Christian Peace Church in Mexico). As of 2018, ICPM is a family of 346 members in seven local congregations located in three cities. In 2019 they reported baptizing 31 individuals. Pastor Carlos Ortega, of Villa de Alvarez in Colima, works with juvenile offenders, including young people working for drug traffickers as hired killers. “Most are orphans who are recruited by the cartels at an early age (12 and older) to fill the void of not having a family,” he says. Ortega ministers through soccer and personal or group discipleship. Working with these young people is difficult, says Ortega since he and others volunteers do not see much outward change. The Matthew Training Center, operated by Multiply, serves young adults in discipleship and mission preparation through a non-formal program. Students also come from other Mennonite Brethren national churches in South America. Panama ’s Iglesia Evangélica Unida—Hermanos Menonitas (United Evangelical Church – MB) is unique: all its 600 members (in 13 local churches) are indigenous, coming from either the Wounaán or Emberá tribes. Literacy work began in the mid-1950s by visiting linguists. MB Mission (now Multiply) involvement centered on helping the indigenous people retain and enhance their culture and identity. Every attempt was made to limit paternalism—the missionaries’ approach was ahead of its time. From the beginning, they assumed the locals were best equipped to work among their own people, so missionaries came and went, focusing on coaching and consulting. Many members are artisans weaving museum- quality baskets and carving rosewood and tagua nuts for tourist trade and income for the church. In Paraguay , Mennonite refugees from Russia during the 1930s and 1940s joined earlier Mennonite immigrants from Canada to establish five German-speaking colonies. The Paraguayan MB church has been active in evangelism among indigenous tribes and in the capital city of Asunción. The result has been the formation of two MB groups—one using German and the other Spanish. The German Vereinigung der Mennoniten Brüder Gemeinden Paraguays (Association of Paraguayan MB Churches) has invested in primary and secondary schools and in higher education. Instituto Biblico Asunción is becoming a training center for Mennonite Brethren throughout South America. The five secondary schools are also church planting sites, since they reach out to non- Christian students and their parents. Media ministries in television and radio are also a major investment. Perhaps the most unique investment of resources is La Libertad, a church within the walls of a maximum-security prison in Asuncion. The “outside church” has renovated cell blocks, devised an admittance protocol for about 500 inmates and set up a fully functioning “inside church” with leadership (all inmates), discipleship, worship, baptism and membership. The Spanish Convención Hermanos Mennonitas die Paraguay (Mennonite Brethren Convention of Paraguay) celebrated its 50th anniversary in 2021. The conference has more than 60 churches and 3,766 members and reported total church attendance of 7,500 before the pandemic. Leaders have an assertive church planting vision and have set a goal of planting 50 new churches in response to God’s faithfulness during the past 50 years. At the time of their anniversary celebration, there were already 14 missionary points about to become churches, with people being baptized and involved in ministry. The conference also hopes to establish a Bible institute to train pastors. The Spanish language is predominant among the congregants of the two Paraguayan national churches. So, they work closely together to faithfully witness to Christ in Paraguay, though there is no plan to merge like the churches in Brazil. Conferencia Peruana Hermanos Menonitas, the MB church in Peru , began among Ashaninca Indians with Krimmer Mennonite Brethren workers in 1950. The Mennonite Brethren merged with KMB in 1960 and assumed responsibility. Because of Shining Path, a violent guerrilla group, foreign workers left in the 1990s, and the church assumed an independent identity. In late 1982, 2,500 mm of rain fell in five to six months, flooding the northern Peru coastal cities of Piura and Sullana. MB Mission (now Multiply) responded with emergency relief and subsequent to that, with a steady stream of mission workers to plant churches, including a missionary couple from Colombia. While the MB church admits to too much dependency on foreign support, it is gradually taking on complete responsibility. Periodic El Nino situations continue to cause much damage to churches and members’ homes, so that foreign aid is needed for recovery. The ICOMB family in various parts of the world participates in love through prayer and donations when this happens.", "In 2020, the Trujillo congregation initiated a practical leadership apprenticeship program called Train & Multiply. This new model includes beginning new house churches. The Uruguay MB church was founded by 18 Mennonite Brethren members aboard the Dutch ship Volendam on the Atlantic Ocean, October 22, 1948. They were part of a small wave of Mennonite refugees who settled in Uruguay. During the ensuing years, efforts to evangelize local Spanish people succeeded in establishing more churches. In 1979, the German conference officially ceased to exist and the Spanish conference (Consejo de las Congregaciones de los Hermanos Menonitas en Uruguay) took over. Today there are seven churches with around 200 members. Mennonite Brethren have congregations in two other South American countries. Venezuela has two Mennonite Brethren churches, planted in 1991 by Chinese Mennonite Brethren churches in British Columbia. They sent missionaries to Venezuela to establish a witness among Chinese immigrants. While the Venezuela churches have experienced limited growth, they are part of the family, as is the single Mennonite Brethren congregation in Argentina, planted by Paraguayan Mennonite Brethren mission efforts."]}, {"sub_zh": "北美洲：加拿大与美国", "sub_en": "North America: Canada and the United States", "zh_paras": ["北美门诺弟兄会于1879年召开了首届“门诺弟兄会总会”（General Conference）代表大会。1909年，划分为北部区（加拿大全境）与南部、中部、太平洋三大区（美国全境）。四区信徒携手同心，共同支持海外宣教、神学院、大学与圣经学校、布道奋兴、基督教教育及文字出版事工。", "1945年，因门诺移民潮而规模迅速超越美国三区总和的加拿大北部区，正式注册成立了加拿大门诺弟兄会总会（CCMBC）。1959年，美国各区会投票正式组建了美国门诺弟兄会总会（USMB）。", "这一崭新的双轨架构，将教会增长、福音布道、青年事工、基督教教育、资源管家以及文理大学等权责划归各自全国总会；而普世差传、信仰生活大政、神学院造就以及核心刊物出版等，则作为两国共同的事务，由双方派代表组建联合董事会共同运作。两国定期举行联合代表大会，商讨关乎共同前途的重大圣工。", "然而岁月流转，这一层床架屋的双重架构逐渐显得沉重繁琐。1999年，跨国北美总会正式表决解散；自此，美加两国总会作为独立的自治实体各自独立运转。两国总会如今在 ICOMB 均享有正式席位，并有权自主修订1999年北美总会通过的《信仰宣言》（例如 USMB 于2014年修订了第13条和平条款，而 CCMBC 于2021年审议了第8条洗礼条款）。二十多年来，两国总会均将布道植堂、门徒造就与领袖培育列为重中之重。", "加拿大门诺弟兄会总会（CCMBC）", "2017年拥有分布于7个省区会的250间堂会、50,000多名会友。20世纪波澜壮阔的移民潮重塑了加拿大教会的骨骼：1920年代从俄国逃入加拿大的20,000名门诺人，以及二战后涌入的7,000名新移民，为加拿大教会注入了源源不断的灵力与挑战。", "如果说移民塑造了20世纪的加拿大门诺弟兄会，那么加拿大更广泛的福音派阵营则深刻指引了其21世纪的国度异象。加拿大是一个幅员辽阔而人口相对稀疏的世俗化国度，这种国情促使各福音派教会之间选择携手同工而非彼此竞争。这一精神深切感染了门诺弟兄会。", "从“全国布道部”到后来的“关键城市倡议”，加拿大门诺弟兄会不断探索植堂模式。2011年，C2C Network 崛起成为其专属植堂先锋，并于2018年与 MB Mission 联合成立Multiply（全球宣教差会）。尽管该合并仅维持一年，植堂权责重新回归各省区会，但加拿大总会的国度使命始终坚如磐石。", "2011年全加审议确立了崭新的使命宣言：“倍增以基督为中心的教会，得见加拿大因耶稣基督的福音而经历全然更新转型”。2018年，CCMBC 进一步推出了以省区会为根基的“全新协同治理模式”（Collaborative Model），将奉献机制与核心决策权下沉赋予各省区会，全国总监则作为协同枢纽，代表加拿大门诺弟兄会走向 ICOMB 等普世团契，并肩奔赴神国的大使命！"], "en_paras": ["Mennonite Brethren in North America conducted their first convention as the General Conference of the Mennonite Brethren Church in 1879. In 1909, Mennonite Brethren were subdivbided into four district conferences: Northern (Canada) and Southern, Central and Pacific (U.S.) Congregations in these regions worked together to support foreign missions, a seminary, college and Bible schools, evangelism, Christian education and publication. (See chapter 8). In 1945, the Northern District, which had reached about the size of the other three combined because of Mennonite immigration to Canada, incorporated itself into what is now the Canadian Conference of MB Churches (CCMBC). In 1959, the districts in the U.S. voted to organize the U.S. Conference of MB Churches (USMB). This new structure made church growth and evangelism, youth work, Christian education concerns, stewardship and Bible and liberal arts colleges the responsibility of the national conferences. Foreign missions, faith and life matters, seminary training and resource publication became, for the most part, binational concerns, and boards to guide these ministries were formed with representatives from both Canada and the U.S. congregations sent delegates to regularly scheduled conventions to discuss and decide the future of their shared ministries. Eventually, some viewed this arrangement as cumbersome and suggested that one level of organization needed to be removed. So, in 1999, the binational General Conference dissolved, and since then, the two national conferences have functioned independently. Both conferences now have a seat at the ICOMB table and are free to adapt the Confession of Faith that was approved by General Conference delegates in 1999. In 2014, USMB revised Article 13 on peacemaking, and in 2021 CCMBC considered revisions to Article 8: Christian Baptism. For the past 20-plus years, both CCMBC and USMB have emphasized evangelism and church planting as well as discipleship and leadership development, although the methods of organizing their structures to meet these goals have changed—and continue to change.", "In 2017, CCMBC reported more than 50,000 members in 250 congregations in seven provincial conferences. The Canadian conference experienced growth in spurts during the 20th century because of waves of Mennonite immigration into Canada. Many Mennonite Brethren were among some 20,000 Mennonites from Russia who entered Canada in the 1920s. Another wave of some 7,000 Mennonites entered Canada after World War 2. Both times, Canadian MB churches were impacted, bringing both positive energy and challenges to the existing Canadian MB family. If immigration shaped CCMBC for much of the 20th century, the wider evangelical community of Canada strongly influenced its vision for the 21st century. Canada is a fundamentally secular country whose large size and small population have encouraged its evangelical churches to cooperate rather than compete. This cooperation rubbed off on Mennonite Brethren in the areas of evangelism and church planting. Several church planting and church health initiatives have characterized CCMBC mission practice in the past decades. The Board of Evangelism and then Evangelism Canada, including the Key Cities Initiative, provided leadership. Until 2010, each provincial conference had its own board to oversee church planting efforts in that region. Then in 2011, C2C Network became the Canadian conference church-planting arm. In 2018, C2C merged with MB Mission, the North American MB mission agency. That merger lasted one year, and currently church planting is again the responsibility of provincial conferences. CCMBC conducted a national review in 2011 that led to a revised mission statement—“to multiply Christ- centered churches to see Canada transformed by the good news of Jesus Christ”—and a ministry model that emphasized partnerships with the provincial conferences in order to serve in four areas: building community, resourcing ministry, developing leaders and multiplying churches. In 2018, CCMBC proposed a new Collaborative Model to assist the conference to better achieve its mission to serve churches and transform Canada. This new model combines church giving to the provincial and national conferences and moves decision-making to the provincial conferences. A national director helps to facilitate collaboration between provincial and national conferences and to represent Canada to international groups such as the International Community of Mennonite Brethren."]}]}, {"num": 13, "id": "chap-11", "badge_label": "CHAPTER 13", "title_zh": "第十一章：门诺会各支派间的合作纽带", "title_en": "Chapter 11: Inter-Mennonite Connections", "desc": "携手服事众人；
